name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Mod (Akasha Quests UI)
    runs-on: ubuntu-latest
    permissions:
      contents: write # release on v* tags
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4

      # 8 compiles the mod (Jabel, Java 8 bytecode), 17 runs the Minecraft tooling, 25 runs the Gradle daemon
      # (gradle/gradle-daemon-jvm.properties). Gradle finds all three through the JAVA_HOME_* variables.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25

      - uses: gradle/actions/setup-gradle@v4

      # build = compile + spotlessCheck + unit tests + reobfuscated jar
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Locate release jar
        id: jar
        run: |
          jar=$(find build/libs -maxdepth 1 -name 'akashaquestui-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jar"
          echo "path=mod/$jar" >> "$GITHUB_OUTPUT"

      # archive: false uploads the jar itself (no zip); the file name becomes the artifact name
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jar.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}

  quests:
    name: Quest book (bqgen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # --strict validates every item id against the registry dump in registry/
      - name: Build quest book
        run: python3 tools/bqgen/bqgen.py build --strict

      - name: dist/ must match the quest sources
        run: |
          # porcelain also lists new and deleted files, which git diff would miss
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist | head -n 50
            echo "::error::dist/ is out of date: run 'python3 tools/bqgen/bqgen.py build' and commit the result"
            exit 1
          fi
