    type: info
    deps: [catalogo_abertura]
    icon: appliedenergistics2:item.ItemMultiMaterial:47
    desc: |
      A palavra "singularidade" aparece em outros mods: no AE2 (a §eSingularidade§r e a
      §eSingularidade Quanticamente Entrelaçada§r, usadas em Pares Quânticos e Células) e no
      MagicBees (a §eSingularidade Dimensional§r). Elas não entram no Catalisador, mas são
      parentes.
    tasks:
