chapter:
  id: singularidades
  title: "Epílogo: Singularidades Eternas"
  prefix: ""
  order: 995
  icon: eternalsingularity:eternal_singularity
  desc: |
    §5O Catálogo do Ponto.§r Um bloco de metal comprimido num ponto, e outro, e mais outro, até
    que as singularidades do Avaritia e do Industrial Upgrade se reúnam numa só: a
    Singularidade Eterna. (Avaritia, Industrial Upgrade, Eternal Singularity)

quests:
  # ======================================================================
  # PRÓLOGO — O PONTO
  # ======================================================================
  - id: catalogo_abertura
    title: "O Catálogo"
    type: main
    deps: [avaritia:compressor_neutronio]
    icon: eternalsingularity:eternal_singularity
    desc: |
      Aqui, Herói, ficam as §eSingularidades§r: o resultado de espremer um bloco de metal no
      Compressor de Neutrônio até virar um ponto. Cada uma guarda um metal inteiro, e juntas
      elas formam a Singularidade Eterna, parte do Catalisador do Infinito.

      Este capítulo é o catálogo: uma quest por singularidade, com o bloco que a gera.
    tasks:
      - check
    rewards:
      - xp: 6
      - loot: raro

  - id: info_custos
    title: "O Preço do Ponto"
    type: info
    deps: [catalogo_abertura]
    icon: Avaritia:Neutronium_Compressor
    desc: |
      Cada singularidade cobra centenas de blocos de metal e vai ao Compressor de Neutrônio por
      um bom tempo. O NEI (handler "Neutronium Compressor") mostra a entrada de cada uma.

      Reserve armazenamento: o ME do AE2 é perfeito para guardar todos esses blocos. E planeje
      fazendas de cada metal em paralelo.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: info_celula_singularidade
    title: "Guardando as Singularidades"
    type: info
    deps: [catalogo_abertura]
    icon: appliedenergistics2:item.ItemExtremeStorageCell.Singularity
    desc: |
      O AE2 Extreme tem uma §eCélula de Armazenamento Digital de Singularidade§r e outras que
      guardam muita coisa. Sem uma rede ME decente, o espaço vai acabar antes das
      singularidades. Pense em baús do Infinito para o que sobrar.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: ordem_recomendada
    title: "Por Onde Começar"
    type: info
    deps: [catalogo_abertura]
    icon: Avaritia:Singularity
    desc: |
      Comece pelas mais baratas (Ferro, Ouro, Lápis, Redstone, Quartzo), porque você já tem
      quantidade dos blocos. Depois passe para os metais do Thermal (Cobre, Estanho, Chumbo,
      Prata, Níquel, Endério). A Argila é a mais curiosa e a menos importante.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: blocos_vanilla
    title: "Blocos Vanilla"
    type: normal
    deps: [ordem_recomendada]
    icon: minecraft:iron_block
    desc: |
      Ferro, ouro, lápis-lazúli, redstone e quartzo: cinco tipos de bloco vanilla viram cinco
      singularidades. Junte um estoque de cada (centenas de blocos no total, confira no NEI) e
      deixe o Compressor trabalhar.
    tasks:
      - get: [minecraft:iron_block, minecraft:gold_block, minecraft:lapis_block, minecraft:redstone_block, minecraft:quartz_block]
    rewards:
      - xp: 6
      - item: minecraft:iron_block x8

  - id: blocos_thermal
    title: "Blocos de Metal do Thermal"
    type: normal
    deps: [ordem_recomendada, thermal:mestre_termico]
    icon: ThermalFoundation:Storage
    desc: |
      Cobre, estanho, prata, chumbo, níquel e Endério têm blocos no Thermal Foundation (alguns
      também no Immersive Engineering e no Tinkers' Construct; qualquer um vale). Um estoque de
      cada.
    tasks:
      - get: [ThermalFoundation:Storage, ThermalFoundation:Storage:1, ThermalFoundation:Storage:2, ThermalFoundation:Storage:3, ThermalFoundation:Storage:4, ThermalFoundation:Storage:12]
    rewards:
      - xp: 8
      - item: minecraft:iron_block x8

  # ======================================================================
  # FASE 1 — AS DO AVARITIA
  # ======================================================================
  - id: sing_ferro
    title: "Singularidade de Ferro"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_vanilla]
    icon: Avaritia:Singularity
    desc: |
      A primeira, a mais humilde: um §eBloco de Ferro§r comprimido no Compressor de Neutrônio.
      Se você chegou aqui, já deve ter dezenas de blocos de ferro de sobra.
    tasks:
      - get: Avaritia:Singularity
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_ouro
    title: "Singularidade de Ouro"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_vanilla]
    icon: Avaritia:Singularity:1
    desc: |
      Um §eBloco de Ouro§r no Compressor de Neutrônio vira uma Singularidade de Ouro. Ouro das
      fazendas de porcos-zumbis do Nether rende bastante, e o Thermal tem fundição para
      multiplicar.

      Confira no NEI quantos blocos a máquina pede.
    tasks:
      - get: Avaritia:Singularity:1
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_lapis
    title: "Singularidade de Lápis-Lazúli"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_vanilla]
    icon: Avaritia:Singularity:2
    desc: |
      Um §eBloco de Lápis-Lazúli§r no Compressor vira esta singularidade. Mineração e troca com
      aldeões rendem lápis em quantidade; a Dimensão de Mineração tem camadas de minérios
      vanilla.

      Confira o custo exato no NEI, handler "Neutronium Compressor".
    tasks:
      - get: Avaritia:Singularity:2
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_redstone
    title: "Singularidade de Redstone"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_vanilla]
    icon: Avaritia:Singularity:3
    desc: |
      Um §eBloco de Redstone§r no Compressor vira a Singularidade de Redstone. Essa também é
      usada na Mesa Extrema Automática do Avaritia Addons, então faça uma de sobra.

      Uma fazenda de bruxas resolve a redstone sem sofrimento.
    tasks:
      - get: Avaritia:Singularity:3
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_quartzo
    title: "Singularidade de Quartzo"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_vanilla]
    icon: Avaritia:Singularity:4
    desc: |
      Um §eBloco de Quartzo§r do Nether no Compressor vira a Singularidade de Quartzo. O Nether
      tem de sobra: minere o minério de quartzo ou use o quebrador do Thermal.

      Veja o custo em blocos no NEI.
    tasks:
      - get: Avaritia:Singularity:4
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_cobre
    title: "Singularidade de Cobre"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_thermal]
    icon: Avaritia:Singularity:5
    desc: |
      Cobre: um §eBloco de Cobre§r (Thermal Foundation ou Immersive Engineering, qualquer um
      vale). Use o que já tiver na sua fábrica; o cobre é um dos metais mais fáceis de acumular.

      Veja o custo exato no NEI, handler "Neutronium Compressor".
    tasks:
      - get: Avaritia:Singularity:5
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_estanho
    title: "Singularidade de Estanho"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_thermal]
    icon: Avaritia:Singularity:6
    desc: |
      Estanho: um §eBloco de Estanho§r (Thermal Foundation ou Tinkers' Construct, o Compressor
      aceita qualquer um). Funda o minério na Smeltery ou use o Pulverizador do Thermal.

      A entrada exata e o custo estão no NEI, handler "Neutronium Compressor".
    tasks:
      - get: Avaritia:Singularity:6
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_chumbo
    title: "Singularidade de Chumbo"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_thermal]
    icon: Avaritia:Singularity:7
    desc: |
      Chumbo: um §eBloco de Chumbo§r (Thermal Foundation ou Immersive Engineering, qualquer um
      vale). O chumbo é comum nas camadas médias do mundo e rende bem com o Pulverizador.

      Veja o custo exato no NEI, handler "Neutronium Compressor".
    tasks:
      - get: Avaritia:Singularity:7
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_prata
    title: "Singularidade de Prata"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_thermal]
    icon: Avaritia:Singularity:8
    desc: |
      Prata: um §eBloco de Prata§r (Thermal Foundation ou Immersive Engineering). A prata
      aparece em veios fundos; a Fundição Induzida do Thermal dobra o rendimento do minério.

      Veja o custo exato no NEI, handler "Neutronium Compressor".
    tasks:
      - get: Avaritia:Singularity:8
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_niquel
    title: "Singularidade de Níquel"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_thermal]
    icon: Avaritia:Singularity:9
    desc: |
      Níquel: um §eBloco de Níquel§r (Thermal Foundation ou Immersive Engineering). O níquel vem
      de veios fundos e é metade do Invar; a Smeltery ou o Pulverizador rendem bem.

      Veja o custo exato no NEI, handler "Neutronium Compressor".
    tasks:
      - get: Avaritia:Singularity:9
    rewards:
      - xp: 8
      - loot: incomum

  - id: sing_enderio
    title: "Singularidade de Endério"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_thermal]
    icon: Avaritia:Singularity:10
    desc: |
      Endério: um §eBloco de Endério§r do Thermal Foundation. Essa singularidade já usa o metal
      que você domina desde a Estrela ATM; se tiver fazenda de platina, chumbo e pérolas, é só
      repetir.

      Veja o custo exato no NEI, handler "Neutronium Compressor".
    tasks:
      - get: Avaritia:Singularity:10
    rewards:
      - xp: 10
      - loot: raro

  - id: sing_argila
    title: "Singularidade de Argila"
    type: normal
    deps: [catalogo_abertura, avaritia:compressor_neutronio, blocos_thermal]
    icon: Avaritia:Singularity:11
    desc: |
      Argila: uma curiosidade fora da Singularidade Eterna, mas parte da família de doze. A
      entrada do Compressor está no NEI (handler "Neutronium Compressor").

      Pode fazer por último, só para completar o Catálogo.
    tasks:
      - get: Avaritia:Singularity:11
    rewards:
      - xp: 6
      - loot: comum

  - id: sing_avaritia_12
    title: "As Doze do Avaritia"
    type: milestone
    deps: [sing_ferro, sing_ouro, sing_lapis, sing_redstone, sing_quartzo, sing_cobre, sing_estanho, sing_chumbo, sing_prata, sing_niquel, sing_enderio, sing_argila]
    icon: Avaritia:Singularity
    banner: "As Doze"
    subtitle: "Um ponto para cada metal"
    desc: |
      As doze singularidades do Avaritia, uma de cada. Herói, o Catálogo está quase inteiro.
      Falta só juntar onze delas (a Argila fica de fora) na Singularidade Eterna, no próximo
      degrau.

      Guarde todas na rede ME, ou numa Célula de Singularidade, até lá.
    tasks:
      - get: [Avaritia:Singularity, Avaritia:Singularity:1, Avaritia:Singularity:2, Avaritia:Singularity:3, Avaritia:Singularity:4, Avaritia:Singularity:5, Avaritia:Singularity:6, Avaritia:Singularity:7, Avaritia:Singularity:8, Avaritia:Singularity:9, Avaritia:Singularity:10, Avaritia:Singularity:11]
    rewards:
      - xp: 30
      - loot: epico

  # ======================================================================
  # FASE 2 — A SINGULARIDADE ETERNA
  # ======================================================================
  - id: eternal_singularity
    title: "Singularidade Eterna"
    type: milestone
    deps: [sing_avaritia_12]
    icon: eternalsingularity:eternal_singularity
    banner: "A Singularidade Eterna"
    subtitle: "Onze metais, um ponto"
    desc: |
      Onze singularidades do Avaritia (Ferro, Ouro, Lápis, Redstone, Quartzo, Cobre, Estanho,
      Chumbo, Prata, Níquel e Endério), sem forma, na Mesa Extrema: a §eSingularidade Eterna§r.

      A Argila fica de fora. Esta é a peça central do Catalisador do Infinito.
    tasks:
      - get: eternalsingularity:eternal_singularity
    rewards:
      - xp: 40
      - kit: {name: "Kit do Eterno", items: [Avaritia:Resource:1 x8, minecraft:nether_star x2]}
      - loot: lendario

  - id: blocos_iu
    title: "Blocos de Metal do IU"
    type: normal
    deps: [info_custos, eternal_singularity]
    icon: industrialupgrade:IUBlock
    desc: |
      Os blocos dos metais do Industrial Upgrade (Michalov, Vanádio, Titânio, Cromo, Espinélio,
      Caravky, Manganês, Irídio, Germânio e outros) geram as singularidades do IU. Quase todos
      vêm das cadeias do Volume do Industrial Upgrade que você já fez.
    tasks:
      - get: [industrialupgrade:IUBlock, industrialupgrade:IUBlock:2, industrialupgrade:IUBlock:10, industrialupgrade:IUBlock:12, industrialupgrade:baseblock1:1]
    rewards:
      - xp: 8
      - item: minecraft:iron_block x8

  # ======================================================================
  # FASE 3 — AS DO INDUSTRIAL UPGRADE
  # ======================================================================
  - id: info_iu
    title: "Singularidades do IU"
    type: info
    deps: [catalogo_abertura, iu_endgame:singularidade_iu]
    icon: industrialupgrade:avaritia_iu_singularity
    desc: |
      O Industrial Upgrade tem as suas próprias singularidades: dezessete tipos, de Michalov a
      Germânio, geradas no mesmo Compressor de Neutrônio a partir de blocos dos metais do IU. O
      Catalisador do Infinito usa 16 delas.

      Cada uma tem uma quest abaixo. Os blocos de entrada estão no NEI.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: iu_michalov
    title: "Singularidade de Michalov"
    type: normal
    deps: [info_iu, blocos_iu, avaritia:compressor_neutronio]
    icon: industrialupgrade:avaritia_iu_singularity
    desc: |
      Singularidade de Michalov sai do Compressor de Neutrônio: um §eBloco de Michalov§r vira
      esta singularidade. Confira o bloco exato no NEI, handler "Neutronium Compressor".
    tasks:
