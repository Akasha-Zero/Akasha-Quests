      - get: industrialupgrade:avaritia_iu_singularity:15
    rewards:
      - xp: 10
      - loot: raro

  - id: iu_germanio
    title: "Singularidade de Germânio"
    type: normal
    deps: [info_iu, blocos_iu, avaritia:compressor_neutronio]
    icon: industrialupgrade:avaritia_iu_singularity:16
    desc: |
      Singularidade de Germânio sai do Compressor de Neutrônio: um §eBloco de Germânio§r vira
      esta singularidade. Confira o bloco exato no NEI, handler "Neutronium Compressor".
    tasks:
      - get: industrialupgrade:avaritia_iu_singularity:16
    rewards:
      - xp: 10
      - loot: raro

  - id: iu_conjunto
    title: "O Conjunto do IU"
    type: milestone
    deps: [iu_michalov, iu_aluminio, iu_vanadio, iu_tungstenio, iu_cobalto, iu_magnesio, iu_platina, iu_titanio, iu_espinelio, iu_zinco, iu_manganes, iu_invar, iu_caravky, iu_electrum, iu_iridio, iu_germanio]
    icon: industrialupgrade:avaritia_iu_singularity
    banner: "O Conjunto do IU"
    subtitle: "Dezesseis pontos de metal"
    desc: |
      As dezesseis singularidades do IU que o Catalisador do Infinito pede (a de Cromo, segundo
      o NEI, não entra na receita; a de Espinélio aparece duas vezes). Junte tudo.
    tasks:
      - get: [industrialupgrade:avaritia_iu_singularity, industrialupgrade:avaritia_iu_singularity:1, industrialupgrade:avaritia_iu_singularity:2, industrialupgrade:avaritia_iu_singularity:3, industrialupgrade:avaritia_iu_singularity:4, industrialupgrade:avaritia_iu_singularity:5, industrialupgrade:avaritia_iu_singularity:6, industrialupgrade:avaritia_iu_singularity:7, industrialupgrade:avaritia_iu_singularity:9, industrialupgrade:avaritia_iu_singularity:10, industrialupgrade:avaritia_iu_singularity:11, industrialupgrade:avaritia_iu_singularity:12, industrialupgrade:avaritia_iu_singularity:13, industrialupgrade:avaritia_iu_singularity:14, industrialupgrade:avaritia_iu_singularity:15, industrialupgrade:avaritia_iu_singularity:16]
    rewards:
      - xp: 40
      - loot: lendario

  - id: blocos_extraplanets
    title: "Blocos de Metal de ExtraPlanets"
    type: optional
    deps: [info_iu]
    icon: ExtraPlanets:tile.pluto:7
    desc: |
      Alguns blocos de metal do IU têm um equivalente em ExtraPlanets (Tungstênio de Plutão,
      Magnésio de Saturno, Zinco de Netuno, Platina de Kepler 22b). O Compressor aceita qualquer
      um dos dois. Se você já explorou aqueles mundos, aproveite.
    tasks:
      - one_of: [ExtraPlanets:tile.pluto:7, ExtraPlanets:tile.saturn:7, ExtraPlanets:tile.neptune:7, ExtraPlanets:tile.kepler22b:14]
    rewards:
      - xp: 6
      - loot: incomum

  - id: reserva_me
    title: "Reserva na Rede ME"
    type: info
    deps: [info_custos]
    icon: appliedenergistics2:tile.BlockController
    desc: |
      Cada singularidade custa centenas de blocos. Dedique à rede ME um armazenamento só para o
      Catálogo, com células grandes para blocos de metal e outra para as singularidades prontas.
      Trabalhar sem rede aqui vai te custar muito tempo.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: automatizar_compressor
    title: "Automatizando o Compressor"
    type: info
    deps: [info_custos]
    icon: Avaritia:Neutronium_Compressor
    desc: |
      O Compressor aceita automação por funis e interfaces. Coloque uma interface do AE2
      apontando para ele, escreva um padrão para cada singularidade, e deixe a rede alimentar
      tudo. É mais simples do que parece.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: reflexao_ponto
    title: "Por que Tantos Pontos?"
    type: info
    deps: [sing_avaritia_12]
    icon: eternalsingularity:eternal_singularity
    desc: |
      Pode parecer exagero coletar uma de cada. Mas cada singularidade é a memória de um metal
      inteiro, e a Eterna é o registro de todos eles juntos. Em termos de Akasha: é o índice do
      Registro, escrito em pontos.
    tasks:
      - check
    rewards:
      - xp: 3

  # ======================================================================
  # FASE 4 — OUTRAS SINGULARIDADES
  # ======================================================================
  - id: outras_info
    title: "Singularidades de Outros Mods"
    type: info
    deps: [catalogo_abertura]
    icon: appliedenergistics2:item.ItemMultiMaterial:47
    desc: |
      A palavra "singularidade" aparece em outros mods: no AE2 (a §eSingularidade§r e a
      §eSingularidade Quanticamente Entrelaçada§r, usadas em Pares Quânticos e Células) e no
      MagicBees (a §eSingularidade Dimensional§r). Elas não entram no Catalisador, mas são
      parentes.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: ae2_singularidade
    title: "Singularidade do AE2"
    type: optional
    deps: [outras_info]
    icon: appliedenergistics2:item.ItemMultiMaterial:47
    desc: |
      A §eSingularidade§r do AE2 é ingrediente de Pares Quânticos e de células enormes. Confira
      no NEI como obtê-la no seu perfil de mods; ela não entra no Catalisador, mas é parente das
      singularidades do Compressor.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:47
    rewards:
      - xp: 8
      - loot: raro

  - id: ae2_emaranhada
    title: "Singularidade Emaranhada"
    type: optional
    deps: [ae2_singularidade]
    icon: appliedenergistics2:item.ItemMultiMaterial:48
    desc: |
      A §eSingularidade Quanticamente Entrelaçada§r é a base do Quantum Link do AE2: duas
      singularidades emparelhadas conversam à distância. Confira o NEI para ver como obtê-las.

      Não entra no Catalisador, é só um complemento do Catálogo.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:48
    rewards:
      - xp: 10
      - loot: raro

  - id: magicbees_dimensional
    title: "Singularidade Dimensional"
    type: optional
    deps: [outras_info]
    icon: MagicBees:miscResources:17
    desc: |
      A §eSingularidade Dimensional§r do MagicBees. A receita na bancada usa quartzo, ouro, olho
      do Ender e pedra do End; no NEI do Thaumcraft há uma outra, por infusão.
    tasks:
      - get: MagicBees:miscResources:17
    rewards:
      - xp: 8
      - loot: raro

  - id: celula_singularidade
    title: "Célula de Singularidade"
    type: optional
    deps: [outras_info]
    icon: appliedenergistics2:item.ItemExtremeStorageCell.Singularity
    desc: |
      A §eCélula de Armazenamento Digital de Singularidade§r do AE2 Extreme. Para as
      singularidades do Compressor e os blocos de metal do Catálogo, é a célula perfeita.

      Veja a receita no NEI e monte com sua rede ME.
    tasks:
      - get: appliedenergistics2:item.ItemExtremeStorageCell.Singularity
    rewards:
      - xp: 12
      - loot: epico

  # ======================================================================
  # FINAL — O ETERNO
  # ======================================================================
  - id: sing_mestre
    title: "Mestre das Singularidades"
    type: finale
    deps: [eternal_singularity, iu_conjunto]
    icon: eternalsingularity:eternal_singularity
    effect: 6
    banner: "Singularidades Eternas"
    subtitle: "Todos os pontos do Registro"
    desc: |
      A Singularidade Eterna e o conjunto do IU. Você coletou todos os pontos do Catálogo,
      Herói. Guarde-os com respeito: são a coisa mais próxima que o Registro tem de um começo.

      Leve tudo ao capítulo do Infinito e escreva a última página.
    tasks:
      - check
    rewards:
      - xp: 80
      - loot: lendario x2

