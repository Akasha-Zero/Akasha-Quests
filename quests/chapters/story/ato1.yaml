      Thaumcraft deu a base de pesquisa, Botania a flor, Blood Magic o preço, Ars Magica a gramática. O aprendiz já é um mago pequeno. Reconheço que meus primeiros passos foram firmes. Marque a caixa quando fechar o ciclo de aprendiz.
