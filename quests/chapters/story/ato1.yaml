    type: portal
    deps: [prontos_volumes, vanilla:limiar_do_fim]
    at: [6, 21]
    icon: minecraft:ender_eye
    desc: |
      Em algum lugar sob uma fortaleza antiga existe uma moldura de portal com olhos de ender, e do outro lado dela está um céu escuro onde um dragão guarda o que sobrou do fim. Ainda é cedo para entrar, mas é bom saber onde fica.

      Olho de ender, fortaleza, localização anotada. Reconheço que já vi o portal. Marque a caixa e siga, que o Ato II chama.
    tasks:
