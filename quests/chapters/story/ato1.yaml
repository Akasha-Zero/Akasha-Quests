  - id: fim_ato1
    title: "Raízes Fundas"
    type: finale
    deps: [limiar, tinkers:viajante_completo]
    at: [7, 21]
    icon: minecraft:sapling
    banner: "Raízes Fundas"
    desc: |
      Herói, olhe para trás: fazenda, fundição, redstone, Nether, poções, as primeiras máquinas, as primeiras magias. Cada uma dessas coisas é uma página que voltou a existir porque você teve paciência, e eu tenho orgulho disso.

      As raízes estão fundas o bastante para sustentar uma árvore inteira. No Ato II, as engrenagens começam a girar e os encantos ficam mais fortes. Marque a caixa e vamos juntos.
