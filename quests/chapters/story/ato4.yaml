chapter:
  id: ato4
  title: "Crônicas Akáshicas: Ato IV — Os Oito Selos"
  color: "§6"
  order: 4
  icon: minecraft:nether_star
  desc: |
    Oito Selos mantêm a Fratura aberta.
    Restaure um por um, na ordem que quiser.

quests:

  - id: selos_abertura
    title: "Os Oito Selos"
    type: main
    deps: [ato3:tres_chaves]
    at: [0, 0]
    icon: minecraft:nether_star
    desc: |
      Herói, com as três Chaves na mão, o Registro finalmente mostra a sua tranca. São §eoito Selos§r, oito lacres que mantêm fechada a rachadura da Fratura. Cada um guarda um tipo de maestria: os três reinos, o Abismo, as Estrelas, o Arcano, a Engrenagem e a Vida.

      Você pode restaurá-los em qualquer ordem, e é isso que torna o Ato IV a parte mais livre da campanha. Cada Selo se acende quando você cumpre marcos reais dos Volumes, e o mapa mostra tudo logo abaixo. Quando os oito brilharem, as dimensões ATM abrem. Marque a caixa e escolha por onde começar.
    tasks:
      - check
    rewards:
      - xp: 20
      - loot: incomum

  - id: crepusculo_intro
    title: "Primeiro Selo: o Crepúsculo"
    type: info
    deps: [selos_abertura]
    at: [1, 0]
    icon: minecraft:sapling
    desc: |
      O Selo do Crepúsculo é o mais fácil de explicar: ele exige que você tenha vencido o Reino por inteiro, não só os chefes mais famosos. A Chave que você carrega prova que fez o essencial, mas o Selo quer ver o caminho completo.

      Revisite o Lich, a Rainha da Neve e as Terras Altas, e confirme que sua sala de troféus está em ordem. Os Lich eram meus colegas arquivistas, e eu gosto de pensar que eles perdoam quem termina o que eles não conseguiram. Marque a caixa para começar.
    tasks:
      - check
    rewards:
      - xp: 10

  - id: crep_lich
    title: "O Arquivista, de Novo"
    type: normal
    deps: [crepusculo_intro, twilight:lich]
    at: [2, 0]
    icon: minecraft:ender_pearl
    desc: |
      Lembra do Lich? O primeiro Selo começa com ele, porque foi ele quem tentou guardar as páginas do tempo e se perdeu. O marco de derrota dele é a prova de que a corrupção do Crepúsculo foi contida.

      Se você já o venceu, parabéns, só falta marcar. Se não, o Reino te espera com a torre, o cetro e os clones. Marque a caixa quando o Lich estiver mesmo vencido.
    tasks:
      - check
    rewards:
      - loot: incomum
      - xp: 30

  - link: twilight:lich
    at: [2, 1]

  - id: crep_neve
    title: "A Rainha, de Novo"
    type: normal
    deps: [crep_lich, twilight:rainha_neve]
    at: [3, 0]
    icon: minecraft:ice
    desc: |
      A Rainha da Neve fechou o ciclo do frio. Sem a derrota dela, o Selo continuaria meio aberto, porque o gelo é a camada que segura tudo o que o Crepúsculo escondeu.

      Reconheço que o frio já não me impede. Marque a caixa quando a Rainha estiver derrotada e o castelo em silêncio.
    tasks:
      - check
    rewards:
      - loot: incomum
      - xp: 30

  - link: twilight:rainha_neve
    at: [3, 1]

  - id: crep_altas
    title: "Terras Altas"
    type: normal
    deps: [crep_neve, twilight:senhor_terras_altas]
    at: [4, 0]
    icon: minecraft:diamond
    desc: |
      O fim do Reino é um pico, e o pico é um espelho. Quem sobe até lá vê o que o Crepúsculo foi um dia e o que ainda poderia ser.

      Suba preparado, desça mais sábio. Marque a caixa quando tiver estado no alto e voltado inteiro.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 40

  - link: twilight:senhor_terras_altas
    at: [4, 1]

  - id: selo_crepusculo
    title: "O Selo do Crepúsculo"
    type: milestone
    deps: [crep_altas, twilight:chave_crepusculo, twilight:sala_trofeus]
    at: [5, 0]
    icon: minecraft:nether_star
    desc: |
      O primeiro Selo acende com um brilho violeta, quase uma lamparina no fundo da floresta. Chave na mão, troféus na parede, chefes caídos: o Reino do Crepúsculo foi lido do começo ao fim, e a corrupção dos Lich perdeu mais um pedaço do seu poder.

      Eu fico olhando a luz subir pelas páginas e penso nos arquivistas que não conseguiram ver isso. Obrigada, Herói, por terminar o que eles não puderam. Marque a caixa e siga para o próximo.
    tasks:
      - check
    rewards:
      - kit: {name: "Kit do Selo", items: [minecraft:diamond x8, minecraft:emerald x8, minecraft:experience_bottle x32]}
      - loot: epico
      - xp: 75

  - link: twilight:chave_crepusculo
    at: [5, 1]

  - link: twilight:sala_trofeus
    at: [5, 2]

  - id: ceus_intro
    title: "Segundo Selo: os Céus"
    type: info
    deps: [selos_abertura]
    at: [6, 0]
    icon: minecraft:feather
    desc: |
      O Selo dos Céus é o mais leve, e talvez o mais bonito. Exige que você prove que honrou as Valquírias, liberou as páginas do alto e entendeu o que cada masmorra tentava ensinar.

      As ilhas flutuantes não se esquecem de quem as visitou. Se você já tem a Chave dos Céus, o resto é confirmação. Marque a caixa para começar.
    tasks:
      - check
    rewards:
      - xp: 10

  - id: ceus_valquiria
    title: "A Rainha, a Honra"
    type: normal
    deps: [ceus_intro, aether:rainha_valquiria]
    at: [7, 0]
    icon: minecraft:golden_sword
    desc: |
      A Rainha Valquíria é o centro moral dos Céus. Vencê-la com honra, e não com truque, é o que o Selo pede: respeito pelo que ela protegia.

      Confirme o marco. Marque a caixa quando a Rainha estiver derrotada.
    tasks:
      - check
    rewards:
      - loot: incomum
      - xp: 30

  - link: aether:rainha_valquiria
    at: [7, 1]

  - id: ceus_sol
    title: "O Sol, Apagado"
    type: normal
    deps: [ceus_valquiria, aether:espirito_sol]
    at: [8, 0]
    icon: minecraft:blaze_powder
    desc: |
      O Espírito do Sol mantinha as Valquírias como reféns, e a queda dele devolve o céu ao seu ritmo. É o chefe mais difícil do Aether.

      Confirme o marco. Marque a caixa quando a luz dele se apagar.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 40

  - link: aether:espirito_sol
    at: [8, 1]

  - id: ceus_masmorras
    title: "As Três Masmorras"
    type: normal
    deps: [ceus_sol, aether:tres_masmorras]
    at: [9, 0]
    icon: minecraft:chest
    desc: |
      Bronze, prata e ouro: cada masmorra ensinou uma lição. O Selo quer saber se você aprendeu as três.

      Confirme o marco. Marque a caixa quando as três estiverem concluídas.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 40

  - link: aether:tres_masmorras
    at: [9, 1]

  - id: selo_ceus
    title: "O Selo dos Céus"
    type: milestone
    deps: [ceus_masmorras, aether:chave_ceus]
    at: [10, 0]
    icon: minecraft:nether_star
    desc: |
      O segundo Selo sobe como uma pena branca e se prende no teto do Registro. As Valquírias, livres, voam em círculos ao redor dele, e eu juro que ouço um canto.

      Vencer o Aether por inteiro não é só uma façanha, é uma restauração. Cada ilha tem um passado que você ajudou a lembrar. Marque a caixa e vamos para o terceiro.
    tasks:
      - check
    rewards:
      - kit: {name: "Kit do Selo", items: [minecraft:diamond x8, minecraft:emerald x8, minecraft:experience_bottle x32]}
      - loot: epico
      - xp: 75

  - link: aether:chave_ceus
    at: [10, 1]

  - id: areias_intro
    title: "Terceiro Selo: as Areias"
    type: info
    deps: [selos_abertura]
    at: [11, 0]
    icon: minecraft:sand
    desc: |
      O Selo das Areias é o mais antigo. Atum guardou o Livro dos Mortos, e o Faraó, o último a falar sobre o que acontece com tudo o que acaba, caiu diante de você.

      Confirme os marcos e deixe os deuses descansarem. Marque a caixa para começar.
    tasks:
      - check
    rewards:
      - xp: 10

  - id: areias_farao
    title: "O Faraó, Silenciado"
    type: normal
    deps: [areias_intro, atum:farao]
    at: [0, 7]
    icon: minecraft:gold_block
    desc: |
      O Faraó caiu, mas o desafio dele ainda ecoa nas pirâmides. O marco prova que a guarda do Livro dos Mortos foi vencida.

      Confirme o marco. Marque a caixa quando o Faraó estiver derrotado.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 40

  - link: atum:farao
    at: [0, 8]

  - id: areias_panteao
    title: "O Panteão Visitado"
    type: normal
    deps: [areias_farao, atum:panteao]
    at: [1, 7]
    icon: minecraft:ender_eye
    desc: |
      Cada deus tem um templo, e cada templo, uma lição. O Selo pede que você tenha percorrido todos.

      Confirme o marco. Marque a caixa quando o panteão estiver completo.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 40

  - link: atum:panteao
    at: [1, 8]

  - id: selo_areias
    title: "O Selo das Areias"
    type: milestone
    deps: [areias_panteao, atum:chave_areias]
    at: [2, 7]
    icon: minecraft:nether_star
    desc: |
      O terceiro Selo é dourado e pesado, como um escaravelho de ouro puro. Ele se encaixa no Registro com um som de areia caindo numa ampulheta, e eu sinto que cada grão é uma história terminada.

      Os três reinos agora estão selados, e a base do Registro está firme. Faltam cinco. Marque a caixa e vamos adiante.
    tasks:
      - check
    rewards:
      - kit: {name: "Kit do Selo", items: [minecraft:diamond x8, minecraft:emerald x8, minecraft:experience_bottle x32]}
      - loot: epico
      - xp: 75

  - link: atum:chave_areias
    at: [2, 8]

  - id: abismo_intro
    title: "Quarto Selo: o Abismo"
    type: info
    deps: [selos_abertura]
    at: [3, 7]
    icon: minecraft:skull
    desc: |
      O Selo do Abismo é o mais sombrio. Ele exige três chefes que guardam o vazio: o Wither, o Dragão do Fim e o Guardião do Caos. Cada um é um teste de preparo, de armadura e de coragem.

      Antes de começar, revise seus equipamentos e suas curas. Eu quero você inteiro do outro lado. Marque a caixa para começar.
    tasks:
      - check
    rewards:
      - xp: 10

  - id: abismo_wither
    title: "O Wither"
    type: boss
    deps: [abismo_intro, nether:wither]
    at: [4, 7]
    icon: minecraft:skull
    desc: |
      Três cabeças, uma explosão inteira e um Nether que treme. O Wither é o primeiro guardião do Abismo, e vencê-lo exige preparo, espaço aberto e muita cura.

      Convoque-o em campo aberto, com armadura encantada. §cPerigo:§r a explosão inicial derruba blocos. Marque a caixa quando o Wither cair.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 50

  - link: nether:wither
    at: [4, 8]

  - id: abismo_portal
    title: "O Portal do Fim"
    type: portal
    deps: [abismo_wither, fim:portal_fim]
    at: [5, 7]
    icon: minecraft:ender_eye
    desc: |
      O portal do Fim abre sobre uma ilha de pedra branca e um céu de estrelas apagadas. É a entrada para o segundo guardião.

      Leve blocos, arco e uma cama para quando perder o equilíbrio. Marque a caixa quando estiver lá.
    tasks:
      - check
    rewards:
      - loot: incomum
      - xp: 35

  - link: fim:portal_fim
    at: [5, 8]

  - id: abismo_dragao
    title: "O Dragão do Fim"
    type: boss
    deps: [abismo_portal, fim:dragao]
    at: [6, 7]
    icon: minecraft:dragon_egg
    desc: |
      O Dragão do Fim sobrevoa as torres de obsidiana curando-se nos cristais. Para vencê-lo, destrua os cristais, abra o flanco e acerte quando ele pousar.

      Marque a caixa quando o Dragão cair e o ovo repousar.
    tasks:
      - check
    rewards:
      - kit: {name: "Kit do Limiar", items: [minecraft:ender_pearl x8, minecraft:obsidian x16, minecraft:diamond x4]}
      - loot: epico
      - xp: 65

  - link: fim:dragao
    at: [6, 8]

  - id: abismo_renascido
    title: "O Dragão Renascido"
    type: boss
    deps: [abismo_dragao, draconic:dragao_ressuscitado]
    at: [7, 7]
    icon: minecraft:dragon_egg
    desc: |
      O Dragão do Fim volta, mais forte, para quem usa o ritual dracônico. É o teste de quem quer mais do que o fim normal oferece.

      Prepare-se como se fosse a primeira vez. Marque a caixa quando o Dragão Renascido tombar.
    tasks:
      - check
    rewards:
      - loot: epico
      - xp: 65

  - link: draconic:dragao_ressuscitado
    at: [7, 8]

  - id: abismo_caos
    title: "O Guardião do Caos"
    type: boss
    deps: [abismo_renascido, draconic:guardiao_caos]
    at: [8, 7]
    icon: minecraft:nether_star
    desc: |
      O Guardião do Caos é o chefe final do Volume do Dragão. Uma ilha de pedra, um escudo de energia, um poder que quase não cabe em palavras.

      Leve o melhor equipamento que tiver. Reconheço que o caos foi contido. Marque a caixa quando o Guardião cair.
    tasks:
      - check
    rewards:
      - kit: {name: "Kit do Limiar", items: [minecraft:ender_pearl x8, minecraft:obsidian x16, minecraft:diamond x4]}
      - loot: lendario
      - xp: 90

  - link: draconic:guardiao_caos
    at: [8, 8]

  - id: selo_abismo
    title: "O Selo do Abismo"
    type: milestone
    deps: [abismo_caos, nether:wither, fim:dragao, draconic:guardiao_caos]
    at: [9, 7]
    icon: minecraft:nether_star
    desc: |
      O quarto Selo é negro, e mesmo assim brilha. Ele fica pendurado sobre o vazio e pulsa devagar, como um coração que já aceitou o silêncio. Wither, Dragão do Fim e Guardião do Caos: três guardiães da escuridão que agora repousam.

      Eu preciso confessar que fiquei com medo. Mas você foi, e voltou, e o Abismo cedeu. Marque a caixa e vamos olhar para cima, onde as estrelas esperam.
    tasks:
      - check
    rewards:
      - kit: {name: "Kit do Selo", items: [minecraft:diamond x8, minecraft:emerald x8, minecraft:experience_bottle x32]}
      - loot: lendario
      - xp: 100

  - id: estrelas_intro
    title: "Quinto Selo: as Estrelas"
    type: info
    deps: [selos_abertura]
    at: [10, 7]
    icon: minecraft:fireworks
    desc: |
      O Selo das Estrelas é o mais distante. Exige que você saia do mundo, cruze o vazio e volte com o conhecimento do cosmos nas mãos. Foguetes, estações, outros planetas.

      Respire, olhe para cima e comece a montar. Marque a caixa quando estiver pronto para a viagem.
    tasks:
      - check
    rewards:
      - xp: 10

  - id: est_oficina
    title: "A Oficina Espacial"
    type: main
    deps: [estrelas_intro, galacticraft:oficina_espacial]
    at: [11, 7]
    icon: minecraft:iron_block
    desc: |
      Foguetes não se improvisam. A oficina espacial reúne as bancadas e as máquinas que dão forma ao primeiro voo. Confira se tem aço, oxigênio e combustível.

      Marque a caixa quando a oficina estiver montada.
    tasks:
      - check
    rewards:
      - kit: {name: "Kit do Engenheiro", items: [minecraft:redstone x32, minecraft:iron_ingot x16, minecraft:gold_ingot x8, minecraft:diamond x2]}
      - xp: 30

  - link: galacticraft:oficina_espacial
    at: [11, 8]

  - id: est_lancamento
    title: "Pronto para o Lançamento"
    type: main
    deps: [est_oficina, galacticraft:pronto_lancamento]
    at: [0, 14]
    icon: minecraft:fireworks
    desc: |
      Foguete, plataforma de lançamento, combustível e um traje com oxigênio. Tudo pronto. O resto é coragem.

      Marque a caixa quando o foguete estiver na plataforma.
    tasks:
      - check
    rewards:
      - loot: incomum
      - xp: 35

  - link: galacticraft:pronto_lancamento
    at: [0, 15]

  - id: est_estacao
    title: "A Estação Espacial"
    type: main
    deps: [est_lancamento, galacticraft:estacao_espacial]
    at: [1, 14]
    icon: minecraft:glass
    desc: |
      Uma casa no vazio, com escudo, estufa e vista para o planeta. A estação espacial é a primeira prova de que o ser humano pode morar entre as estrelas.

      Marque a caixa quando a estação estiver habitada.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 40

  - link: galacticraft:estacao_espacial
    at: [1, 15]

  - id: est_marte
    title: "A Base em Marte"
    type: main
    deps: [est_estacao, galacticraft:base_marte]
    at: [2, 14]
    icon: minecraft:redstone
    desc: |
      Marte é vermelho, frio e cheio de recursos. Uma base lá é a prova de que o seu conhecimento aguenta a distância.

      Marque a caixa quando a base estiver funcionando.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 45

  - link: galacticraft:base_marte
    at: [2, 15]

  - id: est_esqueleto
    title: "O Esqueleto-Chefe"
    type: boss
    deps: [est_marte, galacticraft:esqueleto_chefe]
    at: [3, 14]
    icon: minecraft:bone
    desc: |
      O primeiro chefe espacial é um esqueleto evoluído, alto, armado e furioso. Ele guarda o tesouro de um mundo sem ar.

      Leve oxigênio e paciência. Marque a caixa quando ele cair.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 45

  - link: galacticraft:esqueleto_chefe
    at: [3, 15]

  - id: est_gigantes
    title: "Os Gigantes Gasosos"
    type: main
    deps: [est_esqueleto, extraplanets:gigantes_gasosos]
    at: [4, 14]
    icon: minecraft:ender_pearl
    desc: |
      Júpiter, Saturno, Urano e Netuno: gigantes de gás que não têm chão, mas têm luas cheias de segredos.

      Marque a caixa quando tiver visitado os gigantes.
    tasks:
      - check
    rewards:
      - loot: raro
      - xp: 45

  - link: extraplanets:gigantes_gasosos
    at: [4, 15]

  - id: est_guardioes
    title: "Os Sete Guardiões"
    type: boss
    deps: [est_gigantes, extraplanets:sete_guardioes]
    at: [5, 14]
    icon: minecraft:skull
    desc: |
      Sete chefes em sete mundos. Cada um é uma versão distorcida de um velho conhecido, e todos exigem preparo. Eles guardam as estrelas mais longes.

      Marque a caixa quando os sete caírem.
    tasks:
      - check
    rewards:
      - loot: epico
      - xp: 65

  - link: extraplanets:sete_guardioes
    at: [5, 15]

  - id: est_nave
    title: "A Nave-Mãe"
    type: main
    deps: [est_guardioes, amunra:nave_mae]
    at: [6, 14]
    icon: minecraft:iron_block
    desc: |
      Uma nave que carrega uma base inteira consigo. Amun-Ra eleva a viagem espacial a outra escala, com sóis duplos e planetas de nomes antigos.

      Marque a caixa quando a nave-mãe estiver construída.
    tasks:
      - check
    rewards:
      - loot: epico
      - xp: 60

  - link: amunra:nave_mae
    at: [6, 15]

  - id: est_farao
    title: "O Faraó Morto-Vivo"
    type: boss
    deps: [est_nave, amunra:farao]
    at: [7, 14]
    icon: minecraft:gold_block
    desc: |
      Quem diria: o Faraó voltou, agora no espaço, e mais furioso. O Faraó Morto-Vivo é o chefe final de Amun-Ra.

      Marque a caixa quando ele cair.
    tasks:
      - check
    rewards:
      - loot: epico
      - xp: 70

  - link: amunra:farao
    at: [7, 15]

  - id: selo_estrelas
    title: "O Selo das Estrelas"
    type: milestone
    deps: [est_farao, galacticraft:explorador_solar, extraplanets:viajante_interestelar, amunra:mestre_amunra]
    at: [8, 14]
    icon: minecraft:nether_star
    desc: |
      O quinto Selo tem o brilho das estrelas de verdade. Ele sobe sem pressa, passa pelo teto da biblioteca e fica pendurado ali, sem peso e sem tempo, olhando de volta.

      Você cruzou o sistema solar e foi além. Galacticraft, Extra Planets e Amun-Ra: três tradições, uma só coragem. Eu nunca vi o céu com tantos olhos. Marque a caixa e siga para o Arcano.
    tasks:
      - check
    rewards:
      - kit: {name: "Kit do Selo", items: [minecraft:diamond x8, minecraft:emerald x8, minecraft:experience_bottle x32]}
      - loot: lendario
      - xp: 100

  - link: galacticraft:explorador_solar
    at: [8, 15]

  - link: extraplanets:viajante_interestelar
    at: [8, 16]

  - link: amunra:mestre_amunra
    at: [8, 17]

  - id: arcano_intro
    title: "Sexto Selo: o Arcano"
    type: info
    deps: [selos_abertura]
    at: [9, 14]
    icon: minecraft:enchanting_table
    desc: |
      O Selo Arcano exige maestria mágica de verdade. Thaumcraft, Blood Magic, Witchery, Ars Magica e a Guardiã Gaia: cinco caminhos de poder que se cruzam na mesma meta.

