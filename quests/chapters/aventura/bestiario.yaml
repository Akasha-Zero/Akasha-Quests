      Cada batalha, cada recuo e cada vitória foram escritas aqui, e eu guardo tudo com muito carinho. Você foi corajoso, paciente e esperto, e isso vale mais que qualquer troféu. Descanse, comemore e pode voltar sempre que quiser reler suas façanhas.

      Mande lembranças aos infernalmente mortos.
