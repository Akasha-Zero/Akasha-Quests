      Cada criatura derrotada deixou um pouco de sabedoria no seu Registro, e eu fico emocionada de ver você crescer assim. Cuide dos itens que conquistou, recarregue as poções e se prepare, porque ainda restam os grandes chefes do mural. Você está fazendo história, e eu não perderia isso por nada!
