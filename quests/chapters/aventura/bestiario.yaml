# Bestiario: caçadas com kill de mobs vanilla e de mods (ids reais via reg.py entity).
# Fora: chefes de Twilight/Aether/Atum/OreSpawn/Draconic/Galacticraft. Ver docs/mods/bestiario.md.
chapter:
  id: bestiario
  title: "Bestiário"
  order: 265
  icon: minecraft:iron_sword
  desc: |
    §cO Mural de Caçadas.§r Contratos diários, mobs do mundo comum, do Nether e dos mods mágicos
    (Thaumcraft, Witchery, Ars Magica, Blood Magic), com chefes para provar a coragem.
quests:

  - id: mural
    title: "O Mural de Caçadas"
    type: info
    icon: minecraft:iron_sword
    desc: |
      Herói, esta página do Registro é um mural de contratos: cada recorte traz um monstro, uma
      quantidade e uma recompensa. Matar bicho é útil, e eu pago bem.

      Os §eContratos Diários§r renovam a cada 24 horas. Os demais seguem do mais fácil ao mais
      perigoso. Os chefes de Twilight, Aether, Atum e afins têm capítulos próprios; aqui ficam os
      outros caçadores.

      §aDica:§r os mobs do §eInfernal Mobs§r não são entidades à parte: são os mesmos bichos com
      habilidades extras. Os que você matar aqui contam igual.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: diario_zumbis
    title: "Contrato: Zumbis"
    deps: [mural]
    repeat: 86400
    icon: minecraft:rotten_flesh
    desc: |
      A cidade sempre tem mais um zumbi do que deveria. Elimine §e20 Zumbis§r hoje.

      §aDica: à noite eles aparecem em bando; uma porta de ferro ajuda.§r

      Este contrato renova a cada 24 horas.
    tasks:
      - kill: {entity: "Zombie", count: 20}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_esqueletos
    title: "Contrato: Esqueletos"
    deps: [mural]
    repeat: 86400
    icon: minecraft:bone
    desc: |
      Os arqueiros ossudos incomodam toda noite. Elimine §e20 Esqueletos§r.

      §aEscudo ou parede de bloco resolve as flechas.§r

      Este contrato renova a cada 24 horas.
    tasks:
      - kill: {entity: "Skeleton", count: 20}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_aranhas
    title: "Contrato: Aranhas"
    deps: [mural]
    repeat: 86400
    icon: minecraft:spider_eye
    desc: |
      Elas escalam paredes e pulam em você. Elimine §e15 Aranhas§r.

      §aEspadas com Ruína dos Artrópodes ajudam.§r

      Este contrato renova a cada 24 horas.
    tasks:
      - kill: {entity: "Spider", count: 15}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_creepers
    title: "Contrato: Creepers"
    deps: [mural]
    repeat: 86400
    icon: minecraft:gunpowder
    desc: |
      Eles não dizem "oi", só "ssss". Elimine §e10 Creepers§r a distância.

      §aArco ou lança: nunca encoste!§r

      Este contrato renova a cada 24 horas.
    tasks:
      - kill: {entity: "Creeper", count: 10}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_endermen
    title: "Contrato: Endermen"
    deps: [mural]
    repeat: 86400
    icon: minecraft:ender_pearl
    desc: |
      Altos, caladões e teleportadores. Elimine §e6 Endermen§r.

      §aOlhar nos olhos é convite à briga; use abóbora na cabeça.§r

      Este contrato renova a cada 24 horas.
    tasks:
      - kill: {entity: "Enderman", count: 6}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_bruxas
    title: "Contrato: Bruxas"
    deps: [mural]
    repeat: 86400
    icon: minecraft:glass_bottle
    desc: |
      Elas jogam poções e curam a si mesmas. Elimine §e3 Bruxas§r.

      §aPântanos e cabanas são o lugar delas.§r

      Este contrato renova a cada 24 horas.
    tasks:
      - kill: {entity: "Witch", count: 3}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: zumbi
    title: "Zumbis da Noite"
    type: main
    deps: [mural]
    icon: minecraft:rotten_flesh
    desc: |
      A primeira caçada de todo Herói: zumbis! Eles andam devagar, mas em bando incomodam. Derrote
      §e5§r.

      Durante o dia eles queimam, então caçar de manhã é grátis. Se carne podre cair, guarde para
      troca com aldeões.
    tasks:
      - kill: {entity: "Zombie", count: 5}
    rewards:
      - xp: 3
      - choice: [minecraft:iron_sword, minecraft:bow, minecraft:cooked_beef x12]

  - id: esqueleto
    title: "Arqueiros de Osso"
    type: main
    deps: [zumbi]
    icon: minecraft:bone
    desc: |
      Esqueletos atiram de longe e erram pouco. Derrote §e5§r. Aproxime-se em zigue-zague, ou
      construa uma barricada.

      Eles largam arcos, flechas e ossos (excelente adubo e comida para lobos).
    tasks:
      - kill: {entity: "Skeleton", count: 5}
    rewards:
      - xp: 3
      - item: [minecraft:arrow x32, minecraft:bone x8]

  - id: aranha
    title: "Tecelãs"
    type: main
    deps: [esqueleto]
    icon: minecraft:spider_eye
    desc: |
      Aranhas são neutras de dia e hostis à noite. Derrote §e5§r e traga o olho de aranha.

      §aDica:§r o fio (string) vale ouro para arcos e armadilhas.
    tasks:
      - kill: {entity: "Spider", count: 5}
    rewards:
      - xp: 3
      - item: [minecraft:string x16]

  - id: aranha_caverna
    title: "Aranha das Cavernas"
    deps: [aranha]
    icon: minecraft:fermented_spider_eye
    desc: |
      Menores, rápidas e venenosas, saem das masmorras. Derrote §e4§r.

      §cPerigo:§r o veneno tira vida; leve leite no inventário.
    tasks:
      - kill: {entity: "CaveSpider", count: 4}
    rewards:
      - xp: 4
      - item: [minecraft:milk_bucket]

  - id: creeper
    title: "Silêncio e Estouro"
    type: main
    deps: [zumbi]
    icon: minecraft:gunpowder
    desc: |
      Não deixe chegar perto! Derrote §e5 Creepers§r de longe com arco ou com golpe e recuo.

      A pólvora serve para TNT e foguetes. Cuide dos seus blocos preferidos.
    tasks:
      - kill: {entity: "Creeper", count: 5}
    rewards:
      - xp: 4
      - item: [minecraft:gunpowder x8, minecraft:arrow x16]

  - id: enderman
    title: "Os Altos Calados"
    deps: [creeper]
    icon: minecraft:ender_pearl
    desc: |
      Endermen teleportam e batem forte. Derrote §e3§r para colher pérolas, mas nunca olhe nos
      olhos antes de atacar.

      Debaixo de um teto baixo (2 blocos) ele não consegue te alcançar bem.
    tasks:
      - kill: {entity: "Enderman", count: 3}
    rewards:
      - xp: 5
      - loot: incomum

  - id: bruxa
    title: "Bruxa do Pântano"
    deps: [aranha]
    icon: minecraft:glass_bottle
    desc: |
      Cabanas nos pântanos escondem bruxas. Derrote §e2§r. Elas jogam poções de lentidão, veneno e
      dano.

      Traga leite e arco: matar de longe é mais seguro.
    tasks:
      - kill: {entity: "Witch", count: 2}
    rewards:
      - xp: 4
      - item: [minecraft:glowstone_dust x8, minecraft:redstone x8]

  - id: slime
    title: "Gosma Saltitante"
    deps: [zumbi]
    icon: minecraft:slime_ball
    desc: |
      Slimes pulam e se dividem em menores. Derrote §e6§r (conta cada um!). Aparecem em pântanos e
      cavernas profundas.

      A bola de slime é matéria-prima para pistões grudentos.
    tasks:
      - kill: {entity: "Slime", count: 6}
    rewards:
      - xp: 3
      - item: [minecraft:slime_ball x8]

  - id: silverfish
    title: "Traça de Pedra"
    type: optional
    deps: [aranha_caverna]
    icon: minecraft:stone
    desc: |
      Escondidos dentro de blocos de pedra, aparecem de repente. Derrote §e5§r. Quebre a pedra
      suspeita com picareta e fique de olho.
    tasks:
      - kill: {entity: "Silverfish", count: 5}
    rewards:
      - loot: comum

  - id: pigzombie
    title: "Porcos Zumbis"
    deps: [enderman]
    icon: minecraft:gold_nugget
    desc: |
      No Nether, eles vivem em bandos pacíficos até você bater em um. Derrote §e6§r e leve as
      pepitas de ouro.

      §cPerigo:§r bateu em um, todos vêm atrás. Leve armadura!
    tasks:
      - kill: {entity: "PigZombie", count: 6}
    rewards:
      - xp: 5
      - item: [minecraft:gold_ingot x4]

  - id: blaze
    title: "Chamas Vivas"
    type: main
    deps: [pigzombie]
    icon: minecraft:blaze_rod
    desc: |
      Nas fortalezas do Nether voam as §eChamas§r: lançam bolas de fogo e dão varetas essenciais.
      Derrote §e4§r.

      §aDica:§r poção de resistência ao fogo e bolas de neve acabam com elas rapidinho.
    tasks:
      - kill: {entity: "Blaze", count: 4}
    rewards:
      - xp: 6
      - loot: incomum

  - id: ghast
    title: "Lamento do Nether"
    deps: [blaze]
    icon: minecraft:ghast_tear
    desc: |
      Os §eGhasts§r flutuam e choram. Cada lágrima vale ouro para poções. Derrote §e2§r.

      §aDica:§r rebata a bola de fogo com um golpe e ela volta para ele!
    tasks:
      - kill: {entity: "Ghast", count: 2}
    rewards:
      - xp: 6
      - loot: incomum

  - id: lava_slime
    title: "Cubo de Magma"
    deps: [blaze]
    icon: minecraft:magma_cream
    desc: |
      Primos do slime que vivem no Nether, soltam creme de magma. Derrote §e5§r.

      Ótimo para poção de resistência ao fogo.
    tasks:
      - kill: {entity: "LavaSlime", count: 5}
    rewards:
      - xp: 5
      - item: [minecraft:magma_cream x4]

  - id: wither_boss
    title: "O Wither"
    type: boss
    deps: [ghast, lava_slime]
    banner: "O Wither caiu!"
    subtitle: "Uma estrela do Nether é sua"
    icon: minecraft:nether_star
    desc: |
      Três crânios de Wither Skeleton sobre areia de almas invocam o §eWither§r. Ele destrói
      blocos e dá bastante trabalho.

      §cTática:§r lute em área aberta e baixa, com arco e armadura de diamante. Poção de cura
      sempre. Ele deixa uma §eEstrela do Nether§r.
    tasks:
      - kill: {entity: "WitherBoss", count: 1}
    rewards:
      - xp: 20
      - loot: epico

  - id: dragao_fim
    title: "O Dragão do Fim"
    type: boss
    deps: [enderman, wither_boss]
    banner: "O Dragão tombou!"
    subtitle: "O Fim é seu"
    icon: minecraft:dragon_egg
    desc: |
      O guardião do Fim, enorme e implacável. Destrua primeiro os cristais nos pilares (cuidado
      com os arqueiros) e depois ataque o dragão.

      §cTática:§r flechas e camas não valem; leve muitas flechas e blocos. Ele deixa o ovo do
      dragão.
    tasks:
      - kill: {entity: "EnderDragon", count: 1}
    rewards:
      - xp: 25
      - loot: lendario

  - id: lula
    title: "Pesca com Tinta"
    type: optional
    deps: [zumbi]
    icon: minecraft:dye
    desc: |
      Lulas nadam em águas calmas e largam saco de tinta. Pegue §e4§r para tingir lã e livros.
    tasks:
      - kill: {entity: "Squid", count: 4}
    rewards:
      - loot: comum

  - id: morcego
    title: "Morcegos na Caverna"
    type: optional
    deps: [esqueleto]
    icon: minecraft:feather
    desc: |
      Rápidos e pequenininhos, vivem no escuro. Derrote §e3§r para a coleção.
    tasks:
      - kill: {entity: "Bat", count: 3}
    rewards:
      - loot: comum

  - id: lobo
    title: "Lobos Selvagens"
    type: optional
    deps: [zumbi]
    icon: minecraft:bone
    desc: |
      Lobos atacam se provocados. Derrote §e2§r se for preciso, mas domar com osso é mais bonito.
    tasks:
      - kill: {entity: "Wolf", count: 2}
    rewards:
      - loot: comum

  - id: ocelote
    title: "Gatos da Selva"
    type: optional
    deps: [aranha]
    icon: minecraft:fish
    desc: |
      Selvagens e ariscos nas selvas. Domar com peixe cru rende um gatinho, mas o contrato pede
      ação: derrote §e2§r.
    tasks:
      - kill: {entity: "Ozelot", count: 2}
    rewards:
      - loot: comum

  - id: golem_ferro
    title: "Golem de Ferro"
    type: optional
    deps: [slime]
    icon: minecraft:iron_ingot
    desc: |
      Protetores das aldeias e fonte de ferro. Derrote §e1§r, de preferência um golem seu, para
      não irritar os aldeões.
    tasks:
      - kill: {entity: "VillagerGolem", count: 1}
    rewards:
      - loot: incomum

  - id: husk
    title: "Zumbis do Deserto"
    deps: [zumbi]
    icon: minecraft:rotten_flesh
    desc: |
      Nos desertos aparecem os §eZumbis Secos§r (Husks), que não queimam ao sol. Derrote §e4§r e
      aplique um pouco de fome no dia a dia.
    tasks:
      - kill: {entity: "etfuturum.husk", count: 4}
    rewards:
      - xp: 4
      - item: [minecraft:cooked_beef x8]

  - id: stray
    title: "Esqueletos do Gelo"
    deps: [esqueleto]
    icon: minecraft:snowball
    desc: |
      Esqueletos que vivem em biomas gelados e atiram flechas de lentidão. Derrote §e4§r.
    tasks:
      - kill: {entity: "etfuturum.stray", count: 4}
    rewards:
      - xp: 4
      - item: [minecraft:arrow x32]

  - id: endermite
    title: "Endermitas"
    type: optional
    deps: [enderman]
    icon: minecraft:ender_eye
    desc: |
      Nascem de pérolas jogadas. Derrote §e3§r, pequenas e chatas.
    tasks:
      - kill: {entity: "etfuturum.endermite", count: 3}
    rewards:
      - loot: comum

  - id: shulker
    title: "Shulkers"
    deps: [dragao_fim]
    icon: minecraft:ender_chest
    desc: |
      Moradores das cidades do Fim, escondidos em conchas. Derrote §e2§r com cuidado (a levitação
      é irritante).
    tasks:
      - kill: {entity: "etfuturum.shulker", count: 2}
    rewards:
      - xp: 8
      - loot: raro

  - id: piglin
    title: "Piglins"
    deps: [pigzombie]
    icon: minecraft:gold_ingot
    desc: |
      No Nether do Netherlicious vivem os §ePiglins§r. Derrote §e3§r se precisar, mas ouro na mão
      costuma agradar mais.
    tasks:
      - kill: {entity: "netherlicious.Piglin", count: 3}
    rewards:
      - xp: 5
      - item: [minecraft:gold_ingot x4]

  - id: hoglin
    title: "Hoglins"
    deps: [piglin]
    icon: minecraft:cooked_porkchop
    desc: |
      Javalis do Nether, fortes e teimosos. Derrote §e3§r e ganhe carne e couro.
    tasks:
      - kill: {entity: "netherlicious.Hoglin", count: 3}
    rewards:
      - xp: 6
      - item: [minecraft:cooked_porkchop x16]

  - id: zoglin
    title: "Zoglins"
    type: optional
    deps: [hoglin]
    icon: minecraft:rotten_flesh
    desc: |
      Hoglins que viraram mortos-vivos. Derrote §e2§r. São agressivos e atacam qualquer coisa.
    tasks:
      - kill: {entity: "netherlicious.Zoglin", count: 2}
    rewards:
      - loot: incomum

  - id: tc_cultista
    title: "Cultistas Encapuzados"
    type: main
    deps: [bruxa]
    icon: minecraft:iron_helmet
    desc: |
      Cultistas se escondem em templos e dão trabalho. Derrote §e3 Cavaleiros§r. Têm armadura e
      atacam em grupo.

      §aDica:§r quem investigou Thaumcraft sabe: eles carregam pergaminhos e baús interessantes.
    tasks:
      - kill: {entity: "Thaumcraft.CultistKnight", count: 3}
    rewards:
      - xp: 6
      - loot: incomum

  - id: tc_cultista_clerigo
    title: "Clérigos do Culto"
    deps: [tc_cultista]
    icon: minecraft:book
    desc: |
      Os clérigos curam os outros e invocam. Derrote §e3§r primeiro.
    tasks:
      - kill: {entity: "Thaumcraft.CultistCleric", count: 3}
    rewards:
      - xp: 5
      - item: [minecraft:paper x16]

  - id: tc_pech
    title: "Pechs do Mato"
    deps: [aranha]
    icon: minecraft:emerald
    desc: |
      Criaturinhas curiosas das florestas mágicas, que trocam coisas. Derrote §e3§r se estiverem
      hostis. Cuidado: carregam varinhas.
    tasks:
      - kill: {entity: "Thaumcraft.Pech", count: 3}
    rewards:
      - xp: 5
      - item: [minecraft:emerald x2]

  - id: tc_firebat
    title: "Morcegos de Fogo"
    deps: [bruxa]
    icon: minecraft:blaze_powder
    desc: |
      Surgem em cavernas profundas, soltando faíscas. Derrote §e4§r. Água e escudos ajudam.
    tasks:
      - kill: {entity: "Thaumcraft.Firebat", count: 4}
    rewards:
      - xp: 4
      - item: [minecraft:blaze_powder x4]

  - id: tc_zumbi_cerebro
    title: "Zumbi Pensante"
    deps: [zumbi]
    icon: minecraft:rotten_flesh
    desc: |
      Zumbis que usam o cérebro: mais rápidos, com armadura. Derrote §e4§r.
    tasks:
      - kill: {entity: "Thaumcraft.BrainyZombie", count: 4}
    rewards:
      - xp: 5
      - item: [minecraft:cooked_beef x8]

  - id: tc_aranha_mente
    title: "Aranha da Mente"
    deps: [aranha_caverna]
    icon: minecraft:spider_eye
    desc: |
      Pequenas aranhas que dão confusão. Derrote §e3§r.
    tasks:
      - kill: {entity: "Thaumcraft.MindSpider", count: 3}
    rewards:
      - xp: 5
      - item: [minecraft:string x16]

  - id: tc_guardiao
    title: "Guardiões Sombrios"
    deps: [tc_cultista_clerigo]
    icon: minecraft:obsidian
    desc: |
      Das dimensões estranhas vêm os §eGuardiões Eldritch§r. Fortes e silenciosos. Derrote §e2§r.

      §cPerigo:§r não vá sozinho. Leve armadura boa e poções.
    tasks:
      - kill: {entity: "Thaumcraft.EldritchGuardian", count: 2}
    rewards:
      - xp: 8
      - loot: raro

  - id: tc_caranguejo
    title: "Caranguejo Eldritch"
    type: optional
    deps: [tc_guardiao]
    icon: minecraft:fish
    desc: |
      Pequenos, mas irritantes. Derrote §e3§r.
    tasks:
      - kill: {entity: "Thaumcraft.EldritchCrab", count: 3}
    rewards:
      - loot: incomum

  - id: tc_taint
    title: "Enxame Maculado"
    deps: [tc_firebat]
    icon: minecraft:spider_eye
    desc: |
      Onde há Mácula, há enxames. Derrote §e3§r grupos e leve proteção contra mácula.
    tasks:
      - kill: {entity: "Thaumcraft.TaintSwarm", count: 3}
    rewards:
      - xp: 6
      - loot: incomum

  - id: tc_warden
    title: "Vigia Eldritch"
    type: boss
    deps: [tc_guardiao]
    banner: "O Vigia caiu!"
    subtitle: "Eldritch derrotado"
    icon: minecraft:ender_eye
    desc: |
      O guardião das profundezas. Pesado, resistente e perigoso. Derrote §e1§r e prove sua
      coragem.

      §cTática:§r use armaduras, poções e o apoio de aliados. Fuga também é arma.
    tasks:
      - kill: {entity: "Thaumcraft.EldritchWarden", count: 1}
    rewards:
      - xp: 15
      - loot: epico

  - id: wi_vampiro
    title: "Sangue Antigo"
    type: main
    deps: [tc_cultista]
    icon: minecraft:redstone
    desc: |
      À noite, vampiros vagam pelas aldeias da Witchery. Derrote §e3§r. Eles chupam vida, então
      ataque rápido.

      §aDica:§r estaca de madeira e alho ajudam (confira no NEI).
    tasks:
      - kill: {entity: "witchery.vampire", count: 3}
    rewards:
      - xp: 6
      - loot: incomum

  - id: wi_lobisomem
    title: "Lobisomem"
    deps: [wi_vampiro]
    icon: minecraft:bone
    desc: |
      Sob a lua cheia, humanos viram feras. Derrote §e2§r §eLobisomens§r. Prata é a melhor arma.
    tasks:
      - kill: {entity: "witchery.wolfman", count: 2}
    rewards:
      - xp: 6
      - loot: incomum

  - id: wi_werevillager
    title: "Aldeões Amaldiçoados"
    deps: [wi_lobisomem]
    icon: minecraft:rotten_flesh
    desc: |
      Aldeões que escondem uma fera dentro. Derrote §e2§r e não confie em quem uiva.
    tasks:
      - kill: {entity: "witchery.werevillager", count: 2}
    rewards:
      - xp: 5
