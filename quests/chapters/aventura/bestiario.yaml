    desc: |
      Que orgulho, Herói! Zumbis, esqueletos, aranhas, creepers e endermen: o básico está dominado. A Akasha já anotou o seu nome no mural.

      Você aprendeu a se defender, a escolher a hora certa de lutar e a cuidar das suas construções. Isso não é pouca coisa! Respire, comemore e se prepare, porque o Nether e os monstros mágicos estão logo ali. Continue assim, eu estou de olho (e torcendo)!
