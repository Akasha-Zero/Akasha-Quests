# Bestiario: caçadas com kill de mobs vanilla e de mods (ids reais via reg.py entity).
# Fora: chefes de Twilight/Aether/Atum/OreSpawn/Draconic/Galacticraft. Ver docs/mods/bestiario.md.
chapter:
  id: bestiario
  title: "Bestiário"
  order: 265
  icon: minecraft:iron_sword
  desc: |
    §cO Mural de Caçadas.§r Contratos diários, mobs do mundo comum, do Nether e dos mods mágicos
    (Thaumcraft, Witchery, Ars Magica, Blood Magic), com chefes para provar a coragem.
quests:

  - id: mural
    title: "O Mural de Caçadas"
    type: info
    icon: minecraft:iron_sword
    desc: |
      Herói, esta página do Registro é um mural de contratos: cada recorte traz um monstro, uma
      quantidade e uma recompensa. Matar bicho é útil, e eu pago bem.

      Os §eContratos Diários§r renovam a cada 24 horas. Os demais seguem do mais fácil ao mais
      perigoso. Os chefes de Twilight, Aether, Atum e afins têm capítulos próprios; aqui ficam os
      outros caçadores.

      §aDica:§r os mobs do §eInfernal Mobs§r não são entidades à parte: são os mesmos bichos com
      habilidades extras. Os que você matar aqui contam igual.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: diario_zumbis
    title: "Contrato: Zumbis"
    deps: [mural]
    repeat: 86400
    icon: minecraft:rotten_flesh
    desc: |
      A cidade sempre tem mais um zumbi do que deveria! Elimine §e20 Zumbis§r hoje.

      §aDica: à noite eles aparecem em bando; uma porta de ferro ajuda.§r

      Este contrato renova a cada 24 horas, então volte quando quiser repetir. Boa caçada, Herói, e cuidado com a horda!
    tasks:
      - kill: {entity: "Zombie", count: 20}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_esqueletos
    title: "Contrato: Esqueletos"
    deps: [mural]
    repeat: 86400
    icon: minecraft:bone
    desc: |
      Os arqueiros ossudos incomodam toda noite! Elimine §e20 Esqueletos§r.

      §aEscudo ou parede de bloco resolve as flechas.§r

      Este contrato renova a cada 24 horas, então dá para repetir quantas vezes quiser. Junte uns amigos ou vá com calma, pois eles atiram de longe. Boa caçada, Herói, e abaixe a cabeça!
    tasks:
      - kill: {entity: "Skeleton", count: 20}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_aranhas
    title: "Contrato: Aranhas"
    deps: [mural]
    repeat: 86400
    icon: minecraft:spider_eye
    desc: |
      Elas escalam paredes e pulam em você! Elimine §e15 Aranhas§r.

      §aEspadas com Ruína dos Artrópodes ajudam.§r

      Este contrato renova a cada 24 horas, então volte quando quiser repetir. Se tiver uma espada boa à mão, melhor ainda: elas são rápidas e costumam vir em número. Boa caçada, Herói, e cuidado com o salto delas!
    tasks:
      - kill: {entity: "Spider", count: 15}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_creepers
    title: "Contrato: Creepers"
    deps: [mural]
    repeat: 86400
    icon: minecraft:gunpowder
    desc: |
      Eles não dizem "oi", só "ssss"! Elimine §e10 Creepers§r a distância.

      §aArco ou lança: nunca encoste!§r

      Este contrato renova a cada 24 horas, então dá para repetir quando quiser. Se um deles começar a chiar, afaste-se e atire de longe. Cuidado para não perder suas construções! Boa caçada, Herói, e mantenha distância!
    tasks:
      - kill: {entity: "Creeper", count: 10}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_endermen
    title: "Contrato: Endermen"
    deps: [mural]
    repeat: 86400
    icon: minecraft:ender_pearl
    desc: |
      Altos, caladões e teleportadores! Elimine §e6 Endermen§r.

      §aOlhar nos olhos é convite à briga; use abóbora na cabeça.§r

      Este contrato renova a cada 24 horas, então dá para repetir quando quiser. Cuidado ao revidar, porque eles teleportam para perto de você. Mantenha a calma e vá com boa armadura. Boa caçada, Herói, e não os encare!
    tasks:
      - kill: {entity: "Enderman", count: 6}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: diario_bruxas
    title: "Contrato: Bruxas"
    deps: [mural]
    repeat: 86400
    icon: minecraft:glass_bottle
    desc: |
      Elas jogam poções e curam a si mesmas! Elimine §e3 Bruxas§r.

      §aPântanos e cabanas são o lugar delas.§r

      Este contrato renova a cada 24 horas, então dá para repetir quando quiser. Fique atento às poções que elas jogam e tente derrubá-las rápido. Boa caçada, Herói!
    tasks:
      - kill: {entity: "Witch", count: 3}
    rewards:
      - xp: 3
      - choice: [minecraft:cooked_beef x8, minecraft:golden_apple, minecraft:iron_ingot x6]

  - id: zumbi
    title: "Zumbis da Noite"
    type: main
    deps: [mural]
    icon: minecraft:rotten_flesh
    desc: |
      A primeira caçada de todo Herói: zumbis! Eles andam devagar, mas em bando incomodam. Derrote §e5§r.

      Durante o dia eles queimam, então caçar de manhã é grátis. Se carne podre cair, guarde para troca com aldeões. Mantenha a espada à mão, recue quando cercarem você e não tenha pressa. Todo aventureiro começa assim, e você vai tirar de letra!
    tasks:
      - kill: {entity: "Zombie", count: 5}
    rewards:
      - xp: 3
      - choice: [minecraft:iron_sword, minecraft:bow, minecraft:cooked_beef x12]

  - id: esqueleto
    title: "Arqueiros de Osso"
    type: main
    deps: [zumbi]
    icon: minecraft:bone
    desc: |
      Esqueletos atiram de longe e erram pouco, então vá com cuidado! Derrote §e5§r. Aproxime-se em zigue-zague, ou construa uma barricada.

      Eles largam arcos, flechas e ossos (excelente adubo e comida para lobos). Tudo aproveitável, nada de desperdício. Leve uma boa armadura para suportar algumas flechadas e bora à luta, Herói. Você consegue!
    tasks:
      - kill: {entity: "Skeleton", count: 5}
    rewards:
      - xp: 3
      - item: [minecraft:arrow x32, minecraft:bone x8]

  - id: aranha
    title: "Tecelãs"
    type: main
    deps: [esqueleto]
    icon: minecraft:spider_eye
    desc: |
      Aranhas são neutras de dia e hostis à noite, então escolha bem a hora! Derrote §e5§r e traga o olho de aranha.

      §aDica:§r o fio (string) vale ouro para arcos e armadilhas. Elas pulam em cima de você, por isso mantenha a espada à mão e não deixe de se mexer. Quando juntar tudo, volte aqui. Boa caçada, Herói!
    tasks:
      - kill: {entity: "Spider", count: 5}
    rewards:
      - xp: 3
      - item: [minecraft:string x16]

  - id: aranha_caverna
    title: "Aranha das Cavernas"
    deps: [aranha]
    icon: minecraft:fermented_spider_eye
    desc: |
      Pequenas, rápidas e venenosas, elas saem das masmorras! Derrote §e4§r.

      §cPerigo:§r o veneno tira vida; leve leite no inventário. Entre nas masmorras com calma, olhe para os cantos escuros e mantenha a espada à mão. Se alguma te picar, beba o leite e continue. Cada vitória te deixa mais forte, Herói!
    tasks:
      - kill: {entity: "CaveSpider", count: 4}
    rewards:
      - xp: 4
      - item: [minecraft:milk_bucket]

  - id: creeper
    title: "Silêncio e Estouro"
    type: main
    deps: [zumbi]
    icon: minecraft:gunpowder
    desc: |
      Não deixe chegar perto! Derrote §e5 Creepers§r de longe com arco ou com golpe e recuo.

      A pólvora serve para TNT e foguetes. Cuide dos seus blocos preferidos, porque uma explosão pode estragar a casa toda. Ouça o chiado e afaste-se na hora. Um bom arco e um pouco de paciência resolvem. Boa caçada, Herói!
    tasks:
      - kill: {entity: "Creeper", count: 5}
    rewards:
      - xp: 4
      - item: [minecraft:gunpowder x8, minecraft:arrow x16]

  - id: enderman
    title: "Os Altos Calados"
    deps: [creeper]
    icon: minecraft:ender_pearl
    desc: |
      Endermen teleportam e batem forte! Derrote §e3§r para colher pérolas, mas nunca olhe nos olhos antes de atacar.

      Debaixo de um teto baixo (2 blocos) ele não consegue te alcançar bem. Use isso a seu favor, construa um abrigo simples e espere por eles. As pérolas vão te ajudar muito mais adiante. Com calma, Herói, você derrota qualquer um!
    tasks:
      - kill: {entity: "Enderman", count: 3}
    rewards:
      - xp: 5
      - loot: incomum

  - id: bruxa
    title: "Bruxa do Pântano"
    deps: [aranha]
    icon: minecraft:glass_bottle
    desc: |
      Cabanas nos pântanos escondem bruxas! Derrote §e2§r. Elas jogam poções de lentidão, veneno e dano.

      Traga leite e arco: matar de longe é mais seguro. Aproxime-se com cuidado, use o terreno para se esconder e ataque assim que ela aparecer. Cuidado para não passar muito tempo no alcance das poções. Bora, Herói, o pântano te espera!
    tasks:
      - kill: {entity: "Witch", count: 2}
    rewards:
      - xp: 4
      - item: [minecraft:glowstone_dust x8, minecraft:redstone x8]

  - id: slime
    title: "Gosma Saltitante"
    deps: [zumbi]
    icon: minecraft:slime_ball
    desc: |
      Slimes pulam e se dividem em menores! Derrote §e6§r (conta cada um!). Aparecem em pântanos e cavernas profundas.

      A bola de slime é matéria-prima para pistões grudentos. Cada pedacinho conta, então não deixe nenhum escapar. Mantenha a espada à mão e vá com calma. É uma caçada divertida e bem gosmenta, Herói. Boa sorte!
    tasks:
      - kill: {entity: "Slime", count: 6}
    rewards:
      - xp: 3
      - item: [minecraft:slime_ball x8]

  - id: silverfish
    title: "Traça de Pedra"
    type: optional
    deps: [aranha_caverna]
    icon: minecraft:stone
    desc: |
      Escondidos dentro de blocos de pedra, eles aparecem de repente! Derrote §e5§r. Quebre a pedra suspeita com picareta e fique de olho.

      É uma tarefa opcional, mas dá uma boa prática de reflexos. Atenção ao quebrar blocos em cavernas ou fortalezas, porque eles saem aos montes. Boa caçada, Herói, e abra o olho!
    tasks:
      - kill: {entity: "Silverfish", count: 5}
    rewards:
      - loot: comum

  - id: pigzombie
    title: "Porcos Zumbis"
    deps: [enderman]
    icon: minecraft:gold_nugget
    desc: |
      No Nether, eles vivem em bandos pacíficos até você bater em um. Derrote §e6§r e leve as pepitas de ouro.

      §cPerigo:§r bateu em um, todos vêm atrás. Leve armadura! Escolha um bom lugar para lutar, de preferência com saída fácil, e use uma boa espada. As pepitas são um prêmio e tanto. Vai com tudo, Herói!
    tasks:
      - kill: {entity: "PigZombie", count: 6}
    rewards:
      - xp: 5
      - item: [minecraft:gold_ingot x4]

  - id: blaze
    title: "Chamas Vivas"
    type: main
    deps: [pigzombie]
    icon: minecraft:blaze_rod
    desc: |
      Nas fortalezas do Nether voam as §eChamas§r: lançam bolas de fogo e dão varetas essenciais. Derrote §e4§r.

      §aDica:§r poção de resistência ao fogo e bolas de neve acabam com elas rapidinho. Leve muitos blocos para se proteger e ataque de longe quando puder. As varetas valem cada gota de suor! Respire fundo e vá lá, Herói. Você dá conta!
    tasks:
      - kill: {entity: "Blaze", count: 4}
    rewards:
      - xp: 6
      - loot: incomum

  - id: ghast
    title: "Lamento do Nether"
    deps: [blaze]
    icon: minecraft:ghast_tear
    desc: |
      Os §eGhasts§r flutuam e choram. Cada lágrima vale ouro para poções. Derrote §e2§r.

      §aDica:§r rebata a bola de fogo com um golpe e ela volta para ele! Leve um arco e construa uma proteção de blocos, porque eles voam alto sobre a lava. Mire com calma e não se afobe. Que caçada emocionante te espera, Herói!
    tasks:
      - kill: {entity: "Ghast", count: 2}
    rewards:
      - xp: 6
      - loot: incomum

  - id: lava_slime
    title: "Cubo de Magma"
    deps: [blaze]
    icon: minecraft:magma_cream
    desc: |
      Primos do slime que vivem no Nether, eles soltam creme de magma. Derrote §e5§r.

      Ótimo para poção de resistência ao fogo. Mantenha distância da lava, use armadura e golpeie com calma, porque eles se dividem em menores. O creme de magma é útil em várias receitas, então guarde bastante. Boa caçada, Herói!
    tasks:
      - kill: {entity: "LavaSlime", count: 5}
    rewards:
      - xp: 5
      - item: [minecraft:magma_cream x4]

  - id: wither_boss
    title: "O Wither"
    type: boss
    deps: [ghast, lava_slime]
    banner: "O Wither caiu!"
    subtitle: "Uma estrela do Nether é sua"
    icon: minecraft:nether_star
    desc: |
      Chegou a hora de um desafio e tanto, Herói! Três crânios de Wither Skeleton sobre areia de almas invocam o §eWither§r. Ele destrói blocos e dá bastante trabalho, então escolha bem o lugar da luta.

      §cTática:§r lute em área aberta e baixa, com arco e armadura de diamante. Poção de cura sempre. Ele deixa uma Estrela do Nether, que abre muitas portas depois.

      Prepare-se bem, respire fundo e lembre-se: cada vitória conta. Você já percorreu um longo caminho até aqui e merece esta conquista. Eu acredito em você, vá com tudo!
    tasks:
      - kill: {entity: "WitherBoss", count: 1}
    rewards:
      - xp: 20
      - loot: epico

  - id: dragao_fim
    title: "O Dragão do Fim"
    type: boss
    deps: [enderman, wither_boss]
    banner: "O Dragão tombou!"
    subtitle: "O Fim é seu"
    icon: minecraft:dragon_egg
    desc: |
      O guardião do Fim, enorme e implacável. Destrua primeiro os cristais nos pilares (cuidado com os arqueiros) e depois ataque o dragão.

      §cTática:§r flechas e camas não valem; leve muitas flechas e blocos. Ele deixa o ovo do dragão.

      Este é um dos maiores desafios do Registro, Herói. Leve boa armadura, poções e coragem de sobra. Respire fundo, concentre-se e mostre do que você é capaz. Eu estarei torcendo por você!
    tasks:
      - kill: {entity: "EnderDragon", count: 1}
    rewards:
      - xp: 25
      - loot: lendario

  - id: lula
    title: "Pesca com Tinta"
    type: optional
    deps: [zumbi]
    icon: minecraft:dye
    desc: |
      Lulas nadam em águas calmas e largam saco de tinta. Pegue §e4§r para tingir lã e livros.

      É uma missão opcional, mas rende um corante útil para decorar a casa. Procure em rios e lagos e mate com calma. Se precisar de ideias para a tinta, aperte U no NEI. Uma pescaria diferente, Herói. Divirta-se!
    tasks:
      - kill: {entity: "Squid", count: 4}
    rewards:
      - loot: comum

  - id: morcego
    title: "Morcegos na Caverna"
    type: optional
    deps: [esqueleto]
    icon: minecraft:feather
    desc: |
      Rápidos e pequenininhos, eles vivem no escuro. Derrote §e3§r para a coleção.

      É uma missão opcional, mas dá um gostinho de conquista. Entre numa caverna escura, leve uma tocha e golpeie quando eles passarem. Eles são rápidos, então paciência! Boa caçada, Herói, e cuidado com a escuridão.
    tasks:
      - kill: {entity: "Bat", count: 3}
    rewards:
      - loot: comum

  - id: lobo
    title: "Lobos Selvagens"
    type: optional
    deps: [zumbi]
    icon: minecraft:bone
    desc: |
      Lobos atacam se provocados. Derrote §e2§r se for preciso, mas domar com osso é mais bonito.

      Essa é uma missão opcional, então decida qual caminho prefere: a batalha ou a amizade. Os lobos aparecem em florestas e taigas, então leve uma boa espada e armadura. Escolha com o coração, Herói. Boa sorte!
    tasks:
      - kill: {entity: "Wolf", count: 2}
    rewards:
      - loot: comum

  - id: ocelote
    title: "Gatos da Selva"
    type: optional
    deps: [aranha]
    icon: minecraft:fish
    desc: |
      Selvagens e ariscos nas selvas. Domar com peixe cru rende um gatinho, mas o contrato pede ação: derrote §e2§r.

      É uma missão opcional, então escolha com o coração. Aproxime-se devagar, porque eles fogem fácil, e mantenha a espada à mão. A selva é cheia de surpresas, Herói. Boa caçada!
    tasks:
      - kill: {entity: "Ozelot", count: 2}
    rewards:
      - loot: comum

  - id: golem_ferro
    title: "Golem de Ferro"
    type: optional
    deps: [slime]
    icon: minecraft:iron_ingot
    desc: |
      Protetores das aldeias e fonte de ferro. Derrote §e1§r, de preferência um golem seu, para não irritar os aldeões.

      É uma missão opcional, mas o ferro é muito útil. Se tiver um golem seu, use ele para o contrato e evite problemas. Leve boa armadura e uma espada afiada. Paciência e estratégia vencem qualquer grandalhão, Herói!
    tasks:
      - kill: {entity: "VillagerGolem", count: 1}
    rewards:
      - loot: incomum

  - id: husk
    title: "Zumbis do Deserto"
    deps: [zumbi]
    icon: minecraft:rotten_flesh
    desc: |
      Nos desertos aparecem os §eZumbis Secos§r (Husks), que não queimam ao sol. Derrote §e4§r e aplique um pouco de fome no dia a dia.

      Vá com cuidado, porque o deserto não perdoa distração. Leve comida e água, ande de armadura e mantenha a espada à mão. Se precisar, aperte U no NEI para ver mais sobre os drops. Boa caçada, Herói!
    tasks:
      - kill: {entity: "etfuturum.husk", count: 4}
    rewards:
      - xp: 4
      - item: [minecraft:cooked_beef x8]

  - id: stray
    title: "Esqueletos do Gelo"
    deps: [esqueleto]
    icon: minecraft:snowball
    desc: |
      Esqueletos que vivem em biomas gelados e atiram flechas de lentidão. Derrote §e4§r.

      Vá com roupa quente, ou melhor, com armadura! Aproxime-se em zigue-zague para fugir das flechas e golpeie quando estiver perto. O gelo é bonito, mas escorrega. Quando juntar tudo, volte aqui. Boa caçada, Herói!
    tasks:
      - kill: {entity: "etfuturum.stray", count: 4}
    rewards:
      - xp: 4
      - item: [minecraft:arrow x32]

  - id: endermite
    title: "Endermitas"
    type: optional
    deps: [enderman]
    icon: minecraft:ender_eye
    desc: |
      Nascem de pérolas jogadas. Derrote §e3§r, pequenas e chatas.

      Para atraí-las, jogue pérolas do Ender e espere. Elas são fracas, mas incomodam, e ainda atraem os Endermen. Fique de olho, leve uma espada afiada e acabe com elas rápido. Divirta-se, Herói, e boa caçada! Se precisar de mais detalhes, aperte U no NEI.
    tasks:
      - kill: {entity: "etfuturum.endermite", count: 3}
    rewards:
      - loot: comum

  - id: shulker
    title: "Shulkers"
    deps: [dragao_fim]
    icon: minecraft:ender_chest
    desc: |
      Moradores das cidades do Fim, escondidos em conchas. Derrote §e2§r com cuidado (a levitação é irritante).

      Aproxime-se com calma, leve água ou blocos para não cair de altura quando a levitação acabar, e golpeie quando ela abrir. A cidade do Fim é cheia de segredos, Herói. Boa sorte e olho aberto!
    tasks:
      - kill: {entity: "etfuturum.shulker", count: 2}
    rewards:
      - xp: 8
      - loot: raro

  - id: piglin
    title: "Piglins"
    deps: [pigzombie]
    icon: minecraft:gold_ingot
    desc: |
      No Nether do Netherlicious vivem os §ePiglins§r. Derrote §e3§r se precisar, mas ouro na mão costuma agradar mais.

      Esta missão pede ação, então leve uma boa espada e armadura. Atacar um deles pode deixar os outros bravos, então prepare-se para a confusão. Confira no NEI (U) mais sobre eles. Boa sorte, Herói!
    tasks:
      - kill: {entity: "netherlicious.Piglin", count: 3}
    rewards:
      - xp: 5
      - item: [minecraft:gold_ingot x4]

  - id: hoglin
    title: "Hoglins"
    deps: [piglin]
    icon: minecraft:cooked_porkchop
    desc: |
      Javalis do Nether, fortes e teimosos. Derrote §e3§r e ganhe carne e couro.

      Leve uma boa armadura e uma espada afiada, porque eles golpeiam forte. Escolha um lugar com boa saída, para o caso de ter que recuar. A carne e o couro são um bom prêmio, Herói. Boa caçada!
    tasks:
      - kill: {entity: "netherlicious.Hoglin", count: 3}
    rewards:
      - xp: 6
      - item: [minecraft:cooked_porkchop x16]

  - id: zoglin
    title: "Zoglins"
    type: optional
    deps: [hoglin]
    icon: minecraft:rotten_flesh
    desc: |
      Hoglins que viraram mortos-vivos. Derrote §e2§r. São agressivos e atacam qualquer coisa.

