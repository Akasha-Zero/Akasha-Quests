chapter:
  id: runic
  title: "Runic Dungeons"
  order: 240
  icon: runicdungeons:item.magicchalk
  desc: |
    §6Masmorras Rúnicas.§r Giz Mágico, portal, guardiões, chaves, aço rúnico, cristais
    elementais e cintos mágicos. (Runic Dungeons, dimensão Dungeon -34)

quests:
  - id: giz_magico
    title: "Giz Mágico"
    type: main
    icon: runicdungeons:item.magicchalk
    desc: |
      Há páginas do Registro que eu só consegui ler aqui, Herói: as das masmorras rúnicas. Tudo
      começa com o §eGiz Mágico§r, que aparece em §eTemplos Antigos§r. Procure pelo mundo e, se
      não achar, peça ajuda a quem administra o servidor. Guarde o giz: ele é ingrediente de quase
      tudo!
    tasks:
      - get: runicdungeons:item.magicchalk
    rewards:
      - xp: 5
      - choice: [minecraft:gold_ingot x8, minecraft:stonebrick x32]

  - id: tijolos_masmorra
    title: "Tijolos da Masmorra"
    type: main
    deps: [giz_magico]
    icon: runicdungeons:tile.survivalRunicBrick
    desc: |
      Hora de entrar nas masmorras, Herói! Oito §eTijolos de Pedra§r em volta de um Giz Mágico geram §eDungeon Bricks§r (versão de sobrevivência, que quebram).
      Faça uma pilha de 8 para decorar a base e para o portal. Bora!
    tasks:
      - get: runicdungeons:tile.survivalRunicBrick x8
    rewards:
      - xp: 3
      - loot: comum

  - id: tijolos_runicos
    title: "Tijolos Rúnicos"
    type: optional
    deps: [tijolos_masmorra]
    icon: runicdungeons:tile.survivalRunicBrick:3
    desc: |
      Hora de explorar os tijolos misteriosos da masmorra!

      Um Dungeon Brick (rachado) vira §eRunic Dungeon Brick§r numa receita simples. Confira a cadeia de variantes no NEI (R/U), Herói, e faça §e4§r. Cada variante tem seu desenho, então combine com a decoração da sua base. Missão opcional, mas fica uma beleza!
    tasks:
      - get: runicdungeons:tile.survivalRunicBrick:3 x4
    rewards:
      - loot: comum

  - id: portal_runico
    title: "Portal das Masmorras"
    type: portal
    deps: [tijolos_masmorra]
    icon: runicdungeons:tile.runicPortal
    desc: |
      Chegou a hora, Herói! Com o giz você abre um §ePortal das Masmorras§r. O texto do mod diz que §capenas operadores podem criar portais§r, então, se não conseguir, peça para a administração liberar.
      Entre e você chega à dimensão Dungeon. Leve boa armadura, comida e coragem de sobra, porque lá embaixo a aventura é de verdade. Estou torcendo por você!
    tasks:
      - visit: {dim: -34, name: "Dungeon"}
    rewards:
      - xp: 10
      - choice: [minecraft:torch x32, minecraft:cooked_beef x16, minecraft:iron_ingot x8]

  - id: guardiao
    title: "Guardião das Profundezas"
    type: main
    deps: [portal_runico]
    icon: runicdungeons:tile.runeSpawner
    desc: |
      Os §eDungeon Guardians§r protegem as salas da masmorra, Herói. São fortes e atacam em grupo: lute em corredor, com armadura boa e comida de sobra.

      Cada guardião derrotado conta como a conquista 'Guardian of the Depths'. Respire fundo, escolha bem o campo de batalha e vá com tudo. Coragem!
    tasks:
      - kill: "Guardian x1"
    rewards:
      - xp: 8
      - choice: [minecraft:golden_apple x2, minecraft:arrow x64]

  - id: chave_masmorra
    title: "Chave da Masmorra"
    type: main
    deps: [guardiao]
    icon: runicdungeons:item.key
    desc: |
      Procure uma §eDungeon Key§r em baús ou com guardiões, Herói. Ela abre as §eDungeon Keyholes§r (fechaduras) das salas trancadas.
      Isso conta como a conquista 'The Key to Progress!'. Boa busca!
    tasks:
      - get: runicdungeons:item.key
    rewards:
      - xp: 3
      - loot: comum

  - id: fechadura
    title: "Fechadura Misteriosa"
    type: optional
    deps: [chave_masmorra]
    icon: runicdungeons:tile.runicKeyhole
    desc: |
      Use a chave numa §eDungeon Keyhole§r e a porta se abre, Herói! Se não houver fechadura, ela provavelmente está só mais fundo.
      Confira no NEI o que a chave faz. Missão opcional, mas curiosa!
    tasks:
      - get: runicdungeons:tile.runicKeyhole
    rewards:
      - loot: comum

  - id: runas
    title: "Círculos Rúnicos"
    type: optional
    deps: [portal_runico]
    icon: runicdungeons:tile.runicCircle
    desc: |
      As runas no chão guardam segredos, Herói!

      As §eMysterious Runes§r marcam salas especiais. Pisar nelas pode ativar armadilhas ou guardiões, então tome cuidado e observe o ambiente antes de entrar. Qualquer um dos três círculos (comum, pequeno ou grande) serve. Colete uma para estudar e veja detalhes no NEI (U). Missão opcional, mas bem interessante!
    tasks:
      - one_of: [runicdungeons:tile.runicCircle, runicdungeons:tile.runicCircleSmall, runicdungeons:tile.runicCircleLarge]
    rewards:
      - loot: comum

  - id: varinha_traps
    title: "Varinha Anti-Armadilhas"
    type: main
    deps: [giz_magico]
    icon: runicdungeons:item.trapRemover
    desc: |
      A §eTrap Nullification Wand§r leva lã amarela, ouro e giz. Ela desarma as armadilhas da masmorra, Herói!

      Faça antes de ir fundo, porque as armadilhas costumam pegar quem está distraído. Se precisar conferir a receita, o NEI (R/U) mostra o desenho certinho. Seguro morreu de velho!
    tasks:
      - craft: runicdungeons:item.trapRemover
    rewards:
      - xp: 5
      - choice: [minecraft:golden_apple, minecraft:cooked_beef x16]

  - id: cajado
    title: "Cajado Mágico"
    type: optional
    deps: [giz_magico]
    icon: runicdungeons:item.magicstaff
    desc: |
      Esmeralda, diamante, ouro e três Gizes dão o §eMagical Staff§r, Herói.
      Confira o formato da receita no NEI e faça o seu. Missão opcional, mas um cajado sempre cai bem!
    tasks:
      - craft: runicdungeons:item.magicstaff
    rewards:
      - loot: comum

  - id: vidro_runico
    title: "Vidro Rúnico"
    type: optional
    deps: [giz_magico]
    icon: runicdungeons:tile.runicGlass
    desc: |
      Vidro em volta do giz: oito §eRunic Glass§r, Herói!
      Bom para janelas do estilo da masmorra. Missão opcional, mas deixa a base com cara de aventura.
    tasks:
      - get: runicdungeons:tile.runicGlass x8
    rewards:
      - loot: comum

  - id: lampada_runica
    title: "Lâmpada Rúnica"
    type: optional
    deps: [tijolos_masmorra]
    icon: runicdungeons:tile.survivalRunicLamp
    desc: |
      Uma luz com cara de masmorra para a sua base, Herói!

      A receita é sem forma: Tijolo da masmorra + Pedra Luminosa. Ela rende §e4 Lâmpadas Rúnicas§r de uma vez, então você ilumina um cômodo inteiro. Se travar, confira o NEI (R/U) e veja a disposição. Missão opcional, mas ilumina com estilo e deixa tudo mais místico!
    tasks:
      - get: runicdungeons:tile.survivalRunicLamp x4
    rewards:
      - loot: comum

  - id: pilar_runico
    title: "Pilar Rúnico"
    type: optional
    deps: [tijolos_masmorra]
    icon: runicdungeons:tile.survivalRunicPillar
    desc: |
      Dois tijolos da masmorra rendem 4 pilares, Herói. Faça §e4§r deles.

      Os pilares rúnicos dão um ar de templo antigo a qualquer construção. Aposto que vai ficar lindo! Missão opcional, mas capricha na decoração. Se esquecer o desenho da receita, o NEI (R/U) mostra. Divirta-se montando!
    tasks:
      - get: runicdungeons:tile.survivalRunicPillar x4
    rewards:
      - loot: comum

  - id: areia_caotica
    title: "Areia Caótica"
    type: optional
    deps: [portal_runico]
    icon: runicdungeons:tile.chaoticSand
    desc: |
      Areia e Pedra do Fim intercaladas na bancada: Areia Caótica, Herói!
      Confira no NEI como ela se comporta. Missão opcional, mas intrigante.
    tasks:
      - get: runicdungeons:tile.chaoticSand x9
    rewards:
      - loot: comum

  - id: obsidiana_comprimida
    title: "Obsidiana Comprimida"
    type: optional
    deps: [portal_runico]
    icon: runicdungeons:tile.compressedObsidian
    desc: |
      Nove blocos de obsidiana viram um bloco de §eCompressed Obsidian§r, resistente a explosões.
      Bom para fortalecer a base, Herói. Missão opcional, mas segurança é tudo!
    tasks:
      - get: runicdungeons:tile.compressedObsidian
    rewards:
      - loot: comum

  - id: aco_runico
    title: "Aço Rúnico"
    type: main
    deps: [chave_masmorra]
    icon: runicdungeons:item.runicSteel
    desc: |
      Um metal que não nasce na bancada, Herói!

      O §eRunic Steel§r não tem receita de bancada no pack: ele vem de dentro das masmorras. Confira no NEI (U) e explore baús e salas com paciência, porque o caminho exige vasculhar. Quando juntar §e4 lingotes§r, comece a forjar. Boa exploração, o esforço vale muito a pena!
    tasks:
      - get: runicdungeons:item.runicSteel x4
    rewards:
      - xp: 5
      - choice: [minecraft:diamond x2, minecraft:iron_ingot x16]

  - id: espada_runica
    title: "Espada de Aço Rúnico"
    type: main
    deps: [aco_runico]
    icon: runicdungeons:item.runicSteelSword
    desc: |
      Dois lingotes e um graveto: pronto, a §eRunic Steel Sword§r, Herói!

      É uma espada resistente e forte para a batalha, perfeita para encarar as criaturas da masmorra com mais segurança. Reúna o aço rúnico, monte na bancada e confira a receita no NEI (R/U) se precisar. Mãos à obra!
    tasks:
      - craft: runicdungeons:item.runicSteelSword
    rewards:
      - xp: 3
      - loot: comum

  - id: picareta_runica
    title: "Picareta de Aço Rúnico"
    type: optional
    deps: [aco_runico]
    icon: runicdungeons:item.runicSteelPickaxe
    desc: |
      Para extrair o que a masmorra tem, Herói: três lingotes e dois gravetos na bancada, formato de picareta.
      Missão opcional, mas é a ferramenta certa para o trabalho!
    tasks:
      - craft: runicdungeons:item.runicSteelPickaxe
    rewards:
      - loot: comum

  - id: bloco_aco
    title: "Bloco de Aço Rúnico"
    type: optional
    deps: [aco_runico]
    icon: runicdungeons:tile.runicSteelBlock
    desc: |
      Nove lingotes viram um bloco de §eRunic Steel§r, Herói, para decorar ou guardar.
      Missão opcional, mas fica imponente!
    tasks:
      - get: runicdungeons:tile.runicSteelBlock
    rewards:
      - loot: comum

  - id: cristais_elementais
    title: "Cristais Elementais"
    type: main
    deps: [chave_masmorra]
    icon: runicdungeons:item.airCrystal
    desc: |
      Quatro elementos, quatro tesouros, Herói!

      Os cristais de §eAr, Terra, Fogo e Água§r aparecem nas masmorras. Basta um de cada elemento para completar a missão, então não precisa trazer todos de uma vez. Cuidado com as armadilhas dos corredores e confira o NEI (U) se travar. Pegue o que encontrar. Boa caçada!
    tasks:
      - one_of: [runicdungeons:item.airCrystal, runicdungeons:item.earthCrystal, runicdungeons:item.fireCrystal, runicdungeons:item.waterCrystal]
    rewards:
      - xp: 3
      - loot: comum

  - id: cristal_fogo
    title: "Cristal de Fogo"
    type: optional
    deps: [cristais_elementais]
    icon: runicdungeons:item.fireCrystal
    desc: |
      Quando você achar o cristal de Fogo, Herói, guarde-o com carinho. A Masmorra Demoníaca tem mais!

      É uma missão opcional, mas vale a coleção. Explore as salas com calma, abra todos os baús e fique atenta aos monstros. Se quiser saber mais do item, o NEI (R/U) ajuda. Boa busca!
    tasks:
      - get: runicdungeons:item.fireCrystal
    rewards:
      - loot: comum

  - id: cristal_agua
    title: "Cristal de Água"
    type: optional
    deps: [cristais_elementais]
    icon: runicdungeons:item.waterCrystal
    desc: |
      Se encontrar o cristal da água, Herói, guarde bem.
      Confira no NEI se ele serve em alguma receita. Missão opcional!
    tasks:
      - get: runicdungeons:item.waterCrystal
    rewards:
      - loot: comum

  - id: cinto_basico
    title: "Cinto Básico"
    type: main
    deps: [giz_magico]
    icon: runicdungeons:item.basicBelt
    desc: |
      Couro, lingote de ouro e mais couro: §eBasic Belt Base§r, Herói. É a base de todos os cintos!
      Faça o seu e comece a montar o conjunto.
    tasks:
      - craft: runicdungeons:item.basicBelt
    rewards:
      - xp: 3
      - loot: comum

  - id: cinto_flechas
    title: "Cinto de Flechas"
    type: optional
    deps: [cinto_basico]
    icon: runicdungeons:item.beltArrow
    desc: |
      Arqueiros, essa é para vocês, Herói!

      Flecha, cinto e flecha em linha formam o Arrow Belt, o §eCinto de Flechas§r. É útil para quem usa arco, porque deixa as munições à mão no meio da luta. Confira a receita no NEI (R/U) e monte o seu. Missão opcional, mas pratica na hora do combate!
    tasks:
      - craft: runicdungeons:item.beltArrow
    rewards:
      - loot: comum

  - id: cinto_avancado
    title: "Cinto Avançado"
    type: main
    deps: [cinto_basico]
    icon: runicdungeons:item.advancedBelt
    desc: |
      Cinto básico mais Estrela do Nether, sem forma: assim sai a §eAdvanced Belt Base§r, Herói.

      Só dá para fazer depois do Wither, no capítulo do Nether, então não se preocupe se ainda não chegou lá. Guarde a ideia e volte quando estiver pronto. Confira a receita no NEI (R/U) quando chegar a hora!
    tasks:
      - craft: runicdungeons:item.advancedBelt
    rewards:
      - xp: 8
      - choice: [minecraft:feather x8, minecraft:diamond x2]

  - id: cinto_voo
    title: "Cinto de Voo"
    type: milestone
    deps: [cinto_avancado]
    icon: runicdungeons:item.flyBelt
    desc: |
      Pena, Advanced Belt e pena: §eBelt of Flight§r! Você fica no ar, Herói, e eu fico emocionada só de imaginar a cena.

      Aproveite com cuidado e confira o gasto de durabilidade no NEI antes de se empolgar demais. Esse é um marco e tanto na sua jornada pelas masmorras, então comemore! Você enfrentou salas, runas e armadilhas para chegar até aqui, e merece cada metro de altura. Você chegou longe, e o céu agora é seu quintal. Voe com segurança e prepare-se para o que vem a seguir!
    tasks:
      - craft: runicdungeons:item.flyBelt
    rewards:
      - xp: 10
      - loot: raro

  - id: masmorra_demoniaca
    title: "Masmorra Demoníaca"
    type: optional
    deps: [portal_runico]
    icon: runicdungeons:tile.survivalDemonicBrick
    desc: |
      Tijolos do Nether em volta do giz fazem §eDemonic Bricks§r: a conquista 'Fire and Brimstone' leva à Masmorra Demoníaca.
      §cPerigosa!§r Guarde recursos e entre de armadura completa, Herói. Missão opcional, mas com muita fama!
    tasks:
      - get: runicdungeons:tile.survivalDemonicBrick x8
    rewards:
      - loot: comum

  - id: cavalgada
    title: "Montaria Rúnica"
    type: optional
    deps: [cinto_basico]
    icon: runicdungeons:item.rider
    desc: |
      Rédea + sela, receita sem forma: Rider (WIP).
      Experimental, Herói. Use por sua conta e risco! Missão opcional.
    tasks:
      - get: runicdungeons:item.rider
    rewards:
      - loot: comum

  - id: estante
    title: "Estante Antiga"
    type: optional
    deps: [portal_runico]
    icon: runicdungeons:tile.ancientBookshelf
    desc: |
      Um pedacinho de biblioteca antiga espera por você, Herói!

      A §eAncient Bookshelf§r aparece nas salas das masmorras. Procure com calma entre os corredores e baús, e traga uma para a base como lembrança. Se tiver dúvida de onde ela surge, o NEI (U) ajuda. Missão opcional, mas um charme de recordação!
    tasks:
      - get: runicdungeons:tile.ancientBookshelf
    rewards:
      - loot: comum

  - id: senhor_masmorra
    title: "Senhor das Masmorras"
    type: milestone
    deps: [chave_masmorra, espada_runica, cinto_voo]
    icon: runicdungeons:item.runicSteel
    desc: |
      Você já tem chave, aço, cristais e cinto, Herói, e está na hora de provar o seu valor! Mostre que dominou os salões: derrote mais guardiões e traga o Aço Rúnico completo. São §e5 Guardiões§r para derrubar, um desafio e tanto.
      Este é o marco do capítulo, e eu não poderia estar mais orgulhosa da sua jornada até aqui. Respire fundo, confira a armadura e a comida, e vá com tudo. Os salões das masmorras são seus! Depois da vitória, outros desafios do Registro esperam por você.
    tasks:
      - kill: "Guardian x5"
    rewards:
      - xp: 15
      - kit: {name: "Kit do Explorador de Masmorras", items: ["minecraft:diamond x4", "minecraft:golden_apple x4", "minecraft:experience_bottle x16"]}
      - loot: raro
