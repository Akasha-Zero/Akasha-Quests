      Herói, olhe só para tudo o que você viveu: minérios raros, dimensões misteriosas, chefes enormes e itens poderosos. Que a coleção fique completa! Este é o marco do capítulo, e eu estou muito orgulhosa de você.
      Se ainda houver quests opcionais pelo caminho, volte quando quiser e complete no seu tempo. Guarde os troféus com carinho e confira o NEI (R/U) para lembrar das receitas. A jornada continua, e eu vou estar aqui com você. Parabéns pela conquista! Respire, sorria e comemore!
