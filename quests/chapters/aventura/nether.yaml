    desc: |
      O §eHellderberry§r cresce em arbustos no Nether e rende sucos, biscoitos e mais.
      Tenha o seu estoque de comida lá, Herói! Junte quatro frutinhas e confira as receitas no NEI (R/U). Missão opcional, mas gostosa!
    tasks:
      - get: netherlicious:HellderBerryItem x4
    rewards:
      - loot: comum

  - id: aveia_abissal
    title: "Comida Infernal"
    type: optional
    deps: [entrar_nether]
    icon: netherlicious:AbyssalOatItem
    desc: |
      Plante §eAbyssal Oat§r ou §eDevilish Maize§r para ter comida sem sair de casa.
      Confira as sementes no NEI (R/U), Herói. Missão opcional, mas uma boa maneira de garantir o estoque no Nether!
    tasks:
      - one_of: [netherlicious:AbyssalOatItem, netherlicious:DevilishMaizeItem, netherlicious:InfernalReedItem]
    rewards:
      - loot: comum

  - id: bife_strider
    title: "Filé de Strider"
    type: optional
    deps: [strider]
    icon: netherlicious:StriderFlankCooked
    desc: |
      Asse a carne do Strider e tenha uma boa comida cheia de saturação.
      Junte quatro §eFilés de Strider§r, Herói. Missão opcional, mas uma refeição de respeito para as suas aventuras!
    tasks:
      - get: netherlicious:StriderFlankCooked x4
    rewards:
      - loot: comum

  - id: disco_pigstep
    title: "Disco Pigstep"
    type: optional
    deps: [entrar_nether]
    icon: netherlicious:Pigstep
    desc: |
      Alguns baús do Nether guardam um disco §ePigstep§r. Procure em ruínas de portal e bastiões, se houver.
