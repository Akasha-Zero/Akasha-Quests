    rewards:
      - loot: comum

  - id: suporte_pocoes
    title: "Laboratório do Inferno"
    type: milestone
    deps: [vara_blaze, nether_wart]
    icon: minecraft:brewing_stand
    desc: |
      Chegou a hora de ter um laboratório, Herói! Com Vara de Blaze e Nether Wart, monte um §eSuporte de Poções§r. Poção de Regeneração e Resistência ao Fogo são ótimas contra o Wither.
      Guarde seu equipamento de alquimia com carinho: este é o primeiro passo para enfrentar o grande desafio que vem por aí.
      Parabéns por chegar até aqui. Você está indo muito bem!
    tasks:
      - get: minecraft:brewing_stand
    rewards:
      - xp: 10
      - loot: raro

  - id: pocao_cura
    title: "Poção de Cura"
    type: optional
    deps: [suporte_pocoes]
    icon: minecraft:potion:8261
    desc: |
      §aDica:§r traga bastante §ePoção de Cura§r ou maçãs douradas. O Wither dá efeito de degradação que não pode ser bloqueado só com armadura.
      Missão opcional, Herói, mas faz toda a diferença na hora do combate. Junte duas e vá preparado!
    tasks:
      - get: minecraft:potion:8261 x2
    rewards:
      - loot: comum

  - id: wither
    title: "O Selo do Abismo"
    type: boss
    deps: [cranios, areia_almas, suporte_pocoes]
    banner: "O Wither foi derrotado!"
    subtitle: "O Selo do Abismo foi quebrado"
    task_logic: OR
    icon: minecraft:nether_star
    desc: |
      Hora do chefe, Herói. Monte uma estrutura em T com §e4 Areias de Almas§r e coloque os §e3
      Crânios§r em cima, num lugar aberto e longe da base: §cele explode blocos!§r Aguente o
      primeiro estágio de saúde e depois ele voa. Leve arco, poções de cura e armadura de diamante
      ou de Efrine. Ao cair, ele solta a §eEstrela do Nether§r. Este é o §eSelo do Abismo§r, o
      marco que o resto da aventura reconhece.
    tasks:
      - kill: {entity: "WitherBoss", count: 1}
      - get: minecraft:nether_star
    rewards:
      - xp: 15
      - loot: epico

  - id: sinalizador_nether
    title: "Sinalizador"
    type: milestone
    deps: [wither]
    icon: minecraft:beacon
    desc: |
      Estrela do Nether, vidro e obsidiana fazem o §eSinalizador§r. Uma alternativa de menor custo é a §eNether Beacon§r do Netherlicious (veja a receita no NEI (R/U)): vidro, estrela, tijolos e quartzo.
      Escolha o seu caminho, Herói, e monte o farol para ganhar bônus poderosos.
      Você merece essa comemoração. Parabéns por mais uma conquista!
    tasks:
      - one_of: [minecraft:beacon, netherlicious:NetherBeacon]
    rewards:
      - xp: 10
      - kit: {name: "Kit do Senhor do Nether", items: ["minecraft:diamond x8", "minecraft:golden_apple x4", "minecraft:experience_bottle x16"]}
      - loot: raro

  - id: refugio
