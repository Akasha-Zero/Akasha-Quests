    type: optional
    deps: [ancora]
    icon: netherlicious:SoulTorch
    desc: |
      Último passo, Herói: monte um pequeno refúgio com Respawn Anchor ou cama, tochas de alma e baús.
      Assim o Nether vira sua segunda casa. Você já é digno! Missão opcional, mas aconchegante.
    tasks:
      - get: netherlicious:SoulTorch x4
    rewards:
      - loot: comum
