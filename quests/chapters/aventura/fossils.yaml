    icon: fossil:tardrop
    desc: |
      As gotas de piche pingam das criaturas de piche. Junte algumas para usar no Dinopédia e nas receitas.
      É opcional, Herói, mas as gotas ajudam bastante em outras receitas. Procure as criaturas nos poços de piche e junte §e4§r. Se tiver dúvida de onde achar ou do uso, aperte R ou U no NEI ou consulte o Dinopédia. Vai com cuidado!
    tasks:
      - get: fossil:tardrop x4
    rewards:
      - loot: comum

  - id: lesma_piche
    title: "Lodo de Piche"
    type: optional
    deps: [balde_piche]
    icon: fossil:tardrop
    desc: |
      O §eLodo de Piche§r nasce nos poços. Mate três e colete o que deixarem.
      Cuidado onde pisa, Herói: esses bichinhos grudam em tudo e o piche é lento. Leve uma boa arma e uma armadura firme. Se tiver dúvida de onde achar, aperte R ou U no NEI ou consulte o Dinopédia. Derrote §e3 lodos§r e volte para me contar!
    tasks:
      - kill: {entity: "fossil.TarSlime", count: 3}
    rewards:
      - xp: 3
      - item: [minecraft:slime_ball x4]

  - id: failuresaurus
    title: "Failuresaurus"
    type: optional
    deps: [cuba_cultura]
    icon: fossil:failuresaurusFlesh
    desc: |
      Quando a Cuba dá errado, sai um §eFailuresaurus§r, uma lesma branca e dócil. Mate uma (sem culpa!) e junte a carne.
      É opcional, Herói, e mais cômico do que perigoso. Se a Cuba falhar por algum motivo, o bicho aparece. Se tiver dúvida do processo, aperte R ou U no NEI ou consulte o Dinopédia. Paciência, e ânimo!
    tasks:
      - kill: {entity: "fossil.Failuresaurus", count: 1}
    rewards:
      - xp: 3
      - loot: comum

  - id: minerio_ambar
    title: "Minério de Âmbar"
    deps: [bio_fossil]
    icon: fossil:amberOre
    desc: |
      Mosquitos presos em resina há milhões de anos guardam DNA. O §eMinério de Âmbar§r aparece em profundidades médias.
      Vá com picareta e tochas, Herói, e explore as cavernas. Se tiver dificuldade de achar, aperte R ou U no NEI para ver onde ele costuma gerar, ou consulte o Dinopédia. Que descoberta incrível te espera lá embaixo!
    tasks:
      - get: fossil:amberOre
    rewards:
      - xp: 3
      - choice: [minecraft:iron_pickaxe, minecraft:torch x32]

  - id: ambar_dominicano
    title: "Âmbar Dominicano"
    deps: [minerio_ambar]
    icon: fossil:DominicanAmber
    desc: |
      O §eÂmbar Dominicano§r contém DNA muito bom. Lapide com cuidado e passe pelo Analisador.
      Se você ainda não sabe o passo a passo, Herói, confira no NEI (R/U) ou no Dinopédia. Respire fundo, trabalhe com calma e tenha paciência com o processo. O DNA dos mosquitos pré-históricos vale cada minutinho. Vai fundo!
    tasks:
      - get: fossil:DominicanAmber
    rewards:
      - xp: 5
      - loot: incomum

  - id: gema_escaravelho
    title: "Gema de Escaravelho"
    type: main
    deps: [bio_fossil]
    icon: fossil:scarabGem
    desc: |
      Um brilho azul no bloco de fóssil! A §eGema de Escaravelho§r é rara e mágica. Procure em blocos de fóssil de todos os cantos.

      Com ela você faz ferramentas muito melhores que o ouro. Paciência, Herói: é uma gema rara e pode demorar. Se tiver dúvida de onde ela aparece, aperte R ou U no NEI. Boa sorte na caçada!
    tasks:
      - get: fossil:scarabGem
    rewards:
      - xp: 6
      - loot: raro

  - id: ferramentas_escaravelho
    title: "Ferramentas de Escaravelho"
    deps: [gema_escaravelho]
    icon: fossil:scarabPickAxe
    desc: |
      Pegue uma ferramenta de ouro ou diamante e uma gema: a §eFerramenta de Escaravelho§r é muito poderosa. Faça pelo menos uma e depois a coleção toda.
      Escolha a ferramenta que você mais usa, Herói, e comece por ela. Se a receita não encaixar, aperte R ou U no NEI ou consulte o Dinopédia. Que orgulho de ver você com equipamento tão bom!
    tasks:
      - one_of: [fossil:scarabAxe, fossil:scarabPickAxe, fossil:scarabSword, fossil:scarabHoe, fossil:scarabShovel]
    rewards:
      - xp: 8
      - loot: raro

  - id: gema_aquatica
    title: "Gema Aquática"
    type: optional
    deps: [ambar_dominicano, gema_escaravelho]
    icon: fossil:AquaticScarabGem
    desc: |
      Âmbar Dominicano mais Gema de Escaravelho: a §eGema Aquática§r. Confira no NEI e no Dinopédia o que ela faz.
      É opcional, Herói, mas guarde com carinho. Reúna os dois ingredientes, vá à bancada e monte a gema. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Que combinação bonita, né?
    tasks:
      - get: fossil:AquaticScarabGem
    rewards:
      - xp: 6
      - loot: raro

  - id: maquina_tempo
    title: "Máquina do Tempo"
    type: milestone
    deps: [ferramentas_escaravelho, cuba_cultura]
    banner: "O Tempo cedeu"
    subtitle: "A Máquina do Tempo é sua"
    icon: fossil:timeMachine
    desc: |
      Chegou o grande momento, Herói! Gemas de Escaravelho, Estrela do Nether, pérolas, ouro e obsidiana (grade completa no NEI) formam a §eMáquina do Tempo§r. Craftar já é uma façanha!
      Reúna todos os materiais com calma antes de montar, porque vários deles são raros e vão demandar exploração. Se a grade confundir, aperte R ou U no NEI para conferir a receita, ou consulte o Dinopédia. Respire fundo, monte peça por peça e comemore quando ela ficar pronta. Eu estou muito orgulhosa de você!
    tasks:
      - get: fossil:timeMachine
    rewards:
      - xp: 15
      - kit: {name: "Kit do Arqueólogo", items: [fossil:scarabGem x2, minecraft:golden_apple x4, minecraft:diamond x4]}
      - loot: raro

  - id: palaeoraphe
    title: "Palmeira Palaeoraphe"
    type: optional
    deps: [bio_fossil]
    icon: fossil:palaeorapheSapling
    desc: |
      Uma palmeira de 100 milhões de anos! Plante a §eMuda de Palaeoraphe§r e colha tronco, folhas e tábuas.
      É opcional, Herói, mas dá um toque pré-histórico ao seu jardim e rende madeira diferente para construir. Se não souber onde achar a muda, aperte R ou U no NEI ou consulte o manual do mod. Plante com carinho e aguarde a árvore crescer!
    tasks:
      - get: fossil:palaeorapheSapling
      - get: fossil:palaeorapheLog
    rewards:
      - xp: 4
      - loot: comum

  - id: madeira_antiga
    title: "Madeira e Pedra Antigas"
    type: optional
    deps: [mesa_arqueologia]
    icon: fossil:ancientStone
    desc: |
      Blocos decorativos de uma civilização perdida: §ePedra Antiga§r, §eMadeira Antiga§r, §eVidro Antigo§r e variantes. Ótimos para construir seu templo.
      É opcional, Herói, mas deixa a base com aquele ar de ruína majestosa. Se não souber como obter cada bloco, aperte R ou U no NEI ou consulte o Dinopédia. Construa um templo digno de lenda!
    tasks:
      - get: fossil:ancientStone
      - get: fossil:ancientWood
      - get: fossil:ancientGlass
    rewards:
      - loot: incomum

  - id: vulcanica
    title: "Rocha Vulcânica"
    type: optional
    deps: [bio_fossil]
    icon: fossil:volcanicRock
    desc: |
      Cinzas e tijolos vulcânicos para casas escuras e firmes. Confira a lista de blocos no NEI.
      É opcional, Herói, mas dá uma pegada bem diferente às construções. Se não souber como obter cada bloco, aperte R ou U no NEI ou consulte o Dinopédia. Junte um pouco de cada para ver qual combina mais com a sua base!
    tasks:
      - get: fossil:volcanicAsh
      - get: fossil:volcanicBrick
      - get: fossil:volcanicRock
    rewards:
      - loot: comum

  - id: espinhos
    title: "Espinhos de Obsidiana"
    type: optional
    deps: [vulcanica]
    icon: fossil:obsidianSpikes
    desc: |
      Um bloco perigoso: os §eEspinhos de Obsidiana§r causam dano a quem passar. Ótimo para armadilhas.
      É opcional, Herói, mas cuidado onde você posiciona, para não se espetar sem querer! Se a receita não encaixar, aperte R ou U no NEI ou consulte o Dinopédia. Instale com carinho e proteja a sua base com estilo.
    tasks:
      - get: fossil:obsidianSpikes
    rewards:
      - loot: comum

  - id: permafrost
    title: "Permafrost"
    type: optional
    deps: [bio_fossil]
    icon: fossil:permafrost
    desc: |
      Gelo eterno guarda mamutes congelados. Procure em biomas gelados o §ePermafrost§r, a §ePedra Gelada§r e a §eCarne Congelada§r.
      Vá bem agasalhado, Herói, e leve tochas. É opcional, mas curioso para explorar. Se não souber onde ficam, aperte R ou U no NEI ou consulte o Dinopédia. Boa exploração, e cuidado com o frio!
    tasks:
      - get: fossil:permafrost
      - get: fossil:icedStone
      - get: fossil:icedMeat
    rewards:
      - xp: 3
      - loot: incomum

  - id: plantas_fosseis
    title: "Plantas Fósseis"
    type: optional
    deps: [fossil_vegetal]
    icon: fossil:fernSeeds
    desc: |
      Samambaias e plantas antigas voltam à vida: as §eSementes de Samambaia§r e outras mudas pré-históricas crescem em jardins temáticos.
      É opcional, Herói, mas deixa o museu verdinho e vivo. Se não souber onde achar as sementes, aperte R ou U no NEI ou consulte o Dinopédia. Plante com carinho e monte o seu jardim jurássico!
    tasks:
      - get: fossil:fernSeeds
    rewards:
      - loot: comum

  - id: discos
    title: "Discos Fósseis"
    type: optional
    deps: [dinopedia]
    icon: fossil:record_bones
    desc: |
      Música da Terra antes dos homens. Ache um dos §eDiscos Fósseis§r e coloque na vitrola.
      É opcional, Herói, mas dá um clima de exploração delicioso. Procure nas ruínas e escavações; se não souber onde ficam, aperte R ou U no NEI ou consulte o Dinopédia. Depois é só dar o play e curtir a trilha da pré-história!
    tasks:
      - one_of: [fossil:record_bones, fossil:record_bones_disc, fossil:record_scarab, fossil:record_discovery]
    rewards:
      - loot: incomum

  - id: estatua_anu
    title: "Estátua de Anu"
    type: main
    deps: [maquina_tempo]
    icon: fossil:anu_block
    desc: |
      Algo sinistro dorme sob a terra... Procure a §eEstátua de Anu§r (o Ídolo Misterioso): ela fica em ruínas e estruturas antigas.

      Ela é a chave para a Terra das Trevas. Leve armadura boa, poções e comida, Herói. Se não souber onde achar, aperte R ou U no NEI ou consulte o Dinopédia. Respire fundo e vá com cautela!
    tasks:
      - get: fossil:anu_block
    rewards:
      - xp: 10
      - item: [minecraft:golden_apple x2]

  - id: portal_anu
    title: "Terra das Trevas"
    type: portal
    deps: [estatua_anu]
    effect: 3
    icon: fossil:anu_portal
    desc: |
      Ative o ídolo e o portal se abre. Do outro lado fica a §eTerra das Trevas§r (dimensão 63), um mundo cinza e frio onde os mortos andam. Você chegou até o portal, Herói, e isso já é uma grande conquista!

      §cPerigo:§r leve itens para a volta! Existe um §ePortal do Mundo Normal§r (Overworld Portal) para retornar. Se não achar, confira o NEI e o Dinopédia. Entre preparado, com boa armadura e comida, e volte contando histórias. Boa sorte! O Dinopédia também guarda dicas sobre as criaturas que você vai encontrar lá.
    tasks:
      - visit: {dim: 63, name: "Terra das Trevas"}
    rewards:
      - xp: 15
      - loot: raro

  - id: anubita
    title: "Anubitas"
    deps: [portal_anu]
    icon: fossil:AnubiteStatue
    desc: |
      Estátuas que andam! Os §eAnubitas§r guardam a Terra das Trevas. Derrote três com uma boa espada e cuidado com as investidas.
      Leve armadura e arma de respeito, Herói, e nada de correr para o meio deles sem plano. Leve poções de cura e comida. Se precisar de ajuda com o equipamento, aperte R ou U no NEI. Derrote §e3 Anubitas§r e volte para me contar!
    tasks:
      - kill: {entity: "fossil.Anubite", count: 3}
    rewards:
      - xp: 8
      - item: [minecraft:golden_apple x2]

  - id: sentinela
    title: "Sentinela Pigman"
    deps: [portal_anu]
    icon: minecraft:rotten_flesh
    desc: |
      Pigmen em armadura escura vigiam Anu. Derrote dois §eSentinelas§r para limpar o caminho.
      Vá com armadura boa e uma arma afiada, Herói, e fique de olho na vida: eles não perdoam. Leve também poções e comida. Se precisar de ideias de equipamento, aperte R ou U no NEI. Derrote §e2 Sentinelas§r e abra caminho!
    tasks:
      - kill: {entity: "fossil.SentryPigman", count: 2}
    rewards:
      - xp: 6
      - item: [minecraft:cooked_porkchop x16]

  - id: anu
    title: "Anu, Rei dos Mortos"
    type: boss
    deps: [anubita, sentinela]
    banner: "Anu foi derrotado!"
    subtitle: "A Terra das Trevas respira de novo"
    icon: fossil:anu_block
    desc: |
      O governante do submundo acorda, Herói! §eAnu§r é um porcão colossal com muita vida, invoca raios e chama seus súditos para a luta.

      §cTática:§r combata em área ampla, arqueiros nas pontas, poções de cura e armadura encantada. Ele derruba a §eChave Antiga§r. Leve comida de sobra, mantenha o foco no chefe e não se deixe cercar pelos súditos. Se precisar de ideias de equipamento, aperte R ou U no NEI. Respire fundo, confie no seu preparo e no seu equipamento, e lembre que cada golpe te aproxima da Chave Antiga. Eu acredito em você!
    tasks:
      - kill: {entity: "fossil.PigBoss", count: 1}
    rewards:
      - xp: 20
      - loot: epico

  - id: chave_antiga
    title: "Chave Antiga"
    type: main
    deps: [anu]
    icon: fossil:ancientKey
    desc: |
      Anu largou a §eChave Antiga§r. Ela abre a porta mais secreta de todas: a Sala do Tesouro Antigo.
      Guarde bem, Herói, que não dá para fazer outra! Se não souber onde usar, aperte R ou U no NEI ou consulte o Dinopédia. A próxima quest já te leva até a sala. Prepare o inventário e se prepare para as relíquias!
    tasks:
      - get: fossil:ancientKey
    rewards:
      - xp: 10
      - loot: raro

  - id: sala_tesouro
    title: "Sala do Tesouro Antigo"
    type: portal
    deps: [chave_antiga]
    effect: 4
    icon: fossil:ancientChest
    desc: |
      Use a chave no local indicado e entre na §eSala do Tesouro Antigo§r (dimensão 62). É um cofre do tempo: baús, armadilhas e relíquias.

      Leve espaço no inventário, Herói, e vá com calma: onde há tesouro também há armadilha. Se precisar relembrar o caminho ou o que levar, aperte R ou U no NEI ou consulte o Dinopédia. Que as relíquias sejam todas suas! Boa exploração, viu? Confie no seu instinto, desvie das armadilhas e volte com a mochila cheia de histórias para contar à Akasha.
    tasks:
      - visit: {dim: 62, name: "Sala do Tesouro Antigo"}
    rewards:
      - xp: 15
      - loot: epico

  - id: bau_antigo
    title: "Baú do Tesouro Antigo"
    type: main
    deps: [sala_tesouro]
    icon: fossil:ancientChest
    desc: |
      O §eBaú do Tesouro Antigo§r guarda as melhores relíquias do mod. Abra com cuidado e leve tudo.
      Vá com espaço no inventário, Herói! Cuidado com as armadilhas ao redor, e se tiver dúvida do que fazer lá dentro, aperte R ou U no NEI ou consulte o Dinopédia. Você merece cada relíquia depois de tanta jornada!
    tasks:
      - get: fossil:ancientChest
    rewards:
      - xp: 10
      - loot: epico

  - id: relogio_antigo
    title: "Relógio Antigo"
    type: optional
    deps: [sala_tesouro]
    icon: fossil:ancientClock
    desc: |
      Um relógio parado há eras. Dizem que ele marca a hora em que os fósseis voltam a viver. Confira no Dinopédia.
      É opcional, Herói, mas cheio de mistério. Se não souber como obter ou usar, aperte R ou U no NEI ou consulte o manual do mod. Guarde com carinho: quem sabe a hora certa não chega?
    tasks:
      - get: fossil:ancientClock
    rewards:
      - loot: raro

  - id: javelinas
    title: "Dardos de Caça"
    type: optional
    deps: [espada_antiga]
    icon: fossil:ancientJavelin
    desc: |
      Arremessos antigos! Experimente os dardos de madeira, pedra, ferro, ouro, diamante e o mais raro, o §eAntigo§r.
      É opcional, Herói, mas uma delícia de usar! Faça qualquer um e teste a pontaria. Se a receita não encaixar, aperte R ou U no NEI ou consulte o Dinopédia. Boa mira, e cuidado para não arremessar no pet!
    tasks:
      - one_of: [fossil:woodJavelin, fossil:stoneJavelin, fossil:ironJavelin, fossil:goldJavelin, fossil:diamondJavelin, fossil:ancientJavelin]
    rewards:
      - loot: incomum

  - id: sarcofago
    title: "Sarcófago Misterioso"
    type: optional
    deps: [anu]
    icon: fossil:sarcophagus
    desc: |
      Dentro das tumbas há sarcófagos lacrados. Abra um com a chave certa e veja o que sai.
      É opcional, Herói, mas cheio de mistério. Leve a chave e fique atento ao que há por perto, porque nunca se sabe. Se tiver dúvida de onde achar ou como abrir, aperte R ou U no NEI ou consulte o Dinopédia. Coragem, e boa sorte!
    tasks:
      - get: fossil:sarcophagus
    rewards:
      - loot: raro

  - id: fim_fossil
    title: "Mestre Arqueólogo"
    type: milestone
    deps: [anu, chave_antiga, ovo_rex, embrioes_gelo]
    banner: "Mestre Arqueólogo"
    subtitle: "O passado agora é seu"
    icon: fossil:dinoPedia
    desc: |
      Do bloco de fóssil ao Rei dos Mortos, Herói. Você tem o laboratório, os ovos, as armas dos antigos e a chave de Anu.

      Agora o Registro tem um capítulo novo sobre você. Continue, tem mais mundo para desenterrar! Respire fundo, olhe tudo o que construiu e se orgulhe. Foi uma jornada e tanto, e eu estou muito feliz de ter caminhado com você. Quando estiver pronto, o próximo capítulo te espera. Vamos? Que jornada, Herói! Guarde tudo o que conquistou e vá com calma rumo ao próximo desafio.
    tasks:
      - check
    rewards:
      - xp: 20
      - kit: {name: "Kit do Mestre Arqueólogo", items: [fossil:scarabGem x2, minecraft:diamond x8, minecraft:golden_apple x8]}
      - loot: lendario
