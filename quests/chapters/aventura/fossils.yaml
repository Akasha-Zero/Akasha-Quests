# Fossils and Archeology Revival 7.3.2.1 (namespace fossil, dimensoes 62/63, chefe Anu).
# Ver docs/mods/fossils.md.
chapter:
  id: fossils
  title: "Fósseis e Arqueologia"
  order: 255
  icon: fossil:analyzer
  desc: |
    §6Escavar, analisar, reviver.§r Do bloco de fóssil ao Analisador e à Cuba de Cultura; da
    dimensão sombria de Anu à Sala do Tesouro Antigo. A pré-história inteira, no seu laboratório.
quests:

  - id: inicio_fossil
    title: "Escavando o Registro"
    type: info
    icon: fossil:analyzer
    desc: |
      Herói, cada camada de terra é uma página que o tempo escreveu. Em §eFósseis e Arqueologia§r
      você vai desenterrar ossos, analisá-los, extrair DNA e, com a §eCuba de Cultura§r, trazer a
      pré-história de volta.

      No fim da estrada existe um portal sombrio, uma dimensão de escuridão e o rei dos mortos,
      §eAnu§r. Mas calma, uma pá de cada vez!
    tasks:
      - check
    rewards:
      - xp: 1

  - id: bloco_fossil
    title: "Bloco de Fóssil"
    type: main
    deps: [inicio_fossil]
    icon: fossil:fossil
    desc: |
      O §eBloco de Fóssil§r aparece em camadas profundas e em desertos. Quando o quebrar, ele solta o essencial da arqueologia.

      Leve uma picareta de ferro e tochas. Se encontrar uma dessas na superfície, é sinal de sítio arqueológico por perto. Explore com calma, Herói, e se não souber onde procurar, aperte R ou U no NEI. Boa escavação, hein!
    tasks:
      - get: fossil:fossil
    rewards:
      - xp: 3
      - choice: [minecraft:iron_pickaxe, minecraft:torch x32, minecraft:bread x8]

  - id: bio_fossil
    title: "Bio-Fóssil"
    type: main
    deps: [bloco_fossil]
    icon: fossil:bioFossil
    desc: |
      Do bloco sai o §eBio-Fóssil§r: carne e osso petrificados com DNA dentro. Junte alguns, porque você vai gastar dezenas. A tarefa pede §e8§r.

      Também aparece o §eFóssil Vegetal§r e o §eFóssil de Piche§r, úteis para outras linhas de pesquisa. Escave com paciência, Herói, e guarde tudo na mochila. Se tiver dúvida sobre os usos, o NEI (R/U) responde.
    tasks:
      - get: fossil:bioFossil x8
    rewards:
      - xp: 3
      - item: [minecraft:iron_ingot x16, minecraft:redstone x8]

  - id: fossil_vegetal
    title: "Fóssil Vegetal"
    deps: [bio_fossil]
    icon: fossil:plantFossil
    desc: |
      Folhas e troncos petrificados! Servem para estudar a flora da era dos dinossauros e, claro, para o Dinopedia dos botânicos.
      Junte §e2§r, Herói. Eles aparecem nas escavações, junto dos outros fósseis, então continue quebrando blocos de fóssil. Se quiser ver outros usos, aperte R ou U no NEI ou consulte o manual do mod. Bom achado, e boa leitura!
    tasks:
      - get: fossil:plantFossil x2
    rewards:
      - xp: 2

  - id: fossil_piche
    title: "Fóssil de Piche"
    deps: [bio_fossil]
    icon: fossil:tar_fossil
    desc: |
      Quem fica preso no betume vira fóssil de piche. Procure em poços de piche (§etar§r) nas partes profundas do mundo.
      Leve tochas e uma picareta, Herói, porque lá embaixo a visibilidade não ajuda. Se não achar de primeira, tente outra região ou aperte R ou U no NEI para ver como ele é obtido. Vai fundo na escavação!
    tasks:
      - get: fossil:tar_fossil
    rewards:
      - xp: 3
      - choice: [minecraft:torch x32, minecraft:bucket]

  - id: sucata_reliquia
    title: "Sucata de Relíquia"
    type: main
    deps: [bio_fossil]
    icon: fossil:relicScrap
    desc: |
      Pequenos pedaços de metal antigo e peças de vaso aparecem nos mesmos sítios. A §eSucata de Relíquia§r é item-chave: sem ela, nada de Analisador. A tarefa pede §e2§r.

      Quebre blocos de fóssil e procure nas escavações. Paciência, Herói, que o laboratório depende dela. Se precisar rever onde obter, aperte R ou U no NEI. Bora escavar!
    tasks:
      - get: fossil:relicScrap x2
    rewards:
      - xp: 3
      - item: [minecraft:iron_ingot x8]

  - id: dinopedia
    title: "Dinopédia"
    type: main
    deps: [bio_fossil]
    icon: fossil:dinoPedia
    desc: |
      Livro mais um Bio-Fóssil. O §eDinopédia§r é seu guia de campo: clique em qualquer criatura e ele conta tudo, da dieta à vida social.

      Útil demais, Herói. Leve sempre no atalho. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Boa leitura, e boas descobertas pré-históricas!
    tasks:
      - get: fossil:dinoPedia
    rewards:
      - xp: 4
      - item: [minecraft:book x4, minecraft:paper x16]

  - id: analisador
    title: "Analisador"
    type: main
    deps: [sucata_reliquia, bio_fossil]
    icon: fossil:analyzer
    desc: |
      O §eAnalisador§r é o coração do laboratório: ferro em volta, uma Sucata de Relíquia e um Bio-Fóssil (grade completa no NEI).

      Coloque fósseis nele para extrair §eDNA§r aleatório de criaturas pré-históricas. Quanto mais fósseis, mais variedade. Posicione-o num lugar fixo da sua base, Herói. Se a grade confundir, aperte R ou U no NEI e veja a receita!
    tasks:
      - get: fossil:analyzer
    rewards:
      - xp: 6
      - item: [minecraft:iron_ingot x16, minecraft:glass x8]

  - id: mesa_arqueologia
    title: "Mesa de Arqueologia"
    type: main
    deps: [bio_fossil]
    icon: fossil:fossilworkbench
    desc: |
      Papel e uma bancada de madeira dão a §eMesa de Arqueologia§r. É nela que você restaura ossos, vasos e armas quebradas antes de expor ou usar.

      Fique de olho nos slots: ela só aceita fragmentos do mesmo tipo. Organize os achados antes de começar, Herói. Se a receita não encaixar, confira no NEI (R/U). Que a restauração seja linda!
    tasks:
      - get: fossil:fossilworkbench
    rewards:
      - xp: 4
      - item: [minecraft:paper x16, minecraft:planks x16]

  - id: peneira
    title: "Peneira"
    type: optional
    deps: [mesa_arqueologia]
    icon: fossil:sifter
    desc: |
      Corda, tábuas e grades de ferro: a §ePeneira§r separa o tesouro da areia. Deixe cascalho e areia nela e veja o que sai.

      Vale o tempo, Herói: caquinhos, sucata e até gemas aparecem. É opcional, mas dá aquela sensação de garimpo. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Bom garimpo!
    tasks:
      - get: fossil:sifter
    rewards:
      - xp: 3
      - item: [minecraft:sand x32, minecraft:gravel x32]

  - id: vidro_reforcado
    title: "Vidro Reforçado"
    type: optional
    deps: [peneira]
    icon: fossil:strongGlass
    desc: |
      Areia densa na fornalha dá o §eVidro Reforçado§r, usado na Cuba de Cultura e em vitrines de museu. A tarefa pede §e4§r.
      É opcional, Herói, mas vai te poupar tempo mais adiante. Reúna a areia densa, acenda a fornalha e espere. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Vai ficar bonito!
    tasks:
      - get: fossil:strongGlass x4
    rewards:
      - loot: comum

  - id: tablete
    title: "Tábua de Pedra"
    deps: [mesa_arqueologia]
    icon: fossil:stoneTablet
    desc: |
      Escrita antiga em pedra. A §eTábua de Pedra§r é rara, mas tem muita história. Se achar uma, leia com o Dinopédia na mão.
      Continue explorando as escavações, Herói, que um dia ela aparece! Se quiser saber de onde vem, aperte R ou U no NEI ou consulte o manual do mod. Boa sorte, e muita paciência!
    tasks:
      - get: fossil:stoneTablet
    rewards:
      - xp: 4
      - loot: incomum

  - id: cacos_ceramica
    title: "Cacos de Cerâmica"
    deps: [mesa_arqueologia]
    icon: fossil:potteryShard
    desc: |
      Os arqueólogos choram quando um vaso quebra; você, Herói, vai juntar os cacos! Reúna §e6 Cacos de Cerâmica§r (7 para o maior vaso).
      Eles aparecem nos sítios de escavação, então continue quebrando blocos de fóssil e peneirando. Se tiver dúvida de onde achar, aperte R ou U no NEI ou consulte o manual do mod. Cacos reunidos, vaso garantido!
    tasks:
      - get: fossil:potteryShard x7
    rewards:
      - xp: 3
      - item: [minecraft:clay_ball x16]

  - id: vasos_quebrados
    title: "Vasos Reconstruídos"
    deps: [cacos_ceramica]
    icon: fossil:vaseAmphora
    desc: |
      Seis ou sete cacos, uma bancada e pronto: um §eVaso§r, que pode ser Ânfora, Kylix ou Volute. Faça os três para completar o set.

      Restaurar vasos é terapêutico, Herói! Respire fundo, junte os cacos e vá montando. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Que coleção linda vai ficar!
    tasks:
      - get: fossil:vaseAmphora
      - get: fossil:vaseKylix
      - get: fossil:vaseVolute
    rewards:
      - xp: 4
      - loot: incomum

  - id: vasos_belos
    title: "Vasos Pintados"
    type: optional
    deps: [vasos_quebrados]
    icon: fossil:vaseAmphora:2
    desc: |
      Vasos de §efigura vermelha§r, §efigura negra§r e §eporcelana§r valem mais que ouro para os colecionadores. Confira no NEI como os melhorar.
      É opcional, Herói, mas a coleção fica bem mais bonita. Comece pelos vasos que você já restaurou e aperte R ou U no NEI para ver o caminho. Capriche no acabamento, hein!
    tasks:
      - one_of: [fossil:vaseAmphora:2, fossil:vaseAmphora:3, fossil:vaseAmphora:4, fossil:vaseKylix:2, fossil:vaseKylix:3, fossil:vaseKylix:4, fossil:vaseVolute:2, fossil:vaseVolute:3, fossil:vaseVolute:4]
    rewards:
      - loot: raro

  - id: espada_quebrada
    title: "Espada Quebrada"
    deps: [mesa_arqueologia]
    icon: fossil:brokenAncientSword
    desc: |
      Restos de uma espada de outra era. Junte a §eEspada Antiga Quebrada§r e o §eElmo Antigo Quebrado§r para a restauração.
      Eles aparecem nas escavações, Herói, então continue explorando os sítios. Depois a Mesa de Arqueologia faz o resto. Se não achar, aperte R ou U no NEI ou consulte o manual do mod. Boa escavação!
    tasks:
      - get: fossil:brokenAncientSword
      - get: fossil:brokenAncientHelmet
    rewards:
      - xp: 4
      - item: [minecraft:iron_ingot x8]

  - id: espada_antiga
    title: "Armas dos Antigos"
    deps: [espada_quebrada]
    icon: fossil:ancientSword
    desc: |
      Restaurada, a §eEspada Antiga§r e o §eElmo Antigo§r voltam à vida. Bonitas e fortes, melhores que muita coisa moderna.

      Procure no NEI como completar a restauração, Herói (R/U). Leve as peças quebradas para a Mesa de Arqueologia e vá com calma. Que orgulho de ver a história renascer!
    tasks:
      - get: fossil:ancientSword
      - get: fossil:ancientHelmet
    rewards:
      - xp: 6
      - loot: raro

  - id: estatuetas
    title: "Estatuetas Quebradas"
    type: optional
    deps: [mesa_arqueologia]
    icon: fossil:figurine:15
    desc: |
      Entre os escombros aparecem estatuetas de madeira, de Steve, esqueleto, zumbi e outros, em estados quebrado, danificado e impecável. A §eMisteriosa§r é a mais rara.
      É opcional, Herói, mas dá um charme incrível à coleção. Continue escavando e, se quiser ver todas as variações, aperte R ou U no NEI. Boa caça às estatuetas!
    tasks:
      - one_of: [fossil:figurine, fossil:figurine:1, fossil:figurine:2, fossil:figurine:3, fossil:figurine:4, fossil:figurine:5, fossil:figurine:6, fossil:figurine:7, fossil:figurine:8, fossil:figurine:9, fossil:figurine:10, fossil:figurine:11, fossil:figurine:12, fossil:figurine:13, fossil:figurine:14, fossil:figurine:15]
    rewards:
      - loot: incomum

  - id: adaga_dente
    title: "Adaga de Dente"
    type: optional
    deps: [dinopedia]
    icon: fossil:toothDagger
    desc: |
      Um dente de predador vira lâmina. Veja a receita no NEI e deixe a adaga afiada para a cozinha pré-histórica.
      É opcional, Herói, mas que charme! Reúna os itens indicados na receita, vá até a bancada e monte a Adaga de Dente. Se tiver dúvida, aperte R ou U no NEI ou consulte o manual do mod. Boa culinária jurássica!
    tasks:
      - get: fossil:toothDagger
    rewards:
      - loot: incomum

  - id: bloco_cranio
    title: "Bloco de Crânio"
    deps: [mesa_arqueologia]
    icon: fossil:skullBlock
    desc: |
      Bonito, assustador, ótimo na parede do museu. O §eCrânio§r como bloco exibe seus achados. Ele pode virar §eLanterna§r, §eCajado§r e até capacete.
      Posicione-o com carinho, Herói, e deixe o museu com cara de sítio arqueológico. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Que arrepio bom!
    tasks:
      - get: fossil:skullBlock
    rewards:
      - xp: 3

  - id: lanterna_cranio
    title: "Lanterna de Crânio"
    type: optional
    deps: [bloco_cranio]
    icon: fossil:skullLantern
    desc: |
      Crânio mais tocha: uma lanterna que dá medo e ilumina. Fica ótima na entrada da caverna.
      É opcional, Herói, mas dá um toque bem temático à sua base ou ao museu. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Coloque uma na entrada e espante o susto dos visitantes (ou chame mais!).
    tasks:
      - get: fossil:skullLantern
    rewards:
      - loot: comum

  - id: cajado_cranio
    title: "Cajado de Crânio"
    type: optional
    deps: [bloco_cranio]
    icon: fossil:skullStick
    desc: |
      Bloco de crânio e um graveto, só isso. Olha o Rex na ponta do bastão! Mais um enfeite que arma.
      É opcional, Herói, mas divertidíssimo de ostentar. Se a receita não encaixar de primeira, aperte R ou U no NEI ou consulte o manual do mod. Vai por mim: ninguém vai esquecer a sua entrada triunfal!
    tasks:
      - get: fossil:skullStick
    rewards:
      - loot: comum

  - id: esqueleto_armadura
    title: "Armadura de Ossos"
    deps: [bloco_cranio]
    icon: fossil:skullHelmet
    desc: |
      Capacete de crânio, costelas, caneleiras e pés de osso: uma armadura pré-histórica completa. Mais pelo visual do que pela proteção, mas muito divertida!
      Reúna as quatro peças, Herói, e vista tudo para mostrar. Se alguma receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Prepare-se para virar a estrela do museu!
    tasks:
      - get: fossil:skullHelmet
      - get: fossil:ribCage
      - get: fossil:shinGuards
      - get: fossil:feet
    rewards:
      - xp: 6
      - loot: incomum

  - id: ossos_dino
    title: "Ossos de Dinossauro"
    type: optional
    deps: [mesa_arqueologia]
    icon: fossil:skull:2
    desc: |
      Junte o crânio do §eTiranossauro§r, do §eTricerátopo§r e do §eEstegossauro§r para começar a coleção. Crânios, patas, vértebras, garras e ossos de braço de dezenas de espécies existem por aí.
      É opcional, Herói, mas o museu agradece. Se não souber como obter cada um, aperte R ou U no NEI ou consulte o manual do mod.
    tasks:
      - get: fossil:skull:2
      - get: fossil:skull
      - get: fossil:skull:6
    rewards:
      - xp: 6
      - loot: incomum

  - id: ossos_marinhos
    title: "Ossos do Mar"
    type: optional
    deps: [ossos_dino]
    icon: fossil:skull:5
    desc: |
      Os mares guardavam gigantes. Crânios de §eMosassauro§r, §ePlesiossauro§r e §ePteranodonte§r completam a ala aquática e aérea do museu.
      É opcional, Herói, mas fica uma beleza na exposição. Se não souber como obter cada crânio, aperte R ou U no NEI ou consulte o manual do mod. Boa expedição, e cuidado com o fundo do mar!
    tasks:
      - get: fossil:skull:5
      - get: fossil:skull:4
      - get: fossil:skull:3
    rewards:
      - loot: incomum

  - id: ossos_mamiferos
    title: "Ossos da Era do Gelo"
    type: optional
    deps: [ossos_dino]
    icon: fossil:skull:30
    desc: |
      Mamute, Smilodon, Quagga e Elasmotério: crânios de mamíferos da Era do Gelo. Lindos no museu.
      É opcional, Herói, mas dá um toque especial à exposição. Continue explorando e, se não souber como obter cada crânio, aperte R ou U no NEI ou consulte o manual do mod. Boa caçada, e capriche na vitrine!
    tasks:
      - get: fossil:skull:30
      - get: fossil:skull:31
      - get: fossil:skull:32
      - get: fossil:skull:33
    rewards:
      - loot: incomum

  - id: dna_primeiro
    title: "Primeiro Fio de DNA"
    type: main
    deps: [analisador]
    icon: fossil:dnaVelociraptor
    desc: |
      Ponha Bio-Fósseis no Analisador. A cada rodada ele devolve um §eDNA§r aleatório (às vezes de animais da fazenda, para sua alegria).

      Quando conseguir qualquer um, está no caminho certo. Insista, Herói: é puro sorteio, então tenha paciência e bastante Bio-Fóssil. Se precisar relembrar o processo, aperte R ou U no NEI. Já pode comemorar o primeiro fio!
    tasks:
      - one_of: [fossil:dnaTriceratops, fossil:dnaVelociraptor, fossil:dnaTyrannosaurus, fossil:dnaStegosaurus, fossil:dnaDilophosaurus, fossil:dnaBrachiosaurus, fossil:dnaSpinosaurus, fossil:dnaCompsognathus, fossil:dnaAnkylosaurus, fossil:dnaPachycephalosaurus, fossil:dnaDeinonychus, fossil:dnaGallimimus, fossil:dnaAllosaurus, fossil:dnaCeratosaurus, fossil:dnaDryosaurus, fossil:dnaTherizinosaurus, fossil:dnaParasaurolophus, fossil:dnaMammoth, fossil:dnaSmilodon, fossil:dnaPig, fossil:dnaCow, fossil:dnaSheep, fossil:dnaHorse]
    rewards:
      - xp: 4
      - item: [minecraft:gold_ingot x4]

  - id: dna_pequenos
    title: "DNA dos Pequenos"
    deps: [dna_primeiro]
    icon: fossil:dnaCompsognathus
    desc: |
      Os menores têm bons dentes e muito apetite. Reúna o DNA de §eCompsognathus§r, §eVelociraptor§r, §eDeinonychus§r, §eDilofossauro§r, §eDryosaurus§r, §eGalimimo§r e §ePaquicefalossauro§r.
      O Analisador entrega DNA aleatório, Herói, então tenha paciência e Bio-Fósseis de sobra. Se tiver dúvida do processo, aperte R ou U no NEI. Vai com tudo!
    tasks:
      - get: fossil:dnaCompsognathus
      - get: fossil:dnaVelociraptor
      - get: fossil:dnaDeinonychus
      - get: fossil:dnaDilophosaurus
      - get: fossil:dnaDryosaurus
      - get: fossil:dnaGallimimus
      - get: fossil:dnaPachycephalosaurus
    rewards:
      - xp: 6
      - item: [minecraft:iron_ingot x8]

  - id: dna_gigantes
    title: "DNA dos Gigantes"
    deps: [dna_primeiro]
    icon: fossil:dnaBrachiosaurus
    desc: |
      Os pesos-pesados da era Jurássica: §eTricerátopo§r, §eEstegossauro§r, §eBraquiossauro§r, §eAnquilossauro§r e §eParassaurolofo§r.
      Reúna o DNA de cada um, Herói. O Analisador entrega DNA aleatório, então tenha paciência e Bio-Fósseis de sobra para ir repetindo. Se quiser relembrar o processo, aperte R ou U no NEI ou consulte o Dinopédia. Os gigantes esperam por você!
    tasks:
      - get: fossil:dnaTriceratops
      - get: fossil:dnaStegosaurus
      - get: fossil:dnaBrachiosaurus
      - get: fossil:dnaAnkylosaurus
      - get: fossil:dnaParasaurolophus
    rewards:
      - xp: 6
      - item: [minecraft:wheat x32]

  - id: dna_predadores
    title: "DNA dos Predadores"
    deps: [dna_pequenos]
    icon: fossil:dnaTyrannosaurus
    desc: |
      O topo da cadeia alimentar: §eTiranossauro§r, §eSpinosaurus§r, §eAllosaurus§r, §eCeratosaurus§r e §eTherizinosaurus§r. Rendem em quantidade, então tenha muito Bio-Fóssil.
      O DNA sai aleatório do Analisador, Herói, e pode demorar para vir o que você quer. Insista com calma e, se precisar de ajuda, aperte R ou U no NEI ou leia o Dinopédia. Os predadores estão chamando!
    tasks:
      - get: fossil:dnaTyrannosaurus
      - get: fossil:dnaSpinosaurus
      - get: fossil:dnaAllosaurus
      - get: fossil:dnaCeratosaurus
      - get: fossil:dnaTherizinosaurus
    rewards:
      - xp: 8
      - loot: incomum

  - id: dna_marinhos
    title: "DNA dos Mares"
    deps: [dna_primeiro]
    icon: fossil:dnaMosasaurus
    desc: |
      Répteis marinhos para a sua coleção: §ePlesiossauro§r, §eMosassauro§r, §eLiopleurodonte§r, §eIcthyosaurus§r, §eHenodus§r, §eSarcosuchus§r e §eNautilus§r.
      O DNA sai aleatório do Analisador, Herói, então vá analisando Bio-Fósseis até completar a lista. Se tiver dúvida do processo, aperte R ou U no NEI ou consulte o Dinopédia. Boa pesca, quer dizer, boa pesquisa!
    tasks:
      - get: fossil:dnaPlesiosaur
      - get: fossil:dnaMosasaurus
      - get: fossil:dnaLiopleurodon
      - get: fossil:dnaIcthyosaurus
      - get: fossil:dnaHenodus
      - get: fossil:dnaSarcosuchus
      - get: fossil:dnaNautilus
    rewards:
