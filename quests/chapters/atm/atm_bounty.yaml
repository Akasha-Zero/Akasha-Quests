chapter:
  id: atm_bounty
  title: Quadro de Recompensas
  prefix: ATM
  order: 930
  icon: minecraft:iron_sword
  desc: |
    §6Contratos que se renovam.§r Todo dia o quadro recebe pedidos novos: derrube mobs de
    verdade e leve pepitas, pós e brutos dos metais impossíveis. Cada caçada pode ser refeita
    depois de 24 horas.
quests:
- id: quadro_regras
  title: Regras do Quadro
  type: info
  icon: minecraft:iron_sword
  desc: |
    Bem-vindo ao §eQuadro de Recompensas§r, Herói. Cada contrato aqui é §erepetível a cada 24
    horas§r: derrube os mobs indicados, e a recompensa chega em materiais ATM. Quanto mais fundo
    for o alvo, mais valioso o prêmio.

    §aDica:§r confira no NEI o que cada mob larga e leve armadura boa. Boa caça!
  tasks:
  - check: true
  rewards:
  - xp: 3
- id: cacada_zumbi
  title: Cabeças de Zumbi
  type: normal
  deps: [quadro_regras]
  repeat: 86400
