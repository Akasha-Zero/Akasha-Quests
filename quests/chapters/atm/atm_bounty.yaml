    Zumbis cercam a vila ao anoitecer, e o quadro paga por quem limpa a vizinhança.

    Derrube §e20§r e volte ao quadro. A recompensa é material ATM, e o contrato fica disponível
    de novo em 24 horas.
  tasks:
  - kill: Zombie x20
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:allthemodium_nugget x4
