chapter:
  id: atm_allthemodium
  title: Capítulo 2 — Allthemodium
  prefix: ATM
  order: 910
  icon: allthemodiumlegacy:allthemodium_ingot
  desc: |
    §6Três metais, três mundos, um Piglich.§r Aqui você transforma o pacote do Capítulo 1 em
    lingotes de Allthemodium, sobe a escada até o Vibranium e o Unobtainium, atravessa a
    Mineração, O Outro e O Além, enfrenta o chefe das pirâmides e forja as ligas e armas que só
    existem neste Volume.
quests:
- id: guia_akashic
  deps_hidden: [ato4:oito_selos]
  title: O Guia da Família
  type: main
  icon: allthemodiumlegacy:legacy_guide
  desc: |
    Antes de tudo, um livrinho: o §eGuia da Família Akashic ATM§r. É só um livro e uma pepita de
    Allthemodium na bancada, mas ele explica cada etapa do jeito do mod, páginas e páginas.

    Se este capítulo e o guia divergirem em algum número, confie no guia e no NEI. Eles são a
    fonte.
  tasks:
  - craft: allthemodiumlegacy:legacy_guide
  rewards:
  - xp: 3
  - item:
    - minecraft:book x4
- id: martelo_processamento
  title: Martelo de Processamento
  type: main
  deps: [guia_akashic]
  desc: |
    Cinco lingotes de ferro e duas varetas: o §eMartelo de Processamento§r. Ele corta a pedra ancestral em lajes, escadas e muros, e quebra o Allthemodium bruto em pó.

    §aDica:§r a posição do martelo na bancada muda o resultado. O guia explica as combinações. Boa martelada, Herói! Receita no NEI (R/U).
  tasks:
  - craft: allthemodiumlegacy:processing_hammer
  rewards:
  - xp: 3
  - item:
    - minecraft:iron_ingot x8
- id: bruto_atm
  title: Allthemodium Bruto
  type: main
  deps: [martelo_processamento]
  desc: |
    Oito Enderium, oito Soularium e uma Estrela do Nether, na Fundidora de Ligas, sob 150.000
    RF. O produto é o §eAllthemodium bruto§r, seu primeiro grama do metal lendário.

    Se ainda não fez isso, o Capítulo 1 mostra o caminho. Não gaste tudo de uma vez: guarde
    parte para o primeiro molde de ferraria.
  tasks:
  - get: allthemodiumlegacy:raw_allthemodium
  rewards:
  - xp: 6
  - item:
    - allthemodiumlegacy:raw_allthemodium
- id: atm_po
  title: Pó de Allthemodium
  deps: [bruto_atm]
  desc: |
    Bata o bruto com o martelo na bancada e saem §e2 Pós de Allthemodium§r. Num Triturador
    (Macerator do IC2), Pulverizador do Thermal ou Moinho do EnderIO a rota também funciona.

    §aDica:§r converter um lingote em pó conserva material. Não é multiplicação, é só outra
    forma.
  tasks:
  - get: allthemodiumlegacy:allthemodium_dust x2
  rewards:
  - xp: 3
  - item:
    - allthemodiumlegacy:allthemodium_dust
- id: atm_lingote
  title: Lingote de Allthemodium
  type: milestone
  icon: allthemodiumlegacy:allthemodium_ingot
  deps: [bruto_atm]
  desc: |
    Funda o pó ou o bruto numa fornalha com pó de pirotita (ou nos fornos avançados do pack) e saia com um §eLingote de Allthemodium§r, dourado e quente. Junte 4, Herói.

    Segure o primeiro por um instante. Não é todo dia que a gente vê um metal que nem deveria existir, e você acabou de forjar um com as próprias mãos. Veja como foi longe desde as primeiras pedras e os primeiros minérios! Guarde bem os lingotes, porque o que vem pela frente exige muito deles. Que marco, Herói, estou orgulhosa de você!
  tasks:
  - get: allthemodiumlegacy:allthemodium_ingot x4
  rewards:
  - xp: 6
  - item:
    - allthemodiumlegacy:allthemodium_nugget x9
- id: atm_pepita
  title: Pepitas e Lingotes
  deps: [atm_lingote]
  desc: |
    Um lingote vira nove §ePepitas de Allthemodium§r e nove pepitas voltam a ser um lingote. A pepita é a moeda do pack: a Plataforma de Teletransporte, a maçã, a cenoura e o guia pedem pepitas.

    Faça um estoquezinho de §e16§r, Herói. Vai ser muito útil.
  tasks:
  - get: allthemodiumlegacy:allthemodium_nugget x16
  rewards:
  - xp: 3
  - item:
    - allthemodiumlegacy:allthemodium_nugget x8
- id: atm_placa
  title: Placa de Allthemodium
  type: optional
  deps: [atm_lingote]
  desc: |
    Uma placa por lingote, no Formador de Metal do IC2 ou na Prensa de Metal do Immersive Engineering. Na bancada, quatro lingotes rendem quatro placas, bom para quem não tem máquina.

    Placas servem para blocos mais finos, engrenagens e ferramentas mecânicas. Opcional, Herói. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:allthemodium_plate x4
  rewards:
  - xp: 3
  - item:
    - allthemodiumlegacy:allthemodium_ingot
- id: atm_vara
  title: Vara de Allthemodium
  type: optional
  deps: [atm_lingote]
  desc: |
    Um lingote vira duas §eVaras§r no Formador. Na bancada, três lingotes em coluna dão seis varas.

    Varas são o cabo das ferramentas de liga e do tridente. Faça um punhado, Herói, que elas vão ser usadas várias vezes. Opcional por enquanto. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:allthemodium_rod x4
  rewards:
  - xp: 3
  - item:
    - allthemodiumlegacy:allthemodium_rod x2
- id: atm_engrenagem
  title: Engrenagem de Allthemodium
  type: optional
  deps: [atm_placa, atm_vara]
  desc: |
    Quatro lingotes pressionados fazem uma §eEngrenagem§r (no Compressor do Thermal, na Prensa do IE, ou na bancada com oito lingotes para duas).

    Bonita e inútil? Não: engrenagens são o coração de máquinas e de peças do pack. Faça 2 se tiver lingote sobrando, Herói. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:allthemodium_gear x2
  rewards:
  - xp: 3
  - item:
    - allthemodiumlegacy:allthemodium_plate x2
- id: atm_bloco
  title: Bloco de Allthemodium
  type: main
  deps: [atm_lingote]
  desc: |
    Nove lingotes, um §eBloco de Allthemodium§r. Ele serve de armazenamento, de ingrediente do Vibranium bruto e de base dos blocos comprimidos do capítulo All The Compressed.

    Exposto numa estante, brilha mais que qualquer troféu. Faça um, Herói, e guarde com carinho. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:allthemodium_block
  rewards:
  - xp: 5
  - item:
    - allthemodiumlegacy:allthemodium_ingot x2
- id: atm_bruto_bloco
  title: Bloco de Allthemodium Bruto
  type: optional
  deps: [bruto_atm]
  desc: |
    Nove brutos formam um §eBloco Bruto§r, bom para guardar minério sem fundir. Colocando um deles no chão, ele pode ser quebrado para devolver o bruto.

    Para o jogo de estocar, perfeito. Opcional, Herói, mas economiza muito espaço no baú. Receita no NEI (R/U). Guarde com carinho.
  tasks:
  - get: allthemodiumlegacy:raw_allthemodium_block
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:raw_allthemodium
- id: atm_balde
  title: Allthemodium Derretido
  type: optional
  deps: [atm_lingote]
  desc: |
    Na Fundição do Tinkers, o lingote vira §eAllthemodium derretido§r, que pode ser engarrafado num balde com o Engarrafador ou o Transposador. Essa rota também alimenta as peças de ferramentas do Tinkers.

    Teste na Fundição quando tiver sobra de lingotes, Herói. É opcional. Uma curiosidade bonita.
  tasks:
  - get: allthemodiumlegacy:molten_allthemodium_bucket
  rewards:
  - xp: 5
  - item:
    - minecraft:bucket x2
- id: atm_maca
  title: Maçã de Allthemodium
  deps: [atm_pepita]
  desc: |
    Oito pepitas e uma maçã, formato de anel. A §eMaçã de Allthemodium§r dá Regeneração II e Absorção II por trinta segundos.

    Guarde para o Piglich ou para o fim de uma expedição longa na Mineração, Herói. Não gaste à toa, porque as pepitas são preciosas. Receita no NEI (R/U).
  tasks:
  - craft: allthemodiumlegacy:allthemodium_apple
  rewards:
  - xp: 4
  - item:
    - minecraft:apple x4
- id: atm_cenoura
  title: Cenoura de Allthemodium
  deps: [atm_pepita]
  desc: |
    O mesmo anel, só que com uma cenoura no meio: a §eCenoura de Allthemodium§r. Ela dá Regeneração III e Absorção III por trinta segundos, um upgrade claro sobre a maçã.

    Coma antes do combate, não durante o pânico, Herói! Receita no NEI (R/U) se esquecer o formato.
  tasks:
  - craft: allthemodiumlegacy:allthemodium_carrot
  rewards:
  - xp: 4
  - item:
    - minecraft:carrot x4
- id: mek_clump
  title: Aglomerado de Allthemodium
  type: optional
  deps: [bruto_atm]
  desc: |
    Quer render mais do minério? A rota Mekanism começa na §eCâmara de Purificação§r: o minério (ou bruto) entra, com pederneira, e saem §eAglomerados§r. Eles multiplicam o rendimento em relação a fundir direto.

    Essa rota é opcional. Compare as saídas no NEI (R/U), Herói. Vale pelo rendimento extra.
  tasks:
  - get: allthemodiumlegacy:allthemodium_clump
  rewards:
  - xp: 4
  - item:
    - minecraft:flint x8
- id: mek_shard
  title: Fragmento de Allthemodium
  type: optional
  deps: [mek_clump]
  desc: |
    A §eCâmara de Injeção Química§r pega o bruto com um gás e entrega §eFragmentos§r. É uma etapa intermediária da cadeia: o rendimento cresce de novo.

    §aDica:§r não confunda este fragmento químico com o fragmento de reparo do Tinkers. Opcional, Herói. Para ver a receita exata, aperte R ou U no NEI.
  tasks:
  - get: allthemodiumlegacy:allthemodium_shard
  rewards:
  - xp: 4
  - item:
    - minecraft:flint x8
- id: mek_crystal
  title: Cristal de Allthemodium
  type: optional
  deps: [mek_shard]
  desc: |
    No §eCristalizador Químico§r, uma solução específica vira §eCristal de Allthemodium§r. É a etapa mais refinada antes do pó sujo, do aglomerado e do lingote final.

    O Mekanism é denso. Se cansar, volte a fundir direto, Herói. Opcional. Receita no NEI (R/U). Respire fundo antes de começar.
  tasks:
  - get: allthemodiumlegacy:allthemodium_crystal
  rewards:
  - xp: 4
  - item:
    - minecraft:flint x8
- id: mek_po_sujo
  title: Pó Sujo
  type: optional
  deps: [mek_clump]
  desc: |
    O Triturador transforma o aglomerado em §ePó de Allthemodium Sujo§r, que ainda precisa de uma passada no Enriquecedor antes de virar pó limpo.

    Último degrau da rota longa. Uma conquista de paciência, Herói! Opcional, mas se você chegou até aqui, merece os parabéns. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:dirty_allthemodium_dust
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:allthemodium_dust x2
- id: plataforma
  title: Plataforma de Teletransporte
  type: main
  deps: [atm_pepita]
  desc: |
    Quatro pepitas de Allthemodium em cruz e uma pérola do Ender no meio. Pronto: a §ePlataforma
    de Teletransporte§r. Agachado e de mãos vazias, clique nela e você parte.

    Cada origem tem seu par: Overworld e Mineração, Nether e O Outro, End e O Além. Espere dois
    segundos entre usos e desmonte antes de viajar.
  tasks:
  - craft: allthemodiumlegacy:teleport_pad
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:teleport_pad
  - item:
    - minecraft:ender_pearl x4
- id: visitar_mineracao
  title: A Dimensão de Mineração
  type: portal
  deps: [plataforma]
  desc: |
    Pelo Overworld, na Plataforma, você chega à §eMineração§r (dimensão 240): uma superfície plana em Y229, com pedra, camada profunda, netherrack e pedra do End, até a bedrock lá embaixo.

    §aDica:§r deixe sua plataforma intacta. Ela é a volta para casa. Leve picareta, comida e blocos, Herói. Prepare-se para uma boa escavação, e boa viagem! Se tiver dúvida, o guia ajuda. Chegando lá, olhe ao redor: a camada rasa é pedra comum, e o tesouro está mais fundo. Planeje a descida antes de cavar sem rumo.
  tasks:
  - visit:
      dim: 240
      name: Dimensão de Mineração
  rewards:
  - xp: 10
  - kit:
      name: Kit do Minerador
      items:
      - minecraft:cooked_beef x16
      - minecraft:torch x64
      - minecraft:cobblestone x64
- id: minerio_atm
  title: Minério de Allthemodium
  type: main
  deps: [visitar_mineracao]
  desc: |
    Na Mineração, o §eMinério de Allthemodium§r aparece nas camadas profundas. Cave com paciência, tochas na mão, e junte §e4 minérios§r.

    Cada um rende bruto, pó, aglomerado, o que você escolher. Fique de olho na iluminação, Herói, e não esqueça de comida. Boa escavação! Quanto mais fundo, mais perto do brilho dourado.
  tasks:
  - get: allthemodiumlegacy:allthemodium_ore x4
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:allthemodium_ingot x2
- id: minerio_atm_ardosia
  title: Minério de Ardósia
  type: optional
  deps: [minerio_atm]
  desc: |
    Na camada profunda (Y95 a 141), há uma variante: o §eMinério de Allthemodium de Ardósia§r, que usa ardósia ou pedra ancestral conforme a mod disponível. O rendimento é o mesmo.

    Junte §e2§r só para conhecer, Herói. Opcional, mas bom saber onde o minério se esconde.
  tasks:
  - get: allthemodiumlegacy:allthemodium_slate_ore x2
  rewards:
  - xp: 5
  - item:
    - allthemodiumlegacy:allthemodium_nugget x9
- id: pedra_ancestral
  title: Pedra Ancestral
  type: optional
  deps: [visitar_mineracao]
  desc: |
    A pedra de O Outro, também achada na Mineração, tem tom diferente e várias variantes (lisa, tijolos, musgosa, lajes, escadas, muros). Junte §e32§r e use o martelo na bancada para moldar.

    Boa para construções que parecem saídas de uma lenda, Herói. Opcional, mas lindíssima. Receitas no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:ancient_stone x32
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:ancient_stone x16
- id: visitar_outro
  title: O Outro
  type: portal
  deps: [plataforma]
  desc: |
    Pelo Nether, na Plataforma, você cai em §eO Outro§r (dimensão 241): um lugar de vale de almas, deserto, deltas de basalto, florestas carmesim e distorcida ancestrais.

    §cPerigo:§r criaturas hostis e estruturas. Leve armadura, comida e um jeito de voltar antes de explorar, Herói. Tenha sempre um bloco de retorno ou uma plataforma por perto. Coragem, e boa viagem! Ao chegar, olhe ao redor antes de sair andando: a paisagem muda bastante de região em região. Avise seus amigos de onde você foi e vá devagar, porque o terreno é cheio de surpresas.
  tasks:
  - visit:
      dim: 241
      name: O Outro
  rewards:
  - xp: 12
  - kit:
      name: Kit do Explorador
      items:
      - minecraft:cooked_beef x16
      - minecraft:golden_apple x2
      - minecraft:torch x32
- id: minerio_vibranium
  title: Minério de Vibranium
  type: main
  deps: [visitar_outro]
  desc: |
    Em O Outro, procure o §eMinério de Vibranium§r junto a tetos de cavernas. Ele aparece em duas variantes: a comum e a do Outro. Junte §e4§r.

    Arredores de tetos de caverna e câmaras de basalto são os melhores lugares. Leve picareta boa e tochas, Herói. Boa caçada!
  tasks:
  - get: ore:oreVibranium x4
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:vibranium_nugget x9
- id: minerio_outro_vibranium
  title: Vibranium do Outro
  type: optional
  deps: [minerio_vibranium]
  desc: |
    Existe uma segunda pedra: o §eMinério de Vibranium do Outro§r, mais nativo dessa dimensão. O pó e o bruto saem iguais.

    Colete §e2§r e compare o aspecto, Herói. Opcional, mas curioso para quem gosta de detalhes. Procure com calma em cavernas e tetos. Receita de uso no NEI.
  tasks:
  - get: allthemodiumlegacy:other_vibranium_ore x2
  rewards:
  - xp: 5
  - item:
    - allthemodiumlegacy:vibranium_nugget x9
- id: minerio_atm_outro
  title: Allthemodium em O Outro
  type: optional
  deps: [visitar_outro]
  desc: |
    Em O Outro também há §eAllthemodium§r nas regiões baixas e intermediárias. Se a Mineração estiver cheia de gente (ou você já cansou dela), esta é a alternativa.

    Junte §e4§r minérios ou brutos, Herói. Opcional, mas ótimo para variar de ambiente. Cuidado com as criaturas locais.
  tasks:
  - get: ore:oreAllthemodium x4
  rewards:
  - xp: 6
  - item:
    - allthemodiumlegacy:allthemodium_nugget x9
- id: vale_das_almas
  title: O Vale das Almas
  type: main
  deps: [visitar_outro]
  desc: |
    No bioma do §eVale das Almas§r escondem-se pirâmides. É lá que mora o Piglich. Explore a região a pé e procure a pirâmide por perto.

    §cPerigo:§r criaturas ágeis e o ambiente hostil. Leve armadura boa, Herói, além de comida e algo para curar. Respire fundo e vá com calma!
  tasks:
  - visit:
      dim: 241
      biome: 242
      name: Vale das Almas
  rewards:
  - xp: 10
  - item:
    - minecraft:golden_apple x2
    - minecraft:cooked_beef x16
- id: vegetacao_ancestral
  title: Madeira Ancestral
  type: optional
  deps: [visitar_outro]
  desc: |
    As árvores de O Outro são de três famílias: §eancestral§r, §edemoníaca§r e §ede almas§r. Junte §e8 troncos ancestrais§r para ver as variações (tábuas, escadas, cercas, estantes).

    O martelo de processamento descasca o tronco na bancada. Opcional, Herói, mas uma delícia para quem constrói. Receitas no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:ancient_log_0 x8
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:ancient_planks x16
- id: mudas_outro
  title: Mudas de Três Madeiras
  type: optional
  deps: [vegetacao_ancestral]
  desc: |
    Colete §ea muda ancestral§r, §ea demoníaca§r e §ea das almas§r. Elas crescem em O Outro e abrem possibilidade de construir sua casa lá, madeira aos montes.

    Pode soltar de qualquer folha das árvores certas, Herói. Basta paciência e quebrar folhas. Opcional, mas vale demais. Plante perto da sua base temporária e aproveite.
  tasks:
  - get:
    - allthemodiumlegacy:ancient_sapling
    - allthemodiumlegacy:demonic_sapling
    - allthemodiumlegacy:soul_sapling
  rewards:
  - xp: 4
  - item:
    - minecraft:dye:15 x16
- id: ervas_outro
  title: Ervas Antigas
  type: optional
  deps: [visitar_outro]
  desc: |
    Três ervas crescem em O Outro: a §eAncestral§r, a §eDemoníaca§r e a §eda Alma§r. Colete uma de cada. Elas decoram, e algumas são ingredientes de receitas locais.

    Confira o NEI (R/U) para ver o que usa cada uma, Herói. Opcional, mas divertido de explorar. Boa colheita.
  tasks:
  - get:
    - allthemodiumlegacy:ancient_herb
    - allthemodiumlegacy:demonic_herb
    - allthemodiumlegacy:soul_herb
  rewards:
  - xp: 4
  - item:
    - minecraft:wheat_seeds x8
- id: esqueleto_outro
  title: Esqueletos Wither do Outro
  type: optional
  deps: [visitar_outro]
  desc: |
    Em O Outro, uma variante local de §eEsqueleto Wither§r patrulha as estruturas. Derrube §e4§r, de longe se possível, e cuide do efeito Wither (leite ou o próprio Peitoral).

    Dá bom treino para o chefe, Herói. Opcional, mas ótimo para testar suas armas e armadura antes de enfrentar o Piglich.
  tasks:
  - kill: allthemodiumlegacy.other_wither_skeleton x4
  rewards:
  - xp: 8
  - item:
    - minecraft:bone x16
- id: piglich
  title: O Piglich
  type: boss
  icon: allthemodiumlegacy:piglich_heart
  deps: [vale_das_almas, atm_cenoura]
  desc: |
    Chegou o momento da batalha, Herói! Dentro da pirâmide vive o §ePiglich§r, com 9.999 pontos de vida, defesas altas, ataques corpo a corpo e rajadas de bolas de fogo, e ainda chama reforços.

    Entre preparado: armadura boa, Maçãs e Cenouras de Allthemodium, arena aberta e muita comida. Cada minério que você cavou até aqui foi treino para este instante.

    §cPerigo:§r bolas de fogo vêm em salvas. Quebre a linha de visão e ataque nos intervalos. Derrote o Piglich e o próximo capítulo do Registro se abre para você. Eu acredito em você!
  tasks:
  - kill: allthemodiumlegacy.piglich x1
  rewards:
  - xp: 40
  - loot: lendario
  - kit:
      name: Espólio do Piglich
      items:
      - allthemodiumlegacy:piglich_heart x2
      - allthemodiumlegacy:allthemodium_ingot x4
- id: coracao_piglich
  title: Coração de Piglich
  type: milestone
  icon: allthemodiumlegacy:piglich_heart
  deps: [piglich]
  desc: |
    O Piglich deixa um §eCoração§r. Ele é o ingrediente-mestre das ligas: sem ele, nenhuma liga, nenhum tridente, nenhuma Estrela. Nove corações viram um bloco, e nove blocos viram um bloco 1x.

    Junte 2 corações, Herói, e guarde-os com cuidado, porque são muito preciosos. Se o chefe renascer, volte para buscar mais. Dizem que ele é persistente, então prepare armadura, comida e paciência para a próxima rodada! Não desanime se demorar, porque o Piglich é forte, mas você é mais. Boa sorte, Herói!
  tasks:
  - get: allthemodiumlegacy:piglich_heart x2
  rewards:
  - xp: 10
  - item:
    - allthemodiumlegacy:piglich_heart
- id: coracao_alternativo
  title: Coração na Fundidora
  type: optional
  deps: [coracao_piglich]
  desc: |
    Sem coragem de enfrentar o chefe de novo? Existe uma rota industrial: §e8 Soularium§r, §e1 Estrela do Nether§r e §e1 lingote de Unobtainium§r na Fundidora de Ligas, por 250.000 RF.

    Cara, mas funciona, Herói. É opcional, mas ótima para quem prefere máquinas a espadas. Confira os detalhes no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:piglich_heart
  rewards:
  - xp: 6
  - item:
    - allthemodiumlegacy:piglich_heart
- id: bloco_coracao
  title: Bloco de Corações
  type: optional
  deps: [coracao_piglich]
  desc: |
    Nove corações formam um §eBloco de Coração de Piglich§r, ingrediente da Alma do Dragão, do Estilhaço do Esquecimento e do AllTheCatalystium da Estrela.

    Prepare um estoque, Herói. A Estrela ATM não perdoa quem economiza. Opcional por ora, mas vai te poupar viagens depois. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:piglich_heart_block
  rewards:
  - xp: 10
  - item:
    - allthemodiumlegacy:piglich_heart
- id: visitar_alem
  title: O Além
  type: portal
  deps: [plataforma]
  desc: |
    Pelo End, na Plataforma, você chega a §eO Além§r (dimensão 242), um vazio com apenas um
    apoio 3x3. Não há terreno natural; é um mundo para construir.

    Leve blocos, defenda a plataforma e preserve o caminho de volta. Cama não vale aqui; se
    morrer, você acorda no Overworld.
  tasks:
  - visit:
      dim: 242
      name: O Além
  rewards:
  - xp: 12
  - kit:
      name: Kit do Construtor
      items:
      - minecraft:stone x64
      - minecraft:glass x32
      - minecraft:torch x32
- id: ampliar_alem
  title: Construir no Vazio
  type: optional
  deps: [visitar_alem]
  desc: |
    Comece ampliando a plataforma. Junte §e128 blocos§r de pedra e monte uma base ao redor da chegada. Em O Além, tudo que você coloca fica: nenhum creeper, nenhum vizinho.

    Imagine, Herói: sua própria ilha flutuante do jeito que você quiser! Opcional, mas uma delícia para quem ama construir.
  tasks:
  - get: minecraft:stone x128
  rewards:
  - xp: 6
  - item:
    - minecraft:glowstone x16
- id: molde_atm
  title: Molde de Ferraria
  type: main
  deps: [atm_lingote]
  desc: |
    O §eMolde de Ferraria de Allthemodium§r é papel dobrado em torno de um bloco de diamante,
    uma Estrela do Nether e dois lingotes. Ele é consumido no uso, então faça um por peça.

    Há também uma receita de duplicação do molde (netherita, ardósia e o próprio molde). Veja no
    NEI.
  tasks:
  - craft: allthemodiumlegacy:allthemodium_upgrade_smithing_template
  rewards:
  - xp: 8
  - item:
    - minecraft:paper x16
    - minecraft:diamond_block
- id: atm_espada
  title: Espada de Allthemodium
  type: main
  deps: [molde_atm, atm_lingote]
  desc: |
    Uma lâmina para quem já cansou de rachar crânios com ferro. Na bancada: a espada de
    netherita e um §elingote de Allthemodium§r mais o §emolde de ferraria de Allthemodium§r. O
    resultado tem o brilho dourado do metal.

    Corta mais fundo e, como toda peça pronta desta família, não perde durabilidade. Nome e
    encantamentos da peça antiga são preservados.
  tasks:
  - craft: allthemodiumlegacy:allthemodium_sword
  rewards:
  - xp: 6
  - item:
    - allthemodiumlegacy:allthemodium_nugget x9
- id: atm_picareta
  title: Picareta de Allthemodium
  type: main
  deps: [molde_atm, atm_lingote]
  desc: |
    O som de uma picareta de verdade, Herói: Na bancada: a picareta de netherita e um §elingote
    de Allthemodium§r mais o §emolde de ferraria de Allthemodium§r. O resultado tem o brilho
    dourado do metal.

    Quebra tudo que o pack tem de duro e nunca se desgasta, ótima para a Mineração. Nome e
    encantamentos da peça antiga são preservados.
  tasks:
  - craft: allthemodiumlegacy:allthemodium_pickaxe
  rewards:
  - xp: 6
  - item:
    - allthemodiumlegacy:allthemodium_nugget x9
- id: atm_machado
  title: Machado de Allthemodium
  type: normal
  deps: [molde_atm, atm_lingote]
  desc: |
