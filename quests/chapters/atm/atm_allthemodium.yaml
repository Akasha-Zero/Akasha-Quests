  type: normal
  deps: [molde_vib, vib_lingote, atm_calcas]
  desc: |
    Cada peça da armadura de Vibranium não gasta e dá um poder próprio. As calças ajudam a nadar
    e removem o efeito Wither.

    Na bancada: as calças de Allthemodium mais um §elingote de Vibranium§r e o §emolde de
    ferraria§r. Importante: nenhuma dessas armaduras dá voo.
  tasks:
  - craft: allthemodiumlegacy:vibranium_leggings
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:vibranium_nugget x9
- id: vib_botas
  title: Botas de Vibranium
  type: normal
  deps: [molde_vib, vib_lingote, atm_botas]
  desc: |
    Cada peça da armadura de Vibranium não gasta e dá um poder próprio. As botas anulam o dano
    de queda e ajudam a flutuar sobre a lava.

    Na bancada: as botas de Allthemodium mais um §elingote de Vibranium§r e o §emolde de
    ferraria§r. Importante: nenhuma dessas armaduras dá voo.
  tasks:
  - craft: allthemodiumlegacy:vibranium_boots
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:vibranium_nugget x9
- id: bruto_unob
  title: Unobtainium Bruto
  type: main
  deps: [vib_bloco]
  desc: |
    O topo da escada: §e1 Bloco de Vibranium§r, §e1 Núcleo Desperto§r do Draconic Evolution e §e8 Ligas Vibrantes§r do EnderIO na Fundidora de Ligas, 500.000 RF. O produto: §eUnobtainium bruto§r.

    Não há minério dele na Mineração, Herói. Para o Unobtainium sempre existe um caminho industrial.
  tasks:
  - get: allthemodiumlegacy:raw_unobtainium
  rewards:
  - xp: 15
  - item:
    - allthemodiumlegacy:raw_unobtainium
- id: unob_po
  title: Pó de Unobtainium
  deps: [bruto_unob]
  desc: |
    Duas porções de pó por bruto, no martelo ou nas máquinas. Pode alimentar a rota do Mekanism se quiser.

    Junte 2, Herói. Qualquer máquina de moagem do pack serve, e o NEI (R/U) mostra os rendimentos de cada uma antes de você decidir qual usar.
  tasks:
  - get: allthemodiumlegacy:unobtainium_dust x2
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:unobtainium_dust
- id: unob_lingote
  title: Lingote de Unobtainium
  type: milestone
  icon: allthemodiumlegacy:unobtainium_ingot
  deps: [bruto_unob]
  desc: |
    Funda o bruto ou o pó e eis o §eLingote de Unobtainium§r. O nome diz tudo: algo que não devia dar para obter.

    Você acabou de conseguir, Herói! Guarde §e4§r para o molde e a primeira peça, o resto é só a diversão. Respire fundo e comemore este marco, que foi muito trabalho. Receita no NEI (R/U). Seu esforço valeu a pena, e a sua base vai brilhar com o que vem a seguir. Daqui sai um mundo de possibilidades, então pegue o martelo e continue. Receita no NEI, caso precise.
  tasks:
  - get: allthemodiumlegacy:unobtainium_ingot x4
  rewards:
  - xp: 12
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_pepita
  title: Pepitas de Unobtainium
  type: optional
  deps: [unob_lingote]
  desc: |
    Nove pepitas por lingote. Dá flexibilidade para receitas finas e tem uso nas máquinas de moldagem.

    É opcional, Herói, mas vale ter 16 à mão para ajustar quantidades. Se esquecer a receita, aperte R ou U no NEI e confira o que mais aceita pepita.
  tasks:
  - get: allthemodiumlegacy:unobtainium_nugget x16
  rewards:
  - xp: 3
  - item:
    - allthemodiumlegacy:unobtainium_nugget x8
- id: unob_placa
  title: Placa de Unobtainium
  type: optional
  deps: [unob_lingote]
  desc: |
    Placa no Formador de Metal ou na Prensa de Metal: um lingote para uma placa.

    É opcional, Herói, mas útil para peças finas e armazenamento compacto. Faça 4 se sobrar lingote, e antes de gastar o que é raro, confira os usos no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:unobtainium_plate x4
  rewards:
  - xp: 3
  - item:
    - allthemodiumlegacy:unobtainium_ingot
- id: unob_vara
  title: Vara de Unobtainium
  type: main
  deps: [unob_lingote]
  desc: |
    Uma vara de Unobtainium é o cabo certo para as ferramentas de liga. Faça várias: o Tridente, a picareta, o machado, a pá e a espada de liga usam as varas deste metal.

    Junte 6, Herói. Se esquecer o formato na bancada, aperte R ou U no NEI e confira.
  tasks:
  - get: allthemodiumlegacy:unobtainium_rod x6
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:unobtainium_rod x2
- id: unob_engrenagem
  title: Engrenagem de Unobtainium
  type: optional
  deps: [unob_placa, unob_vara]
  desc: |
    Quatro lingotes por engrenagem, no Compressor ou na Prensa. Rara e cara, mas bonita.

    É opcional, Herói. Se você tiver Unobtainium de sobra, é um belo troféu e uma peça de máquinas avançadas. Do contrário, guarde os lingotes para as ligas. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:unobtainium_gear
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:unobtainium_plate x2
- id: unob_bloco
  title: Bloco de Unobtainium
  type: main
  deps: [unob_lingote]
  desc: |
    Nove lingotes: um bloco. É também o material da Clava de Unobtainium, e a base da família de blocos comprimidos de Unobtainium.

    Faça um, Herói, e guarde com carinho. Vai aparecer em várias receitas adiante, então não gaste lingotes à toa. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:unobtainium_block
  rewards:
  - xp: 6
  - item:
    - allthemodiumlegacy:unobtainium_ingot
- id: unob_bruto_bloco
  title: Bloco de Unobtainium Bruto
  type: optional
  deps: [bruto_unob]
  desc: |
    Nove brutos formam o bloco bruto para estocar sem fundir.

    É opcional, Herói, mas economiza muito espaço no baú e mantém tudo organizado enquanto você junta material. Quebrando o bloco, o bruto volta inteiro. Receita no NEI (R/U). Boa organização rende meio caminho andado. Fica bonito na estante.
  tasks:
  - get: allthemodiumlegacy:raw_unobtainium_block
  rewards:
  - xp: 5
  - item:
    - allthemodiumlegacy:raw_unobtainium
- id: unob_balde
  title: Unobtainium Derretido
  type: optional
  deps: [unob_lingote]
  desc: |
    Derretido na Fundição, o Unobtainium abastece as peças do Tinkers. Combina mineração leve, embalo e dano crescente por acertos consecutivos. Engarrafe em um balde.

    É opcional, Herói. Teste na Fundição quando tiver lingotes sobrando. Receitas no NEI (R/U). Combina bem com Fundição e Engarrafador, Herói.
  tasks:
  - get: allthemodiumlegacy:molten_unobtainium_bucket
  rewards:
  - xp: 6
  - item:
    - minecraft:bucket x2
- id: molde_unob
  title: Molde de Ferraria de Unobtainium
  type: main
  deps: [unob_lingote]
  desc: |
    Papel, bloco de diamante, Estrela do Nether e §e2 lingotes de Unobtainium§r. A duplicação usa Vibranium e pedra do End.

    Faça o primeiro molde, Herói, e já pense em duplicar, porque cada peça consome um molde. Confira detalhes no NEI (R/U). Boa sorte na ferraria.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_upgrade_smithing_template
  rewards:
  - xp: 12
  - item:
    - minecraft:paper x16
    - minecraft:diamond_block
- id: unob_espada
  title: Espada de Unobtainium
  type: main
  deps: [molde_unob, unob_lingote, vib_espada]
  desc: |
    Uma lâmina para quem já cansou de rachar crânios com ferro. Na bancada: a espada de
    Vibranium e um §elingote de Unobtainium§r mais o §emolde de ferraria de Unobtainium§r. O
    resultado tem o brilho roxo do metal.

    Corta mais fundo e, como toda peça pronta desta família, não perde durabilidade. Nome e
    encantamentos da peça antiga são preservados.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_sword
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_picareta
  title: Picareta de Unobtainium
  type: main
  deps: [molde_unob, unob_lingote, vib_picareta]
  desc: |
    O som de uma picareta de verdade, Herói: Na bancada: a picareta de Vibranium e um §elingote
    de Unobtainium§r mais o §emolde de ferraria de Unobtainium§r. O resultado tem o brilho roxo
    do metal.

    Quebra tudo que o pack tem de duro e nunca se desgasta, ótima para a Mineração. Nome e
    encantamentos da peça antiga são preservados.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_pickaxe
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_machado
  title: Machado de Unobtainium
  type: normal
  deps: [molde_unob, unob_lingote, vib_machado]
  desc: |
    Madeira não tem chance. Na bancada: a machado de Vibranium e um §elingote de Unobtainium§r
    mais o §emolde de ferraria de Unobtainium§r. O resultado tem o brilho roxo do metal.

    Derruba árvore de O Outro como se fosse grama. Nome e encantamentos da peça antiga são
    preservados.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_axe
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_pa
  title: Pá de Unobtainium
  type: normal
  deps: [molde_unob, unob_lingote, vib_pa]
  desc: |
    Terra, areia e cascalho se rendem. Na bancada: a pá de Vibranium e um §elingote de
    Unobtainium§r mais o §emolde de ferraria de Unobtainium§r. O resultado tem o brilho roxo do
    metal.

    Útil para limpar ilhas inteiras em O Além. Nome e encantamentos da peça antiga são
    preservados.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_shovel
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_enxada
  title: Enxada de Unobtainium
  type: normal
  deps: [molde_unob, unob_lingote, vib_enxada]
  desc: |
    Pode parecer enfeite, mas é útil. Na bancada: a enxada de Vibranium e um §elingote de
    Unobtainium§r mais o §emolde de ferraria de Unobtainium§r. O resultado tem o brilho roxo do
    metal.

    Prepara terra sem desgaste, perfeita para as fazendas que sustentam sua jornada. Nome e
    encantamentos da peça antiga são preservados.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_hoe
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_clava
  title: Clava de Unobtainium
  type: normal
  deps: [molde_unob, unob_lingote, vib_clava]
  desc: |
    A queda aumenta o golpe. Na bancada: a clava de Vibranium e um §ebloco de Unobtainium§r mais
    o §emolde de ferraria de Unobtainium§r. O resultado tem o brilho roxo do metal.

    O dano cresce com a altura da queda, e um acerto aceito zera a queda acumulada. Nome e
    encantamentos da peça antiga são preservados.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_mace
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_elmo
  title: Elmo de Unobtainium
  type: normal
  deps: [molde_unob, unob_lingote, vib_elmo]
  desc: |
    Cada peça da armadura de Unobtainium não gasta e dá um poder próprio. O elmo protege contra
    afogamento: você respira debaixo d'água como se nada fosse.

    Na bancada: o elmo de Vibranium mais um §elingote de Unobtainium§r e o §emolde de
    ferraria§r. Importante: nenhuma dessas armaduras dá voo.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_helmet
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_peitoral
  title: Peitoral de Unobtainium
  type: normal
  deps: [molde_unob, unob_lingote, vib_peitoral]
  desc: |
    Cada peça da armadura de Unobtainium não gasta e dá um poder próprio. O peitoral protege do
    fogo e da lava e reduz o dano mágico.

    Na bancada: o peitoral de Vibranium mais um §elingote de Unobtainium§r e o §emolde de
    ferraria§r. O peitoral de Unobtainium protege até do vazio. Importante: nenhuma dessas
    armaduras dá voo.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_chestplate
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_calcas
  title: Calças de Unobtainium
  type: normal
  deps: [molde_unob, unob_lingote, vib_calcas]
  desc: |
    Cada peça da armadura de Unobtainium não gasta e dá um poder próprio. As calças ajudam a
    nadar e removem o efeito Wither.

    Na bancada: as calças de Vibranium mais um §elingote de Unobtainium§r e o §emolde de
    ferraria§r. Importante: nenhuma dessas armaduras dá voo.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_leggings
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: unob_botas
  title: Botas de Unobtainium
  type: normal
  deps: [molde_unob, unob_lingote, vib_botas]
  desc: |
    Cada peça da armadura de Unobtainium não gasta e dá um poder próprio. As botas anulam o dano
    de queda e ajudam a flutuar sobre a lava.

    Na bancada: as botas de Vibranium mais um §elingote de Unobtainium§r e o §emolde de
    ferraria§r. Importante: nenhuma dessas armaduras dá voo.
  tasks:
  - craft: allthemodiumlegacy:unobtainium_boots
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: jarra_etherium
  title: Jarra de Etherium
  type: optional
  deps: [unob_lingote]
  desc: |
    Seis lingotes de Unobtainium e um conduto de essência do Ars Magica: a §eJarra de Etherium de Unobtainium§r guarda poder arcano. Combine com seus rituais de magia.

    Um item decorativo e útil para quem mistura tecnologia e magia, Herói. Opcional. Receita no NEI (R/U). Combina com rituais e decoração.
  tasks:
  - get: allthemodiumlegacy:allthemodium_source_jar
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:unobtainium_nugget x9
- id: liga_vib_atm
  title: Liga Vibranium-Allthemodium
  type: main
  deps: [unob_lingote, coracao_piglich]
  desc: |
    No Alloy Smelter: §e1 lingote de Vibranium§r + §e1 de Allthemodium§r + §e1 Coração de Piglich§r. O coração é consumido. Você também pode fundir o pó da liga, se preferir.

    É a liga do machado e da pá de liga, Herói. Faça 3 e veja se os corações dão conta. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:vibranium_allthemodium_alloy_ingot x3
  rewards:
  - xp: 10
  - item:
    - allthemodiumlegacy:vibranium_allthemodium_alloy_ingot
- id: liga_unob_atm
  title: Liga Unobtainium-Allthemodium
  type: main
  deps: [liga_vib_atm]
  desc: |
    No Alloy Smelter: §e1 lingote de Unobtainium§r + §e1 de Allthemodium§r + §e1 Coração de Piglich§r. Mais densa, é a liga da picareta de liga.

    Faça 3, Herói, e já separe corações para as outras ligas. Se esquecer algo, o NEI (R/U) mostra a receita.
  tasks:
  - get: allthemodiumlegacy:unobtainium_allthemodium_alloy_ingot x3
  rewards:
  - xp: 10
  - item:
    - allthemodiumlegacy:unobtainium_allthemodium_alloy_ingot
- id: liga_unob_vib
  title: Liga Unobtainium-Vibranium
  type: main
  deps: [liga_vib_atm]
  desc: |
    No Alloy Smelter: §e1 lingote de Unobtainium§r + §e1 de Vibranium§r + §e1 Coração de Piglich§r. É a liga do Tridente e da espada de liga.

    Faça 3, Herói. Cada lingote consome um coração, então confira o estoque antes de começar. Receita no NEI (R/U).
  tasks:
  - get: allthemodiumlegacy:unobtainium_vibranium_alloy_ingot x3
  rewards:
  - xp: 10
  - item:
    - allthemodiumlegacy:unobtainium_vibranium_alloy_ingot
- id: liga_po_atm
  title: Pó das Ligas
  type: optional
  deps: [liga_unob_vib, liga_unob_atm]
  desc: |
    Cada liga também existe em pó, que você obtém triturando o lingote. Funda o pó numa fornalha e volta o lingote.

    É útil para armazenar ou para encaixar na rota de Mekanism, Herói. Opcional, mas pode ser uma boa alternativa de logística. Receitas no NEI (R/U).
  tasks:
  - get:
    - allthemodiumlegacy:vibranium_allthemodium_alloy_dust
    - allthemodiumlegacy:unobtainium_allthemodium_alloy_dust
    - allthemodiumlegacy:unobtainium_vibranium_alloy_dust
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:allthemodium_dust x2
- id: liga_blocos
  title: Blocos de Liga
  type: milestone
  deps: [liga_unob_vib, liga_unob_atm]
  desc: |
    Nove lingotes de cada liga formam um bloco, e o bloco de liga é ingrediente de etapas da Estrela ATM (Unobtainium-Allthemodium e Unobtainium-Vibranium). Faça §e1§r de cada.

    É um marco importante, Herói: são muitos lingotes e muitos corações de Piglich, mas cada bloco te aproxima da Estrela. Respire, organize o estoque e confira as receitas no NEI (R/U) antes de começar. Não esqueça de guardar um bloco de cada tipo para não faltar adiante. Boa sorte, Herói! Cada bloco consome muito material, então vá com calma e confira o NEI.
  tasks:
  - get:
    - allthemodiumlegacy:unobtainium_allthemodium_alloy_block
    - allthemodiumlegacy:unobtainium_vibranium_alloy_block
    - allthemodiumlegacy:vibranium_allthemodium_alloy_block
  rewards:
  - xp: 12
  - item:
    - allthemodiumlegacy:piglich_heart
- id: liga_picareta
  title: Picareta de Liga
  deps: [liga_unob_atm, unob_vara]
  desc: |
    Três lingotes de Unobtainium-Allthemodium e duas varas de Unobtainium, no formato de picareta.

    É a ferramenta mineradora dos finais, Herói. Depois de tanto esforço, vai valer cada lingote. Se esquecer a disposição na bancada, aperte R ou U no NEI. Use e abuse, ela aguenta tudo.
  tasks:
  - craft: allthemodiumlegacy:alloy_pick
  rewards:
  - xp: 10
  - item:
    - allthemodiumlegacy:unobtainium_rod x4
- id: liga_machado
  title: Machado de Liga
  deps: [liga_vib_atm, unob_vara]
  desc: |
    Três lingotes de Vibranium-Allthemodium e duas varas de Unobtainium. Derruba tudo em um golpe!

    É o machado que todo lenhador sonha, Herói. Monte na bancada no formato de machado e experimente em uma árvore. Receita no NEI (R/U) se precisar. Cuidado com o que está em cima da árvore.
  tasks:
  - craft: allthemodiumlegacy:alloy_axe
  rewards:
  - xp: 10
  - item:
    - allthemodiumlegacy:unobtainium_rod x4
- id: liga_pa
  title: Pá de Liga
  deps: [liga_vib_atm, unob_vara]
  desc: |
    Um lingote de Vibranium-Allthemodium e duas varas de Unobtainium. Simples, mas deixa a terra escorrer.

    É a ferramenta mais barata da série, Herói, então aproveite e faça logo. Monte no formato de pá na bancada. Se esquecer a disposição, o NEI (R/U) mostra. Não custa nada, e vale muito.
  tasks:
  - craft: allthemodiumlegacy:alloy_shovel
  rewards:
  - xp: 10
  - item:
    - allthemodiumlegacy:unobtainium_rod x4
- id: liga_espada
  title: Lâmina de Liga
  deps: [liga_unob_vib, unob_vara]
  desc: |
    Dois lingotes de Unobtainium-Vibranium e uma vara de Unobtainium. Uma lâmina rápida, afiada e que nunca perde o gume.

    É a arma ideal para quando o perigo aperta, Herói. Monte na bancada no formato de espada. Receita no NEI (R/U), caso esqueça. Use com orgulho e sem medo.
  tasks:
  - craft: allthemodiumlegacy:alloy_sword
  rewards:
  - xp: 10
  - item:
    - allthemodiumlegacy:unobtainium_rod x4
- id: liga_tridente
  title: Tridente de Liga
  type: boss
  icon: allthemodiumlegacy:alloy_trident
  deps: [liga_unob_vib, unob_vara]
  desc: |
    Três lingotes de Unobtainium-Vibranium e duas varas de Unobtainium formam o §eTridente de Liga§r. Ele volta para a mão, encadeia raios entre até 16 monstros próximos (sem queimar blocos) e carrega nome e encantamentos.

    Deixe espaço no inventário para recuperá-lo, Herói. Essa é a arma suprema do capítulo, então use com orgulho e atenção. Receita no NEI (R/U). Que a trovoada seja sua aliada, e que os monstros temam o seu nome. Boa luta, Herói! Ele é a joia do capítulo.
  tasks:
  - craft: allthemodiumlegacy:alloy_trident
  rewards:
  - xp: 15
  - loot: epico
- id: liga_paxel
  title: Pacachado de Liga
  type: milestone
  icon: allthemodiumlegacy:alloy_paxel
  deps: [liga_picareta, liga_machado, liga_pa, liga_unob_vib]
  desc: |
    Junte a picareta, o machado e a pá de liga com mais um lingote de Unobtainium-Vibranium, e saia com o §ePacachado de Liga§r: três ferramentas em uma.

    É a ferramenta definitiva de escavação do pack, Herói. Depois de tanto esforço, você merece. Monte na bancada com todas as peças prontas e confira a receita no NEI (R/U) se travar. Escave sem medo e com orgulho. Faça um brinde ao seu esforço, Herói! É a coroa do trabalho de ferraria. Tenha tudo pronto antes.
