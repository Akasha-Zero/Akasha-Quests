    mais o §emolde de ferraria de Allthemodium§r. O resultado tem o brilho dourado do metal.

    Derruba árvore de O Outro como se fosse grama. Nome e encantamentos da peça antiga são
    preservados.
  tasks:
  - craft: allthemodiumlegacy:allthemodium_axe
  rewards:
