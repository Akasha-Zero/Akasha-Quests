  tasks:
  - get: allthemodiumlegacy:vibranium_dust x2
  rewards:
  - xp: 4
  - item:
    - allthemodiumlegacy:vibranium_dust
- id: vib_lingote
  title: Lingote de Vibranium
  type: milestone
  icon: allthemodiumlegacy:vibranium_ingot
  deps: [bruto_vib]
  desc: |
    Funda o pó (ou o bruto com pirotita) e o §eLingote de Vibranium§r aparece, azulado, frio como o céu à noite. Ele é o degrau que une Allthemodium e Unobtainium na sua jornada.

    Guarde pelo menos §e4§r para o molde e a primeira peça, Herói. Esse é um marco e tanto, então comemore, porque o caminho ainda tem muitos degraus pela frente. Receita no NEI (R/U). Cuide bem desses lingotes, porque ele alimenta ligas, blocos, ferramentas e moldes. Se travar, o NEI ajuda.
  tasks:
  - get: allthemodiumlegacy:vibranium_ingot x4
  rewards:
  - xp: 8
  - item:
    - allthemodiumlegacy:vibranium_nugget x9
- id: vib_pepita
  title: Pepitas de Vibranium
  type: optional
  deps: [vib_lingote]
  desc: |
    Um lingote dá nove pepitas, nove pepitas dão um lingote. Útil para ajustar quantidades e como moeda de troca entre as máquinas do pack.

