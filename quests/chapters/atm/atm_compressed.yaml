chapter:
  id: atm_compressed
  title: All The Compressed
  prefix: ATM
  order: 915
  icon: allthemodiumlegacy:netherrack_compressed
  desc: |
    §6Armazenar o mundo em um bloco.§r Nove blocos viram um 1x, nove 1x viram um 2x, e assim até
    o 9x. A compressão só guarda: ela nunca multiplica. Este capítulo mostra os materiais que a
    Estrela ATM pede, com a quantidade equivalente de cada degrau.
quests:
- id: como_comprimir
  title: Como Comprimir
  type: info
  icon: minecraft:crafting_table
  desc: |
    Nove blocos iguais, na bancada, formam um bloco §e1x§r. Nove blocos 1x formam um §e2x§r, e
    assim até o §e9x§r. Cada degrau pode ser desfeito em nove do nível anterior, em ordem.

    Só aparecem famílias com fornecedor compatível no pack. Para conferir o nível, passe o mouse
    sobre o bloco: o texto diz "Equivale a N blocos base".
  tasks:
  - check: true
  rewards:
  - xp: 3
- id: netherrack_1x
  title: Netherrack 1x
  type: normal
  icon: allthemodiumlegacy:netherrack_compressed
  deps: [como_comprimir]
  desc: |
    O Nether inteiro cabe numa prateleira, se você tiver paciência!

    §7Equivale a 9 blocos base.§r Junte nove unidades base e faça o primeiro §e1x§r na bancada.

    Para recuperar, desfaça os níveis em ordem. Nada se perde, pode comprimir sem medo!
  tasks:
  - get: allthemodiumlegacy:netherrack_compressed
  rewards:
  - xp: 3
  - item:
    - minecraft:netherrack x64
- id: netherrack_3x
  title: Netherrack 3x
  type: normal
  icon: allthemodiumlegacy:netherrack_compressed:2
  deps: [netherrack_1x]
  desc: |
    Mais um degrau na escada da compressão, Herói: Netherrack 3x!

    §7Equivale a 729 blocos base.§r Encadeie nove blocos do nível anterior em cada passo, na bancada, até chegar ao §e3x§r. Para recuperar, desfaça os níveis em ordem. Nada se perde, então pode comprimir sem medo e economizar espaço no baú!
  tasks:
  - get: allthemodiumlegacy:netherrack_compressed:2
  rewards:
  - xp: 3
  - item:
    - minecraft:netherrack x64
- id: netherrack_6x
