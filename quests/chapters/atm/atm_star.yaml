chapter:
  id: atm_star
  title: "Capítulo 3 — A Estrela ATM"
  prefix: "ATM"
  order: 925
  icon: allthemodiumlegacy:atm_star
  desc: |
    §dO Volume da Estrela.§r Cinco fragmentos de etapa, uma dúzia de núcleos despertados, dezenas
    de milhares de Estrelas do Nether e o AllTheCatalystium: a montagem da Estrela ATM, o
    pseudo-final do livro. Cada ingrediente de outro mod tem a sua própria página aqui.
    (Akashic: All The Modium / All The Tweaks / All The Compressed)

quests:
  # ======================================================================
  # FASE 1 — A CONTAGEM COMEÇA
  # ======================================================================
  - id: abertura
    title: "O Último Volume"
    type: main
    deps: [atm_allthemodium:allthemodium, draconic:nucleo_despertado, enderio:almario, ic2:placa_iridio, thermal:enderio]
    icon: allthemodiumlegacy:atm_star
    desc: |
      Herói, respire fundo. Os oito Selos brilham e o Registro quase respira sozinho. Falta o
      último grande trabalho: a §dEstrela ATM§r.

      Você chegou até aqui com Draconium Despertado, Almário, Endério e placas de Irídio nos
      bolsos — e é exatamente isso que este volume cobra. Nada de novo para aprender, só muito
      para fabricar. Cada página abaixo é um ingrediente, e cada ingrediente é um passo.

      §aDica:§r abra o NEI no §eEstrela ATM§r (tecla R) sempre que ficar perdido.
    tasks:
      - check
    rewards:
      - xp: 10
      - item: minecraft:book x4
      - loot: raro

  - id: arvore_estrela
    title: "A Árvore da Estrela"
    type: info
    deps: [atm_allthemodium:guia_akashic]
    icon: allthemodiumlegacy:atm_star_shard_1
    desc: |
      O mapa completo, para você pregar na parede:

      §e•§r §dEstrela ATM§r = os §e5 Fragmentos de etapa§r (1/5 a 5/5), cada um com receita
      própria. §e•§r Cada fragmento pede §ecomponentes§r: Alma de Dragão, Semente Dimensional,
      Dispositivo de Probabilidade Improvável, Emissor Nexium, Buraco Negro Pulsante, Fragmento
      do Esquecimento, Bússola do Wither, Combustível do Filósofo, Patrick Estrela e
      AllTheCatalystium. §e•§r Os componentes pedem Núcleos Despertados, Irídio, Endério,
      Almário, Liga Vibrante, Corações de Piglich e blocos compactados.

      Não bastam cinco cópias do mesmo fragmento: são cinco etapas diferentes.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: automatizar
    title: "Automatize ou Desista"
    type: info
    deps: [arvore_estrela]
    icon: appliedenergistics2:tile.BlockInterface
    desc: |
      Sendo sincera: este volume é uma maratona. Só o Fragmento 2 pede por volta de §e79 mil
      Estrelas do Nether§r, e as ligas gastam um Coração de Piglich por lingote.

      Monte padrões no §bAE2§r para as etapas de máquina, mantenha reserva de Corações, Núcleos
      e Estrelas, e deixe fazendas de Wither e de Dragão rodando. O guia diz o mesmo: separe o
      que é máquina do que é bancada e confira a saída de cada padrão.
    tasks:
      - check
    rewards:
      - xp: 3
      - item: minecraft:redstone_block x4

  # ======================================================================
  # FASE 2 — INGREDIENTES DE OUTROS MODS
  # ======================================================================
  # ======================================================================
  # FASE 2b — MATÉRIAS-PRIMAS
  # ======================================================================
  - id: g_ouro
    title: "Ouro"
    type: normal
    deps: [abertura]
    icon: minecraft:gold_ingot
    desc: |
      Ouro é a base do Almário (com areia das almas) e da Liga Energética (com redstone e pó de
      glowstone). Junte §e64 lingotes§r — as fazendas de porcos-zumbis do Nether ajudam muito.
    tasks:
      - get: minecraft:gold_ingot x64
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x32

  - id: g_areia_almas
    title: "Areia das Almas"
    type: normal
    deps: [abertura]
    icon: minecraft:soul_sand
    desc: |
      A Areia das Almas é a outra metade do Almário. Ela vem do Nether (vales de areia das
      almas). Pegue §e64 blocos§r e ponha uma esteira para trazer mais.
    tasks:
      - get: minecraft:soul_sand x64
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x16

  - id: g_pedra_luminosa
    title: "Pó de Glowstone"
    type: normal
    deps: [abertura]
    icon: minecraft:glowstone_dust
    desc: |
      A Liga Energética também pede pó de glowstone. As cavernas do Nether têm de sobra; junte
      §e64§r.
    tasks:
      - get: minecraft:glowstone_dust x64
    rewards:
      - xp: 2
      - item: minecraft:redstone x32

  - id: g_chumbo
    title: "Do Thermal: Chumbo"
    type: normal
    deps: [abertura]
    icon: ThermalFoundation:material:67
    desc: |
      O Endério é uma liga de platina, chumbo e pérola do Ender. Junte §e16 lingotes de chumbo§r
      (minério do Thermal, bem comum).
    tasks:
      - get: ore:ingotLead x16
    rewards:
      - xp: 3
      - item: minecraft:iron_ingot x8

  - id: g_diamantes
    title: "Diamantes"
    type: normal
    deps: [abertura]
    icon: minecraft:diamond
    desc: |
      Os compactados de Diamante e as Placas de Irídio pedem diamantes, muitos. Minere ou use o
      Mining do Draconic; junte §e64§r.
    tasks:
      - get: minecraft:diamond x64
    rewards:
      - xp: 3
      - item: minecraft:diamond_block

  - id: g_esmeraldas
    title: "Esmeraldas"
    type: normal
    deps: [abertura]
    icon: minecraft:emerald
    desc: |
      A Esmeralda 4x da Semente vem de blocos de esmeralda. Aldeões compram trigo e carvão por
      esmeraldas; junte §e64§r.
    tasks:
      - get: minecraft:emerald x64
    rewards:
      - xp: 3
      - item: minecraft:emerald_block

  - id: g_obsidiana
    title: "Obsidiana"
    type: normal
    deps: [abertura]
    icon: minecraft:obsidian
    desc: |
      Água sobre lava rende obsidiana. Faça uma fazenda de obsidiana (lava fonte, balde de água,
      bloco de pistão) e junte §e128 blocos§r.
    tasks:
      - get: minecraft:obsidian x128
    rewards:
      - xp: 3
      - item: minecraft:obsidian x16

  - id: g_netherrack
    title: "Netherrack"
    type: normal
    deps: [abertura]
    icon: minecraft:netherrack
    desc: |
      O Netherrack 6x é o maior compactado da Semente. Comece guardando §e256§r e pense em um
      quebrador automático no Nether.
    tasks:
      - get: minecraft:netherrack x256
    rewards:
      - xp: 3
      - item: minecraft:netherrack x64

  - id: g_pedra_end
    title: "Pedra do End"
    type: normal
    deps: [abertura]
    icon: minecraft:end_stone
    desc: |
      O End dá pedra de sobra. Leve uma picareta eficiente e junte §e128§r.
    tasks:
      - get: minecraft:end_stone x128
    rewards:
      - xp: 3
      - item: minecraft:ender_pearl x4

  - id: g_carvao
    title: "Carvão"
    type: normal
    deps: [abertura]
    icon: minecraft:coal_block
    desc: |
      Dois compactados de Carvão 2x dão no Combustível do Filósofo. Comece com §e64 blocos de
      carvão§r.
    tasks:
      - get: minecraft:coal_block x64
    rewards:
      - xp: 3
      - item: minecraft:coal x32

  - id: g_blaze
    title: "Varetas de Blaze"
    type: normal
    deps: [abertura]
    icon: minecraft:blaze_rod
    desc: |
      A Vareta de Blaze 1x vem de blocos de varetas. Fazenda na Fortaleza do Nether e coleta
      automática: junte §e64 varetas§r.
    tasks:
      - get: minecraft:blaze_rod x64
    rewards:
      - xp: 3
      - item: minecraft:blaze_powder x16

  - id: g_tintas
    title: "Tintas para a Lã"
    type: normal
    deps: [abertura]
    icon: minecraft:dye:13
    desc: |
      Para o Patrick Estrela você precisa de lãs magenta, verde, rosa e lima. Tinta magenta,
      verde (cacto), rosa e lima — e lã branca para tingir. A tinta é fácil, a dúzia de lãs
      também.
    tasks:
      - get: [minecraft:dye:13 x4, minecraft:dye:2 x2, minecraft:dye:9 x2, minecraft:dye:10]
    rewards:
      - xp: 2
      - item: minecraft:wool x16

  - id: g_essencia_enderio
    title: "Atalho: Essências"
    type: optional
    deps: [abertura]
    icon: magicalcrops:EnderiumEssence
    desc: |
      Se você ama fazenda, o Magical Crops oferece uma rota para Endério e Almário: nove
      essências (de Enderium ou de Soularium) na bancada viram uma barra do metal. Ótimo para
      quem não quer minerar.
    tasks:
      - get: [magicalcrops:EnderiumEssence x9, magicalcrops:SoulariumEssence x9]
    rewards:
      - xp: 4
      - loot: incomum

  - id: g_lingote_draconio
    title: "Do Draconic: Lingotes de Draconium"
    type: normal
    deps: [abertura, draconic:lingote_draconio]
    icon: DraconicEvolution:draconiumIngot
    desc: |
      O Draconium é a espinha do Volume do Dragão. Todo Núcleo Dracônico leva quatro lingotes.
      Junte §e64§r para os núcleos e o resto das máquinas.
    tasks:
      - get: DraconicEvolution:draconiumIngot x64
    rewards:
      - xp: 4
      - item: DraconicEvolution:draconicCore x4

  - id: g_ritual
    title: "O Ritual do Despertar"
    type: info
    deps: [g_coracao_dragao, draconic:ritual_despertar_info]
    icon: DraconicEvolution:draconicBlock
    desc: |
      O Dragon Heart vai para o centro do Ritual do Despertar, num altar de blocos de Draconium
      Carregado: o resultado é um Bloco de Draconium Despertado, que se divide em lingotes.

      Cada Awakened Core precisa de 5 lingotes (menos de um bloco). Dez núcleos pedem por volta
      de 50 lingotes. O ritual repete quantas vezes você quiser, se o Dragão voltar.
    tasks:
      - check
    rewards:
      - xp: 4

  - id: g_platina
    title: "Do Thermal: Platina"
    type: normal
    deps: [abertura]
    icon: ThermalFoundation:material:69
    desc: |
      O Endério começa na Platina (o "Metal Brilhante" do Thermal, dos veios fundos). Junte §e16
      lingotes§r — fundição, ou pó mais fornalha.

      Sem platina não há Endério, e sem Endério não há Allthemodium.
    tasks:
      - get: ore:ingotPlatinum x16
    rewards:
      - xp: 3
      - item: minecraft:ender_pearl x8

  - id: g_pro_perola
    title: "Do Ender: Pérolas"
    type: normal
    deps: [abertura]
    icon: minecraft:ender_pearl
    desc: |
      A Pérola do Ender aparece em Endério, Liga Vibrante, Plataforma de Teletransporte e muito
      mais. Uma fazenda de Endermen resolve para sempre.

      Junte §e32 pérolas§r.
    tasks:
      - get: minecraft:ender_pearl x32
    rewards:
      - xp: 3
      - item: minecraft:obsidian x8

  - id: g_liga_energetica
    title: "Do Ender IO: Liga Energética"
    type: normal
    deps: [g_ouro, g_pedra_luminosa, enderio:liga_energetica]
    icon: EnderIO:itemAlloy:1
    desc: |
      Ouro, redstone e pó de brilho viram a §eLiga Energética§r. É o degrau antes da Liga
      Vibrante, que ganha uma Pérola do Ender por cima.

      Alvo: §e32 lingotes§r.
    tasks:
      - get: ore:ingotEnergeticAlloy x32
    rewards:
      - xp: 3
      - item: minecraft:redstone x32

  - id: g_minerio_iridio
    title: "Do IC2: Minério de Irídio"
    type: normal
    deps: [g_diamantes, ic2:minerio_iridio]
    icon: IC2:itemOreIridium
    desc: |
      O §eMinério de Irídio§r é raríssimo, mas a placa só existe com ele. Junte §e16§r.
    tasks:
      - get: IC2:itemOreIridium x16
    rewards:
      - xp: 4
      - item: minecraft:diamond x8

  - id: g_liga_ic2
    title: "Do IC2: Liga Avançada"
    type: normal
    deps: [abertura, ic2:liga_avancada]
    icon: IC2:itemPartAlloy
    desc: |
      A §eLiga Avançada§r (Advanced Alloy) vem da bancada do IC2: bronze, aço e placas. Cada
      Placa de Irídio consome quatro. Faça §e32§r.
    tasks:
      - get: IC2:itemPartAlloy x32
    rewards:
      - xp: 4
      - item: IC2:itemPlates:2 x8

  - id: g_arena_wither
    title: "Arena do Wither"
    type: normal
    deps: [abertura, draconic:arena_wither]
    icon: minecraft:skull:1
    desc: |
      Para fabricar Estrelas em ritmo industrial você precisa de uma arena fechada: caveiras de
      Wither Skeleton (Fortaleza do Nether), areia das almas e um jeito de reiniciar o combate
      sozinha.

      Traga §e3 caveiras§r e §e4 areias das almas§r por Wither. Vale automatizar.
    tasks:
      - get: [minecraft:skull:1 x3, minecraft:soul_sand x4]
    rewards:
      - xp: 4
      - item: minecraft:soul_sand x16

  - id: g_coracao_dragao
    title: "Do Draconic: Dragon Heart"
    type: normal
    deps: [abertura, draconic:coracao_dragao]
    icon: DraconicEvolution:dragonHeart
    desc: |
      O §eDragon Heart§r é o ingrediente-raiz do Draconium Despertado. Use o Ritual da
      Ressurreição para ter Dragões à vontade, e pegue um coração por vez.
    tasks:
      - get: DraconicEvolution:dragonHeart
    rewards:
      - xp: 8
      - loot: raro

  - id: g_nucleo_draconico
    title: "Do Draconic: Núcleo Dracônico"
    type: normal
    deps: [g_lingote_draconio, g_ouro, draconic:nucleo_draconico]
    icon: DraconicEvolution:draconicCore
    desc: |
      Cada Wyvern Core nasce de quatro §eNúcleos Dracônicos§r. Faça §e32§r como estoque (ouro,
      Draconium e diamante na bancada).
    tasks:
      - get: DraconicEvolution:draconicCore x32
    rewards:
      - xp: 6
      - item: DraconicEvolution:draconiumIngot x16

  - id: g_enderium
    title: "Do Thermal: Barras de Endério"
    type: normal
    deps: [g_platina, g_chumbo, g_pro_perola, thermal:enderio]
    icon: ThermalFoundation:material:76
    desc: |
      O Endério é o sal desta receita: aparece nos componentes, no Allthemodium Bruto e até no
      Vibranium Bruto. Você aprendeu a fazê-lo no Volume Térmico (platina + chumbo + pérola do
      Ender no crisol).

      Junte §e32 Barras de Endério§r para começar. Se tiver o Magical Crops, a essência também
      vira barra no 3x3, mas o Thermal é o jeito honesto.
    tasks:
      - get: ore:ingotEnderium x32
    rewards:
      - xp: 4
      - item: minecraft:ender_pearl x16

  - id: g_almario
    title: "Do Ender IO: Almário"
    type: normal
    deps: [g_ouro, g_areia_almas]
    icon: EnderIO:itemAlloy:7
    desc: |
      O §eAlmário§r (Soularium) sai do Alloy Smelter: areia das almas + ouro. É o ingrediente
      mais repetido da Estrela, além de ser a base do Allthemodium Bruto e dos Corações de
      Piglich.

      Separe §e32 lingotes§r. Dá para automatizar com areia das almas de farm e ouro de porco.
    tasks:
      - get: ore:ingotSoularium x32
    rewards:
      - xp: 4
      - item: minecraft:soul_sand x32

  - id: g_vibrante
    title: "Do Ender IO: Liga Vibrante"
    type: normal
    deps: [g_liga_energetica, g_pro_perola, enderio:liga_vibrante]
    icon: EnderIO:itemAlloy:2
    desc: |
      A §eLiga Vibrante§r (Energetic Alloy + Pérola do Ender, no Alloy Smelter) aparece nos
      componentes e, em dose maior, no Unobtainium Bruto: oito por pedaço.

      Faça um bom estoque: §e32 lingotes§r agora, e mais depois.
    tasks:
      - get: ore:ingotVibrantAlloy x32
    rewards:
      - xp: 4
      - item: minecraft:ender_pearl x8

  - id: g_iridio
    title: "Do IC2: Placas de Irídio"
    type: normal
    deps: [g_minerio_iridio, g_liga_ic2]
    icon: IC2:itemPartIridium
    desc: |
      Quase todo componente leva uma §ePlaca de Irídio§r no miolo (ela também entra no Vibranium
      Bruto). Lembra do minério de irídio e da bancada de IC2? Hora de usá-las em escala.

      Junte §e16 placas§r. Cada uma leva minério de irídio, ligas avançadas do IC2 e um diamante
      no centro: confira a receita no NEI e automatize o que puder.
    tasks:
      - get: IC2:itemPartIridium x16
    rewards:
      - xp: 5
      - item: minecraft:diamond x8

  - id: g_estrela_nether
    title: "Do Wither: Estrelas do Nether"
    type: normal
    deps: [g_arena_wither, draconic:estrela_nether]
    icon: minecraft:nether_star
    desc: |
      A Estrela do Nether é a moeda deste volume. Ela vira Corações de Piglich, Allthemodium
      Bruto, Alma de Dragão, miniaturas de portal e, em blocos compactados, a maior parte do
      peso da Estrela ATM.

      Comece com §e8 Estrelas§r e monte a arena do Wither de forma que dê para reiniciar
      sozinha. §cCuidado:§r a Bússola do Wither deste pack mantém o efeito Wither em você
      enquanto estiver na mão.
    tasks:
      - get: minecraft:nether_star x8
    rewards:
      - xp: 6
      - item: minecraft:soul_sand x16
      - item: minecraft:skull x3

  - id: g_nucleo_wyvern
    title: "Do Draconic: Núcleos Wyvern"
    type: normal
    deps: [g_nucleo_draconico, g_estrela_nether, draconic:nucleo_wyvern]
    icon: DraconicEvolution:wyvernCore
    desc: |
      Todo Awakened Core começa com quatro §eWyvern Cores§r. Cada Wyvern Core, por sua vez, come
      uma Estrela do Nether.

      Faça as contas: dez Awakened Cores significam quarenta Wyvern Cores, ou seja, quarenta
      Estrelas do Nether. Comece com §e4§r só para ver o gosto.
    tasks:
      - get: DraconicEvolution:wyvernCore x4
    rewards:
      - xp: 6
      - item: minecraft:diamond x4

  - id: g_lingote_despertado
    title: "Do Draconic: Lingotes Despertados"
    type: normal
    deps: [g_ritual, draconic:draconio_despertado]
    icon: DraconicEvolution:draconicIngot
    desc: |
      O outro pedaço do Awakened Core são cinco §eLingotes de Draconium Despertado§r, vindos do
      Ritual do Despertar com o Dragon Heart. Aqui o Dragão do Fim vira recurso renovável.

      Reúna §e5 lingotes§r para o primeiro núcleo.
    tasks:
      - get: DraconicEvolution:draconicIngot x5
    rewards:
      - xp: 6
      - item: minecraft:obsidian x16

  - id: g_nucleo_despertado
    title: "Do Draconic: Awakened Core"
    type: main
    deps: [g_nucleo_wyvern, g_lingote_despertado, draconic:nucleo_despertado]
    icon: DraconicEvolution:awakenedCore
    desc: |
      Aqui está o peso real da Estrela: o §eAwakened Core§r. Dez componentes e fragmentos pedem
      um cada, e as etapas de metal bruto (Unobtainium) pedem mais.

      Por enquanto, fabrique §e2§r. Nos próximos quadros vamos subir a meta.
    tasks:
      - get: DraconicEvolution:awakenedCore x2
    rewards:
      - xp: 8
      - item: DraconicEvolution:draconicCore x8

  - id: g_nucleos_6
    title: "Seis Núcleos Despertados"
    type: normal
    deps: [g_nucleo_despertado]
    icon: DraconicEvolution:awakenedCore
    desc: |
      Metade do caminho: §e6 Awakened Cores§r no inventário. Se você ainda faz tudo à mão, é bom
      perceber que a fazenda de Wither é o seu gargalo.
    tasks:
      - get: DraconicEvolution:awakenedCore x6
    rewards:
      - xp: 10
      - item: minecraft:nether_star x2

  - id: g_nucleos_10
    title: "Dez Núcleos Despertados"
    type: normal
    deps: [g_nucleos_6]
    icon: DraconicEvolution:awakenedCore
    desc: |
      Dez é o número mágico: um por componente que o pede e um para o Fragmento 3. Mais um para
      cada Unobtainium Bruto que você planejar.
    tasks:
      - get: DraconicEvolution:awakenedCore x10
    rewards:
      - xp: 14
      - loot: raro

  - id: g_alloy_smelter
    title: "Do Ender IO: Fundidora de Ligas"
    type: normal
    deps: [abertura, enderio:fundidora_ligas]
    icon: EnderIO:blockAlloySmelter
    desc: |
      A máquina que carrega todo este volume: o §bAlloy Smelter§r do Ender IO. Metais brutos,
      Corações de Piglich e as ligas nascem nele. Por isso mesmo, monte um modelo bom (com
      upgrades de capacitor) e, melhor ainda, vários em paralelo.
    tasks:
      - get: EnderIO:blockAlloySmelter
    rewards:
      - xp: 5
      - item: EnderIO:itemBasicCapacitor x2

  - id: g_energia
    title: "RF em Quantidade"
    type: info
    deps: [g_alloy_smelter]
    icon: EnderIO:blockCapBank
    desc: |
      Os brutos custam 150.000, 250.000 e 500.000 RF por peça, e cada Coração custa 250.000 RF.
      Uma rede de energia sólida (Capacitor Banks, Draconic Energy Core, reatores) é parte do
      trabalho — não do cansaço.
    tasks:
      - check
    rewards:
      - xp: 4
      - item: minecraft:redstone_block x8

  - id: g_ae2_controlador
    title: "Do AE2: Rede e Controlador"
    type: normal
    deps: [abertura, ae2:controlador]
    icon: appliedenergistics2:tile.BlockController
    desc: |
      Para guardar milhares de lingotes e estrelas, uma rede ME é o único caminho. Instale o
      §eControlador ME§r e monte armazenamento grande — este volume pede quantidades que esgotam
      baús em segundos.
    tasks:
