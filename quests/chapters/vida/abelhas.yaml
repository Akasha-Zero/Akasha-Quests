    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "g_impressora"
    title: "Genetic Imprinter"
    type: "normal"
    deps: ["g_modelo"]
    desc: |
      Abelhas sob medida, Herói!

      A §eImpressora Genética§r grava os genes de um Modelo numa princesa ou rainha: velocidade máxima, fertilidade, tolerâncias... Confira a receita no NEI (R/U) e prepare o DNA e os Modelos antes de usar. Com ela, o apiário vai ficar muito mais eficiente, Herói!
    tasks:
      - {"get": "gendustry:Imprinter"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "g_transpositor"
    title: "Genetic Transposer"
    type: "optional"
    deps: ["g_amostrador"]
    desc: |
      O §eTranspositor Genético§r copia uma amostra (ou modelo) para outra em branco, sem destruir o original.

      Ótimo para não perder genes raros, Herói. Opcional, mas seguro e esperto! Se precisar rever a receita, o NEI (R/U) mostra. Quem cuida bem dos genes economiza muito tempo de cruzamento depois.
    tasks:
      - {"get": "gendustry:Transposer"}
    rewards:
      - {"loot": "comum"}

  - id: "g_replicador"
    title: "Genetic Replicator"
    type: "milestone"
    icon: "gendustry:Replicator"
    deps: ["g_extrator", "g_liquefator", "g_modelo", "g_mutatron"]
    banner: "O Replicador"
    subtitle: "Vida escrita letra por letra"
    desc: |
      O sonho de todo apicultor: o §eReplicador Genético§r recebe um Modelo Genético completo, 1000 mB de DNA e 5000 mB de Proteína e §ecria uma abelha nova§r da espécie gravada.

      Herói... isso é escrever vida, letra por letra, como os Antigos. Depois de tantas máquinas montadas e tantos genes estudados, este é o ápice do laboratório. Faça com carinho e responsabilidade, e confira a receita no NEI (R/U). Eu confio em você. Comemore este marco com orgulho, Herói, porque poucos chegam tão longe na genética das abelhas!
    tasks:
      - {"get": "gendustry:Replicator"}
    rewards:
      - {"xp": 12}
      - {"kit": {"name": "Kit do Geneticista", "items": ["gendustry:Labware x32", "gendustry:GeneSampleBlank x16", "gendustry:GeneTemplate x2", "gendustry:UpgradeFrame x4", "gendustry:PowerModule x2"]}}
      - {"loot": "epico"}

