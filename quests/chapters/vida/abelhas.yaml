      A Bronzed dá pepitas de bronze (integração Thermal). Confira os detalhes no NEI (R/U) e tenha paciência com o acaso: cruzamentos podem levar várias tentativas. §7Mostre um zangão, princesa ou rainha §epuros§7 da espécie (os dois genes de espécie iguais). Você chega lá!§r
    tasks:
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesTEBronze\",UID1:\"magicbees.speciesTEBronze\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesTEBronze\",UID1:\"magicbees.speciesTEBronze\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesTEBronze\",UID1:\"magicbees.speciesTEBronze\"}]}}"], "nbt": true}
    rewards:
      - {"loot": "comum"}

  - id: "mb_cranio_wither"
    title: "Fragmento de Crânio"
    type: "optional"
    deps: ["mb_definhante"]
    desc: |
      Nove §eLascas de Osso de Esqueleto Wither§r (da Withering) = 1 §eFragmento de Crânio de Esqueleto Wither§r.

      Junte fragmentos e o Wither vem até você... com cuidado, Herói! Boa sorte na invocação.
    tasks:
      - {"get": "MagicBees:miscResources:4"}
    rewards:
      - {"loot": "incomum"}

  - id: "mb_pedaco_draconico"
    title: "Pedaço Dracônico"
    type: "optional"
    deps: ["mb_draconica"]
    desc: |
      Nove §ePós Dracônicos§r (da Draconic) formam um §ePedaço Dracônico§r, essência do Fim em pedra.

      Se precisar da receita, confira no NEI (R/U). Ficou lindo, hein?
    tasks:
      - {"get": "MagicBees:miscResources:6"}
    rewards:
      - {"loot": "incomum"}

  - id: "mb_apiario_magico"
    title: "Apiário Mágico"
    type: "normal"
    deps: ["mb_arcana", "mb_sobrenatural", "apiario"]
    desc: |
      Um Apiário + uma Gota Encantada (Arcane) + um Pólen Incomum (Supernatural), sem forma, = §eApiário Mágico§r.

      Ele aceita os boosters de Vis e de Mana para turbinar as abelhas. Confira a receita no NEI (R/U) se precisar de ajuda para reunir tudo. Mãos à obra, apimante!
    tasks:
      - {"get": "MagicBees:magicApiary"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "mb_quadro_magico"
    title: "Quadro Mágico"
    type: "normal"
    deps: ["mb_cera_magica"]
    desc: |
      Oito Ceras Mágicas em volta de um Quadro Não Tratado resultam em §eQuadro Mágico§r (240 usos).

      Com uma §eEssência§r ele vira um quadro especial: Resiliente (durabilidade), Gentil, Metabólico, Necrótico ou Temporal. Pesquise as Essências na aba Apimancia do Thaumonomicon, Herói! Se precisar rever a receita do quadro, o NEI (R/U) mostra tudo certinho.
    tasks:
      - {"get": "MagicBees:frameMagic"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "mb_quadros_essencia"
    title: "Quadros de Essência"
    type: "optional"
    icon: "MagicBees:frameTemporal"
    deps: ["mb_quadro_magico", "mb_alma"]
    desc: |
      Mostre qualquer quadro de essência: §eResiliente, Gentil, Metabólico, Necrótico ou Temporal§r.

      As Essências usam §eCera da Alma§r (linha Soul). Escolha o que combina com seu apiário e experimente!
    tasks:
      - {"one_of": ["MagicBees:frameResilient", "MagicBees:frameGentle", "MagicBees:frameMetabolic", "MagicBees:frameNecrotic", "MagicBees:frameTemporal"]}
    rewards:
      - {"loot": "incomum"}

  - id: "mb_puca_taumio"
    title: "Puça de Taumio"
    type: "optional"
    icon: "MagicBees:item.thaumiumScoop"
    deps: ["info_magicbees"]
    desc: |
      Pesquise §eThaumium Scoop§r (Apimancia): uma Puça mais durável, feita na Mesa Arcana.

      Existem também o Enxerto de Taumio e versões de Metal do Vazio. Missão opcional, mas ótima para quem gosta de upgrades!
    tasks:
      - {"one_of": ["MagicBees:item.thaumiumScoop", "MagicBees:item.thaumiumGrafter"]}
    rewards:
      - {"loot": "comum"}

  - id: "mb_mostrador_lunar"
    title: "Mostrador Lunar de Jade"
    type: "optional"
    deps: ["mb_arcana"]
    desc: |
      Várias mutações mágicas dependem da §elua§r, e o §eMostrador Lunar de Jade§r mostra a fase atual.

      Faça com corante verde, quartzo e redstone, e pendure ao lado do apiário. Assim você nunca perde a hora certa! Confira a receita no NEI (R/U) se travar. Missão opcional, Herói, mas muito útil!
    tasks:
      - {"get": "MagicBees:moonDial"}
    rewards:
      - {"loot": "comum"}

  - id: "mb_jarra"
    title: "Jarra do Colecionador"
    type: "optional"
    deps: ["mb_sobrenatural"]
    desc: |
      Vidro, laje, quartzo e Pólen Incomum: pronto, a §eJarra do Colecionador§r!

      Elá prende uma abelha e aplica o §eefeito§r dela na área, sem precisar de colmeia. Missão opcional, mas divertida, Herói. Se tiver dúvida, confira a receita no NEI (R/U) e escolha uma abelha com efeito interessante.
    tasks:
      - {"get": "MagicBees:effectJar"}
    rewards:
      - {"loot": "comum"}

  - id: "mb_booster_vis"
    title: "Vis Apiary Booster"
    type: "optional"
    icon: "MagicBees:visAuraProvider"
    deps: ["mb_apiario_magico"]
    desc: |
      Receita arcana, Herói (Apimancia)! O §eVis Apiary Booster§r alimenta o Apiário Mágico com vis da aura para acelerar as abelhas.

      O Mana Apiary Booster faz o mesmo com mana do Botania. Escolha o seu e turbine o apiário!
    tasks:
      - {"one_of": ["MagicBees:visAuraProvider", "MagicBees:manaAuraProvider"]}
    rewards:
      - {"loot": "incomum"}

  - id: "mb_singularidade"
    title: "Singularidade Dimensional"
    type: "optional"
    deps: ["mb_oblivion"]
    desc: |
      Bloco de ouro, blocos de quartzo, olho do fim e pedra do Fim: assim nasce a §eSingularidade Dimensional§r.

      Ela é a base do §eÍmã Misterioso§r (puxa itens) e da Essência do Esquecimento. Vale a pena guardar uma!
    tasks:
      - {"get": "MagicBees:miscResources:17"}
    rewards:
      - {"loot": "incomum"}

  - id: "apimancia"
    title: "Maestria da Apimancia"
    type: "milestone"
    icon: "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesEthereal\",UID1:\"magicbees.speciesEthereal\"}]}}"
    deps: ["mb_eterea", "mb_apiario_magico", "mb_quadro_magico"]
    banner: "Mestre da Apimancia"
    subtitle: "Taumaturgia em favos"
    desc: |
      Abelhas que choram vis, sussurram aspectos e pousam em pilares do Fim. Herói, isso não é mais
      apicultura — é §dmagia viva§r. A página onde os Antigos misturaram taumaturgia e colmeia brilha de
      novo no Registro!

      Guarde princesas puras da §eEthereal§r e da §eArcane§r: elas são a raiz de quase tudo no MagicBees.
    tasks:
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesEthereal\",UID1:\"magicbees.speciesEthereal\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesEthereal\",UID1:\"magicbees.speciesEthereal\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesEthereal\",UID1:\"magicbees.speciesEthereal\"}]}}"], "nbt": true}
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesArcane\",UID1:\"magicbees.speciesArcane\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesArcane\",UID1:\"magicbees.speciesArcane\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesArcane\",UID1:\"magicbees.speciesArcane\"}]}}"], "nbt": true}
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesSupernatural\",UID1:\"magicbees.speciesSupernatural\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesSupernatural\",UID1:\"magicbees.speciesSupernatural\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"magicbees.speciesSupernatural\",UID1:\"magicbees.speciesSupernatural\"}]}}"], "nbt": true}
      - {"get": "MagicBees:magicApiary"}
    rewards:
      - {"xp": 10}
      - {"kit": {"name": "Kit do Apimante", "items": ["MagicBees:wax x32", "MagicBees:frameMagic x4", "MagicBees:drop x8", "MagicBees:pollen x8", "Forestry:royalJelly x8"]}}
      - {"loot": "raro"}

  - id: "info_gendustry"
    title: "Engenharia Genética"
    type: "info"
    icon: "gendustry:Mutatron"
    deps: ["nobreza_industria"]
    desc: |
      O §bGendustry§r transforma a apicultura em indústria. Regras deste pack (config do mod):

      §e• Energia:§r as máquinas aceitam §bRF§r (e também EU do IC2 até MV). Internamente contam em MJ:
      §e10 RF = 1 MJ§r.
      §e• Vidraria Genética§r (Labware) é consumida na maioria dos processos.
      §e• Mutagênico§r vem de redstone, glowstone e urânio no Produtor de Mutagênico.
      §e• Princesas artificiais§r (saídas das máquinas) podem morrer no Mutatron (10%); as naturais não.
      §e• O Replicador§r cria abelhas a partir de um Modelo Genético, DNA e proteína.

      Os nomes do Gendustry aparecem em inglês no jogo.
    tasks:
      - {"check": true}
    rewards:
      - {"xp": 2}

  - id: "g_modulo_energia"
    title: "Power Module"
    type: "normal"
    icon: "gendustry:PowerModule"
    deps: ["info_gendustry"]
    desc: |
      Bem-vindo ao Gendustry, Herói!

      Faça o §ePower Module§r com engrenagens de bronze, ouro, pistões e redstone. Ele vai em quase toda máquina, então faça vários para não faltar depois. Se travar na receita, confira no NEI (R/U). Bora montar o seu laboratório genético com calma e boa organização!
    tasks:
      - {"get": "gendustry:PowerModule"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:ingotBronze x8"}

  - id: "g_processador"
    title: "Genetics Processor"
    type: "normal"
    icon: "gendustry:GeneticsProcessor"
    deps: ["info_gendustry"]
    desc: |
      Diamantes, quartzo e um §eChipset Pulsante§r do BuildCraft (ou na Mesa de Montagem do BuildCraft): eis o §eGenetics Processor§r.

      Ele é o cérebro das máquinas genéticas. Capriche e faça alguns, Herói, porque as máquinas genéticas vão pedir vários! Se precisar rever a receita, o NEI (R/U) mostra o desenho certinho.
    tasks:
      - {"get": "gendustry:GeneticsProcessor"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:ingotBronze x8"}

  - id: "g_receptaculo"
    title: "Bee Receptacle"
    type: "normal"
    icon: "gendustry:BeeReceptacle"
    deps: ["info_gendustry"]
    desc: |
      Bronze, painel de vidro, redstone e uma placa de pressão leve: o §eBee Receptacle§r está pronto!

      Ele é peça-chave do Apiário Industrial. Se tiver dúvida na receita, o NEI (R/U) ajuda.
    tasks:
      - {"get": "gendustry:BeeReceptacle"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:ingotBronze x8"}

  - id: "g_tanque"
    title: "Mutagen Tank"
    type: "normal"
    icon: "gendustry:MutagenTank"
    deps: ["info_gendustry"]
    desc: |
      Estanho e painéis de vidro formam o §eMutagen Tank§r.

      Ele guarda o mutagênico das suas máquinas genéticas. Simples e bem útil, Herói!
    tasks:
      - {"get": "gendustry:MutagenTank"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:ingotBronze x8"}

  - id: "g_vidraria"
    title: "Genetics Labware"
    type: "normal"
    icon: "gendustry:Labware"
    deps: ["info_gendustry"]
    desc: |
      Todo laboratório precisa de vidraria, Herói!

      Painéis de vidro e 1 diamante na bancada rendem 16 vidrarias: o §eGenetics Labware§r. Elas acabam rápido, então produza um bom estoque e continue firme, sem pressa! Se tiver dúvida na receita, o NEI (R/U) mostra tudo. Bom trabalho e boas pesquisas!
    tasks:
      - {"get": "gendustry:Labware x16"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:ingotBronze x8"}

  - id: "g_moldura"
    title: "Upgrade Frame"
    type: "normal"
    icon: "gendustry:UpgradeFrame"
    deps: ["info_gendustry"]
    desc: |
      Estanho, pepitas de ouro e redstone: a base de todo upgrade do Apiário Industrial é a §eUpgrade Frame§r.

      Faça algumas desde já, pois você vai precisar de várias, Herói. Se precisar rever a receita, o NEI (R/U) mostra o desenho certinho. Planejar o estoque agora poupa viagens depois. Bora!
    tasks:
      - {"get": "gendustry:UpgradeFrame"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:ingotBronze x8"}

  - id: "g_produtor"
    title: "Mutagen Producer"
    type: "main"
    deps: ["g_modulo_energia", "g_tanque"]
    desc: |
      Bronze, funil, 2 Power Modules, Carcaça Resistente, engrenagens e o Mutagen Tank: monte o §eProdutor de Mutagênico§r!

      Ele transforma §eredstone (100 mB), glowstone (200 mB)§r e urânio em §eMutagênico§r. A ciência genética começa aqui!
    tasks:
      - {"get": "gendustry:MutagenProducer"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:honeyDrop x16", "Forestry:beeswax x16", "Forestry:frameImpregnated x2"]}

  - id: "g_mutagenico"
    title: "Mutagênico"
    type: "normal"
    icon: "gendustry:MutagenCan"
    deps: ["g_produtor"]
    desc: |
      Encha §e1000 mB de Mutagênico§r (lata ou balde).

      Cada operação do Mutatron gasta exatamente isso, então tenha um estoque pronto. Você está quase lá!
    tasks:
      - {"fluid": "mutagen x1000"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "g_mutatron"
    title: "Mutatron"
    type: "main"
    deps: ["g_produtor", "g_processador", "g_receptaculo", "g_vidraria"]
    desc: |
      Esqueça a sorte! O §eMutatron§r recebe uma §eprincesa§r e um §ezangão§r de um par de mutação,
      1000 mB de mutagênico e uma vidraria — e devolve a §erainha da espécie nova§r, garantido.

      Receita: 3 Bee Receptacles, Genetics Processor, Power Module, Carcaça Resistente, Mutagen Tank e
      bronze. Mutações secretas aparecem com 10% de chance.
    tasks:
      - {"get": "gendustry:Mutatron"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:honeyDrop x16", "Forestry:beeswax x16", "Forestry:frameImpregnated x2"]}

  - id: "g_mutatron_avancado"
    title: "Advanced Mutatron"
    type: "normal"
    deps: ["g_mutatron"]
    desc: |
      Controle total sobre as mutações, Herói!

      O Mutatron + quartzo, 2 Genetics Processors, Power Module e engrenagens formam o §eAdvanced Mutatron§r. Ele deixa você §eescolher§r qual mutação quer quando o par tem várias possíveis. Confira a receita no NEI (R/U) e monte o seu, que o laboratório vai ficar completo!
    tasks:
      - {"get": "gendustry:MutatronAdv"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "g_apiario_industrial"
    title: "Industrial Apiary"
    type: "main"
    deps: ["g_receptaculo", "g_moldura"]
    desc: |
      Vidro, Bee Receptacle, Carcaça Resistente, engrenagens de bronze e pistão: eis o §eApiário Industrial§r!

      É um apiário elétrico (2 MJ/t base = 20 RF/t) com 4 slots de upgrade. Seu apiário subiu de nível, Herói! Confira a receita no NEI (R/U) e comece a pensar em quais upgrades vai colocar primeiro.
    tasks:
      - {"get": "gendustry:IndustrialApiary"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:honeyDrop x16", "Forestry:beeswax x16", "Forestry:frameImpregnated x2"]}

  - id: "g_up_producao"
    title: "Production Upgrade"
    type: "normal"
    icon: "gendustry:ApiaryUpgrade"
    deps: ["g_apiario_industrial"]
    desc: |
      Geléia Real, açúcar e bronze rendem o §eProduction Upgrade§r: §e+20% de produção§r (e de energia) por upgrade, até 8.

      Mais produção, mais mel! Equipe seu Apiário Industrial.
    tasks:
      - {"get": "gendustry:ApiaryUpgrade"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "g_up_automacao"
    title: "Automation Upgrade"
    type: "normal"
    icon: "gendustry:ApiaryUpgrade:14"
    deps: ["g_apiario_industrial"]
    desc: |
      O §eAutomation Upgrade§r reinsere sozinho a princesa e um zangão: o apiário roda para sempre.

      É a chave da automação, então não deixe de fazer. Confira a receita no NEI (R/U).
    tasks:
      - {"get": "gendustry:ApiaryUpgrade:14"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "g_up_estabilizador"
    title: "Genetic Stabilizer"
    type: "optional"
    icon: "gendustry:ApiaryUpgrade:19"
    deps: ["g_apiario_industrial"]
    desc: |
      Quer produzir sem estragar a linhagem, Herói?

      O §eGenetic Stabilizer§r bloqueia mutações, ideal para produção pura. Use quando quiser só produzir e manter a abelha como está. Confira a receita no NEI (R/U) para montar o upgrade. Opcional, mas bem prático para quem já tem a linhagem certa!
    tasks:
      - {"get": "gendustry:ApiaryUpgrade:19"}
    rewards:
      - {"loot": "comum"}

  - id: "g_up_clima"
    title: "Upgrades de Clima"
    type: "optional"
    icon: "gendustry:ApiaryUpgrade:4"
    deps: ["g_apiario_industrial"]
    desc: |
      Aquecedor, Resfriador, Umidificador e Secador mudam temperatura e umidade em degraus de 0,25.

      São os §eUpgrades de Clima§r, ótimos para ajustar o ambiente da abelha. Opcional, mas muito útil, Herói! Qualquer um deles completa a missão, então escolha o que mais combina com a sua abelha. Confira as receitas no NEI (R/U).
    tasks:
      - {"one_of": ["gendustry:ApiaryUpgrade:4", "gendustry:ApiaryUpgrade:5", "gendustry:ApiaryUpgrade:6", "gendustry:ApiaryUpgrade:7"]}
    rewards:
      - {"loot": "comum"}

  - id: "g_up_emulacao"
    title: "Emulação de Bioma"
    type: "optional"
    icon: "gendustry:ApiaryUpgrade:13"
    deps: ["g_apiario_industrial"]
    desc: |
      Os upgrades de §eEmulação de Bioma§r emulam Inferno, Deserto, Selva, Planície, Inverno e Oceano.

      Assim, qualquer abelha trabalha em qualquer lugar! Veja as receitas no NEI (R/U).
    tasks:
      - {"one_of": ["gendustry:ApiaryUpgrade:13", "gendustry:ApiaryUpgrade:16", "gendustry:ApiaryUpgrade:17", "gendustry:ApiaryUpgrade:18", "gendustry:ApiaryUpgrade:20", "gendustry:ApiaryUpgrade:21"]}
    rewards:
      - {"loot": "comum"}

  - id: "g_up_ceu"
    title: "Céu, Luz e Selagem"
    type: "optional"
    icon: "gendustry:ApiaryUpgrade:10"
    deps: ["g_apiario_industrial"]
    desc: |
      Três upgrades de ambiente: Open Sky (céu aberto), Light (trabalha à noite) e Seal (trabalha na chuva).

      São os upgrades de §eCéu, Luz e Selagem§r. Opcionais, mas deixam o apiário mais independente!
    tasks:
      - {"one_of": ["gendustry:ApiaryUpgrade:10", "gendustry:ApiaryUpgrade:11", "gendustry:ApiaryUpgrade:12"]}
    rewards:
      - {"loot": "comum"}

  - id: "g_extrator"
    title: "DNA Extractor"
    type: "normal"
    deps: ["g_processador", "g_modulo_energia"]
    desc: |
      Ciência em ação, Herói!

      O §eExtrator de DNA§r tira §eDNA Líquido§r de abelhas, mudas, pólen e borboletas (uma princesa dá 500 mB, um zangão 100 mB). Monte a máquina e encha 1000 mB de DNA. Se tiver dúvida na receita, o NEI (R/U) ajuda. Bom trabalho no laboratório!
    tasks:
      - {"get": "gendustry:Extractor"}
      - {"fluid": "liquiddna x1000"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "g_liquefator"
    title: "Protein Liquifier"
    type: "normal"
    deps: ["g_modulo_energia"]
    desc: |
      O §eLiquefator de Proteína§r derrete carne crua (porco 500 mB, boi 450, frango 350, peixe 250) em §eProteína§r.

      Encha §e5000 mB§r: o Replicador gasta isso por abelha. Tem carne de sobra, Herói? Monte o liquefator, alimente-o com calma e confira a receita no NEI (R/U) se precisar.
    tasks:
      - {"get": "gendustry:Liquifier"}
      - {"fluid": "protein x5000"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "g_amostrador"
    title: "Genetic Sampler"
    type: "normal"
    deps: ["g_processador", "g_vidraria"]
    desc: |
      Coloque uma abelha, uma §eAmostra em Branco§r (estanho e redstone) e uma vidraria: o §eAmostrador Genético§r copia §eum gene aleatório§r para a amostra (a abelha é consumida).

      Mostre uma amostra preenchida. Que ciência bonita!
    tasks:
      - {"get": ["gendustry:Sampler", "gendustry:GeneSample"]}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:honeyDrop x8"}

  - id: "g_modelo"
    title: "Genetic Template"
    type: "normal"
    deps: ["g_amostrador"]
    desc: |
      Redstone, estanho e 1 diamante = §eModelo Genético§r.

      Na bancada, junte o modelo com amostras (sem forma) para gravar vários genes de uma vez. Um modelo §ecompleto§r (todos os genes de uma espécie) é o que o Replicador pede.
    tasks:
