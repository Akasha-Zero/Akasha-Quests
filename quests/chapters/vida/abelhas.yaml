chapter:
  id: "abelhas"
  title: "Apicultura (Forestry, MagicBees, Gendustry)"
  prefix: ""
  order: 605
  icon: "Forestry:apiculture"
  desc: |
    §eO Volume das Colmeias.§r Colmeias selvagens, Apiário e Apiaryum, árvores de mutação,
    ExtraBees, a Apimancia do MagicBees, a engenharia genética do Gendustry e as abelhas
    metalúrgicas da Família ATM. Marco final: §6Selo da Vida§r.

quests:
  - id: "puca"
    title: "A Puça"
    type: "main"
    desc: |
      Bzzzz... ouviu? É o som de uma das páginas mais vivas do Registro, Herói: a §dapicultura§r.

      Antes de tudo, a ferramenta: a §ePuça§r (Scoop) — gravetos e lã. Com ela você quebra
      §ecolmeias selvagens§r e recolhe as abelhas que moram lá (princesas e zangões), além de capturar
      borboletas.

      Faça a sua e vá passear pelos biomas. Eu conto o que procurar na próxima página!
    tasks:
      - {"get": "Forestry:scoop"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:bread x8", "minecraft:torch x16", "minecraft:wool x4"]}

  - id: "info_colmeias"
    title: "Colmeias Selvagens"
    type: "info"
    icon: "Forestry:beehives:1"
    deps: ["puca"]
    desc: |
      Cada bioma tem a sua colmeia (conferido no código do Forestry 4.11.36):

      §e• Colméia da Floresta§r — presa aos troncos, em florestas → abelha §eFlorestal§r
      §e• Colméia dos Prados§r — no chão, em planícies → §edos Prados§r
      §e• Colméia Modesta§r — no chão, em desertos → §eModesta§r
      §e• Colméia Tropical§r — nas árvores da selva → §eTropical§r
      §e• Colméia Invernal§r — no chão, em biomas de neve → §eInvernal§r
      §e• Colméia do Alagadiço§r — no chão, em pântanos → §edo Pantanal§r
      §e• Colméia do Fim§r — na pedra do Fim → §eEnder§r

      MagicBees e ExtraBees adicionam outras colmeias (veja as fases deles). Quebre-as com a Puça. Às
      vezes sai uma abelha rara (§eValente§r) ou uma variante resistente à chuva.

      §aDica:§r o §eLocalizador de Habitats§r aponta para o bioma certo de cada espécie.
    tasks:
      - {"check": true}
    rewards:
      - {"xp": 1}

  - id: "florestal"
    title: "Abelha Florestal"
    type: "normal"
    icon: "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesForest\",UID1:\"forestry.speciesForest\"}]}}"
    deps: ["info_colmeias"]
    desc: |
      Onde: §eColméia da Floresta (troncos de árvores em florestas)§r.

      Dócil e comum, produz §eFavos de Mel§r. Algumas saem resistentes à chuva!

      §7Mostre um zangão, princesa ou rainha §epuros§7 da espécie (os dois genes de espécie iguais).§r
    tasks:
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesForest\",UID1:\"forestry.speciesForest\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesForest\",UID1:\"forestry.speciesForest\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesForest\",UID1:\"forestry.speciesForest\"}]}}"], "nbt": true}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:beeCombs x4"}

  - id: "prados"
    title: "Abelha dos Prados"
    type: "normal"
    icon: "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesMeadows\",UID1:\"forestry.speciesMeadows\"}]}}"
    deps: ["info_colmeias"]
    desc: |
      Onde: §eColméia dos Prados (no chão, em planícies)§r.

      Outra abelha de mel, típica dos campos temperados.

      §7Mostre um zangão, princesa ou rainha §epuros§7 da espécie (os dois genes de espécie iguais).§r
    tasks:
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesMeadows\",UID1:\"forestry.speciesMeadows\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesMeadows\",UID1:\"forestry.speciesMeadows\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesMeadows\",UID1:\"forestry.speciesMeadows\"}]}}"], "nbt": true}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:beeCombs x4"}

  - id: "modesta"
    title: "Abelha Modesta"
    type: "normal"
    icon: "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesModest\",UID1:\"forestry.speciesModest\"}]}}"
    deps: ["info_colmeias"]
    desc: |
      Onde: §eColméia Modesta (no chão, em desertos)§r.

      Adora calor seco e cactos (as "flores" dela). Produz §eFavos Resequidos§r.

      §7Mostre um zangão, princesa ou rainha §epuros§7 da espécie (os dois genes de espécie iguais).§r
    tasks:
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesModest\",UID1:\"forestry.speciesModest\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesModest\",UID1:\"forestry.speciesModest\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesModest\",UID1:\"forestry.speciesModest\"}]}}"], "nbt": true}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:beeCombs x4"}

  - id: "tropical"
    title: "Abelha Tropical"
    type: "normal"
    icon: "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesTropical\",UID1:\"forestry.speciesTropical\"}]}}"
    deps: ["info_colmeias"]
    desc: |
      Onde: §eColméia Tropical (nas árvores da selva)§r.

      Vive no calor úmido; as flores dela são samambaias e cipós. Produz §eFavos Sedosos§r.

      §7Mostre um zangão, princesa ou rainha §epuros§7 da espécie (os dois genes de espécie iguais).§r
    tasks:
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesTropical\",UID1:\"forestry.speciesTropical\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesTropical\",UID1:\"forestry.speciesTropical\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesTropical\",UID1:\"forestry.speciesTropical\"}]}}"], "nbt": true}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:beeCombs x4"}

  - id: "invernal"
    title: "Abelha Invernal"
    type: "normal"
    icon: "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesWintry\",UID1:\"forestry.speciesWintry\"}]}}"
    deps: ["info_colmeias"]
    desc: |
      Onde: §eColméia Invernal (biomas de neve)§r.

      Gelada e muito fértil. Produz §eFavos Congelados§r.

      §7Mostre um zangão, princesa ou rainha §epuros§7 da espécie (os dois genes de espécie iguais).§r
    tasks:
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesWintry\",UID1:\"forestry.speciesWintry\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesWintry\",UID1:\"forestry.speciesWintry\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesWintry\",UID1:\"forestry.speciesWintry\"}]}}"], "nbt": true}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:beeCombs x4"}

  - id: "pantanal"
    title: "Abelha do Pantanal"
    type: "normal"
    icon: "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesMarshy\",UID1:\"forestry.speciesMarshy\"}]}}"
    deps: ["info_colmeias"]
    desc: |
      Onde: §eColméia do Alagadiço (pântanos)§r.

      Adora umidade e cogumelos. Produz §eFavos de Musgo§r.

      §7Mostre um zangão, princesa ou rainha §epuros§7 da espécie (os dois genes de espécie iguais).§r
    tasks:
      - {"one_of": ["Forestry:beeDroneGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesMarshy\",UID1:\"forestry.speciesMarshy\"}]}}", "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesMarshy\",UID1:\"forestry.speciesMarshy\"}]}}", "Forestry:beeQueenGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesMarshy\",UID1:\"forestry.speciesMarshy\"}]}}"], "nbt": true}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:beeCombs x4"}

  - id: "colmeia"
    title: "A Primeira Colméia"
    type: "main"
    deps: ["florestal", "prados"]
    deps_any: true
    desc: |
      Uma princesa e um zangão precisam de um lar. A §eColméia§r (Bee House) é o mais simples: lajes de
      madeira em cima, tábuas e um §efavo§r no centro.

      Coloque uma §eprincesa§r e um §ezangão§r: ela vira §erainha§r, trabalha, e no fim da vida deixa
      uma nova princesa e zangões. Ponha a colméia no bioma da abelha e com as flores certas por perto.
    tasks:
      - {"get": "Forestry:apiculture:2"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:red_flower x8", "minecraft:yellow_flower x8", "minecraft:planks x32"]}

  - id: "info_reproducao"
    title: "Princesas, Zangões e Rainhas"
    type: "info"
    icon: "Forestry:beeQueenGE"
    deps: ["colmeia"]
    desc: |
      O básico do ciclo (e algumas armadilhas):

      §e• Princesa + Zangão = Rainha.§r A rainha vive, produz e, ao morrer, deixa §e1 princesa e
      alguns zangões§r com genes misturados dos pais.
      §e• Imaculada × Ignóbil.§r Princesas "ignóbeis" se degradam e um dia param de gerar princesas.
      Prefira as §eimaculadas§r (pristine) para manter a linhagem.
      §e• Clima e flores.§r Cada espécie tem temperatura, umidade, flores e horário (diurna/noturna).
      O GUI mostra o erro quando algo está errado.
      §e• §cA Colméia (Bee House) não gera mutações!§r O modificador de mutação dela é zero — para criar
      espécies novas você precisa do §eApiário§r.
    tasks:
      - {"check": true}
    rewards:
      - {"xp": 1}

  - id: "favo_mel"
    title: "Favos de Mel"
    type: "normal"
    deps: ["colmeia"]
    desc: |
      Rainha feliz, favos no inventário! Junte §e16 Favos de Mel§r. Eles vão para a §eCentrífuga§r do
      Forestry, que separa §eCera de Abelha§r e §eGotas de Mel§r.
    tasks:
      - {"get": "Forestry:beeCombs x16"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:planks x16"}

  - link: forestry:centrifuga
  - link: forestry:carpinteiro
  - link: forestry:involucro_impregnado
  - id: "gota_mel"
    title: "Gotas de Mel"
    type: "normal"
    deps: ["favo_mel", "forestry:centrifuga"]
    desc: |
      Na Centrífuga, cada Favo de Mel dá §ecera (100%)§r e §egota de mel (90%)§r. As gotas são o
      "combustível" dos analisadores, viram mel líquido no Hidratador e entram em selos, comidas e
      receitas. Junte §e16 Gotas de Mel§r.
    tasks:
      - {"get": "Forestry:honeyDrop x16"}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:beeCombs x8"}

  - id: "cera"
    title: "Cera de Abelha"
    type: "normal"
    deps: ["favo_mel", "forestry:centrifuga"]
    desc: |
      A §eCera de Abelha§r vira cápsulas (3 ceras = 4 cápsulas), velas, o Molde de Cera e os Painéis
      Perfumados do Apiaryum. Junte §e16§r.
    tasks:
      - {"get": "Forestry:beeswax x16"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:string x8"}

  - id: "abelhanalizador"
    title: "Abelhanalizador"
    type: "main"
    deps: ["gota_mel", "forestry:carpinteiro"]
    desc: |
      Agora você vai ler o DNA das suas abelhas, Herói!

      No Carpinteiro: estanho, painéis de vidro, redstone, um diamante e 2000 mB de água viram o
      §eAbelhanalizador§r (Beealyzer). Cada análise gasta §euma Gota de Mel ou um Melaço§r. Ele mostra
      espécie (ativa e inativa), velocidade, vida, fertilidade, tolerâncias, flores, território e
      efeito. A partir daqui, analise TUDO.
    tasks:
      - {"get": "Forestry:beealyzer"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:honeyDrop x32", "minecraft:diamond", "Forestry:ingotTin x8"]}

  - id: "info_clima"
    title: "Clima, Flores e Comportamento"
    type: "info"
    icon: "Forestry:beealyzer"
    deps: ["abelhanalizador"]
    desc: |
      O que o Abelhanalizador te conta e o que fazer com isso:

      §e• Temperatura e umidade:§r cada espécie tem um ideal (ex.: Modesta = quente e seca). A
      §etolerância§r (Ambos 1, Acima 2...) diz quanto ela aguenta fora disso.
      §e• Flores:§r baunilha (flores comuns), cactos, cogumelos, selva (samambaia/cipó), fungo do Nether,
      trigo, abóbora/melancia... e a do Fim é um §eOvo de Dragão§r!
      §e• Noturna / Habitante de Caverna / Voa na Chuva:§r sem esses genes ela para à noite, debaixo
      de teto ou na chuva.
      §e• Efeitos:§r algumas espécies envenenam, queimam ou atacam. Use a §eRoupa de Apicultor§r.
    tasks:
      - {"check": true}
    rewards:
      - {"xp": 1}

  - id: "apiario"
    title: "Apiário"
    type: "main"
    deps: ["colmeia", "forestry:involucro_impregnado"]
    desc: |
      Hora de profissionalizar! O §eApiário§r (lajes, tábuas e um §eInvólucro Impregnado§r) produz
      melhor que a Colméia, aceita §e3 Quadros§r e — o mais importante — §epermite mutações§r.

      Ponha espécies diferentes juntas e algumas proles nascerão como espécies novas. É aqui que a
      árvore genética começa.
    tasks:
      - {"get": "Forestry:apiculture"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:frameUntreated x3", "Forestry:honeyDrop x16", "Forestry:impregnatedCasing"]}

  - id: "quadro_simples"
    title: "Quadro Não Tratado"
    type: "normal"
    deps: ["apiario"]
    desc: |
      Oito gravetos e uma linha: o §eQuadro Não Tratado§r. No Apiário, quadros §eaumentam a produção§r e
      reduzem o desgaste genético. Este dura só 80 usos — é o de iniciante.
    tasks:
      - {"get": "Forestry:frameUntreated x3"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:string x4"}

  - id: "quadro_impregnado"
    title: "Quadro Impregnado"
    type: "normal"
    deps: ["quadro_simples"]
    desc: |
      Troque os gravetos por §eVaras Impregnadas§r (Carpinteiro, óleo vegetal): o §eQuadro Impregnado§r
      dura 240 usos e protege mais os genes. É o padrão de qualquer apiário sério.
    tasks:
      - {"get": "Forestry:frameImpregnated x3"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:oakStick x8"}

  - id: "quadro_comprovado"
    title: "Quadro Comprovado"
    type: "optional"
    deps: ["quadro_impregnado"]
    desc: |
      O melhor quadro (720 usos) não tem receita: o §eApicultor§r das aldeias vende §e6 Quadros
      Comprovados por 1 esmeralda§r. As aldeias do Forestry têm casinhas de abelhas — procure uma!
      O mesmo apicultor vende zangões Monásticos e Ender.
    tasks:
      - {"get": "Forestry:frameProven"}
    rewards:
      - {"loot": "incomum"}

  - id: "localizador_habitat"
    title: "Localizador de Habitats"
    type: "optional"
    deps: ["abelhanalizador"]
    desc: |
      Bronze e redstone. Coloque uma abelha no §eLocalizador de Habitats§r: depois de um tempo ele aponta
      para o bioma mais próximo onde ela trabalha (e gira quando chega lá).
    tasks:
      - {"get": "Forestry:habitatLocator"}
    rewards:
      - {"loot": "comum"}

  - id: "bau_apiarista"
    title: "Baú do Apiarista"
    type: "optional"
    deps: ["favo_mel"]
    desc: |
      Um baú com vidro em cima e favos em volta: o §eBaú do Apiarista§r guarda só abelhas, com espaço de
      sobra. Sua coleção vai crescer rápido!
    tasks:
      - {"get": "Forestry:apicultureChest"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_apicultor"
    title: "Mochila do Apicultor"
    type: "optional"
    deps: ["bau_apiarista"]
    desc: |
      Linha, lã, gravetos e o Baú do Apiarista no centro: a §eMochila do Apicultor§r recolhe abelhas,
      favos e produtos quando você caça colmeias.
    tasks:
      - {"get": "Forestry:apiaristBag"}
    rewards:
      - {"loot": "comum"}

  - id: "analisador_bloco"
    title: "Analisador"
    type: "optional"
    deps: ["abelhanalizador", "mel_liquido"]
    desc: |
      O §eAnalisador§r (bloco) faz o trabalho do Abelhanalizador de forma automática: bronze, o
      Abelhanalizador (ou Arvoranalizador) e a Carcaça Resistente. Usa energia e §e100 mB de mel
      líquido§r por análise — perfeito para analisar pilhas de zangões por tubos.
    tasks:
      - {"get": "Forestry:core"}
    rewards:
      - {"loot": "comum"}

  - id: "velas"
    title: "Velas de Cera"
    type: "optional"
    deps: ["cera"]
    desc: |
      No Carpinteiro, cera de abelha e linha (600 mB de água) rendem §e24 Velas§r. Clique para acender;
      tinja na bancada. Iluminação charmosa para o apiário!
    tasks:
      - {"get": "Forestry:candle"}
    rewards:
      - {"loot": "comum"}

  - id: "carrinhos"
    title: "Colméias sobre Trilhos"
    type: "optional"
    icon: "Forestry:cart.beehouse:1"
    deps: ["apiario"]
    desc: |
      Uma Colméia ou um Apiário sobre um carrinho de mina = §eapiário móvel§r. Leve as abelhas até o
      bioma delas sem desmontar nada.
    tasks:
      - {"one_of": ["Forestry:cart.beehouse", "Forestry:cart.beehouse:1"]}
    rewards:
      - {"loot": "comum"}

  - id: "capsulas_cera"
    title: "Cápsulas de Cera"
    type: "optional"
    deps: ["cera"]
    desc: |
      Três ceras de abelha = §e4 Cápsulas de Cera§r: recipientes baratos (1000 mB) para mel, água e
      outros líquidos não quentes.
    tasks:
      - {"get": "Forestry:waxCapsule x4"}
    rewards:
      - {"loot": "comum"}

  - id: "primeiro_apiario"
    title: "O Primeiro Apiário"
    type: "milestone"
    icon: "Forestry:apiculture"
    deps: ["apiario", "abelhanalizador", "quadro_impregnado"]
    banner: "O Primeiro Apiário"
    subtitle: "As abelhas voltaram ao Registro"
    desc: |
      Colmeias encontradas, abelhas analisadas, mel e cera saindo da Centrífuga e um Apiário com quadros.
      Herói, a página das abelhas voltou a zumbir no Registro!

      Agora começa a parte mais viciante: §emutações§r. Junte duas abelhas de colmeias diferentes no
      Apiário e torça. A aba §eBee Breeding§r do NEI (com a árvore do §eBeeBetterAtBees§r) mostra quem
      cruza com quem.
    tasks:
      - {"get": ["Forestry:apiculture", "Forestry:beealyzer", "Forestry:frameImpregnated", "Forestry:honeyDrop x8"]}
    rewards:
      - {"xp": 8}
      - {"kit": {"name": "Kit do Apicultor Iniciante", "items": ["Forestry:frameImpregnated x6", "Forestry:honeyDrop x32", "Forestry:apiculture", "Forestry:beeswax x16", "minecraft:red_flower x8"]}}
      - {"loot": "raro"}

  - id: "info_mutacao"
    title: "Como Nascem Espécies Novas"
    type: "info"
    icon: "Forestry:beeDroneGE"
    deps: ["apiario"]
    desc: |
      §e• Mutação:§r quando uma rainha morre, cada filhote tem uma chance de virar uma espécie nova, se
      os pais (princesa × zangão) formarem um par de mutação. As chances vão de 1% a 60%.
      §e• Condições:§r algumas mutações só acontecem em certos biomas, climas, datas ou com um bloco
      específico §edebaixo§r da colmeia.
      §e• Purificar:§r o primeiro filhote mutante costuma ser §ehíbrido§r. Cruze-o de novo com zangões
      da espécie nova até os dois genes ficarem iguais. As quests deste capítulo pedem abelhas §epuras§r.
      §e• NEI:§r "Bee Breeding" (cruzamentos) e "Bee Produce" (produtos). O BeeBetterAtBees desenha a
      árvore de mutações inteira de uma espécie.
    tasks:
      - {"check": true}
    rewards:
      - {"xp": 1}

  - id: "comum"
    title: "Abelha Comum"
    type: "main"
    icon: "Forestry:beePrincessGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.speciesCommon\",UID1:\"forestry.speciesCommon\"}]}}"
    deps: ["info_mutacao"]
    desc: |
      Cruzamento: §eduas abelhas de colmeia diferentes§r (Florestal, dos Prados, Modesta, Tropical,
      Invernal, do Pantanal — e as das colmeias do MagicBees/ExtraBees) — §e15%§r.

      O "diploma de participação" do apicultor. Ela abre todas as outras linhas.

