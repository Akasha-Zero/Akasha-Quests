    desc: |
      O §bGendustry§r transforma a apicultura em indústria. Regras deste pack (config do mod):

      §e• Energia:§r as máquinas aceitam §bRF§r (e também EU do IC2 até MV). Internamente contam em MJ:
      §e10 RF = 1 MJ§r.
      §e• Vidraria Genética§r (Labware) é consumida na maioria dos processos.
      §e• Mutagênico§r vem de redstone, glowstone e urânio no Produtor de Mutagênico.
      §e• Princesas artificiais§r (saídas das máquinas) podem morrer no Mutatron (10%); as naturais não.
      §e• O Replicador§r cria abelhas a partir de um Modelo Genético, DNA e proteína.

      Os nomes do Gendustry aparecem em inglês no jogo.
