      §e• Curiosa§r — em árvores de florestas, planícies e colinas → §eMystical§r
      §e• Incomum§r — no chão de planícies, montanhas, colinas e rios → §eUnusual§r
      §e• Ressonante§r — na areia de desertos, mesas e biomas mágicos → §eSorcerous§r
      §e• Profunda§r — no subsolo de colinas/montanhas, cercada de redstone → §eAttuned§r
      §e• Infernal§r — no Nether (e raramente no subsolo de biomas mágicos quentes) → §eInfernal§r
      §e• do Esquecimento§r — no Fim, sobre pilares de obsidiana → §eOblivion§r
    tasks:
