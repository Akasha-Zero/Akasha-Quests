chapter:
  id: agricraft
  title: "AgriCraft"
  prefix: ""
  order: 615
  icon: AgriCraft:seedAnalyzer
  desc: |
    §aA Horta com Genética.§r Cultive em varas de plantio, cruze espécies, analise sementes e
    suba os atributos de crescimento, ganho e força. Dos tubérculos ao Taint Root.
    (AgriCraft 1.7.10-1.5.2)

quests:
  - id: varas_plantio
    title: "Varas de Plantio"
    type: main
    icon: AgriCraft:cropsItem
    desc: |
      Esqueça plantar direto na terra, Herói. No AgriCraft tudo nasce em §eVaras de Plantio§r
      (Crop Sticks), colocadas sobre terra arada e com água por perto.

      Faça algumas na bancada com gravetos. Clicando com uma vara numa plantação já em pé você cria um
      §ecruzamento§r — duas varas lado a lado —, base de toda a genética.
    tasks:
      - get: AgriCraft:cropsItem x16
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:carrot x16]

  - id: semente_cenoura
    title: "Semente de Cenoura"
    type: main
    deps: [varas_plantio]
    icon: AgriCraft:seedCarrot
    desc: |
      Plantar uma cenoura inteira é coisa do passado, Herói! No AgriCraft ela vira uma §esemente de cenoura§r com atributos próprios. Receita simples na bancada, com a cenoura comum.
      Plante nas varas, espere crescer e colha com o botão direito. Se tiver dúvida, o NEI (R/U) mostra a receita.
    tasks:
      - get: AgriCraft:seedCarrot
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:carrot x16]

  - id: semente_batata
    title: "Semente de Batata"
    type: main
    deps: [varas_plantio]
    icon: AgriCraft:seedPotato
    desc: |
      Mesma ideia, agora com a batata, Herói! Faça a §eSemente de Batata§r na bancada e plante nas varas.

      §aDica:§r deixe sempre uma semente para trás; colher sem repor é a forma mais rápida de perder a espécie. Confira a receita no NEI (R/U) se precisar de ajuda.
    tasks:
      - get: AgriCraft:seedPotato
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:carrot x16]

  - id: lupa
    title: "Lupa"
    deps: [varas_plantio]
    icon: AgriCraft:magnifyingGlass
    desc: |
      Quer ver o que acontece dentro de uma planta? A §eLupa§r mostra os atributos (crescimento, ganho, força) e o estágio de cada plantio sem tocar nela.

      Faça com dois gravetos, vidro e mais um graveto, Herói! Se precisar do desenho, o NEI (R/U) mostra. Uma boa fazendeira ou fazendeiro começa pela observação!
    tasks:
      - get: AgriCraft:magnifyingGlass
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:carrot x16]

  - id: rastelo
    title: "Rastelo de Mão"
    deps: [varas_plantio]
    icon: AgriCraft:handRake
    desc: |
      Ervas daninhas atrapalham o crescimento!

      O §eRastelo de Mão§r (cerca + graveto) limpa as ervas do plantio. Existe uma versão de ferro, mais durável. Confira a receita no NEI (R/U) se tiver dúvida. Faça o seu, Herói, e deixe a horta limpinha para as plantas crescerem sem atrapalho!
    tasks:
      - get: AgriCraft:handRake
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:carrot x16]

  - id: tesoura_poda
    title: "Podadeira"
    deps: [varas_plantio]
    icon: AgriCraft:clipper
    desc: |
      A §ePodadeira§r (Clipper) permite colher só o necessário sem derrubar a planta. Ferro, gravetos e uma tesoura.
      §aDica:§r essencial para manter a planta viva ao tirar a semente, Herói. Faça a sua! Se esquecer a receita, o NEI (R/U) mostra o desenho. Jardineiros cuidadosos agradecem a ferramenta!
    tasks:
      - get: AgriCraft:clipper
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:carrot x16]

  - id: espatula
    title: "Espátula de Jardinagem"
    deps: [varas_plantio]
    icon: AgriCraft:trowel
    desc: |
      Precisa mudar uma planta de lugar sem perder os atributos, Herói? A §eEspátula§r (Trowel) transplanta a planta madura com a semente para outra vara.

      É ótima para reorganizar a horta sem prejuízo. Confira a receita no NEI (R/U) e faça a sua! Confira os detalhes no NEI (R/U) se ficar na dúvida.
    tasks:
      - get: AgriCraft:trowel
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:carrot x16]

  - id: analisador
    title: "Analisador de Sementes"
    type: main
    deps: [lupa]
    icon: AgriCraft:seedAnalyzer
    desc: |
      A peça central da genética, Herói! O §eAnalisador de Sementes§r revela os atributos de uma semente nova. Sem análise você planta no escuro.
      Receita: gravetos, painel de vidro, meia-laje de pedra e madeira. Coloque a semente dentro e espere. §aDica:§r analise tudo que colher!
    tasks:
      - get: AgriCraft:seedAnalyzer
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: diario
    title: "Diário Agrícola"
    deps: [analisador]
    icon: AgriCraft:journal
    desc: |
      O §eDiário Agrícola§r (livro com varas de plantio e sementes diferentes) registra as espécies que você já analisou e as mutações possíveis.

      É meu favorito entre as ferramentas, Herói! Faça o seu e confira a receita no NEI (R/U) se precisar. Com ele, o caminho das mutações fica bem mais claro.
    tasks:
      - get: AgriCraft:journal
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: analisador_pc
    title: "Analisador Controlado por PC"
    type: optional
    deps: [analisador]
    icon: AgriCraft:peripheral
    desc: |
      Para quem usa OpenComputers, Herói: ligue o analisador a um computador e automatize a leitura. Comparador, caixa do OC e o analisador.

      Confira a receita no NEI (R/U) e os detalhes no manual do mod. Coisa de nerd, e eu adoro! Missão opcional, mas ótima para automatizar a análise das suas sementes.
    tasks:
      - get: AgriCraft:peripheral
    rewards:
      - xp: 3
      - loot: incomum

  - id: aspersor
    title: "Aspersor"
    deps: [varas_plantio]
    icon: AgriCraft:sprinkler
    desc: |
      Regar manualmente cansa, Herói! O §eAspersor§r (balde, grades e ferro) cuida da irrigação quando ligado a um tanque de água por canais.
      Para quem vai fazer horta grande, é um alívio. Faça o seu! Se tiver dúvida sobre a montagem, o NEI (R/U) e o manual do mod mostram como ligar tudo.
    tasks:
      - get: AgriCraft:sprinkler
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: almofada_agua
    title: "Tanque e Almofada de Água"
    type: optional
    deps: [aspersor]
    icon: AgriCraft:waterPad
    desc: |
      Culturas aquáticas pedem uma §eAlmofada de Água§r (Water Pad) em vez de terra. Há também o §eTanque de Água§r de madeira para o sistema de irrigação.

      Faça o que precisar, Herói. Confira as receitas no NEI (R/U). Missão opcional, mas essencial para plantas que vivem na água!
    tasks:
      - get: AgriCraft:waterPad
    rewards:
      - xp: 3
      - loot: comum

  - id: brown_mushroom_spores
    title: "Cogumelo Marrom"
    deps: [semente_batata]
    icon: AgriCraft:seedShroomBrown
    desc: |
      Cogumelos no AgriCraft viram plantio, Herói: sementes de §eesporos§r. O marrom é o primeiro!

      Cruze §ePotato Seeds§r, com o bloco §eminecraft:mycelium / minecraft:nether_wart§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Boa mutação e muita paciência, que o resultado sempre aparece quando as condições estão certas!
    tasks:
      - get: AgriCraft:seedShroomBrown
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: sugarcane_seeds
    title: "Cana-de-Açúcar"
    deps: [semente_cenoura]
    icon: AgriCraft:seedSugarcane
    desc: |
      Papel e açúcar em campo aberto! Com cenoura, areia e semente de trigo surge a §eCana-de-Açúcar§r.
      Cruze §eCarrot Seeds§r, com o bloco §eminecraft:sand / minecraft:wheat_seeds§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Mão na terra, Herói!
    tasks:
      - get: AgriCraft:seedSugarcane
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: dandelion_seeds
    title: "Dente-de-Leão"
    deps: [sugarcane_seeds]
    icon: AgriCraft:seedDandelion
    desc: |
      Flor amarela, cruzamento simples e ótima para tinturas.

      Cruze §eSugarcane Seeds§r, com o bloco §eminecraft:melon_seeds§r sob o solo. A lista exata está no NEI, aba Crop Mutation. Monte o campo de cruzamento com calma e espere as sementes crescerem. Confira o NEI se algo não sair como esperado. Bora plantar, Herói!
    tasks:
      - get: AgriCraft:seedDandelion
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: poppy_seeds
    title: "Papoula"
    deps: [sugarcane_seeds]
    icon: AgriCraft:seedPoppy
    desc: |
      Papoulas vermelhas viram semente ao cruzar a cana com abóbora.
      Cruze §eSugarcane Seeds§r, com o bloco §eminecraft:pumpkin_seeds§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Vai com calma e colha bonito, Herói! Paciência é a melhor adubadora do AgriCraft, e cada tentativa ensina algo novo.
    tasks:
      - get: AgriCraft:seedPoppy
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: cactus_seeds
    title: "Cacto"
    deps: [poppy_seeds, sugarcane_seeds]
    icon: AgriCraft:seedCactus
    desc: |
      Cacto sem sofrer no deserto! Plante e colha o verde espinhento.

      Cruze §ePoppy Seeds + Sugarcane Seeds§r, com o bloco §eminecraft:sand§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Cuidado com os espinhos, Herói, e prepare as varas com calma! Confira os detalhes no NEI (R/U) se ficar na dúvida.
    tasks:
      - get: AgriCraft:seedCactus
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: blue_orchid_seeds
    title: "Orquídea Azul"
    deps: [poppy_seeds, dandelion_seeds]
    icon: AgriCraft:seedOrchid
    desc: |
      A orquídea azul abre a porta para as flores de Botânica e afins.

      Cruze §eDandelion Seeds + Poppy Seeds§r. A lista exata está no NEI, aba §eCrop Mutation§r, onde você confere os blocos de apoio. Ela é só o começo, Herói! Boa mutação, e tenha paciência com as sementes.
    tasks:
      - get: AgriCraft:seedOrchid
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: red_mushroom_spores
    title: "Cogumelo Vermelho"
    deps: [poppy_seeds]
    icon: AgriCraft:seedShroomRed
    desc: |
      O irmão vermelho do marrom. Cuidado com o sol: cogumelos preferem sombra.

      Cruze §ePoppy Seeds§r, com o bloco §eminecraft:mycelium / minecraft:nether_wart§r sob o solo. A lista exata está no NEI, aba Crop Mutation. Monte o campo de cruzamento com calma e espere as sementes crescerem em paz. Cultive com carinho, Herói!
    tasks:
      - get: AgriCraft:seedShroomRed
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: allium_seeds
    title: "Allium"
    deps: [blue_orchid_seeds, poppy_seeds]
    icon: AgriCraft:seedAllium
    desc: |
      A bela flor roxa nasce da orquídea azul e da papoula.
      Cruze §eBlue Orchid Seeds + Poppy Seeds§r. A lista exata está no NEI, aba §eCrop Mutation§r. Que combinação linda, Herói! Plante com cuidado nas varas, deixe as mutações acontecerem e colha as sementes quando estiverem maduras.
    tasks:
      - get: AgriCraft:seedAllium
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: daisy_seeds
    title: "Margarida"
    deps: [blue_orchid_seeds, dandelion_seeds]
    icon: AgriCraft:seedDaisy
    desc: |
      A margarida branca é simples e útil para as mutações seguintes.

      Cruze §eBlue Orchid Seeds + Dandelion Seeds§r. A lista exata está no NEI, aba §eCrop Mutation§r. Plante sem medo, Herói, e guarde sementes extras, que essa flor abre caminho para vários cruzamentos! Confira os detalhes no NEI (R/U) se ficar na dúvida.
    tasks:
      - get: AgriCraft:seedDaisy
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: orange_tulip_seeds
    title: "Tulipa Laranja"
    deps: [daisy_seeds, blue_orchid_seeds]
    icon: AgriCraft:seedTulipOrange
    desc: |
      Cada tulipa tem sua cor e sua receita, e esta é laranja!

      Cruze §eBlue Orchid Seeds + Daisy Seeds§r. A lista exata está no NEI, aba §eCrop Mutation§r, onde você confere os blocos de apoio. Colecione todas, Herói! Seu jardim vai ficar cada vez mais colorido e cheio de vida.
    tasks:
      - get: AgriCraft:seedTulipOrange
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: pink_tulip_seeds
    title: "Tulipa Rosa"
    deps: [allium_seeds, dandelion_seeds]
    icon: AgriCraft:seedTulipPink
    desc: |
      Tulipa rosa: do Allium com o Dente-de-Leão.

      Cruze §eAllium Seeds + Dandelion Seeds§r. A lista exata está no NEI, aba Crop Mutation. Monte o campo de cruzamento com calma e espere as sementes crescerem. Fica um charme na horta, Herói, e as cores deixam tudo mais bonito!
    tasks:
      - get: AgriCraft:seedTulipPink
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: red_tulip_seeds
    title: "Tulipa Vermelha"
    deps: [allium_seeds, poppy_seeds]
    icon: AgriCraft:seedTulipRed
    desc: |
      Vermelha e viva: um ponto de partida para outras mutações.
      Cruze §eAllium Seeds + Poppy Seeds§r. A lista exata está no NEI, aba §eCrop Mutation§r. Guarde sementes de sobra, Herói! Plante com calma nas varas e colha com cuidado para não perder a mutação que acabou de conseguir.
    tasks:
      - get: AgriCraft:seedTulipRed
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: white_tulip_seeds
    title: "Tulipa Branca"
    deps: [daisy_seeds, dandelion_seeds]
    icon: AgriCraft:seedTulipWhite
    desc: |
      Branca como a espuma do Registro, e útil para muitas mutações.

      Cruze §eDaisy Seeds + Dandelion Seeds§r. A lista exata está no NEI, aba §eCrop Mutation§r. Garanta algumas sementes, Herói, porque vários outros cruzamentos vão pedir essa tulipa mais adiante! Confira os detalhes no NEI (R/U) se ficar na dúvida. Vá com calma e boa sorte!
    tasks:
      - get: AgriCraft:seedTulipWhite
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: cinderpearl_seeds
    title: "Cinderpearl"
    deps: [red_tulip_seeds, cactus_seeds]
    icon: AgriCraft:seedCinderpearl
    desc: |
      Primeira planta de recurso da lista: §eCinderpearl§r, uma erva de Thaumcraft que o AgriCraft faz crescer em areia.
      Cruze §eCactus Seeds + Red Tulip Seeds§r, com o bloco §eminecraft:sand§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Começou a parte boa, Herói!
    tasks:
      - get: AgriCraft:seedCinderpearl
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: lapender_seeds
    title: "Lapender"
    deps: [pink_tulip_seeds, blue_orchid_seeds]
    icon: AgriCraft:seedLapender
    desc: |
      A planta do lápis-lazúli! Precisa de um bloco de lápis sob a terra.
      Cruze §eBlue Orchid Seeds + Pink Tulip Seeds§r, com o bloco §eminecraft:lapis_ore:4§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Lazúli sem minerar, Herói!
    tasks:
      - get: AgriCraft:seedLapender
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: nitor_wart_spores
    title: "Nitor Wart"
    deps: [orange_tulip_seeds]
    icon: AgriCraft:seedNitorWart
    desc: |
      Esporos que rendem pó de glowstone, crescendo sobre soul sand. Luz de sobra!
      Cruze §eOrange Tulip Seeds§r, com o bloco §eminecraft:glowstone / minecraft:nether_wart / minecraft:soul_sand§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Fique de olho no cruzamento, Herói!
    tasks:
      - get: AgriCraft:seedNitorWart
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: redstodendron_seeds
    title: "Redstodendron"
    deps: [red_tulip_seeds, daisy_seeds]
    icon: AgriCraft:seedRedstodendron
    desc: |
      A planta de redstone! Dê um bloco de minério de redstone para o solo.
      Cruze §eDaisy Seeds + Red Tulip Seeds§r, com o bloco §eminecraft:redstone_ore§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Redstone na horta, Herói!
    tasks:
      - get: AgriCraft:seedRedstodendron
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: aurigold_seeds
    title: "Aurigold"
    deps: [redstodendron_seeds, orange_tulip_seeds]
    icon: AgriCraft:seedAurigold
    desc: |
      A planta de ouro, essencial para as mutações avançadas.

      Cruze §eOrange Tulip Seeds + Redstodendron Seeds§r, com o bloco §eminecraft:gold_ore§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Cuide bem dela, Herói, e tenha paciência com as tentativas: cada mutação bem-sucedida abre caminho para as próximas plantas da sua horta!
    tasks:
      - get: AgriCraft:seedAurigold
    rewards:
      - xp: 4
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: cuprosia_seeds
    title: "Cuprosia"
    deps: [redstodendron_seeds, red_tulip_seeds]
    icon: AgriCraft:seedCuprosia
    desc: |
      Planta de cobre, perfeita para quem quer metal sem minerar.

      Cruze §eRed Tulip Seeds + Redstodendron Seeds§r, com o bloco §eThermalFoundation:Ore§r sob o solo. A lista exata está no NEI, aba Crop Mutation. Monte o campo de cruzamento com calma e espere as sementes crescerem. Cobre brotando, Herói, que maravilha!
    tasks:
      - get: AgriCraft:seedCuprosia
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: desert_nova_seeds
    title: "Desert Nova"
    deps: [cinderpearl_seeds, red_tulip_seeds]
    icon: AgriCraft:seedDesertNova
    desc: |
      A erva do deserto de Ars Magica, que cresce em areia. É ponto de passagem para o Cerublossom.
      Cruze §eCinderpearl Seeds + Red Tulip Seeds§r, com o bloco §eminecraft:sand§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Siga o caminho, Herói!
    tasks:
      - get: AgriCraft:seedDesertNova
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:dye:15 x16]

  - id: ferranium_seeds
    title: "Ferranium"
    deps: [lapender_seeds, white_tulip_seeds]
    icon: AgriCraft:seedFerranium
    desc: |
      Ferranium: a planta do ferro. Vale a pena ter uma estufa só para ela.
      Cruze §eLapender Seeds + White Tulip Seeds§r, com o bloco §eminecraft:iron_ore§r sob o solo. A lista exata está no NEI, aba §eCrop Mutation§r. Prepare o canteiro, Herói!
    tasks:
      - get: AgriCraft:seedFerranium
    rewards:
      - xp: 4
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

