chapter:
  id: magicalcrops
  title: "Magical Crops"
  prefix: ""
  order: 620
  icon: magicalcrops:MinicioSeeds
  desc: |
    §aA Colheita Mágica.§r Plante essências, colha metais, mobs e gemas. Cinco níveis de poder:
    Minicio, Accio, Crucio, Imperio e Zivicio, cada um preparado com a essência do anterior.
    (Magical Crops 4.0.0 Beta 4b)

quests:
  - id: minicio_essence
    title: "Essência Minicio"
    type: main
    icon: magicalcrops:1MinicioEssence
    desc: |
      Toda plantação mágica começa com um pozinho verde, Herói. A §aEssência Minicio§r é a base de tudo
      no Registro: sem ela não há semente, pedra nem essência dos níveis seguintes.

      Procure o §eMinério de Minicio§r no subsolo (existem versões para o Nether e o End também) e
      minere até juntar §e8 essências§r. §aDica:§r confira no NEI como ela cai de cada minério.
    tasks:
      - get: magicalcrops:1MinicioEssence x8
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: minicio_seeds
    title: "Sementes Minicio"
    type: main
    deps: [minicio_essence]
    icon: magicalcrops:MinicioSeeds
    desc: |
      Pronto para o primeiro plantio! A §eSemente Minicio§r vai na bancada: Semente de Trigo no centro
      e §e8 Essências Minicio§r em volta.

      Plante em terra arada, com água por perto, e espere crescer. A colheita devolve essência e mais
      sementes — o ciclo se alimenta sozinho. §aDica:§r guarde sempre uma semente sobrando.
    tasks:
      - get: magicalcrops:MinicioSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: bloco_minicio
    title: "Bloco de Minicio"
    type: optional
    deps: [minicio_essence]
    icon: magicalcrops:essence_storage
    desc: |
      Guardar essência solta é receita para bagunça. O §eBloco de Essência Minicio§r compacta tudo
      (e, olha só, é ingrediente do Pulsador de Crescimento). Cada nível tem o seu bloco, na mesma
      linha de itens — veja no NEI.
    tasks:
      - get: magicalcrops:essence_storage
    rewards:
      - xp: 2
      - loot: comum

  - id: pedra_fraca
    title: "Pedra de Infusão Fraca"
    type: main
    deps: [minicio_essence]
    icon: magicalcrops:InfusionStoneWeak
    desc: |
      A chave para subir de nível: a §ePedra de Infusão Fraca§r leva §e8 Essências Minicio§r em volta
      de um material especial no centro (o NEI mostra qual aceita).

      Com ela você transforma Minicio em §6Accio§r. Cada nível seguinte pede uma pedra mais forte —
      guarde essa com carinho.
    tasks:
      - get: magicalcrops:InfusionStoneWeak
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: fertilizante_magico
    title: "Fertilizante Mágico"
    deps: [minicio_essence]
    icon: magicalcrops:MagicalFertilizer
    desc: |
      Impaciência é coisa de Herói, eu entendo! O §eFertilizante Mágico§r (farinha de osso, essência
      Minicio e um diamante) acelera o crescimento das plantas mágicas.

      Rende 4 por receita. §aDica:§r use em plantações de nível alto, onde esperar custa mais.
    tasks:
      - get: magicalcrops:MagicalFertilizer
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: pulsador
    title: "Pulsador de Crescimento"
    deps: [bloco_minicio]
    icon: magicalcrops:CropBooster
    desc: |
      O §ePulsador de Crescimento§r é um bloco que dá um empurrãozinho nas plantações ao redor.
      Receita: 4 Blocos de Essência Minicio, um diamante e pedra.

      Instale uns poucos no meio do canteiro. §aDica:§r veja no NEI o alcance antes de posicionar.
    tasks:
      - get: magicalcrops:CropBooster
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: accio_essence
    title: "Essência Accio"
    type: main
    deps: [pedra_fraca, minicio_seeds]
    icon: magicalcrops:2AccioEssence
    desc: |
      O segundo nível! Na bancada, coloque a §ePedra de Infusão Fraca§r no centro e §e4 Essências
      Minicio§r em cruz. Sai a §6Essência Accio§r.

      Ela abre sementes elementais, a Fornalha Accio e a Pedra Regular. Faça um estoque (uns 16)
      antes de seguir — os próximos níveis comem muito.
    tasks:
      - get: magicalcrops:2AccioEssence x8
    rewards:
      - xp: 4
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: bloco_accio
    title: "Bloco de Accio"
    type: optional
    deps: [accio_essence]
    icon: magicalcrops:essence_storage:1
    desc: |
      Compacte a essência Accio num bloco: organiza o baú e é material de construção mágico.
    tasks:
      - get: magicalcrops:essence_storage:1
    rewards:
      - xp: 2
      - loot: comum

  - id: pedra_regular
    title: "Pedra de Infusão Regular"
    type: main
    deps: [accio_essence]
    icon: magicalcrops:InfusionStoneRegular
    desc: |
      Evolua a pedra! A §ePedra de Infusão Regular§r usa a Fraca no centro e o material Accio ao redor
      (confira no NEI qual item vale).

      É ela que leva você à §eEssência Crucio§r. Uma pedra por nível — sem atalho.
    tasks:
      - get: magicalcrops:InfusionStoneRegular
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: fornalha_accio
    title: "Fornalha Accio"
    deps: [accio_essence]
    icon: magicalcrops:AccioFurnace
    desc: |
      Uma fornalha comum com uma pitada de magia: §e4 Essências Accio§r em volta de uma fornalha.
      Ela cozinha bem mais rápido, e cada nível de fornalha é um upgrade da anterior.

      §aDica:§r ótima para fundir os minérios que suas plantações vão render.
    tasks:
      - get: magicalcrops:AccioFurnace
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: sacola_accio
    title: "Sacola de Sementes Accio"
    deps: [accio_essence]
    icon: magicalcrops:SeedBagAccio
    desc: |
      Plantar semente por semente cansa. A §eSacola de Sementes Accio§r (couro e essência Accio)
      planta várias de uma vez só. Há uma sacola por nível, cada uma maior que a anterior.
    tasks:
      - get: magicalcrops:SeedBagAccio
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_ar
    title: "Sementes de Ar"
    deps: [accio_essence]
    icon: magicalcrops:AirSeeds
    desc: |
      Semente Minicio, uma garrafa vazia e essência Accio rendem a §eSemente de Ar§r. Colha a essência
      de ar e use-a em receitas futuras.
    tasks:
      - get: magicalcrops:AirSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_terra
    title: "Sementes de Terra"
    deps: [accio_essence]
    icon: magicalcrops:EarthSeeds
    desc: |
      Terra, semente Minicio e essência Accio fazem a §eSemente de Terra§r. Simples, firme e útil.
    tasks:
      - get: magicalcrops:EarthSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_fogo
    title: "Sementes de Fogo"
    deps: [accio_essence]
    icon: magicalcrops:FireSeeds
    desc: |
      Um balde de lava no meio da receita e cuidado com os dedos! A §eSemente de Fogo§r rende essência
      de fogo — combustível mágico.
    tasks:
      - get: magicalcrops:FireSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_agua
    title: "Sementes de Água"
    deps: [accio_essence]
    icon: magicalcrops:WaterSeeds
    desc: |
      Balde d'água, semente Minicio e essência Accio. Tem que ser plantada onde a umidade chega!
    tasks:
      - get: magicalcrops:WaterSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_natureza
    title: "Sementes de Natureza"
    deps: [accio_essence]
    icon: magicalcrops:NatureSeeds
    desc: |
      A §eSemente de Natureza§r nasce só de Minicio e Accio. Verdinha, rápida e generosa.
    tasks:
      - get: magicalcrops:NatureSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_carvao
    title: "Sementes de Carvão"
    deps: [accio_essence]
    icon: magicalcrops:CoalSeeds
    desc: |
      Carvão que cresce! Misture carvão com a semente Minicio e essência Accio. Combustível infinito
      para as suas fornalhas mágicas.
    tasks:
      - get: magicalcrops:CoalSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: sementes_tintura
    title: "Sementes de Tintura"
    deps: [accio_essence]
    icon: magicalcrops:DyeSeeds
    desc: |
      A §eSemente de Tintura§r rende essência de tintura, que vira corante em vários tons. Boa para quem curte decorar com cor.
    tasks:
      - get: magicalcrops:DyeSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_borracha
    title: "Sementes de Borracha"
    type: optional
    deps: [accio_essence]
    icon: magicalcrops:RubberSeeds
    desc: |
      Quer borracha sem derrubar seringueira? Planta e colhe! Confira no NEI o que a essência de
      borracha vira.
    tasks:
      - get: magicalcrops:RubberSeeds
    rewards:
      - xp: 2
      - loot: comum

  - id: essencias_elementais
    title: "Essências Elementais"
    deps: [sementes_ar, sementes_terra, sementes_fogo, sementes_agua]
    icon: magicalcrops:AirEssence
    desc: |
      Plantou? Agora colha! Junte a essência de §eAr, Terra, Fogo e Água§r — cada crop dá a sua
      essência depois de crescer.

      §aDica:§r nove sementes na bancada viram uma essência; confira no NEI se a colheita já traz.
    tasks:
      - get: magicalcrops:AirEssence
      - get: magicalcrops:EarthEssence
      - get: magicalcrops:FireEssence
      - get: magicalcrops:WaterEssence
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: crucio_essence
    title: "Essência Crucio"
    type: main
    deps: [pedra_regular]
    icon: magicalcrops:3CrucioEssence
    desc: |
      Terceiro nível, Herói: §eEssência Crucio§r! Pedra Regular no centro e §e4 Essências Accio§r em cruz.

      Com ela nascem as sementes de metal, de mobs e de redstone. Estoque: pelo menos §e16§r.
    tasks:
      - get: magicalcrops:3CrucioEssence x8
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: bloco_crucio
    title: "Bloco de Crucio"
    type: optional
    deps: [crucio_essence]
    icon: magicalcrops:essence_storage:2
    desc: |
      Mais um bloco de essência para guardar e exibir. Compacto, bonito e prático.
    tasks:
      - get: magicalcrops:essence_storage:2
    rewards:
      - xp: 2
      - loot: comum

  - id: pedra_forte
    title: "Pedra de Infusão Forte"
    type: main
    deps: [crucio_essence]
    icon: magicalcrops:InfusionStoneStrong
    desc: |
      A §ePedra de Infusão Forte§r evolui a Regular com material Crucio. É o passo antes da
      §bEssência Imperio§r. Cada etapa fica mais cara — mantenha a produção de essência girando.
    tasks:
      - get: magicalcrops:InfusionStoneStrong
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: fornalha_crucio
    title: "Fornalha Crucio"
    deps: [crucio_essence, fornalha_accio]
    icon: magicalcrops:CrucioFurnace
    desc: |
      Evolua a fornalha: Fornalha Accio no centro e §e4 Essências Crucio§r em volta. Mais velocidade
      para os lingotes que vêm por aí.
    tasks:
      - get: magicalcrops:CrucioFurnace
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: sacola_crucio
    title: "Sacola de Sementes Crucio"
    deps: [crucio_essence, sacola_accio]
    icon: magicalcrops:SeedBagCrucio
    desc: |
      A Sacola Accio mais essência Crucio vira a §eSacola Crucio§r. Plante mais sementes por clique.
    tasks:
      - get: magicalcrops:SeedBagCrucio
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_redstone
    title: "Sementes de Redstone"
    deps: [crucio_essence]
    icon: magicalcrops:RedstoneSeeds
    desc: |
      Redstone no centro e a essência Crucio: temos uma plantação de redstone! Perfeito para
      máquinas e circuitos.
    tasks:
      - get: magicalcrops:RedstoneSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: sementes_glowstone
    title: "Sementes de Glowstone"
    deps: [crucio_essence]
    icon: magicalcrops:GlowstoneSeeds
    desc: |
      Pó de glowstone com Crucio e Minicio: a luz cresce em canteiro.
    tasks:
      - get: magicalcrops:GlowstoneSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: sementes_obsidiana
    title: "Sementes de Obsidiana"
    deps: [crucio_essence]
    icon: magicalcrops:ObsidianSeeds
    desc: |
      Obsidiana sem balde de água nem picareta de diamante: a §eSemente de Obsidiana§r resolve.
    tasks:
      - get: magicalcrops:ObsidianSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: sementes_nether
    title: "Sementes do Nether"
    deps: [crucio_essence]
    icon: magicalcrops:NetherSeeds
    desc: |
      Material do Nether (netherrack, quartzo...) na receita rende a §eSemente do Nether§r. Confira no
      NEI os itens aceitos.
    tasks:
      - get: magicalcrops:NetherSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: fazenda_mobs
    title: "Fazenda de Mobs"
    deps: [crucio_essence]
    icon: magicalcrops:CowSeeds
    desc: |
      Galinha, vaca, porco e ovelha — tudo em canteiro! Cada semente usa o drop do bicho (ovo, couro,
      carne de porco, lã) com essência Crucio.

      Assim você tem comida e lã sem pastor. Veja o NEI para as receitas exatas.
    tasks:
      - get: magicalcrops:ChickenSeeds
      - get: magicalcrops:CowSeeds
      - get: magicalcrops:PigSeeds
      - get: magicalcrops:SheepSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: metais_basicos
    title: "Cobre, Estanho e Chumbo"
    deps: [crucio_essence]
    icon: magicalcrops:CopperSeeds
    desc: |
      Metais crescendo da terra, Herói! Semente Minicio + essência Crucio, e o lingote do metal
      desejado, rendem as sementes de §eCobre, Estanho e Chumbo§r.

      A colheita é essência de metal; o NEI mostra como virar lingote.
    tasks:
      - get: magicalcrops:CopperSeeds
      - get: magicalcrops:TinSeeds
      - get: magicalcrops:LeadSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: aluminio_bronze
    title: "Alumínio e Bronze"
    deps: [metais_basicos]
    icon: magicalcrops:BronzeSeeds
    desc: |
      Mais dois metais úteis: §eAlumínio§r e §eBronze§r. A semente de bronze pode precisar do
      lingote de bronze — confira no NEI.
    tasks:
      - get: magicalcrops:AluminiumSeeds
      - get: magicalcrops:BronzeSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: enxofre_salitre
    title: "Enxofre e Salitre"
    type: optional
    deps: [crucio_essence]
    icon: magicalcrops:SulfurSeeds
    desc: |
      Ingredientes de pólvora e explosivos, direto do campo: §eSemente de Enxofre§r e §eSalitre§r.
    tasks:
      - get: magicalcrops:SulfurSeeds
      - get: magicalcrops:SaltpeterSeeds
    rewards:
      - xp: 2
      - loot: comum

  - id: cristais_crucio
    title: "Certus, Âmbar e Mercúrio"
    type: optional
    deps: [crucio_essence]
    icon: magicalcrops:CertusQuartzSeeds
    desc: |
      Para quem tem AE2, Forestry ou Thaumcraft: sementes de §eQuartzo Certus§r, §eÂmbar§r e
      §eMercúrio§r. Plante só o que o seu pacote usa!
    tasks:
      - get: magicalcrops:CertusQuartzSeeds
      - get: magicalcrops:AmberSeeds
      - get: magicalcrops:QuicksilverSeeds
    rewards:
      - xp: 2
      - loot: comum

  - id: sementes_manasteel
    title: "Sementes de Manasteel"
    type: optional
    deps: [crucio_essence]
    icon: magicalcrops:ManasteelSeeds
    desc: |
      Para quem joga Botania: Manasteel que brota. Confira se vale o esforço no seu progresso.
    tasks:
      - get: magicalcrops:ManasteelSeeds
    rewards:
      - xp: 2
      - loot: comum

  - id: imperio_essence
    title: "Essência Imperio"
    type: main
    deps: [pedra_forte, fazenda_mobs]
    icon: magicalcrops:4ImperioEssence
    desc: |
      O quarto nível, Herói! §bEssência Imperio§r: Pedra Forte no centro e §e4 Essências Crucio§r em cruz.

      Daqui saem ferro, ouro, lápis, quartzo, mobs de verdade e metais de mods. Prepare estoque
      grande: uma só receita consome muita essência!
    tasks:
      - get: magicalcrops:4ImperioEssence x8
    rewards:
      - xp: 5
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: bloco_imperio
    title: "Bloco de Imperio"
    type: optional
    deps: [imperio_essence]
    icon: magicalcrops:essence_storage:3
    desc: |
      Bloco de essência Imperio — repare como o brilho muda a cada nível.
    tasks:
      - get: magicalcrops:essence_storage:3
    rewards:
      - xp: 2
      - loot: incomum

  - id: pedra_extrema
    title: "Pedra de Infusão Extrema"
    type: main
    deps: [imperio_essence]
    icon: magicalcrops:InfusionStoneExtreme
    desc: |
      A §ePedra de Infusão Extrema§r usa a Forte no centro e o material Imperio ao redor. É o passo
      final antes da §dEssência Zivicio§r.
    tasks:
      - get: magicalcrops:InfusionStoneExtreme
    rewards:
      - xp: 5
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: fornalha_imperio
    title: "Fornalha Imperio"
    deps: [imperio_essence, fornalha_crucio]
    icon: magicalcrops:ImperioFurnace
    desc: |
      Fornalha Crucio no centro e §e4 Essências Imperio§r em volta. Cozinha à velocidade da luz.
    tasks:
      - get: magicalcrops:ImperioFurnace
    rewards:
      - xp: 4
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: sacola_imperio
    title: "Sacola de Sementes Imperio"
    deps: [imperio_essence, sacola_crucio]
    icon: magicalcrops:SeedBagImperio
    desc: |
      A Sacola Crucio melhorada com essência Imperio. A fazenda fica bem mais prática.
    tasks:
      - get: magicalcrops:SeedBagImperio
    rewards:
      - xp: 4
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: sementes_ferro
    title: "Sementes de Ferro"
    type: main
    deps: [imperio_essence]
    icon: magicalcrops:IronSeeds
    desc: |
      Ferro em canteiro! Quatro lingotes de ferro, quatro essências Imperio e uma semente Minicio
      fazem a §eSemente de Ferro§r. Ferro infinito, Herói.
    tasks:
      - get: magicalcrops:IronSeeds
    rewards:
      - xp: 5
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: sementes_ouro
    title: "Sementes de Ouro"
    type: main
    deps: [imperio_essence]
    icon: magicalcrops:GoldSeeds
    desc: |
      A mesma ideia com lingotes de ouro. §eSemente de Ouro§r: riqueza que brota do chão.
    tasks:
      - get: magicalcrops:GoldSeeds
    rewards:
      - xp: 5
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: lapis_quartzo
    title: "Lápis e Quartzo"
    deps: [imperio_essence]
