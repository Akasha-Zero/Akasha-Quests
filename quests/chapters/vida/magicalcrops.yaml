chapter:
  id: magicalcrops
  title: "Magical Crops"
  prefix: ""
  order: 620
  icon: magicalcrops:MinicioSeeds
  desc: |
    §aA Colheita Mágica.§r Plante essências, colha metais, mobs e gemas. Cinco níveis de poder:
    Minicio, Accio, Crucio, Imperio e Zivicio, cada um preparado com a essência do anterior.
    (Magical Crops 4.0.0 Beta 4b)

quests:
  - id: minicio_essence
    title: "Essência Minicio"
    type: main
    icon: magicalcrops:1MinicioEssence
    desc: |
      Toda plantação mágica começa com um pozinho verde, Herói. A §aEssência Minicio§r é a base de tudo
      no Registro: sem ela não há semente, pedra nem essência dos níveis seguintes.

      Procure o §eMinério de Minicio§r no subsolo (existem versões para o Nether e o End também) e
      minere até juntar §e8 essências§r. §aDica:§r confira no NEI como ela cai de cada minério.
    tasks:
      - get: magicalcrops:1MinicioEssence x8
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: minicio_seeds
    title: "Sementes Minicio"
    type: main
    deps: [minicio_essence]
    icon: magicalcrops:MinicioSeeds
    desc: |
      Pronto para o primeiro plantio! A §eSemente Minicio§r vai na bancada: Semente de Trigo no centro
      e §e8 Essências Minicio§r em volta.

      Plante em terra arada, com água por perto, e espere crescer. A colheita devolve essência e mais
      sementes — o ciclo se alimenta sozinho. §aDica:§r guarde sempre uma semente sobrando.
    tasks:
      - get: magicalcrops:MinicioSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: bloco_minicio
    title: "Bloco de Minicio"
    type: optional
    deps: [minicio_essence]
    icon: magicalcrops:essence_storage
    desc: |
      Guardar essência solta é receita para bagunça. O §eBloco de Essência Minicio§r compacta tudo (e, olha só, é ingrediente do Pulsador de Crescimento).
      Cada nível tem o seu bloco, na mesma linha de itens; veja no NEI. Missão opcional, Herói, mas deixa o baú bem organizado.
    tasks:
      - get: magicalcrops:essence_storage
    rewards:
      - xp: 2
      - loot: comum

  - id: pedra_fraca
    title: "Pedra de Infusão Fraca"
    type: main
    deps: [minicio_essence]
    icon: magicalcrops:InfusionStoneWeak
    desc: |
      A chave para subir de nível: a §ePedra de Infusão Fraca§r leva §e8 Essências Minicio§r em volta
      de um material especial no centro (o NEI mostra qual aceita).

      Com ela você transforma Minicio em §6Accio§r. Cada nível seguinte pede uma pedra mais forte —
      guarde essa com carinho.
    tasks:
      - get: magicalcrops:InfusionStoneWeak
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: fertilizante_magico
    title: "Fertilizante Mágico"
    deps: [minicio_essence]
    icon: magicalcrops:MagicalFertilizer
    desc: |
      Impaciência é coisa de Herói, eu entendo! O §eFertilizante Mágico§r (farinha de osso, essência Minicio e um diamante) acelera o crescimento das plantas mágicas.
      Rende 4 por receita. §aDica:§r use em plantações de nível alto, onde esperar custa mais. Receita no NEI (R/U). Fique de olho no estoque de farinha de osso, Herói.
    tasks:
      - get: magicalcrops:MagicalFertilizer
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: pulsador
    title: "Pulsador de Crescimento"
    deps: [bloco_minicio]
    icon: magicalcrops:CropBooster
    desc: |
      O §ePulsador de Crescimento§r é um bloco que dá um empurrãozinho nas plantações ao redor. Receita: 4 Blocos de Essência Minicio, um diamante e pedra.
      Instale uns poucos no meio do canteiro. §aDica:§r veja no NEI o alcance antes de posicionar, Herói! Não exagere na quantidade para não gastar diamantes à toa.
    tasks:
      - get: magicalcrops:CropBooster
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: accio_essence
    title: "Essência Accio"
    type: main
    deps: [pedra_fraca, minicio_seeds]
    icon: magicalcrops:2AccioEssence
    desc: |
      O segundo nível! Na bancada, coloque a §ePedra de Infusão Fraca§r no centro e §e4 Essências
      Minicio§r em cruz. Sai a §6Essência Accio§r.

      Ela abre sementes elementais, a Fornalha Accio e a Pedra Regular. Faça um estoque (uns 16)
      antes de seguir — os próximos níveis comem muito.
    tasks:
      - get: magicalcrops:2AccioEssence x8
    rewards:
      - xp: 4
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: bloco_accio
    title: "Bloco de Accio"
    type: optional
    deps: [accio_essence]
    icon: magicalcrops:essence_storage:1
    desc: |
      Compacte a essência Accio num bloco: organiza o baú e é material de construção mágico.
      Missão opcional, Herói, mas fica linda na decoração. Basta combinar as essências na bancada; se esquecer o formato, aperte R sobre o item no NEI e veja a receita. Aperte R no NEI para ver o formato exato.
    tasks:
      - get: magicalcrops:essence_storage:1
    rewards:
      - xp: 2
      - loot: comum

  - id: pedra_regular
    title: "Pedra de Infusão Regular"
    type: main
    deps: [accio_essence]
    icon: magicalcrops:InfusionStoneRegular
    desc: |
      Evolua a pedra! A §ePedra de Infusão Regular§r usa a Fraca no centro e o material Accio ao redor (confira no NEI qual item vale).
      É ela que leva você à §eEssência Crucio§r. Uma pedra por nível, sem atalho, Herói! Junte os materiais com calma e confira a receita no NEI (R/U). Você está indo muito bem.
    tasks:
      - get: magicalcrops:InfusionStoneRegular
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: fornalha_accio
    title: "Fornalha Accio"
    deps: [accio_essence]
    icon: magicalcrops:AccioFurnace
    desc: |
      Uma fornalha comum com uma pitada de magia: §e4 Essências Accio§r em volta de uma fornalha. Ela cozinha bem mais rápido, e cada nível de fornalha é um upgrade da anterior.
      §aDica:§r ótima para fundir os minérios que suas plantações vão render, Herói. Receita no NEI (R).
    tasks:
      - get: magicalcrops:AccioFurnace
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: sacola_accio
    title: "Sacola de Sementes Accio"
    deps: [accio_essence]
    icon: magicalcrops:SeedBagAccio
    desc: |
      Plantar semente por semente cansa, Herói. A §eSacola de Sementes Accio§r (couro e essência Accio) planta várias de uma vez só.
      Há uma sacola por nível, cada uma maior que a anterior. Confira a receita no NEI (R/U) e deixe a plantação mais fácil. Planeje a produção de couro e essência com antecedência.
    tasks:
      - get: magicalcrops:SeedBagAccio
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_ar
    title: "Sementes de Ar"
    deps: [accio_essence]
    icon: magicalcrops:AirSeeds
    desc: |
      Semente Minicio, uma garrafa vazia e essência Accio rendem a §eSemente de Ar§r. Colha a essência de ar e use-a em receitas futuras.
      Planta e colheita seguem o mesmo ritmo das outras sementes mágicas, Herói. Dúvida na receita? Aperte R sobre o item no NEI.
    tasks:
      - get: magicalcrops:AirSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_terra
    title: "Sementes de Terra"
    deps: [accio_essence]
    icon: magicalcrops:EarthSeeds
    desc: |
      Terra, semente Minicio e essência Accio fazem a §eSemente de Terra§r. Simples, firme e útil.
      Plante em um canteiro bem cuidado, Herói, e colha a essência de terra quando crescer. Ela vai servir em receitas futuras, então guarde. Confira a receita no NEI com R, e continue plantando!
    tasks:
      - get: magicalcrops:EarthSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_fogo
    title: "Sementes de Fogo"
    deps: [accio_essence]
    icon: magicalcrops:FireSeeds
    desc: |
      Um balde de lava no meio da receita e cuidado com os dedos! A §eSemente de Fogo§r rende essência de fogo, combustível mágico.
      §cCuidado com a lava§r durante a montagem, Herói. Planta e colheita seguem como as outras sementes mágicas. Receita no NEI (R/U), caso precise rever.
    tasks:
      - get: magicalcrops:FireSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_agua
    title: "Sementes de Água"
    deps: [accio_essence]
    icon: magicalcrops:WaterSeeds
    desc: |
      Balde d'água, semente Minicio e essência Accio formam a §eSemente de Água§r. Tem que ser plantada onde a umidade chega!
      Procure um lugar próximo da água, Herói, e deixe a plantação crescer. A essência de água vai servir mais adiante. Se esquecer a receita, aperte R no NEI.
    tasks:
      - get: magicalcrops:WaterSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_natureza
    title: "Sementes de Natureza"
    deps: [accio_essence]
    icon: magicalcrops:NatureSeeds
    desc: |
      A §eSemente de Natureza§r nasce só de Minicio e Accio. Verdinha, rápida e generosa.
      É uma das receitas mais simples da série, Herói, então aproveite para plantar sem medo. Colha a essência quando crescer e guarde para as próximas etapas. A receita está no NEI (R).
    tasks:
      - get: magicalcrops:NatureSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_carvao
    title: "Sementes de Carvão"
    deps: [accio_essence]
    icon: magicalcrops:CoalSeeds
    desc: |
      Carvão que cresce! Misture carvão com a semente Minicio e essência Accio para fazer a §eSemente de Carvão§r. Combustível infinito para as suas fornalhas mágicas.
      Plante, espere e colha, Herói. Boa para quem está cansado de minerar carvão. Se tiver dúvida, o NEI (R) mostra a receita.
    tasks:
      - get: magicalcrops:CoalSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: sementes_tintura
    title: "Sementes de Tintura"
    deps: [accio_essence]
    icon: magicalcrops:DyeSeeds
    desc: |
      A §eSemente de Tintura§r rende essência de tintura, que vira corante em vários tons. Boa para quem curte decorar com cor.
      Plante em um canteiro tranquilo, Herói, e colha quando crescer. Depois, confira no NEI (R/U) como a essência vira corantes. Divirta-se pintando o mundo!
    tasks:
      - get: magicalcrops:DyeSeeds
    rewards:
      - xp: 2
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_borracha
    title: "Sementes de Borracha"
    type: optional
    deps: [accio_essence]
    icon: magicalcrops:RubberSeeds
    desc: |
      Quer borracha sem derrubar seringueira? Plante e colha, Herói! A §eSemente de Borracha§r produz essência de borracha.
      Confira no NEI (R/U) o que a essência de borracha vira. Missão opcional, mas prática para quem usa mods tecnológicos e não quer sair procurando seringueiras pelo mundo.
    tasks:
      - get: magicalcrops:RubberSeeds
    rewards:
      - xp: 2
      - loot: comum

  - id: essencias_elementais
    title: "Essências Elementais"
    deps: [sementes_ar, sementes_terra, sementes_fogo, sementes_agua]
    icon: magicalcrops:AirEssence
    desc: |
      Plantou? Agora colha, Herói! Junte a essência de §eAr, Terra, Fogo e Água§r. Cada crop dá a sua essência depois de crescer.
      §aDica:§r nove sementes na bancada viram uma essência; confira no NEI se a colheita já traz. Não esqueça de replantar para manter a produção. Receitas no NEI (R/U).
    tasks:
      - get: magicalcrops:AirEssence
      - get: magicalcrops:EarthEssence
      - get: magicalcrops:FireEssence
      - get: magicalcrops:WaterEssence
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: crucio_essence
    title: "Essência Crucio"
    type: main
    deps: [pedra_regular]
    icon: magicalcrops:3CrucioEssence
    desc: |
      Terceiro nível, Herói: §eEssência Crucio§r! Pedra Regular no centro e §e4 Essências Accio§r em cruz.
      Com ela nascem as sementes de metal, de mobs e de redstone. Estoque: pelo menos §e16§r. Junte com calma e confira a receita no NEI (R/U) se precisar. Você está avançando muito bem!
    tasks:
      - get: magicalcrops:3CrucioEssence x8
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: bloco_crucio
    title: "Bloco de Crucio"
    type: optional
    deps: [crucio_essence]
    icon: magicalcrops:essence_storage:2
    desc: |
      Mais um bloco de essência para guardar e exibir, desta vez de Crucio. Compacto, bonito e prático.
      Missão opcional, Herói, mas deixa o baú organizado e a base com cara de laboratório mágico. A receita é de compactação simples; se tiver dúvida, aperte R sobre o item no NEI.
    tasks:
      - get: magicalcrops:essence_storage:2
    rewards:
      - xp: 2
      - loot: comum

  - id: pedra_forte
    title: "Pedra de Infusão Forte"
    type: main
    deps: [crucio_essence]
    icon: magicalcrops:InfusionStoneStrong
    desc: |
      A §ePedra de Infusão Forte§r evolui a Regular com material Crucio. É o passo antes da §bEssência Imperio§r.
      Cada etapa fica mais cara, Herói, então mantenha a produção de essência girando. Confira no NEI (R/U) qual material vale e prepare tudo antes de começar. Boa sorte, Herói, você está quase lá!
    tasks:
      - get: magicalcrops:InfusionStoneStrong
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: fornalha_crucio
    title: "Fornalha Crucio"
    deps: [crucio_essence, fornalha_accio]
    icon: magicalcrops:CrucioFurnace
    desc: |
      Evolua a fornalha, Herói: Fornalha Accio no centro e §e4 Essências Crucio§r em volta. Mais velocidade para os lingotes que vêm por aí.
      Cada nível de fornalha melhora o anterior, então não jogue fora a Accio antes de fazer o upgrade! Receita no NEI (R/U).
    tasks:
      - get: magicalcrops:CrucioFurnace
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: sacola_crucio
    title: "Sacola de Sementes Crucio"
    deps: [crucio_essence, sacola_accio]
    icon: magicalcrops:SeedBagCrucio
    desc: |
      A Sacola Accio mais essência Crucio vira a §eSacola Crucio§r. Plante mais sementes por clique, Herói!
      Cada nível de sacola é maior que o anterior, o que economiza muito tempo nas plantações grandes. Confira a receita no NEI (R/U) e aproveite para organizar seu canteiro.
    tasks:
      - get: magicalcrops:SeedBagCrucio
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: sementes_redstone
    title: "Sementes de Redstone"
    deps: [crucio_essence]
    icon: magicalcrops:RedstoneSeeds
    desc: |
      Redstone no centro e a essência Crucio: temos uma plantação de redstone! Perfeito para máquinas e circuitos.
      Plante com carinho, Herói, e colha quando crescer. Nunca mais vai faltar redstone nas suas máquinas. Dúvida? A receita está no NEI (R/U). Aperte R sobre o item no NEI se precisar rever a receita.
    tasks:
      - get: magicalcrops:RedstoneSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: sementes_glowstone
    title: "Sementes de Glowstone"
    deps: [crucio_essence]
    icon: magicalcrops:GlowstoneSeeds
    desc: |
      Luz que cresce em canteiro! A §eSemente de Glowstone§r usa pó de glowstone com essência Crucio e semente Minicio.
      Plante num canteiro bem cuidado, Herói, e colha a essência quando amadurecer. Se esquecer a receita exata, aperte R sobre a semente no NEI. Boa colheita iluminada!
    tasks:
      - get: magicalcrops:GlowstoneSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: sementes_obsidiana
    title: "Sementes de Obsidiana"
    deps: [crucio_essence]
    icon: magicalcrops:ObsidianSeeds
    desc: |
      Obsidiana sem balde de água nem picareta de diamante: a §eSemente de Obsidiana§r resolve, Herói!
      Plante, espere crescer e colha a essência. É uma forma bem confortável de ter obsidiana sempre à mão para portais e construções. Confira a receita no NEI (R/U) antes de montar e junte os materiais.
    tasks:
      - get: magicalcrops:ObsidianSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: sementes_nether
    title: "Sementes do Nether"
    deps: [crucio_essence]
    icon: magicalcrops:NetherSeeds
    desc: |
      Material do Nether (netherrack, quartzo...) na receita rende a §eSemente do Nether§r. Confira no NEI os itens aceitos.
      Plante num canteiro tranquilo, Herói, e colha a essência quando crescer. Dá para ter recursos do Nether sem arriscar a vida lá embaixo. Aperte R ou U sobre a semente no NEI para ver tudo.
    tasks:
      - get: magicalcrops:NetherSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:gold_ingot x6, minecraft:lapis_block x2, minecraft:glowstone x16]

  - id: fazenda_mobs
    title: "Fazenda de Mobs"
    deps: [crucio_essence]
    icon: magicalcrops:CowSeeds
    desc: |
      Galinha, vaca, porco e ovelha, tudo em canteiro! Cada semente usa o drop do bicho (ovo, couro, carne de porco, lã) com essência Crucio.
      Assim você tem comida e lã sem pastor, Herói. Veja o NEI para as receitas exatas e plante uma de cada. É uma fazenda sem esterco!
    tasks:
      - get: magicalcrops:ChickenSeeds
      - get: magicalcrops:CowSeeds
      - get: magicalcrops:PigSeeds
      - get: magicalcrops:SheepSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:bread x8, minecraft:cooked_beef x6, minecraft:torch x16]

  - id: metais_basicos
    title: "Cobre, Estanho e Chumbo"
    deps: [crucio_essence]
    icon: magicalcrops:CopperSeeds
    desc: |
      Metais crescendo da terra, Herói! Semente Minicio + essência Crucio, e o lingote do metal desejado, rendem as sementes de §eCobre, Estanho e Chumbo§r.
      A colheita é essência de metal; o NEI mostra como virar lingote. Prepare as três sementes e comece a plantar. Aperte R sobre cada uma no NEI para conferir a receita.
    tasks:
      - get: magicalcrops:CopperSeeds
      - get: magicalcrops:TinSeeds
      - get: magicalcrops:LeadSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: aluminio_bronze
    title: "Alumínio e Bronze"
    deps: [metais_basicos]
    icon: magicalcrops:BronzeSeeds
    desc: |
      Mais dois metais úteis: §eAlumínio§r e §eBronze§r. A semente de bronze pode precisar do lingote de bronze, então confira no NEI.
      Plante as duas, Herói, e colha a essência quando crescerem. Depois, veja como transformar tudo em lingote. Aperte R ou U sobre cada semente no NEI se tiver dúvida.
    tasks:
      - get: magicalcrops:AluminiumSeeds
      - get: magicalcrops:BronzeSeeds
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, minecraft:coal x16]

  - id: enxofre_salitre
    title: "Enxofre e Salitre"
    type: optional
    deps: [crucio_essence]
    icon: magicalcrops:SulfurSeeds
    desc: |
      Ingredientes de pólvora e explosivos, direto do campo: §eSemente de Enxofre§r e §eSalitre§r.
      Missão opcional, Herói, mas excelente para quem usa muita pólvora. Plante, espere e colha a essência. A receita completa de cada semente aparece no NEI (R/U), então confira antes de juntar os materiais.
    tasks:
      - get: magicalcrops:SulfurSeeds
      - get: magicalcrops:SaltpeterSeeds
    rewards:
      - xp: 2
      - loot: comum

  - id: cristais_crucio
    title: "Certus, Âmbar e Mercúrio"
    type: optional
    deps: [crucio_essence]
    icon: magicalcrops:CertusQuartzSeeds
    desc: |
      Para quem tem AE2, Forestry ou Thaumcraft: sementes de §eQuartzo Certus§r, §eÂmbar§r e §eMercúrio§r. Plante só o que o seu pacote usa!
      Missão opcional, Herói, então só faça se for necessário para a sua jornada. Confira as receitas no NEI (R/U) e planeje o espaço do canteiro com calma.
    tasks:
      - get: magicalcrops:CertusQuartzSeeds
