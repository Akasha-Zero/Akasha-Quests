      Mostre uma §emuda pura§r da espécie, com os dois genes de espécie iguais no Arvoranalizador. A chance é baixinha, então tenha paciência. É uma missão opcional. A aba Tree Breeding do NEI confirma os pais. Bons cruzamentos!
    tasks:
      - {"get": "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treePoplar\",UID1:\"forestry.treePoplar\"}]}}", "nbt": true}
    rewards:
      - {"loot": "comum"}

  - id: "zebrano"
    title: "Zebrano"
    type: "optional"
    icon: "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeZebrawood\",UID1:\"forestry.treeZebrawood\"}]}}"
    deps: ["ebano", "alamo"]
    desc: |
      Listras de zebra na madeira! Cruze §eÉbano × Álamo§r, com §e5%§r de chance.

      Mostre uma §emuda pura§r da espécie, com os dois genes de espécie iguais no Arvoranalizador. É uma missão opcional, mas uma das madeiras mais exóticas do Forestry. A chance é baixa, então cruze bastante. A aba Tree Breeding do NEI confirma os pais. Boa sorte, Herói!
    tasks:
      - {"get": "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeZebrawood\",UID1:\"forestry.treeZebrawood\"}]}}", "nbt": true}
    rewards:
      - {"loot": "comum"}

  - id: "mamoeiro"
    title: "Mamoeiro"
    type: "normal"
    icon: "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treePapaya\",UID1:\"forestry.treePapaya\"}]}}"
    deps: ["cereja"]
    desc: |
      Frutas tropicais! Cruze §eSelva × Cereja§r, com §e5%§r de chance. Os mamões rendem muito suco no Hidratador.

      Mostre uma §emuda pura§r da espécie, com os dois genes de espécie iguais no Arvoranalizador. A chance é baixa, então tenha paciência com os cruzamentos. A aba Tree Breeding do NEI confirma os pais. Boa sorte, Herói!
    tasks:
      - {"get": "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treePapaya\",UID1:\"forestry.treePapaya\"}]}}", "nbt": true}
    rewards:
      - {"xp": 3}
      - {"choice": ["Forestry:fertilizerCompound x16", "Forestry:grafter", "Forestry:soil x16"]}

  - id: "tamareira"
    title: "Tamareira"
    type: "optional"
    icon: "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeDate\",UID1:\"forestry.treeDate\"}]}}"
    deps: ["mamoeiro"]
    desc: |
      Uma palmeira de tâmaras! Cruze §eSelva × Mamoeiro§r, com §e5%§r de chance.

      Mostre uma §emuda pura§r da espécie, com os dois genes de espécie iguais no Arvoranalizador. É uma missão opcional, perfeita para completar sua coleção de frutíferas. A chance é baixa, então cruze bastante. A aba Tree Breeding do NEI confirma os pais. Boa sorte, Herói!
    tasks:
      - {"get": "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeDate\",UID1:\"forestry.treeDate\"}]}}", "nbt": true}
    rewards:
      - {"loot": "comum"}

  - id: "frutas"
    title: "A Cesta de Frutas"
    type: "normal"
    icon: "Forestry:fruits"
    deps: ["cereja"]
    desc: |
      As árvores frutíferas do Forestry soltam frutas maduras das folhas: §eCereja, Noz, Castanha, Limão, Ameixa, Tâmara e Mamão§r. Nozes e castanhas viram óleo; limão e mamão viram suco.

      Mostre §e8 de qualquer fruta§r, Herói. É só esperar a colheita e juntar do chão. Se esquecer o que cada fruta rende, aperte U no NEI. Que cesta cheia!
    tasks:
      - {"one_of": ["Forestry:fruits x8", "Forestry:fruits:1 x8", "Forestry:fruits:2 x8", "Forestry:fruits:3 x8", "Forestry:fruits:4 x8", "Forestry:fruits:5 x8", "Forestry:fruits:6 x8"]}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:sugar x8"}

  - id: "madeiras_forestry"
    title: "Madeiras do Mundo Inteiro"
    type: "optional"
    icon: "Forestry:planks"
    deps: ["lima"]
    desc: |
      Cada espécie nova do Forestry tem tronco, tábuas, escadas, lajes e cercas próprios! Mostre §e64 tábuas do Forestry§r de qualquer espécie.

      E construa algo bonito com elas, Herói! É uma missão opcional, mas um jeito delicioso de aproveitar o trabalho de cruzamento. Dê asas à imaginação e veja as cores nas receitas pelo NEI (R/U). Uma base linda é um prêmio e tanto!
    tasks:
      - {"get": "Forestry:planks:* x64"}
    rewards:
      - {"loot": "comum"}

  - id: "arborista_mestre"
    title: "Arborista Mestre"
    type: "milestone"
    icon: "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeChestnut\",UID1:\"forestry.treeChestnut\"}]}}"
    deps: ["castanheira", "limoeiro", "sequoia", "sumauma", "baoba", "salgueiro", "mamoeiro"]
    banner: "Arborista Mestre"
    subtitle: "O arquivo verde reescrito"
    desc: |
      Frutas, gigantes, madeiras tropicais... Herói, você cruzou árvores como os Antigos faziam nos
      arquivos verdes do Registro. A página da §earboricultura§r está completa o bastante para florescer
      sozinha.

      Leve as frutas para o Pomar, as gigantes para o Arboreto e as nozes para o Hidratador. E se quiser
      ir ainda mais longe, o capítulo §eBinnie§r (Extra Trees) tem centenas de espécies novas.
    tasks:
      - {"check": true}
    rewards:
      - {"xp": 8}
      - {"kit": {"name": "Kit do Arborista", "items": ["Forestry:grafter x2", "Forestry:fertilizerCompound x64", "Forestry:soil x32", "Forestry:treealyzer"]}}
      - {"loot": "raro"}

  - id: "borboleta"
    title: "Borboletas"
    type: "normal"
    icon: "Forestry:butterflyGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.lepiCabbageWhite\",UID1:\"forestry.lepiCabbageWhite\"}]}}"
    deps: ["muda_genetica"]
    desc: |
      Viu algo colorido voando entre as folhas? São as §eborboletas e mariposas§r do Forestry — elas
      nascem das folhas das árvores e também polinizam outras folhas!

      Para pegar uma, clique nela com uma §ePuça§r (Scoop: gravetos e lã). Mostre uma das espécies comuns
      (Couve-branca, Mariposa-limão, Borboleta-limão, Malhada, Rabo-de-andorinha...), de linhagem pura
      como vem da natureza.
    tasks:
      - {"one_of": ["Forestry:butterflyGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.mothBrimstone\",UID1:\"forestry.mothBrimstone\"}]}}", "Forestry:butterflyGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.lepiCabbageWhite\",UID1:\"forestry.lepiCabbageWhite\"}]}}", "Forestry:butterflyGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.lepiBrimstone\",UID1:\"forestry.lepiBrimstone\"}]}}", "Forestry:butterflyGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.lepiCitrusSwallow\",UID1:\"forestry.lepiCitrusSwallow\"}]}}", "Forestry:butterflyGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.lepiBlackSwallow\",UID1:\"forestry.lepiBlackSwallow\"}]}}", "Forestry:butterflyGE {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.lepiSpeckledWood\",UID1:\"forestry.lepiSpeckledWood\"}]}}"], "nbt": true}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:string x8"}

  - id: "flutterlyzer"
    title: "Lepidopteranalisador"
    type: "normal"
    deps: ["borboleta", "carpinteiro"]
    desc: |
      Chegou a hora de estudar as borboletas! Igual aos outros analisadores, o §eFlutterlyzer§r leva bronze, painéis de vidro, redstone, diamante e 2000 mB de água no Carpinteiro. Ele lê os genes das borboletas e gasta mel por análise.

      Confira a receita no NEI (R) e reserve uns potinhos de mel, Herói. Que as asas sejam muitas!
    tasks:
      - {"get": "Forestry:flutterlyzer"}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:ingotBronze x4"}

  - id: "bau_lepidopterista"
    title: "Baú do Lepidopterista"
    type: "optional"
    deps: ["borboleta"]
    desc: |
      Seis borboletas em volta de um baú com vidro em cima formam o §eBaú do Lepidopterista§r (o jogo chama de "Heteropterologista"). É uma coleção de asas organizada!

      É uma missão opcional, Herói, mas muito útil para quem junta borboletas de verdade. Confira a receita no NEI (R) e coloque num cantinho bonito da base.
    tasks:
      - {"get": "Forestry:lepidopterology"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_lepidopterista"
    title: "Mochila do Lepidopterista"
    type: "optional"
    deps: ["bau_lepidopterista"]
    desc: |
      Linha, lã, gravetos e o Baú do Lepidopterista no centro: uma mochila para levar borboletas nas expedições, Herói!

      É uma missão opcional, mas muito prática para quem sai coletando asas por aí. Confira a receita no NEI (R) e prepare o Baú do Lepidopterista com antecedência. Boas caçadas de borboletas!
    tasks:
      - {"get": "Forestry:lepidopteristBag"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_minerador"
    title: "Bolsa do Minerador"
    type: "normal"
    deps: ["bronze"]
    desc: |
      Mochilas do Forestry são inteligentes: §eitens do tipo certo vão direto para elas§r quando você os
      pega (segure-a ou mude o modo com Shift + clique direito).

      A §eBolsa do Minerador§r (linha, lã, ferro e um baú) recolhe minérios, pedras preciosas, pós e
      carvão. Faça a sua antes da próxima caverna!
    tasks:
      - {"get": "Forestry:minerBag"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:torch x32"}

  - id: "mochila_escavador"
    title: "Bolsa do Escavador"
    type: "optional"
    deps: ["mochila_minerador"]
    desc: |
      Pronto para escavar? A Bolsa do Escavador tem a mesma receita da Bolsa do Minerador, trocando o ferro por §epedra no lugar do ferro§r. Ela recolhe §eterra, pedregulho, areia e cascalho§r.

      É uma missão opcional, Herói, mas liberta o inventário de muita tralha. Confira a receita no NEI (R) e leve nas expedições de escavação.
    tasks:
      - {"get": "Forestry:diggerBag"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_lenhador"
    title: "Bolsa do Lenhador"
    type: "optional"
    deps: ["mochila_minerador"]
    desc: |
      Sua floresta agora tem uma bolsa! A Bolsa do Lenhador tem a mesma receita da Bolsa do Minerador, trocando o ferro por §etroncos§r. Ela recolhe §etroncos, mudas, folhas e frutas§r.

      É uma missão opcional, Herói, mas muito prática para quem cuida de fazendas de árvores. Confira a receita no NEI (R) e liberte seu inventário!
    tasks:
      - {"get": "Forestry:foresterBag"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_cacador"
    title: "Bolsa do Caçador"
    type: "optional"
    deps: ["mochila_minerador"]
    desc: |
      Caçada rendeu? A Bolsa do Caçador tem a mesma receita da Bolsa do Minerador, trocando o ferro por §epenas§r. Ela recolhe §edrops de mobs§r.

      É uma missão opcional, Herói, mas livra o inventário de carne podre, ossos e linhas. Confira a receita no NEI (R) e leve nas expedições de combate. Bom caçar, e boa organização!
    tasks:
      - {"get": "Forestry:hunterBag"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_aventureiro"
    title: "Bolsa do Aventureiro"
    type: "optional"
    deps: ["mochila_minerador"]
    desc: |
      Para quem vive explorando! A Bolsa do Aventureiro tem a mesma receita da Bolsa do Minerador, trocando o ferro por §eossos§r. Ela recolhe §eitens de exploração§r.

      É uma missão opcional, Herói, mas muito prática para as expedições longas. Confira a receita no NEI (R) e leve na próxima aventura. Menos tralha, mais espaço para tesouros!
    tasks:
      - {"get": "Forestry:adventurerBag"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_construtor"
    title: "Bolsa do Construtor"
    type: "optional"
    deps: ["mochila_minerador"]
    desc: |
      Obras a todo vapor! A Bolsa do Construtor tem a mesma receita da Bolsa do Minerador, trocando o ferro por §eargila§r. Ela recolhe §eblocos de construção§r.

      É uma missão opcional, Herói, mas faz uma diferença enorme em reformas e grandes projetos. Confira a receita no NEI (R) e leve nas construções. Menos organização, mais criatividade!
    tasks:
      - {"get": "Forestry:builderBag"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_t2"
    title: "Mochilas Tecidas"
    type: "optional"
    icon: "Forestry:minerBagT2"
    deps: ["mochila_minerador", "carpinteiro"]
    desc: |
      Qualquer mochila vira a versão §eTecida§r, com o dobro de espaço, no Carpinteiro: 7 Tecidos de Seda, 1 diamante, a mochila e 1000 mB de água.

      O Tecido de Seda vem das abelhas tropicais (capítulo de Apicultura). Mostre qualquer mochila tecida, Herói. É uma missão opcional, mas muito útil para quem junta muita coisa. Confira os detalhes no NEI (R/U).
    tasks:
      - {"one_of": ["Forestry:minerBagT2", "Forestry:diggerBagT2", "Forestry:foresterBagT2", "Forestry:hunterBagT2", "Forestry:adventurerBagT2", "Forestry:builderBagT2"]}
    rewards:
      - {"loot": "incomum"}

  - id: "carta"
    title: "Cartas"
    type: "normal"
    deps: ["polpa_madeira"]
    desc: |
      O Forestry tem um §ecorreio§r entre jogadores — num servidor como o da Akashic, isso é ouro!

      Uma §eCarta§r sai de papel + própolis (sem forma) ou, no Carpinteiro, de 6 Polpas de Árvore +
      250 mB de água. Escreva o destinatário e anexe itens.
    tasks:
      - {"get": "Forestry:letters"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:paper x8"}

  - id: "selos"
    title: "Selos"
    type: "normal"
    icon: "Forestry:stamps"
    deps: ["carta"]
    desc: |
      Carta sem selo não viaja. O envio custa §e1n de base + 1n por anexo§r. Selos: 3 do material + 3
      papéis + 3 Gotas de Mel = 9 selos (1n apatita, 2n cobre, 5n estanho, 10n ouro). Os selos de 20n,
      50n e 100n estão desativados para fabricação neste pack. Mostre §e9 selos§r quaisquer.
    tasks:
      - {"get": "Forestry:stamps:* x9"}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:apatite x6"}

  - id: "caixa_correio"
    title: "Caixa de Correio"
    type: "normal"
    deps: ["selos", "carcaca_resistente"]
    desc: |
      Estanho, a Carcaça Resistente e três baús formam a §eCaixa de Correio§r. Coloque a carta selada dentro para enviar, e as cartas que chegam para você aparecem nela.

      Agora dá para mandar presentes para os amigos do servidor sem sair de casa, Herói! Confira a receita no NEI (R) e instale em um lugar fácil de achar. Que alegria receber cartas!
    tasks:
      - {"get": "Forestry:mail"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:stamps:1 x9"}

  - id: "catalogo"
    title: "Catálogo"
    type: "optional"
    deps: ["caixa_correio"]
    desc: |
      Um selo e um livro formam o §eCatálogo§r: a lista dos Postos de Troca que existem no mundo e o que cada um oferece.

      É uma missão opcional, Herói, mas ótima para quem quer fuçar o comércio do servidor. Confira a receita no NEI (R) e dê uma olhada nas ofertas disponíveis. Quem sabe você não encontra uma pechincha por aí?
    tasks:
      - {"get": "Forestry:catalogue"}
    rewards:
      - {"loot": "comum"}

  - id: "posto_troca"
    title: "Posto de Troca"
    type: "normal"
    deps: ["caixa_correio", "placas_avancadas", "valvulas_metalicas"]
    desc: |
      O §ePosto de Troca§r é uma lojinha automática, Herói: você define o que vende e o que quer em troca, e outros jogadores compram mandando cartas para o endereço dele.

      Para montar, você precisa de válvulas de bronze e ferro, uma Placa Refinada, a Carcaça Resistente e baús. Confira a receita no NEI (R) e boas vendas!
    tasks:
      - {"get": "Forestry:mail:1"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:stamps:2 x9"}

  - id: "trigo_mofado"
    title: "Trigo Mofado"
    type: "optional"
    deps: ["humidificador"]
    desc: |
      O "combustível" do Humidificador apodrece em etapas: §eTrigo, Trigo Mofado, Trigo em Decomposição§r. Cada etapa continua alimentando a máquina.

      Mostre um Trigo em Decomposição, Herói: é prova de que o seu porão está bem escuro! É uma missão opcional, mas simpática para quem curte mexer com o Humidificador. Se tiver dúvida, aperte U no NEI. Pode esperar com calma, o trigo faz sozinho!
    tasks:
      - {"get": "Forestry:decayingWheat"}
    rewards:
      - {"loot": "comum"}

  - id: "cartao"
    title: "Cartão"
    type: "optional"
    deps: ["polpa_madeira"]
    desc: |
      Quatro Polpas de Árvore em losango e 1000 mB de água no Carpinteiro rendem §e2 Cartões§r, a embalagem dos Kits de Ferramenta.

      É uma missão opcional, Herói, mas simples e útil para quem quer montar kits de ferramenta. Confira a receita no NEI (R) e junte polpa de sobra. Embalagem de presente garantida!
    tasks:
      - {"get": "Forestry:carton x2"}
    rewards:
      - {"loot": "comum"}

  - id: "notas_sengir"
    title: "Notas do Sengir"
    type: "optional"
    deps: ["escrivaninha"]
    desc: |
      Acertou a pesquisa na Escrivaninha? Ela pode recompensar com §eNotas do Sengir§r, anotações que revelam uma mutação.

      Ler é a melhor forma de não cruzar no escuro, Herói! É uma missão opcional, mas ajuda muito a descobrir mutações de abelhas com menos tentativa e erro. Se tiver dúvida, aperte U no NEI. Boa pesquisa!
    tasks:
      - {"get": "Forestry:researchNote"}
    rewards:
      - {"loot": "incomum"}

  - id: "refinaria_oleo"
    title: "Refinaria de Óleo"
    type: "optional"
    icon: "Forestry:canSeedOil"
    deps: ["nogueira", "oleo_vegetal"]
    desc: |
      Com Nogueiras e Castanheiras no Pomar, o Hidratador vira um poço de petróleo verde, Herói! Encha §e4000 mB de Óleo Vegetal§r (4 baldes ou latas).

      É uma missão opcional, mas o óleo vegetal serve para muita coisa, de varas impregnadas a combustível. Confira os detalhes no NEI (R/U) e deixe o Hidratador trabalhando. Bom estoque!
    tasks:
      - {"fluid": "seedoil x4000"}
    rewards:
      - {"loot": "incomum"}

  - id: "estoque_etanol"
    title: "Estoque de Etanol"
    type: "optional"
    icon: "Forestry:canEthanol"
    deps: ["etanol"]
    desc: |
      Uma base que roda a etanol precisa de reserva, Herói! Mostre §e8000 mB de Etanol§r em latas ou baldes.

      É uma missão opcional, mas uma boa reserva evita sustos quando a produção de biomassa oscilar. Confira os detalhes no NEI (R/U) e deixe o Refinador trabalhando em segundo plano. Energia sempre à mão!
    tasks:
      - {"fluid": "bioethanol x8000"}
    rewards:
      - {"loot": "incomum"}

  - id: "gelo_picado"
    title: "Gelo Picado"
    type: "optional"
    icon: "Forestry:bucketIce"
    deps: ["hidratador"]
    desc: |
      Uma bola de neve e 4 Cacos de Gelo (das abelhas Geladas) no Hidratador rendem §e4000 mB de Gelo Picado§r, um refrigerante que vários mods aceitam.

      Junte 1000 mB para cumprir a missão, Herói. É opcional, mas muito prática para quem tem máquinas que esquentam. Confira os detalhes no NEI (R/U) e mantenha tudo fresquinho!
    tasks:
      - {"fluid": "ice x1000"}
    rewards:
      - {"loot": "comum"}

  - id: "lava_fosforo"
    title: "Lava de Fósforo"
    type: "optional"
    icon: "minecraft:lava_bucket"
    deps: ["hidratador"]
    desc: |
      Fósforo (das abelhas do Nether) com areia, pedregulho ou terra no Hidratador vira §elava§r (1600 a 2000 mB, conforme o bloco).

      É lava renovável, Herói, sem ir ao Nether toda hora! Encha 1000 mB para cumprir a missão. É opcional, mas muito prática. Confira os detalhes no NEI (R/U) e cuidado com a lava ao manusear!
    tasks:
      - {"fluid": "lava x1000"}
    rewards:
      - {"loot": "comum"}

  - id: "suco_tropical"
    title: "Suco Tropical"
    type: "optional"
    icon: "Forestry:canJuice"
    deps: ["mamoeiro", "suco"]
    desc: |
      Mamões rendem bastante suco, Herói. Junte §e4000 mB de Suco§r: com ele o Fermentador rende mais biomassa do que com água.

      É uma missão opcional, mas muito vantajosa para quem quer mais combustível. Confira os detalhes no NEI (R/U) e mantenha o Hidratador trabalhando com mamões. Doce vantagem!
    tasks:
      - {"fluid": "juice x4000"}
    rewards:
      - {"loot": "comum"}

  - id: "mestre_florestal"
    title: "Guardião das Florestas"
    type: "milestone"
    icon: "Forestry:factory:7"
