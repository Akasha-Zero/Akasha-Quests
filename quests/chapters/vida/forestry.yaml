      §aTruque:§r uma §emuda vanilla§r colocada nele vira a muda "genética" equivalente do Forestry.
    tasks:
      - {"get": "Forestry:treealyzer"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:sapling x8", "minecraft:sapling:2 x8", "minecraft:sapling:1 x8"]}

  - id: "muda_genetica"
    title: "A Primeira Muda Genética"
    type: "main"
    icon: "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeOak\",UID1:\"forestry.treeOak\"}]}}"
    deps: ["arvoranalisador"]
    desc: |
      Chegou a hora da genética, Herói! Coloque uma muda de carvalho, bétula, pinheiro, selva, acácia ou carvalho escuro no Arvoranalizador: ela vira uma §eMuda do Forestry§r com genes (altura, frutas, fertilidade, maturação...).

      Analise e leia a ficha com calma. Qualquer muda do Forestry conta. É o primeiro passo para criar árvores incríveis. Confira o NEI (R/U) se tiver dúvida!
    tasks:
      - {"one_of": ["Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeOak\",UID1:\"forestry.treeOak\"}]}}", "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeBirch\",UID1:\"forestry.treeBirch\"}]}}", "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeSpruce\",UID1:\"forestry.treeSpruce\"}]}}", "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeJungle\",UID1:\"forestry.treeJungle\"}]}}", "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeDarkOak\",UID1:\"forestry.treeDarkOak\"}]}}", "Forestry:sapling {Genome:{Chromosomes:[{Slot:0b,UID0:\"forestry.treeAcaciaVanilla\",UID1:\"forestry.treeAcaciaVanilla\"}]}}"], "nbt": true}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:fertilizerCompound x16", "Forestry:soil x16", "minecraft:dye:15 x16"]}

  - id: "info_polinizacao"
    title: "Como Árvores se Cruzam"
    type: "info"
    icon: "Forestry:leaves"
    deps: ["muda_genetica"]
    desc: |
      §e• Folhas são flores.§r Folhas do Forestry (e das árvores vanilla, ativado na config) podem ser
      polinizadas por §eabelhas§r (dentro do território delas) e por §eborboletas§r.
      §e• Polinizou, mudou.§r A folha polinizada passa a carregar os genes das duas árvores; as mudas
      que caírem dela podem §emutar§r para uma espécie nova.
      §e• O Enxerto§r arranca folhas e aumenta muito a chance de muda.
      §e• O NEI sabe tudo:§r abra a aba §eTree Breeding§r numa muda para ver os cruzamentos.

      §aSobre as quests:§r as mudas pedidas aqui precisam ser §epuras§r (as duas cópias do gene de
      espécie iguais — confira no Arvoranalizador). Plante uma híbrida, colha de novo e selecione.
    tasks:
      - {"check": true}
    rewards:
      - {"xp": 1}

  - id: "enxerto"
