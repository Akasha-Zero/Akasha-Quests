    rewards:
      - {"loot": "comum"}

  - id: "mochila_aventureiro"
    title: "Bolsa do Aventureiro"
    type: "optional"
    deps: ["mochila_minerador"]
    desc: |
      Mesma receita da Bolsa do Minerador, trocando o ferro por §eossos§r. Ela recolhe §eitens de exploração§r.
    tasks:
      - {"get": "Forestry:adventurerBag"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_construtor"
    title: "Bolsa do Construtor"
