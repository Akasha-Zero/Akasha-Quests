chapter:
  id: "forestry"
  title: "Forestry"
  prefix: ""
  order: 600
  icon: "Forestry:factory:1"
  desc: |
    §eO Volume das Florestas.§r Apatita, turfa e bronze; motores, Carpinteiro e biomassa;
    Fazendas Multibloco, genética de árvores, borboletas, mochilas e correio.
    (Forestry 4.11.36)

quests:
  - id: "apatita"
    title: "O Mineral das Florestas"
    type: "main"
    icon: "Forestry:resources"
    desc: |
      Toda floresta precisa de alguém que cuide dela — e o Volume das Florestas começa com uma pedra
      azulada, Herói. Estranho? Nem tanto: a §eApatita§r é o adubo dos Antigos.

      O §eMinério de Apatita§r do Forestry nasce no alto: um único veio grande (até 36 blocos) em
      cerca de 80% dos chunks, sempre de Y 56 para cima — procure nas encostas das montanhas e colinas.
      Cada minério solta Apatita; Fortuna ajuda muito.

      Junte §e8 Apatitas§r. Elas viram fertilizante, selos e, lá na frente, válvulas eletrônicas.
    tasks:
      - {"get": "ore:gemApatite x8"}
    rewards:
      - {"xp": 3}
      - {"choice": ["minecraft:bread x8", "minecraft:torch x16", "minecraft:iron_ingot x4"]}

  - id: "cobre"
    title: "Cobre do Forestry"
    type: "normal"
    icon: "Forestry:resources:1"
    deps: ["apatita"]
    desc: |
      O Forestry traz seu próprio §eMinério de Cobre§r: cerca de 20 veios pequenos (6 blocos) por chunk,
      entre Y 32 e 107. Qualquer cobre do oredict serve — o do IC2, do Thermal ou do Mekanism também.

      Junte §e16 lingotes de cobre§r: eles viram engrenagens, a Centrífuga, o Motor de Turfa e os
      blocos da Fazenda.
    tasks:
      - {"get": "ore:ingotCopper x16"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:coal x8"}

  - id: "estanho"
    title: "Estanho do Forestry"
    type: "normal"
    icon: "Forestry:resources:2"
    deps: ["apatita"]
    desc: |
      O §eMinério de Estanho§r do Forestry aparece em uns 18 veios por chunk, de Y 16 a 91.

      Junte §e16 lingotes de estanho§r. Latas, o Hidratador, as Placas de Circuito e o Motor Elétrico
      dependem dele. (Sim, o mundo está cheio de estanho. Os Antigos eram fãs de latinha.)
    tasks:
      - {"get": "ore:ingotTin x16"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:coal x8"}

  - id: "bronze"
    title: "Bronze"
    type: "main"
    icon: "Forestry:ingotBronze"
    deps: ["cobre", "estanho"]
    desc: |
      Cobre e estanho sozinhos são moles. Juntos, viram a liga que sustenta quase todo o Forestry!

      Na bancada, §e3 lingotes de cobre + 1 de estanho§r (sem forma) rendem §e4 lingotes de Bronze§r —
      a receita está ativa na config do pack. Junte §e16§r: a Carcaça Resistente sozinha come 8.

      §aDica:§r o bronze de outros mods (IC2, Thermal, Tinkers) também vale nas receitas do Forestry.
    tasks:
      - {"get": "ore:ingotBronze x16"}
    rewards:
      - {"xp": 3}
      - {"choice": ["Forestry:ingotCopper x9", "Forestry:ingotTin x6", "minecraft:iron_ingot x6"]}

  - id: "bloco_bronze"
    title: "Blocos de Armazenamento"
    type: "optional"
    deps: ["bronze"]
    desc: |
      Arrumação é amor-próprio, Herói! Nove lingotes viram um bloco, e o Forestry tem blocos de §eApatita, Cobre, Estanho e Bronze§r.
      Faça um Bloco de Bronze para guardar a sua liga com estilo. É uma missão opcional e bem tranquila, ótima para liberar espaço no inventário. Confira a receita no NEI (R) caso precise. Seu baú vai agradecer!
    tasks:
      - {"get": "Forestry:resourceStorage:3"}
    rewards:
      - {"loot": "comum"}

  - id: "ferramentas_sobrevivente"
    title: "Ferramentas do Sobrevivente"
    type: "optional"
    deps: ["bronze"]
    desc: |
      A §ePicareta§r e a §ePá do Sobrevivente§r são de bronze e quebram de um jeito curioso: viram ferramentas "quebradas" em vez de sumir. Guarde os cacos!
      No Carpinteiro, uma Picareta Quebrada devolve 2 lingotes de bronze e uma Pá Quebrada devolve 1. Faça uma das duas para cumprir a missão, Herói. É opcional, mas econômica. Confira a receita no NEI (R/U).
    tasks:
      - {"one_of": ["Forestry:bronzePickaxe", "Forestry:bronzeShovel"]}
    rewards:
      - {"loot": "comum"}

  - id: "chave_forestry"
    title: "Chave Inglesa"
    type: "optional"
    deps: ["bronze"]
    desc: |
      Motores do Forestry empurram energia para o lado em que estão virados, Herói! A §eChave Inglesa§r de bronze (4 lingotes em "Y") gira motores e máquinas sem precisar quebrá-los.
      Pequena, mas salva muita paciência. É uma missão opcional, mas recomendo fazer logo no começo. Se esquecer a receita, aperte R no NEI. Sua base vai ficar muito mais bem organizada!
    tasks:
      - {"get": "Forestry:wrench"}
    rewards:
      - {"loot": "comum"}

  - id: "fertilizante"
    title: "Fertilizante"
    type: "main"
    deps: ["apatita"]
    desc: |
      Lembra que eu disse que a apatita era adubo? Pois é! §eAreia + Apatita + Areia§r (em coluna)
      rendem §e8 Fertilizantes§r neste pack. Com cinzas em volta de uma apatita, saem 16.

      Fertilizante faz mudas crescerem na hora (como farinha de osso) e é o combustível das
      §bFazendas Multibloco§r — sem ele, nenhuma fazenda trabalha. Junte §e16§r.
    tasks:
      - {"get": "Forestry:fertilizerCompound x16"}
    rewards:
      - {"xp": 3}
      - {"choice": ["Forestry:apatite x8", "minecraft:sand x32", "minecraft:dye:15 x16"]}

  - id: "adubo"
    title: "Adubo"
    type: "optional"
    deps: ["fertilizante"]
    desc: |
      O §eAdubo§r (composto) é a versão "caseira": 4 trigos (ou cevada, aveia, centeio do HarvestCraft) em volta de 1 terra rendem 4. Com cinzas no lugar do trigo, sai 1.
      Ele serve para fazer Húmus e pode ser fermentado. Junte §e8§r, Herói! É uma missão opcional, mas muito útil para quem quer plantar. Confira a receita no NEI (R/U).
    tasks:
      - {"get": "Forestry:fertilizerBio x8"}
    rewards:
      - {"loot": "comum"}

  - id: "humus"
    title: "Húmus"
    type: "optional"
    deps: ["adubo"]
    desc: |
      Oito terras em volta de um adubo (ou fertilizante) viram §e8 Húmus§r. É um solo que acelera o
      crescimento de árvores e se degrada em terra com o tempo — ótimo para as fazendas de árvores
      (Arboreto). Também sai do Carpinteiro: 8 terras + 1 bagaço + 1000 mB de água = 9 húmus.
    tasks:
      - {"get": "Forestry:soil x8"}
    rewards:
      - {"loot": "comum"}

  - id: "terra_pantano"
    title: "Terra do Pântano"
    type: "main"
    deps: ["apatita"]
    desc: |
      Agora vamos plantar... combustível! A §eTerra do Pântano§r é feita com 4 terras, 4 areias e um
      balde de água no centro (6 unidades; com lata, cápsula ou célula d'água saem 8).

      Coloque a terra do pântano §eencostada em água§r: com o tempo ela "amadurece" e vira Turfa.
      Junte §e16 blocos§r para montar o seu primeiro turfal.
    tasks:
      - {"get": "Forestry:soil:1 x16"}
    rewards:
      - {"xp": 3}
      - {"choice": ["minecraft:water_bucket", "minecraft:dirt x32", "minecraft:sand x32"]}

  - id: "turfa"
    title: "Turfa"
    type: "main"
    deps: ["terra_pantano"]
    desc: |
      Uma terra que vira combustível — a natureza é a melhor engenheira!

      A Terra do Pântano encostada em água muda de aparência aos poucos até ficar escura e madura.
      Quebre-a com uma §epá§r para colher §eTurfa§r (e um pouco de terra). Replante e espere de novo.

      Junte §e16 Turfas§r: elas vão alimentar o seu primeiro motor. Mais tarde a Fazenda Turfeira faz
      isso sozinha.
    tasks:
      - {"get": "Forestry:peat x16"}
    rewards:
      - {"xp": 3}
      - {"choice": ["Forestry:soil:1 x8", "minecraft:iron_shovel", "minecraft:coal x8"]}

  - id: "engrenagem_pedra"
    title: "Engrenagem de Pedra"
    type: "normal"
    deps: ["bronze"]
    desc: |
      As engrenagens do Forestry têm um "miolo" de pedra, Herói: a §eEngrenagem de Pedra§r do BuildCraft, feita com 4 pedregulhos em cruz em volta de uma Engrenagem de Madeira.
      Faça §e3§r, uma para cada engrenagem metálica. É uma etapa simples, mas essencial. Confira a receita no NEI (R) se tiver dúvida. Falta pouco para as máquinas ganharem vida!
    tasks:
      - {"get": "ore:gearStone x3"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:cobblestone x32"}

  - id: "engrenagens"
    title: "Engrenagens Metálicas"
    type: "main"
    icon: "Forestry:gearBronze"
    deps: ["engrenagem_pedra"]
    desc: |
      Quatro lingotes em volta de uma Engrenagem de Pedra viram uma engrenagem de metal. Faça uma de
      cada: §eCobre§r (Motor de Turfa, Humidificador), §eEstanho§r (Motor Elétrico, Fazenda, Fazedor
      de Chuva) e §eBronze§r (Motor de Biogás, Fermentador).

      As engrenagens do Thermal Expansion contam também — o oredict é o mesmo.
    tasks:
      - {"get": ["ore:gearCopper", "ore:gearTin", "ore:gearBronze"]}
    rewards:
      - {"xp": 3}
      - {"choice": ["Forestry:ingotCopper x8", "Forestry:ingotTin x8", "Forestry:ingotBronze x6"]}

  - id: "carcaca_resistente"
    title: "Carcaça Resistente"
    type: "main"
    deps: ["bronze"]
    desc: |
      Oito lingotes de bronze em anel formam a §eCarcaça Resistente§r, o coração de quase toda máquina do Forestry: Carpinteiro, Hidratador, Centrífuga, Fermentador, Refinador, Fabricador, Analisador, Caixa de Correio...

      Vá juntando bronze, Herói. Você vai precisar de várias! Confira a receita no NEI (R) e organize o estoque de bronze. Tudo começa por aqui, e eu estou empolgada com a sua base!
    tasks:
      - {"get": "Forestry:sturdyMachine"}
    rewards:
      - {"xp": 3}
      - {"choice": ["Forestry:ingotBronze x8", "minecraft:glass x16", "Forestry:peat x8"]}

  - id: "info_energia"
    title: "Como Pensam os Motores"
    type: "info"
    icon: "Forestry:engine:1"
    deps: ["engrenagens"]
    desc: |
      Uma aulinha antes de ligar qualquer coisa (prometo que é rápida!).

      §b• Unidade:§r os motores do Forestry geram §eRF/t§r (Redstone Flux por tick; 20 ticks = 1 s).
      §b• Direção:§r o motor empurra energia para a máquina §epara onde está virado§r. Use a Chave
      Inglesa para girá-lo.
      §b• Liga/desliga:§r os motores de combustível precisam de um §esinal de redstone§r (alavanca).
      §b• Calor:§r se a energia não for consumida, o motor esquenta. §cAo chegar ao limite ele entra em
      resfriamento forçado e perde boa parte da energia guardada.§r Não deixe motor ligado à toa!

      As dicas da aba "?" de cada motor (no próprio GUI) repetem isso — leia quando quiser.
    tasks:
      - {"check": true}
    rewards:
      - {"xp": 1}

  - id: "motor_engrenagem"
    title: "Motor de Engrenagem"
    type: "normal"
    deps: ["engrenagens"]
    desc: |
      O avô de todos os motores: tábuas, vidro, uma engrenagem de cobre, um pistão e um §erelógio§r.

      O §eMotor de Engrenagem§r funciona na mão: clique nele para dar corda. Cada volta gasta um
      pouquinho da sua fome e a energia vai caindo devagar. §cSe der corda demais, a mola machuca
      (3 corações)!§r Serve para um empurrão inicial, não para uma fábrica.
    tasks:
      - {"get": "Forestry:engine:4"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:bread x6"}

  - id: "motor_turfa"
    title: "Motor de Turfa"
    type: "main"
    deps: ["engrenagens", "turfa"]
    desc: |
      Agora sim, energia de verdade! Três lingotes de cobre, vidro, duas engrenagens de cobre e um
      pistão formam o §eMotor de Turfa§r.

      Ele queima Turfa (§e10 RF/t por 5000 ticks§r) ou Turfa Betuminosa (§e20 RF/t por 6000 ticks§r) e
      deixa §eCinzas§r nos slots de resíduo. Ligue-o com redstone, vire-o para uma máquina e pronto.

      §aDica:§r um motor desligado continua terminando a turfa que já começou a queimar — sem gerar nada.
    tasks:
      - {"get": "Forestry:engine:1"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:peat x16", "Forestry:ingotCopper x8", "minecraft:lever x4"]}

  - id: "cinzas"
    title: "Cinzas"
    type: "normal"
    icon: "Forestry:ash"
    deps: ["motor_turfa"]
    desc: |
      O Motor de Turfa deixa §eCinzas§r para trás, Herói. Não jogue fora! Cinzas em volta de uma apatita viram 16 fertilizantes, e 2 cinzas, 2 turfas e 1 própolis viram Turfa Betuminosa.
      Junte §e16§r e guarde num baú. É uma etapa tranquila, só exige um pouco de paciência com o motor. Se quiser ver outros usos, aperte U no NEI.
    tasks:
      - {"get": "ore:dustAsh x16"}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:apatite x4"}

  - id: "turfa_betuminosa"
    title: "Turfa Betuminosa"
    type: "optional"
    deps: ["cinzas"]
    desc: |
      Duas turfas, duas cinzas e uma §ePrópolis§r (vem das abelhas, veja o capítulo de Apicultura) formam a §eTurfa Betuminosa§r: o dobro de potência no Motor de Turfa (20 RF/t). Faça §e4§r.
      É uma missão opcional, Herói, mas dobra a eficiência do seu motor. Confira a receita no NEI (R) e guarde a própolis com carinho. Energia dobrada, alegria dobrada!
    tasks:
      - {"get": "Forestry:bituminousPeat x4"}
    rewards:
      - {"loot": "comum"}

  - id: "motor_eletrico"
    title: "Motor Elétrico"
    type: "optional"
    deps: ["engrenagens"]
    desc: |
      Tem IC2 por perto? O §eMotor Elétrico§r (estanho, vidro, engrenagens de estanho e pistão) recebe §bEU§r e devolve RF para as máquinas do Forestry.
      Aceita baterias no slot e pode receber uma placa de circuito para regular a saída (veja "Circuitos do Motor"). É uma missão opcional, Herói, mas uma ponte ótima entre os mods. Confira a receita no NEI (R).
    tasks:
      - {"get": "Forestry:engine"}
    rewards:
      - {"loot": "comum"}

  - id: "circuitos_motor"
    title: "Circuitos do Motor Elétrico"
    type: "optional"
    icon: "Forestry:chipsets:1"
    deps: ["motor_eletrico", "ferro_solda", "valvulas_metalicas"]
    desc: |
      O Motor Elétrico tem soquete de circuito. Solde válvulas numa placa (Ferro de Solda):
      §e• Estanho:§r Impulso Elétrico I (+20 RF/t, +7 EU/t)
      §e• Bronze:§r Impulso Elétrico II (+40 RF/t, +15 EU/t)
      §e• Cobre:§r Choque Elétrico (-10 RF/t, -2 EU/t)
      §e• Ferro:§r Eficiência Elétrica (-1 EU/t)
      Mostre uma Placa Aprimorada e uma válvula de bronze.
    tasks:
      - {"get": ["Forestry:chipsets:1", "Forestry:thermionicTubes:2"]}
    rewards:
      - {"loot": "comum"}

  - id: "hidratador"
    title: "Hidratador"
    type: "main"
    deps: ["carcaca_resistente", "motor_turfa"]
    desc: |
      O nome em português engana: o §eHidratador§r (Squeezer) é uma §bprensa§r. Ele espreme coisas
      e tira líquido delas.

      Receita: estanho, vidro e a Carcaça Resistente no meio. Ligue um motor nele e experimente:
      sementes viram §eÓleo Vegetal§r, maçãs viram suco + bagaço, cactos viram água.
    tasks:
      - {"get": "Forestry:factory:5"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:wheat_seeds x32", "minecraft:apple x8", "Forestry:peat x16"]}

  - id: "oleo_vegetal"
    title: "Óleo Vegetal"
    type: "main"
    icon: "Forestry:bucketSeedOil"
    deps: ["hidratador"]
    desc: |
      O §eÓleo Vegetal§r é a "cola" da marcenaria do Forestry. No Hidratador, cada semente (trigo,
      abóbora, melancia) rende 10 mB neste pack; Nozes e Castanhas das árvores do Forestry rendem
      muito mais.

      Encha §eum balde, uma lata ou uma cápsula com 1000 mB§r. O Carpinteiro vai pedir óleo para o
      Invólucro Impregnado, as Varas Impregnadas e a Escrivaninha.
    tasks:
      - {"fluid": "seedoil x1000"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:wheat_seeds x64", "minecraft:bucket x2", "Forestry:canEmpty x8"]}

  - id: "latas"
    title: "Latas"
    type: "normal"
    deps: ["estanho"]
    desc: |
      Três lingotes de estanho (um no meio de cima, dois nas laterais de baixo) rendem §e12 Latas§r
      neste pack.
      Latas carregam 1000 mB de qualquer líquido do Forestry e cabem em pilhas: muito melhores que
      baldes para levar óleo, biomassa e etanol de um lado para o outro.
    tasks:
      - {"get": "Forestry:canEmpty x12"}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:ingotTin x4"}

  - id: "suco"
    title: "Suco de Fruta"
    type: "optional"
    icon: "Forestry:bucketJuice"
    deps: ["hidratador"]
    desc: |
      Maçãs no Hidratador rendem §e200 mB de Suco§r e um pouco de §eBagaço§r. Limões, mamões e outras frutas do Forestry também viram suco.
      O suco é combustível fraco (10 RF/t) no Motor de Biogás, mas melhora muito o rendimento do Fermentador! Encha 1000 mB, Herói. Confira os detalhes no NEI (R/U) se tiver dúvida. Uma fazenda bem cuidada rende de tudo!
    tasks:
      - {"fluid": "juice x1000"}
    rewards:
      - {"loot": "comum"}

  - id: "bagaco"
    title: "Bagaço"
    type: "optional"
    deps: ["suco"]
    desc: |
      O §eBagaço§r (Mulch) que sobra das frutas vira solo, Herói! 8 terras e 1 bagaço no Carpinteiro rendem 9 Húmus; terra, areia e bagaço rendem Terra do Pântano.
      Junte §e8§r e guarde. Nada se perde no Volume das Florestas! É uma missão opcional, mas muito útil para quem planeja fazendas. Se esquecer a receita, aperte R no NEI. Que sustentabilidade!
    tasks:
      - {"get": "Forestry:mulch x8"}
    rewards:
      - {"loot": "comum"}

  - id: "carpinteiro"
    title: "Carpinteiro"
    type: "main"
    deps: ["carcaca_resistente", "motor_turfa"]
    desc: |
      Se o Forestry tivesse um coração, seria este. O §eCarpinteiro§r é uma bancada motorizada com
      tanque: muitas receitas pedem um §elíquido§r (água, óleo vegetal, mel) além dos itens.

      Receita: bronze, vidro e a Carcaça Resistente. Encha o tanque com água (balde ou cano), ligue um
      motor e abra o NEI no Carpinteiro para ver tudo o que ele faz.

      §aDica:§r o Carpinteiro também empacota itens em §eCaixotes§r para economizar espaço.
    tasks:
      - {"get": "Forestry:factory:1"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:water_bucket", "Forestry:ingotBronze x6", "minecraft:log x16"]}

  - id: "involucro_impregnado"
    title: "Invólucro Impregnado"
    type: "main"
    deps: ["carpinteiro", "oleo_vegetal"]
    desc: |
      Madeira tratada com óleo dura para sempre. No Carpinteiro: §e8 troncos em anel + 250 mB de
      Óleo Vegetal§r = §eInvólucro Impregnado§r.

      Ele é a base do §eApiário§r e do §eApiaryum§r — a porta de entrada para a apicultura séria.
      Faça um e guarde; o capítulo de Apicultura vai pedir.
    tasks:
      - {"get": "Forestry:impregnatedCasing"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:log x16", "Forestry:canEmpty x6", "minecraft:planks x32"]}

  - id: "vara_impregnada"
    title: "Vara Impregnada"
    type: "normal"
    deps: ["carpinteiro", "oleo_vegetal"]
    desc: |
      Dois troncos em coluna e 100 mB de óleo vegetal rendem §e2 Varas Impregnadas§r. Elas formam o Quadro Impregnado das colmeias, muito mais durável que o comum.
      Faça §e4§r, Herói. É uma etapa simples que prepara o terreno para a apicultura. Confira a receita no NEI (R) se tiver dúvida. Suas abelhas agradecem a casa nova!
    tasks:
      - {"get": "Forestry:oakStick x4"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:string x4"}

  - id: "polpa_madeira"
    title: "Polpa de Árvore"
    type: "normal"
    deps: ["carpinteiro"]
    desc: |
      Um tronco e 250 mB de água no Carpinteiro viram §e4 Polpas de Árvore§r. Duas polpas em coluna dão papel; quatro em losango dão 2 Cartões (para os kits de ferramenta); seis viram uma Carta.
      Junte §e8§r, Herói. É um material versátil e vai aparecer em muitas receitas. Se esquecer algum uso, aperte U no NEI. Boa produção!
    tasks:
      - {"get": "Forestry:woodPulp x8"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:log x8"}

  - id: "escrivaninha"
    title: "Escrivaninha"
    type: "normal"
    deps: ["carpinteiro", "oleo_vegetal"]
    desc: |
      Cientista que se preze tem uma mesa! A §eEscrivaninha§r (Escritoire) sai do Carpinteiro com
      tábuas e 500 mB de óleo vegetal.

      Coloque um espécime genético (abelha, muda, borboleta) no centro e outros nas ranhuras da
      esquerda: é um minijogo de pesquisa que pode render §eNotas do Sengir§r e dicas sobre mutações.
    tasks:
      - {"get": "Forestry:core:1"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:paper x8"}

  - id: "mesa_trabalho"
    title: "Mesa de Trabalho"
    type: "optional"
    deps: ["carpinteiro"]
    desc: |
      Livro, bancada e baú (em coluna) formam a §eMesa de Trabalho§r. Ela tem inventário próprio e §elembra as últimas receitas§r que você fez: um clique repete o craft.
      Quem fabrica placa de circuito em lote agradece, Herói! É uma missão opcional, mas poupa muito tempo e muitos cliques. Confira a receita no NEI (R) e instale num cantinho conveniente.
    tasks:
      - {"get": "Forestry:factory2:2"}
    rewards:
      - {"loot": "comum"}

  - id: "caixotes"
    title: "Caixotes"
    type: "optional"
    deps: ["carpinteiro"]
    desc: |
      Quatro troncos em losango no Carpinteiro (com água) rendem §e24 Caixas§r vazias. Depois, 9 itens iguais e 1 caixa viram 1 §eCaixote§r cheio.
      Funciona com troncos, pedra, minérios, combs... Seu baú agradece, Herói! É uma missão opcional, mas ótima para liberar espaço e organizar a base. Confira a receita no NEI (R/U) e comece a empacotar.
    tasks:
      - {"get": "Forestry:cratedWood"}
    rewards:
      - {"loot": "comum"}

  - id: "kits_ferramenta"
    title: "Kits de Ferramentas"
    type: "optional"
    deps: ["ferramentas_sobrevivente", "polpa_madeira"]
    desc: |
      Um Cartão de papelão, bronze e gravetos no Carpinteiro formam um §eKit de Picaretas§r (ou de Pás), uma ferramenta embalada para presente. Abra com clique direito.
      E lembre: as ferramentas quebradas voltam a ser bronze no Carpinteiro. Faça um dos dois kits, Herói. É opcional, mas uma gracinha. Confira a receita no NEI (R/U) e embrulhe com carinho!
    tasks:
      - {"one_of": ["Forestry:kitPickaxe", "Forestry:kitShovel"]}
    rewards:
      - {"loot": "comum"}

  - id: "placa_basica"
    title: "Placa de Circuito Básica"
    type: "main"
    deps: ["carpinteiro"]
    desc: |
      Circuitos de madeira? Não — de redstone! No Carpinteiro, §e1 estanho + 6 redstones + 1000 mB de
      água§r = §ePlaca de Circuito Básica§r.

      Placas recebem §eválvulas eletrônicas§r soldadas e viram "programas": dizem a uma Fazenda o que
      plantar, ou regulam o Motor Elétrico. A básica tem 1 soquete.
    tasks:
      - {"get": "Forestry:chipsets"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:redstone x16", "Forestry:ingotTin x6", "Forestry:ingotBronze x4"]}

  - id: "placas_avancadas"
    title: "Placas Maiores"
    type: "normal"
    icon: "Forestry:chipsets:3"
    deps: ["placa_basica"]
    desc: |
      Troque o estanho por outro metal e ganhe soquetes:
      §e• Aprimorada§r (bronze): 2 soquetes
      §e• Refinada§r (ferro): 3 soquetes
      §e• Intrincada§r (ouro): 4 soquetes
      Todas com redstone e 1000 mB de água no Carpinteiro. A Intrincada é a favorita das Fazendas —
      um circuito para cada lado.
    tasks:
      - {"get": ["Forestry:chipsets:1", "Forestry:chipsets:2", "Forestry:chipsets:3"]}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:redstone x16"}

  - id: "ferro_solda"
    title: "Ferro de Solda"
    type: "normal"
    deps: ["placa_basica"]
    desc: |
      Ferro e bronze no Carpinteiro (1000 mB de água) viram o §eFerro de Solda§r. Clique direito com ele para abrir a bancada de solda: coloque a placa e as válvulas, escolha o diagrama (Fazenda Gerenciada, Fazenda Manual, Motor Elétrico...) e solde.
      É a ferramenta que dá vida às suas fazendas, Herói. Confira a receita no NEI (R) e prepare as placas. Bom trabalho!
    tasks:
      - {"get": "Forestry:solderingIron"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:iron_ingot x4"}

  - id: "fermentador"
    title: "Fermentador"
    type: "main"
    deps: ["carpinteiro", "engrenagens"]
    desc: |
      Hora de transformar planta em combustível, Herói! O §eFermentador§r (engrenagens de bronze, vidro e Carcaça Resistente) mistura material vegetal com água e produz §eBiomassa§r.

      Ele também aceita §eFertilizante ou Adubo§r num slot próprio, que acelera a fermentação. Confira a receita no NEI (R) e instale em um lugar fácil de alimentar. Falta pouco para o etanol!
    tasks:
      - {"get": "Forestry:factory:3"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:sapling x16", "Forestry:fertilizerCompound x8", "minecraft:reeds x16"]}

  - id: "biomassa"
    title: "Biomassa"
    type: "main"
    icon: "Forestry:bucketBiomass"
    deps: ["fermentador"]
    desc: |
      Neste pack, cada §emuda§r rende 250 mB de biomassa no Fermentador; trigo, cana, cacto e cogumelos
      rendem 50; batata rende o dobro do trigo. Usar §esuco ou mel§r no lugar da água aumenta o
      rendimento (o NEI mostra os números).

      Encha §e1000 mB de Biomassa§r. Ela move o Motor de Biogás (50 RF/t) e vira etanol no Refinador.
    tasks:
      - {"fluid": "biomass x1000"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:sapling x32", "Forestry:canEmpty x8", "minecraft:wheat x32"]}

  - id: "motor_biogas"
    title: "Motor de Biogás"
    type: "main"
    deps: ["motor_turfa", "biomassa"]
    desc: |
      Bronze, vidro, engrenagens de bronze e pistão: o §eMotor de Biogás§r queima líquidos!

      §e• Biomassa:§r 50 RF/t — a melhor
      §e• Óleo vegetal:§r 30 RF/t
      §e• Mel:§r 20 RF/t
      §e• Suco, água, leite:§r 10 RF/t

      §cÁgua é terrivelmente ineficiente§r e faz o motor consumir lava sem parar. Fique com biomassa.
      Uma vantagem: desligado, ele não desperdiça o combustível que está no tanque.
    tasks:
      - {"get": "Forestry:engine:2"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:gearBronze x2", "Forestry:canEmpty x8", "minecraft:lever x4"]}

  - id: "refinador"
    title: "Refinador"
    type: "main"
    deps: ["fermentador"]
    desc: |
      O §eRefinador§r (Still) é a destilaria do Forestry, Herói: redstone, vidro e Carcaça Resistente.
      Ele transforma §e10 mB de biomassa em 3 mB de Etanol§r e também Hidromel em Mead, para quem cria abelhas. É o passo que fecha o ciclo do combustível verde. Confira a receita no NEI (R) e prepare uma boa fila de biomassa. Que cheiro bom de progresso!
    tasks:
      - {"get": "Forestry:factory:6"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:redstone x16", "Forestry:canEmpty x8", "minecraft:glass x16"]}

  - id: "etanol"
    title: "Etanol"
    type: "main"
    icon: "Forestry:bucketEthanol"
    deps: ["refinador"]
    desc: |
      O combustível verde, Herói! Encha §e1000 mB de Etanol§r no Refinador.

      O §eBio Gerador§r do Forestry queima etanol a §b32 EU/t§r (biomassa só dá 8). Muitos outros mods do pack aceitam etanol como combustível, então é um ótimo produto de exportação da sua fazenda. Mantenha o Refinador abastecido de biomassa e deixe a produção rolar com calma. Dá gosto ver a fazenda crescer!
    tasks:
      - {"fluid": "bioethanol x1000"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:canEmpty x12", "minecraft:sapling x32", "minecraft:bucket x2"]}

  - id: "bio_gerador"
    title: "Bio Gerador"
    type: "optional"
    deps: ["etanol"]
    desc: |
      Ouro, vidro e Carcaça Resistente: o §eBio Gerador§r queima etanol ou biomassa e entrega §bEU§r (IC2). Rende 32 EU/t com etanol e 8 EU/t com biomassa.
      É a ponte entre a sua fazenda e a rede elétrica, Herói! Missão opcional, mas poderosa para quem quer energia limpa. Confira a receita no NEI (R/U) e conecte seus cabos com cuidado.
    tasks:
      - {"get": "Forestry:engine:3"}
    rewards:
      - {"loot": "comum"}

  - id: "humidificador"
    title: "Humidificador"
    type: "normal"
    deps: ["carcaca_resistente", "engrenagens"]
    desc: |
      O §eHumidificador§r (Moistener) não usa energia nenhuma: precisa de §eescuridão§r (luz 11 ou menos
      em cima dele — quanto mais escuro, mais rápido), água e "combustível" de trigo que vai mofando.

      Ele transforma sementes em §eMicélio§r, pedregulho em §ePedregulho com Musgo§r e tijolos de pedra
      em §eTijolos com Musgo§r. Engrenagens de cobre, vidro e Carcaça Resistente.
    tasks:
      - {"get": "Forestry:factory:4"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:wheat x16"}

  - id: "musgo"
    title: "Musgo e Micélio"
    type: "optional"
    icon: "minecraft:mossy_cobblestone"
    deps: ["humidificador"]
    desc: |
      Mostre um resultado do Humidificador, Herói: §eMicélio, Pedregulho com Musgo ou Tijolo de Pedra com Musgo§r!
      Os construtores adoram, e o micélio é solo de fazenda de cogumelos. É uma missão opcional e bem tranquila. Basta pôr o material certo na máquina, esperar um pouquinho e coletar o resultado. Se esquecer a receita, aperte R no NEI. Boa decoração!
    tasks:
      - {"one_of": ["minecraft:mycelium", "minecraft:mossy_cobblestone", "minecraft:stonebrick:1"]}
    rewards:
      - {"loot": "comum"}

  - id: "centrifuga"
    title: "Centrífuga"
    type: "main"
    deps: ["carcaca_resistente", "motor_turfa"]
    desc: |
      Cobre, vidro e Carcaça Resistente formam a §eCentrífuga§r. Ela gira favos de mel e separa cera, gotas de mel, própolis, melaço...

      No Forestry ela é a ponte para a §dApicultura§r. Leve-a para o capítulo das abelhas quando a primeira colmeia zumbir, Herói! Confira a receita no NEI (R) e prepare um lugar bom para ela. As abelhas já estão ansiosas!
    tasks:
      - {"get": "Forestry:factory:2"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:ingotCopper x8", "minecraft:glass x16", "Forestry:peat x16"]}

  - id: "engarrafador"
    title: "Engarrafador"
    type: "optional"
    deps: ["latas", "carcaca_resistente"]
    desc: |
      Latas, vidro e Carcaça Resistente: o §eEngarrafador§r enche (e esvazia) latas, cápsulas e baldes de forma automática.
      É útil para mandar óleo e etanol por tubos, Herói. É uma missão opcional, mas muito prática para quem quer automatizar a base. Confira a receita no NEI (R/U) e instale perto dos seus tanques. Menos balde na mão, mais tempo para explorar!
    tasks:
      - {"get": "Forestry:factory"}
    rewards:
      - {"loot": "comum"}

  - id: "tanque_chuva"
    title: "Tanque de Chuva"
    type: "optional"
    deps: ["carcaca_resistente"]
    desc: |
      Ferro, vidro e Carcaça Resistente. O §eTanque de Chuva§r recolhe água quando chove, mesmo sem energia. Para engarrafar a água, aí sim precisa de um motor.
      É ótimo para bases longe de rios, Herói. É uma missão opcional, mas poupa muito esforço. Confira a receita no NEI (R) e instale em um lugar aberto, sem teto em cima. Água grátis, só esperar a chuva!
    tasks:
      - {"get": "Forestry:factory2:1"}
    rewards:
      - {"loot": "comum"}

  - id: "fabricador"
    title: "Fabricador Termiônico"
    type: "main"
    deps: ["carcaca_resistente", "motor_turfa"]
    desc: |
      Ouro, vidro, a Carcaça Resistente e um baú: o §eFabricador Termiônico§r derrete areia e vidro em
      §eVidro Líquido§r e molda com ele as peças finas do Forestry.

      Ele precisa de energia para §eaquecer§r antes de derreter: areia pede mais calor que vidro. Depois,
      o tanque de vidro líquido alimenta a "bancada" da direita.
    tasks:
      - {"get": "Forestry:factory2"}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:sand x32", "minecraft:gold_ingot x4", "minecraft:glass x16"]}

  - id: "vidro_liquido"
    title: "Vidro Líquido"
    type: "normal"
    icon: "Forestry:bucketGlass"
    deps: ["fabricador"]
    desc: |
      Um bloco de vidro rende 1000 mB; areia também rende 1000 mB (mas pede mais calor); arenito rende 4000 mB; um painel de vidro rende 375 mB.
      Encha §e1000 mB de Vidro Líquido§r num balde ou lata, Herói. Esse fluido vai aparecer em várias receitas do Fabricador, então vale ter um bom estoque. Confira os detalhes no NEI (R/U). Boa fundição!
    tasks:
      - {"fluid": "glass x1000"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:sand x32"}

  - id: "valvulas_basicas"
    title: "Válvulas Eletrônicas"
    type: "main"
    icon: "Forestry:thermionicTubes:1"
    deps: ["vidro_liquido"]
    desc: |
      Essas lampadinhas são o "código" dos circuitos do Forestry! No Fabricador: §e5 do material + 2
      redstones + 500 mB de vidro líquido = 4 Válvulas Eletrônicas§r.

      Faça §e4 de Cobre e 4 de Estanho§r. A de estanho entra no Bloco da Fazenda; a de cobre programa o
      Arboreto (fazenda de árvores).
    tasks:
      - {"get": ["Forestry:thermionicTubes x4", "Forestry:thermionicTubes:1 x4"]}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:redstone x16", "Forestry:ingotCopper x8", "Forestry:ingotTin x8"]}

  - id: "valvulas_metalicas"
    title: "Válvulas de Bronze, Ferro e Ouro"
    type: "normal"
    icon: "Forestry:thermionicTubes:4"
    deps: ["valvulas_basicas"]
    desc: |
      Mais válvulas, mais programas, Herói! A §eBronze§r serve para a fazenda de cereais, a §eFerro§r para vegetais e a §eOuro§r para suculentas, e também é peça do Apiaryum: Ventilador, Aquecedor e o Controle da Fazenda.
      Faça as três. Elas são feitas no Fabricador, então confira as receitas no NEI (R). Cada válvula é um pedacinho de uma fazenda maior!
    tasks:
      - {"get": ["Forestry:thermionicTubes:2", "Forestry:thermionicTubes:3", "Forestry:thermionicTubes:4"]}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:redstone x16"}

  - id: "valvulas_preciosas"
    title: "Válvulas Preciosas"
    type: "normal"
    icon: "Forestry:thermionicTubes:5"
    deps: ["valvulas_metalicas"]
    desc: |
      Agora com pedras, Herói: §e"Diamantine"§r (diamante, para o Enxame do Apiaryum e o Mutator), §eEsmeralda§r, §eApatita§r (fazenda de cogumelos) e §eLápis-lazúli§r (plantação de cacau).
      Faça uma de cada. Elas ficam um pouco caras, mas abrem muitos programas de fazenda. Confira as receitas no NEI (R) e junte os materiais com calma. Brilhante, não é?
    tasks:
      - {"get": ["Forestry:thermionicTubes:5", "Forestry:thermionicTubes:9", "Forestry:thermionicTubes:10", "Forestry:thermionicTubes:11"]}
    rewards:
      - {"xp": 3}
      - {"item": "minecraft:diamond"}

  - id: "valvulas_exoticas"
    title: "Válvulas Exóticas"
    type: "optional"
    icon: "Forestry:thermionicTubes:7"
    deps: ["valvulas_preciosas"]
    desc: |
      As mais estranhas, Herói: §eObsidiana§r (fazenda de morangas), §eArdente§r (pó de blaze, fazenda infernal), §eEnder§r (olho do fim e pedra do fim) e §eEmborrachada§r (borracha, plantação de seringueira).
      Faça pelo menos a ardente e a de obsidiana. A missão é opcional, mas abre fazendas diferentonas. Confira as receitas no NEI (R/U) e divirta-se!
    tasks:
      - {"get": ["Forestry:thermionicTubes:6", "Forestry:thermionicTubes:7"]}
    rewards:
      - {"loot": "incomum"}

  - id: "molde_cera"
    title: "Molde de Cera e Vidro Colorido"
    type: "optional"
    deps: ["vidro_liquido"]
    desc: |
      Oito ceras de abelha em anel formam o §eMolde de Cera§r. No Fabricador, com o molde no slot, §e1 corante, 1 própolis e 4000 mB de vidro líquido§r viram 4 vidros coloridos.
      Arte e apicultura, Herói! É uma missão opcional, mas lindíssima para decorar. Confira as receitas no NEI (R/U) e escolha as cores que mais combinam com a sua base.
    tasks:
      - {"get": "Forestry:waxCast"}
    rewards:
      - {"loot": "comum"}

  - id: "madeira_antichamas"
    title: "Madeira à Prova de Fogo"
    type: "optional"
    icon: "Forestry:logsFireproof"
    deps: ["vidro_liquido", "madeiras_forestry"]
    desc: |
      Troncos e tábuas do Forestry ganham versão §eà prova de fogo§r no Fabricador, com Cera em Pó (refractory wax, das abelhas do Nether) e 500 mB de vidro líquido.
      É ótimo para casas perto de lava, Herói! Missão opcional, mas muito útil para quem constrói em lugares perigosos. Confira a receita no NEI (R/U) e reserve cera em pó. Madeira que não se queima, que luxo!
    tasks:
      - {"get": "Forestry:logsFireproof:*"}
    rewards:
      - {"loot": "comum"}

  - id: "capsulas"
    title: "Cápsulas"
    type: "optional"
    icon: "Forestry:waxCapsule"
    deps: ["latas"]
    desc: |
      Além das latas, o Forestry tem §eCápsulas de Cera§r (3 ceras de abelha rendem 4) e §eCápsulas Refratárias§r (3 ceras em pó rendem 4; aguentam lava).
      São baratas e o Hidratador recicla a cera, Herói. Faça uma das duas para cumprir a missão. É opcional, mas prática. Confira as receitas no NEI (R) e guarde para quando precisar transportar fluidos.
    tasks:
      - {"one_of": ["Forestry:waxCapsule", "Forestry:refractoryEmpty"]}
    rewards:
      - {"loot": "comum"}

  - id: "pipeta"
    title: "Pipeta"
    type: "optional"
    deps: ["carpinteiro"]
    desc: |
      Sobrou um restinho de líquido preso no tanque de uma máquina? Clique no tanque com a §ePipeta§r (lã e painéis de vidro) para esvaziá-lo.
      Pequena e preciosa, Herói! É uma missão opcional, mas poupa muita dor de cabeça com fluidos teimosos. Confira a receita no NEI (R) e guarde a pipeta num lugar fácil de achar. Pequenos truques fazem grande diferença!
    tasks:
      - {"get": "Forestry:pipette"}
    rewards:
      - {"loot": "comum"}

  - id: "revestimento_endurecido"
    title: "Revestimento Endurecido"
    type: "normal"
    deps: ["carpinteiro"]
    desc: |
      Quatro diamantes em volta de uma Carcaça Resistente, mais 5000 mB de água no Carpinteiro, formam o §eRevestimento Endurecido§r. Caro? Um pouco.
      Ele é a base do Fazedor de Chuva, Herói, então vale o investimento se você quer controlar o clima. Confira a receita no NEI (R) e junte os diamantes com calma. Falta pouco para virar dona ou dono do tempo!
    tasks:
      - {"get": "Forestry:hardenedMachine"}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:ingotBronze x8"}

  - id: "fazedor_chuva"
    title: "Fazedor de Chuva"
    type: "normal"
    deps: ["revestimento_endurecido", "engrenagens"]
    desc: |
      Controlar o tempo! O §eFazedor de Chuva§r (engrenagens de estanho, vidro, Revestimento Endurecido)
      não usa energia: você coloca uma §ecarga§r nele e ele muda o clima.

      §e• Cápsula de Iodo:§r chuva
      §e• Cápsula Fosfórica de Iodo:§r tempestade
      §e• Carga de Dissipação:§r céu limpo
      Abelhas que não voam na chuva vão adorar a última.
    tasks:
      - {"get": "Forestry:factory:7"}
    rewards:
      - {"xp": 3}
      - {"item": "minecraft:gunpowder x8"}

  - id: "capsula_iodo"
    title: "Cápsula de Iodo"
    type: "optional"
    deps: ["fazedor_chuva"]
    desc: |
      Lata vazia, gotas de mel, pólvora e Conjuntos de Pólem (das abelhas Industriais) no Carpinteiro formam a §eCápsula de Iodo§r. Coloque no Fazedor de Chuva e... chove.
      É uma missão opcional, Herói, mas uma delícia de poder mágico. Confira a receita no NEI (R) e junte o pólem das abelhas com paciência. Que o clima obedeça a você!
    tasks:
      - {"get": "Forestry:iodineCapsule"}
    rewards:
      - {"loot": "comum"}

  - id: "carga_dissipacao"
    title: "Carga de Dissipação"
    type: "optional"
    deps: ["fazedor_chuva"]
    desc: |
      Lata vazia, melaço, pólvora e Geléia Real no Carpinteiro formam a §eCarga de Dissipação§r, que limpa o céu.
      É uma missão opcional, Herói, mas ótima para quem quer sol depois da chuva. Use no Fazedor de Chuva e veja as nuvens sumirem. Confira a receita no NEI (R) e junte a Geléia Real das abelhas. Céu azul garantido!
    tasks:
      - {"get": "Forestry:craftingMaterial:4"}
    rewards:
      - {"loot": "comum"}

  - id: "capsula_fosforica"
    title: "Tempestade Engarrafada"
    type: "optional"
    deps: ["capsula_iodo"]
    desc: |
      Uma Cápsula de Iodo cercada de §eFósforo§r (das abelhas do Nether) no Carpinteiro vira a §eCápsula Fosfórica de Iodo§r: tempestade com raios. §cCuidado com o que estiver lá fora.§r
      É uma missão opcional, Herói, mas espetacular. Use no Fazedor de Chuva com a base protegida. Confira a receita no NEI (R/U) e junte o fósforo com calma. Prepare-se para o espetáculo!
    tasks:
      - {"get": "Forestry:phosphoricIodineCapsule"}
    rewards:
      - {"loot": "comum"}

  - id: "oficina_forestry"
    title: "A Oficina da Floresta"
    type: "milestone"
    icon: "Forestry:factory:1"
    deps: ["carpinteiro", "hidratador", "fermentador", "refinador", "centrifuga", "fabricador"]
    banner: "A Oficina da Floresta"
    subtitle: "Turfa, óleo e biomassa"
    desc: |
      Olhe para essa oficina, Herói! Prensa, marceneiro, fermentador, destilaria, centrífuga e um forno de vidro, todos movidos a turfa e biomassa. Você reescreveu a página da §bindústria verde§r.

      Daqui o caminho se abre em três trilhas:
      §e• Fazendas Multibloco§r: automação de verdade.
      §e• Arboricultura§r: genética de árvores com o Arvoranalizador.
      §e• Apicultura§r: o capítulo das abelhas espera por você.

      Respire, organize a base e escolha por onde começar. Eu estou radiante! Cada máquina que você montou ajudou a escrever uma nova página, e o futuro verde do Registro está em boas mãos. Parabéns!
    tasks:
      - {"get": ["Forestry:factory:1", "Forestry:factory:5", "Forestry:factory:3", "Forestry:factory:6", "Forestry:factory:2", "Forestry:factory2"]}
    rewards:
      - {"xp": 8}
      - {"kit": {"name": "Kit do Mestre-Marceneiro", "items": ["Forestry:sturdyMachine x2", "Forestry:ingotBronze x16", "Forestry:canEmpty x12", "Forestry:peat x32", "Forestry:fertilizerCompound x16"]}}
      - {"loot": "raro"}

  - id: "info_fazenda"
    title: "A Fazenda Multibloco"
    type: "info"
    icon: "Forestry:ffarm"
    deps: ["valvulas_basicas"]
    desc: |
      A Fazenda é uma estrutura que planta, cuida e colhe sozinha. Regras (conferidas no código):

      §e• Tamanho:§r base de 3×3 até 5×5 blocos e §eexatamente 4 de altura§r (mínimo 36 blocos).
      §e• A 3ª camada§r (de baixo para cima) precisa ser só de §eBlocos da Fazenda comuns§r; o interior
      também.
      §e• É obrigatório§r ter pelo menos uma §eCaixa de Engrenagens§r (recebe o motor ou a energia).
      §e• Hachuras§r tiram/põem itens; §eVálvulas§r recebem água; o §eControle§r aceita redstone.
      §e• Fertilizante§r é obrigatório; quase todas as fazendas precisam de água.

      Na interface: solo à esquerda, sementes/mudas à direita, e um slot para a §ePlaca de Circuito§r —
      cada soquete da placa programa a fazenda para um dos lados ao redor dela.
    tasks:
      - {"check": true}
    rewards:
      - {"xp": 1}

  - id: "bloco_fazenda"
    title: "Bloco da Fazenda"
    type: "main"
    deps: ["info_fazenda"]
    desc: |
      Cobre, uma laje de madeira, uma Válvula de Estanho e um bloco "de base" (tijolos de pedra, tijolo,
      arenito liso, tijolo do Nether...) formam o §eBloco da Fazenda§r — a base escolhida só muda a
      aparência.

      Uma fazenda 3×3×4 tem 36 blocos, e as peças especiais saem de Blocos da Fazenda. Faça §e24§r para
      começar.
    tasks:
      - {"get": "Forestry:ffarm x24"}
    rewards:
      - {"xp": 4}
      - {"choice": ["Forestry:ingotCopper x16", "Forestry:thermionicTubes:1 x6", "minecraft:stonebrick x32"]}

  - id: "caixa_engrenagens"
    title: "Caixa de Engrenagens da Fazenda"
    type: "main"
    deps: ["bloco_fazenda"]
    desc: |
      Um Bloco da Fazenda sobre três engrenagens de estanho formam a §eCaixa de Engrenagens§r. Encoste um motor (ou cabo de RF) nela. Sem ela, a fazenda nem se forma.
      É o coração do sistema, Herói! Confira a receita no NEI (R) e posicione com cuidado, deixando espaço para os outros blocos. Daqui nascem as suas plantações automáticas!
    tasks:
      - {"get": "Forestry:ffarm:2"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:gearTin x2"}

  - id: "hachura"
    title: "Hachura da Fazenda"
    type: "normal"
    deps: ["bloco_fazenda"]
    desc: |
      A §eHachura§r (escotilha) é a melhor amiga dos tubos: ela empurra a colheita para fora e aceita sementes, solo e fertilizante.
      É feita com Bloco da Fazenda, alçapão e engrenagens de estanho, Herói. Confira a receita no NEI (R) e encoste um tubo ou baú nela para automatizar a colheita. Menos trabalho braçal, mais tempo para aventuras!
    tasks:
      - {"get": "Forestry:ffarm:3"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:hopper"}

  - id: "valvula_fazenda"
    title: "Válvula da Fazenda"
    type: "normal"
    deps: ["bloco_fazenda"]
    desc: |
      Quase toda fazenda bebe água, Herói. A §eVálvula§r aceita água por cano ou bomba e é feita com Bloco da Fazenda, vidro e engrenagem de estanho.
      Sem automação, encha o tanque com baldes pela interface. Confira a receita no NEI (R) e posicione de modo que a água chegue fácil. Plantas bem hidratadas são plantas felizes!
    tasks:
      - {"get": "Forestry:ffarm:4"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:water_bucket"}

  - id: "controle_fazenda"
    title: "Controle da Fazenda"
    type: "optional"
    deps: ["bloco_fazenda", "valvulas_metalicas"]
    desc: |
      Redstone e uma Válvula de Ouro sob um Bloco da Fazenda formam o §eControle§r. Com ele, um sinal de redstone liga e desliga a fazenda inteira.
      É uma missão opcional, Herói, mas dá um controle bem confortável sobre as plantações. Confira a receita no NEI (R) e conecte uma alavanca ou um sensor. Hora de comandar à distância!
    tasks:
      - {"get": "Forestry:ffarm:5"}
    rewards:
      - {"loot": "comum"}

  - id: "fertilizante_fazenda"
    title: "Estoque de Fertilizante"
    type: "normal"
    deps: ["fertilizante", "info_fazenda"]
    desc: |
      §cTodas as fazendas precisam de fertilizante para funcionar§r. Adubo ou bagaço não bastam!
      Neste pack cada fertilizante vale bastante (2000 de "carga"), mas a fazenda gasta sem parar. Mostre §e64 Fertilizantes§r e pense numa linha de apatita, Herói. Confira a receita no NEI (R) e organize um estoque saudável. Fazenda sem fertilizante é fazenda parada!
    tasks:
      - {"get": "Forestry:fertilizerCompound x64"}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:apatite x16"}

  - id: "placa_fazenda"
    title: "Programando a Fazenda"
    type: "main"
    icon: "Forestry:chipsets:3"
    deps: ["ferro_solda", "placas_avancadas", "caixa_engrenagens"]
    desc: |
      Agora a mágica! Pegue uma §ePlaca de Circuito Intrincada§r (4 soquetes) e o Ferro de Solda.
      Escolha o diagrama §eFazenda Gerenciada§r e solde §e4 Válvulas de Cobre§r: isso cria quatro
      circuitos de §eArboreto§r — a fazenda planta e corta árvores nos quatro lados.

      Coloque a placa na interface da fazenda, mudas à direita, solo (terra/húmus) à esquerda.
      Mostre a placa intrincada e as válvulas, e marque quando a fazenda estiver programada.
    tasks:
      - {"get": ["Forestry:chipsets:3", "Forestry:thermionicTubes x4"]}
      - {"check": true}
    rewards:
      - {"xp": 4}
      - {"choice": ["minecraft:sapling x32", "Forestry:soil x16", "Forestry:fertilizerCompound x32"]}

  - id: "fazenda_montada"
    title: "A Fazenda que Trabalha Sozinha"
    type: "milestone"
    icon: "Forestry:ffarm"
    deps: ["placa_fazenda", "hachura", "valvula_fazenda", "fertilizante_fazenda"]
    banner: "A Fazenda Desperta"
    subtitle: "Plantar, adubar, colher"
    desc: |
      Herói, olha isso: uma estrutura de 36 blocos plantando, adubando e colhendo enquanto você vai explorar. A página da §bagricultura automática§r está de volta ao Registro! Que marco depois de tanto esforço.

      Prove que o Arboreto funciona: colha §e128 troncos e 32 mudas§r com ele.

      A partir daqui, troque as válvulas para programar outros tipos de fazenda (cereais, turfa, cogumelos, cacau...), e cada uma tem a sua quest neste capítulo. Comemore, respire fundo e vá com tudo para a próxima fazenda!
    tasks:
      - {"get": ["ore:logWood x128", "ore:treeSapling x32"]}
    rewards:
      - {"xp": 8}
      - {"kit": {"name": "Kit do Fazendeiro Automatizado", "items": ["Forestry:fertilizerCompound x64", "Forestry:thermionicTubes:1 x4", "Forestry:thermionicTubes:2 x4", "Forestry:chipsets:1 x2", "Forestry:soil x32"]}}
      - {"loot": "raro"}

  - id: "fazenda_turfa"
    title: "Turfeira Gerenciada"
    type: "normal"
    deps: ["fazenda_montada"]
    desc: |
      A Turfeira transforma terra do pântano em turfa e colhe sozinha. Precisa de água por perto (a fazenda espalha). Mostre 64 turfas, Herói.

      Circuito: §eFazenda Gerenciada§r + §eVálvula de Estanho§r. As fazendas gerenciadas montam o terreno sozinhas, usando o solo que você colocar no inventário. Confira os detalhes no NEI (R/U) e boa colheita!
    tasks:
