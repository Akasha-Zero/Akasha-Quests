    deps: ["mochila_minerador"]
    desc: |
      Mesma receita da Bolsa do Minerador, trocando o ferro por §eargila§r. Ela recolhe §eblocos de construção§r.
    tasks:
      - {"get": "Forestry:builderBag"}
    rewards:
      - {"loot": "comum"}

  - id: "mochila_t2"
    title: "Mochilas Tecidas"
    type: "optional"
    icon: "Forestry:minerBagT2"
    deps: ["mochila_minerador", "carpinteiro"]
    desc: |
      Qualquer mochila vira a versão §eTecida§r (o dobro de espaço) no Carpinteiro: 7 Tecidos de Seda +
      1 diamante + a mochila + 1000 mB de água. O Tecido de Seda vem das abelhas tropicais (capítulo de
      Apicultura). Mostre qualquer mochila tecida.
    tasks:
      - {"one_of": ["Forestry:minerBagT2", "Forestry:diggerBagT2", "Forestry:foresterBagT2", "Forestry:hunterBagT2", "Forestry:adventurerBagT2", "Forestry:builderBagT2"]}
    rewards:
      - {"loot": "incomum"}

  - id: "carta"
    title: "Cartas"
    type: "normal"
    deps: ["polpa_madeira"]
    desc: |
      O Forestry tem um §ecorreio§r entre jogadores — num servidor como o da Akashic, isso é ouro!

      Uma §eCarta§r sai de papel + própolis (sem forma) ou, no Carpinteiro, de 6 Polpas de Árvore +
      250 mB de água. Escreva o destinatário e anexe itens.
    tasks:
      - {"get": "Forestry:letters"}
    rewards:
      - {"xp": 2}
      - {"item": "minecraft:paper x8"}

  - id: "selos"
    title: "Selos"
    type: "normal"
    icon: "Forestry:stamps"
    deps: ["carta"]
    desc: |
      Carta sem selo não viaja. O envio custa §e1n de base + 1n por anexo§r. Selos: 3 do material + 3
      papéis + 3 Gotas de Mel = 9 selos (1n apatita, 2n cobre, 5n estanho, 10n ouro). Os selos de 20n,
      50n e 100n estão desativados para fabricação neste pack. Mostre §e9 selos§r quaisquer.
    tasks:
      - {"get": "Forestry:stamps:* x9"}
    rewards:
      - {"xp": 2}
      - {"item": "Forestry:apatite x6"}

  - id: "caixa_correio"
    title: "Caixa de Correio"
    type: "normal"
    deps: ["selos", "carcaca_resistente"]
    desc: |
      Estanho, a Carcaça Resistente e três baús: a §eCaixa de Correio§r. Coloque a carta selada dentro
      para enviar; as cartas que chegam para você aparecem nela. Agora dá para mandar presentes para
      os amigos do servidor sem sair de casa!
    tasks:
      - {"get": "Forestry:mail"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:stamps:1 x9"}

  - id: "catalogo"
    title: "Catálogo"
    type: "optional"
    deps: ["caixa_correio"]
    desc: |
      Um selo + um livro = §eCatálogo§r: a lista dos Postos de Troca que existem no mundo e o que cada
      um oferece.
    tasks:
      - {"get": "Forestry:catalogue"}
    rewards:
      - {"loot": "comum"}

  - id: "posto_troca"
    title: "Posto de Troca"
    type: "normal"
    deps: ["caixa_correio", "placas_avancadas", "valvulas_metalicas"]
    desc: |
      O §ePosto de Troca§r é uma lojinha automática: você define o que vende e o que quer em troca, e
      outros jogadores compram mandando cartas para o endereço dele. Válvulas de bronze e ferro, uma
      Placa Refinada, a Carcaça Resistente e baús.
    tasks:
      - {"get": "Forestry:mail:1"}
    rewards:
      - {"xp": 3}
      - {"item": "Forestry:stamps:2 x9"}

  - id: "trigo_mofado"
    title: "Trigo Mofado"
    type: "optional"
    deps: ["humidificador"]
    desc: |
      O "combustível" do Humidificador apodrece em etapas: §eTrigo → Trigo Mofado → Trigo em
      Decomposição§r. Cada etapa continua alimentando a máquina. Mostre um Trigo em Decomposição — prova
      de que o seu porão está bem escuro!
    tasks:
      - {"get": "Forestry:decayingWheat"}
    rewards:
      - {"loot": "comum"}

  - id: "cartao"
    title: "Cartão"
    type: "optional"
    deps: ["polpa_madeira"]
    desc: |
      Quatro Polpas de Árvore em losango + 1000 mB de água no Carpinteiro rendem §e2 Cartões§r — a
      embalagem dos Kits de Ferramenta.
    tasks:
      - {"get": "Forestry:carton x2"}
    rewards:
      - {"loot": "comum"}

  - id: "notas_sengir"
    title: "Notas do Sengir"
    type: "optional"
    deps: ["escrivaninha"]
    desc: |
      Acertou a pesquisa na Escrivaninha? Ela pode recompensar com §eNotas do Sengir§r, anotações que
      revelam uma mutação. Ler é a melhor forma de não cruzar no escuro.
    tasks:
      - {"get": "Forestry:researchNote"}
    rewards:
      - {"loot": "incomum"}

  - id: "refinaria_oleo"
    title: "Refinaria de Óleo"
    type: "optional"
    icon: "Forestry:canSeedOil"
    deps: ["nogueira", "oleo_vegetal"]
    desc: |
      Com Nogueiras e Castanheiras no Pomar, o Hidratador vira um poço de petróleo verde. Encha §e4000 mB
      de Óleo Vegetal§r (4 baldes ou latas).
    tasks:
      - {"fluid": "seedoil x4000"}
    rewards:
      - {"loot": "incomum"}

  - id: "estoque_etanol"
    title: "Estoque de Etanol"
    type: "optional"
    icon: "Forestry:canEthanol"
    deps: ["etanol"]
    desc: |
      Uma base que roda a etanol precisa de reserva. Mostre §e8000 mB de Etanol§r em latas ou baldes.
    tasks:
      - {"fluid": "bioethanol x8000"}
    rewards:
      - {"loot": "incomum"}

  - id: "gelo_picado"
    title: "Gelo Picado"
    type: "optional"
    icon: "Forestry:bucketIce"
    deps: ["hidratador"]
    desc: |
      Uma bola de neve + 4 Cacos de Gelo (das abelhas Geladas) no Hidratador rendem §e4000 mB de Gelo
      Picado§r — um refrigerante que vários mods aceitam.
    tasks:
      - {"fluid": "ice x1000"}
    rewards:
      - {"loot": "comum"}

  - id: "lava_fosforo"
    title: "Lava de Fósforo"
    type: "optional"
    icon: "minecraft:lava_bucket"
    deps: ["hidratador"]
    desc: |
      Fósforo (das abelhas do Nether) com areia, pedregulho ou terra no Hidratador vira §elava§r
      (1600–2000 mB, conforme o bloco). Lava renovável, sem ir ao Nether toda hora.
    tasks:
      - {"fluid": "lava x1000"}
    rewards:
      - {"loot": "comum"}

  - id: "suco_tropical"
    title: "Suco Tropical"
    type: "optional"
    icon: "Forestry:canJuice"
    deps: ["mamoeiro", "suco"]
    desc: |
      Mamões rendem bastante suco. Junte §e4000 mB de Suco§r: com ele o Fermentador rende mais biomassa
      do que com água.
    tasks:
      - {"fluid": "juice x4000"}
    rewards:
      - {"loot": "comum"}

  - id: "mestre_florestal"
    title: "Guardião das Florestas"
    type: "milestone"
    icon: "Forestry:factory:7"
    deps: ["oficina_forestry", "fazenda_montada", "arborista_mestre", "fazedor_chuva", "posto_troca"]
    banner: "Guardião das Florestas"
    subtitle: "O Volume das Florestas está completo"
    effect: 3
    desc: |
      Herói... olhe pela janela. Turfais escurecendo à beira d'água, uma fazenda que se planta sozinha,
      árvores que os Antigos só conheciam nos livros, o céu obedecendo ao Fazedor de Chuva e cartas
      indo e vindo pelo correio. O §eVolume das Florestas§r está reescrito!

      Este é um dos pilares do §6Selo da Vida§r. O outro pilar zumbe: se ainda não começou, o capítulo
      de §eApicultura§r é o próximo passo natural — as abelhas polinizam as suas árvores e alimentam o
      seu Arvoranalizador com mel.

      Eu fiquei tão orgulhosa que nasceu uma folha nova no Registro. Sério!
    tasks:
      - {"get": ["Forestry:factory:7", "Forestry:mail:1", "Forestry:treealyzer"]}
    rewards:
      - {"xp": 12}
      - {"kit": {"name": "Kit do Guardião das Florestas", "items": ["Forestry:hardenedMachine", "Forestry:chipsets:3 x2", "Forestry:thermionicTubes:5 x4", "Forestry:fertilizerCompound x64", "Forestry:impregnatedCasing x2"]}}
      - {"loot": "epico"}
