    desc: |
      Empilhe §ePortas de Garagem do Carpinteiro§r e elas abrem e fecham juntas, enrolando
      como uma porta de garagem de verdade. Aceitam capa, claro.

      Faça §e8 portas de garagem§r.
    tasks:
      - get: CarpentersBlocks:blockCarpentersGarageDoor x8
    rewards:
      - loot: comum

  # ======================================================================
  # LITTLETILES
  # ======================================================================
  - id: martelo_pequeno
    title: "O Mundo em Miniatura"
    type: main
    deps: [volume_beleza]
    icon: littletiles:hammer
    desc: |
      E se um bloco pudesse ser dividido em pedacinhos? O §eLittleTiles§r faz exatamente
      isso: cada bloco vira uma grade de peças minúsculas que você posiciona livremente.

      O §eMartelinho§r (Little Hammer: ferro e lápis-lazúli) é a primeira ferramenta para
      trabalhar com peças pequenas, nas formas do mod (caixa, rampa, parede, pilar...). A
      tecla de configuração de ferramenta (Controles → Little Tiles) escolhe forma e
      tamanho; segure Shift sobre o item para ver as instruções. Fabrique um.
    tasks:
      - get: littletiles:hammer
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x6, minecraft:dye:4 x8, minecraft:stone x32]

  - id: ferramentas_pequenas
    title: "Serra e Chave Pequenas"
    type: normal
    deps: [martelo_pequeno]
    icon: littletiles:saw
    desc: |
      A §eSerrinha§r (Little Saw) aumenta ou diminui uma peça já colocada; a §eChavinha§r
      (Little Wrench) ajusta peças e estruturas (veja a dica de cada item). Juntas, elas
      permitem detalhes que nenhum outro mod alcança.

      Fabrique §euma serra e uma chave§r.
    tasks:
      - get: [littletiles:saw, littletiles:wrench]
    rewards:
      - item: minecraft:iron_ingot x2
      - xp: 2

  - id: recipiente_pequeno
    title: "Caixinha de Peças"
    type: normal
    deps: [martelo_pequeno]
    icon: littletiles:container
    desc: |
      O §eRecipiente Pequeno§r (Little Container) guarda as peças miúdas que sobram quando
      você corta blocos — elas não somem! Ferro em volta de um martelinho.

      Fabrique um.
    tasks:
      - get: littletiles:container
    rewards:
      - item: minecraft:iron_ingot x4
      - xp: 1

  - id: tubo_cor
    title: "Tubo de Cor e Martelo de Borracha"
    type: optional
    deps: [martelo_pequeno]
    icon: littletiles:colorTube
    desc: |
      O §eTubo de Cor§r (corantes e ferro) §epinta§r peças pequenas de qualquer cor; o
      §eMartelo de Borracha§r (lã e lápis) empurra peças de leve. Para os perfeccionistas.

      Fabrique §eos dois§r.
    tasks:
      - get: [littletiles:colorTube, littletiles:rubberMallet]
    rewards:
      - loot: comum

  - id: miniatura_info
    title: "Dicas de Miniaturista"
    type: info
    deps: [martelo_pequeno]
    icon: littletiles:hammer
    desc: |
      Algumas dicas para trabalhar com o LittleTiles:

      §e• Modos de colocação:§r Normal (só onde há espaço), Preencher, Sobrescrever e
      Estêncil (remove onde sobrepõe) — troque na configuração da ferramenta.
      §e• Teclas:§r há atalhos para girar e espelhar a peça antes de colocar.
      §e• Peças guardam o material:§r use qualquer bloco (pedra, madeira, vidro...).
      Comece pequeno: um móvel, um vaso, uma moldura. Depois, o céu é o limite.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: mestre_marceneiro
    title: "Carpintaria Fina"
    type: milestone
    deps: [rampas, escadas_carpinteiro, porta_cama_carpinteiro, cinzel_carpinteiro, ferramentas_pequenas, recipiente_pequeno]
    icon: CarpentersBlocks:itemCarpentersHammer
    banner: "Carpintaria Fina!"
    subtitle: "Rampas, telhados e detalhes em miniatura"
    desc: |
      Rampas que se encaixam, escadas de qualquer material, portas e camas sob medida e
      peças tão pequenas que cabem na palma da mão. Você domina a carpintaria fina, Herói!

      O Bloco do Carpinteiro e o LittleTiles são as ferramentas preferidas dos grandes
      construtores: com eles, qualquer formato vira possível. Telhado curvo? Mesa com
      toalha? Um mini-Registro em cima da estante? Tudo ao seu alcance.

      Toma, mais madeira para a oficina.
    tasks:
      - check
    rewards:
      - kit:
          name: "Kit do Marceneiro"
          items: ["CarpentersBlocks:blockCarpentersBlock x32", "minecraft:planks x64", "minecraft:dye:1 x4", "minecraft:dye:4 x4"]
      - loot: incomum
      - xp: 5

  # ======================================================================
  # BIBLIOCRAFT
  # ======================================================================
  - id: estante_biblio
