    icon: BiblioCraft:BiblioFancySign
    desc: |
      Etiqueta, placa e papel: §ePlaca Sofisticada§r. Mais texto, tamanhos de letra
      diferentes e até itens desenhados nela. Para lojas, portas e avisos caprichados.

      Faça §euma§r.
