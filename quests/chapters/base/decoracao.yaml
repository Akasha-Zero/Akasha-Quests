    desc: |
      Para os detalhistas: §eTocha§r, §eVaso§r, §eEscada de Mão§r, §eBarreira§r (cerca/muro)
      e §eLadrilho§r do carpinteiro — este último é uma placa fina para pisos e paredes.

      Fabrique §euma tocha, um vaso e ladrilhos§r do carpinteiro.
    tasks:
