    title: "Lâmpadas Planas"
    type: normal
    deps: [ofanix]
    icon: Ztones:lampf
    desc: |
      Ferro, vidro e pó de pedra luminosa fazem 16 §eLâmpadas Planas§r (Flat Lamp): placas
