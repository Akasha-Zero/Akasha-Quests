    type: optional
    deps: [quadro_desaparecer]
    icon: malisisdoors:block_mixer
    desc: |
      Ferro e pistões: §eMisturador de Blocos§r. Coloque dois blocos e ele cria um §eBloco
      Misto§r com metade de cada um, em diagonal. Transições suaves entre materiais!

      Fabrique um.
    tasks:
