      Saloon§r balança para os dois lados, como nos filmes de faroeste.

      Fabrique §euma de cada§r.
    tasks:
      - get: [malisisdoors:item.shoji_door, malisisdoors:item.saloon]
    rewards:
      - loot: comum

  - id: cortinas
