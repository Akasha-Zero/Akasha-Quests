      Fabrique um, Herói. Bibliotecária aprova! Receita no NEI (R/U).
    tasks:
      - get: BiblioCraft:item.StockroomCatalog
    rewards:
      - loot: comum

  - id: miudezas_biblio
    title: "Miudezas Charmosas"
