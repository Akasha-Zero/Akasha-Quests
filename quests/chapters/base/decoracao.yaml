      Sofisticada§r. Ela §eguarda os itens§r da grade e tem espaço para livros de receitas.

      Fabrique uma.
    tasks:
      - get: BiblioCraft:BiblioWorkbench:*
    rewards:
      - loot: comum

  - id: livros_especiais
    title: "Livros Curiosos"
    type: optional
    deps: [estante_biblio]
    icon: BiblioCraft:item.BigBook
    desc: |
      O §eLivro Grande§r (Big Book) tem páginas enormes para textos longos, e o §eLivro com
