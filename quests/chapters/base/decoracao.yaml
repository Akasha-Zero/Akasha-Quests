      - get: Ztones:stoneTile:* x32
    rewards:
      - xp: 3
      - choice: [minecraft:stone_slab x16, minecraft:dye:4 x8, minecraft:stone x32]

  - id: familias_ztones
    title: "Famílias do Ztones"
    type: normal
    deps: [ladrilho_ztones]
    icon: Ztones:tile.zaneBlock
    desc: |
      Cada família do Ztones tem nome curioso (Agon, Azur, Bitt, Cray, Fort, Glaxx, Iszm,
