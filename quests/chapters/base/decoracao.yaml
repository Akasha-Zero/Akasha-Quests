      Fabrique §eos dois§r.
    tasks:
      - get: [BiblioCraft:item.BigBook, BiblioCraft:item.SlottedBook]
    rewards:
      - loot: comum

  # ======================================================================
  # ZTONES
  # ======================================================================
  - id: ofanix
    title: "O Ofanix"
    type: main
    deps: [volume_beleza]
    icon: Ztones:ofanix
    desc: |
      Uma pérola do fim, ferro, baldes de água e de lava e uma bancada: §eOfanix§r, a
      ferramenta do §eZtones§r. Na bancada, um bloco do Ztones + o Ofanix gira entre as
