    title: "Máquina de Escrever"
    type: optional
    deps: [escrivaninha]
    icon: BiblioCraft:BiblioTypewriter
    desc: |
      Ferro, blocos de ferro, papel e argila tingida: §eMáquina de Escrever§r. Ela digita
      livros com texto mais organizado — e faz um barulhinho adorável.

      Fabrique uma.
    tasks:
      - get: BiblioCraft:BiblioTypewriter:*
    rewards:
      - loot: comum

