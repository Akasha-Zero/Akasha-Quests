    type: optional
    deps: [ferro_forjado]
    icon: GardenStuff:candelabra
    desc: |
      Linha e §ecera§r fazem §eVelas§r; a cera vem da §eCandelila§r (arbusto de biomas quentes e
      arenosos — funda as folhas) e outras ceras do oredict também servem. Velas e ferro
      forjado fazem §eCandelabros§r de 1, 2 ou 3 braços.

      Faça §eum candelabro§r.
    tasks:
      - get: GardenStuff:candelabra:*
    rewards:
      - loot: comum

  - id: postes_madeira
    title: "Postes de Madeira"
    type: normal
    deps: [composteira_jardim]
    icon: GardenTrees:thin_log
    desc: |
      Um machado de madeira + um tronco na bancada: 4 §ePostes de Madeira§r (troncos finos).
      Com linha, viram §eCercas de Poste§r — cercas rústicas para hortas e currais. Funciona
      com troncos vanilla e de vários mods.

      Faça §e8 postes§r e §e3 cercas de poste§r.
    tasks:
      - get: [GardenTrees:thin_log:* x8, GardenTrees:thin_log_fence:* x3]
    rewards:
      - item: minecraft:log x8
      - xp: 1

  - id: mudas_jardim
    title: "Mudas de Jardineiro"
    type: optional
    deps: [composto]
    icon: GardenTrees:sapling
    desc: |
      Uma muda comum + composto vira uma muda especial do Garden Trees: §ePinheiro§r (de
      pinheiro), §ePântano§r (de carvalho, com trepadeira) ou §eBétula Alta§r. Plante para
      árvores de formato diferente. A §eHera do Diabo§r (trepadeira + composto) dá um toque
      selvagem.

      Faça §euma muda especial e uma hera§r.
    tasks:
      - get: [GardenTrees:sapling:*, GardenTrees:ivy]
    rewards:
      - loot: comum

  - id: pasta_musgo
    title: "Pasta de Musgo"
    type: optional
    deps: [composteira_jardim]
    icon: GardenStuff:moss_paste
    desc: |
      Trepadeiras e argila: §ePasta de Musgo§r, usada para dar aparência envelhecida e
      musgosa a pedras e tijolos (confira os usos com U no NEI). Jardins antigos têm musgo
      em tudo!

      Faça §euma pasta de musgo§r.
    tasks:
      - get: GardenStuff:moss_paste
    rewards:
      - loot: comum

  # ======================================================================
  # ARMOURER'S WORKSHOP
  # ======================================================================
  - id: cubo_equipamento
    title: "Cubos de Equipamento"
    type: main
    deps: [volume_beleza]
    icon: armourersWorkshop:block.colourable
    desc: |
      O §eArmourer's Workshop§r deixa você usar §evisuais personalizados§r (skins) em armas,
      ferramentas e armaduras — sem mudar os atributos. Tudo começa com o §eCubo de
      Equipamento§r (lã e ferro: 16 cubos), que é ingrediente de quase todas as peças do mod.

      Faça §e16 cubos§r.
    tasks:
      - get: armourersWorkshop:block.colourable x16
    rewards:
      - xp: 3
      - choice: [minecraft:wool x16, minecraft:iron_ingot x6, minecraft:dye:1 x8]

  - id: livro_guia_aw
    title: "O Livro-Guia do Armeiro"
    type: normal
    deps: [cubo_equipamento]
    icon: armourersWorkshop:guideBook
    desc: |
      Um livro e um cubo: §eLivro-Guia§r do Armourer's Workshop. Ele explica tudo com
      calma (e cabe no Tomo Akáshico!).

      Fabrique o guia. Eu recomendo de verdade: este mod tem muitos detalhes.
    tasks:
      - get: armourersWorkshop:guideBook
    rewards:
      - item: minecraft:book x2
      - xp: 1

  - id: modelo_visual
    title: "Modelo de Visual"
    type: normal
    deps: [cubo_equipamento]
    icon: armourersWorkshop:equipmentSkinTemplate
    desc: |
      Quatro cubos fazem 8 §eModelos de Visual de Equipamento§r (Equipment Skin Template): o
      "papel em branco" onde um visual é salvo ou copiado.

      Faça §e8 modelos§r.
    tasks:
      - get: armourersWorkshop:equipmentSkinTemplate x8
    rewards:
      - item: armourersWorkshop:block.colourable x4
      - xp: 1

  - id: mesa_visuais
    title: "Mesa de Aplicação de Visuais"
    type: main
    deps: [modelo_visual]
    icon: armourersWorkshop:block.skinningTable
    desc: |
      Pedra, lã vermelha, cubo e modelos: §eMesa de Aplicação de Visuais§r (Skinning Table).
      Coloque um item (espada, picareta, peça de armadura) e um §eVisual§r: o item passa a
      ter aquela aparência. Dá para remover depois com §eSabão§r.

      Fabrique a mesa.
    tasks:
      - get: armourersWorkshop:block.skinningTable
    rewards:
      - xp: 3
      - choice: [armourersWorkshop:equipmentSkinTemplate x4, minecraft:wool:14 x8, minecraft:iron_ingot x4]

  - id: biblioteca_visuais
    title: "Biblioteca de Equipamentos"
    type: normal
    deps: [cubo_equipamento]
    icon: armourersWorkshop:block.armourLibrary
    desc: |
      Pedra, lã vermelha, livros e um cubo: §eBiblioteca de Equipamentos§r. Ela salva e
      carrega visuais em modelos — é onde você guarda e compartilha criações. A §eBiblioteca
      Global de Visuais§r (com pérola do fim) acessa visuais publicados por outros
      jogadores.

      Fabrique §euma biblioteca de equipamentos§r.
    tasks:
      - get: armourersWorkshop:block.armourLibrary
    rewards:
      - item: minecraft:book x4
      - xp: 2

  - id: ferramentas_pintura
    title: "Pincel e Rolo"
    type: normal
    deps: [cubo_equipamento]
    icon: armourersWorkshop:paintbrush
    desc: |
      O §ePincel§r pinta um cubo de cada vez; o §eRolo de Pintura§r pinta áreas. O
      §eSelecionador de Cores§r copia uma cor de qualquer bloco. São as ferramentas de quem
      esculpe visuais (cubos coloridos formam o modelo).

      Fabrique §eo pincel e o rolo§r.
    tasks:
      - get: [armourersWorkshop:paintbrush, armourersWorkshop:paintRoller]
    rewards:
      - item: minecraft:dye:4 x4
      - xp: 1

  - id: ferramentas_tom
    title: "Tons e Sombras"
    type: optional
    deps: [ferramentas_pintura]
    icon: armourersWorkshop:hueTool
    desc: |
      Para artistas: §eFerramenta de Escurecimento§r, §ede Clareamento§r, §ede Matiz§r, §ede
      Tons de Cor§r, §ede Tons de Sombra§r e §ede Mesclagem§r — cada uma ajusta as cores dos
      cubos de um jeito. E o §eSelecionador de Cores§r para copiar tons.

      Fabrique §eo selecionador de cores e a ferramenta de matiz§r.
    tasks:
      - get: [armourersWorkshop:colourPicker, armourersWorkshop:hueTool]
    rewards:
      - loot: comum

  - id: manequim
    title: "O Manequim"
    type: normal
    deps: [cubo_equipamento]
    icon: armourersWorkshop:block.mannequin
    desc: |
      Abóbora, tábuas e um cubo: §eManequim§r. Ele veste armaduras e visuais, pode ter a
      skin de um jogador (é só dar um nome) e assume poses com a §eFerramenta de Manequim§r.

      Fabrique um manequim. Vitrine de loja com classe!
    tasks:
      - get: armourersWorkshop:block.mannequin
    rewards:
      - item: minecraft:pumpkin
      - xp: 2

  - id: holograma
    title: "Projetor de Holograma"
    type: optional
    deps: [cubo_equipamento]
    icon: armourersWorkshop:block.hologramProjector
    desc: |
      Ferro, vidro azul-claro e um cubo: §eProjetor de Holograma§r. Ele projeta um visual do
      Armourer's Workshop no ar, girando — ótimo como estátua ou letreiro.

      Fabrique um.
    tasks:
      - get: armourersWorkshop:block.hologramProjector
    rewards:
      - loot: comum

  - id: guarda_roupa
    title: "O Guarda-Roupa"
    type: info
    deps: [mesa_visuais]
    icon: armourersWorkshop:skinUnlock
    desc: |
      Além de aplicar visuais em itens, você tem um §eGuarda-Roupa de Equipamentos§r: slots
      próprios para usar visuais por cima da armadura (comece com 3 slots). Os §eDesbloqueios
      de Visual§r (peça de diamante + modelo + Estrela do Nether) liberam slots extras.

      §7Obs.: o bloco §eArmeiro§r (onde se esculpem visuais do zero) não tem receita neste
      pack. Use as bibliotecas para obter visuais prontos.§r
    tasks:
      - check
    rewards:
      - xp: 1

  - id: sabao
    title: "Sabão"
    type: optional
    deps: [mesa_visuais]
    icon: armourersWorkshop:soap
    desc: |
      Um balde de água, carne podre e slime (eca!) fazem §eSabão§r. Na bancada, item com
      visual + sabão = item limpo, com a aparência original de volta.

      Fabrique um sabão.
    tasks:
      - get: armourersWorkshop:soap
    rewards:
      - loot: comum

  # ======================================================================
  # DESAFIOS DE CONSTRUÇÃO
  # ======================================================================
  - id: desafios_info
    title: "Desafios de Construção"
    type: info
    deps: [volume_beleza]
    icon: minecraft:brick_block
    desc: |
      Nas próximas páginas eu proponho §edesafios de construção§r. Cada um pede um conjunto
      de peças (que eu consigo conferir no seu inventário) para você usar numa obra.

      Não precisa construir exatamente do jeito que eu imagino — use as peças, invente,
      misture mods. Quando terminar, tire um print e mostre no servidor! (Eu vou ficar
      espiando pelo canto da página.)
    tasks:
      - check
    rewards:
      - xp: 1

  - id: desafio_biblioteca
    title: "Desafio: A Biblioteca"
    type: milestone
    deps: [desafios_info, escrivaninha, mesa_assento, iluminacao_biblio, etiqueta_biblio]
    icon: BiblioCraft:BiblioDesk
    banner: "A Biblioteca!"
    subtitle: "Um pedaço do Registro em casa"
    desc: |
      O meu desafio favorito, claro. Construa uma §ebiblioteca§r: estantes cheias, uma
      escrivaninha com livro aberto, cadeiras, luz quente e etiquetas organizando tudo.

      Junte as peças: §e8 estantes§r, §euma escrivaninha§r, §e2 assentos§r, §e2 lamparinas
      ou lampiões§r e §e4 etiquetas§r. Encha as estantes com seus manuais!

      Quando eu vejo uma biblioteca assim... é como se o Registro estivesse um pouquinho
      menos partido. Obrigada, Herói. ♥
    tasks:
      - get: [BiblioCraft:Bibliotheca:* x8, BiblioCraft:BiblioDesk:*, BiblioCraft:BiblioSeats:* x2, BiblioCraft:BiblioLabel:* x4]
      - one_of: [BiblioCraft:BiblioLamp:* x2, BiblioCraft:BiblioIronLamp:* x2, BiblioCraft:BiblioLantern:* x2, BiblioCraft:BiblioIronLantern:* x2]
    rewards:
      - kit:
          name: "Kit da Bibliotecária"
          items: ["minecraft:book x16", "minecraft:feather x8", "minecraft:dye x8", "minecraft:bookshelf x4"]
      - loot: incomum
      - xp: 5

  - id: desafio_jardim
    title: "Desafio: O Jardim Secreto"
    type: milestone
    deps: [desafios_info, vasos_grandes, floreira_janela, trelica, lanterna_jardim, postes_madeira]
    icon: GardenContainers:large_pot
    banner: "O Jardim Secreto!"
    subtitle: "Flores, ferro forjado e trepadeiras"
    desc: |
      Construa um §ejardim§r cercado: vasos grandes com mudas, floreiras nas janelas,
      treliças cobertas de trepadeiras, lanternas de jardim e uma cerca de postes ou de
      ferro forjado.

      Peças: §e6 vasos grandes§r, §e4 floreiras§r, §e8 treliças§r, §e2 lanternas de jardim§r e
      §e8 cercas de poste§r (ou de ferro forjado).

      Toda biblioteca antiga tinha um jardim do lado. Os Antigos liam ao ar livre, sabia?
    tasks:
      - one_of: [GardenContainers:large_pot x6, GardenContainers:large_pot_colored:* x6]
      - one_of: [GardenContainers:wood_window_box:* x4, GardenContainers:stone_window_box:* x4]
      - one_of: [GardenStuff:lattice_wood:* x8, GardenStuff:lattice:* x8]
      - get: GardenStuff:lantern:* x2
      - one_of: [GardenTrees:thin_log_fence:* x8, GardenStuff:fence:* x8]
    rewards:
      - kit:
          name: "Kit do Jardineiro"
          items: ["minecraft:sapling:* x8", "minecraft:red_flower x8", "minecraft:yellow_flower x8", "minecraft:vine x16", "GardenCore:compost_pile x8"]
      - loot: incomum
      - xp: 5

  - id: desafio_palacio
    title: "Desafio: O Palácio de Mármore"
    type: milestone
    deps: [desafios_info, marmore_variado, pilar_marmore, vidro_chisel]
    icon: chisel:marble_pillar
    banner: "O Palácio de Mármore!"
    subtitle: "Colunas, vitrais e escadarias"
    desc: |
      Agora algo grandioso: um §epalácio de mármore§r. Colunatas na entrada, piso de mármore
      trabalhado, vitrais nas janelas e telhado de rampas do carpinteiro cobertas de mármore.

      Peças: §e128 mármores§r (qualquer variação), §e24 pilares§r, §e16 vitrais§r do Chisel e
      §e16 rampas do carpinteiro§r.

      É muito mármore, eu sei. Mas palácio de verdade dá trabalho!
    tasks:
      - get: [chisel:marble:* x128, chisel:marble_pillar:* x24, chisel:glass:* x16, CarpentersBlocks:blockCarpentersSlope x16]
    rewards:
      - kit:
          name: "Kit do Arquiteto Clássico"
          items: ["chisel:marble x64", "chisel:marble_pillar x16", "minecraft:glass x32", "minecraft:gold_ingot x4"]
      - loot: incomum
      - xp: 5

  - id: desafio_fabrica
    title: "Desafio: A Fábrica"
    type: milestone
    deps: [desafios_info, bloco_tecnico, refletor_eletrico, portas_especiais]
    icon: chisel:factoryblock
    banner: "A Fábrica!"
    subtitle: "Aço, faixas de perigo e refletores"
    desc: |
      Para quem vai montar máquinas: uma §efábrica com cara de fábrica§r. Paredes de blocos
      de fábrica, painéis técnicos, refletores iluminando o galpão, uma porta de fábrica e
      uma porta de garagem para os veículos.

      Peças: §e64 blocos de fábrica§r, §e32 blocos técnicos§r, §e2 refletores elétricos§r,
      §euma porta de fábrica§r e §e4 portas de garagem§r (Malisis ou do carpinteiro).

      Depois é só encher de máquinas dos Volumes de Tecnologia!
    tasks:
      - get: [chisel:factoryblock:* x64, chisel:technical:* x32, FloodLights:electricFloodlight x2, malisisdoors:item.factory_door]
      - one_of: [malisisdoors:garage_door x4, CarpentersBlocks:blockCarpentersGarageDoor x4]
    rewards:
      - kit:
          name: "Kit do Engenheiro-Arquiteto"
          items: ["minecraft:iron_ingot x16", "minecraft:redstone x16", "chisel:factoryblock x32", "minecraft:glass x16"]
      - loot: incomum
      - xp: 5

  - id: desafio_casa_japonesa
    title: "Desafio: A Casa de Chá"
    type: milestone
    deps: [desafios_info, papel_parede, shoji_saloon, rampas]
    icon: malisisdoors:item.shoji_door
    banner: "A Casa de Chá!"
    subtitle: "Papel, madeira e silêncio"
    desc: |
      Um desafio mais calmo: uma §ecasa de chá§r em estilo japonês. Paredes de papel,
      portas shoji deslizando, telhado curvo de rampas, lanternas e, se quiser, cerejeiras do
      Et Futurum em volta.

      Peças: §e16 papéis de parede§r, §e2 portas shoji§r, §e16 rampas do carpinteiro§r e §e2
      lanternas§r (do Et Futurum, do Chisel ou da BiblioCraft).

      Prepare um chá (de verdade, aí do seu lado) e aprecie a vista. Você merece uma pausa.
    tasks:
      - get: [chisel:paperwall:* x16, malisisdoors:item.shoji_door x2, CarpentersBlocks:blockCarpentersSlope x16]
      - one_of: [etfuturum:lantern x2, chisel:lantern:* x2, BiblioCraft:BiblioLantern:* x2, BiblioCraft:BiblioIronLantern:* x2]
    rewards:
      - kit:
          name: "Kit da Casa de Chá"
          items: ["minecraft:paper x32", "minecraft:planks:1 x32", "etfuturum:cherry_log x8", "minecraft:red_flower x4"]
      - loot: incomum
      - xp: 5

  - id: desafio_galeria
    title: "Desafio: A Galeria de Troféus"
    type: milestone
    deps: [desafios_info, estojo, porta_ferramentas, suporte_armadura_biblio, manequim]
    icon: BiblioCraft:BiblioCase
    banner: "A Galeria de Troféus!"
    subtitle: "Cada conquista em exposição"
    desc: |
      Você já conquistou tanta coisa... que tal uma §egaleria§r para exibir? Estojos com
      drops raros, porta-ferramentas com suas picaretas aposentadas, suportes de armadura
      com cada conjunto e um manequim vestindo seu melhor visual.

      Peças: §e4 estojos§r, §e2 porta-ferramentas§r, §e2 suportes de armadura§r (BiblioCraft) e
      §eum manequim§r.

      Eu vou ser a guia do museu. "À esquerda, a primeira picareta de diamante do Herói..."
    tasks:
      - get: [BiblioCraft:BiblioCase:* x4, BiblioCraft:BiblioRack:* x2, {id: "BiblioCraft:Armor Stand", count: 2}, armourersWorkshop:block.mannequin]
    rewards:
      - kit:
          name: "Kit do Curador"
          items: ["minecraft:glass x16", "minecraft:wool:14 x8", "minecraft:gold_ingot x4", "minecraft:item_frame x4"]
      - loot: incomum
      - xp: 5

  - id: arquiteto_registro
    title: "A Beleza do Registro"
    type: milestone
    deps: [mestre_cinzel, mestre_marceneiro, desafio_biblioteca, desafio_jardim, desafio_palacio, desafio_fabrica]
    icon: chisel:netherStarChisel
    size: 48
    banner: "A Beleza do Registro!"
    subtitle: "A beleza também foi reescrita"
    desc: |
      Herói... olha o que você construiu. Uma biblioteca, um jardim secreto, um palácio de
      mármore, uma fábrica — e as ferramentas de cinzel e de carpintaria dominadas.

      Quando o Registro se partiu, as páginas de beleza foram as primeiras a se perder: em
      tempos difíceis, ninguém pensa em jardins. Mas foi exatamente você quem lembrou que
      um mundo que vale a pena salvar precisa de lugares bonitos para morar.

      Obrigada por isso. De todo o coração de papel que eu tenho. ♥
    tasks:
      - check
    rewards:
      - kit:
          name: "Kit do Arquiteto do Registro"
          items: ["minecraft:diamond x2", "chisel:marble x64", "CarpentersBlocks:blockCarpentersBlock x32", "minecraft:glowstone x8", "minecraft:experience_bottle x16"]
      - loot: incomum
      - xp: 5
