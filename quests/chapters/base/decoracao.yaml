chapter:
  id: decoracao
  title: "Arquitetura e Decoração"
  prefix: ""
  color: "§a"
  order: 125
  icon: chisel:chisel
  desc: |
    §aO Volume da Beleza.§r Cinzéis e mármore, blocos do carpinteiro, peças minúsculas,
    móveis da BiblioCraft, Ztones, portas animadas, refletores, jardins de ferro forjado
    e visuais de armadura. Com desafios de construção para provar o talento!

quests:
  # ======================================================================
  # ABERTURA
  # ======================================================================
  - id: volume_beleza
    title: "O Volume da Beleza"
    type: info
    icon: minecraft:red_flower
    desc: |
      Os Antigos não escreveram só sobre máquinas e feitiços. Uma parte enorme do Registro
      fala de §ebeleza§r: colunas, jardins, bibliotecas, janelas que pegam a luz do fim de
      tarde... Eu guardo essas páginas com um carinho especial.

      Este Volume é um §ecatálogo§r dos mods de construção do pack — §eChisel§r,
      §eCarpenter's Blocks§r, §eLittleTiles§r, §eBiblioCraft§r, §eZtones§r, §eMalisis'
      Doors§r, §eFloodLights§r, §eGarden Stuff§r e §eArmourer's Workshop§r — com §edesafios
      de construção§r no caminho.

      Não há pressa nem ordem certa. Construa o que te deixar feliz!
    tasks:
      - check
    rewards:
      - xp: 1

  # ======================================================================
  # CHISEL
  # ======================================================================
  - id: cinzel
    title: "O Cinzel"
    type: main
    deps: [volume_beleza]
    icon: chisel:chisel
    desc: |
      Um lingote de ferro e um graveto: o §eCinzel§r. Clique com o botão direito para abrir
      o menu, coloque blocos no espaço de entrada e escolha uma das §edezenas de
      variações§r — pedra, tijolos, madeira, vidro, lã, metais, mármore...

      O cinzel de ferro gasta durabilidade a cada bloco. Use o NEI (aba "Chisel") para ver
      todas as variações de um bloco. Fabrique um!
    tasks:
      - get: chisel:chisel
    rewards:
      - xp: 3
      - choice: [minecraft:stone x64, minecraft:stonebrick x32, minecraft:iron_ingot x6]

  - id: marmore
    title: "Mármore"
    type: main
    deps: [cinzel]
    icon: chisel:marble
    desc: |
      O Chisel espalha bolsões de §eMármore§r branco pelo subterrâneo do mundo (veios de
      vários blocos, como pedras decorativas). Quebre com picareta e você terá uma das
      pedras mais nobres da arquitetura.

      Junte §e32 mármores§r.
    tasks:
      - get: chisel:marble:* x32
    rewards:
      - xp: 3
      - choice: [minecraft:torch x32, chisel:marble x16, minecraft:iron_ingot x6]

  - id: calcario
    title: "Calcário"
    type: normal
    deps: [cinzel]
    icon: chisel:limestone
    desc: |
      Parecido com o mármore, mas amarelado: o §eCalcário§r também gera em bolsões no
      subterrâneo. Ele combina lindamente com arenito e madeiras claras.

      Junte §e16 calcários§r.
    tasks:
      - get: chisel:limestone:* x16
    rewards:
      - item: minecraft:sandstone x16
      - xp: 1

  - id: marmore_variado
    title: "Mármore Trabalhado"
    type: normal
    deps: [marmore]
    icon: chisel:marble:4
    desc: |
      Coloque mármore no cinzel e transforme em tijolos, ladrilhos, entalhes, arcos... São
      mais de dez variações.

      Tenha §e4 variações diferentes§r de mármore (pelo menos 4 de cada).
    tasks:
      - get: [chisel:marble:1 x4, chisel:marble:2 x4, chisel:marble:3 x4, chisel:marble:4 x4]
    rewards:
      - item: chisel:marble x16
      - xp: 2

  - id: pilar_marmore
    title: "Pilares de Mármore"
    type: normal
    deps: [marmore]
    icon: chisel:marble_pillar
    desc: |
      Seis mármores em duas colunas fazem 6 §ePilares de Mármore§r — que também têm suas
      próprias variações no cinzel (bases, capitéis, colunas caneladas...).

      Faça §e12 pilares§r. Uma entrada com colunas dá outra vida à base.
    tasks:
      - get: chisel:marble_pillar:* x12
    rewards:
      - item: chisel:marble x8
      - xp: 2

  - id: cinzel_diamante
    title: "Cinzel de Diamante"
    type: normal
    deps: [cinzel]
    icon: chisel:diamondChisel
    desc: |
      Com um diamante no lugar do ferro: §eCinzel de Diamante§r. Ele dura muito mais e tem
      opções extras de cinzelar blocos já colocados no mundo — confira os modos e
      instruções na dica do item e no próprio menu do cinzel.

      Fabrique um. Reformar uma parede inteira nunca foi tão rápido.
    tasks:
      - get: chisel:diamondChisel
    rewards:
      - item: minecraft:stone x32
      - xp: 2

  - id: cinzel_obsidiana
    title: "Cinzel de Obsidiana"
    type: optional
    deps: [cinzel_diamante]
    icon: chisel:obsidianChisel
    desc: |
      Uma obsidiana e um graveto: §eCinzel de Obsidiana§r, outra versão resistente do
      cinzel. Escolha o seu favorito!

      Fabrique um.
    tasks:
      - get: chisel:obsidianChisel
    rewards:
      - loot: comum

  - id: cinzel_estrela
    title: "Cinzel da Estrela do Nether"
    type: optional
    deps: [cinzel_diamante]
    icon: chisel:netherStarChisel
    desc: |
      Quatro Estrelas do Nether num cinzel? Pois é: o §eCinzel da Estrela do Nether§r é o
      mais durável de todos. É mais uma declaração de amor à arquitetura do que uma
      necessidade.

      Fabrique um, se tiver estrelas sobrando (Volume do Nether).
    tasks:
      - get: chisel:netherStarChisel
    rewards:
      - loot: comum

  - id: auto_cinzel
    title: "O Cinzel Automático"
    type: normal
    deps: [cinzel]
    icon: chisel:autoChisel
    desc: |
      Lajes de pedra e ferro: §eCinzel Automático§r. Coloque um cinzel nele, um bloco
      de referência (o "alvo") e os blocos a transformar: ele trabalha sozinho e aceita
      funis. O §eAprimoramento de Velocidade§r (esmeraldas, açúcar, redstone) acelera.

      Fabrique um cinzel automático.
    tasks:
      - get: chisel:autoChisel
    rewards:
      - item: minecraft:hopper
      - xp: 2

  - id: vidro_chisel
    title: "Vitrais"
    type: normal
    deps: [cinzel]
    icon: chisel:glass:3
    desc: |
      Vidro comum no cinzel vira §evitrais§r: molduras, padrões, quadriculados, bolhas...
      Eles mudam completamente a cara de uma janela.

      Tenha §e16 vidros cinzelados§r (qualquer padrão).
    tasks:
      - get: chisel:glass:* x16
    rewards:
      - item: minecraft:glass x16
      - xp: 1

  - id: bloco_fabrica
    title: "Blocos de Fábrica"
    type: normal
    deps: [cinzel]
    icon: chisel:factoryblock
    desc: |
      Pedra e ferro fazem 32 §eBlocos de Fábrica§r: placas metálicas, grades, faixas de
      perigo, rebites... O visual perfeito para quem vai construir uma base tecnológica.

      Faça §e32 blocos de fábrica§r.
    tasks:
      - get: chisel:factoryblock:* x32
    rewards:
      - item: minecraft:iron_ingot x4
      - xp: 1

  - id: bloco_tecnico
    title: "Blocos Técnicos"
    type: normal
    deps: [bloco_fabrica]
    icon: chisel:technical
    desc: |
      Mais um para os engenheiros: os §eBlocos Técnicos§r (pedra e ferro, 32 por receita)
      têm painéis, ventiladores, canos e luzes de aviso. Algumas variações são até
      transparentes ou animadas.

      Faça §e32 blocos técnicos§r.
    tasks:
      - get: chisel:technical:* x32
    rewards:
      - item: minecraft:iron_ingot x4
      - xp: 1

  - id: bloco_laboratorio
    title: "Blocos de Laboratório"
    type: optional
    deps: [bloco_fabrica]
    icon: chisel:laboratoryblock
    desc: |
      Pedra e quartzo: §eBlocos de Laboratório§r, brancos, limpos e cheios de painéis — para
      aquele laboratório de ciência maluca.

      Faça §e8§r.
    tasks:
      - get: chisel:laboratoryblock:* x8
    rewards:
      - loot: comum

  - id: futura
    title: "Blocos Futura"
    type: optional
    deps: [bloco_fabrica]
    icon: chisel:futura
    desc: |
      Pedra, tijolos de pedra e redstone: §eBlocos Futura§r, com telas e circuitos
      animados. Sci-fi puro.

      Faça §e8§r.
    tasks:
      - get: chisel:futura:* x8
    rewards:
      - loot: comum

  - id: pedra_vazio
    title: "Pedra do Vazio"
    type: normal
    deps: [cinzel]
    icon: chisel:voidstone
    desc: |
      Obsidiana, pedra e uma pérola do fim: §ePedra do Vazio§r (Voidstone), escura e com
      reflexos de estrelas. Com olho do fim em vez da pérola, vira a versão
      §eEnergizada§r, que pulsa.

      Faça §e8 pedras do vazio§r.
    tasks:
      - get: chisel:voidstone:* x8
    rewards:
      - item: minecraft:obsidian x4
      - xp: 1

  - id: pedras_elementais
    title: "Pedra de Lava e Pedra de Água"
    type: optional
    deps: [cinzel]
    icon: chisel:lavastone
    desc: |
      Oito pedras em volta de um balde de lava: §ePedra de Lava§r, com lava "escorrendo"
      animada. Com balde de água: §ePedra de Água§r. Seguras, bonitas e hipnotizantes.

      Faça §e8 de cada§r.
    tasks:
      - get: [chisel:lavastone:* x8, chisel:waterstone:* x8]
    rewards:
      - loot: comum

  - id: templo_tyrian
    title: "Templo e Tyrian"
    type: optional
    deps: [cinzel]
    icon: chisel:templeblock
    desc: |
      §eBlocos de Templo§r (pedra + corante azul) para ruínas antigas e §eTyrian§r (pedra +
      ferro) para estruturas alienígenas. Dois estilos que parecem saídos de outros Volumes.

      Faça §e8 de cada§r.
    tasks:
      - get: [chisel:templeblock:* x8, chisel:tyrian:* x8]
    rewards:
      - loot: comum

  - id: papel_parede
    title: "Papel de Parede"
    type: normal
    deps: [cinzel]
    icon: chisel:paperwall
    desc: |
      Papel e graveto fazem 8 §ePapéis de Parede§r (Paperwall) em estilo japonês: painéis
      finos com padrões. Quatro deles viram um bloco inteiro.

      Faça §e8 papéis de parede§r. Uma sala de chá com shoji (veja as portas Malisis!) fica
      perfeita.
    tasks:
      - get: chisel:paperwall:* x8
    rewards:
      - item: minecraft:paper x8
      - xp: 1

  - id: neonite
    title: "Neonite e GloTek"
    type: optional
    deps: [cinzel]
    icon: chisel:neonite
    desc: |
      Esmeraldas e pó de pedra luminosa: §eNeonite§r, blocos coloridos que brilham como
      letreiros de néon. Com mais pedra luminosa, a Neonite vira §eGloTek§r.

      Faça §e8 neonites§r.
    tasks:
      - get: chisel:neonite:* x8
    rewards:
      - loot: comum

  - id: concreto_canhamo
    title: "Concreto de Cânhamo"
    type: normal
    deps: [cinzel]
    icon: chisel:hempcrete
    desc: |
      Areia e samambaia fazem §ePó de Hempcrete§r; na fornalha ele vira §eHempcrete§r
      (concreto de cânhamo), com variações em todas as cores. Com cascalho, hempcrete vira
      §eBloco de Estrada§r — e as §eLinhas de Estrada§r pintam faixas no chão.

      Faça §e8 hempcretes§r.
    tasks:
      - get: chisel:hempcrete:* x8
    rewards:
      - item: minecraft:sand x16
      - xp: 1

  - id: estrada
    title: "Estradas de Verdade"
    type: optional
    deps: [concreto_canhamo]
    icon: chisel:road
    desc: |
      Hempcrete e cascalho: 32 §eBlocos de Estrada§r. Combine com §eLinhas de Estrada§r
      (corante branco e redstone) e você terá avenidas ligando as partes da sua base.

      Faça §e16 blocos de estrada§r.
    tasks:
      - get: chisel:road:* x16
    rewards:
      - loot: comum

  - id: lanterna_chisel
    title: "Lanternas do Chisel"
    type: optional
    deps: [cinzel]
    icon: chisel:lantern
    desc: |
      Ferro, pó de pedra luminosa e uma pedra luminosa: §eLanterna§r do Chisel, um bloco de
      luz com moldura metálica (e variações no cinzel).

      Faça §euma§r.
    tasks:
      - get: chisel:lantern:*
    rewards:
      - loot: comum

  - id: nuvem_garrafa
    title: "Nuvem na Garrafa"
    type: optional
    deps: [cinzel]
    icon: chisel:cloudinabottle
    desc: |
      Vidro e quartzo: §eNuvem na Garrafa§r. Arremesse e ela cria §enuvens§r de verdade no
      lugar — blocos fofos para decorar o céu da sua base. Quem nunca quis morar numa nuvem?

      Fabrique uma.
    tasks:
      - get: chisel:cloudinabottle
    rewards:
      - loot: comum

  - id: bola_musgo
    title: "Bola de Musgo"
    type: optional
    deps: [cinzel]
    icon: chisel:ballomoss
    desc: |
      Trepadeiras e gravetos: §eBola de Musgo§r (Ball O' Moss). Arremesse e ela deixa os
      blocos de pedra em volta §emusgosos§r. Envelhecer uma construção nunca foi tão fácil.

      Fabrique uma.
    tasks:
      - get: chisel:ballomoss
    rewards:
      - loot: comum

  - id: tapete_chisel
    title: "Tapetes Estampados"
    type: optional
    deps: [cinzel]
    icon: chisel:carpet_block
    desc: |
      Lã e linha fazem 8 blocos de §eTapete§r estampado do Chisel; duas fileiras deles
      viram tapetes finos para o chão. Tapete persa na sala? Sim, por favor.

      Faça §e8 blocos de tapete§r.
    tasks:
      - get: chisel:carpet_block:* x8
    rewards:
      - loot: comum

  - id: mestre_cinzel
    title: "A Arte do Cinzel"
    type: milestone
    deps: [marmore_variado, pilar_marmore, vidro_chisel, bloco_tecnico, pedra_vazio, papel_parede, auto_cinzel]
    icon: chisel:diamondChisel
    banner: "A Arte do Cinzel!"
    subtitle: "Toda pedra esconde uma estátua"
    desc: |
      Mármore trabalhado, pilares, vitrais, blocos técnicos, pedra do vazio, papel de
      parede e até um cinzel que trabalha sozinho. Você descobriu o segredo dos
      escultores antigos: §etoda pedra já tem uma forma bonita lá dentro§r — é só tirar o
      excesso.

      Diz a lenda que os Antigos tinham uma biblioteca inteira de mármore no Registro. Eu
      não lembro mais como ela era... mas acho que você vai construir uma melhor.

      Toma, material para a próxima obra-prima.
    tasks:
      - check
    rewards:
      - kit:
          name: "Kit do Escultor"
          items: ["chisel:marble x64", "chisel:limestone x32", "minecraft:glass x32", "minecraft:iron_ingot x4"]
      - loot: incomum
      - xp: 5

  # ======================================================================
  # CARPENTER'S BLOCKS
  # ======================================================================
  - id: bloco_carpinteiro
    title: "O Bloco do Carpinteiro"
    type: main
    deps: [volume_beleza]
    icon: CarpentersBlocks:blockCarpentersBlock
    desc: |
      Oito gravetos em volta de uma tábua: 5 §eBlocos do Carpinteiro§r. Sozinhos eles parecem
      uma moldura de madeira. A mágica: clique neles com §equalquer bloco§r e ele vira a
      "capa" — o bloco assume a aparência daquele material!

      Quase todas as peças do mod (rampas, escadas, portas, camas...) são feitas a partir
      dele. Faça §e16 blocos do carpinteiro§r.
    tasks:
      - get: CarpentersBlocks:blockCarpentersBlock x16
    rewards:
      - xp: 3
      - choice: [minecraft:planks x32, minecraft:stick x32, minecraft:log x8]

  - id: martelo_carpinteiro
    title: "Martelo do Carpinteiro"
    type: main
    deps: [bloco_carpinteiro]
    icon: CarpentersBlocks:itemCarpentersHammer
    desc: |
      Ferro e blocos do carpinteiro: §eMartelo do Carpinteiro§r. Ele é a ferramenta de
      ajuste: §egira§r e muda a forma de rampas e escadas, abre/fecha portas de garagem e,
      com o botão esquerdo, §eremove§r capas, tintas e sobreposições.

      Fabrique um. Sem ele, o carpinteiro fica de mãos atadas.
    tasks:
      - get: CarpentersBlocks:itemCarpentersHammer
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x6, CarpentersBlocks:blockCarpentersBlock x8, minecraft:dye:15 x8]

  - id: cinzel_carpinteiro
    title: "Cinzel do Carpinteiro"
    type: normal
    deps: [martelo_carpinteiro]
    icon: CarpentersBlocks:itemCarpentersChisel
    desc: |
      Ferro e um bloco do carpinteiro: §eCinzel do Carpinteiro§r. Ele entalha §edesenhos§r
      (padrões) nos blocos cobertos — clique para alternar entre os desenhos disponíveis.

      Fabrique um.
    tasks:
      - get: CarpentersBlocks:itemCarpentersChisel
    rewards:
      - item: CarpentersBlocks:blockCarpentersBlock x4
      - xp: 1

  - id: capas_carpinteiro
    title: "Capas, Tintas e Sobreposições"
    type: info
    deps: [bloco_carpinteiro]
    icon: minecraft:dye:1
    desc: |
      O guia rápido do carpinteiro:

      §e• Capa:§r clique com um bloco qualquer (pedra, lã, vidro, mármore...).
      §e• Tinta:§r clique com um §ecorante§r para tingir a capa.
      §e• Sobreposição:§r alguns materiais (como trepadeiras e neve) cobrem só a
      superfície do bloco — o manual do mod lista todos.
      §e• Tirar:§r botão esquerdo com o Martelo remove a última coisa aplicada.
      Rampas e escadas se encaixam sozinhas com as vizinhas; o Martelo ajusta o resto.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: rampas
    title: "Rampas"
    type: main
    deps: [martelo_carpinteiro]
    icon: CarpentersBlocks:blockCarpentersSlope
    desc: |
      Blocos do carpinteiro e gravetos: 6 §eRampas do Carpinteiro§r. Uma rampa vira canto
      interno, externo, prisma ou oblíqua conforme as vizinhas — e o Martelo ajusta.

      Telhados de verdade, Herói! Faça §e12 rampas§r.
    tasks:
      - get: CarpentersBlocks:blockCarpentersSlope x12
    rewards:
      - xp: 3
      - choice: [CarpentersBlocks:blockCarpentersBlock x12, minecraft:stick x16, minecraft:planks x24]

  - id: escadas_carpinteiro
    title: "Escadas do Carpinteiro"
    type: normal
    deps: [martelo_carpinteiro]
    icon: CarpentersBlocks:blockCarpentersStairs
    desc: |
      Em formato de escada, blocos do carpinteiro viram 4 §eEscadas do Carpinteiro§r, que
      também aceitam qualquer capa — escada de mármore, de lã, de vidro...

      Faça §e8 escadas§r.
    tasks:
      - get: CarpentersBlocks:blockCarpentersStairs x8
    rewards:
      - item: CarpentersBlocks:blockCarpentersBlock x4
      - xp: 1

  - id: porta_cama_carpinteiro
    title: "Porta e Cama do Carpinteiro"
    type: normal
    deps: [bloco_carpinteiro]
    icon: CarpentersBlocks:itemCarpentersDoor
    desc: |
      §ePorta do Carpinteiro§r (6 blocos do carpinteiro) e §eCama do Carpinteiro§r (lã +
      blocos). As duas aceitam capa — a porta tem vários estilos (mude com o Martelo) e a
      cama pode ter a madeira e o tecido que você quiser.

      Fabrique §euma de cada§r.
    tasks:
      - get: [CarpentersBlocks:itemCarpentersDoor, CarpentersBlocks:itemCarpentersBed]
    rewards:
      - item: minecraft:wool x3
      - xp: 2

  - id: alcapao_portao
    title: "Alçapão e Portão"
    type: normal
    deps: [bloco_carpinteiro]
    icon: CarpentersBlocks:blockCarpentersHatch
    desc: |
      §eAlçapão do Carpinteiro§r e §ePortão do Carpinteiro§r: versões "cobríveis" do alçapão
      e do portão de cerca, com estilos que o Martelo alterna.

      Fabrique §eum de cada§r.
    tasks:
      - get: [CarpentersBlocks:blockCarpentersHatch, CarpentersBlocks:blockCarpentersGate]
    rewards:
      - item: minecraft:stick x8
      - xp: 1

  - id: redstone_carpinteiro
    title: "Redstone Disfarçada"
    type: optional
    deps: [bloco_carpinteiro]
    icon: CarpentersBlocks:blockCarpentersLever
    desc: |
      §eAlavanca§r, §eBotão§r, §ePlaca de Pressão§r e até §eSensor de Luz Solar§r do
      carpinteiro: todos aceitam capa. Uma alavanca de mármore numa parede de mármore? Quase
      invisível!

      Fabrique §euma alavanca e uma placa de pressão§r do carpinteiro.
    tasks:
      - get: [CarpentersBlocks:blockCarpentersLever, CarpentersBlocks:blockCarpentersPressurePlate]
    rewards:
      - loot: comum

  - id: cofre_carpinteiro
    title: "O Cofre"
    type: optional
    deps: [bloco_carpinteiro]
    icon: CarpentersBlocks:blockCarpentersSafe
    desc: |
      Blocos do carpinteiro, um bloco de ferro e redstone: §eCofre do Carpinteiro§r. Ele
      pode ser trancado para que só o dono abra, e também aceita capa.

      Fabrique um para os seus diamantes.
    tasks:
      - get: CarpentersBlocks:blockCarpentersSafe
    rewards:
      - loot: comum

  - id: bloco_desmontavel
    title: "Bloco Desmontável"
    type: optional
    deps: [martelo_carpinteiro]
    icon: CarpentersBlocks:blockCarpentersCollapsibleBlock
    desc: |
      O §eBloco Desmontável§r (Collapsible Block) deixa você ajustar a altura de cada canto
      com o Martelo, criando §eterrenos suaves§r, dunas e encostas.

      Faça §e9 blocos desmontáveis§r e esculpa uma colina.
    tasks:
      - get: CarpentersBlocks:blockCarpentersCollapsibleBlock x9
    rewards:
      - loot: comum

  - id: detalhes_carpinteiro
