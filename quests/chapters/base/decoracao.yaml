      Fabrique §euma tela e uma prensa de pintura§r.
    tasks:
      - get: [BiblioCraft:item.PaintingCanvas, BiblioCraft:BiblioPaintPress]
    rewards:
      - item: minecraft:string x4
      - xp: 2

