    tasks:
      - get: BiblioCraft:item.StockroomCatalog
    rewards:
      - loot: comum

  - id: miudezas_biblio
    title: "Miudezas Charmosas"
    type: optional
    deps: [estante_biblio]
    icon: BiblioCraft:BiblioStuffs
    desc: |
      Um §ePote de Biscoitos§r (vidro, ferro, biscoito, redstone), um §eSino de Recepção§r
      (ferro, botão e redstone) e uma §ePrancheta§r para listas de tarefas. Pequenas coisas
