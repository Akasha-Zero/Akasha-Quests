  - id: portas_grandes
    title: "Portões Monumentais"
    type: optional
    deps: [portas_animadas]
    icon: malisisdoors:medieval_door
    desc: |
      Para castelos e fortalezas: a §ePorta Medieval§r e a §ePorta de Carruagem§r são portas
