      - item: harvestcraft:bellpepperItem x4

  - id: cheesebacon
    title: "Cheesebacon"
    type: normal
    deps: [mestre_fartura, cheeseburguer]
    desc: |
      Cheeseburger mais porco cozido resulta em §eCheesebacon§r, que dá 14 de fome. E com cogumelo, vira Hambúrguer de Bacon e Cogumelo.

      Seu coração aguenta, Herói? Prepare o seu e sinta a energia voltar. Se precisar rever os ingredientes, aperte R no NEI. É um prato farto para quem vive de pancada em monstro!
    tasks:
      - get: harvestcraft:baconcheeseburgerItem
    rewards:
      - xp: 2
      - item: minecraft:cooked_porkchop x4

  - id: sunday_roast
    title: "Sunday Roast"
    type: normal
    deps: [mestre_fartura, frango_assado]
    desc: |
      Assadeira + Frango Assado + Batatas Assadas (Assadeira + batata + sal + pimenta) + uma verdura = §eSunday Roast§r (14 de fome). O almoço de domingo inglês, completo!

      Prepare o seu, Herói. Dá trabalho, mas é um espetáculo.
    tasks:
      - get: harvestcraft:sundayroastItem
    rewards:
      - xp: 2
      - item: harvestcraft:broccoliItem x4

  - id: torta_carne
    title: "Torta de Carne"
    type: normal
    deps: [mestre_fartura, especiarias_moidas]
    desc: |
      Assadeira + carne crua + massa + cebola + alho + pimenta-do-reino + caldo = §eTorta de Carne§r (14 de fome).

      É trabalhosa, mas deliciosa! Separe os ingredientes antes de começar, Herói, e boa assadura.
    tasks:
      - get: harvestcraft:meatpieItem
    rewards:
      - xp: 2
      - item: harvestcraft:garlicItem x4

  - id: frango_curry
    title: "Frango com Curry"
    type: normal
    deps: [mestre_fartura, coco, iogurte, especiarias_moidas]
    desc: |
      Panela + coco + iogurte + frango cru + tempero + pimenta chili + arroz + canela moída + alho = §eFrango com Curry§r (14 de fome). Uma viagem de sabores!

      Ele também é a base do lendário Deluxe Chicken Curry, então faça com carinho, Herói.
    tasks:
      - get: harvestcraft:chickencurryItem
    rewards:
      - xp: 2
      - item: harvestcraft:riceItem x8

  - id: sandubao
    title: "Sandubão"
    type: normal
    deps: [mestre_fartura, maionese]
    desc: |
      Meio metro de felicidade vem aí, Herói!

      Tábua de Cortar + pão + carne (ou frango) cozida + alface + tomate + maionese = §eSandubão§r (Footlong, 14 de fome). Junte os ingredientes antes de montar, e prepare a maionese se ainda não tiver. Confira o NEI (R/U) se travar. Monte o seu, e bom apetite!
    tasks:
      - get: harvestcraft:footlongItem
    rewards:
      - xp: 2
      - item: minecraft:bread x4

  - id: gumbo
    title: "Quiabo com Frango (Gumbo)"
    type: normal
    deps: [mestre_fartura, caldo, jardim_ervas]
    desc: |
      Panela + quiabo + frango cru + aipo + cebola + caldo + tempero + pimentão = §eQuiabo com Frango§r (Chicken Gumbo, 16 de fome).

      Comida de Nova Orleans no meio do mundo fraturado! Reúna os ingredientes e prepare o seu.
    tasks:
      - get: harvestcraft:chickengumboItem
    rewards:
      - xp: 2
      - item: harvestcraft:okraItem x4

  - id: mcpam
    title: "McPam"
    type: normal
    deps: [mestre_fartura, vinagre, torrada]
    desc: |
      Tábua de Cortar + carne cozida + alface + picles + cebola + torrada + molho de salada = §eMcPam§r (16 de fome). Picles e molho de salada pedem vinagre e óleo.

      Um lanche famoso que eu prometo não comentar. Monte o seu, Herói!
    tasks:
      - get: harvestcraft:mcpamItem
    rewards:
      - xp: 2
      - item: harvestcraft:cucumberItem x4

  - id: mestre_banquetes
    title: "Maestria dos Banquetes"
    type: milestone
    deps: [chili, pizza_suprema, cheesebacon, sunday_roast, torta_carne, frango_curry, sandubao, gumbo, mcpam]
    banner: "Mestre dos Banquetes"
    subtitle: "Quarto degrau do cardápio"
    desc: |
      Chili, Sunday Roast, Gumbo, McPam… você domina pratos de 13 a 16 de fome com saturação alta, Herói! Uma refeição dessas e a barra fica cheia por muito tempo.

      A Akasha nunca viu um aventureiro tão bem alimentado. Esses pratos sustentam as maiores expedições e as longas sessões de trabalho na base. Cada receita que você aprendeu até aqui contribuiu para este banquete, e eu estou muito orgulhosa do seu caminho.

      Só falta o topo do cardápio: os oito pratos lendários de 18. Comemore esta conquista e vamos juntos até lá!
    tasks:
      - get: [harvestcraft:chiliItem, harvestcraft:sundayroastItem, harvestcraft:chickengumboItem, harvestcraft:mcpamItem]
    rewards:
      - xp: 5
      - kit: {name: "Banquete Real", items: [harvestcraft:pizzaItem x2, harvestcraft:roastchickenItem x2, harvestcraft:applepieItem x2]}
      - loot: incomum

  # --- pratos lendários
  - id: refeicao_deleitosa
    title: "Refeição Deleitosa"
    type: normal
    deps: [mestre_banquetes, cheeseburguer_deluxe, batata_frita]
    desc: |
      Cheeseburger Deluxe mais batata frita (ou abobrinha frita) e qualquer batida resulta em §eRefeição Deleitosa§r, que dá 18 de fome. O combo perfeito, sem utensílio!

      Monte a sua, Herói. É um prato lendário para quem chegou até aqui, e a cozinha merece essa celebração. Confira a receita no NEI (R/U)!
    tasks:
      - get: harvestcraft:delightedmealItem
    rewards:
      - xp: 2
      - item: minecraft:snowball x8

  - id: cafe_manha
    title: "Café da Manhã Amistoso"
    type: normal
    deps: [mestre_banquetes, suco_fruta]
    desc: |
      Porco cozido + ovo frito + torrada + bolinhos de batata (Frigideira + cebola + batata + manteiga) + um suco = §eCafé da Manhã Amistoso§r (18 de fome).

      Comece o dia como um herói, Herói! Junte tudo e sirva.
    tasks:
      - get: harvestcraft:heartybreakfastItem
    rewards:
      - xp: 2
      - item: minecraft:egg x8

  - id: bacon_epico
    title: "Bacon Épico"
    type: normal
    deps: [mestre_banquetes]
    desc: |
      Porco cozido + corantes vermelho, laranja, amarelo, verde, azul, roxo e magenta = §eBacon Épico§r (18 de fome).

      Sim, é um bacon arco-íris. Não, eu não sei como funciona. Sim, eu quero! Junte os corantes e prepare o seu.
    tasks:
      - get: harvestcraft:epicbaconItem
    rewards:
      - xp: 2
      - item: minecraft:cooked_porkchop x4

  - id: bife_wellington
    title: "Bife Wellington"
    type: normal
    deps: [mestre_banquetes, massa, jardim_folhoso]
    desc: |
      Carne crua + massa + cogumelo + espinafre = §eBife Wellington§r (18 de fome). Elegante e, surpreendentemente, sem utensílio!

      Reúna os ingredientes e monte o seu, Herói. Um prato digno de rainha.
    tasks:
      - get: harvestcraft:beefwellingtonItem
    rewards:
      - xp: 2
      - item: minecraft:beef x6

  - id: pizza_banquete
    title: "Pizza de Banquete de Carne"
    type: normal
    deps: [mestre_banquetes, pizza]
    desc: |
      Panela + pizza + calabresa + linguiça de porco + carne cozida + frango assado (vanilla) = §ePizza de Banquete de Carne§r (18 de fome).

      Calabresa e linguiça saem da Tábua de Cortar com porco cozido, temperos e sal. Deu trabalho? Valeu cada fatia, Herói!
    tasks:
      - get: harvestcraft:meatfeastpizzaItem
    rewards:
      - xp: 2
      - item: minecraft:cooked_chicken x4

  - id: linguica_pao
    title: "Linguiça com Pão"
    type: normal
    deps: [mestre_banquetes, xarope_bordo, ketchup]
    desc: |
      Linguiça com Bordo (carne crua + louro + xarope de bordo) + pão + ketchup + cebola = §eLinguiça com Pão§r (18 de fome). O bordo faz toda a diferença!

      Prepare o seu, Herói. Se faltar algo, confira a receita no NEI (R).
    tasks:
      - get: harvestcraft:sausageinbreadItem
    rewards:
      - xp: 2
      - item: harvestcraft:onionItem x4

  - id: curry_deluxe
    title: "Deluxe Chicken Curry"
    type: normal
    deps: [mestre_banquetes, frango_curry]
    desc: |
      Tábua de Cortar + Frango com Curry + arroz + naan (Frigideira + massa + cebola + óleo) + chutney de manga = §eDeluxe Chicken Curry§r (18 de fome).

      É o prato mais trabalhoso do catálogo, mas vale cada passo. Respire fundo e vá, Herói!
    tasks:
      - get: harvestcraft:deluxechickencurryItem
    rewards:
      - xp: 2
      - item: harvestcraft:mangoItem x2

  - id: hamburguer_beterraba
    title: "Hambúrguer de Beterraba"
    type: normal
    deps: [mestre_banquetes, jardim_chao, jardim_tropical]
    desc: |
      Uma torre australiana de sabores, Herói!

      Tábua de Cortar + carne cozida + beterraba + ovo frito + porco cozido + abacaxi + torrada = §eHambúrguer de Beterraba§r (18 de fome). Prepare cada ingrediente antes e confira receitas no NEI (R/U) se faltar algo. Monte camada por camada e saboreie o prato mais farto até aqui!
    tasks:
      - get: harvestcraft:beetburgerItem
    rewards:
      - xp: 2
      - item: harvestcraft:beetItem x4

  # --- doces e bebidas
  - id: bolos
    title: "Bolos de Festa"
    type: normal
    deps: [mestre_pratos, assadeira, creme_leite]
    desc: |
      Bolo de Cenoura, Cheesecake, Pavlova, Bolo de Fim de Ano, Bolo de Veludo Vermelho… os bolos do HarvestCraft podem ser §ecolocados como bloco§r e comidos fatia por fatia, como o bolo vanilla.

      Faça qualquer um e chame os amigos para a festa!
    tasks:
      - one_of: [harvestcraft:carrotcakeItem, harvestcraft:cheesecakeItem, harvestcraft:pavlovaItem, harvestcraft:holidaycakeItem, harvestcraft:redvelvetcakeItem]
    rewards:
      - xp: 2
      - item: minecraft:sugar x16

  - id: batidas
    title: "Batidas Geladas"
    type: normal
    deps: [mestre_petiscos, espremedor]
    desc: |
      Espremedor mais fruta e bola de neve resulta em batida! Há §eBatida de Morango§r, de Banana e muitas outras.

      Batidas são ingrediente da Refeição Deleitosa, então vale guardar algumas. Faça qualquer uma, Herói, e brinde com a Akasha. Se esquecer a receita, o NEI (R/U) mostra os ingredientes. Saúde!
    tasks:
      - one_of: [harvestcraft:strawberrysmoothieItem, harvestcraft:bananasmoothieItem, harvestcraft:melonsmoothieItem, harvestcraft:blueberrysmoothieItem]
    rewards:
      - xp: 2
      - item: minecraft:snowball x16

  - id: pina_colada
    title: "Piña Colada"
    type: optional
    deps: [coco, jardim_tropical]
    desc: |
      Espremedor + coco + abacaxi = §ePiña Colada§r. (Sem álcool, eu garanto. É só de coco.) Ou, se preferir, um §ePonche de Frutas§r: fruta + açúcar no Espremedor.

      Faça um dos dois e brinde à sua conquista, Herói!
    tasks:
      - one_of: [harvestcraft:pinacoladaItem, harvestcraft:fruitpunchItem]
    rewards:
      - loot: comum

  - id: grande_banquete
    title: "O Grande Banquete do Registro"
    type: milestone
    deps: [refeicao_deleitosa, cafe_manha, bacon_epico, bife_wellington, pizza_banquete, linguica_pao, curry_deluxe, hamburguer_beterraba, bolos]
    banner: "O Grande Banquete"
    subtitle: "A página das receitas de família, reescrita"
    desc: |
      Herói… olha essa mesa. Refeição Deleitosa, Café da Manhã Amistoso, Bacon Épico, Bife Wellington, Pizza de Banquete, Linguiça com Pão, Deluxe Curry, Hambúrguer de Beterraba e bolo de sobremesa. Cada um enche a barra inteira!

      Antes da Fratura, os Antigos faziam banquetes assim para celebrar cada página nova do Registro. Hoje, quem celebra somos nós. Convide os amigos do servidor, acenda as velas e coma até não aguentar.

      §6Página das receitas de família: reescrita.§r Obrigada por cozinhar comigo. Que mesa linda você montou, Herói, parabéns de coração!
    tasks:
      - get: [harvestcraft:delightedmealItem, harvestcraft:heartybreakfastItem, harvestcraft:beefwellingtonItem, harvestcraft:deluxechickencurryItem]
    rewards:
      - xp: 5
      - kit: {name: "Kit do Grande Chef", items: [harvestcraft:delightedmealItem x2, harvestcraft:heartybreakfastItem x2, harvestcraft:epicbaconItem x2, minecraft:golden_apple x2]}
      - loot: incomum
      - command: "/effect @p 23 5 4"
