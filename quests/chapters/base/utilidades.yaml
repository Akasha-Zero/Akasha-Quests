      Uma invenção da própria Rede Akashic! O §eRádio§r (tábuas, ferro, blocos musicais e
      redstone) toca §estreams de internet§r de verdade dentro do jogo, em áudio 3D: quem
      chega perto ouve, paredes abafam (lã abafa muito, vidro quase nada).

      Clique para abrir: cole a URL de um stream (http/https), aperte Tocar, ajuste volume e
      alcance (até 48 blocos) e salve as §efavoritas§r. Ele pode ser §epúblico ou
      privado§r e reage à redstone. Fabrique um!
    tasks:
      - get: akashicfm:radio
    rewards:
      - xp: 3
      - choice: [minecraft:noteblock x2, minecraft:redstone x16, minecraft:planks x32]

