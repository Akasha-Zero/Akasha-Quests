    icon: tuborapido:blocoTuboUniversal
    desc: |
      O §eOmni Pipe§r (OmniPipes) é um tubo universal: carrega §eitens, fluidos, gases,
      RF e EU§r no mesmo cano, praticamente instantâneo. A receita é cara (ferro, vidro,
      diamantes, redstone e uma §eEstrela do Nether§r para 8 tubos), então ele é coisa de
      base avançada.

      Os §ebocais§r aparecem sozinhos onde o tubo encosta numa máquina ou baú. Clicando
      num bocal:
      §e• Mão vazia:§r alterna o modo (entrada, saída, ambos...).
      §e• Corante ou lã:§r define o §ecanal colorido§r (só canais iguais conversam).
      §e• Redstone / pó de pedra luminosa:§r sobe / desce a prioridade.
      §e• Papel:§r ajusta a retenção mínima. §e• Bloco de esmeralda:§r modo "Overall".
      §e• Chave inglesa:§r liga/desliga energia. §e• Agachado:§r abre filtro e túnel.
      Confira tudo no WAILA (canal, prioridade, retenção).
