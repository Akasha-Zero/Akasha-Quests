      1. Clique com ele numa §ecaixa§r (ela fica selecionada).
      2. Clique na §erádio§r (ou num iPod Player).
      §e• Agachado + clique numa caixa§r troca o canal dela: mono, esquerdo, direito ou
      estéreo. Duas caixas, uma em cada lado, e você tem som estéreo!
