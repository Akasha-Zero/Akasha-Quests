chapter:
  id: aedf3_automacao_industria
  title: Automação e Indústria Pesada
  prefix: AEDF3
  order: 807.5
  icon: ThermalExpansion:Machine:1
  desc: |
    §6Memórias de outros heróis, página oito.§r Quando a vila crescia, as mãos já não davam conta. Os heróis da Era do Futuro enchiam as salas de máquinas com pulverizadores, fundições, fazendas automáticas e dutos para todo lado. Aqui vão os passos da §eIndústria Pesada§r com Thermal Expansion, MineFactory Reloaded, BuildCraft e EnderIO.
quests:
- id: martelo_termico
  title: Chave Inglesa Térmica
  type: main
  deps_hidden: ['aedf3_cacadores_bosses:caçadores_milestone']
  desc: |
    A chave inglesa do Thermal Expansion gira e desmonta máquinas sem destruí-las. Fica no cinto de qualquer engenheiro. Faça uma e use em tudo o que for conectar nesta fase.
  tasks:
  - {get: 'ThermalExpansion:wrench'}
  rewards:
  - {xp: 5}
  - choice: ['minecraft:iron_ingot x8', 'minecraft:redstone x16']
- id: estrutura_de_maquina
  title: Estrutura de Máquina
  type: main
  deps: [martelo_termico]
  desc: |
    A estrutura é o esqueleto de todas as máquinas do Thermal. Faça com ferro, vidro e cobre. Guarde algumas para as próximas construções. Pense no futuro: você vai precisar de muitas.
  tasks:
  - {get: 'ThermalExpansion:Frame'}
  rewards:
  - {xp: 5}
  - choice: ['ore:ingotCopper x8', 'ore:ingotTin x8']
- id: fornalha_de_redstone
  title: Fornalha de Redstone
  type: main
  deps: [estrutura_de_maquina]
  desc: |
    A §eFornalha de Redstone§r é a versão rápida e elétrica da comum. Ela trabalha mais depressa e se liga à rede de RF. Primeira máquina do ramo Thermal, e o caminho que leva ao resto.
  tasks:
  - {get: 'ThermalExpansion:Machine'}
  rewards:
  - {xp: 5}
  - choice: ['minecraft:redstone x32', 'minecraft:coal x32']
- id: dinamo_a_vapor
  title: Dínamo a Vapor
  type: main
  deps: [fornalha_de_redstone]
  desc: |
    Cada máquina precisa de RF, e o §eDínamo a Vapor§r produz. Alimente com carvão ou lava, e a energia flui. Ponha dois ou três em linha para uma fábrica estável. É o coração do ramo.
  tasks:
  - {get: 'ThermalExpansion:Dynamo'}
  rewards:
  - {xp: 5}
  - choice: ['minecraft:coal x32', 'ore:ingotCopper x8']
- id: pulverizador
  title: Pulverizador
  type: main
  deps: [dinamo_a_vapor]
  desc: |
    O §ePulverizador§r esmaga minérios e dá dois pós. É a base da multiplicação de recursos. Ponha um logo na entrada da fábrica e veja o ouro dobrar. Cada herói tinha o seu.
  tasks:
  - {get: 'ThermalExpansion:Machine:1'}
  rewards:
  - {xp: 5}
  - choice: ['ThermalFoundation:material x16', 'ore:ingotInvar x4']
- id: fundicao_inducao
  title: Fundição por Indução
  type: main
  deps: [pulverizador]
  desc: |
    A §eFundição por Indução§r mistura pós e metais para fazer ligas. Invar, Electrum, Bronze, tudo sai daqui. Depois do pulverizador, é a segunda perna do processo de multiplicação. Perfeito.
  tasks:
  - {get: 'ThermalExpansion:Machine:3'}
  rewards:
  - {xp: 5}
  - choice: ['ThermalFoundation:material:40 x3', 'ore:ingotInvar x4']
- id: serraria
  title: Serraria
  type: normal
  deps: [fundicao_inducao]
  desc: |
    A §eSerraria§r corta troncos em tábuas, com bônus. Sobram serragem e lascas, que você pode usar como combustível ou material. Útil para quem constrói muito. Pense na casa do futuro!
  tasks:
  - {get: 'ThermalExpansion:Machine:2'}
  rewards:
  - {xp: 3}
  - choice: ['minecraft:planks x64', 'minecraft:log x32']
- id: invar
  title: Invar
  type: main
  deps: [serraria]
  desc: |
    Ferro e níquel formam o §eInvar§r, uma liga resistente e brilhante. Muitos itens do Thermal exigem dele. Junte 16 lingotes e já fique com um baú cheio para o que vier.
  tasks:
  - {get: 'ore:ingotInvar x16'}
  rewards:
  - {xp: 5}
  - choice: ['ore:ingotNickel x4', 'minecraft:iron_ingot x8']
- id: electrum
  title: Electrum
  type: main
  deps: [invar]
  desc: |
    Ouro e prata, meio a meio, formam o §eElectrum§r. Condutor excelente e metal bonito. Serve de componente para cabos, bobinas e bancos de energia. Faça oito.
  tasks:
  - {get: 'ore:ingotElectrum x8'}
  rewards:
  - {xp: 5}
  - choice: ['ore:ingotSilver x8', 'minecraft:gold_ingot x8']
- id: celula_de_energia
  title: Célula de Leadstone
  type: main
  deps: [electrum]
  desc: |
    As §eCélulas de Energia§r guardam RF da rede e entregam quando falta. Comece com a de Leadstone, simples e barata. Mais para frente você troca por modelos maiores. Nunca se esqueça da reserva!
  tasks:
  - {get: 'ThermalExpansion:Cell:1'}
  rewards:
  - {xp: 5}
  - choice: ['ore:ingotInvar x4', 'minecraft:redstone x32']
- id: crisol_magmatico
  title: Crisol Magmático
  type: normal
  deps: [celula_de_energia]
  desc: |
    Funde pedregulho e outros sólidos em lava líquida. Uma fonte infinita de combustível! Com o Crisol, você produz lava sem sair da base. Combine com o Dínamo Magmático para ter energia sem fim.
  tasks:
  - {get: 'ThermalExpansion:Machine:4'}
  rewards:
  - {xp: 3}
  - choice: ['minecraft:lava_bucket', 'minecraft:obsidian x8']
- id: transpositor
  title: Transpositor de Fluidos
  type: normal
  deps: [crisol_magmatico]
  desc: |
    Coloca ou tira fluidos de baldes e recipientes. Simples, mas muito útil para organizar sua indústria. É a ponte entre baldes e tanques, e você vai se perguntar como viveu sem.
  tasks:
  - {get: 'ThermalExpansion:Machine:5'}
  rewards:
  - {xp: 3}
  - choice: ['minecraft:bucket x4', 'minecraft:iron_ingot x8']
- id: tanque_portatil
  title: Tanque Portátil
  type: normal
  deps: [transpositor]
  desc: |
    Um tanque que você carrega sem perder o conteúdo! Pegue com uma chave inglesa e leve lava, água ou combustível para onde quiser. Muito prático para expedições.
  tasks:
  - {get: 'ThermalExpansion:Tank:1'}
  rewards:
  - {xp: 3}
  - choice: ['minecraft:glass x16', 'ore:ingotInvar x4']
- id: caixa_forte
  title: Caixa Forte
  type: optional
  deps: [tanque_portatil]
  desc: |
    Uma caixa que guarda itens sem perder o inventário ao ser recolhida. A §eCaixa Forte§r é segura e cresce em capacidade com as melhorias. Ótima para guardar tesouros que não podem se perder.
  tasks:
  - {get: 'ThermalExpansion:Strongbox:1'}
  rewards:
  - {xp: 3}
  - choice: ['minecraft:iron_ingot x8', 'minecraft:chest x2']
- id: mfr_borracha
  title: Seringueira da Fábrica
  type: normal
  deps: [caixa_forte]
  desc: |
    O MineFactory Reloaded tem suas próprias seringueiras. Colha oito troncos e prepare-se para as máquinas agrícolas. A borracha daqui tem outros usos, e as mudas estão em quase todo lugar.
  tasks:
  - {get: 'MineFactoryReloaded:rubberwood.log x8'}
  rewards:
  - {xp: 3}
  - choice: ['MineFactoryReloaded:rubberwood.sapling x4', 'minecraft:iron_ingot x4']
- id: mfr_plantador
  title: Plantador Automático
  type: main
  deps: [mfr_borracha]
  desc: |
    Uma máquina que planta sozinha! O §ePlantador§r semeia sementes, mudas e até cana. Posicione sobre a terra, coloque o baú com sementes ao lado e dê energia. Os heróis da Era do Futuro enchiam hortas inteiras assim.
  tasks:
  - {get: 'MineFactoryReloaded:machine.0'}
  rewards:
  - {xp: 5}
  - choice: ['minecraft:wheat_seeds x32', 'minecraft:iron_ingot x8']
- id: mfr_colhedor
  title: Colhedor Automático
  type: main
  deps: [mfr_plantador]
  desc: |
    Depois do plantador, o §eColhedor§r! Ele corta trigo, cana, árvores e outros cultivos maduros. Coloque um baú ao lado para guardar. Em poucos minutos o baú enche, e você pode ir para outra tarefa.
  tasks:
  - {get: 'MineFactoryReloaded:machine.0:2'}
  rewards:
  - {xp: 5}
  - choice: ['minecraft:wheat x32', 'minecraft:iron_ingot x8']
- id: mfr_fertilizador
  title: Fertilizador
  type: normal
  deps: [mfr_colhedor]
  desc: |
    O §eFertilizador§r aplica adubo nas plantas, acelerando a colheita. Combina com plantador e colhedor para formar uma fazenda autônoma. A ideia é simples, e o resultado é sensacional.
  tasks:
  - {get: 'MineFactoryReloaded:machine.0:4'}
  rewards:
  - {xp: 3}
  - choice: ['MineFactoryReloaded:fertilizer x24', 'minecraft:dye:15 x16']
- id: fazenda_automatica
  title: Fazenda Automática
  type: main
  deps: [mfr_fertilizador]
  desc: |
    Plantador, colhedor e fertilizador trabalhando em conjunto: agora você tem uma §efazenda de verdade§r. Adicione um coletor de itens e estará pronto. Perfeita para suprir a padaria da vila e as cozinhas do futuro.
  tasks:
  - get: ['MineFactoryReloaded:machine.0', 'MineFactoryReloaded:machine.0:2', 'MineFactoryReloaded:machine.0:4']
  rewards:
  - {xp: 5}
  - choice: ['MineFactoryReloaded:machine.0:6', 'minecraft:chest x4']
- id: bc_bomba_agua
  title: Bomba de Fluidos
  type: normal
  deps: [fazenda_automatica]
  desc: |
    A §eBomba§r do BuildCraft sobe da superfície até o fundo e puxa lava, água e petróleo. Ligue a um motor e a tanques. Muito útil para esvaziar lagos e coletar óleo. Cuidado onde coloca.
  tasks:
  - {get: 'BuildCraft|Factory:pumpBlock'}
  rewards:
  - {xp: 3}
  - choice: ['BuildCraft|Factory:tankBlock x2', 'minecraft:iron_ingot x8']
- id: bc_preenchedor
  title: Preenchedor
  type: normal
  deps: [bc_bomba_agua]
  desc: |
    O §ePreenchedor§r nivela terreno, cava buracos e constrói paredes. Escolha o padrão no menu e coloque os marcadores. Tudo em um clique! Perfeito para preparar o terreno da vila.
  tasks:
  - {get: 'BuildCraft|Builders:fillerBlock'}
  rewards:
  - {xp: 3}
  - choice: ['minecraft:iron_ingot x16', 'minecraft:redstone x32']
- id: bc_pedreira_pesada
  title: Pedreira Turbinada
  type: main
  deps: [bc_preenchedor]
  desc: |
    Marque uma área com os três marcadores, encaixe a §ePedreira§r no canto e ligue o motor. Ela escava tudo sozinha. Uma ideia clássica da Era do Futuro: dormir enquanto a máquina minera. Cuidado com lava e com o sono.
  tasks:
  - get: ['BuildCraft|Builders:machineBlock', 'BuildCraft|Core:markerBlock']
  rewards:
  - {xp: 5}
  - choice: ['minecraft:diamond x4', 'minecraft:iron_ingot x16']
- id: eio_moinho
  title: Moinho SAG
  type: main
  deps: [bc_pedreira_pesada]
  desc: |
    O §eMoinho SAG§r do EnderIO pulveriza minérios com bônus. É a versão poderosa do pulverizador. Se quiser mais rendimento, adicione os melhoradores. Os heróis do passado já faziam fila para usar.
  tasks:
  - {get: 'EnderIO:blockSagMill'}
  rewards:
  - {xp: 5}
  - choice: ['minecraft:iron_ingot x16', 'minecraft:redstone x32']
- id: eio_fundidora
  title: Fundidora de Ligas
  type: main
  deps: [eio_moinho]
  desc: |
    A §eFundidora de Ligas§r mistura metais e produz Dark Steel, Electrical Steel e outros. Perfeita para quem pretende explorar o EnderIO. Veja as receitas no NEI e escolha o que for mais urgente.
  tasks:
  - {get: 'EnderIO:blockAlloySmelter'}
  rewards:
  - {xp: 5}
  - choice: ['minecraft:iron_ingot x16', 'minecraft:coal x32']
- id: eio_banco_capacitores
  title: Banco de Capacitores
  type: normal
  deps: [eio_fundidora]
  desc: |
    Armazena RF de forma barata. O §eBanco de Capacitores§r é fácil de montar e escalável: empilhe vários para expandir. Os heróis da indústria enchiam paredes inteiras deles.
  tasks:
  - {get: 'EnderIO:blockCapBank'}
  rewards:
  - {xp: 3}
  - choice: ['minecraft:redstone x32', 'ore:ingotElectrum x4']
- id: eio_ancora
  title: Âncora de Viagem
  type: optional
  deps: [eio_banco_capacitores]
  desc: |
    Âncora de teletransporte rápido entre pontos da vila. Coloque várias e use a Varinha de Viagem para pular de uma a outra. Perfeito para mapas grandes e para chegar rápido à fazenda.
  tasks:
  - {get: 'EnderIO:blockTravelAnchor'}
  rewards:
  - {xp: 3}
  - choice: ['minecraft:ender_pearl x4', 'minecraft:iron_ingot x8']
- id: industria_milestone
  title: Sala de Máquinas
  type: milestone
  deps: [eio_ancora]
  desc: |
    Pulverizador, fundição, colhedor, pedreira e moinho SAG. Sua sala de máquinas faria qualquer herói lendário chorar de emoção. Fumaça no ar, barulho de engrenagem, baús cheios. Vá com calma e agradeça cada máquina pelo trabalho duro.

    Agora, uma mudança de ares: o osmium e a tecnologia de multiplicação do §eMekanism§r. Tem muita coisa boa por aí, Herói.
  tasks:
  - get: ['ThermalExpansion:Machine:1', 'ThermalExpansion:Machine:3', 'MineFactoryReloaded:machine.0:2',
      'BuildCraft|Builders:machineBlock', 'EnderIO:blockSagMill']
  rewards:
  - {xp: 25}
  - kit:
      name: Kit Industrial Pesado
      items: ['ore:ingotInvar x16', 'ore:ingotElectrum x8', 'minecraft:diamond x8', 'minecraft:redstone
          x64', 'minecraft:iron_ingot x32']
  - {loot: raro}
