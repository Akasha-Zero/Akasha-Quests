chapter:
  id: wizardry
  title: "Electroblob's Wizardry"
  prefix: ""
  order: 565
  icon: wizardry:master_wand
  desc: |
    §dO Volume dos Feiticeiros Errantes.§r Cristais de mana, varinhas de Novato a Mestre,
    140 livros de feitiço em sete elementos, torres de magos e armaduras que se carregam com
    magia. (Electroblob's Wizardry 1.1.6)

quests:
  # ======================================================================
  # FASE 0 — CRISTAIS DE MANA
  # ======================================================================
  - id: volume_feiticeiros
    title: "O Volume dos Feiticeiros"
    type: info
    icon: wizardry:wizard_handbook
    desc: |
      Que delícia de Volume, Herói: nada de multiblocos gigantes nem árvores de talento. Aqui a
      magia é simples — §eache livros de feitiço, prenda-os numa varinha e lance§r.

      O ciclo é este:
      §e1.§r Cristais Mágicos (a mana) → Varinha Mágica → Bancada Arcana.
      §e2.§r Livros de feitiço (baús, monstros, magos) → vincule à varinha.
      §e3.§r Tomos de Arcana sobem a varinha de tier: §7Novato → §aAprendiz → §9Avançado →
      §dMestre§r. Cada tier lança feitiços até o seu nível.
      §e4.§r Armaduras de mago, upgrades e as torres dos magos.

      §aDica:§r o §eManual do Mago§r (The Wizard's Handbook) explica tudo dentro do jogo.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: minerio_cristal
    title: "Cristal Mágico"
    type: main
    deps: [volume_feiticeiros]
    icon: wizardry:crystal_ore
    desc: |
      A mana deste Volume não mora em você: ela se cristaliza nas rochas. O §eMinério de
      Cristal§r gera no Mundo Normal em veios pequenos, mais ou menos entre §eY 5 e 30§r, e solta
      §eCristais Mágicos§r.

      Cada cristal vale §e100 de mana§r. Junte §e16§r: eles fazem a varinha, a bancada e o
      primeiro livro de feitiço.
    tasks:
      - get: wizardry:magic_crystal x16
    rewards:
      - xp: 4
      - choice: [minecraft:iron_pickaxe, minecraft:torch x32, minecraft:bread x12]

  - id: flor_cristal
    title: "Flor de Cristal"
    type: normal
    deps: [minerio_cristal]
    icon: wizardry:crystal_flower
    desc: |
      Já viu uma florzinha brilhando no mato, Herói? É uma §eFlor de Cristal§r, fonte natural de mana na superfície.

      Na bancada, uma flor vira §e2 Cristais Mágicos§r. Colha §e4§r e comece sua jornada arcana! Procure pelos campos com atenção e confira o NEI (U) se não achar. Boa colheita!
    tasks:
      - get: wizardry:crystal_flower x4
    rewards:
      - xp: 2
      - item: minecraft:dye:15 x16

  - id: bloco_cristal
    title: "Bloco de Cristal"
    type: optional
    deps: [minerio_cristal]
    icon: wizardry:crystal_block
    desc: |
      Nove cristais formam um §eBloco de Cristal§r. Bonito, compacto e brilhante: o seu cofre de mana!

      Missão opcional, Herói. Perfeita para quem gosta de guardar tudo com estilo e liberar espaço no baú. Se esquecer a receita, o NEI (R/U) mostra o desenho certinho. Divirta-se montando!
    tasks:
      - get: wizardry:crystal_block
    rewards:
      - loot: comum

  - id: manual_mago
    title: "O Manual do Mago"
    type: normal
    deps: [minerio_cristal]
    icon: wizardry:wizard_handbook
    desc: |
      Livro + Cristal Mágico = §eThe Wizard's Handbook§r. Se perder, é só fazer outro.

      Ele explica mana, varinhas, tiers, elementos, armaduras e torres, com as receitas. Leia com carinho: o autor (Electroblob) caprichou, Herói! É o seu guia para tudo o que vem a seguir na magia.
    tasks:
      - get: wizardry:wizard_handbook
    rewards:
      - xp: 2
      - item: minecraft:book x2

  # ======================================================================
  # FASE 1 — VARINHA E BANCADA
  # ======================================================================
  - id: varinha_magica
    title: "A Varinha Mágica"
    type: main
    deps: [minerio_cristal]
    icon: wizardry:magic_wand
    desc: |
      Uma pepita de ouro, um graveto e um Cristal Mágico em diagonal: a §eVarinha Mágica§r de
      §7Novato§r. Ela guarda até §e700 de mana§r e lança feitiços de Novato.

      Segurando a varinha, aparece no canto da tela o feitiço selecionado e a barra de recarga.
      Troque de feitiço com as teclas do mod ou §eagachado + roda do mouse§r.
    tasks:
      - get: wizardry:magic_wand
    rewards:
      - xp: 4
      - choice: [wizardry:magic_crystal x6, minecraft:gold_nugget x9, minecraft:stick x16]

  - id: bancada_arcana
    title: "A Bancada Arcana"
    type: main
    deps: [varinha_magica]
    icon: wizardry:arcane_workbench
    desc: |
      Três pedras, um bloco de lápis-lazúli, dois Cristais Mágicos, duas pepitas de ouro e um
      tapete roxo: a §eBancada Arcana§r.

      Com a varinha no slot central você pode:
      §e• Vincular§r feitiços (livros nos slots ao redor, até 5 por varinha).
      §e• Carregar§r a varinha (cristais no slot superior esquerdo).
      §e• Melhorar§r a varinha (Tomo de Arcana ou upgrade no slot inferior esquerdo).
      Depois, aperte §eAplicar§r.
    tasks:
      - get: wizardry:arcane_workbench
    rewards:
      - xp: 4
      - choice: [minecraft:lapis_block x2, wizardry:magic_crystal x8, minecraft:carpet:10 x2]

  - id: missil_magico
    title: "Míssil Mágico"
    type: main
    deps: [bancada_arcana]
    icon: wizardry:spell_book:1
    desc: |
      Todo feiticeiro começa por aqui. Um livro rodeado por quatro Cristais Mágicos = o livro de
      §eMagic Missile§r, o único que dá para fabricar.

      Coloque a varinha no centro da Bancada Arcana, o livro num slot ao redor e aperte
      Aplicar. Pronto: você lança um projétil mágico (5 de mana). Simples, barato e útil a vida
      inteira!
    tasks:
      - get: wizardry:spell_book:1
    rewards:
      - xp: 4
      - choice: [wizardry:magic_crystal x8, minecraft:arrow x32, minecraft:iron_sword]

  - id: carregar_varinha
    title: "Recarregando a Varinha"
    type: info
    deps: [missil_magico]
    icon: wizardry:magic_crystal
    desc: |
      Cada cristal no slot de carga vale §e100 de mana§r, e a varinha só pega números inteiros
      de cristais (se faltarem 30, os outros 70 se perdem). Deixe um estoque de cristais na
      bancada: ela só usa o que precisa.

      Feitiços custam mana de acordo com a força e a duração; os contínuos (raios, escudo,
      levitação) gastam enquanto você segura o botão.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: frasco_mana
    title: "Frasco de Mana"
    type: normal
    deps: [carregar_varinha]
    icon: wizardry:mana_flask
    desc: |
      Mana engarrafada para a estrada! Um frasco de vidro rodeado por 8 cristais = §eFrasco de
      Mana§r (700 de mana). Fabrique-o junto com a varinha (ou uma peça de armadura de mago)
      para recarregá-la — o frasco é consumido e um pouco de mana se perde no engarrafamento.
    tasks:
      - get: wizardry:mana_flask
    rewards:
      - xp: 2
      - item: minecraft:glass_bottle x4

  - id: pergaminho_branco
    title: "Pergaminho em Branco"
    type: normal
    deps: [bancada_arcana]
    icon: wizardry:blank_scroll
    desc: |
      Papel + linha = §ePergaminho em Branco§r. Na Bancada Arcana você grava nele um feitiço que
      §ejá conhece§r, pagando em cristais o custo de mana. O pergaminho lança o feitiço §euma
      vez§r e some — perfeito para aquela magia rara que não merece um slot na varinha.
    tasks:
      - get: wizardry:blank_scroll x4
    rewards:
      - xp: 2
      - item: minecraft:paper x8

  - id: pergaminho_gravado
    title: "Um Pergaminho Gravado"
    type: optional
    deps: [pergaminho_branco]
    icon: wizardry:scroll:1
    desc: |
      Grave (ou encontre) um pergaminho de qualquer feitiço, Herói. Eles também aparecem em baús de masmorra e nas lojas dos magos.

      Missão opcional, mas ótima para dar o primeiro gostinho de magia. Dúvida? NEI (R/U).
    tasks:
      - get: wizardry:scroll:*
    rewards:
      - loot: comum

  - id: modo_descoberta
    title: "Runas Desconhecidas"
    type: info
    deps: [missil_magico]
    icon: wizardry:identification_scroll
    desc: |
      No pack, o §emodo descoberta§r está ligado: livros e pergaminhos de feitiços que você nunca
      lançou aparecem com §erunas ilegíveis§r. Para descobrir o que são, você pode lançá-los
      (arriscado!) ou usar um §ePergaminho de Identificação§r, que revela o primeiro livro ou
      pergaminho desconhecido da sua barra.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: pergaminho_identificacao
    title: "Pergaminho de Identificação"
    type: normal
    deps: [modo_descoberta]
    icon: wizardry:identification_scroll
    desc: |
      Um feitiço desconhecido pode esconder surpresas, Herói!

      Encontrado em baús ou comprado de magos, o §ePergaminho de Identificação§r revela um feitiço desconhecido sem riscos. Assim você sabe o que está levando antes de usar. Guarde alguns para os livros de Mestre, Herói, e boa sorte nas trocas!
    tasks:
      - get: wizardry:identification_scroll
    rewards:
      - xp: 2
      - item: wizardry:magic_crystal x6

  - id: elementos
    title: "Os Sete Elementos"
    type: info
    deps: [missil_magico]
    icon: wizardry:basic_fire_wand
    desc: |
      Todo feitiço pertence a um elemento:

      §4Fogo§r — queimar, lava, explosões (pouco efeito em criaturas do Nether).
      §bGelo§r — lentidão e congelamento; ótimo contra criaturas de fogo.
      §3Raio§r — tempestades, ataques em vários alvos e teleguiados (cuidado com creepers!).
      §5Necromancia§r — trevas, invocações de mortos-vivos, controle de mentes.
      §2Terra§r — plantas, animais, vento, veneno.
      §aFeitiçaria§r — força, luz, gravidade, teletransporte, armas conjuradas.
      §eCura§r — proteção e regeneração (a luz sagrada fere mortos-vivos).

      Varinhas e armaduras elementais deixam os feitiços do seu elemento mais fortes ou baratos.
    tasks:
      - check
    rewards:
      - xp: 1

  # ======================================================================
  # FASE 2 — LIVROS DE FEITIÇO POR ELEMENTO
  # ======================================================================
  - id: livro_fogo
    title: "Grimório de Fogo"
    type: normal
    deps: [elementos]
    icon: wizardry:spell_book:2
    desc: |
      Encontre (ou compre) qualquer livro de feitiço de §4Fogo§r: Ignição, Bola de Fogo, Raio de Chamas, Bomba de Fogo, Selo de Fogo, Anel de Fogo, Detonar, Pele de Fogo, Meteoro...

      §cFogo põe fogo em tudo, inclusive na sua base.§r Cuidado, Herói!
    tasks:
      - one_of: [wizardry:spell_book:2, wizardry:spell_book:13, wizardry:spell_book:14, wizardry:spell_book:15, wizardry:spell_book:16, wizardry:spell_book:17, wizardry:spell_book:48, wizardry:spell_book:49, wizardry:spell_book:50, wizardry:spell_book:51, wizardry:spell_book:52, wizardry:spell_book:53, wizardry:spell_book:91, wizardry:spell_book:92, wizardry:spell_book:93, wizardry:spell_book:111, wizardry:spell_book:114, wizardry:spell_book:124, wizardry:spell_book:125]
    rewards:
      - xp: 3
      - item: wizardry:magic_crystal x6

  - id: livro_gelo
    title: "Grimório de Gelo"
    type: normal
    deps: [elementos]
    icon: wizardry:spell_book:3
    desc: |
      Encontre qualquer livro de §bGelo§r: Congelar, Bola de Neve, Raio Gélido, Estilhaço de Gelo, Estátua de Gelo, Nevasca, Machado de Gelo, Era do Gelo, Gigante de Gelo...

      §aDica:§r Congelar transforma água em gelo, ou seja, pontes instantâneas! Basta um dos livros para completar a missão, Herói. Escolha o que preferir!
    tasks:
      - one_of: [wizardry:spell_book:3, wizardry:spell_book:4, wizardry:spell_book:18, wizardry:spell_book:19, wizardry:spell_book:20, wizardry:spell_book:21, wizardry:spell_book:22, wizardry:spell_book:54, wizardry:spell_book:55, wizardry:spell_book:56, wizardry:spell_book:57, wizardry:spell_book:58, wizardry:spell_book:94, wizardry:spell_book:95, wizardry:spell_book:96, wizardry:spell_book:126, wizardry:spell_book:127, wizardry:spell_book:128, wizardry:spell_book:136]
    rewards:
      - xp: 3
      - item: wizardry:magic_crystal x6

  - id: livro_raio
    title: "Grimório do Raio"
    type: normal
    deps: [elementos]
    icon: wizardry:spell_book:5
    desc: |
      Encontre qualquer livro de §3Raio§r: Arco Elétrico, Trovão, Raio Contínuo, Bomba de Faíscas, Faísca Teleguiada, Raio em Cadeia, Invocar Tempo, Martelo de Raio, Tempestade...

      Procure em baús ou compre de magos; confira o NEI (R/U). §cRaio carrega creepers.§r Você foi avisado, Herói! Vá com cuidado.
    tasks:
      - one_of: [wizardry:spell_book:5, wizardry:spell_book:6, wizardry:spell_book:23, wizardry:spell_book:24, wizardry:spell_book:25, wizardry:spell_book:26, wizardry:spell_book:27, wizardry:spell_book:59, wizardry:spell_book:60, wizardry:spell_book:61, wizardry:spell_book:62, wizardry:spell_book:63, wizardry:spell_book:64, wizardry:spell_book:97, wizardry:spell_book:98, wizardry:spell_book:129, wizardry:spell_book:137, wizardry:spell_book:138]
    rewards:
      - xp: 3
      - item: wizardry:magic_crystal x6

  - id: livro_necromancia
    title: "Grimório de Necromancia"
    type: normal
    deps: [elementos]
    icon: wizardry:spell_book:7
    desc: |
      Encontre qualquer livro de §5Necromancia§r: Invocar Zumbi, Dreno de Vida, Invocar Esqueleto, Murchar, Controle Mental, Caveira de Wither, Orbe das Trevas, Decadência, Legião de Esqueletos...

      Necromantes não são necessariamente maus. Só... incompreendidos!
    tasks:
      - one_of: [wizardry:spell_book:7, wizardry:spell_book:28, wizardry:spell_book:29, wizardry:spell_book:30, wizardry:spell_book:31, wizardry:spell_book:65, wizardry:spell_book:66, wizardry:spell_book:67, wizardry:spell_book:68, wizardry:spell_book:69, wizardry:spell_book:70, wizardry:spell_book:71, wizardry:spell_book:99, wizardry:spell_book:100, wizardry:spell_book:101, wizardry:spell_book:112, wizardry:spell_book:115, wizardry:spell_book:116, wizardry:spell_book:130]
    rewards:
      - xp: 3
      - item: wizardry:magic_crystal x6

  - id: livro_terra
    title: "Grimório da Terra"
    type: normal
    deps: [elementos]
    icon: wizardry:spell_book:8
    desc: |
      Qual elemento combina com você, Herói?

      Encontre qualquer livro de §2Terra§r: Armadilha, Dardo, Veneno, Aura de Crescimento, Bolha, Redemoinho, Lobo Espiritual, Tornado, Planar, Cavalo Espiritual, Voo, Terremoto... É o elemento mais variado: ataque, defesa e utilidade. Qualquer livro serve para a missão. Se precisar de pistas, confira no NEI (U) ou no manual do mod. Boa escolha!
    tasks:
      - one_of: [wizardry:spell_book:8, wizardry:spell_book:9, wizardry:spell_book:32, wizardry:spell_book:33, wizardry:spell_book:34, wizardry:spell_book:35, wizardry:spell_book:36, wizardry:spell_book:37, wizardry:spell_book:72, wizardry:spell_book:73, wizardry:spell_book:74, wizardry:spell_book:75, wizardry:spell_book:76, wizardry:spell_book:77, wizardry:spell_book:102, wizardry:spell_book:103, wizardry:spell_book:104, wizardry:spell_book:113, wizardry:spell_book:117, wizardry:spell_book:118, wizardry:spell_book:131, wizardry:spell_book:139]
    rewards:
      - xp: 3
      - item: wizardry:magic_crystal x6

  - id: livro_feiticaria
    title: "Grimório de Feitiçaria"
    type: normal
    deps: [elementos]
    icon: wizardry:spell_book:10
    desc: |
      Encontre qualquer livro de §aFeitiçaria§r: Luz, Telecinese, Piscar, Agilidade, Conjurar Espada/Picareta/Arco, Flecha de Força, Petrificar, Invisibilidade, Levitação, Transporte, Buraco Negro...

      Força e mudança: a magia de quem gosta de dobrar as regras, Herói! Basta um dos livros para completar a missão. Se precisar de pistas, confira no NEI (R/U) ou no manual do mod. Boa busca!
    tasks:
      - one_of: [wizardry:spell_book:10, wizardry:spell_book:11, wizardry:spell_book:38, wizardry:spell_book:39, wizardry:spell_book:40, wizardry:spell_book:41, wizardry:spell_book:42, wizardry:spell_book:43, wizardry:spell_book:78, wizardry:spell_book:79, wizardry:spell_book:80, wizardry:spell_book:81, wizardry:spell_book:82, wizardry:spell_book:83, wizardry:spell_book:84, wizardry:spell_book:85, wizardry:spell_book:105, wizardry:spell_book:106, wizardry:spell_book:107, wizardry:spell_book:108, wizardry:spell_book:119, wizardry:spell_book:120, wizardry:spell_book:121, wizardry:spell_book:132]
    rewards:
      - xp: 3
      - item: wizardry:magic_crystal x6

  - id: livro_cura
    title: "Grimório de Cura"
    type: normal
    deps: [elementos]
    icon: wizardry:spell_book:12
    desc: |
      Encontre qualquer livro de §eCura§r: Curar, Escudo, Saciar Fome, Curar Efeitos, Curar Aliado, Cura Maior, Aura de Cura, Campo de Força, Carne de Ferro, Carne de Diamante, Fonte de Mana...

      Indispensável em combate. Eu fico mais tranquila sabendo que você tem um!
    tasks:
      - one_of: [wizardry:spell_book:12, wizardry:spell_book:44, wizardry:spell_book:45, wizardry:spell_book:46, wizardry:spell_book:47, wizardry:spell_book:86, wizardry:spell_book:87, wizardry:spell_book:88, wizardry:spell_book:89, wizardry:spell_book:90, wizardry:spell_book:109, wizardry:spell_book:110, wizardry:spell_book:122, wizardry:spell_book:123, wizardry:spell_book:133, wizardry:spell_book:134, wizardry:spell_book:135, wizardry:spell_book:140]
    rewards:
      - xp: 3
      - item: wizardry:magic_crystal x6

  - id: sete_grimorios
    title: "Os Sete Grimórios"
    type: milestone
    deps: [livro_fogo, livro_gelo, livro_raio, livro_necromancia, livro_terra, livro_feiticaria, livro_cura]
    icon: wizardry:spell_book:38
    banner: "Sete Elementos"
    subtitle: "Uma biblioteca de bolso"
    desc: |
      Fogo, Gelo, Raio, Necromancia, Terra, Feitiçaria e Cura! Você tem pelo menos um feitiço de cada elemento do Volume dos Feiticeiros.

      Os livros vêm de §ebaús de masmorras e templos§r, de §emonstros§r (há uma chance de qualquer criatura hostil soltar um) e das §elojas dos magos§r. Agora é escolher: se especializar num elemento (e caçar a varinha e as vestes dele) ou ser um feiticeiro de tudo um pouco. As duas escolhas são lindas, Herói! Parabéns por completar os sete grimórios, e boa sorte no caminho que escolher a seguir.
    tasks:
      - check
    rewards:
      - xp: 8
      - kit: {name: "Kit da Feitiçaria Errante", items: [wizardry:magic_crystal x32, wizardry:mana_flask x2, wizardry:blank_scroll x8, minecraft:golden_apple]}
      - loot: raro

  # ======================================================================
  # FASE 3 — TIERS: APRENDIZ, AVANÇADO E MESTRE
  # ======================================================================
  - id: livro_aprendiz
    title: "Um Feitiço de Aprendiz"
    type: main
    deps: [missil_magico]
    icon: wizardry:spell_book:13
    desc: |
      Feitiços de §aAprendiz§r são mais impressionantes — e a Varinha de Novato não consegue
      lançá-los. Encontre qualquer livro de tier Aprendiz (Bola de Fogo, Estilhaço de Gelo,
      Piscar, Escudo, Conjurar Espada...).

      Você pode vinculá-lo agora, mas só vai usá-lo depois de subir a varinha de tier.
    tasks:
      - one_of: [wizardry:spell_book:13, wizardry:spell_book:14, wizardry:spell_book:15, wizardry:spell_book:16, wizardry:spell_book:17, wizardry:spell_book:18, wizardry:spell_book:19, wizardry:spell_book:20, wizardry:spell_book:21, wizardry:spell_book:22, wizardry:spell_book:23, wizardry:spell_book:24, wizardry:spell_book:25, wizardry:spell_book:26, wizardry:spell_book:27, wizardry:spell_book:28, wizardry:spell_book:29, wizardry:spell_book:30, wizardry:spell_book:31, wizardry:spell_book:32, wizardry:spell_book:33, wizardry:spell_book:34, wizardry:spell_book:35, wizardry:spell_book:36, wizardry:spell_book:37, wizardry:spell_book:38, wizardry:spell_book:39, wizardry:spell_book:40, wizardry:spell_book:41, wizardry:spell_book:42, wizardry:spell_book:43, wizardry:spell_book:44, wizardry:spell_book:45, wizardry:spell_book:46, wizardry:spell_book:47, wizardry:spell_book:114, wizardry:spell_book:115, wizardry:spell_book:116, wizardry:spell_book:117, wizardry:spell_book:118, wizardry:spell_book:119, wizardry:spell_book:120, wizardry:spell_book:121, wizardry:spell_book:122, wizardry:spell_book:123]
    rewards:
      - xp: 4
      - choice: [wizardry:magic_crystal x8, minecraft:gold_ingot x4, minecraft:emerald x2]

  - id: tomo_aprendiz
    title: "Tomo de Arcana: Aprendiz"
    type: main
    deps: [livro_aprendiz]
    icon: wizardry:arcane_tome:1
    desc: |
