  # ======================================================================
  # FASE 9 — GOLEMANCIA BÁSICA
  # ======================================================================
  - id: bau_faminto
    title: "Baú Faminto"
    type: main
    deps: [mesa_arcana]
    icon: Thaumcraft:blockChestHungry
    desc: |
      A porta de entrada da §eGolemancia§r é um baú com fome: o §eBaú Faminto§r engole itens que encostam nele. Faça com tábuas e um alçapão na Mesa Arcana.

      Ele abre a pesquisa §eGolem de Palha§r, o primeiro trabalhador mágico. Cuidado onde você o posiciona, porque ele come tudo que cair em cima! Confira a receita no NEI (R/U) se precisar. Bem-vindo à golemancia, Herói!
    tasks:
      - get: Thaumcraft:blockChestHungry
    rewards:
      - xp: 3
      - choice: [minecraft:chest x4, minecraft:hopper, minecraft:planks x16]

  - id: golem_palha
    title: "Golem de Palha"
    type: main
    deps: [bau_faminto, crisol]
    icon: Thaumcraft:ItemGolemPlacer
    desc: |
      Um §efardo de feno§r no Crisol com §e4 Humanus, 4 Motus e 4 Spiritus§r vira um §eGolem de
      Palha§r: fraco, rápido, carrega 1 item e aceita 1 melhoria.

      O golem fica parado até receber um §enúcleo de animação§r. Para que ele mexa num baú,
      coloque-o clicando (ou Shift+clicando) no lado do baú com que ele vai trabalhar. Ele
      atua até 16 blocos da "casa".
    tasks:
      - get: Thaumcraft:ItemGolemPlacer
    rewards:
      - xp: 3
      - choice: [minecraft:hay_block x4, minecraft:wheat x16, minecraft:brick x16]

  - id: sino_golem
    title: "Sino dos Golens"
    type: main
    deps: [golem_palha]
    icon: Thaumcraft:GolemBell
    desc: |
      Golens não ouvem conversa, mas obedecem ao §eSino§r (quartzo e graveto). Clique no golem para selecioná-lo; depois clique em blocos, lugares e baús para marcá-los. Shift+clique limpa uma marca; F limpa todas. Clique esquerdo pega o golem de volta (com núcleo e melhorias).

      Faça o seu sino e treine em um golem. Aos poucos você pega o jeito. Confira o NEI (R/U) se precisar. Boa sorte, Herói!
    tasks:
      - get: Thaumcraft:GolemBell
    rewards:
      - xp: 3
      - choice: [minecraft:quartz x8, minecraft:gold_nugget x12, minecraft:redstone x16]

  - id: nucleo_vazio
    title: "Núcleo de Animação em Branco"
    type: main
    deps: [golem_palha, nitor]
    icon: Thaumcraft:ItemGolemCore:100
    desc: |
      Tijolos em volta de um Nitor (Mesa Arcana) = §eNúcleo de Animação em Branco§r. Ele é o
      catalisador: no Crisol, com os aspectos certos, vira cada núcleo específico.

      Faça §e3 núcleos em branco§r. §aObs.:§r a tradução pt_BR troca alguns nomes de núcleos;
      confie no efeito descrito aqui e no livro.
    tasks:
      - get: Thaumcraft:ItemGolemCore:100 x3
    rewards:
      - xp: 3
      - choice: [minecraft:brick x16, Thaumcraft:ItemResource:1 x2, minecraft:clay_ball x16]

  - id: nucleo_coletar
    title: "Núcleo: Coletar"
    type: normal
    deps: [nucleo_vazio]
    icon: Thaumcraft:ItemGolemCore:2
    desc: |
      Núcleo em branco + 5 Lucrum + 5 Terra no Crisol. O golem procura §eitens soltos§r até 16 blocos, recolhe e guarda no baú de casa. Clique no golem para escolher o que pegar.

      Faça o núcleo e coloque-o em um golem para ter um ajudante que recolhe tudo por você. Confira os aspectos no NEI (R/U) se faltar algo. Que trabalhinho gostoso de delegar, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemCore:2
    rewards:
      - xp: 2
      - item: minecraft:chest x2

  - id: nucleo_preencher
    title: "Núcleo: Preencher"
    type: normal
    deps: [nucleo_coletar]
    icon: Thaumcraft:ItemGolemCore
    desc: |
      Núcleo em branco + 5 Fames + 5 Vacuos. O golem busca nos baús marcados os itens que você definiu e §eenche o baú de casa§r (quantidade exata ou "qualquer quantidade").

      Faça o núcleo e instale em um golem, depois marque os baús com o sino. É ótimo para abastecer máquinas sem sair do lugar. Se precisar da receita, aperte R no NEI. Bom trabalho, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemCore
    rewards:
      - xp: 2
      - item: minecraft:hopper

  - id: nucleo_esvaziar
    title: "Núcleo: Esvaziar"
    type: normal
    deps: [nucleo_coletar]
    icon: Thaumcraft:ItemGolemCore:1
    desc: |
      Núcleo em branco + 5 Lucrum + 5 Vacuos. O golem §etira itens do baú de casa§r e leva para os lugares ou baús marcados. É o "transportador" básico da golemancia.

      Faça o núcleo e instale em um golem. Marque o baú de casa e os destinos com o Sino dos Golens. Confira os aspectos no NEI (R/U) se esquecer algo. Boa logística, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemCore:1
    rewards:
      - xp: 2
      - item: minecraft:chest x2

  - id: nucleo_colher
    title: "Núcleo: Colher"
    type: normal
    deps: [nucleo_coletar]
    icon: Thaumcraft:ItemGolemCore:3
    desc: |
      Núcleo em branco + 5 Meto + 5 Messis. O golem colhe plantações maduras por perto (não precisa de baú). Com a §eMelhoria de Ordem§r, ele também replanta! Junte com um golem coletor e tenha uma fazenda automática.

      Faça o núcleo e instale em um golem. Confira os aspectos no NEI (R/U) se faltar algo. Que a colheita seja farta, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemCore:3
    rewards:
      - xp: 2
      - item: minecraft:wheat_seeds x16

  - id: nucleo_guarda
    title: "Núcleo: Proteger"
    type: normal
    deps: [nucleo_coletar]
    icon: Thaumcraft:ItemGolemCore:4
    desc: |
      Núcleo em branco + 5 Telum + 5 Vinculum. Um golem guarda que ataca mobs hostis (menos creepers). Com a Melhoria de Ordem você escolhe os alvos.

      Faça o núcleo e instale em um golem para proteger sua base de visitas indesejadas. Se esquecer algum aspecto, aperte R no NEI. Assim você dorme tranquilo, Herói! Bom trabalho e boa guarda!
    tasks:
      - get: Thaumcraft:ItemGolemCore:4
    rewards:
      - xp: 2
      - item: minecraft:iron_sword

  - id: golem_madeira
    title: "Golem de Madeira"
    type: normal
    deps: [golem_palha, greatwood]
    icon: Thaumcraft:ItemGolemPlacer:1
    desc: |
      Madeira de Greatwood + 4 Humanus, 4 Motus, 4 Spiritus no Crisol. Um golem pouco mais forte que o de palha, e carrega §e4 itens§r. Um bom passo na sua frota de ajudantes!

      Faça o golem e dê um núcleo para ele trabalhar. Confira os aspectos no NEI (R/U) se precisar. Que ajudante simpático, Herói! Mãos à obra!
    tasks:
      - get: Thaumcraft:ItemGolemPlacer:1
    rewards:
      - xp: 2
      - item: Thaumcraft:blockMagicalLog x2

  - id: golem_argila
    title: "Golem de Argila"
    type: normal
    deps: [golem_madeira]
    icon: Thaumcraft:ItemGolemPlacer:3
    desc: |
      Bloco de tijolos + os mesmos aspectos do Golem de Madeira (4 Humanus, 4 Motus, 4 Spiritus) no Crisol. É à prova de fogo, carrega §e8 itens§r e tem velocidade média. Um bom equilíbrio!

      Faça o golem e dê um núcleo para ele trabalhar. Confira os detalhes no NEI (R/U) se precisar. Mais um ajudante pronto, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemPlacer:3
    rewards:
      - xp: 2
      - item: minecraft:brick_block x4

  - id: golem_pedra
    title: "Golem de Pedra"
    type: normal
    deps: [golem_argila]
    icon: Thaumcraft:ItemGolemPlacer:5
    desc: |
      Tijolos de pedra + os aspectos do Crisol (Humanus, Motus e Spiritus). Um golem durável que carrega §e16 itens§r, mas é lento e afunda na água. Cuidado onde você o manda trabalhar!

      Faça o golem e dê um núcleo para ele. Confira os aspectos no NEI (R/U) se precisar. Boa construção, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemPlacer:5
    rewards:
      - xp: 2
      - item: minecraft:stonebrick x16

  - id: golem_ferro
    title: "Golem de Ferro"
    type: normal
    deps: [golem_pedra]
    icon: Thaumcraft:ItemGolemPlacer:6
    desc: |
      Bloco de ferro + aspectos (Humanus, Motus e Spiritus) no Crisol. O Golem de Ferro é muito forte e carrega §e32 itens§r, porém bem lento. Ideal para trabalhos pesados onde a pressa não é prioridade.

      Faça o golem e dê um núcleo para ele trabalhar. Confira os aspectos exatos no NEI (R/U) se precisar. Que parceiro robusto, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemPlacer:6
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x9

  - id: golem_sebo
    title: "Golem de Sebo"
    type: normal
    deps: [golem_argila, sebo]
    icon: Thaumcraft:ItemGolemPlacer:2
    desc: |
      Bloco de Sebo + 8 Humanus, 8 Motus, 8 Spiritus no Crisol. O Golem de Sebo é parecido com o de argila, mas aceita §e2 melhorias§r, o que o torna mais versátil.

      Faça o golem e dê um núcleo para ele. Se esquecer algum aspecto, aperte R no NEI. Experimente combinar as melhorias para ver o que funciona melhor, Herói. Boa sorte!
    tasks:
      - get: Thaumcraft:ItemGolemPlacer:2
    rewards:
      - xp: 2
      - item: Thaumcraft:ItemResource:4 x9

  - id: golem_taumio
    title: "Golem de Táumio"
    type: normal
    deps: [golem_ferro, bloco_taumio]
    icon: Thaumcraft:ItemGolemPlacer:7
    desc: |
      Bloco Táumico + 8 de cada aspecto no Crisol. Durabilidade altíssima, carrega 32 itens, aceita §e2 melhorias§r e resiste a dano mágico. É o melhor operário deste capítulo!

      Faça o golem e dê um núcleo para ele trabalhar. Se não lembrar quais são os aspectos, aperte R no NEI. Você merece um ajudante assim, Herói. Bom trabalho!
    tasks:
      - get: Thaumcraft:ItemGolemPlacer:7
    rewards:
      - xp: 2
      - item: Thaumcraft:ItemResource:2 x4

  - id: golem_carne
    title: "Golem de Carne"
    type: optional
    deps: [golem_madeira]
    icon: Thaumcraft:ItemGolemPlacer:4
    desc: |
      Um Bloco de Carne (9 carnes podres) + 8 de cada aspecto no Crisol. Macabro, se cura muito rápido e aceita 2 melhorias. Um operário e tanto para quem tem estômago forte!

      §cA pesquisa dá 3 de Warp e o golem como item, mais 1.§r Missão opcional, então pense bem antes de aceitar o preço. Confira os detalhes no NEI (R/U). Decida com sabedoria, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemPlacer:4
    rewards:
      - loot: comum

  - id: melhoria_ar
    title: "Melhoria de Golem: Ar"
    type: normal
    deps: [sino_golem]
    icon: Thaumcraft:ItemGolemUpgrade
    desc: |
      Pepitas de ouro em volta de um estilhaço de ar, na Mesa Arcana. Com essa melhoria, o golem anda e ataca à distância mais rápido, e alguns núcleos ganham bônus.

      Faça a melhoria e encaixe em um golem seu. Se precisar da receita, aperte R no NEI. Dá para combinar com outras melhorias conforme o limite do golem permitir. Mãos à obra, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemUpgrade
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x8

  - id: melhoria_terra
    title: "Melhoria de Golem: Terra"
    type: normal
    deps: [sino_golem]
    icon: Thaumcraft:ItemGolemUpgrade:1
    desc: |
      Feita com estilhaço de terra: o golem carrega mais itens (4 a 16 a mais, conforme o tipo), bate mais forte e trabalha mais rápido em tarefas de força. Ideal para quem transporta muita coisa!

      Faça a melhoria e encaixe em um golem. Confira a receita completa no NEI (R/U). Seus operários vão agradecer, Herói. Vamos lá!
    tasks:
      - get: Thaumcraft:ItemGolemUpgrade:1
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x8

  - id: melhoria_fogo
    title: "Melhoria de Golem: Fogo"
    type: normal
    deps: [sino_golem]
    icon: Thaumcraft:ItemGolemUpgrade:2
    desc: |
      Feita com estilhaço de fogo: o golem ganha mais espaços de filtro na interface, e os ataques corpo a corpo incendeiam o alvo. Dois bônus úteis em uma peça só!

      Faça a melhoria e encaixe em um golem. Se precisar conferir a receita, aperte R no NEI. Cuidado para não queimar o que não deve, hein! Boa sorte, Herói!
    tasks:
      - get: Thaumcraft:ItemGolemUpgrade:2
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x8

  - id: melhoria_agua
    title: "Melhoria de Golem: Água"
    type: normal
    deps: [sino_golem]
    icon: Thaumcraft:ItemGolemUpgrade:3
    desc: |
      Feita com estilhaço de água: o golem enxerga mais longe (trabalha numa área maior) e acerta melhor à distância. Ótima para golens que cobrem terreno amplo ou fazem a guarda.

      Faça a melhoria e encaixe em um golem. Se precisar da receita, aperte R no NEI. Seus operários vão enxergar longe, Herói! Mãos à obra!
    tasks:
      - get: Thaumcraft:ItemGolemUpgrade:3
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x8

  - id: melhoria_ordem
    title: "Melhoria de Golem: Ordem"
    type: normal
    deps: [sino_golem]
    icon: Thaumcraft:ItemGolemUpgrade:4
    desc: |
      Feita com estilhaço de ordem: marcas do sino §ecom cores diferentes§r e funções extras em vários núcleos (replantar no Colher, escolher alvos no Proteger). Ela deixa seus golens bem mais organizados.

      Faça a melhoria e encaixe em um golem. Se precisar da receita, aperte R no NEI. Que ordem maravilhosa, Herói! Bom trabalho!
    tasks:
      - get: Thaumcraft:ItemGolemUpgrade:4
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x8

  - id: melhoria_entropia
    title: "Melhoria de Golem: Entropia"
    type: normal
    deps: [sino_golem]
    icon: Thaumcraft:ItemGolemUpgrade:5
    desc: |
      Feita com estilhaço de entropia: o golem devolve dano a quem o ataca e ganha filtros finos (ignorar dano, NBT ou usar o oredict ao procurar itens). Defesa e precisão numa peça só.

      Faça a melhoria e encaixe em um golem. Confira a receita no NEI (R/U) se precisar. Seus operários vão ficar bem mais espertos, Herói! Vamos lá!
    tasks:
      - get: Thaumcraft:ItemGolemUpgrade:5
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x8

  - id: acessorios_golem
    title: "Moda Golem"
    type: optional
    deps: [sino_golem]
    icon: Thaumcraft:ItemGolemDecoration
    desc: |
      Sim, golens usam chapéus. E funcionam! Cartola (mais vida), Barrete (cura rápida),
      Gravata Borboleta (velocidade), Óculos (visão), e para golens de combate: Lança-Dardos,
      Visor, Blindagem e Braço de Maça. As pesquisas aparecem ao examinar lã e coisas com
      aspectos de arma ou proteção. Faça qualquer acessório.
    tasks:
      - one_of: [Thaumcraft:ItemGolemDecoration, Thaumcraft:ItemGolemDecoration:1, Thaumcraft:ItemGolemDecoration:2, Thaumcraft:ItemGolemDecoration:3, Thaumcraft:ItemGolemDecoration:4, Thaumcraft:ItemGolemDecoration:5, Thaumcraft:ItemGolemDecoration:6, Thaumcraft:ItemGolemDecoration:7]
    rewards:
      - loot: comum

  - id: operarios
    title: "Operários Mágicos"
    type: milestone
    deps: [nucleo_preencher, nucleo_esvaziar, nucleo_colher, golem_pedra]
    icon: Thaumcraft:ItemGolemPlacer:5
    banner: "Operários Mágicos"
    subtitle: "A Golemancia desperta"
    desc: |
      Golens coletando, enchendo, esvaziando e colhendo — e você tomando chá. Herói, essa é a
      parte da Taumaturgia que eu mais gosto de assistir.

      Ideias de linha de produção:
      §e•§r Golem Colher (com Ordem) + Golem Coletar = fazenda que se replanta.
      §e•§r Golem Esvaziar tira do baú da fornalha e leva para o depósito.
      §e•§r Golem Preencher mantém o Crisol abastecido de ingredientes.

      No Capítulo II vêm os núcleos avançados: usar, ordenar, lenhador, pescador, alquimia...
    tasks:
      - get: [Thaumcraft:ItemGolemCore x1, Thaumcraft:ItemGolemCore:1, Thaumcraft:ItemGolemCore:3]
    rewards:
      - xp: 5
      - kit: {name: "Kit do Golemante", items: [Thaumcraft:ItemGolemCore:100 x2, minecraft:hay_block x4, Thaumcraft:ItemShard:4 x4, minecraft:gold_nugget x16, minecraft:chest x4]}
      - loot: incomum

  # ======================================================================
  # FASE 10 — O APRENDIZ COMPLETO
  # ======================================================================
  - id: aprendiz_completo
    title: "O Aprendiz se Torna Mestre"
    type: milestone
    deps: [varinha_silverwood, infusao, oculos, laboratorio_alquimico, operarios]
    icon: Thaumcraft:ItemGoggles
    banner: "O Aprendiz se Torna Mestre"
    subtitle: "Fim do Volume da Taumaturgia I"
    desc: |
      Olha só pra você: óculos na cara, varinha de Silverwood na mão, um altar de infusão no
      porão, jarros de essência nas prateleiras e golens varrendo o chão. Herói, eu quase não
      reconheço aquela pessoa que bateu numa estante com um graveto!

      O §eCapítulo II — O Taumaturgo§r continua daqui: infusão avançada, encantamentos por
      infusão, nós energizados e relés de vis, golemancia avançada, o §cWarp§r, a §cMácula§r
      e, no fim, os mistérios Eldritch das Terras Exteriores.

      Também ficam abertos os Volumes irmãos: Thaumic Tinkerer, Forbidden Magic, Tainted
      Magic e companhia. Estou muito orgulhosa. De verdade.
    tasks:
      - {get: 'Thaumcraft:WandCasting:* {rod:"silverwood"}', nbt: true}
      - get: Thaumcraft:ItemGoggles
    rewards:
      - xp: 8
      - kit: {name: "Kit do Taumaturgo Formado", items: [Thaumcraft:ItemResource:2 x8, Thaumcraft:ItemResource:14 x6, Thaumcraft:ItemResource:1 x4, Thaumcraft:blockJar x4, Thaumcraft:ItemShard:6 x4]}
      - loot: raro

  # ======================================================================
  # EXTRAS — CURIOSIDADES DO MUNDO E DO LABORATÓRIO
  # ======================================================================
  - id: tabuas_magicas
    title: "Tábuas de Greatwood e Silverwood"
    type: normal
    deps: [silverwood]
    icon: Thaumcraft:blockWoodenDevice:6
    desc: |
      Cada tora mágica rende 4 tábuas. As §eTábuas de Greatwood§r entram em portas arcanas, levitadores, construtos e no Baú Itinerante; as de §eSilverwood§r fazem os Filtros de Fluxo.

      Faça as tábuas das duas madeiras. §aDica:§r o Salis Arcana adiciona tábuas "comuns" parecidas para quem só quer construir. Confira o NEI (R/U) se precisar, Herói!
    tasks:
      - get: [Thaumcraft:blockWoodenDevice:6 x8, Thaumcraft:blockWoodenDevice:7 x4]
    rewards:
      - xp: 2
      - item: minecraft:stick x16

  - id: vishroom
    title: "Vishroom"
    type: optional
    deps: [floresta_magica]
    icon: Thaumcraft:blockCustomPlant:5
    desc: |
      O cogumelo roxo das Florestas Mágicas. Encostar nele deixa você enjoado, mas ele é ingrediente do Fungo Mágico (Tainted Magic) e da Inscrição Maculada.

      Colha um com cuidado (tesoura ou mão rápida!). Missão opcional, mas vale para quem quer conhecer todas as plantas do bioma. Se estiver difícil de achar, aperte R no NEI. Boa colheita, Herói!
    tasks:
      - get: Thaumcraft:blockCustomPlant:5
    rewards:
      - loot: comum

  - id: bloco_ambar
    title: "Bloco de Âmbar"
    type: optional
    deps: [ambar]
    icon: Thaumcraft:blockCosmeticOpaque
    desc: |
      Quatro âmbares = um Bloco de Âmbar, translúcido e cor de mel. Quatro blocos viram tijolos de âmbar. Ele também é a "lente" da Lâmpada Arcana. Lindo como janela!

      Faça dois blocos na bancada. Missão opcional, mas bonita e útil para decorar a base. Se precisar da receita, aperte R no NEI. Divirta-se construindo, Herói!
    tasks:
      - get: Thaumcraft:blockCosmeticOpaque x2
    rewards:
      - loot: comum

  - id: pech
    title: "O Pech"
    type: info
    deps: [floresta_magica]
    icon: Thaumcraft:ItemSpawnerEgg:4
    desc: |
      Baixinhos, gananciosos e fortíssimos: os §ePechs§r vivem onde o véu entre mundos é fino
      (Florestas Mágicas, Terras Sombrias). Eles roubam tudo que estiver no chão, de
      preferência coisas valiosas.

      Normalmente fogem de você, mas se você atacar um, o bando inteiro vem atrás. O livro diz
      que alimentar a ganância deles (dando itens valiosos) pode torná-los amigos — e amigos
      Pech às vezes oferecem objetos raros. "Amizades assim duram pouco", avisa o autor.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: teoria_perdida
    title: "Uma Teoria Perdida"
    type: optional
    deps: [fragmento]
    icon: Thaumcraft:ItemResearchNotes
    desc: |
      Nove Fragmentos de Conhecimento na bancada formam uma nota de "conhecimento perdido". Ela revela pesquisas que não aparecem de outro jeito, uma verdadeira curiosidade para quem gosta de explorar!

      Junte §e9 fragmentos§r. Urnas antigas, caixotes abandonados e cultistas carmesins são as melhores fontes. Missão opcional, vá com calma e boa caçada, Herói!
    tasks:
      - get: Thaumcraft:ItemResource:9 x9
    rewards:
      - loot: incomum

  - id: matematica_varinhas
    title: "A Matemática das Varinhas"
    type: info
    deps: [varinha_greatwood]
    icon: Thaumcraft:WandCap:1
    desc: |
      §eCapacidade (vis por primal):§r madeira 25 · greatwood 50 · hastes primais 75 ·
      silverwood 100 · cajado de greatwood 125 · cajados primais 175 · cajado de silverwood 250.

      §eFator das pontas:§r ferro 110% · cobre 110% (100% em Ordo/Perditio) · ouro 100% · prata
      100% (95% nos 4 elementais) · táumio 90% · metal do vazio 80%.

      §eCusto de montar (cada primal):§r custo da ponta × custo da haste. Ferro 1, ouro 3,
      táumio 6, vazio 9; madeira 1, greatwood 3, primais 6, silverwood 9.

      Robes, óculos e outras peças somam descontos extras.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: primeira_essencia
    title: "Frasco de Essência"
    type: normal
    deps: [alambique]
    icon: Thaumcraft:ItemEssence:1
    desc: |
      Clique com um Frasco de Vidro vazio num alambique (ou jarro) com pelo menos 8 de essência: sai um §eFrasco de Essência§r. Frascos movem essência à mão e aplicam símbolos em estandartes.

      Pegue qualquer um. É o momento de ver sua destilação dando frutos, Herói! Se algo não funcionar, confira o NEI (R/U). Bom trabalho!
    tasks:
      - get: Thaumcraft:ItemEssence:1
    rewards:
      - xp: 2
      - item: Thaumcraft:ItemEssence x8

  - id: vidro_espelhado
    title: "Vidro Espelhado"
    type: normal
    deps: [cinabrio, mesa_arcana]
    icon: Thaumcraft:ItemResource:10
    desc: |
      Mercúrio + painel de vidro na Mesa Arcana (sem forma, 10 Ignis e 10 Terra) = §eVidro Espelhado§r. Ele é a base dos Espelhos Mágicos, do Verificador de Sanidade e de vários itens de addons (Transvector Dislocator, Focus de Distorção...).

      Faça 2 vidros. Confira o NEI (R/U) se esquecer alguma coisa. Está ficando brilhante, Herói!
    tasks:
      - get: Thaumcraft:ItemResource:10 x2
    rewards:
      - xp: 2
      - item: minecraft:glass_pane x16

  - id: espelho_mao
    title: "Espelho Mágico de Mão"
    type: optional
    deps: [espelho_magico]
    icon: Thaumcraft:HandMirror
    desc: |
      Um espelho portátil que §eenvia§r itens do seu inventário para o espelho ligado (só envia, não recebe). Depósito remoto para mineração longe de casa! Vai ser seu melhor amigo nas expedições.

      Missão opcional, mas muito prática. Faça o espelho e ligue ao espelho da sua base. Confira a receita no NEI (R/U) se precisar. Boa exploração, Herói!
    tasks:
      - get: Thaumcraft:HandMirror
    rewards:
      - loot: comum

  - id: gradil
    title: "Gradil de Itens"
    type: optional
    deps: [mesa_arcana]
    icon: Thaumcraft:blockMetalDevice:5
    desc: |
      Uma grade de ferro sobre um alçapão: aberto, deixa itens caírem através; fechado, segura. Abre com a mão ou redstone. Ótimo para separar itens de mobs em fazendas.

      Missão opcional, mas facilita muito quem tem farm de monstros. Faça um e teste com redstone. Se precisar da receita, aperte R no NEI. Boa engenharia, Herói!
    tasks:
      - get: Thaumcraft:blockMetalDevice:5
    rewards:
      - loot: comum

  - id: jukebox_arcana
    title: "Ouvido Arcano"
    type: optional
    deps: [oculos]
    icon: Thaumcraft:blockWoodenDevice:1
    desc: |
      O "Arcane Ear" (o jogo chama de Jukebox Arcana) escuta blocos musicais próximos e emite um pulso de redstone quando ouve a nota certa. Afina-se como um bloco musical. Redstone sem fios, à moda dos magos!

      Missão opcional, mas divertida para criar portas secretas e circuitos criativos. Confira a receita no NEI (R/U) se precisar. Faça música com a magia, Herói!
    tasks:
      - get: Thaumcraft:blockWoodenDevice:1
    rewards:
      - loot: comum

  - id: estandarte
    title: "Estandartes Taumaturgicos"
    type: optional
    deps: [primeira_essencia]
    icon: Thaumcraft:blockWoodenDevice:8
    desc: |
      Lã, gravetos e uma laje na Mesa Arcana = um estandarte. Clique nele com um Frasco de Essência para bordar o símbolo do aspecto. Pura decoração, e o seu laboratório merece!

      (A pesquisa aparece ao examinar um estandarte.) Missão opcional, então solte a criatividade. Se faltar algo, aperte R no NEI. Deixe o laboratório com a sua cara, Herói!
    tasks:
      - get: Thaumcraft:blockWoodenDevice:8
    rewards:
      - loot: comum

  - id: arco_osso
    title: "Arco de Osso"
    type: optional
    deps: [estilhaco_perditio, mesa_arcana]
    icon: Thaumcraft:ItemBowBone
    desc: |
      Ossos, barbante e um estilhaço de entropia: o §eArco de Osso§r atira muito mais rápido, e as flechas voam mais longe e mais forte. Um upgrade e tanto para qualquer arqueiro!

      A pesquisa aparece ao examinar um arco comum. Missão opcional, mas divertida para quem gosta de combate à distância. Confira a receita no NEI (R/U) se precisar. Boa mira, Herói!
    tasks:
      - get: Thaumcraft:ItemBowBone
    rewards:
      - loot: comum

  - id: flechas_primais
    title: "Flechas Primais"
    type: optional
    deps: [arco_osso]
    icon: Thaumcraft:PrimalArrow:1
    desc: |
      8 flechas em volta de um estilhaço = 8 §eFlechas Primais§r: Ar ignora armadura, Fogo incendeia, Água deixa lento, Terra bate mais forte, Ordem enfraquece e Entropia murcha o alvo.

      Elas não podem ser recolhidas do chão, então use com sabedoria. Faça qualquer tipo. Missão opcional; escolha o efeito que mais combina com seu estilo, Herói. Confira o NEI (R/U) se precisar!
    tasks:
      - one_of: [Thaumcraft:PrimalArrow, Thaumcraft:PrimalArrow:1, Thaumcraft:PrimalArrow:2, Thaumcraft:PrimalArrow:3, Thaumcraft:PrimalArrow:4, Thaumcraft:PrimalArrow:5]
    rewards:
      - loot: comum

  - id: berloques_mundanos
    title: "Berloques Mundanos"
    type: normal
    deps: [mesa_arcana]
    icon: Thaumcraft:ItemBaubleBlanks
    desc: |
      Na bancada comum: §eAmuleto Mundano§r (barbante e ouro), §eAnel Mundano§r (pepitas de ouro) e §eCinto Mundano§r (couro e ouro). Sozinhos não fazem nada, mas são a base dos amuletos de vis, da proteção rúnica e da Bolsa de Focos.

      Faça um de cada. Eles ainda vão ser bem aproveitados, Herói. Confira o NEI (R/U) se precisar!
    tasks:
      - get: [Thaumcraft:ItemBaubleBlanks, Thaumcraft:ItemBaubleBlanks:1, Thaumcraft:ItemBaubleBlanks:2]
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x4

  - id: grilhao_golem
    title: "Grilhão de Golem"
    type: optional
    deps: [golem_pedra]
    icon: Thaumcraft:blockCosmeticSolid:9
    desc: |
      Um bloco de pedra arcana que, com redstone, §eparalisa§r qualquer golem que passar por cima até o sinal desligar. Perfeito para manutenção ou para criar "portões" na rota dos seus operários.

      Missão opcional, mas ajuda a manter seus golens sob controle. Faça um e teste com redstone. Se precisar da receita, aperte R no NEI. Divirta-se, Herói!
    tasks:
      - get: Thaumcraft:blockCosmeticSolid:9
    rewards:
      - loot: comum

  - id: petisco_carne
    title: "Surpresa Tripla de Carne"
    type: optional
    deps: [fornalha_infernal]
    icon: Thaumcraft:TripleMeatTreat
    desc: |
      A Fornalha Infernal às vezes solta §enuggets de carne§r como bônus ao assar comida. Três nuggets diferentes + açúcar = §eSurpresa Tripla de Carne§r. Eu não sei o que é, mas o cheiro é ótimo!

      Faça uma! Missão opcional e bem divertida. Se precisar conferir a receita, aperte R no NEI. Bom apetite, Herói!
    tasks:
      - get: Thaumcraft:TripleMeatTreat
    rewards:
      - loot: comum

  - id: pepitas_taumio
    title: "Pepitas de Táumio"
    type: normal
    deps: [taumio]
    icon: Thaumcraft:ItemNugget:6
    desc: |
      Uma barra de Táumio na bancada = 9 §ePepitas de Táumio§r. Elas fazem as pontas de táumio e servem para ajustar receitas sem desperdiçar barras inteiras. Muito útil!

      Junte §e18§r pepitas. É só quebrar as barras na bancada, uma de cada vez. Se precisar de ajuda com a receita, aperte R no NEI. Mãos à obra, Herói!
    tasks:
      - get: Thaumcraft:ItemNugget:6 x18
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x4

  - id: bloco_carne
    title: "Bloco de Carne"
    type: optional
    deps: [golem_madeira]
    icon: Thaumcraft:blockTaint:2
    desc: |
      Nove carnes podres = um §eBloco de Carne§r (e, com o Salis Arcana, dá para desfazer). Ele é o catalisador do Golem de Carne e aparece em terras maculadas. Nojento, mas útil!

      Missão opcional: junte as carnes na bancada e monte o bloco. Confira os detalhes no NEI (R/U) se precisar. Vai encarar, Herói? Boa sorte!
    tasks:
      - get: Thaumcraft:blockTaint:2
    rewards:
      - loot: comum

  - id: duplicacao_pesquisa
    title: "Duplicação de Pesquisa"
    type: info
    deps: [pesquisador]
    icon: Thaumcraft:ItemResearchNotes
    desc: |
      Depois de Mestre em Pesquisas vem a §eDuplicação de Pesquisa§r: na Mesa de Pesquisa, uma
      nota completa ganha um ícone de estrela. Clique (com papel, tinta e os aspectos) para
      copiar a nota — ótimo para dar uma pesquisa a um amigo. Cada cópia fica mais cara.

      Neste pack o Salis Arcana deixa duplicar direto pelo Taumonomicon também.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: fluxo
    title: "Fluxo: a Sujeira da Magia"
    type: info
    deps: [laboratorio_alquimico]
    icon: Thaumcraft:blockFluxGoo
    desc: |
      Magia desperdiçada vira §cfluxo§r: §eGosma de Fluxo§r (líquido roxo) e §eGás de Fluxo§r.
      Encostar dá §cGripe de Fluxo§r, que faz a varinha gastar mais vis. Pior: neste pack o
      fluxo parado pode §cmacular o bioma§r em volta.

      Fontes comuns: essência esquecida no Crisol, Fornalha Infernal, infusões instáveis.
      Limpe colocando blocos por cima ou, mais tarde, com o §eLavador de Fluxo§r (Capítulo II)
      e a Pá do Purificador (Forbidden Magic).
    tasks:
      - check
    rewards:
      - xp: 1
