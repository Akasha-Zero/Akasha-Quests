    desc: |
      Histórias falam de estruturas no fundo do oceano — e são verdadeiras. O §eOcean Temple§r
      do ChromatiCraft é maior do que parece e §cnão é amigável§r. Leve respiração aquática.
      (Descoberta "Ocean Temples"; libera também o Crystal Tank.)
    tasks:
      - check
    rewards:
      - xp: 3
      - loot: incomum

  - id: estrutura_deserto
    title: "Sandy Burrows"
