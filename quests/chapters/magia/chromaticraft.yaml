    rewards:
      - xp: 4
      - choice: [minecraft:cooked_beef x16, minecraft:glowstone x8, minecraft:compass]

  - id: luma
    title: "Ethereal Luma"
    type: normal
    deps: [penhascos_luminosos]
    icon: ChromatiCraft:chromaticraft_item_bucket:3
    desc: |
      Bem fundo sob os penhascos, perto de fendas que soltam gases, há poças de um líquido "de
      energia e de espaço": a §eLuma Etérea§r. Encha um balde (descoberta "Ethereal Luma").
    tasks:
      - get: ChromatiCraft:chromaticraft_item_bucket:3
    rewards:
      - xp: 3
      - item: minecraft:bucket x2

  - id: floresta_ender
    title: "Ender Forest"
    type: optional
    deps: [lexico]
    icon: ChromatiCraft:chromaticraft_item_bucket:1
    desc: |
      Uma floresta com poças de §eEssência Líquida de Ender§r, que arremessa quem encosta numa
      direção aleatória. Encha um balde: ela é útil em tudo que envolve viajar pelo espaço.
    tasks:
      - visit: {dim: 0, biome: 47, name: "Ender Forest"}
      - get: ChromatiCraft:chromaticraft_item_bucket:1
    rewards:
      - loot: incomum

  - id: estrutura_caverna
    title: "Buried Hollows"
