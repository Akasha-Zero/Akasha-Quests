    title: "Portal Tuning"
    type: info
    deps: [proxima]
    icon: ChromatiCraft:chromaticraft_block_portal
    desc: |
      No começo o portal está "fora de fase", como um rádio mal sintonizado: áreas inteiras
      ficam inacessíveis e várias formações não podem ser usadas. O Léxico (página "Portal
      Tuning") explica como afinar essa sintonia para interagir de verdade com o mundo.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: planicies_cristal
    title: "Crystal Plains"
    type: normal
    deps: [proxima]
    icon: ChromatiCraft:chromaticraft_block_crystal:15
    desc: |
