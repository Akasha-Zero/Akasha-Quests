    tasks:
      - check
    rewards:
      - xp: 3
      - loot: incomum

  - id: torre_dados
    title: "Glowing Towers"
    type: optional
    deps: [ruinas]
    icon: ChromatiCraft:chromaticraft_item_datacrystal
    desc: |
      Torres antigas coroadas por um cristal luminoso cheio de informação: as §eAncient Data
      Towers§r. O §eMemory Crystal§r delas serve de cinzel (Inscrição) e para mapas de artefatos.
    tasks:
      - get: ChromatiCraft:chromaticraft_item_datacrystal
    rewards:
      - loot: incomum

  - id: artefato
    title: "Unknown Artefact"
    type: optional
    deps: [ruinas]
    icon: ChromatiCraft:chromaticraft_item_artefact
    desc: |
      Em certas regiões, raramente, há uma "coisa" em forma de estrela enterrada logo abaixo da
      superfície. §cÉ perigosa de carregar§r (os aldeões que o digam). O Léxico guarda segredos
