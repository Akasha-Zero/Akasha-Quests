    tasks:
      - get: ChromatiCraft:chromaticraft_item_artefact:*
    rewards:
      - loot: incomum

  - id: colmeia_cristal
    title: "Crystal Hives"
    type: optional
    deps: [ruinas]
    icon: ChromatiCraft:chromaticraft_block_hive
    desc: |
      Abelhas no escuro? Há colmeias cristalinas subterrâneas com abelhas adaptadas (integração
      com Forestry). Encontre uma §eCrystal Hive§r — ela libera pesquisas de abelhas.
    tasks:
      - get: ChromatiCraft:chromaticraft_block_hive:*
    rewards:
      - loot: incomum

  - id: caverna_funda
    title: "Lower Layers"
    type: normal
    deps: [cristais_caverna]
    icon: minecraft:stone_pickaxe
    desc: |
      As cavernas descem muito mais do que parece. Explore um sistema de cavernas bem fundo
      (descoberta "Lower Layers") e depois chegue à §erocha matriz§r, "a barreira impenetrável"
      (descoberta "World Floor"). O código encadeia: cavernas fundas → rocha matriz → Nether →
      Fim.
    tasks:
      - check
    rewards:
      - xp: 3
      - item: minecraft:torch x32

  - id: nether_cc
    title: "The Evil Realm"
    type: normal
    deps: [caverna_funda]
    icon: minecraft:netherrack
    desc: |
      "Então as histórias de portais de obsidiana para um pesadelo de fogo eram verdade..."
      Entre no Nether (descoberta "The Evil Realm"). Para o ChromatiCraft, ela só conta depois de
      você ter chegado à rocha matriz.
    tasks:
      - visit: {dim: -1, name: "Nether"}
    rewards:
      - xp: 3
      - item: minecraft:fire_charge x4

  - id: teto_nether
    title: "A second layer"
    type: normal
    deps: [nether_cc, ruinas]
    icon: ChromatiCraft:chromaticraft_item_netherkey
    desc: |
      O Nether tem um teto de rocha matriz. Ele é impenetrável? Não para você. Chegue §eacima do
      teto do Nether§r (descoberta "A second layer") — o §eNether Layer Crystal§r ajuda — e
      procure as §econstruções sinistras§r que cruzam o topo (descoberta "Ominous
      Constructions"). Ambas são requisitos do outro mundo.
    tasks:
      - check
    rewards:
      - xp: 4
      - loot: incomum

  - id: fim_cc
    title: "The Alien Realm"
    type: normal
    deps: [nether_cc]
    icon: minecraft:end_stone
    desc: |
      "Nada poderia ser mais estranho que aquele mundo de lava e águas-vivas voadoras..." Pode.
      Visite o Fim (descoberta "The Alien Realm") — mais um requisito do outro mundo.
    tasks:
      - visit: {dim: 1, name: "O Fim"}
    rewards:
      - xp: 4
      - item: minecraft:ender_pearl x8

  - id: dragao_cc
    title: "Aerial Predator"
    type: optional
    deps: [fim_cc]
    icon: minecraft:dragon_egg
    desc: |
      Um dragão gigante cuja destruição dá recompensa "física e conceitual". Derrote o §eDragão
      do Ender§r (descoberta "Aerial Predator"). O Léxico também lembra dos cristais do Fim: o
      §eEnder Crystal§r do ChromatiCraft permite pegá-los sem explodir.
    tasks:
      - kill: "EnderDragon x1"
    rewards:
      - xp: 8
      - loot: raro

  - id: wither_cc
    title: "Eldritch Nightmare"
    type: optional
    deps: [nether_cc]
    icon: minecraft:nether_star
    desc: |
      "Quatro areias das almas, três crânios de wither..." O §eWither§r solta uma estrela
      misteriosa e valiosa — que, por acaso, é o centro da Auroral Battery do ElectriCraft.
    tasks:
      - kill: "WitherBoss x1"
    rewards:
      - xp: 8
      - loot: raro

  - id: spawner_cc
    title: "Endless Mobs"
    type: optional
    deps: [ruinas]
    icon: minecraft:mob_spawner
    desc: |
      "O que é essa caixa em chamas?" Encontre um spawner e destrua-o (descobertas "Endless Mobs"
      e "Stopping the Torrent"), o que libera o Spawner Interference Crystal e outros truques.
    tasks:
      - check
    rewards:
      - loot: comum

  - id: pronto_para_proxima
    title: "Todas as Pistas"
    type: milestone
    deps: [todas_as_cores, fim_cc, teto_nether, cristal_poder, floresta_arco_iris, penhascos_luminosos, estrutura_caverna, estrutura_toca, estrutura_oceano, estrutura_deserto, estrutura_neve]
    icon: ChromatiCraft:chromaticraft_block_portal
    banner: "Todas as Pistas"
    subtitle: "Os requisitos do outro mundo"
    desc: |
      O código do ChromatiCraft é claro: a descoberta "Other Worlds" exige §etodas§r estas
      pistas — as 16 cores, o Fim, as construções acima do teto do Nether, o Power Crystal, a
      Rainbow Forest, os Luminous Cliffs e as cinco estruturas geradas (Shrine, Burrow, Ocean
      Temple, Sandy Burrow e Frozen Outpost).

      Você juntou cada página solta, Herói. Agora o Léxico consegue descrever um mundo onde a
      energia cristalina flui livre, "sem a influência corruptora de outras forças".
    tasks:
      - check
    rewards:
      - xp: 12
      - kit: {name: "Kit do Explorador Cromático", items: [ChromatiCraft:chromaticraft_item_bucket x4, ore:shardCrystal x32, minecraft:golden_apple x2, minecraft:ender_pearl x8]}
      - loot: epico

  # ======================================================================
  # FASE 13 — PROXIMA (DIMENSÃO 60)
  # ======================================================================
  - id: portal_proxima
    title: "Portal Rift"
    type: main
    deps: [pronto_para_proxima]
    icon: ChromatiCraft:chromaticraft_block_portal
    desc: |
      Falar de um mundo especial não adianta sem um jeito de chegar lá. O §ePortal§r é uma
      receita de Pylon com a sua estrutura própria (Portal Beacon, no Léxico). Monte-o.
    tasks:
      - get: ChromatiCraft:chromaticraft_block_portal
    rewards:
      - xp: 8
      - choice: [ChromatiCraft:chromaticraft_block_pylonstruct x64, ChromatiCraft:chromaticraft_item_bucket x4, ore:shardCrystal x32]

  - id: proxima
    title: "Other Worlds"
    type: portal
    deps: [portal_proxima]
    icon: ChromatiCraft:chromaticraft_block_portal
    banner: "Proxima"
    subtitle: "O mundo das cores livres"
    desc: |
      Um mundo novo... estranho, mas calmo e sereno, e vivamente colorido: §eProxima§r (dimensão
      60). Planícies e florestas de cristal, montanhas, oceanos de aura, ilhas flutuantes.

      §cAtenção ao principal:§r o Léxico chama este mundo de §evolátil§r — até ser observado, ele
      existe num estado indefinido, e §cnão persiste entre visitas§r. Recursos infinitos, sim;
      mas §cnada que você deixar lá estará lá quando voltar§r. E entrar e sair é por meios
      incomuns. Não construa a sua base aqui!
    tasks:
      - visit: {dim: 60, name: "Proxima"}
    rewards:
      - xp: 10
      - loot: epico

