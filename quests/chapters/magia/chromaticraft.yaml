  # ======================================================================
  # FASE 10 — RITUAIS E HABILIDADES
  # ======================================================================
  - id: mesa_ritual
    title: "Ritual Table"
    type: main
    deps: [energia_interna, mesa_fundicao]
    icon: ChromatiCraft:chromaticraft_item_placer:16
    desc: |
      Habilidades especiais exigem infundir grandes quantidades de energia em você — com um
      ritual. A §eRitual Table§r é uma receita básica da mesa; o §eRitual Altar§r em volta dela
      (estrutura no Léxico) e a energia dos Pylons fazem o resto.
    tasks:
      - get: ChromatiCraft:chromaticraft_item_placer:16
    rewards:
      - xp: 4
      - choice: [ChromatiCraft:chromaticraft_block_pylonstruct x32, ore:shardCrystal x16, minecraft:golden_apple]

  - id: info_habilidades
    title: "As Habilidades"
    type: info
    deps: [mesa_ritual]
    icon: ChromatiCraft:chromaticraft_item_abilityfocus
    desc: |
      Em vez de carregar 41 ferramentas, imbua o próprio corpo com poderes acionáveis, movidos
      pela sua energia pessoal. Alguns exemplos (nomes do jogo): §eReach Boost§r, §eMagnetism§r,
      §eHealth Boost§r, §eDexterity§r, §eWater Strider§r, §eArrow Shield§r, §eRegeneration§r,
      §eLumen Dash§r, §ePylon Surge Protection§r e §eItem Preservation§r.

      Cada ritual pede energia de certas cores (veja no Léxico). Use a tecla de seleção de
      habilidades para ligar e desligar.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: primeira_habilidade
    title: "Personal Enhancement"
    type: milestone
    deps: [info_habilidades, ligacao_pylon]
    icon: ChromatiCraft:chromaticraft_item_placer:16
    banner: "Personal Enhancement"
    subtitle: "A primeira habilidade"
    desc: |
      "Máquinas você melhora. Ferramentas você encanta. Você mesmo?" Realize o seu primeiro
      ritual de habilidade (descoberta "Personal Enhancement"). O código só libera isso
      depois de você ter internalizado energia de um Pylon §ee§r dominado a fundição de Pylon.

      Comece por algo útil e barato — muita gente escolhe Pylon Surge Protection para parar de
      levar choque, ou Reach Boost.
    tasks:
      - check
    rewards:
      - xp: 10
      - kit: {name: "Kit do Ritualista", items: [ChromatiCraft:chromaticraft_item_berry:13 x16, ChromatiCraft:chromaticraft_item_berry:11 x16, minecraft:golden_apple x2]}
      - loot: raro

  - id: foco_energia
    title: "Energy Focus"
    type: optional
    deps: [energia_interna, templo_fundicao]
    icon: ChromatiCraft:chromaticraft_item_placer:49
    desc: |
      Voar até cada Pylon para recarregar é cansativo. O §eEnergy Focus§r é uma imitação de Pylon
      só para carregar §evocê§r (não alimenta outras construções) — e é bonito na sala.
    tasks:
      - get: ChromatiCraft:chromaticraft_item_placer:49
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 11 — CRISTAIS DE PODER E A ÁRVORE LÚMEN
  # ======================================================================
  - id: cristal_poder
    title: "Power Crystal"
    type: main
    deps: [ligacao_pylon, carregador, energia_interna, cristal_iridescente]
    icon: ChromatiCraft:chromaticraft_item_placer:21
    desc: |
      Pylons não são infinitos: perdem a cor ao serem drenados e recarregam devagar. Os §ePower
      Crystals§r — energia elemental crua em forma de cristal — aceleram muito a recarga, e §eum
      anel completo e equilibrado de 8§r em volta do Pylon acelera enormemente (descoberta
      "Recharge").

      No código, essa descoberta pede fundição de Pylon, cristal de armazenamento, energia
      internalizada e a infusão.
    tasks:
      - get: ChromatiCraft:chromaticraft_item_placer:21
    rewards:
      - xp: 6
      - choice: [ChromatiCraft:chromaticraft_item_crafting:10 x2, ChromatiCraft:chromaticraft_item_bucket x4, ore:shardCrystal x32]

  - id: anel_poder
    title: "Anel de Recarga"
    type: normal
    deps: [cristal_poder]
    icon: ChromatiCraft:chromaticraft_item_placer:21
    desc: |
      Um cristal ajuda; oito em anel, balanceados, transformam o Pylon. Faça os §e8 Power
      Crystals§r do anel do seu Pylon mais usado.
    tasks:
      - get: ChromatiCraft:chromaticraft_item_placer:21 x8
    rewards:
      - xp: 4
      - item: ChromatiCraft:chromaticraft_block_pylonstruct x32

  - id: arvore_lumen
    title: "Luminescent Battery"
    type: main
    deps: [cristal_poder]
    icon: ChromatiCraft:chromaticraft_item_placer:36
    desc: |
      Uma bateria que §ecresce§r: o §eLuminescent Battery§r é a base da §eLumen Tree§r, cujas
      folhas guardam energia (capacidade cresce com o número de folhas). Ela §eprecisa ver o
      céu§r e de energia pura. Das folhas dá até para se recarregar — mas quebrar uma folha
      perde a energia guardada nela. Descoberta "Stockpiling Energy".
    tasks:
      - get: ChromatiCraft:chromaticraft_item_placer:36
    rewards:
      - xp: 6
      - choice: [ChromatiCraft:chromaticraft_item_bucket x4, ChromatiCraft:chromaticraft_item_shard:26 x8, ore:shardCrystal x32]

  # ======================================================================
  # FASE 12 — EXPLORAÇÃO (OS REQUISITOS DO OUTRO MUNDO)
  # ======================================================================
  - id: floresta_arco_iris
    title: "Magical Forests"
    type: main
    deps: [arvores_tingidas]
    icon: ChromatiCraft:chromaticraft_block_rainbowsapling
    desc: |
      Dizem que há florestas inteiras de árvores coloridas, com magia forte o bastante para
      afastar o mal. Encontre uma §eRainbow Forest§r (bioma do ChromatiCraft; nesta config os
      animais lá são calmos e plantas anti-Taint crescem nela). Descoberta "Magical Forests".
    tasks:
      - visit: {dim: 0, biome: 48, name: "Rainbow Forest"}
    rewards:
      - xp: 4
      - choice: [minecraft:cooked_beef x16, minecraft:sapling x8, minecraft:compass]

  - id: arvore_arco_iris
    title: "Rainbow Tree"
    type: normal
    deps: [floresta_arco_iris]
    icon: ChromatiCraft:chromaticraft_block_rainbowleaf:1
    desc: |
      Às vezes surgem árvores enormes em forma de chama, com folhas de todas as cores: as
      §eRainbow Trees§r. Elas limpam e estabilizam o ar em volta (o Léxico lembra da "praga roxa"
      do Thaumcraft...) e suas folhas podem soltar maçãs douradas. Pegue uma §eRainbow Sapling§r.
    tasks:
      - get: ChromatiCraft:chromaticraft_block_rainbowsapling
    rewards:
      - xp: 3
      - item: minecraft:golden_apple

  - id: residuo_magico
    title: "Muddy Residue"
    type: optional
    deps: [arvore_arco_iris]
    icon: ChromatiCraft:chromaticraft_block_mud
    desc: |
      Sob as árvores arco-íris, o chão fica §elamacento§r com resíduos de um líquido mágico. O
      Léxico sugere que esse solo "regado por magia" ajuda certas plantas. Colete um pouco.
    tasks:
      - get: ChromatiCraft:chromaticraft_block_mud
    rewards:
      - loot: comum

  - id: penhascos_luminosos
    title: "Glowing Terraces"
    type: main
    deps: [lexico]
    icon: ChromatiCraft:chromaticraft_block_cliffstone:2
    desc: |
      Nem toda região mágica é floresta. Os §eLuminous Cliffs§r são penhascos em terraços com uma
