    tasks:
      - get: ChromatiCraft:chromaticraft_item_shard:7 x4
    rewards:
      - xp: 2
      - item: ChromatiCraft:chromaticraft_item_berry:7 x2

  - id: elemento_ykri
    title: "Ykri"
    type: normal
    deps: [cristais_caverna]
    icon: ChromatiCraft:chromaticraft_item_shard:8
    desc: |
      §dYkri§r é o elemento cinza.
      Segundo o Léxico, ele representa o fluxo, a mudança.

      Encontre um §eCristal de Caverna cinza§r no subsolo e quebre-o para obter §e4 Fragmentos
