    type: normal
    deps: [boneco, gota_sorte, vapor_diamante]
    icon: witchery:poppet:5
    desc: |
      Boneco + Fedor do Infortúnio e Gota de Sorte = Boneco de §eProteção de Ferramenta§r
      (salva a ferramenta de quebrar). Com Vapor de Diamante embaixo = de §eProteção de
      Armadura§r. Mostre os dois!
    tasks:
      - get: [witchery:poppet:5, witchery:poppet:11]
    rewards:
      - xp: 3
      - item: minecraft:iron_ingot x8

  - id: boneco_morte
    title: "Boneco de Proteção da Morte"
    type: main
    deps: [boneco, gota_sorte, vapor_diamante]
    icon: witchery:poppet:6
    desc: |
      Boneco + Gota de Sorte, Vapor de Diamante e pepitas de ouro. §eImpede a sua morte uma
      vez§r (e se gasta). Herói, faça um e carregue sempre. Eu insisto. Por favor.
    tasks:
      - get: witchery:poppet:6
    rewards:
      - xp: 4
      - choice: [minecraft:golden_apple x2, witchery:ingredient:39 x1, witchery:ingredient:29 x2]

  - id: boneco_vodu
    title: "Boneco Vodu"
    type: optional
    deps: [boneco]
    icon: witchery:poppet:8
    desc: |
      Boneco + Beladona, Mandrágora, Exalação do Chifrudo e olho fermentado. Ligado a um
      taglock, o que acontece com o boneco acontece com o alvo. §cÉ o boneco mais perigoso
      que existe — use em mobs, ou com consentimento.§r
    tasks:
      - get: witchery:poppet:8
    rewards:
      - loot: comum

