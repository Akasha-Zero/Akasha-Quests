      Herói, você tem um Altar pulsando, giz branco, giz dourado e o livro de Magia de
      Círculo. Isso já é uma bruxa (ou um bruxo) de verdade — com chapéu ou sem!

      O rito mais simples para treinar é o §eRito da Santidade§r: círculo pequeno branco,
      uma pena e uma redstone. Depois vem a §ePedra Sintonizada Carregada§r, que permite
      ritos longe do altar.

      Prometa uma coisa: nada de maldições em quem não merece. Combinado?
    tasks:
      - get: [witchery:chalkheart, witchery:chalkritual, witchery:altar]
    rewards:
      - xp: 8
      - kit: {name: "Kit da Bruxa Aprendiz", items: [witchery:chalkritual x2, witchery:ingredient:37 x2, witchery:ingredient:27 x8, minecraft:feather x8, minecraft:redstone x16]}
      - loot: raro

