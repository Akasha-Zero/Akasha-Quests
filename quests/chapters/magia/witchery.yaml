    title: "Pedra Necromântica"
    type: main
    deps: [po_espectral, primeiro_rito]
    icon: witchery:ingredient:64
    desc: |
      Hora de mexer com os mortos! No Rito da Necromancia, §eà noite§r, círculo pequeno branco: Pedra Sintonizada, osso, carne podre, Cinza, espada de ferro e Pó Espectral (1000 de poder). A §ePedra Necromântica§r comanda mortos-vivos e é foco de muitos ritos sombrios (Encarnação Anterior, Manifestação, Braseiro, Pedra Espectral...).
      Confira no NEI (R/U), Herói.
    tasks:
      - get: witchery:ingredient:64
    rewards:
      - xp: 4
      - choice: [minecraft:bone x32, minecraft:rotten_flesh x16, witchery:ingredient:66 x2]

  - id: rito_encarnacao
    title: "Rito da Encarnação Anterior"
    type: optional
    deps: [pedra_necromantica, giz_infernal]
    icon: minecraft:skull
    desc: |
      O seguro de vida das bruxas! Círculo pequeno infernal: Pedra Necromântica, Língua de Cão, osso, Pó Espectral e Pedra Carregada. Invoca uma encarnação anterior de um jogador §ecom os itens que ele tinha§r, perto de onde morreu.
      É opcional, Herói, mas pode salvar o seu dia. Se precisar do desenho, aperte R ou U no NEI ou consulte o livro Circle Magic.
    tasks:
      - check
    rewards:
      - loot: incomum

  - id: invocar_bruxa
    title: "Rito de Invocação: Bruxa"
    type: normal
    deps: [giz_infernal, arthana, vapor_diamante]
    icon: minecraft:fermented_spider_eye
    desc: |
      Vai encarar uma bruxa de verdade? Círculo pequeno infernal: Vapor de Diamante, Exalação do Chifrudo, creme de magma, Arthana e olho de aranha fermentado (2000 de poder). Uma bruxa aparece — §chostil§r. O interior do círculo precisa estar livre (7×7×4)!
      Prepare-se e derrote §e1 bruxa§r, Herói. Você consegue!
    tasks:
      - kill: {entity: "Witch", count: 1}
    rewards:
      - xp: 3
      - item: minecraft:glass_bottle x8

  - id: invocar_diabrete
    title: "Rito de Invocação: Diabrete"
    type: normal
    deps: [giz_infernal, mal_refinado, sangue_infernal]
    icon: witchery:ingredient:140
    desc: |
      Círculo médio infernal: Mal Refinado, Sangue Demoníaco, pérola do Ender e Pedra
      Sintonizada (5000 de poder). Surge um §eDiabrete das Chamas§r (Flame Imp), que negocia
      §econtratos demoníacos§r: Contrato de Posse (papel, linha e Porco Estranho Cru) e suas
      variações (Blaze, Resistir ao Fogo, Evaporação, Toque Ígneo, Fundição). Mostre um
      Contrato Demoníaco.
    tasks:
      - get: witchery:ingredient:140
    rewards:
      - xp: 3
      - item: minecraft:paper x16

  - id: invocar_demonio
    title: "Rito de Invocação: Demônio"
    type: boss
    deps: [giz_infernal, mal_refinado]
    icon: witchery:ingredient:23
    banner: "Demônio Invocado"
    subtitle: "Do Poço, com fome"
    desc: |
      §cIsto é sério, Herói.§r Círculo §egrande infernal§r: Mal Refinado, pó de blaze e pérola
      do Ender, mais o sacrifício de um §ealdeão vivo§r dentro do círculo (3000 de poder). A
      versão "cara" troca o aldeão por vara de blaze e duas Pedras Sintonizadas (uma
      carregada). O interior precisa estar livre 7×7×4.

      O Demônio é forte e lança fogo. Derrote-o com a §eArthana§r na mão para ter 33% de
      chance de §eCoração de Demônio§r. Para mandá-lo de volta sem lutar, existe o §eRito do
      Banimento§r (pó de blaze + Pedra de Caminho, círculo pequeno branco).
    tasks:
      - kill: {entity: "witchery.demon", count: 1}
    rewards:
      - xp: 8
      - loot: raro

  - id: coracao_demonio
    title: "Coração de Demônio"
    type: normal
    deps: [invocar_demonio]
    icon: witchery:ingredient:23
    desc: |
      Um §eCoração de Demônio§r ainda batendo, que nojo bonito! Ele é fonte enorme de poder para o altar (como bloco colocado perto), e na Destilaria vira §eSangue Demoníaco§r. §cBeber? Pega fogo.§r
      Guarde com carinho, Herói, e não ceda à tentação. Se quiser ver onde mais ele entra, confira no NEI (R/U). Bom proveito!
    tasks:
      - get: witchery:ingredient:23
    rewards:
      - xp: 3
      - item: minecraft:blaze_rod x2

  - id: sangue_infernal
    title: "Sangue Demoníaco"
    type: normal
    deps: [destilaria]
    icon: witchery:ingredient:80
    desc: |
      Destile §eCoração de Demônio + Vapor de Diamante§r (4 jarros) para 4 Sangues
      Demoníacos e Mal Refinado; ou Coração + rocha do Nether (2 jarros) para areia das almas
      e 2 Sangues. O §eSangue Demoníaco§r está no Vínculo de Familiar, no Unguento Místico, na
      Invocação do Diabrete e nos Sapatinhos de Rubi.
    tasks:
      - get: witchery:ingredient:80 x2
    rewards:
      - xp: 2
      - item: minecraft:netherrack x16

  - id: invocar_wither
    title: "Rito de Invocação: Wither"
    type: optional
    deps: [giz_infernal, vapor_diamante]
    icon: minecraft:skull:1
    desc: |
      §cO aviso mais sério do capítulo:§r círculos médio e grande infernais, crânio de
      esqueleto Wither, Vapor de Diamante, pérola do Ender e um aldeão (4000 de poder)
      invocam um §eWither§r. Só faça longe de tudo, muito preparado e se tiver um bom
      motivo (como um Altar de Sangue de Tier 5...).
    tasks:
      - kill: {entity: "WitherBoss", count: 1}
    rewards:
      - loot: raro

  - id: inferno_terra
    title: "Maldição do Inferno na Terra"
    type: info
    deps: [invocar_demonio]
    icon: minecraft:netherrack
    desc: |
      §cNão faça isso perto da sua base. Na verdade, não faça.§r Mas é bom saber que existe:
      círculos pequeno infernal, médio do Além-Mundo e grande infernal, Sopa de Redstone,
      Coração de Demônio, Pedra de Caminho, Estrela do Nether e um aldeão, à noite, só no
      Mundo Normal, 5000 de poder + 200/s. Transforma a área num pedaço do Nether, com
      demônios. Este pack permite os incêndios dele.
    tasks:
      - check
    rewards:
      - xp: 1

  # ======================================================================
  # FASE 9 — MALDIÇÕES
  # ======================================================================
  - id: info_maldicoes
    title: "Sobre Maldições"
    type: info
    deps: [kit_taglock, brew_grotesco, brew_amor]
    icon: witchery:ingredient:71
    desc: |
      As maldições miram o dono de um §eTaglock preenchido§r. Quase todas pedem círculo
      §emédio infernal§r, §eExalação do Chifrudo§r, o Brew do Grotesco e §euma tempestade§r.

      Cada uma tem um §eRito de Remover Maldição§r (círculo pequeno branco, Sopro da Deusa,
      Brew do Amor ou das Profundezas). O livro avisa: "as coisas podem piorar".

      §cAkasha, com carinho e franqueza:§r amaldiçoar outros jogadores sem combinar é
      maldade — e em servidor pode ser contra as regras. Use em mobs, em amigos que topam a
      brincadeira, ou para aprender a se defender.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: maldicao_infortunio
    title: "Maldição do Infortúnio"
    type: optional
    deps: [info_maldicoes]
    icon: minecraft:fermented_spider_eye
    desc: |
      Quer fazer alguém ter azar? Círculo médio infernal, numa tempestade: Taglock, Exalação do Chifrudo, olho de aranha fermentado, pólvora e Brew do Grotesco (2000 de poder). O alvo passa a ter azar com tudo.
      Remoção: Sopro da Deusa, olho de aranha, pólvora e Brew do Amor. Opcional e pesado, Herói! Confira os detalhes no NEI (R/U).
    tasks:
      - check
    rewards:
      - loot: comum

  - id: maldicao_insanidade
    title: "Maldição da Insanidade"
    type: optional
    deps: [info_maldicoes]
    icon: minecraft:poisonous_potato
    desc: |
      Uma maldição para fazer o alvo ver coisas! Com a mesma base da anterior, mais batata venenosa e açúcar: o alvo começa a ver monstros que não estão lá.
      Remoção: Sopro da Deusa, batata, açúcar e Brew do Amor. É opcional, Herói, e bem pesada; pense bem antes de lançar. Se tiver dúvida do desenho do círculo, consulte o livro Circle Magic ou o NEI (R/U).
    tasks:
      - check
    rewards:
      - loot: comum

  - id: maldicao_afundamento
    title: "Maldição do Afundamento"
    type: optional
    deps: [info_maldicoes]
    icon: minecraft:dye
    desc: |
      Uma maldição que pesa! Com bolsa de tinta e verruga do Nether na mesma base das anteriores, o alvo fica pesado e afunda na água.
      Remoção: Sopro da Deusa, farinha de osso, verruga e Brew das Profundezas. É opcional, Herói, e bem sombria, então escolha com cuidado. Se algo não encaixar, consulte o livro de Circle Magic ou aperte R ou U no NEI.
    tasks:
      - check
    rewards:
      - loot: comum

  - id: maldicao_superaquecimento
    title: "Maldição do Superaquecimento"
    type: optional
    deps: [info_maldicoes, sangue_infernal]
    icon: minecraft:blaze_rod
    desc: |
      Mais uma maldição para a coleção! Com Sangue Demoníaco e vara de blaze na base do círculo, o alvo superaquece.
      Remoção: Sopro da Deusa, Agulha Gelada, vara de blaze e Brew das Profundezas. É opcional, Herói, e bem pesada, então pense antes de lançar. Se o desenho do círculo ou a quantidade de poder confundir, aperte R ou U no NEI ou consulte o livro Circle Magic.
    tasks:
      - check
    rewards:
      - loot: comum

  - id: maldicao_pesadelo
    title: "Maldição do Pesadelo Desperto"
    type: optional
    deps: [info_maldicoes, cordel_atormentado]
    icon: witchery:ingredient:101
    desc: |
      A mais cruel de todas! Com Fome Melíflua, Cordel Atormentado e diamante (10 000 de poder), o alvo é perseguido pelo próprio Pesadelo mesmo acordado.
      Remoção: Sopro da Deusa, cenoura dourada, Cordel Atormentado e Brew do Amor. É opcional, Herói, e exige muito poder no altar. Pense bem antes de usar e confira os detalhes no NEI (R/U) ou no livro Circle Magic.
    tasks:
      - check
    rewards:
      - loot: incomum

  - id: maldicao_praga
    title: "Maldições da Praga e da Cegueira"
    type: optional
    deps: [info_maldicoes, sopa_redstone, pedra_carregada]
    icon: minecraft:speckled_melon
    desc: |
      Maldições de área (sem taglock), com Pedra Carregada, Sopa de Redstone e Fedor do
      Infortúnio: a §ePraga§r (círculo médio infernal) deixa a terra infértil e adoece; a
      §eCegueira§r (círculo pequeno infernal) cega as criaturas em volta. A cura da Praga é o
      Rito da Fertilidade.
    tasks:
      - check
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 10 — BONECOS (POPPETS)
  # ======================================================================
  - id: boneco
    title: "O Boneco"
    type: main
    deps: [kit_taglock, plantas_raras]
    icon: witchery:poppet
    desc: |
      Lã, Musgo Espanhol, Agulha de Osso e linha = §eBoneco§r vazio. Ele é a base de todos os
      bonecos. A maioria dos bonecos de proteção funciona simplesmente §eestando no seu
      inventário§r (ou numa Prateleira de Bonecos) e se gasta ao proteger você.

      Para "ligar" um boneco a alguém, junte-o na bancada com um §eTaglock preenchido§r.
    tasks:
      - get: witchery:poppet
    rewards:
      - xp: 4
      - choice: [minecraft:wool x8, witchery:spanishmoss x4, minecraft:string x16]

  - id: boneco_terra
    title: "Boneco de Proteção da Terra"
    type: normal
    deps: [boneco]
    icon: witchery:poppet:1
    desc: |
      Cuidado com as quedas, Herói! Boneco + penas, argila e terra faz o Boneco de Proteção da Terra, que protege contra §edano de queda§r. Ótimo companheiro do Sigilo do Ar e da vassoura!
      É só fabricar e carregar no inventário. Se a receita não encaixar de primeira, confira no NEI (R/U) ou no manual do mod. Bom voo, e boa aterrissagem!
    tasks:
      - get: witchery:poppet:1
    rewards:
      - xp: 2
      - item: minecraft:feather x8

  - id: boneco_agua
    title: "Boneco de Proteção da Água"
    type: normal
    deps: [boneco, alcachofra]
    icon: witchery:poppet:2
    desc: |
      Respirar debaixo d'água sem susto! Boneco + Alcachofras e bolsas de tinta faz o Boneco de Proteção da Água, que protege contra §eafogamento§r.
      É só fabricar e levar no inventário, Herói, principalmente em aventuras no mar e em lagos profundos. Se a receita não encaixar de primeira, aperte R ou U no NEI ou consulte o manual do mod. Pode mergulhar sem medo!
    tasks:
      - get: witchery:poppet:2
    rewards:
      - xp: 2
      - item: minecraft:dye x4

  - id: boneco_fogo
    title: "Boneco de Proteção do Fogo"
    type: normal
    deps: [boneco, ingredientes_animais]
    icon: witchery:poppet:3
    desc: |
      Bem-vindo ao time dos bonecos! Boneco + Lã de Morcego e Musgo de Brasa faz o Boneco de Proteção do Fogo, que protege contra §efogo e lava§r. Leve um para o Nether, sempre.
      É só carregar no inventário, Herói. Se a receita não encaixar de primeira, confira no NEI (R/U) ou no manual do mod. Pode ir sem medo de queimar!
    tasks:
      - get: witchery:poppet:3
    rewards:
      - xp: 2
      - item: minecraft:blaze_powder x2

  - id: boneco_fome
    title: "Boneco de Proteção da Fome"
    type: normal
    deps: [boneco]
    icon: witchery:poppet:4
    desc: |
      Fome nunca mais atrapalha a aventura! Boneco + melancia reluzente e carne podre faz o Boneco de Proteção da Fome, que protege contra §emorrer de fome§r.
      É só fabricar e levar no inventário, Herói, e você ganha um respiro quando a comida acabar. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Boa jornada!
    tasks:
      - get: witchery:poppet:4
    rewards:
      - xp: 2
      - item: minecraft:speckled_melon x2

  - id: boneco_ferramenta
    title: "Bonecos de Ferramenta e Armadura"
    type: normal
    deps: [boneco, gota_sorte, vapor_diamante]
    icon: witchery:poppet:5
    desc: |
      Duas proteções numa quest só! Boneco + Fedor do Infortúnio e Gota de Sorte = Boneco de §eProteção de Ferramenta§r (salva a ferramenta de quebrar). Com Vapor de Diamante embaixo = de §eProteção de Armadura§r.
      Mostre os dois, Herói! Se alguma receita não encaixar, confira no NEI (R/U) ou no manual do mod. Suas ferramentas agradecem!
    tasks:
      - get: [witchery:poppet:5, witchery:poppet:11]
    rewards:
      - xp: 3
      - item: minecraft:iron_ingot x8

  - id: boneco_morte
    title: "Boneco de Proteção da Morte"
    type: main
    deps: [boneco, gota_sorte, vapor_diamante]
    icon: witchery:poppet:6
    desc: |
      Esse é daqueles que eu faço questão! Boneco + Gota de Sorte, Vapor de Diamante e pepitas de ouro faz o Boneco de Proteção da Morte. Ele §eimpede a sua morte uma vez§r (e se gasta).
      Herói, faça um e carregue sempre. Eu insisto. Por favor. Se a receita não encaixar, é só apertar R ou U no NEI. Quero você inteiro por aqui!
    tasks:
      - get: witchery:poppet:6
    rewards:
      - xp: 4
      - choice: [minecraft:golden_apple x2, witchery:ingredient:39 x1, witchery:ingredient:29 x2]

  - id: boneco_vodu
    title: "Boneco Vodu"
    type: optional
    deps: [boneco]
    icon: witchery:poppet:8
    desc: |
      Cuidado com esse! Boneco + Beladona, Mandrágora, Exalação do Chifrudo e olho fermentado faz o Boneco Vodu. Ligado a um taglock, o que acontece com o boneco acontece com o alvo.
      §cÉ o boneco mais perigoso que existe — use em mobs, ou com consentimento.§r É opcional, Herói. Se precisar da receita, aperte R ou U no NEI.
    tasks:
      - get: witchery:poppet:8
    rewards:
      - loot: comum

  - id: boneco_protecao_vodu
    title: "Proteção contra Vodu"
    type: normal
    deps: [boneco]
    icon: witchery:poppet:7
    desc: |
      Boneco + Beladona, Mandrágora, flores e cogumelos = §eBoneco de Proteção contra Vodu§r.
      Com ele no inventário (ou na prateleira), bonecos vodu e muitos ritos contra você
      falham. Com Gota de Sorte, Orvalho do Ender, ouro e Dedo de Sapo, vira a §eProteção de
      Boneco§r, que protege os seus próprios bonecos. Mostre a Proteção contra Vodu.
    tasks:
      - get: witchery:poppet:7
    rewards:
      - xp: 2
      - item: minecraft:red_mushroom x4

  - id: boneco_vampirico
    title: "Boneco Vampírico"
    type: optional
    deps: [boneco, vapor_diamante]
    icon: witchery:poppet:9
    desc: |
      Dividir o dano com quem você quiser! Boneco + Exalação do Chifrudo, Vapor de Diamante e Lã de Morcego, ligado a §edois§r taglocks, faz o Boneco Vampírico: transfere o dano de um para o outro.
      É opcional, Herói, e pede um pouco de planejamento para usar com segurança. Se a receita não encaixar, confira no NEI (R/U) ou no manual do mod.
    tasks:
      - get: witchery:poppet:9
    rewards:
      - loot: comum

  - id: prateleira_bonecos
    title: "Prateleira de Bonecos"
    type: normal
    deps: [boneco, pedra_sintonizada]
    icon: witchery:poppetshelf
    desc: |
      Uma casa para os seus bonecos! Pano verde, Pedras Sintonizadas e tijolos do Nether fazem a §ePrateleira de Bonecos§r, que guarda bonecos que continuam funcionando e mantém o chunk carregado.
      Atenção, Herói: neste pack ela só funciona no Mundo Normal e no Mundo Espiritual (config). Se a receita não encaixar, aperte R ou U no NEI. Organize os seus bonecos!
    tasks:
      - get: witchery:poppetshelf
    rewards:
      - xp: 2
      - item: minecraft:nether_brick x8

  - id: colecao_bonecos
    title: "Coleção de Bonecos"
    type: milestone
    deps: [boneco_terra, boneco_agua, boneco_fogo, boneco_fome, boneco_morte, boneco_protecao_vodu]
    icon: witchery:poppet:6
    banner: "A Bruxa dos Bonecos"
    subtitle: "Proteção para todo perigo"
    desc: |
      Terra, água, fogo, fome, morte e vodu. Herói, você agora carrega no bolso mais proteções do que muitos castelos!

      Organize-os numa §ePrateleira de Bonecos§r e lembre de refazer os que se gastam, principalmente o de §eProteção da Morte§r. Ah, e se um dia alguém usar um boneco vodu contra você... agora você sabe se defender.

      Olhe quanto caminho você percorreu até esta coleção, entre rituais, ingredientes raros e noites de bruxaria. Que marco lindo! Cuide bem de cada boneco, porque o que vem a seguir exige ainda mais preparo.
    tasks:
      - get: [witchery:poppet:1, witchery:poppet:2, witchery:poppet:3, witchery:poppet:4, witchery:poppet:6, witchery:poppet:7]
    rewards:
      - xp: 8
      - kit: {name: "Kit da Costureira de Bonecos", items: [witchery:poppet x4, witchery:taglockkit x4, witchery:spanishmoss x8, minecraft:gold_nugget x18, minecraft:wool x8]}
      - loot: raro

  # ======================================================================
  # FASE 11 — RODA DE FIAR, VESTES E INFUSÕES
  # ======================================================================
  - id: roda_fiar
    title: "Roda de Fiar"
    type: main
    deps: [pedra_sintonizada]
    icon: witchery:spinningwheel
    desc: |
      Hora de fiar como uma bruxa de verdade! Molduras, lã, graveto, tábuas e Pedra Sintonizada fazem a §eRoda de Fiar§r. Perto do altar, ela fia fios mágicos: §eFio de Ouro§r (fardo de feno + Sopro de Magia), §eLinha Fantasiosa§r (Algodão Etéreo do Mundo Espiritual) e §eCordel Atormentado§r (Algodão Perturbado).
      Também transforma linha em teia. Veja no NEI (R/U), Herói!
    tasks:
      - get: witchery:spinningwheel
    rewards:
      - xp: 4
      - choice: [minecraft:hay_block x4, minecraft:string x16, minecraft:item_frame x4]

  - id: fio_ouro
    title: "Fio de Ouro"
    type: normal
    deps: [roda_fiar]
    icon: witchery:ingredient:102
    desc: |
      Fios de ouro para a sua alta costura! Fardo de feno + 3 linhas + Sopro de Magia na Roda de Fiar = 3 §eFios de Ouro§r. Eles costuram o Chapéu, as Túnicas e os sapatos de bruxa.
      Rode a Roda perto do altar, Herói, para ela ter poder. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Vai ficar lindo!
    tasks:
      - get: witchery:ingredient:102 x3
    rewards:
      - xp: 2
      - item: minecraft:hay_block x2

  - id: couro_impregnado
    title: "Couro Impregnado"
    type: normal
    deps: [vapor_diamante, fumacas_bruxa]
    icon: witchery:ingredient:72
    desc: |
      O tecido de toda veste de bruxa! Couro, Vapor de Diamante e Sopro de Magia = 4 §eCouros Impregnados§r. É o material de reparo delas também, então vale guardar um pouco.
      A tarefa pede §e8§r, Herói, então faça a receita duas vezes. Se não encaixar, confira no NEI (R/U) ou no manual do mod. Vai bem de moda mágica, hein?
    tasks:
      - get: witchery:ingredient:72 x8
    rewards:
      - xp: 2
      - item: minecraft:leather x8

  - id: chapeu_bruxa
    title: "Chapéu de Bruxa"
    type: main
    deps: [fio_ouro, couro_impregnado]
    icon: witchery:witchhat
    desc: |
      O visual que faltava! Couro Impregnado, Fio de Ouro e pó de pedra luminosa fazem o §eChapéu de Bruxa§r! As vestes ajudam a bruxa a "engarrafar" mais doses no caldeirão (o livro de Brews explica). E, sinceramente, o visual fica uma graça em você.
      Ele também é a chave para invocar §eLeonard§r... Se a receita não encaixar, aperte R ou U no NEI. Vai com estilo!
    tasks:
      - get: witchery:witchhat
    rewards:
      - xp: 4
      - choice: [witchery:ingredient:72 x4, witchery:ingredient:102 x2, minecraft:glowstone_dust x8]

  - id: tunica_bruxa
    title: "Túnicas de Bruxa"
    type: normal
    deps: [chapeu_bruxa, coracao_creeper]
    icon: witchery:witchrobe
    desc: |
      Qual é o seu estilo, Herói? Couro Impregnado, Fio de Ouro e um §eCoração de Creeper§r = §eTúnica de Bruxa§r. Com uma §ePedra Necromântica§r no lugar do coração = §eTúnica de Necromante§r.
      Mostre qualquer uma das duas. Se a receita não encaixar, confira no NEI (R/U) ou no manual do mod. Que charme de túnica!
    tasks:
      - one_of: [witchery:witchrobe, witchery:necromancerrobe]
    rewards:
      - xp: 3
      - item: witchery:ingredient:72 x4

  - id: calcados_bruxa
    title: "Calçados e Cintos de Bruxa"
    type: optional
    deps: [chapeu_bruxa]
    icon: witchery:rubyslippers
    desc: |
      Vestes especiais para bruxas exigentes: §eChinelos Gelados§r (Coração Congelado), §eSapatos que Escorrem§r (Mão de Bruxa, Sopa de Redstone, leite) → §eSapatinhos de Rubi§r ("não há lugar como o lar"), §eCinto que Morde§r (com Piolho Parasítico e poções) → §eCinto de Casca§r.
      Mostre qualquer um, Herói! Veja receitas no NEI (R/U).
    tasks:
      - one_of: [witchery:iceslippers, witchery:seepingshoes, witchery:rubyslippers, witchery:bitingbelt, witchery:barkbelt]
    rewards:
      - loot: incomum

  - id: bolsa_brews
    title: "Bolsa de Brews"
    type: optional
    deps: [couro_impregnado, fio_ouro]
    icon: witchery:brewbag
    desc: |
      Organização é tudo! 8 Couros Impregnados e um Fio de Ouro = §eBolsa de Brews§r, para carregar seus brews e poções (pode ser tingida).
      É opcional, Herói, mas faz muita diferença quando o inventário começa a lotar de frascos. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. E escolha uma cor bonita para ela!
    tasks:
      - get: witchery:brewbag
    rewards:
      - loot: comum

  - id: vassoura
    title: "Vassoura Encantada"
    type: milestone
    deps: [unguento_voo, espinheiro, pedra_carregada]
    icon: witchery:ingredient:9
    banner: "Voo da Bruxa"
    subtitle: "Vassoura encantada"
    desc: |
      Gravetos e Mudas de Espinheiro = §eVassoura§r. Agora, o Rito de Infusão do Céu: §eà
      noite§r, círculos pequeno e médio brancos, Vassoura + §eUnguento de Voo§r (3000 de poder).

      A §eVassoura Encantada§r voa! Coloque-a no chão e monte. Herói, você está voando numa
      vassoura de verdade. Eu nem consigo descrever o tamanho do meu sorriso.
      §aDica:§r leve o Boneco de Proteção da Terra para pousos ruins.
    tasks:
      - get: witchery:ingredient:9
    rewards:
      - xp: 8
      - kit: {name: "Kit da Bruxa Voadora", items: [witchery:poppet:1 x1, minecraft:feather x16, witchery:ingredient:41 x1, minecraft:cooked_beef x16]}
      - loot: raro

  - id: galho_ent
    title: "Galho de Ent"
    type: normal
    deps: [sorveira]
    icon: witchery:ingredient:82
    desc: |
      Cortar árvores de bruxa às vezes desperta um §eEnt§r. Derrote-o: ele solta um §eGalho de Ent§r e uma muda de bruxa. O galho faz o Ramo Místico, o livro de Simbologia, o Raminho Mutante e o Rito da Floresta.
      §cEnts batem forte!§r Leve armadura e arma de respeito, Herói, e tenha paciência: o Ent nem sempre aparece de primeira. Veja detalhes no NEI (R/U).
    tasks:
      - get: witchery:ingredient:82
    rewards:
      - xp: 3
      - item: minecraft:iron_axe x1

  - id: ramo_mistico
    title: "Ramo Místico"
    type: main
    deps: [galho_ent, unguento_mistico]
    icon: witchery:mysticbranch
    desc: |
      Rito de Infusão (árvore), §eà noite§r, círculos pequeno e médio brancos: §eGalho de Ent +
      Unguento Místico§r (3000 de poder). O §eRamo Místico§r é a varinha da bruxa: desenhe
      símbolos no ar (o livro de Simbologia mostra os traços) para lançar feitiços que
      gastam a sua energia infundida. Também é artefato do altar.
    tasks:
      - get: witchery:mysticbranch
    rewards:
      - xp: 4
      - choice: [witchery:ingredient:107 x1, witchery:ingredient:83 x1, minecraft:diamond x1]

  - id: livro_simbologia
    title: "Bruxaria: Simbologia"
    type: optional
    deps: [galho_ent]
    icon: witchery:ingredient:107
    desc: |
      Cada feitiço do Ramo Místico, com o desenho dos traços! Livro, corante preto, pena e Galho de Ent = §eWitchcraft: Symbology§r.
      É opcional, Herói, mas quem estuda o livro erra menos os traços na hora H. Pratique muito! Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Boa leitura e bons feitiços!
    tasks:
      - get: witchery:ingredient:107
    rewards:
      - loot: comum

  - id: info_infusoes
    title: "Infusões"
    type: info
    deps: [sopa_redstone, primeiro_rito]
    icon: witchery:ingredient:42
    desc: |
      Uma §eInfusão§r dá ao jogador um tipo de energia mágica (para o Ramo Místico e poderes
      especiais). Prepare-a na Chaleira (4000 de poder) e use-a num §eRito de Infusão§r
      parado dentro do círculo (200 de poder). Só uma infusão por vez — a nova substitui a
      antiga. O próprio livro avisa, em tom sombrio, que "a morte é quase sempre certa" para
      quem mexe com isso sem cuidado: vá com vida cheia e Boneco da Morte!

      Para recarregar a energia: Rito da Carga com poção de Regeneração, círculos pequeno e
      médio brancos (40 de poder/s, enquanto você ficar dentro).
    tasks:
      - check
    rewards:
      - xp: 1

  - id: infusao_luz
    title: "Fantasma da Luz"
    type: normal
    deps: [info_infusoes]
    icon: witchery:ingredient:42
    desc: |
      Luz nas trevas! Na Chaleira: Sopa de Redstone, poções (Visão Noturna e Resistência ao Fogo), Boneco de Fogo, tocha e Língua de Cão. Infusão da Luz (círculos pequeno e médio brancos, 2000 de poder) dá o §eFantasma da Luz§r.
      Reúna tudo antes de começar, Herói, e vigie o poder do altar. Se algo não encaixar, confira no NEI (R/U) ou no manual do mod.
    tasks:
      - get: witchery:ingredient:42
    rewards:
      - xp: 3
      - item: minecraft:torch x16

  - id: infusao_mundo
    title: "Alma do Mundo"
    type: normal
    deps: [info_infusoes]
    icon: witchery:ingredient:43
    desc: |
      Poderes ligados à terra! Na Chaleira: Sopa de Redstone, poção de Regeneração, maçã dourada encantada, Pedra Sintonizada, Mandrágora e Muda de Sorveira. Infusão do Mundo (círculos pequeno e médio brancos, 4000 de poder) dá a §eAlma do Mundo§r.
      Reserve poder de sobra no altar, Herói. Se algo não encaixar, confira no NEI (R/U) ou no manual do mod.
    tasks:
      - get: witchery:ingredient:43
    rewards:
      - xp: 3
      - item: minecraft:golden_apple x1

  - id: infusao_alem
    title: "Espírito do Além-Mundo"
    type: normal
    deps: [info_infusoes, giz_alem_mundo]
    icon: witchery:ingredient:44
    desc: |
      Teleportes curtos e magia do Fim! Na Chaleira: Sopa de Redstone, poção de Velocidade, 2 olhos do Ender, Gota de Sorte e Lã de Morcego. Infusão do Além-Mundo (círculos pequeno e médio §eroxos§r, 4000 de poder) dá o §eEspírito do Além-Mundo§r.
      Separe poder de sobra no altar, Herói. Se algo não encaixar, aperte R ou U no NEI ou consulte o manual do mod.
    tasks:
      - get: witchery:ingredient:44
    rewards:
      - xp: 3
      - item: minecraft:ender_eye x2

  - id: infusao_infernal
    title: "Ânimo Infernal"
    type: normal
    deps: [info_infusoes, giz_infernal, coracao_demonio, boneco_vodu]
    icon: witchery:ingredient:45
    desc: |
      Atenção, Herói, o Inferno cobra caro! Na Chaleira: Sopa de Redstone, poção de Fraqueza, Boneco Vodu, Coração de Demônio, Mal Refinado e vara de blaze. Infusão Infernal (círculos pequeno e médio §evermelhos§r, 4000 de poder) dá o §eÂnimo Infernal§r e permite §edominar criaturas§r abatidas e usar seus poderes.
      Se algo não encaixar, confira no NEI (R/U).
    tasks:
      - get: witchery:ingredient:45
    rewards:
      - xp: 3
      - item: minecraft:blaze_rod x2

  - id: bola_cristal
    title: "Bola de Cristal"
    type: optional
    deps: [oleo_acaso]
    icon: witchery:crystalball
    desc: |
      Quer espiar o futuro? Quartzo, blocos de quartzo e vidro = Esfera de Quartzo. Rito de Infusão (futuro), §eà noite§r, círculo médio branco: Esfera + ouro + Óleo do Acaso (2000 de poder) = §eBola de Cristal§r, que mostra previsões do seu futuro (perto de um altar).
      É opcional, Herói. Se algo não encaixar, confira no NEI (R/U).
    tasks:
      - get: witchery:crystalball
    rewards:
      - loot: comum

  - id: pedra_vidente
    title: "Pedra do Vidente"
    type: optional
    deps: [oleo_acaso]
    icon: witchery:ingredient:94
    desc: |
      Informação é poder! Rito de Infusão, §eà noite§r, círculo pequeno branco: Esfera de Quartzo, obsidiana e Óleo do Acaso. A §ePedra do Vidente§r mostra informações sobre si e sobre o seu §econvento§r (coven) de bruxas.
      É opcional, Herói, mas curiosa de usar. Se algo não encaixar no desenho do círculo, aperte R ou U no NEI ou consulte o manual do mod.
    tasks:
      - get: witchery:ingredient:94
    rewards:
      - loot: comum

  - id: talisma_circulo
    title: "Talismã do Círculo"
    type: optional
    deps: [primeiro_rito, pedra_carregada]
    icon: witchery:circletalisman
    desc: |
      Círculos portáteis! Diamante, ouro e pepitas = §eTalismã do Círculo§r. O Rito da Ligação (talismã + redstone, 1000 de poder, sem círculo próprio) "puxa" os círculos de giz desenhados para dentro dele; depois você os desenha de novo em qualquer lugar.
      É opcional, Herói, mas economiza giz e tempo. Se algo não encaixar, confira no NEI (R/U).
    tasks:
      - get: witchery:circletalisman
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 12 — FAMILIARES E O CONVENTO
  # ======================================================================
  - id: partes_animais
    title: "Asa de Corujinha e Dedo de Sapo"
    type: normal
    deps: [arthana]
    icon: witchery:ingredient:89
    desc: |
      Bichinhos de bruxa dão ingredientes! §eCorujas§r e §eSapos§r de bruxa soltam §eAsa de Corujinha§r e §eDedo de Sapo§r (muito mais com a Arthana). São ingredientes da Base de Brew Infundido, do Rito das Estações e de vários brews.
      Mostre um de cada, Herói! Leve a Arthana na caçada. Se quiser ver os usos, aperte R ou U no NEI.
    tasks:
      - get: [witchery:ingredient:89, witchery:ingredient:90]
    rewards:
      - xp: 2
      - item: minecraft:feather x8

  - id: vinculo_familiar
    title: "Vínculo do Familiar"
    type: milestone
    deps: [sangue_infernal, lagrima_deusa, fumacas_bruxa]
    icon: witchery:ingredient:36
    banner: "Um Familiar"
    subtitle: "Coruja, sapo ou gato"
    desc: |
      Toda bruxa tem um companheiro. Dome uma §ecoruja, um sapo ou um gato§r. Depois, Rito da
      Ligação, círculo §emédio branco§r: Lágrima da Deusa, Odor da Pureza, Sopro de Magia,
      §ediamante§r e Sangue Demoníaco (8000 de poder), com o animal dentro do círculo.

      O familiar dá bônus (o sapo ajuda a engarrafar mais brews; o gato é exigido por
      algumas maldições). Se ele morrer, o §eRito do Chamado§r (Sopro da Deusa, Indício de
      Renascimento, Sopro de Magia, círculo médio) o traz de volta.
    tasks:
      - get: [witchery:ingredient:37, witchery:ingredient:36, witchery:ingredient:34, minecraft:diamond, witchery:ingredient:80]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Familiar", items: [minecraft:fish x16, minecraft:diamond x1, witchery:ingredient:37 x2, minecraft:lead x2]}
      - loot: raro

  - id: familiar_espectral
    title: "Familiar Espectral"
    type: optional
    deps: [gota_sorte, arthana]
    icon: minecraft:porkchop
    desc: |
      Um porquinho esperto! Rito de Invocação, círculo pequeno branco: Gota de Sorte, costeleta crua, lingote de ouro e Arthana (2000 de poder). Surge um porquinho espectral que "acha coisas". O livro sugere: experimente dar um diamante a ele! (Oinc.)
      É opcional, Herói, mas bem fofo. Se o desenho confundir, aperte R ou U no NEI ou consulte o livro Circle Magic.
    tasks:
      - check
    rewards:
      - loot: comum

  - id: info_convento
    title: "O Convento"
    type: info
    deps: [vinculo_familiar]
    icon: witchery:ingredient:94
    desc: |
      Bruxas do Convento (Coven Witches) aparecem nos pântanos e cabanas de bruxa. Elas pedem
      favores; ajudando-as, podem se juntar ao seu §econvento§r (até 6 além de você).

      Alguns ritos exigem um convento: Estações (4+), Expansão Gelada (2+), Chuva de Sapos
      (1+), Chamado das Bestas (3+) e a temida Maldição do Lobo (completo). No caldeirão, mais
      bruxas = rituais mais fortes e de maior alcance.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: rito_estacoes
    title: "Rito das Estações"
    type: optional
    deps: [info_convento, partes_animais, pedra_carregada]
    icon: witchery:ingredient:106
    desc: |
      Círculo grande branco, convento de 4+: olho de aranha, Dedo de Sapo, Lã de Morcego,
      Língua de Cão, Asa de Corujinha, Pedra Sintonizada e Pedra Carregada, mais o foco do
      bioma e pó de pedra luminosa (veja o §eLivro dos Biomas§r). Muda o bioma em volta!
    tasks:
      - check
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 13 — O MUNDO ESPIRITUAL
  # ======================================================================
  - id: info_mundo_espiritual
    title: "Antes de Sonhar"
    type: info
    deps: [brew_sono, campanula]
    icon: witchery:ingredient:78
    desc: |
      §dO Mundo Espiritual (dimensão -37)§r é o lugar dos sonhos. Para ir: no Mundo Normal,
      beba o §eBrew do Sono§r (ou coma a §eMaçã do Sono§r). Seu corpo fica deitado onde você
      estava — §cproteja esse lugar!§r

      Para voltar: use uma §eAgulha Gelada§r lá dentro. §eLeve várias.§r

      O que fazer lá: colher §eAlgodão Etéreo§r, capturar espíritos, fazer o §eBrew do Espírito
      Fluido§r (só lá) e enfrentar o §cPesadelo§r. A Mutandis ainda transforma plantas em
      verruga do Nether por lá.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: mundo_espiritual
    title: "O Mundo Espiritual"
    type: portal
    deps: [info_mundo_espiritual]
    icon: witchery:ingredient:95
    banner: "O Mundo Espiritual"
    subtitle: "Onde os sonhos moram"
    effect: 5
    desc: |
      Feche os olhos, Herói. Tudo fica mais suave, as cores mais estranhas, e o vento sussurra
      o seu nome... Você está sonhando de verdade.

      Explore com calma. §eAlgodão Etéreo§r cresce aqui e vira Linha Fantasiosa na Roda.
      Espíritos vagam por aí. E, de vez em quando, algo pior — um §cPesadelo§r. Se ele
      aparecer e você não estiver preparado, use a Agulha Gelada e acorde.
    tasks:
      - visit: {dim: -37, name: "Mundo Espiritual"}
    rewards:
      - xp: 5
      - loot: raro

  - id: algodao_eterio
    title: "Algodão Etéreo"
    type: normal
    deps: [mundo_espiritual]
    icon: witchery:somniancotton
    desc: |
      "Uma planta de faz-de-conta que só cresce no sono mais profundo." Que poético! Colha §e8 Algodões Etéreos§r no Mundo Espiritual. Na Roda de Fiar, 4 algodões + linha + Odor da Pureza = §eLinha Fantasiosa§r.
      Para chegar lá, você precisa do Brew do Sono, Herói, então confira a quest do Mundo Espiritual se for preciso. Bons sonhos, e boa colheita!
    tasks:
      - get: witchery:somniancotton x8
    rewards:
      - xp: 3
      - item: minecraft:string x8

  - id: linha_fantasiosa
    title: "Linha Fantasiosa"
    type: normal
    deps: [algodao_eterio, roda_fiar]
    icon: witchery:ingredient:100
    desc: |
      Fios de sonho! A §eLinha Fantasiosa§r faz os Tecelões de Sonhos, o Amuleto do Pensamento Fantasioso e o Brew do Espírito Fluido. Fie §e2§r.
      Use a Roda de Fiar com Algodão Etéreo, linha e Odor da Pureza, Herói. Se a receita não encaixar de primeira, confira no NEI (R/U) ou no manual do mod. Tudo certo? Então segue o fio e bora tecer!
    tasks:
      - get: witchery:ingredient:100 x2
    rewards:
      - xp: 3
      - item: witchery:ingredient:36 x2

  - id: cordel_atormentado
    title: "Cordel Atormentado"
    type: normal
    deps: [mundo_espiritual, roda_fiar]
    icon: witchery:ingredient:101
    desc: |
      Sonhos ruins também rendem material! Do Mundo Espiritual também vem o §eAlgodão Perturbado§r. 4 dele + linha + Fedor do Infortúnio na Roda = §eCordel Atormentado§r, usado em Tecelões de Sonhos, espantalhos, poços-armadilha e na Maldição do Pesadelo.
      Faça com calma, Herói. Se a receita não encaixar, aperte R ou U no NEI.
    tasks:
      - get: witchery:ingredient:101
    rewards:
      - xp: 3
      - item: witchery:ingredient:35 x2

  - id: teceloes_sonho
    title: "Tecelões de Sonhos"
    type: optional
    deps: [linha_fantasiosa, cordel_atormentado]
    icon: witchery:dreamcatcher
    desc: |
      Para dormir melhor (ou pior, depende do tecelão)! Moldura, Linha Fantasiosa, Cordel Atormentado, penas, poções e Vapor de Diamante. Os §eTecelões de Sonhos§r, pendurados perto da cama, dão bônus ao acordar: Pés Velozes, Braço de Ferro, Jejum, Intensidade... (e o de Pesadelos, o contrário).
      Mostre qualquer um, Herói! Confira receitas no NEI (R/U).
    tasks:
      - one_of: [witchery:ingredient:3, witchery:ingredient:4, witchery:ingredient:5, witchery:ingredient:6, witchery:ingredient:104]
    rewards:
      - loot: comum

  - id: espirito_fluido
    title: "Brew do Espírito Fluido"
    type: main
    deps: [linha_fantasiosa, mundo_espiritual]
    icon: witchery:ingredient:96
    desc: |
      §eSó funciona na Chaleira montada no Mundo Espiritual!§r Linha Fantasiosa, Alcachofra,
      Mandrágora, Musgo Espanhol, Erva Brilhante e Lã de Morcego = 3 §eBrews do Espírito
      Fluido§r.

      Na Destilaria (2 jarros), com Óleo de Vitríolo, ele se separa em §eVontade Focada§r,
      §eMedo Condensado§r e §eLágrimas Ocas§r. É a base da Base de Brew Infundido.
    tasks:
      - get: witchery:ingredient:96 x3
    rewards:
      - xp: 4
      - choice: [witchery:ingredient:30 x2, witchery:ingredient:27 x4, witchery:ingredient:78 x4]

  - id: destilados_espirito
    title: "Vontade, Medo e Lágrimas"
    type: normal
    deps: [espirito_fluido]
    icon: witchery:ingredient:113
    desc: |
      Do Espírito Fluido destilado saem três tesouros: §eVontade Focada§r, §eMedo Condensado§r e 8 §eLágrimas Ocas§r. O Medo vai na Pedra Espectral; as Lágrimas, no Espírito Congelado e no Espelho.
      Destile com calma, Herói, e guarde os frascos. Se a Destilaria te deixar na dúvida, aperte R ou U no NEI e veja a aba "Distillery". Boa destilação!
    tasks:
      - get: [witchery:ingredient:113, witchery:ingredient:114, witchery:ingredient:115 x4]
    rewards:
      - xp: 3
      - item: witchery:ingredient:27 x4

  - id: espirito_congelado
    title: "Espírito Congelado"
    type: normal
    deps: [destilados_espirito]
    icon: witchery:ingredient:126
    desc: |
      Espíritos derrotados soltam §eEspíritos Subjugados§r. Na Chaleira: Brew das Lágrimas Ocas + 5 Espíritos Subjugados (2000 de poder) = §eEspírito Congelado§r, o coração da Pedra Espectral.
      Reúna os espíritos com paciência, Herói, e tenha poder de sobra no altar. Se algo não encaixar, confira no NEI (R/U) ou no manual do mod. Você chega lá!
    tasks:
      - get: witchery:ingredient:126
    rewards:
      - xp: 3
      - item: minecraft:glass_bottle x8

  - id: pedra_espectral
    title: "Pedra Espectral e Fetiches"
    type: optional
    deps: [espirito_congelado, pedra_necromantica]
    icon: witchery:spectralstone
    desc: |
      Rito da Necromancia, §eà noite§r, círculo pequeno branco: Pedra Necromântica, Espírito
      Congelado, Medo Condensado, Pó Espectral e Boline (6000 de poder) = §ePedra Espectral§r.
      Ela prende até 3 criaturas espectrais; o Rito da Ligação as amarra a um §eEspantalho§r,
      §eEfígie de Trent§r ou §eEscada da Bruxa§r, criando fetiches com efeitos (sentinela,
      grito, desorientação...). Mostre uma Pedra Espectral.
    tasks:
      - get: witchery:spectralstone
    rewards:
      - loot: incomum

  - id: manifestacao
    title: "Rito da Manifestação"
    type: optional
    deps: [mundo_espiritual, pedra_necromantica, giz_alem_mundo]
    icon: minecraft:golden_pickaxe
    desc: |
      Assombração consentida! No Mundo Espiritual, círculo pequeno do Além-Mundo: Pó Espectral, Fome Melíflua, Pedra Necromântica, picareta de ouro, Arthana e pólvora (5000 de poder). Você se §emanifesta como fantasma§r no mundo real por um tempo.
      É opcional, Herói, e pede bastante poder. Se o desenho confundir, aperte R ou U no NEI ou consulte o livro Circle Magic.
    tasks:
      - check
    rewards:
      - loot: incomum

  - id: brews_infundidos
    title: "Base de Brew Infundido"
    type: main
    deps: [espirito_fluido, sopa_redstone, partes_animais, coracao_creeper]
    icon: witchery:ingredient:121
    desc: |
      Chaleira: Sopa de Redstone, Brew do Espírito Fluido, Coração de Creeper, Dedo de Sapo,
      Asa de Corujinha e Língua de Cão (3000 de poder) = §eBase de Brew Infundido§r. (Depois
      ela se multiplica: Base + Espírito Fluido + Indício de Renascimento + Mandrágora + Lã de
      Morcego + Amora Silvestre = 2 Bases.)
    tasks:
      - get: witchery:ingredient:121
    rewards:
      - xp: 4
      - choice: [witchery:ingredient:96 x1, witchery:ingredient:40 x1, witchery:ingredient:89 x2]

  - id: brew_voo
    title: "Brew Infundido do Voo"
    type: optional
    deps: [brews_infundidos, vassoura]
    icon: witchery:ingredient:122
    desc: |
      Voar sem vassoura! Rito de Infusão, círculos pequeno e médio brancos: Base Infundida, Vassoura, pena e Arthana, com o sacrifício de uma §ecoruja§r (3000 de poder). Beber dá o poder de voar sem vassoura.
      É opcional, Herói, e pede bastante poder no altar. Se algo não encaixar no desenho, confira no NEI (R/U) ou no livro Circle Magic. Boa decolagem!
    tasks:
      - get: witchery:ingredient:122
    rewards:
      - loot: incomum

  - id: brew_tumulo
    title: "Brew Infundido do Túmulo"
    type: optional
    deps: [brews_infundidos, pedra_necromantica]
    icon: witchery:ingredient:123
    desc: |
      Um poder ligado aos mortos! Rito de Infusão, círculos pequeno e médio brancos: Base Infundida, osso, Teia e Pedra Necromântica, com o sacrifício de um §ezumbi§r (3000 de poder).
      É opcional, Herói, mas bem temático para quem anda com necromancia. Reserve poder de sobra no altar. Se o desenho confundir, aperte R ou U no NEI ou consulte o livro Circle Magic. Boa sorte!
    tasks:
      - get: witchery:ingredient:123
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 14 — LEONARD, O TORMENTO E O ESPELHO
  # ======================================================================
  - id: leonard
    title: "Leonard"
    type: boss
    deps: [chapeu_bruxa, caldeirao_bruxa, vapor_diamante]
    icon: witchery:leonardsurn
    banner: "Leonard Derrotado"
    subtitle: "O demônio medieval"
    desc: |
      "Um demônio dos tempos medievais, que preside rituais em outras dimensões. Quando
      invocado, dificilmente quer ir embora, a não ser derrotado."

      No caldeirão fervendo, com o §eChapéu de Bruxa§r como item-chave, a receita de
      invocação usa Verruga do Nether, Lágrima da Deusa, Vapor de Diamante, diamante e
      §eEstrela do Nether§r, com §e10 000 de poder§r (confira a página "Leonard" no livro
      Witches' Brews e a aba do caldeirão no NEI).

      §cLeonard é um chefe de verdade.§r Ao cair, solta Coração de Demônio e a §eUrna de
      Leonard§r, que guarda brews para soltar pela varinha.
    tasks:
      - kill: {entity: "witchery.leonard", count: 1}
    rewards:
      - xp: 10
      - loot: epico

  - id: urna_leonard
    title: "Urna de Leonard"
    type: optional
    deps: [leonard]
    icon: witchery:leonardsurn
    desc: |
      "Coloque um brew na Urna para focar seu poder, e solte-o pela sua varinha." Que ideia boa, né? Duas urnas na bancada fazem uma urna maior (até o nível 3).
      É opcional, Herói, mas dá mais alcance à sua varinha. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod. Vai fundo e evolua sua Urna de Leonard!
    tasks:
      - get: witchery:leonardsurn
    rewards:
      - loot: raro

  - id: senhor_tormento
    title: "O Senhor do Tormento"
    type: boss
    deps: [invocar_diabrete, info_mundo_espiritual]
    icon: witchery:ingredient:139
    banner: "O Senhor do Tormento"
    subtitle: "Fuja do labirinto"
    desc: |
      §cO chefe mais cruel do Volume das Bruxas.§r O pergaminho de contrato "§eTorment§r" diz:
      "leia este texto num círculo de pedras em pé. Cuidado com a entrada explosiva."

      Quando o §eSenhor do Tormento§r cai abaixo da metade da vida fora do Tormento, ele
      §earrasta os jogadores próximos para o Tormento§r (dimensão -38), um labirinto em
      andares. Lá, só ele morto (ou a fuga) liberta você.

      Ao morrer, solta livros encantados, um Coração de Demônio e a §eAlma do Demônio do
      Tormento§r. Vá com o melhor equipamento e Boneco da Morte.
    tasks:
      - kill: {entity: "witchery.lordoftorment", count: 1}
    rewards:
      - xp: 12
      - loot: [epico, raro]

  - id: tormento
    title: "O Tormento"
    type: portal
    deps: [senhor_tormento]
    icon: witchery:tormentstone
    banner: "O Tormento"
    subtitle: "Dimensão -38"
    effect: 5
    desc: |
      Paredes que não acabam, ar pesado e gritos distantes. O Tormento é a prisão de quem desafia o Senhor do Tormento. Entre só com a mochila arrumada, o ânimo em dia e o plano na cabeça, Herói; vá com tudo em ordem e respeite o lugar. Se precisar relembrar o caminho até lá, o NEI (R/U) e o manual do mod ajudam.
      Se você está lendo isto depois de sair de lá... Herói, que alívio. Vem cá, deixa eu ver se você está inteiro.
    tasks:
      - visit: {dim: -38, name: "Tormento"}
    rewards:
      - xp: 8
      - loot: raro

  - id: espelho
    title: "O Espelho"
    type: main
    deps: [destilados_espirito, invocar_demonio]
    icon: witchery:mirror
    desc: |
      Rito de Infusão (espelho), círculo §emédio branco§r: Brew das Lágrimas Ocas, lingote de
      ouro e painel de vidro, com um §eDemônio vivo§r dentro do círculo como sacrifício (2000
      de poder). O demônio fica preso no §eEspelho§r.

      "Espelho, espelho meu..." — coloque-o numa parede e atravesse-o para chegar ao §eMundo
      do Espelho§r.
    tasks:
      - get: witchery:mirror
    rewards:
      - xp: 4
      - choice: [minecraft:glass_pane x16, minecraft:gold_ingot x4, witchery:ingredient:115 x4]

  - id: mundo_espelho
    title: "O Mundo do Espelho"
    type: portal
    deps: [espelho]
    icon: witchery:mirrorblock
    banner: "Do Outro Lado do Espelho"
    subtitle: "Dimensão -39"
    effect: 5
    desc: |
      Tudo invertido, silencioso... e com a sensação de estar sendo observado. Bem-vindo ao §eMundo do Espelho§r, Herói! Atravessar espelhos liga o mundo real a este lugar, e você chegou até aqui depois de muito preparo.

      Dentro do espelho, quem diz a frase certa ("Espelho, espelho meu, para casa leve-me eu") pode tentar voltar. Há um tempo de espera entre tentativas, então tenha paciência e não entre em pânico. Leve comida, armadura boa e fique de olho nos arredores. Respire fundo, aproveite a estranheza e explore com cuidado. Boa viagem!
    tasks:
      - visit: {dim: -39, name: "Mundo do Espelho"}
    rewards:
      - xp: 5
      - loot: raro

  - id: reflexo
    title: "O Reflexo"
    type: boss
    deps: [espelho, giz_infernal]
    icon: witchery:mirrorblock
    banner: "Seu Próprio Reflexo"
    subtitle: "O demônio do espelho"
    desc: |
      Rito de Invocação, círculo §egrande infernal§r: o §eEspelho§r, Orvalho do Ender, pó de blaze e Esfera de Quartzo (5000 de poder). O demônio sai do espelho como o §eReflexo§r, uma versão sombria de quem o invocou.

      §cLute com tudo que você tem. Ele conhece os seus truques.§r O interior do círculo precisa estar livre (7×7×4).

      Herói, você chegou até aqui com rituais, ingredientes raros e muita coragem. Prepare armadura, poções e um plano, e respire fundo. Eu acredito em você, e a vitória vai abrir o caminho para a próxima etapa da sua bruxaria!
    tasks:
      - kill: {entity: "witchery.reflection", count: 1}
    rewards:
      - xp: 10
      - loot: epico

  # ======================================================================
  # FASE 15 — LOBISOMENS
  # ======================================================================
  - id: info_lobisomem
    title: "A Maldição do Lobo"
    type: info
    deps: [aconito, info_convento]
    icon: witchery:wolfhead
    desc: |
      §cLeia com atenção, Herói. Licantropia muda o seu jeito de jogar.§r

      Como acontece: ser mordido por lobisomens (este pack permite infecção entre jogadores)
      ou pelo §eRito da Maldição do Lobo§r: à noite, §esob lua cheia§r, com um §econvento
      completo§r, círculo médio infernal, Taglock, Exalação do Chifrudo, §eCabeça de Cão
      Infernal§r, Acônito, diamante e Brew do Grotesco (10 000 de poder).

      Nas noites de lua cheia você se transforma. Para evoluir (níveis 1 a 10), use o §eAltar
      do Lobo§r: uma voz pede tarefas (ouro, carne, línguas, uivos...).

      Cura: Rito de Remover Maldição, à noite, círculo pequeno branco: Taglock, Sopro da
      Deusa, §eEspada de Prata§r, Acônito, diamante e Brew do Amor (10 000 de poder).
      Híbridos vampiro/lobisomem são permitidos neste pack.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: altar_lobo
    title: "Altar do Lobo"
    type: normal
    deps: [info_lobisomem]
    icon: witchery:wolfaltar
    desc: |
      Hora do uivo! Cabeças de Lobo (ou de Cão Infernal), pedra e Acônito = §eAltar do Lobo§r. Um lobisomem que interage com ele recebe tarefas da voz da fera — e sobe de nível ao cumpri-las.
      É o ponto de partida da linha de lobisomens, Herói. Posicione-o num lugar seguro e, se a receita não encaixar, aperte R ou U no NEI. Boa sorte, e cuidado com a lua!
    tasks:
      - get: witchery:wolfaltar
    rewards:
      - xp: 3
      - item: minecraft:bone x16

  - id: amuleto_lua
    title: "Amuleto da Lua"
    type: normal
    deps: [altar_lobo]
    icon: witchery:mooncharm
    desc: |
      A primeira tarefa do Altar do Lobo pede §elingotes de ouro§r. Cumprida, a voz cria o §eAmuleto da Lua§r: "liberta a fera interior, e a lua não terá mais poder" — com ele você controla a transformação.
      "NÃO O PERCA DE NOVO!" Guarde bem, Herói! Se tiver dúvida sobre as tarefas do altar, confira no NEI (R/U) ou no manual do mod.
    tasks:
      - get: witchery:mooncharm
    rewards:
      - xp: 4
      - item: minecraft:gold_ingot x8

  - id: cacador_chifrudo
    title: "O Caçador Chifrudo"
    type: boss
    deps: [amuleto_lua]
    icon: witchery:hornofthehunt
    banner: "O Caçador Chifrudo"
    subtitle: "Lorde da Caçada Selvagem"
    desc: |
      No nível 5, a voz exige: "o lobo e o homem devem se tornar um: mate o Senhor Chifrudo da
      Caçada Selvagem!" Ela entrega a §eTrompa da Caçada§r, que invoca o §eCaçador Chifrudo§r.

      Ele é rápido e forte. Ao cair, solta crânios de esqueleto Wither, Sangue Demoníaco e,
      às vezes, a §eLança do Caçador§r. §cLute em campo aberto, à noite.§r
    tasks:
      - kill: {entity: "witchery.hornedHuntsman", count: 1}
    rewards:
      - xp: 10
      - loot: epico

  - id: armadilhas
    title: "Armadilhas de Urso e de Lobo"
    type: optional
    deps: [aconito]
    icon: witchery:wolftrap
    desc: |
      Ferro, tesouras e placa de pressão pesada = §eArmadilha de Urso§r. Com prata (lingote de prata do oredict ou Pó de Prata), Catalisador Nulo e Acônito = §eArmadilha de Lobo§r, que prende lobisomens.
      Mostre a Armadilha de Urso, Herói! Posicione longe de onde você caminha, porque ela não escolhe a vítima. Se a receita não encaixar, confira no NEI (R/U).
    tasks:
      - get: witchery:beartrap
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 16 — VAMPIROS
  # ======================================================================
  - id: livro_vampiro
    title: "Observações de um Imortal"
    type: normal
    deps: [alho, primeiro_rito]
    icon: witchery:vampirebook
    desc: |
      Estrela do Nether, livro, Alho e verruga do Nether = §eObservations of an Immortal§r, o
      relato de um estudioso condenado que conversou com um vampiro. Cada página revela um
      passo do caminho (as páginas rasgadas encontradas no mundo completam o livro).

      §cAkasha, séria:§r eu adoro você vivo e ao sol. Leia antes de decidir qualquer coisa.
    tasks:
      - get: witchery:vampirebook
    rewards:
      - xp: 3
      - item: minecraft:nether_wart x8

  - id: info_vampiro
    title: "O Caminho do Vampiro"
    type: info
    deps: [livro_vampiro]
    icon: witchery:glassgoblet
    desc: |
      O que o livro conta (e este pack permite):
      §e•§r O rito de "nascimento": à noite, céu aberto, linha, pó vermelho, tochas e um
      crânio; sangue de galinha recolhido com Boline no §eCálice de Vidro§r. Uma voz pede
      para levar "sua filha" aos lagos de fogo do Nether — é ali que §eLilith§r surge.
      §e•§r Como vampiro você sobe de nível (1 a 10) com tarefas: beber até saciar, beber de
      vários sem matar, resistir ao sol com o Coletor Solar, extinguir criaturas de fogo,
      voar como morcego, prender aldeões em jaulas...
      §e•§r O sol queima, o alho fere, a prata e as estacas são perigosas. Vampiros só dormem
      de dia (num Caixão!).

      Cura: Rito de Remover Maldição, círculo pequeno branco: Taglock, Sopro da Deusa,
      Espada de Prata, Alho, diamante e Brew do Amor (10 000 de poder).
    tasks:
      - check
    rewards:
      - xp: 2

  - id: calice_vidro
    title: "Cálice de Vidro"
    type: normal
    deps: [livro_vampiro]
    icon: witchery:glassgoblet
    desc: |
      3 frascos e um vidro = §eCálice de Vidro§r ("Glass Goblet"). É nele que se recolhe o sangue do rito — e que, no fim, um vampiro oferece o próprio sangue a outro.
      Um item simples, Herói, mas essencial para a linha dos vampiros. Se a receita não encaixar de primeira, aperte R ou U no NEI ou consulte o manual do mod. Vai com elegância!
    tasks:
      - get: witchery:glassgoblet
    rewards:
      - xp: 2
      - item: minecraft:glass_bottle x4

  - id: lilith
    title: "Lilith"
    type: boss
    deps: [calice_vidro, info_vampiro]
    icon: witchery:ingredient:164
    banner: "A Mãe dos Vampiros"
    subtitle: "Lilith nos lagos de fogo"
    desc: |
      "Você é digno... desta vez. Deseja magia, ou morte?" Leve o pedido do rito ao Nether e
      encontre §eLilith§r. Ela oferece §emagia§r (encantar um item) ou §esangue§r — o caminho do
      vampirismo. A escolha é sua, e eu respeito qualquer uma.

      §cMas cuidado:§r Lilith não é uma vizinha simpática. Prepare-se para o Nether e para o
      que vier. Confirme quando tiver completado o encontro.
    tasks:
      - check
    rewards:
      - xp: 10
      - loot: epico

  - id: traje_vampiro
    title: "Traje do Vampiro"
    type: optional
    deps: [info_vampiro]
    icon: witchery:vampirecoat
    desc: |
      Quer ficar elegante e sombrio? §eTecido Escuro§r (Lã Manchada de Sangue na fornalha) faz Cartola, Casaca, Calças e Sapatos de vampiro, com bônus de conjunto (beber mais rápido, resistência ao fogo, hipnose mais forte). Com ferro, a casaca vira de cota de malha.
      Mostre qualquer peça, Herói! Se a receita não encaixar, confira no NEI (R/U).
    tasks:
      - one_of: [witchery:vampirehat, witchery:vampirecoat, witchery:vampirecoat_female, witchery:vampirelegs, witchery:vampirelegs_kilt, witchery:vampireboots]
    rewards:
      - loot: incomum

  - id: caixao
    title: "Caixão"
    type: optional
    deps: [info_vampiro]
    icon: witchery:coffin
    desc: |
      Vampiros só dormem de dia — e de preferência longe do sol. Cama, tábuas e toras = §eCaixão§r.
      Combine com o §eColetor Solar§r (ouro, repetidor, ferro e sensor de luz do dia) para treinar a resistência ao sol. É opcional, Herói, mas dá um clima e tanto à sua base! Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod.
    tasks:
      - get: witchery:coffin
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 17 — CAÇADOR DE BRUXAS
  # ======================================================================
  - id: catalisador_nulo
    title: "Catalisador Nulo"
    type: normal
    deps: [primeiro_rito]
    icon: witchery:ingredient:130
    desc: |
      A magia tem limite, e aqui está ele! Estrela do Nether, diamante, sílex e 6 cremes de magma = 2 §eCatalisadores Nulos§r (depois: Catalisador + creme de magma + pó de blaze = mais um). Ele anula magia: couro nulo, virotes anti-magia, Antídoto Universal, Bússola da Prateleira.
      Guarde com carinho, Herói! Dúvidas? NEI (R/U).
    tasks:
      - get: witchery:ingredient:130 x2
    rewards:
      - xp: 3
      - item: minecraft:magma_cream x6

  - id: armadura_cacador
    title: "Armadura do Caçador de Bruxas"
    type: main
    deps: [catalisador_nulo]
    icon: witchery:huntercoat
    desc: |
      Ironia: a melhor defesa contra bruxas é... feita por bruxas. Couro + Catalisador Nulo = 3 §eCouros Nulos§r. Com eles: Chapéu, Casaco, Calças e Botas do §eCaçador de Bruxas§r.
      O conjunto protege contra maldições, mas §cnão deixa usar bonecos§r. Pense na escolha, Herói! Se a receita não encaixar, confira no NEI (R/U) ou no manual do mod. Boa caça!
    tasks:
      - get: [witchery:hunterhat, witchery:huntercoat, witchery:hunterlegs, witchery:hunterboots]
    rewards:
      - xp: 4
      - choice: [minecraft:leather x16, witchery:ingredient:130 x1, minecraft:iron_ingot x8]

  - id: armadura_prateada
    title: "Armadura Prateada e da Alvorada"
    type: optional
    deps: [armadura_cacador, aconito, alho]
    icon: witchery:huntercoatsilvered
    desc: |
      Quer subir de nível a armadura? Cada peça + Acônito + linha + prata (lingote de prata do oredict, como o do Thermal) = versão §ePrateada§r (proteção contra lobisomens). Depois + Alho = versão da §eAlvorada§r (contra vampiros também).
      Mostre o Casaco Prateado, Herói! Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod.
    tasks:
      - get: witchery:huntercoatsilvered
    rewards:
      - loot: incomum

  - id: besta_cacador
    title: "Besta de Pistola do Caçador"
    type: normal
    deps: [armadura_cacador]
    icon: witchery:handbow
    desc: |
      Uma arma a todo vapor! Ferro, arco, Agulha de Osso, linha e graveto = §eBesta de Pistola§r. Munição: Virotes de Madeira (9 por receita), Bifurcados, Sagrados (osso e lágrima de Ghast), Anti-Magia (Catalisador Nulo e Beladona) e de Prata.
      Mostre a besta e alguns virotes de madeira, Herói! Se a receita não encaixar, confira no NEI (R/U) ou no manual do mod.
    tasks:
      - get: [witchery:handbow, witchery:ingredient:132 x9]
    rewards:
      - xp: 3
      - item: minecraft:feather x16

  - id: espada_prata
    title: "Espada de Prata"
    type: normal
    deps: [armadura_cacador]
    icon: witchery:silversword
    desc: |
      2 lingotes de prata (oredict) sobre uma espada de ouro = §eEspada de Prata§r (também dá com Pó de Prata em volta). É exigida nas curas de lobisomem e vampiro. E, bem, corta lobisomens muito bem.
      Guarde uma na mochila, Herói, que ela vai ser útil várias vezes. Se a receita não encaixar, aperte R ou U no NEI ou consulte o manual do mod.
    tasks:
      - get: witchery:silversword
    rewards:
      - xp: 3
      - item: minecraft:gold_ingot x4

  - id: estaca
    title: "Estaca de Madeira"
    type: optional
    deps: [alho]
    icon: witchery:ingredient:162
    desc: |
      Clássica! Alho em volta de um graveto = §eEstaca de Madeira§r. Este pack permite "estaquear" vampiros. Junto com a §eGuirlanda de Alho§r, sua casa fica bem protegida.
      É opcional, Herói, mas bem útil para dormir tranquilo. Se a receita não encaixar de primeira, confira no NEI (R/U) ou no manual do mod. Vampiros, cuidado: a Akasha está de olho!
    tasks:
      - get: witchery:ingredient:162
    rewards:
      - loot: comum

  - id: cacador_bruxas
    title: "O Caçador de Bruxas"
    type: boss
    deps: [primeiro_rito]
    icon: witchery:hunterhat
    banner: "Caçador Derrotado"
    subtitle: "Quem caça quem?"
    desc: |
