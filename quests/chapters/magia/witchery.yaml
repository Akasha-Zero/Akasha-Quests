    desc: |
      Hora de um brew para atrapalhar a vida dos inimigos! Bolsa de tinta, Cal Virgem, Óleo de Vitríolo, slime, Beladona e Bagas de Sorveira = 3 §eBrews de Tinta§r. Arremesse para cegar quem está perto (e faça Minas de Tinta com flores).
      Lembre da ordem dos itens no caldeirão, Herói. Dúvidas? NEI (R/U)!
    tasks:
      - get: witchery:ingredient:60
    rewards:
      - xp: 2
      - item: minecraft:dye x8

  - id: brew_espinhos
    title: "Brew de Espinhos"
    type: normal
    deps: [chaleira, gesso_vitriolo]
    icon: witchery:ingredient:59
    desc: |
      Que armadilha cruel e eficiente! Verde-cacto, cogumelo marrom, Óleo de Vitríolo, Odor da Pureza, papoula e Mandrágora fazem o §eBrew de Espinhos§r. Ele cria espinhos onde cai, ótimo para segurar bichos indesejados.
      Lembre da ordem dos itens no caldeirão, Herói, e cuidado onde você arremessa. Se precisar, confira a receita no NEI (R/U). Boa sorte!
    tasks:
      - get: witchery:ingredient:59
    rewards:
      - xp: 2
      - item: minecraft:cactus x8

  - id: brew_teias
    title: "Brew de Teias"
    type: normal
    deps: [chaleira, ingredientes_animais]
    icon: witchery:ingredient:58
    desc: |
      Prender os alvos em teias, que delícia! Teia (Web), cogumelo vermelho, Lã de Morcego, dente-de-leão, Sopro de Magia e Beladona fazem o §eBrew de Teias§r. Arremesse e deixe os inimigos presos enquanto você respira.
      O caldeirão é exigente com a ordem dos itens, Herói. Qualquer dúvida, aperte R ou U no NEI. Bora!
    tasks:
      - get: witchery:ingredient:58
    rewards:
      - xp: 2
      - item: minecraft:string x8

  - id: brew_vinhas
    title: "Brew de Vinhas"
    type: normal
    deps: [chaleira, ingredientes_animais]
    icon: witchery:ingredient:57
    desc: |
      Trepadeira, cogumelos, Língua de Cão, trigo e Fedor do Infortúnio fazem o §eBrew de Vinhas§r. Ele cobre a área com vinhas — ótimo para escalar (ou enrolar inimigos). Bem versátil, não acha?
      Separe todos os ingredientes antes de começar, Herói, porque o caldeirão exige a ordem certa. Se travar, o NEI (R/U) mostra a receita. Divirta-se!
    tasks:
      - get: witchery:ingredient:57
    rewards:
      - xp: 2
      - item: minecraft:vine x8

  - id: brew_broto
    title: "Brew de Brotação"
    type: normal
    deps: [chaleira, sorveira, amieiro, espinheiro]
    icon: witchery:ingredient:61
    desc: |
      Quer ver árvores brotando do nada? As três mudas de bruxa, Língua de Cão, Mandrágora e papoula fazem o §eBrew de Brotação§r. Ele faz árvores brotarem e é exigido pelos ritos da Terra Movente, do Poder da Natureza e da Floresta.
      Faça §e3§r, Herói, já que vários ritos pedem. Se a ordem no caldeirão confundir, o NEI (R/U) mostra a receita.
    tasks:
      - get: witchery:ingredient:61 x3
    rewards:
      - xp: 2
      - item: minecraft:sapling x8

  - id: brew_erosao
    title: "Brew da Erosão"
    type: normal
    deps: [chaleira, gesso_vitriolo]
    icon: witchery:ingredient:62
    desc: |
      Hora de um brew que derrete o chão! 2 Óleos de Vitríolo, Cal Virgem, Beladona, dente-de-leão e creme de magma fazem o §eBrew da Erosão§r. Ele corrói blocos e também é o foco do Rito da Terra Partida.
      Cuidado onde você arremessa, Herói! Se tiver dúvida sobre a ordem dos itens no caldeirão, confira no NEI (R/U) ou no manual do mod.
    tasks:
      - get: witchery:ingredient:62
    rewards:
      - xp: 2
      - item: minecraft:magma_cream x2

  - id: brew_amor
    title: "Brew do Amor"
    type: normal
    deps: [chaleira, fumacas_bruxa]
    icon: witchery:ingredient:75
    desc: |
      Amor no ar! Papoula, Sopro de Magia, Alcachofra, cenoura dourada, vitória-régia e cacau fazem o §eBrew do Amor§r. Ele faz os animais (e aldeões!) se apaixonarem — e é ingrediente de quase todo §eRito de Remover Maldição§r.
      Faça §e3§r, Herói, porque vai ser bem útil. Confira a ordem no NEI (R/U). Vai com carinho!
    tasks:
      - get: witchery:ingredient:75 x3
    rewards:
      - xp: 2
      - item: minecraft:golden_carrot x2

  - id: brew_grotesco
    title: "Brew do Grotesco"
    type: normal
    deps: [chaleira, mutandis_extremis, ingredientes_animais]
    icon: witchery:ingredient:71
    desc: |
      Prepare o estômago! Mutandis Extremis, Mandrágora, Alcachofra, Língua de Cão, maçã dourada e batata venenosa (500 de poder) fazem o §eBrew do Grotesco§r. Ele deixa quem bebe com uma aparência... assustadora.
      É ingrediente obrigatório das §cmaldições§r, Herói, então vale ter um guardado. Se algo não encaixar no caldeirão, confira no NEI (R/U). Boa mistura!
    tasks:
      - get: witchery:ingredient:71
    rewards:
      - xp: 2
      - item: minecraft:poisonous_potato x4

  - id: brew_gelo
    title: "Brew do Gelo"
    type: optional
    deps: [chaleira, campanula]
    icon: witchery:ingredient:76
    desc: |
      Brrr, que friozinho! Agulha Gelada, bola de neve, Alcachofra, melancia reluzente, cogumelo vermelho e Odor da Pureza (1000 de poder) fazem o §eBrew do Gelo§r. Ele congela o que atinge.
      É opcional, mas divertido, Herói! Reúna tudo antes de começar, porque o caldeirão exige a ordem certa. Se precisar, aperte R ou U no NEI para ver a receita.
    tasks:
      - get: witchery:ingredient:76
    rewards:
      - loot: comum

  - id: brew_profundezas
    title: "Brew das Profundezas"
    type: optional
    deps: [chaleira, lagrima_deusa]
    icon: witchery:ingredient:77
    desc: |
      Vai mergulhar? Mandrágora, Alcachofra, Odor da Pureza, Lágrima da Deusa, vitória-régia e tinta fazem o §eBrew das Profundezas§r. Ele dá respiração aquática — e é ingrediente dos ritos que removem Afundamento e Superaquecimento.
      É opcional, Herói, mas bem prático para explorar o fundo do mar. Se precisar relembrar a ordem no caldeirão, o NEI (R/U) mostra.
    tasks:
      - get: witchery:ingredient:77
    rewards:
      - loot: comum

  - id: brew_sono
    title: "Brew do Sono"
    type: main
    deps: [chaleira, brew_amor, campanula, leite_purificado]
    icon: witchery:ingredient:95
    desc: |
      Atenção, Herói, esse aqui é especial! Leite Purificado, biscoito, Brew do Amor, Sopro de Magia, Agulha Gelada e Alcachofra fazem o §eBrew do Sono§r. §dBeber o Brew do Sono no Mundo Normal faz seu espírito adormecer e viajar para o Mundo Espiritual.§r
      Leia a quest do Mundo Espiritual antes de beber! Faça §e2§r e confira a receita no NEI (R/U).
    tasks:
      - get: witchery:ingredient:95 x2
    rewards:
      - xp: 4
      - choice: [minecraft:cookie x16, witchery:ingredient:78 x4, minecraft:milk_bucket x1]

  - id: leite_purificado
    title: "Leite Purificado"
    type: normal
    deps: [fumacas_bruxa, jarro_argila]
    icon: witchery:ingredient:105
    desc: |
      Um toque de pureza para o seu sono! Balde de leite + Odor da Pureza + 3 Jarros de Argila = 3 §eLeites Purificados§r (um bolo também serve, com 2 Odores). Ele vai no Brew do Sono.
      Faça §e3§r, Herói. Se a receita não encaixar de primeira, confira no NEI (R/U) ou no manual do mod. Já já você vai estar com tudo pronto para sonhar!
    tasks:
      - get: witchery:ingredient:105 x3
    rewards:
      - xp: 2
      - item: minecraft:milk_bucket x1

  - id: brew_morcegos
    title: "Brew dos Morcegos"
    type: optional
    deps: [chaleira, ingredientes_animais]
    icon: witchery:ingredient:109
    desc: |
      Uma revoada de morcegos? Sim, por favor! Bola de Morcegos Concentrada (slime + morcegos capturados na Armadilha de Criaturas), Lã de Morcego, maçã, açúcar, olho fermentado e pólvora fazem o §eBrew dos Morcegos§r. Ele libera uma revoada de morcegos!
      É opcional, Herói, mas bem divertido. Dúvida na ordem? Confira no NEI (R/U).
    tasks:
      - get: witchery:ingredient:109
    rewards:
      - loot: comum

  - id: brew_revelacao
    title: "Brew da Revelação"
    type: optional
    deps: [chaleira, fumacas_bruxa]
    icon: witchery:ingredient:124
    desc: |
      Nada se esconde de você! Cenoura, 2 olhos de aranha, poção de Visão Noturna, cogumelo marrom e Odor da Pureza fazem o §eBrew da Revelação§r. Ele revela o que está invisível.
      É opcional, Herói, mas útil para quem gosta de segurança extra. Reúna os ingredientes e vigie a ordem no caldeirão. Se tiver dúvida, o NEI (R/U) mostra a receita.
    tasks:
      - get: witchery:ingredient:124
    rewards:
      - loot: comum

  - id: brew_solidificacao
    title: "Brews de Solidificação"
    type: optional
    deps: [chaleira, fumaca_podre, mutandis]
    icon: witchery:ingredient:116
    desc: |
      Líquidos que viram bloco! Um bloco (pedra, terra, areia, arenito ou o Brew da Erosão), Fumaça Fétida, Odor da Pureza, Mutandis, Cinza e Musgo Espanhol (2000 de poder) = Brew de Solidificação. Ele solidifica líquidos no bloco escolhido.
      Mostre o de Pedra para a Akasha, Herói! A ordem importa no caldeirão; cheque no NEI (R/U).
    tasks:
      - get: witchery:ingredient:116
    rewards:
      - loot: comum

  - id: minas_planta
    title: "Minas de Planta"
    type: optional
    deps: [brew_teias, brew_tinta, brew_espinhos, brew_broto]
    icon: witchery:plantmine
    desc: |
      A defesa de jardim mais traiçoeira do Registro! 3 brews (Teias, Tinta, Espinhos ou Brotação) em cima, placas de pressão de pedra e uma flor (papoula, dente-de-leão ou arbusto seco) = 4 §eMinas de Planta§r disfarçadas.
      É opcional, Herói, mas divertidíssimo. Posicione longe de onde você passa! Se a receita não encaixar, aperte R ou U no NEI.
    tasks:
      - get: witchery:plantmine:*
    rewards:
      - loot: comum

  - id: livro_brews
    title: "Bruxaria: Brews e Infusões"
    type: optional
    deps: [chaleira]
    icon: witchery:ingredient:49
    desc: |
      Todas as receitas da Chaleira num só lugar! Livro, corante preto, pena, Beladona e Odor da Pureza = §eWitchcraft: Brews & Infusions§r.
      É opcional, Herói, mas quem tem esse livro na mochila erra bem menos no caldeirão, que é tão exigente com a ordem dos itens. Se a receita do livro não encaixar de primeira, confira no NEI (R/U). Boa leitura e boas misturas!
    tasks:
      - get: witchery:ingredient:49
    rewards:
      - loot: comum

  - id: unguento_voo
    title: "Unguento de Voo"
    type: normal
    deps: [sopa_redstone]
    icon: witchery:ingredient:41
    desc: |
      Quer voar de vassoura? Sopa de Redstone, poção de Velocidade, diamante, pena, Lã de Morcego e Beladona (3000 de poder) fazem o §eUnguento de Voo§r. Ele encanta a Vassoura no Rito de Infusão do Céu.
      Reúna tudo antes de começar, Herói, porque 3000 de poder não é pouca coisa. Se precisar, o NEI (R/U) mostra a receita completa. Bom voo!
    tasks:
      - get: witchery:ingredient:41
    rewards:
      - xp: 3
      - item: minecraft:feather x8

  - id: unguento_mistico
    title: "Unguento Místico"
    type: normal
    deps: [sopa_redstone, coracao_creeper, sangue_infernal]
    icon: witchery:ingredient:83
    desc: |
      Um pouco de magia para a sua varinha! Sopa de Redstone, poção de Força, diamante, Muda de Sorveira, Coração de Creeper e Sangue Demoníaco (3000 de poder) fazem o §eUnguento Místico§r. Com um Galho de Ent, vira o Ramo Místico (varinha).
      Tenha poder de sobra no altar, Herói! Dúvida? Aperte R ou U no NEI.
    tasks:
      - get: witchery:ingredient:83
    rewards:
      - xp: 3
      - item: minecraft:diamond x1

  - id: oleo_acaso
    title: "Óleo do Acaso"
    type: normal
    deps: [sopa_redstone]
    icon: witchery:ingredient:93
    desc: |
      Para quem gosta de ver o futuro! Sopa de Redstone, poção de Visão Noturna, olho do Ender, cenoura dourada, olho de aranha e Mandrágora (2000 de poder) fazem o §eÓleo do Acaso§r. Ele infunde a Bola de Cristal e a Pedra do Vidente.
      Coloque tudo no caldeirão com calma, Herói. Confira a receita no NEI (R/U) se precisar. Vai lá!
    tasks:
      - get: witchery:ingredient:93
    rewards:
      - xp: 3
      - item: minecraft:ender_eye x1

  # ======================================================================
  # FASE 6 — CÍRCULOS DE GIZ
  # ======================================================================
  - id: giz_ritual
    title: "Giz Ritual"
    type: main
    deps: [lagrima_deusa, gesso_vitriolo, cinza_madeira]
    icon: witchery:chalkritual
    desc: |
      Chegou o desenho da magia! Lágrima da Deusa no topo, Cinza de Madeira e Gesso = §e2 Gizes Rituais§r (64 usos cada). Com ele você desenha os §ecírculos brancos§r da magia ritual.
      Faça §e4§r, Herói. É quase tudo o que vem a seguir, então não economize. Se a receita não encaixar, é só apertar R ou U no NEI. Vamos desenhar?
    tasks:
      - get: witchery:chalkritual x4
    rewards:
      - xp: 4
      - choice: [witchery:ingredient:17 x4, witchery:ingredient:18 x8, witchery:ingredient:37 x1]

  - id: giz_dourado
    title: "Giz Dourado"
    type: main
    deps: [giz_ritual, mandragora]
    icon: witchery:chalkheart
    desc: |
      No caldeirão: §eGiz Ritual + Raiz de Mandrágora + pepita de ouro§r = §eGiz Dourado§r. Ele desenha o §eGlifo do Coração§r, o centro de todo círculo. É o glifo que você ativa para iniciar um rito.
      Sem ele nenhum círculo funciona, Herói, então capriche! Se a receita confundir, confira no NEI (R/U). Boa magia!
    tasks:
      - get: witchery:chalkheart
    rewards:
      - xp: 4
      - choice: [minecraft:gold_nugget x9, witchery:ingredient:22 x2, witchery:chalkritual x1]

  - id: info_circulos
    title: "Magia de Círculo"
    type: info
    deps: [giz_dourado]
    icon: witchery:chalkritual
    desc: |
      Como fazer um rito:
      §e1.§r Glifo do Coração (giz dourado) no centro.
      §e2.§r Anéis de giz em volta: §epequeno 7×7§r, §emédio 11×11§r, §egrande 15×15§r (raios
      3, 5 e 7 a partir do centro). Cada rito exige cores e tamanhos específicos:
      §fRitual (branco)§r, §5Além-Mundo (roxo)§r, §4Infernal (vermelho)§r.
      §e3.§r Jogue os itens-foco dentro do círculo.
      §e4.§r Clique no Glifo do Coração. Quase todo rito precisa de um §eAltar§r por perto com
      poder suficiente.

      A área em volta do glifo central precisa estar livre de blocos!
    tasks:
      - check
    rewards:
      - xp: 1

  - id: livro_circulos
    title: "Bruxaria: Magia de Círculo"
    type: normal
    deps: [giz_ritual]
    icon: witchery:ingredient:48
    desc: |
      Leitura obrigatória antes de qualquer rito! Livro, corante preto, pena, Beladona e Sopro de Magia = §eWitchcraft: Circle Magic§r. Ele lista cada rito com o desenho, os focos e o poder.
      Leia antes de qualquer rito novo, Herói, para não gastar giz e poder à toa. Se a receita do livro não bater, o NEI (R/U) mostra. Bons estudos!
    tasks:
      - get: witchery:ingredient:48
    rewards:
      - xp: 2
      - item: minecraft:book x2

  - id: giz_alem_mundo
    title: "Giz do Além-Mundo"
    type: normal
    deps: [giz_dourado, orvalho_ender]
    icon: witchery:chalkotherwhere
    desc: |
      Para ritos de transposição e teleporte! No caldeirão: Giz Ritual + Verruga do Nether + Lágrima da Deusa + Pérola do Ender = §eGiz do Além-Mundo§r (roxo), com 2000 de poder.
      Guarde bem esse giz, Herói, porque ele abre caminhos entre lugares. Se tiver dúvida na ordem dos itens no caldeirão, confira no NEI (R/U) ou no manual do mod. Boa viagem!
    tasks:
      - get: witchery:chalkotherwhere
    rewards:
      - xp: 3
      - item: minecraft:ender_pearl x2

  - id: giz_infernal
    title: "Giz Infernal"
    type: normal
    deps: [giz_dourado]
    icon: witchery:chalkinfernal
    desc: |
      No caldeirão: Giz Ritual + Verruga do Nether + pó de blaze = §eGiz Infernal§r (vermelho), para ritos do Nether, demônios e maldições. §cAqui a bruxaria fica pesada.§r
      Pense bem antes de usar, Herói! Se quiser relembrar a receita ou os ritos que usam este giz, é só apertar R ou U no NEI. A escolha é sua!
    tasks:
      - get: witchery:chalkinfernal
    rewards:
      - xp: 3
      - item: minecraft:blaze_powder x4

  - id: primeiro_rito
    title: "O Primeiro Rito"
    type: milestone
    deps: [info_circulos, info_poder]
    icon: witchery:chalkheart
    banner: "O Primeiro Rito"
    subtitle: "Giz, glifo e poder"
    desc: |
      Herói, você tem um Altar pulsando, giz branco, giz dourado e o livro de Magia de Círculo. Isso já é uma bruxa (ou um bruxo) de verdade, com chapéu ou sem! Foi um caminho e tanto até aqui.

      O rito mais simples para treinar é o §eRito da Santidade§r: círculo pequeno branco, uma pena e uma redstone. Depois vem a Pedra Sintonizada Carregada, que permite ritos longe do altar. Confira a disposição dos círculos no NEI (R/U) ou no manual do mod.

      Prometa uma coisa: nada de maldições em quem não merece. Combinado?
    tasks:
      - get: [witchery:chalkheart, witchery:chalkritual, witchery:altar]
    rewards:
      - xp: 8
      - kit: {name: "Kit da Bruxa Aprendiz", items: [witchery:chalkritual x2, witchery:ingredient:37 x2, witchery:ingredient:27 x8, minecraft:feather x8, minecraft:redstone x16]}
      - loot: raro

  # ======================================================================
  # FASE 7 — RITOS DE PROTEÇÃO, CARGA E TRANSPOSIÇÃO
  # ======================================================================
  - id: rito_santidade
    title: "Rito da Santidade"
    type: normal
    deps: [primeiro_rito]
    icon: minecraft:feather
    desc: |
      Seu primeiro abrigo mágico! Desenhe um círculo §epequeno branco§r com focos de §epena + redstone§r e 500 de poder. Monstros não entram no círculo enquanto ele dura (consome 16 de poder/s).
      É só fazer o rito, Herói, e marcar a quest. Se o desenho não ficar certo, consulte o livro de Circle Magic ou o NEI (R/U). Fique em segurança!
    tasks:
      - check
    rewards:
      - xp: 2
      - item: minecraft:feather x8

  - id: rito_aprisionamento
    title: "Rito do Aprisionamento"
    type: normal
    deps: [primeiro_rito]
    icon: minecraft:slime_ball
    desc: |
      O contrário do rito anterior! Círculo pequeno branco, §ebola de slime + redstone§r, 500 de poder. Monstros não conseguem §esair§r do círculo (16 de poder/s).
      Muito bom para prender o que você precisa estudar, Herói. Desenhe com giz certinho e confira o desenho no livro Circle Magic ou no NEI (R/U). Faça o rito e marque a quest!
    tasks:
      - check
    rewards:
      - xp: 2
      - item: minecraft:slime_ball x4

  - id: rito_protecao
    title: "Rito da Proteção"
    type: normal
    deps: [primeiro_rito]
    icon: minecraft:obsidian
    desc: |
      Círculo pequeno branco, §eobsidiana + redstone§r, 500 de poder: conjura uma cúpula que
      monstros não atravessam (24 de poder/s). Com círculo médio e §eobsidiana + pedra
      luminosa§r (1000), a cúpula barra §etodos§r (28/s). Uma Pedra de Caminho ligada como foco
      extra lança a cúpula lá longe.
    tasks:
      - check
    rewards:
      - xp: 2
      - item: minecraft:obsidian x4

  - id: pedra_carregada
    title: "Pedra Sintonizada Carregada"
    type: main
    deps: [primeiro_rito, cinza_madeira]
    icon: witchery:ingredient:11
    desc: |
      Rito da Carga: círculos §epequeno e médio brancos§r, focos §ePedra Sintonizada, pó de
      pedra luminosa, redstone, Cinza de Madeira e Cal Virgem§r, 2000 de poder.

      A §ePedra Carregada§r é uma "bateria de altar": muitos ritos têm versão portátil que a
      consome no lugar do poder. Faça §e3§r.
    tasks:
      - get: witchery:ingredient:11 x3
    rewards:
      - xp: 4
      - choice: [witchery:ingredient:10 x1, minecraft:glowstone_dust x16, witchery:ingredient:16 x4]

  - id: pedra_caminho
    title: "Pedra de Caminho"
    type: normal
    deps: [primeiro_rito]
    icon: witchery:ingredient:12
    desc: |
      Sílex + Agulha de Osso = §ePedra de Caminho§r (Waystone). O Rito da Ligação (círculo
      pequeno branco: Pedra de Caminho, Orvalho do Ender e pó de pedra luminosa, 500 de
      poder) a liga ao lugar do rito. Uma Pedra ligada é a sua "âncora" de teleporte.
    tasks:
      - get: witchery:ingredient:12 x2
    rewards:
      - xp: 2
      - item: minecraft:flint x8

  - id: rito_transposicao
    title: "Rito da Transposição"
    type: normal
    deps: [pedra_caminho, giz_alem_mundo]
    icon: witchery:chalkotherwhere
    desc: |
      A rede de viagens das bruxas! Desenhe o círculo §epequeno do Além-Mundo§r (roxo) e use uma §ePedra de Caminho ligada§r como foco — sem custo de poder. Você é teleportado para o lugar ligado.
      Ligue a pedra com Orvalho do Ender antes, Herói! Se faltar detalhe, aperte R ou U no NEI ou leia o livro Circle Magic. Boa viagem!
    tasks:
      - check
    rewards:
      - xp: 3
      - item: witchery:ingredient:67 x2

  - id: kit_taglock
    title: "Agulha de Osso e Kit de Taglock"
    type: main
    deps: [primeiro_rito]
    icon: witchery:taglockkit
    desc: |
      Osso + sílex = 8 §eAgulhas de Osso§r. Frasco de vidro + agulha = §eKit de Taglock§r.
      Use o kit em uma criatura (ou numa cama onde um jogador dormiu) para recolher um
      fio de cabelo: ele vira o "endereço" de bonecos, maldições e invocações.

      §cMagia de bruxa com taglock é pessoal. Use com responsabilidade — e no servidor,
      respeite as regras!§r
    tasks:
      - get: witchery:taglockkit
    rewards:
      - xp: 4
      - choice: [minecraft:bone x16, minecraft:glass_bottle x8, minecraft:flint x8]

  - id: rito_transposicao_criatura
    title: "Transposição de Criatura"
    type: optional
    deps: [kit_taglock, rito_transposicao]
    icon: witchery:ingredient:67
    desc: |
      Puxando uma criatura até você! Desenhe o círculo §emédio do Além-Mundo§r com Pedra de Caminho, §eTaglock preenchido§r, Orvalho do Ender e machado de ferro (3000 de poder). Ele puxa até você a criatura (ou o jogador) do taglock.
      É opcional, Herói, mas bem poderoso. Confira o desenho no NEI (R/U) ou no livro de Circle Magic.
    tasks:
      - check
    rewards:
      - loot: comum

  - id: rito_fertilidade
    title: "Rito da Fertilidade"
    type: normal
    deps: [primeiro_rito, vapor_diamante, mutandis]
    icon: minecraft:dye:15
    desc: |
      Vida nova para a terra! Círculo pequeno branco: farinha de osso, Indício de Renascimento, Vapor de Diamante, Cal Virgem, Gesso e Mutandis (3000 de poder). Deixa a terra em volta fértil e §ecura aldeões doentes§r.
      Separe todos os itens antes de começar, Herói, e tenha poder no altar. Se o desenho confundir, olhe o livro de Circle Magic ou o NEI (R/U).
    tasks:
      - check
    rewards:
      - xp: 2
      - item: minecraft:dye:15 x16

  - id: rito_tempestade
    title: "Rito da Ira do Céu"
    type: normal
    deps: [primeiro_rito]
    icon: minecraft:wooden_sword
    desc: |
      Um rito com trovões! No círculo pequeno branco, §eespada de madeira + Cinza§r (1000 de poder) chama uma tempestade de raios dentro do círculo; com §eespada de pedra§r (2000) os raios caem fora dele.
      §cSaia de perto e não use perto de madeira!§r Pense na segurança, Herói. Se faltar detalhe, aperte R ou U no NEI ou consulte o livro Circle Magic.
    tasks:
      - check
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x4

  - id: rito_vulcao
    title: "Rito da Ira da Terra"
    type: normal
    deps: [giz_infernal]
    icon: minecraft:magma_cream
    desc: |
      Um vulcão de bolso! Círculo §epequeno infernal§r: pedregulho, creme de magma e espada de ouro (2000 de poder). Ergue um §evulcão§r — precisa de uma poça de lava embaixo. §cDramático, destrutivo e muito quente.§r
      Escolha um lugar longe de casa, Herói! Se o desenho confundir, consulte o livro Circle Magic ou o NEI (R/U).
    tasks:
      - check
    rewards:
      - xp: 2
      - item: minecraft:magma_cream x2

  - id: rito_assar
    title: "Rito do Assado"
    type: normal
    deps: [giz_infernal]
    icon: minecraft:cooked_beef
    desc: |
      Churrasco de bruxa! Círculo pequeno infernal: vara de blaze, Cinza e carvão (1000 de poder). Cozinha toda a comida jogada no círculo — às vezes demais.
      Jogue só o que quiser assar, Herói, e fique de olho no tempo! Se o desenho do círculo não ficar certo, aperte R ou U no NEI ou consulte o livro Circle Magic. Bom apetite!
    tasks:
      - check
    rewards:
      - xp: 2
      - item: minecraft:cooked_beef x16

  - id: rito_terra
    title: "Ritos da Terra Movente e Partida"
    type: optional
    deps: [brew_broto, brew_erosao, primeiro_rito]
    icon: minecraft:dirt
    desc: |
      Dois ritos de terra numa só quest! §eTerra Movente§r: círculo branco (pequeno, médio ou grande = coluna maior), Brew de Brotação, cacto e pólvora/redstone/pó de pedra luminosa: ergue uma coluna de terra. §eTerra Partida§r: círculo pequeno branco e Brew da Erosão: abre uma fenda no chão.
      É opcional, Herói. Confira os desenhos no NEI (R/U).
    tasks:
      - check
    rewards:
      - loot: comum

  - id: rito_natureza
    title: "Rito do Poder da Natureza"
    type: optional
    deps: [brew_broto, pedra_carregada]
    icon: minecraft:sapling
    desc: |
      Dê vida a uma área estéril! Círculo médio branco: Brew de Brotação, as três mudas de bruxa, três mudas comuns (carvalho, pinheiro, bétula) e uma Pedra Carregada. Libera a natureza numa área estéril.
      Bom para dar vida (e poder!) em volta do altar, Herói. É opcional, mas bonito de ver. Se precisar do desenho, consulte o livro Circle Magic ou o NEI (R/U).
    tasks:
      - check
    rewards:
      - loot: comum

  - id: rito_floresta
    title: "Rito da Floresta"
    type: optional
    deps: [brew_broto, galho_ent]
    icon: witchery:wickerbundle
    desc: |
      Uma floresta inteira, só para você! Círculo médio branco: a muda desejada, um Feixe de Vime (9 mudas na bancada), Brew de Brotação e Galho de Ent (4000 de poder). Faz crescer uma floresta inteira da espécie escolhida.
      É opcional, Herói, mas impressiona. Reserve poder de sobra no altar! Confira os detalhes no NEI (R/U).
    tasks:
      - check
    rewards:
      - loot: comum

  - id: transpor_minerio
    title: "Transposição do Ferro"
    type: optional
    deps: [giz_alem_mundo, pedra_carregada]
    icon: minecraft:iron_ore
    desc: |
      Mineração de bruxa! Círculo §egrande do Além-Mundo§r: pérola do Ender, lingote de ferro, pó de blaze, Vapor de Diamante e Pedra Carregada. Puxa minérios de ferro e ouro do subsolo para a superfície.
      É opcional, Herói, mas economiza muita picareta. Desenhe com calma, porque o círculo grande dá trabalho. Se travar, consulte o livro Circle Magic ou o NEI (R/U).
    tasks:
      - check
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 8 — INVOCAÇÕES, NECROMANCIA E DEMÔNIOS
  # ======================================================================
