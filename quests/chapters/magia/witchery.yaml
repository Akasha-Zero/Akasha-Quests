    rewards:
      - loot: comum

  - id: prateleira_bonecos
    title: "Prateleira de Bonecos"
    type: normal
    deps: [boneco, pedra_sintonizada]
    icon: witchery:poppetshelf
    desc: |
      Pano verde, Pedras Sintonizadas e tijolos do Nether. A §ePrateleira de Bonecos§r guarda
      bonecos que continuam funcionando e mantém o chunk carregado. Neste pack, ela só
      funciona no Mundo Normal e no Mundo Espiritual (config).
    tasks:
      - get: witchery:poppetshelf
    rewards:
      - xp: 2
      - item: minecraft:nether_brick x8

  - id: colecao_bonecos
    title: "Coleção de Bonecos"
    type: milestone
    deps: [boneco_terra, boneco_agua, boneco_fogo, boneco_fome, boneco_morte, boneco_protecao_vodu]
    icon: witchery:poppet:6
    banner: "A Bruxa dos Bonecos"
    subtitle: "Proteção para todo perigo"
    desc: |
      Terra, água, fogo, fome, morte e vodu. Herói, você agora carrega no bolso mais
      proteções do que muitos castelos!

      Organize-os numa §ePrateleira de Bonecos§r e lembre de refazer os que se gastam —
      principalmente o de §eProteção da Morte§r. Ah, e se um dia alguém usar um boneco vodu
      contra você... agora você sabe se defender.
    tasks:
      - get: [witchery:poppet:1, witchery:poppet:2, witchery:poppet:3, witchery:poppet:4, witchery:poppet:6, witchery:poppet:7]
    rewards:
      - xp: 8
      - kit: {name: "Kit da Costureira de Bonecos", items: [witchery:poppet x4, witchery:taglockkit x4, witchery:spanishmoss x8, minecraft:gold_nugget x18, minecraft:wool x8]}
      - loot: raro

  # ======================================================================
  # FASE 11 — RODA DE FIAR, VESTES E INFUSÕES
  # ======================================================================
  - id: roda_fiar
    title: "Roda de Fiar"
    type: main
    deps: [pedra_sintonizada]
    icon: witchery:spinningwheel
    desc: |
      Molduras, lã, graveto, tábuas e Pedra Sintonizada. A §eRoda de Fiar§r (perto do altar)
      fia fios mágicos: §eFio de Ouro§r (fardo de feno + Sopro de Magia), §eLinha
      Fantasiosa§r (Algodão Etéreo do Mundo Espiritual) e §eCordel Atormentado§r (Algodão
      Perturbado). Também transforma linha em teia.
    tasks:
      - get: witchery:spinningwheel
    rewards:
      - xp: 4
      - choice: [minecraft:hay_block x4, minecraft:string x16, minecraft:item_frame x4]

  - id: fio_ouro
    title: "Fio de Ouro"
    type: normal
    deps: [roda_fiar]
    icon: witchery:ingredient:102
    desc: |
      Fardo de feno + 3 linhas + Sopro de Magia na Roda = 3 §eFios de Ouro§r. Eles costuram o
      Chapéu, as Túnicas e os sapatos de bruxa.
    tasks:
      - get: witchery:ingredient:102 x3
    rewards:
      - xp: 2
      - item: minecraft:hay_block x2

  - id: couro_impregnado
    title: "Couro Impregnado"
    type: normal
    deps: [vapor_diamante, fumacas_bruxa]
    icon: witchery:ingredient:72
    desc: |
