    tasks:
      - get: witchery:ingredient:72 x8
    rewards:
      - xp: 2
      - item: minecraft:leather x8

  - id: chapeu_bruxa
    title: "Chapéu de Bruxa"
    type: main
    deps: [fio_ouro, couro_impregnado]
    icon: witchery:witchhat
    desc: |
      Couro Impregnado, Fio de Ouro e pó de pedra luminosa. O §eChapéu de Bruxa§r! As vestes
      ajudam a bruxa a "engarrafar" mais doses no caldeirão (o livro de Brews explica). E,
      sinceramente, você fica ótimo nele. Ele também é a chave para invocar §eLeonard§r...
    tasks:
      - get: witchery:witchhat
    rewards:
      - xp: 4
      - choice: [witchery:ingredient:72 x4, witchery:ingredient:102 x2, minecraft:glowstone_dust x8]

  - id: tunica_bruxa
