    tasks:
      - get: witchery:poppet:7
    rewards:
      - xp: 2
      - item: minecraft:red_mushroom x4

  - id: boneco_vampirico
    title: "Boneco Vampírico"
    type: optional
    deps: [boneco, vapor_diamante]
    icon: witchery:poppet:9
    desc: |
