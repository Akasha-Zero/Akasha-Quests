      Lembrança: o §6Aperto do Inverno§r, um braço arremessável que congela e enfraquece.
    tasks:
      - kill: {entity: "arsmagica2.BossWinterGuardian", count: 1}
      - get: arsmagica2:winter_arm
    rewards:
      - xp: 15
      - loot: [epico x2]

  - id: guardiao_raio
    title: "Guardião do Raio"
    type: boss
    deps: [rituais_guardioes, inlay_ouro, bateria_mana]
    icon: arsmagica2:essence:7
    banner: "O Guardião do Raio caiu!"
    subtitle: "A tempestade silenciou"
    task_logic: OR
    desc: |
      Imprevisível e poderosíssimo: raios de alcance extremo, sinapses embaralhadas e uma
