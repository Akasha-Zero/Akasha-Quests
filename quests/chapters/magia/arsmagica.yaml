  - id: receptaculo
    title: "Receptáculo de Pedra-Chave"
    type: main
    deps: [pedra_chave, essencia_ender]
    icon: arsmagica2:keystoneReceptacle
    desc: |
      O coração de um §ePortal§r (Gateway). Tijolos de pedra, Pó de Vinteum, Olhos do Fim e uma
      §eEssência do Ender§r formam o §eReceptáculo de Pedra-Chave§r.

      O Portal é um §eanel de tijolos de pedra e escadas de tijolo§r em volta do receptáculo
      (modelo em Compêndio → Estruturas → Gateway) e precisa de §bEtherium§r. Portais com a mesma
      Pedra-Chave se conectam; distâncias grandes custam muita energia.
    tasks:
      - get: arsmagica2:keystoneReceptacle
    rewards:
      - xp: 4
      - choice: [minecraft:stonebrick x32, minecraft:stone_brick_stairs x16, minecraft:ender_pearl x4]

  - id: perna_pau
    title: "Perna de Pau"
    type: normal
    deps: [compendio_arcano]
    icon: arsmagica2:woodenLeg
    desc: |
      Tábua, laje e graveto = uma §ePerna de Pau§r. Pra quê? Paciência, Herói... confie em mim.
      (Pirata não, mas quase.)
    tasks:
      - get: arsmagica2:woodenLeg
    rewards:
      - xp: 2
      - item: minecraft:stick x16

  - id: livro_sinistro
    title: "Um Livro de Aparência Maligna"
    type: main
    deps: [perna_pau, compendio_arcano]
    icon: arsmagica2:evilBook
    desc: |
      Perna de Pau + Compêndio Arcano = §eEvil-Looking Book§r. Ele parece... errado. Eu juro
      que ouvi um "muuu" vindo das páginas.

      §aGuarde um Compêndio extra§r — este aqui não volta a ser o que era. O livro também é
      ingrediente do Foco de Flicker: Açougue.
    tasks:
      - get: arsmagica2:evilBook
    rewards:
      - xp: 4
      - choice: [minecraft:book x4, minecraft:leather x8, minecraft:milk_bucket]

  - id: moo_moo_farm
    title: "A Moo Moo Farm"
    type: portal
    deps: [receptaculo, livro_sinistro, obelisco]
    icon: arsmagica2:cowHorn
    banner: "Bem-vindo à Moo Moo Farm"
    subtitle: "Muuuuuuuu."
    effect: 5
    desc: |
      Tá preparado para a página mais esquisita do Registro inteiro?

      Monte um §ePortal§r completo (Receptáculo + anel de tijolos de pedra e escadas) ligado a
      uma fonte de §bEtherium§r. Segure o §eLivro de Aparência Maligna§r na mão e §eclique
      direito agachado§r no Receptáculo: o portal acende em §cvermelho§r. Entre nele.

      Você vai parar na §eMoo Moo Farm§r (dimensão −31), lar das §cVacas Infernais§r. §cElas
      atacam em bando e batem forte.§r Volte pelo mesmo tipo de portal. Muuu. Eu avisei.
    tasks:
      - visit: {dim: -31, name: "The Moo Moo Farm"}
    rewards:
      - xp: 5
      - loot: raro

  - id: vaca_infernal
    title: "Vaca Infernal"
    type: normal
    deps: [moo_moo_farm]
    icon: arsmagica2:AMSpawnEgg:8
    desc: |
      "Moo? Moo moo moo, moo moo." É basicamente isso que o Compêndio diz sobre elas.

      Derrote §e10 Vacas Infernais§r. De vez em quando elas largam um diamante ou uma esmeralda
      como drop raro!
    tasks:
      - kill: {entity: "arsmagica2.HellCow", count: 10}
    rewards:
      - xp: 3
      - item: minecraft:cooked_beef x16

  - id: chifre_vaca_infernal
