      parado). Só funciona com jogadores.
    tasks:
      - get: arsmagica2:slipstreamGenerator
    rewards:
      - loot: comum

  - id: replicador_feiticos
    title: "Replicador de Feitiços"
    type: optional
    deps: [flicker_capturado, prisma_celestial]
    icon: arsmagica2:spellReplicator
