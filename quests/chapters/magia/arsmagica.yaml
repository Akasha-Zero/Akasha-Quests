  # ======================================================================
  # FASE 6 — OS GUARDIÕES ELEMENTAIS
  # ======================================================================
  - id: rituais_guardioes
    title: "Os Rituais de Invocação"
    type: info
    deps: [inlay_redstone]
    icon: arsmagica2:goldInlay
    desc: |
      Os Guardiões não vagam pelo mundo: são §einvocados§r com anéis de inlay, oferendas e
      condições especiais (Compêndio → Bestas → cada Guardião).

      Ao surgir, §co Guardião abre uma clareira enorme§r no terreno (se mobGriefing estiver
      ativo) — invoque longe de casa! Cada um, morto por você, deixa um §eOrbe do Infinito§r,
      de 0 a 3 essências do seu elemento e §e30% de chance§r da sua §6lembrança§r única. E
      cada Guardião derrotado dá §e+2000 de mana§r máxima.

      Níveis recomendados: Água 10, Terra 25, Ar 35, Arcano 45, Vida 50, Natureza 60, Raio 70,
      Fogo 90. Inverno e Ender: "muito difíceis".
    tasks:
      - check
    rewards:
      - xp: 1

  - id: guardiao_agua
    title: "Guardião da Água"
    type: boss
    deps: [rituais_guardioes]
    icon: arsmagica2:essence:4
    banner: "O Guardião da Água caiu!"
    subtitle: "A primeira maré vencida"
    task_logic: OR
    desc: |
      O mais fraco dos Guardiões — mas não subestime: ele é fluido, às vezes ignora golpes e se
      divide em §ecópias§r para atacar de emboscada.

      §eRitual:§r num bioma de muita água (oceano, rio, pântano), faça um §eanel de Inlay de
      Redstone§r. §eDurante a chuva§r, jogue dentro um §ebarco§r e um §ebalde de água§r, em
      homenagem aos navios perdidos.

      Ataque o verdadeiro, não as cópias. Recompensa: Orbe azul, Essências da Água e, com sorte,
      os §6Orbes da Água§r.
    tasks:
      - kill: {entity: "arsmagica2.BossWaterGuardian", count: 1}
      - get: arsmagica2:water_orbs
    rewards:
      - xp: 8
      - loot: raro

  - id: guardiao_terra
    title: "Guardião da Terra"
    type: boss
    deps: [rituais_guardioes, inlay_ferro, tocha_vinteum, topazio_azul, quimerita]
    icon: arsmagica2:essence:1
    banner: "O Guardião da Terra caiu!"
    subtitle: "Pedra contra magia"
    task_logic: OR
    desc: |
      Um núcleo de pedra que aguenta absurdos de dano físico e gira atacando em área.
      §cMagia funciona melhor que espada aqui.§r

      §eRitual:§r plataforma 3×3 de §eobsidiana§r com um §etijolo de pedra cinzelado§r no
      centro. Sobre a obsidiana, um §eanel de Inlay de Ferro§r; em cada lado, no mesmo nível dos
      inlays, uma §eTocha de Vinteum§r. Jogue §eum Topázio Azul, uma esmeralda e uma
      Quimerita§r.

      §cEle escava uma área grande ao surgir: nada de porão!§r Lembrança: §6Armadura da
      Terra§r.
    tasks:
      - kill: {entity: "arsmagica2.BossEarthGuardian", count: 1}
      - get: arsmagica2:earth_armor
    rewards:
      - xp: 8
      - loot: raro

  - id: guardiao_arcano
    title: "Guardião Arcano"
    type: boss
    deps: [rituais_guardioes, inlay_ferro, atril, essencia_arcana]
    icon: arsmagica2:essence
    banner: "O Guardião Arcano caiu!"
    subtitle: "Um duelo de magos antigos"
    task_logic: OR
    desc: |
      Um mago de eras antigas com um repertório imenso de feitiços (ataque, buffs, debuffs) e um
      sigilo protetor que pune tanto quem bate de perto quanto quem atira de longe.

      §eRitual — o Santuário do Conhecimento:§r dois pilares de §eestantes de livros§r com 3 de
      altura, um §eAtril com um Compêndio Arcano§r no chão entre eles e, bem em frente, um
      §eanel de Inlay de Ferro§r. Jogue uma §eEssência Arcana§r no centro do anel.

      Lembrança: o §6Grimório Arcano§r (feitiços mais fortes e mais baratos).
    tasks:
      - kill: {entity: "arsmagica2.BossArcaneGuardian", count: 1}
      - get: arsmagica2:arcane_spellbook
    rewards:
      - xp: 10
      - loot: epico

  - id: guardiao_ar
    title: "Guardião do Ar"
    type: boss
    deps: [rituais_guardioes, inlay_ouro, essencia_ar]
    icon: arsmagica2:essence:2
    banner: "O Guardião do Ar caiu!"
    subtitle: "Acima das nuvens"
    task_logic: OR
    desc: |
      Um ser de vento que adora §erepulsão§r. §cSem proteção contra queda, é suicídio.§r Ele
      lança feitiços fortes à distância, mas alguns exigem muita concentração... aproveite essas
      pausas.

      §eRitual:§r suba acima das nuvens, construa uma plataforma a §eY 150 ou mais§r, faça um
      §eanel de Inlay de Ouro§r e jogue uma §eEssência do Ar§r.

      Lembrança: o §6Trenó Aéreo§r, mais rápido que o voo criativo.
    tasks:
      - kill: {entity: "arsmagica2.BossAirGuardian", count: 1}
      - get: arsmagica2:air_sled
    rewards:
      - xp: 10
      - loot: epico

  - id: guardiao_inverno
    title: "Guardião do Inverno"
    type: boss
    deps: [rituais_guardioes, inlay_ouro, topazio_azul]
    icon: arsmagica2:essence:6
    banner: "O Guardião do Inverno caiu!"
    subtitle: "O gelo se parte"
    task_logic: OR
    desc: |
      A encarnação do inverno, cercada de ventos gelados que drenam a força de quem se
      aproxima. §cO Compêndio avisa: é um dos chefes mais difíceis do mod.§r

      §eRitual:§r num bioma gelado, coloque um §eanel de Inlay de Ouro§r e, no centro, uma
      efígie: §egelo em cima de dois Blocos de Topázio Azul§r. Depois crie §e3 golens de neve§r
