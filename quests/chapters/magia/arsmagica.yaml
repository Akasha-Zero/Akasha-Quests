    type: optional
    deps: [vaca_infernal]
    icon: arsmagica2:cowHorn
    desc: |
      Um troféu raríssimo: cada Vaca Infernal tem só §e1% de chance§r de largar o seu §eChifre§r
      (já vem encantado!). Persistência, Herói. Muuuuita persistência.
    tasks:
      - get: arsmagica2:cowHorn
    rewards:
      - loot: raro

