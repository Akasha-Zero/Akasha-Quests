    icon: arsmagica2:flickerJar:8
    desc: |
      Capture um Flicker de qualquer elemento! Os potes cheios são ingredientes dos §eFocos de
      Flicker§r e, colocados num Habitat vizinho, servem de §eupgrade§r para outro Habitat.
    tasks:
