    rewards:
      - loot: comum

  - id: gerador_corrente_ar
    title: "Gerador de Corrente de Ar"
    type: optional
    deps: [floresta_witchwood, essencia_ar]
    icon: arsmagica2:slipstreamGenerator
    desc: |
