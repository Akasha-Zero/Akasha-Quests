    tasks:
      - get: arsmagica2:spellReplicator
    rewards:
      - loot: incomum

  - id: vara_pesca_arcana
    title: "Vara de Pesca Arcana"
    type: optional
    deps: [essencia_ender]
    icon: arsmagica2:arcane_rod
    desc: |
      Uma vara comum com Pó de Vinteum e Essências do Ender pesca nas profundezas do §eFim§r (e
      no vazio de outros mundos) ingredientes raros: §ePeixe Celestial§r, §ePó Cósmico§r e até
      §eEstrelas Espaciais§r.
    tasks:
      - get: arsmagica2:arcane_rod
    rewards:
      - loot: comum

  - id: vara_pesca_infernal
    title: "Vara de Pesca Infernal"
    type: optional
    deps: [vara_pesca_arcana, essencia_fogo]
    icon: arsmagica2:infernal_rod
    desc: |
      Com Cinza Arcana e Essências do Fogo, a vara aguenta os lagos de lava do Nether (e perde a
      pesca no vazio). De lá vêm o §ePeixe Infernal§r e o §eSedimento Pirogênico§r.
    tasks:
      - get: arsmagica2:infernal_rod
    rewards:
      - loot: comum

  - id: pescados_arcanos
    title: "Pescados Arcanos"
    type: optional
    deps: [vara_pesca_arcana]
    icon: arsmagica2:itemOre:9
    desc: |
      Mostre um tesouro das águas estranhas: §ePeixe Celestial§r, §ePó Cósmico§r, §ePeixe
      Infernal§r ou §eSedimento Pirogênico§r.
    tasks:
      - one_of: [arsmagica2:itemOre:9, arsmagica2:itemOre:10, arsmagica2:itemOre:13, arsmagica2:itemOre:14]
    rewards:
      - loot: comum

  - id: estrela_espacial
    title: "Estrela Espacial"
    type: optional
    deps: [pescados_arcanos]
    icon: arsmagica2:itemOre:15
    desc: |
      Meio física, meio mágica, rara e valiosa: as §eEstrelas Espaciais§r cruzam o vazio do Fim,
      sobretudo em noites de lua cheia. Com uma delas e uma pérola, o Ritual da Cruz Anelada
      transforma uma Aurem Negra num §eVórtice Espacial§r, que troca energia com outros vórtices.
    tasks:
      - get: arsmagica2:itemOre:15
    rewards:
      - loot: incomum

  - id: diario_mago
    title: "Diário"
    type: optional
    deps: [essencia_arcana]
    icon: arsmagica2:playerjournal
    desc: |
      Livro e Pena + Essência Arcana = §eDiário§r: ele grava a sua experiência para ser
      recuperada depois, lendo. Um cofrinho de XP de mago.
    tasks:
      - get: arsmagica2:playerjournal
    rewards:
      - loot: comum

  - id: rituais_avancados
    title: "Rituais Avançados"
    type: info
    deps: [prisma_celestial]
    icon: arsmagica2:candle
    desc: |
      Giz, velas, reagentes jogados no chão e um feitiço mirado no centro. Além da Purificação e
      da Corrupção, o Compêndio ensina:

      §e• Ampulheta§r — estende buffs (Voo, Pressa, Escudo...) em +180 s, mais 180 s por Poder
      de Buff.
      §e• Cruz Anelada§r — Retornar até um Portal (as runas viram a combinação), puxar outro
      jogador, criar Vórtices Espaciais e a Aura do Outro Mundo.
      §e• Fusão com o Mundo§r — um bloco de esmeralda no centro e um feitiço de §eElo de Mana§r
      dão mana extra permanente.
      §e• Corrupção do Gerador§r — Rift ou Life Tap recolhem um gerador de monstros (inerte).
    tasks:
      - check
    rewards:
      - xp: 1

  - id: gerador_inerte
    title: "Gerador Inerte"
    type: optional
    deps: [rituais_avancados, foco_monstro, essencia_ender]
    icon: arsmagica2:inertSpawner
    desc: |
      Com o Ritual da Corrupção (Foco de Monstro + Essência do Ender) e um feitiço de Rift ou
      Life Tap, você §erecolhe um gerador de monstros§r — ele vira um §eGerador Inerte§r. Com
      Etherium Sombrio e um Filactério cheio ele volta a funcionar; com o Ritual da Cruz e
      Transposição, vira a §eAura do Outro Mundo§r, que automatiza a criação de feitiços.
    tasks:
      - get: arsmagica2:inertSpawner
    rewards:
      - loot: incomum

  - id: aura_outro_mundo
    title: "Aura do Outro Mundo"
    type: optional
    deps: [gerador_inerte, traje_mago]
    icon: arsmagica2:otherworldAura
    desc: |
      A Aura invoca uma §esombra de quem a criou§r para buscar os reagentes do Altar de Criação
      em baús a até 8 blocos. Ela precisa ficar a até 10 blocos do altar e de Etherium Sombrio ou
      Neutro (viagem interdimensional é cara!). Sem energia, a sombra some... e pode levar o
      reagente que estava carregando, de birra.
    tasks:
      - get: arsmagica2:otherworldAura
    rewards:
      - loot: incomum

  - id: reino_fractal
    title: "O Reino Fractal"
    type: optional
