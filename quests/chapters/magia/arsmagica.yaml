chapter:
  id: arsmagica
  title: "Ars Magica 2"
  prefix: ""
  order: 560
  icon: arsmagica2:ArcaneCompendium
  desc: |
    §dO Volume das Artes Arcanas.§r Vinteum, o Compêndio Arcano, feitiços montados à mão
    (formas, componentes e modificadores), Etherium Neutro, Luminoso e Sombrio, os dez
    Guardiões elementais e a misteriosa Moo Moo Farm. (AM2.5 LTS 1.6.11)

quests:
  # ======================================================================
  # FASE 0 — O DESPERTAR ARCANO
  # ======================================================================
  - id: volume_arcano
    title: "O Volume das Artes Arcanas"
    type: info
    icon: arsmagica2:ArcaneCompendium
    desc: |
      Este Volume foi um dos que mais sofreram com a Fratura, Herói. As páginas do Ars Magica
      falam de uma magia que mora dentro de você: §dmana§r que se regenera, um §dnível de
      mago§r que sobe a cada feitiço bem lançado e um §cesgotamento§r (burnout) que cresce
      quando você exagera.

      O caminho é este:
      §e1.§r Vinteum e um lago de Etherium → o §eCompêndio Arcano§r.
      §e2.§r Óculo (pontos de habilidade) → Mesa de Inscrição → Altar de Criação → seu primeiro
      feitiço.
      §e3.§r Obelisco e a rede de §bEtherium§r → Refinador de Essências → as essências.
      §e4.§r Os Guardiões elementais, as armaduras de mago e, por fim, as Vestes do Arquimago.

      §aDica:§r o próprio Compêndio é a melhor referência (com receitas, estruturas em 3D e
      rituais). Este pack usa a versão §eAM2.5 LTS§r, que difere um pouco do AM2 clássico.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: minerio_vinteum
    title: "O Brilho Azul"
    type: main
    deps: [volume_arcano]
    icon: arsmagica2:vinteumOre
    desc: |
      Conta a lenda que o Vinteum nasceu de um raio arcano que bateu num raio do Fim. Eu não
      estava lá para confirmar, mas o brilho azul é inconfundível!

      O §eMinério de Vinteum§r aparece em veios pequenos entre as camadas §eY 10 e 45§r (há
      também a versão em ardósia profunda do Et Futurum). Junte §e8 minérios§r.

      §aDica:§r guarde-os crus — a próxima página ensina a transformá-los.
    tasks:
      - get: ore:oreVinteum x8
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, minecraft:coal x16, minecraft:torch x32]

  - id: po_vinteum
    title: "Pó de Vinteum"
    type: main
    deps: [minerio_vinteum]
    icon: arsmagica2:itemOre
    desc: |
      Sozinho, o Vinteum parece só uma pedrinha bonita. Mas aqueça-o e ele vira um pó com uma
      capacidade enorme de conduzir §bEtherium§r — a energia do Ars Magica.

      Funda o minério na fornalha para obter §ePó de Vinteum§r (o martelo de forja do Immersive
      Engineering também serve). Junte §e16§r: quase toda receita do mod usa esse pó.
    tasks:
      - get: ore:dustVinteum x16
    rewards:
      - xp: 4
      - choice: [minecraft:redstone x16, minecraft:glowstone_dust x8, minecraft:paper x16]

  - id: lago_etherium
    title: "Lagos de Etherium"
    type: info
    deps: [volume_arcano]
    icon: arsmagica2:liquidEssenceBucket
    desc: |
      Já viu uma pocinha azul-celeste brilhando no meio do mato? Isso é §bEtherium Líquido§r,
      a magia do mundo em estado puro. Os lagos aparecem pelo Mundo Normal (e dentro das
      florestas de Witchwood).

      Marque a posição de um deles: é ali que você vai despertar o Compêndio Arcano na
      próxima página. §cNão tente beber.§r
    tasks:
      - check
    rewards:
      - xp: 1

  - id: compendio_arcano
    title: "O Compêndio Arcano"
    type: main
    deps: [po_vinteum, lago_etherium]
    icon: arsmagica2:ArcaneCompendium
    banner: "O Compêndio desperta"
    subtitle: "A magia agora mora em você"
    desc: |
      O Compêndio Arcano não é fabricado: ele é §dinvocado§r. E eu adoro esse ritual!

      Coloque uma §eMoldura de Item§r a até §e2 blocos§r de um lago de §bEtherium Líquido§r e
      ponha um §eLivro§r comum nela. Espere cerca de §e40 segundos§r: o livro absorve a magia
      do lago e se transforma no §eArcane Compendium§r.

      Ao pegá-lo, a interface do mago acende: barra azul de mana, barra vermelha de
      esgotamento e o seu nível de mago. Use §e/amuicfg§r para reposicionar o HUD.
    tasks:
      - get: arsmagica2:ArcaneCompendium
    rewards:
      - xp: 4
      - choice: [arsmagica2:itemOre x8, minecraft:book x4, minecraft:item_frame x2]

  - id: mana_e_nivel
    title: "Mana, Nível e Esgotamento"
    type: info
    deps: [compendio_arcano]
    icon: arsmagica2:manaCake
    desc: |
      Três números regem a sua vida de mago, Herói:

      §b• Mana§r — a energia dos feitiços. Regenera sozinha; Bolo de Mana, Poções de Mana e
      ficar perto de um Obelisco/Prisma/Aurem com mais de 10% de carga ajudam.
      §c• Esgotamento (burnout)§r — o cansaço. Quanto maior, mais caro cada feitiço; no
      limite vêm lentidão, fraqueza, raios e até teletransportes aleatórios.
      §d• Nível de mago§r — sobe com lançamentos §evalidos§r (o feitiço precisa fazer o que
      promete; jogar bola de fogo na parede não conta) e aumenta mana e esgotamento máximos.
      Derrotar Guardiões também dá mana extra.

      Bater no mesmo prego o tempo todo tem retorno decrescente: varie os feitiços!
    tasks:
      - check
    rewards:
      - xp: 1

  # ======================================================================
  # FASE 1 — GEMAS, PLANTAS E O ÓCULO
  # ======================================================================
  - id: topazio_azul
    title: "Topázio Azul"
    type: main
    deps: [po_vinteum]
    icon: arsmagica2:itemOre:5
    desc: |
      O cristal de entrada de todo aprendiz. O §eMinério de Topázio Azul§r gera entre
      §eY 10 e 80§r e solta a gema direto ao ser minerado.

      Junte §e6 Topázios Azuis§r — o Óculo, a Pedra Eterna, os Óculos e o Cajado Magitech
      dependem dele.
    tasks:
      - get: ore:gemBlueTopaz x6
    rewards:
      - xp: 4
      - choice: [minecraft:coal x16, minecraft:stonebrick x32, minecraft:glass x16]

  - id: quimerita
    title: "Quimerita"
    type: normal
    deps: [po_vinteum]
    icon: arsmagica2:itemOre:4
    desc: |
      Muda de cor o tempo inteiro — fiquei hipnotizada a primeira vez que vi.

      A §eQuimerita§r (Chimerite) gera entre §eY 10 e 80§r e também cai como gema. Ela é a
      base de ilusões, das Baterias de Mana e dos Conduítes de Etherium. Junte §e6§r.
    tasks:
      - get: ore:gemChimerite x6
    rewards:
      - xp: 2
      - item: arsmagica2:itemOre x4

  - id: pedra_do_sol
    title: "Pedra do Sol"
    type: normal
    deps: [quimerita]
    icon: arsmagica2:itemOre:6
    desc: |
      A §ePedra do Sol§r (Sunstone) só se forma sob calor intenso e pouca pressão: o minério
      aparece §eao redor de lava§r, principalmente nos lagos de lava do Nether (e, com sorte,
      nas poças de lava do Mundo Normal).

      §cLeve resistência ao fogo.§r Junte §e2 Pedras do Sol§r — elas são reagente da Aurem
      Negra e de várias peças avançadas.
    tasks:
      - get: ore:gemSunstone x2
    rewards:
      - xp: 3
      - item: minecraft:potion:8195 x2

  - id: pedra_da_lua
    title: "Meteoros de Pedra da Lua"
    type: normal
    deps: [mana_e_nivel]
    icon: arsmagica2:itemOre:7
    desc: |
      Olhe para o céu à noite... está vendo aquele risco? A §ePedra da Lua§r só existe em
      §emeteoros§r que caem perto de você, sempre sobre a camada de cobertura do bioma (grama,
      areia...). A lua cheia aumenta a chance.

      §cNo pack, os meteoros só caem para magos de nível 10 ou mais§r e eles arrebentam o
      terreno onde batem. Ache a cratera e minere o §eMinério de Pedra da Lua§r.
    tasks:
      - get: ore:gemMoonstone x2
    rewards:
      - xp: 3
      - item: arsmagica2:itemOre x8

  - id: cerublossom
    title: "Cerublossom"
    type: normal
    deps: [compendio_arcano]
    icon: arsmagica2:blueOrchid
    desc: |
      Uma florzinha azul que brilha de leve — uma das primeiras plantas mágicas conhecidas.
      A §eCerublossom§r cresce em biomas verdes e úmidos.

      Ela é catalisadora do Vinteum Purificado, ingrediente do Bolo de Mana e da Chave de
      Cristal. Colha §e4§r.
    tasks:
      - get: arsmagica2:blueOrchid x4
    rewards:
      - xp: 2
      - item: minecraft:dye:15 x16

  - id: desert_nova
    title: "Desert Nova"
    type: normal
    deps: [compendio_arcano]
    icon: arsmagica2:desertNova
    desc: |
      Uma flor do deserto que solta pequenas explosões de magia — por isso o nome!

      A §eDesert Nova§r cresce em biomas secos. Ela anda sempre ao lado da Cerublossom nas
      receitas (Chave de Cristal, Bolo de Mana, Vinteum Purificado). Colha §e4§r.
    tasks:
      - get: arsmagica2:desertNova x4
    rewards:
      - xp: 2
      - item: minecraft:dye:15 x16

  - id: raiz_tarma
    title: "Raiz de Tarma"
    type: normal
    deps: [compendio_arcano]
    icon: arsmagica2:TarmaRoot
    desc: |
      Mais leve do que parece! A §eRaiz de Tarma§r cresce em cavernas e lugares escuros.

      Ela é o ingrediente da §eEssência do Ar§r no Refinador e de vários feitiços. Junte §e4§r.
    tasks:
      - get: arsmagica2:TarmaRoot x4
    rewards:
      - xp: 2
      - item: minecraft:torch x16

  - id: wakebloom
    title: "Wakebloom"
    type: normal
    deps: [compendio_arcano]
    icon: arsmagica2:wakebloom
    desc: |
      Uma vitória-régia mágica que flutua em águas de climas quentes.

      A §eWakebloom§r é a alma da §eEssência da Água§r e aparece em feitiços aquáticos. Colha
      §e4§r (um barco ajuda muito).
    tasks:
      - get: arsmagica2:wakebloom x4
    rewards:
      - xp: 2
      - item: minecraft:boat

  - id: floresta_witchwood
    title: "A Floresta de Witchwood"
    type: normal
    deps: [compendio_arcano]
    icon: arsmagica2:WitchwoodLog
    desc: |
      Árvores enormes, folhas escuras, faíscas no ar... você chegou numa §dFloresta de
      Witchwood§r, o bioma do Ars Magica (raro, mas ativo no pack).

      Corte §e16 Troncos de Witchwood§r. A madeira serve para o Gerador de Corrente de Ar, a
      Lousa de Witchwood das Velas e o Altar de Criação (um dos melhores materiais).
      §aCuriosidade:§r Flickers Arcanos adoram estas florestas.
    tasks:
      - get: ore:witchwoodLog x16
    rewards:
      - xp: 3
      - choice: [minecraft:sapling x8, minecraft:apple x8, minecraft:bread x8]

  - id: aum
    title: "Aum"
    type: optional
    deps: [floresta_witchwood]
    icon: arsmagica2:Aum
    desc: |
      Uma flor de propriedades curativas que só nasce §eao pé das árvores de Witchwood§r.
      O §eAum§r é componente de muitos feitiços. Leve alguns para casa.
    tasks:
      - get: arsmagica2:Aum x2
    rewards:
      - loot: comum

  - id: muda_witchwood
    title: "Muda de Witchwood"
    type: optional
    deps: [floresta_witchwood, extrator_etherium]
    icon: arsmagica2:saplingWitchwood
    desc: |
      As mudas de Witchwood caem raramente das folhas e são exigentes: precisam de uma fonte
      de §bEtherium Líquido§r encostada, um bloco abaixo e ao lado (x/z ±1, y−1). Quanto mais
      fontes ao redor (até 8), mais rápido crescem — e mesmo assim demora!

      Ter uma Witchwood em casa vale a pena: madeira e Aum sem viajar.
    tasks:
      - get: arsmagica2:saplingWitchwood
    rewards:
      - loot: comum

  - id: oculo
    title: "O Óculo"
    type: main
    deps: [topazio_azul, compendio_arcano]
    icon: arsmagica2:occulus
    desc: |
      "Uma porta para as estrelas que mostra o seu eu interior." Bonito, né? Fui eu que...
      tá, não fui eu que escrevi, mas eu concordo!

      O §eÓculo§r (tijolos de pedra, vidro, carvão e um Topázio Azul) é onde você gasta
      §epontos de habilidade§r para aprender formas, componentes e modificadores. Você começa
      com §e3 pontos azuis§r: gaste ao menos §eUMA forma e UM componente§r (por exemplo,
      Projétil + Dano Físico), senão não dá para montar feitiço nenhum!
    tasks:
      - get: arsmagica2:occulus
    rewards:
      - xp: 4
      - choice: [minecraft:stonebrick x32, minecraft:glass x16, arsmagica2:itemOre x8]

  - id: pontos_habilidade
    title: "Pontos de Habilidade"
    type: info
    deps: [oculo]
    icon: arsmagica2:rune:17
    desc: |
      O Óculo tem quatro árvores: §cOfensa§r, §9Defesa§r, §aUtilidade§r e §dTalentos§r.

      §e• Pontos azuis:§r a cada nível par do 2 ao 20.
      §e• Pontos verdes:§r níveis pares do 22 ao 40.
      §e• Pontos vermelhos:§r níveis pares do 42 ao 50.
      Pontos extras vêm de §eOrbes do Infinito§r (masmorras e Guardiões).

      O Óculo avisa que a primeira árvore escolhida vira a "primária"; neste pack o limite
      das árvores secundárias está no padrão (99 camadas), então na prática ele não trava o
      seu aprendizado. Algumas habilidades §7prateadas§r só são liberadas lançando a
      combinação certa de partes (veja "Habilidades Prateadas" no Compêndio).
    tasks:
      - check
    rewards:
      - xp: 1

  - id: orbe_infinito
    title: "Orbe do Infinito"
    type: optional
    deps: [pontos_habilidade]
    icon: arsmagica2:rune:17
    desc: |
      Um orbe que guarda um ponto de habilidade inteiro! Os azuis, verdes e vermelhos aparecem
      em baús de masmorras e são o prêmio garantido de cada Guardião.

      Encontre um e use-o (clique direito) para ganhar o ponto. (Se usar sem estar pronto, a
      mensagem é... criativa. Eu ri.)
    tasks:
      - one_of: [arsmagica2:rune:17, arsmagica2:rune:18, arsmagica2:rune:19]
    rewards:
      - loot: comum

  - id: talentos
    title: "Talentos"
    type: info
    deps: [pontos_habilidade]
    icon: arsmagica2:manaPotionBundle:3
    desc: |
      A quarta árvore do Óculo não ensina feitiços: ela melhora §dvocê§r. Alguns talentos:

      §e• Capacidade de Mana I–III§r e §eRegeneração de Mana I–III§r.
      §e• Movimento de Feitiço§r — andar em velocidade normal enquanto canaliza.
      §e• Conjuração Aumentada§r — durações, raios e dano maiores.
      §e• Invocação Extra§r, §eGlifos Extras§r, §eBando de Magos I/II§r (Magos da Luz seguem
      você).
      §e• Ganho de Afinidade§r e §eCor§r (muda a cor das partículas com um corante no altar).

      Planeje: os pontos são escassos.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: afinidades
    title: "Afinidades"
    type: info
    deps: [primeiro_feitico]
    icon: arsmagica2:bookAffinity
    desc: |
      Cada componente tem um elemento. Quanto mais você lança de um elemento, mais
      §dafinidade§r ganha com ele (veja o gráfico no HUD ou no Óculo). Componentes da sua
      afinidade custam menos; os do elemento oposto, mais.

      Cada afinidade dá bônus e penalidades: Terra reduz dano mas afunda na água; Fogo resiste
      a lava mas sofre com água; Raio corre mais mas não gosta de chuva; Arcano reduz o custo
      de mana mas sofre mais dano mágico... e assim por diante.

      Ao chegar a 100%, você §etrava§r naquela afinidade; um §eTomo de Afinidade§r oposto (ou
      o Geral) destrava.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: tomo_afinidade
    title: "Tomo de Afinidade"
    type: optional
    deps: [afinidades, vinteum_purificado, essencia_arcana]
    icon: arsmagica2:bookAffinity:1
    desc: |
      Relatórios de magos sobre um elemento. Lido, ele dá §e+10%§r naquela afinidade e tira
      10% das outras; o §eTomo Geral§r só reduz tudo em 10% e destrava uma afinidade travada.

      A receita leva um livro, Vinteum Purificado, a essência do elemento e Orbes do Infinito
      vermelhos (confira no NEI). Caro — use quando realmente quiser mudar de rumo.
    tasks:
      - one_of: [arsmagica2:bookAffinity, arsmagica2:bookAffinity:1, arsmagica2:bookAffinity:2, arsmagica2:bookAffinity:3, arsmagica2:bookAffinity:4, arsmagica2:bookAffinity:5, arsmagica2:bookAffinity:6, arsmagica2:bookAffinity:7, arsmagica2:bookAffinity:8, arsmagica2:bookAffinity:9, arsmagica2:bookAffinity:10]
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 2 — INSCRIÇÃO E O PRIMEIRO FEITIÇO
  # ======================================================================
  - id: pergaminho
    title: "Pergaminho de Feitiço"
    type: normal
    deps: [oculo]
    icon: arsmagica2:spellParchment
    desc: |
      Há milhares de anos os magos escrevem feitiços em papel — e ninguém inventou nada melhor.

      Papel entre dois gravetos = §ePergaminho de Feitiço§r. Ele vai na receita da Mesa de
      Inscrição e é o "corpo" final de todo feitiço criado no altar.
    tasks:
      - get: arsmagica2:spellParchment x2
    rewards:
      - xp: 2
      - item: minecraft:paper x8

  - id: mesa_inscricao
    title: "Mesa de Inscrição"
    type: main
    deps: [pergaminho]
    icon: arsmagica2:InscriptionTable
    desc: |
      Organização é tudo para um mago! A §eMesa de Inscrição§r (tocha, pergaminho, pena, lajes
      e tábuas) é onde você §ecompõe§r o feitiço.

      Coloque um §eLivro e Pena§r nela. No topo ficam as partes que você conhece; arraste formas
      e modificadores para os §egrupos de forma§r (quadrados marrons) e monte a §egramática§r
      embaixo, em ordem. Ao terminar, a receita é escrita no livro — leia-o: ele lista os
      materiais e a afinidade do feitiço.
    tasks:
      - get: arsmagica2:InscriptionTable
    rewards:
      - xp: 4
      - choice: [minecraft:writable_book x2, minecraft:feather x8, minecraft:dye x8]

  - id: formas
    title: "Formas"
    type: info
    deps: [mesa_inscricao]
    icon: arsmagica2:spellParchment
    desc: |
      A §eforma§r diz §ecomo§r o feitiço acha o alvo. Algumas:

      §e• Projétil§r — uma bola que voa por 5 s; §e• Toque§r — alcance curtíssimo;
      §e• Si Mesmo§r — em você; §e• Canalizado§r e §eFeixe§r — contínuos (cansam!);
      §e• Área (AoE)§r, §eZona§r, §eCorrente§r, §eOnda§r, §eParede§r;
      §e• Runa§r e §eGlifo§r — armadilhas e feitiços "guardados";
      §e• Contingências§r (queda, dano, fogo, vida, morte) e §eVínculo§r (ferramentas).

      Formas podem se encadear em estágios (ex.: Projétil → Área).
    tasks:
      - check
    rewards:
      - xp: 1

  - id: componentes
    title: "Componentes"
    type: info
    deps: [mesa_inscricao]
    icon: arsmagica2:essence
    desc: |
      O §ecomponente§r é o que o feitiço §efaz§r. Há dezenas: Dano Físico, de Fogo, de Gelo e
      de Raio, Cavar, Cura, Regeneração, Salto, Queda Lenta, Pressa, Voo, Luz, Visão Noturna,
      Telecinese, Atração, Piscar (Blink), Marcar/Retornar, Invocar, Escudo, magias de plantas
      (Crescer, Colher, Arar), Tempestade, Estrela Cadente e muito mais.

      Cada componente aparece uma vez por estágio e pede §ereagentes§r no altar (o livro da
      Mesa de Inscrição mostra quais). Os disponíveis aparecem no Compêndio.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: modificadores
    title: "Modificadores"
    type: info
    deps: [mesa_inscricao]
    icon: arsmagica2:essence:10
    desc: |
      §eModificadores§r ajustam forma e componentes: Dano, Cura, Velocidade, Duração, Alcance,
      Raio, Gravidade, Ricochete, Perfurante, Teleguiado, Poder de Mineração, Prosperidade
      (fortuna), Toque Sedoso, Alvejar Blocos/Jogadores/Criaturas/Monstros, Lunar, Solar...

      Regra de ouro: cada aspecto pode ser modificado §eno máximo 3 vezes por estágio§r.
      E cada modificador a mais aumenta a instabilidade da criação no altar!
    tasks:
      - check
    rewards:
      - xp: 1

  - id: runa_branca
    title: "Runas em Branco"
    type: normal
    deps: [mesa_inscricao]
    icon: arsmagica2:rune:1
    desc: |
      Toda criação de feitiço começa jogando uma §eRuna em Branco§r no altar. Cinco
      pedregulhos em "V" rendem §e2 runas§r.

      Combinadas com corante, viram runas coloridas — que aparecem em receitas e rituais.
      Faça §e4§r.
    tasks:
      - get: arsmagica2:rune:1 x4
    rewards:
      - xp: 2
      - item: minecraft:cobblestone x32

  - id: runas_coloridas
    title: "Runas Coloridas"
    type: optional
    deps: [runa_branca]
    icon: arsmagica2:rune:13
    desc: |
      Runa em Branco + corante = runa da cor. As Vestes de Mago pedem runas roxa, branca,
      amarela e preta; as Pedras-Chave, Portais e o Ritual da Cruz usam combinações de cores
      como "senhas".

      Faça uma runa de qualquer cor.
    tasks:
      - one_of: [arsmagica2:rune, arsmagica2:rune:2, arsmagica2:rune:3, arsmagica2:rune:4, arsmagica2:rune:5, arsmagica2:rune:6, arsmagica2:rune:7, arsmagica2:rune:8, arsmagica2:rune:9, arsmagica2:rune:10, arsmagica2:rune:11, arsmagica2:rune:12, arsmagica2:rune:13, arsmagica2:rune:14, arsmagica2:rune:15, arsmagica2:rune:16]
    rewards:
      - loot: comum

  - id: atril
    title: "Atril"
    type: normal
    deps: [mesa_inscricao]
    icon: arsmagica2:blockLectern
    desc: |
      Um apoio elegante para livros (até Taumonomicons!). O §eAtril§r (lajes e tábua) é peça
      obrigatória do Altar de Criação: é nele que vai o livro escrito na Mesa de Inscrição,
      guiando você passo a passo.
    tasks:
      - get: arsmagica2:blockLectern
    rewards:
      - xp: 2
      - item: minecraft:planks x16

  - id: altar_criacao
    title: "O Altar de Criação"
    type: main
    deps: [atril, runa_branca, po_vinteum]
    icon: arsmagica2:CraftingAltar
    desc: |
      Aqui os magos fazem milagres. O bloco central §eCrafting Altar§r (Pó de Vinteum +
      pedra) é o coração de uma §eestrutura multibloco§r — veja o modelo 3D no Compêndio
      (Estruturas → Crafting Altar). Ela inclui o Atril e uma alavanca.

      O §epoder§r do altar depende do material principal (tábuas, tijolos de pedra, arenito,
      tijolos, Witchwood, tijolos do Nether, quartzo) e das §e5 tampas§r (vidro, carvão,
      redstone, ferro, lápis, ouro, diamante, esmeralda, Pedra da Lua, Pedra do Sol). Tábuas
      com tampas de vidro = no máximo 2 efeitos; o máximo absoluto é 13.

      §aMenos instabilidade:§r construa a céu aberto, crie à noite, cerque com Giz de Mago e
      não deixe gente distraindo você.
    tasks:
      - get: arsmagica2:CraftingAltar
    rewards:
      - xp: 4
      - choice: [minecraft:stonebrick x32, minecraft:glass x8, minecraft:lever x2]

  - id: primeiro_feitico
    title: "Meu Primeiro Feitiço"
    type: milestone
    deps: [altar_criacao, formas, componentes]
    icon: arsmagica2:spellBase
    banner: "O Primeiro Feitiço"
    subtitle: "Palavras que viram magia"
    desc: |
      Chegou a hora, Herói! Eu estou tremendo de emoção (dá pra ver as páginas balançando?).

      §e1.§r Escreva na Mesa de Inscrição um feitiço simples: §eProjétil + Dano Físico§r, ou
      §eToque + Cavar§r, ou §eSi Mesmo + Regeneração§r.
      §e2.§r Coloque o livro no Atril do altar e jogue uma §eRuna em Branco§r no centro.
      §e3.§r Jogue no altar, um a um, os itens que o livro pedir. Se aparecer §bEtherium§r,
      ligue a alavanca (a partir de agora você vai precisar de um Obelisco por perto).
      §e4.§r Pegue o feitiço, clique direito para dar nome e ícone — e lance!

      Feitiço feito, nível de mago subindo. A partir daqui, a magia é sua.
    tasks:
      - get: arsmagica2:spellBase
    rewards:
      - xp: 8
      - kit: {name: "Kit do Aprendiz Arcano", items: [arsmagica2:rune:1 x8, arsmagica2:itemOre x16, arsmagica2:lesserManaPotion x4, arsmagica2:spellParchment x4, minecraft:writable_book x2]}
      - loot: raro

  - id: livro_feiticos
    title: "Livro de Feitiços"
    type: normal
    deps: [primeiro_feitico]
    icon: arsmagica2:spellBook
    desc: |
      Bolsos cheios de pergaminhos? O §eLivro de Feitiços§r (couro, papel e linha) guarda
      vários feitiços: troque entre eles com §eZ/X§r ou agachado + roda do mouse. Pode ser
      tingido e até encantado.
    tasks:
      - get: arsmagica2:spellBook:*
    rewards:
      - xp: 3
      - item: minecraft:leather x8

  - id: bancada_mago
    title: "Bancada do Mágico"
    type: optional
    deps: [mesa_inscricao]
    icon: arsmagica2:magiciansWorkbench
    desc: |
      Uma bancada com §evárias grades§r, armazenamento interno e memória das 8 últimas
      receitas. Para quem fabrica muito subcomponente, é um alívio.
      §aExtra:§r o §eUpgrade da Bancada§r transforma a segunda grade 2×2 em 3×3 (mas se quebra
      se a bancada for destruída).
    tasks:
      - get: arsmagica2:magiciansWorkbench
    rewards:
      - loot: comum

  - id: upgrade_inscricao_1
    title: "Mesa de Inscrição: Nível 1"
    type: optional
    deps: [primeiro_feitico]
    icon: arsmagica2:inscriptionUpgrade
    desc: |
      Mais grupos de forma = feitiços mais versáteis. O §eUpgrade de Nível 1§r (livro, linha,
      pena e corante preto) é aplicado na Mesa de Inscrição.
    tasks:
      - get: arsmagica2:inscriptionUpgrade
    rewards:
      - loot: comum

  - id: upgrade_inscricao_2
    title: "Mesa de Inscrição: Nível 2"
    type: optional
    deps: [upgrade_inscricao_1, giz_mago]
    icon: arsmagica2:inscriptionUpgrade:1
    desc: |
      O §eUpgrade de Nível 2§r leva tapete, livro e §eGiz de Mago§r. Mais um grupo de forma
      para as suas criações.
    tasks:
      - get: arsmagica2:inscriptionUpgrade:1
    rewards:
      - loot: comum

  - id: upgrade_inscricao_3
    title: "Mesa de Inscrição: Nível 3"
    type: optional
    deps: [upgrade_inscricao_2, vela_protecao]
    icon: arsmagica2:inscriptionUpgrade:2
    desc: |
      O último: §eVela de Proteção§r, isqueiro, Gordura Animal, frasco e livro. Com os três
      upgrades, a sua mesa está no máximo.
    tasks:
      - get: arsmagica2:inscriptionUpgrade:2
    rewards:
      - loot: incomum

  - id: feitico_mineracao
    title: "Magia de Mineração"
    type: optional
    deps: [primeiro_feitico]
    icon: minecraft:iron_pickaxe
    desc: |
      Um dos feitiços mais úteis do jogo inteiro: §eToque (ou Projétil) + Cavar§r. Com
      §eRaio§r ou §ePoder de Mineração§r, vira uma escavadeira de bolso.

      Não há como eu conferir o feitiço que você criou, então marque quando tiver o seu.
      §aSugestões do Compêndio:§r Projétil + Outono do Mago (limpa folhas); Si Mesmo + Salto
      + Queda Lenta + Pressa + Poço Gravitacional (viagem rápida).
    tasks:
      - check
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 3 — A REDE DE ETHERIUM
  # ======================================================================
  - id: obelisco
    title: "O Obelisco"
    type: main
    deps: [primeiro_feitico]
    icon: arsmagica2:obelisk
    desc: |
      Uma fornalha mágica! O §eObelisco§r (Pó de Vinteum, pedra e tijolo de pedra cinzelado)
      queima §ePó de Vinteum§r ou §eEtherium Líquido§r (balde) e gera §bEtherium Neutro§r, que
      alcança aparelhos num raio de §e10 blocos§r.

      §aUpgrades opcionais:§r um círculo de Giz de Mago em volta e depois os pilares (veja a
      estrutura no Compêndio) aumentam a geração. Tijolo cinzelado: 4 tijolos de pedra em 2×2.
    tasks:
      - get: arsmagica2:obelisk
    rewards:
      - xp: 4
      - choice: [arsmagica2:itemOre x16, minecraft:stonebrick x32, minecraft:coal_block x4]

  - id: chave_cristal
    title: "Chave de Cristal"
    type: main
    deps: [obelisco, cerublossom, desert_nova]
    icon: arsmagica2:crystal_wrench
    desc: |
      Etherium não anda sozinho: você precisa "ligar" fonte e destino. A §eChave de Cristal§r
      (ferro, Cerublossom, Desert Nova e Pó de Vinteum) faz isso:

      §e1.§r Clique direito na §efonte§r (Obelisco, Prisma, Aurem...).
      §e2.§r Clique direito no §edestino§r. Não precisa clicar nos conduítes do caminho: a rede
      acha o trajeto sozinha.
      §aAtalho:§r agachado na fonte, o cristal fica verde e você liga vários destinos seguidos.
    tasks:
      - get: arsmagica2:crystal_wrench
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, arsmagica2:itemOre x8, minecraft:gold_nugget x16]

  - id: conduite_etherium
    title: "Conduíte de Etherium"
    type: normal
    deps: [chave_cristal, quimerita]
    icon: arsmagica2:essenceConduit
    desc: |
      Cada §eConduíte de Etherium§r (Quimerita sobre pedras) retransmite energia num raio de
      §e10 blocos§r, formando correntes de até §e100 blocos§r a partir da fonte. Coloque-os a
      até 10 blocos uns dos outros.
    tasks:
      - get: arsmagica2:essenceConduit x2
    rewards:
      - xp: 3
      - item: ore:gemChimerite x2

  - id: tipos_etherium
    title: "Os Três Etherium"
    type: info
    deps: [obelisco]
    icon: arsmagica2:essenceConduit
    desc: |
      Existem três tipos de Etherium:

      §b• Neutro§r — do Obelisco (queima Vinteum/Etherium Líquido).
      §e• Luminoso§r — do §ePrisma Celestial§r (luz do sol, passivo e lento).
      §5• Sombrio§r — da §5Aurem Negra§r (consome a vida de criaturas).

      Certas partes de feitiço exigem um tipo específico no altar (o livro mostra pela cor;
      troque o tipo com a Chave de Cristal). Algumas máquinas só funcionam com um tipo, e o
      Calefator faz maravilhas com os três juntos.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: oculos_magitech
    title: "Óculos Magitech"
    type: normal
    deps: [chave_cristal, topazio_azul]
    icon: arsmagica2:magitechGoggles
    desc: |
      Quando a rede fica complicada, você precisa ver o invisível. Os §eÓculos Magitech§r
      (couro, Quimerita, Topázio Azul e pepita de ouro) mostram de onde vem a energia de cada
      máquina e revelam os §eElos de Energia Quebrados§r (quando um conduíte some do caminho).
    tasks:
      - get: arsmagica2:magitechGoggles
    rewards:
      - xp: 2
      - item: minecraft:leather x6

  - id: cajado_magitech
    title: "Cajado Magitech"
    type: normal
    deps: [oculos_magitech]
    icon: arsmagica2:magitechStaff
    desc: |
      O parceiro dos Óculos. Clique direito num bloco com o §eCajado Magitech§r (pepitas de
      ouro e um Topázio Azul) para ler o nível de Etherium; de óculos, agachado, você vê
      todas as entradas da máquina. Ele também recolhe a Vassoura Mágica e muda a prioridade
      dos Cristais Marcadores.
    tasks:
      - get: arsmagica2:magitechStaff
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x16

  - id: giz_mago
    title: "Giz de Mago"
    type: normal
    deps: [obelisco]
    icon: arsmagica2:blueChalk
    desc: |
      Rituais começam no chão. O §eGiz de Mago§r (corante branco, argila, Pó de Vinteum, sílex
      e papel) desenha runas no piso — dura 50 usos.

      É ele que forma os círculos dos rituais, as melhorias do Obelisco e o anel que estabiliza
      o Altar de Criação.
    tasks:
      - get: arsmagica2:blueChalk
    rewards:
      - xp: 2
      - item: minecraft:clay_ball x8

  - id: gordura_animal
    title: "Gordura Animal"
    type: normal
    deps: [compendio_arcano]
    icon: arsmagica2:itemOre:8
    desc: |
      Nada glamouroso, eu sei. A §eGordura Animal§r cai de porcos (perto de 30% de chance) e é a
      cera das Velas de Proteção. Junte §e4§r.
    tasks:
      - get: arsmagica2:itemOre:8 x4
    rewards:
      - xp: 2
      - item: minecraft:cooked_porkchop x8

  - id: vela_protecao
    title: "Vela de Proteção"
    type: normal
    deps: [gordura_animal, floresta_witchwood, giz_mago]
    icon: arsmagica2:wardingCandle
    desc: |
      Linha, Gordura Animal e uma Laje de Witchwood. A §eVela de Proteção§r tem dois usos:

      §e• Ritual:§r colocada no chão, faz parte dos desenhos de giz.
      §e• Detector:§r agachado, clique num bloco para §esintonizá-la§r; a chama fica azul a 15
      blocos e vermelha a 5 blocos daquele bloco (ótima para achar minério!). Velas sintonizadas
      não servem para rituais.
    tasks:
      - get: arsmagica2:wardingCandle x4
    rewards:
      - xp: 3
      - item: minecraft:string x8

  - id: composto_arcano
    title: "Composto Arcano"
    type: main
    deps: [obelisco]
    icon: arsmagica2:itemOre:1
    desc: |
      Uma mistura de materiais de vários mundos: pedra, redstone, Netherrack e pó de
      glowstone formam o §eComposto Arcano§r.

      Ele não é útil sozinho — mas na fornalha vira a famosa Cinza Arcana. Faça §e4§r.
    tasks:
      - get: arsmagica2:itemOre:1 x4
    rewards:
      - xp: 4
      - choice: [minecraft:netherrack x32, minecraft:glowstone_dust x8, minecraft:redstone x16]

  - id: cinza_arcana
    title: "Cinza Arcana"
    type: main
    deps: [composto_arcano]
    icon: arsmagica2:itemOre:2
    desc: |
      Queime o Composto Arcano na fornalha: §eCinza Arcana§r! Ela armazena Etherium como
      ninguém e é a pedra fundamental das máquinas avançadas — e o centro de §etoda§r receita
      do Refinador de Essências. Junte §e8§r.
    tasks:
      - get: ore:arcaneAsh x8
    rewards:
      - xp: 4
      - choice: [arsmagica2:itemOre:1 x4, minecraft:obsidian x4, minecraft:coal x16]

  - id: vinteum_purificado
    title: "Vinteum Purificado"
    type: normal
    deps: [cinza_arcana, cerublossom, desert_nova]
    icon: arsmagica2:itemOre:3
    desc: |
      Cinza Arcana fortalece, a Cerublossom catalisa e a Desert Nova libera a instabilidade:
      os três + Pó de Vinteum = §eVinteum Purificado§r, com capacidade de Etherium muito maior.

      Ele aparece no Foco Maior, no Inlay de Ouro, na Poção Lendária e no Filactério. Faça
      §e4§r.
    tasks:
      - get: arsmagica2:itemOre:3 x4
    rewards:
      - xp: 3
      - item: ore:dustVinteum x8

  - id: refinador_essencias
    title: "Refinador de Essências"
    type: main
    deps: [cinza_arcana, chave_cristal]
    icon: arsmagica2:essenceRefiner
    desc: |
      O §eRefinador de Essências§r (tábuas, diamante, obsidiana e Cinza Arcana) reduz itens
      comuns à sua §eessência§r pura. Ele recebe §e5 itens§r (a Cinza Arcana sempre no centro)
      e consome §bEtherium§r: ligue-o ao Obelisco com a Chave de Cristal.

      §aDica:§r Etherium §5Sombrio§r (Aurem Negra) acelera muito o processo. Anel vermelho
      piscando na interface = falta energia.
    tasks:
      - get: arsmagica2:essenceRefiner
    rewards:
      - xp: 4
      - choice: [ore:arcaneAsh x6, minecraft:diamond x1, minecraft:obsidian x8]

  - id: essencia_arcana
    title: "Essência Arcana"
    type: main
    deps: [refinador_essencias]
    icon: arsmagica2:essence
    desc: |
      A mais simples de todas: §e5 Cinzas Arcanas§r no Refinador = §eEssência Arcana§r.

      Ela invoca o Guardião Arcano, entra no Diário e no Núcleo Superior. Abra o Refinador no
      NEI para ver as receitas de todas as essências.
    tasks:
      - get: arsmagica2:essence x2
    rewards:
      - xp: 4
      - choice: [ore:arcaneAsh x6, arsmagica2:itemOre x16, minecraft:book x4]

  - id: essencia_terra
    title: "Essência da Terra"
    type: normal
    deps: [essencia_arcana]
    icon: arsmagica2:essence:1
    desc: |
      Terra, pedra, Cinza Arcana, pedra e obsidiana no Refinador = §eEssência da Terra§r.
      Peitoral de Mago de Batalha, invocação... e o Guardião da Terra também a solta.
    tasks:
      - get: arsmagica2:essence:1
    rewards:
      - xp: 2
      - item: minecraft:obsidian x4

  - id: essencia_ar
    title: "Essência do Ar"
    type: normal
    deps: [essencia_arcana, raiz_tarma]
    icon: arsmagica2:essence:2
    desc: |
      Penas e Raízes de Tarma em volta da Cinza Arcana = §eEssência do Ar§r. Ela é o
      catalisador da invocação do §eGuardião do Ar§r e vai nas Botas de Mago de Batalha.
    tasks:
      - get: arsmagica2:essence:2
    rewards:
      - xp: 2
      - item: minecraft:feather x8

  - id: essencia_fogo
    title: "Essência do Fogo"
    type: normal
    deps: [essencia_arcana]
    icon: arsmagica2:essence:3
    desc: |
      Carvão e pó de blaze em volta da Cinza Arcana = §eEssência do Fogo§r. Vai nas Calças de
      Mago de Batalha e na Vara de Pesca Infernal.
    tasks:
      - get: arsmagica2:essence:3
    rewards:
      - xp: 2
      - item: minecraft:blaze_powder x4

  - id: essencia_agua
    title: "Essência da Água"
    type: normal
    deps: [essencia_arcana, wakebloom]
    icon: arsmagica2:essence:4
    desc: |
      Wakebloom e baldes de água (ou frascos de água) em volta da Cinza Arcana = §eEssência da
      Água§r. Capacete de Mago de Batalha... e a chave para irritar o §cGuardião do Fogo§r.
    tasks:
      - get: arsmagica2:essence:4
    rewards:
      - xp: 2
      - item: minecraft:water_bucket

  - id: essencia_gelo
    title: "Essência do Gelo"
    type: normal
    deps: [essencia_arcana]
    icon: arsmagica2:essence:6
    desc: |
      Neve e gelo em volta da Cinza Arcana = §eEssência do Gelo§r. Ingrediente do Núcleo
      Superior. (Toque de Seda ajuda a pegar o gelo!)
    tasks:
      - get: arsmagica2:essence:6
    rewards:
      - xp: 2
      - item: minecraft:snowball x16

  - id: essencia_raio
    title: "Essência do Raio"
    type: normal
    deps: [essencia_arcana]
    icon: arsmagica2:essence:7
    desc: |
      Redstone e pó de glowstone em volta da Cinza Arcana = §eEssência do Raio§r. Também vai
      no Núcleo Superior.
    tasks:
      - get: arsmagica2:essence:7
    rewards:
      - xp: 2
      - item: minecraft:redstone x16

  - id: essencia_natureza
    title: "Essência da Natureza"
    type: normal
    deps: [essencia_arcana]
    icon: arsmagica2:essence:5
    desc: |
      Folhas, vitória-régia, Cinza Arcana, cacto e cipó = §eEssência da Natureza§r. Ingrediente
      do Núcleo Superior e das Sementes de Flor-da-Lua.
    tasks:
      - get: arsmagica2:essence:5
    rewards:
      - xp: 2
      - item: minecraft:sapling x8

  - id: essencia_vida
    title: "Essência da Vida"
    type: normal
    deps: [essencia_arcana]
    icon: arsmagica2:essence:8
    desc: |
      Ovos e §emaçãs douradas§r em volta da Cinza Arcana = §eEssência da Vida§r. Cara, mas
      essencial: Essência Pura, Foco de Jogador, Caule Infundido e o Capacete Vinculado.
    tasks:
      - get: arsmagica2:essence:8
    rewards:
      - xp: 3
      - item: minecraft:egg x8

  - id: essencia_ender
    title: "Essência do Ender"
    type: normal
    deps: [essencia_arcana]
    icon: arsmagica2:essence:9
    desc: |
      Pérolas e Olhos do Fim em volta da Cinza Arcana = §eEssência do Ender§r. Receptáculo de
      Pedra-Chave, Vara de Pesca Arcana, Cristal de Déficit, ritual de Corrupção... e a
      invocação do temível §5Guardião do Ender§r.
    tasks:
      - get: arsmagica2:essence:9
    rewards:
      - xp: 3
      - item: minecraft:ender_pearl x4

  - id: nucleo_base
    title: "Núcleo de Essência Básico"
    type: normal
    deps: [essencia_terra, essencia_ar, essencia_fogo, essencia_agua]
    icon: arsmagica2:essence:12
    desc: |
      As quatro essências clássicas — Ar, Água, Fogo e Terra — em volta da Cinza Arcana formam
      o §eNúcleo de Essência Básico§r. Meio caminho para a Essência Pura!
    tasks:
      - get: arsmagica2:essence:12
    rewards:
      - xp: 3
      - item: ore:arcaneAsh x4

  - id: nucleo_superior
    title: "Núcleo de Essência Superior"
    type: normal
    deps: [essencia_raio, essencia_gelo, essencia_natureza]
    icon: arsmagica2:essence:11
    desc: |
      Raio, Gelo, Natureza e Arcano em volta da Cinza Arcana = §eNúcleo de Essência
      Superior§r. A outra metade da Essência Pura.
    tasks:
      - get: arsmagica2:essence:11
    rewards:
      - xp: 3
      - item: ore:arcaneAsh x4

  - id: essencia_pura
    title: "Essência Pura"
    type: normal
    deps: [nucleo_base, nucleo_superior, essencia_vida, essencia_ender]
    icon: arsmagica2:essence:10
    desc: |
      Núcleo Superior, Vida, um §ediamante§r no centro, Ender e Núcleo Básico: a §eEssência
      Pura§r, a soma de todos os elementos. Desconstrutor Arcano, Capuz e Calças do Arquimago
      pedem esta joia. Respire fundo — você merece.
    tasks:
      - get: arsmagica2:essence:10
    rewards:
      - xp: 4
      - item: minecraft:diamond x2

  - id: bolsa_essencias
    title: "Bolsa de Essências"
    type: optional
    deps: [essencia_arcana]
    icon: arsmagica2:essenceBag
    desc: |
      Essência pra todo lado no inventário? A §eBolsa de Essências§r (couro, lã e pepita de
      ouro) guarda tudo num cantinho só.
    tasks:
      - get: arsmagica2:essenceBag
    rewards:
      - loot: comum

  - id: bolsa_runas
    title: "Bolsa de Runas"
    type: optional
    deps: [runas_coloridas]
    icon: arsmagica2:runeBag
    desc: |
      Couro e lã. A §eBolsa de Runas§r guarda runas — e as Pedras-Chave conseguem ler as runas
      dentro dela para trocar de combinação rapidinho.
    tasks:
      - get: arsmagica2:runeBag
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 4 — FOCOS E RITUAIS DE TRANSMUTAÇÃO
  # ======================================================================
  - id: foco_menor
    title: "Foco Menor"
    type: normal
    deps: [obelisco]
    icon: arsmagica2:lesserFocus
    desc: |
      Vidro rodeado de pepitas de ouro: o §eFoco Menor§r. Focos dizem às máquinas do AM2 como
      trabalhar (alcance da Pedra Vidente e da Barreira Astral, por exemplo) e são a ponta dos
      Cajados de Feitiço.
    tasks:
      - get: arsmagica2:lesserFocus
    rewards:
      - xp: 2
      - item: minecraft:gold_nugget x8

  - id: foco_padrao
    title: "Foco Padrão"
    type: normal
    deps: [foco_menor]
    icon: arsmagica2:standardFocus
    desc: |
      Foco Menor + 4 redstone = §eFoco Padrão§r. Ele é a base dos focos especializados: de
      Mana, de Carga, de Monstro, de Criatura, de Item e de Jogador.
    tasks:
      - get: arsmagica2:standardFocus
    rewards:
      - xp: 2
      - item: minecraft:redstone x8

  - id: foco_maior
    title: "Foco Maior"
    type: normal
    deps: [foco_padrao, vinteum_purificado]
    icon: arsmagica2:greaterFocus
    desc: |
      Foco Padrão com Cinza Arcana e Vinteum Purificado = §eFoco Maior§r: alcance de 15 blocos
      nas máquinas e a ponta do Cajado de Mestre.
    tasks:
      - get: arsmagica2:greaterFocus
    rewards:
      - xp: 3
      - item: ore:arcaneAsh x4

  - id: foco_mana
    title: "Foco de Mana"
    type: normal
    deps: [foco_padrao]
    icon: arsmagica2:manaFocus
    desc: |
      Foco Padrão entre dois Pós de Vinteum. O §eFoco de Mana§r reduz o custo de operação das
      máquinas — e é reagente do §eRitual da Purificação§r!
    tasks:
      - get: arsmagica2:manaFocus
    rewards:
      - xp: 2
      - item: ore:dustVinteum x8

  - id: foco_carga
    title: "Foco de Carga"
    type: optional
    deps: [foco_padrao]
    icon: arsmagica2:chargeFocus
    desc: |
      Foco Padrão entre dois vidros. O §eFoco de Carga§r acelera a recarga das máquinas e, no
      Calefator e no Reconstrutor Arcano, também a velocidade do trabalho.
    tasks:
      - get: arsmagica2:chargeFocus
    rewards:
      - loot: comum

  - id: foco_monstro
    title: "Foco de Monstro"
    type: normal
    deps: [foco_padrao]
    icon: arsmagica2:mobFocus
    desc: |
      Foco Padrão entre duas espadas de ferro. O §eFoco de Monstro§r faz a Pedra Vidente
      procurar monstros — e é reagente do §eRitual da Corrupção§r.
    tasks:
      - get: arsmagica2:mobFocus
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x4

  - id: prisma_celestial
    title: "Prisma Celestial"
    type: milestone
    deps: [foco_mana, pedra_da_lua, vela_protecao, primeiro_feitico]
    icon: arsmagica2:celestialPrism
    banner: "Etherium Luminoso"
    subtitle: "O Obelisco purificado"
    desc: |
      Um Obelisco que bebe a luz do sol! O §eRitual da Purificação§r transforma um Obelisco
      em §ePrisma Celestial§r, que gera §eEtherium Luminoso§r de graça durante o dia.

      §e1.§r Desenhe em volta do Obelisco o padrão de §eGiz de Mago§r e §eVelas§r do ritual
      (Compêndio → Estruturas → Rituais → Purificação).
      §e2.§r Jogue dentro do círculo §euma Pedra da Lua§r e §eum Foco de Mana§r.
      §e3.§r Lance no Obelisco um feitiço com o componente §eLuz§r (Toque + Luz, por exemplo),
      mirando exatamente o bloco central.

      §aBônus:§r tampas de Pedra da Lua nos pilares aumentam muito a geração, mas fazem o
      Prisma carregar à noite.
    tasks:
      - get: arsmagica2:celestialPrism
    rewards:
      - xp: 8
      - kit: {name: "Kit do Guardião da Luz", items: [ore:gemMoonstone x1, arsmagica2:itemOre:3 x4, arsmagica2:standardManaPotion x4, minecraft:glowstone x8]}
      - loot: raro

  - id: aurem_negra
    title: "Aurem Negra"
    type: milestone
    deps: [foco_monstro, pedra_do_sol, vela_protecao, primeiro_feitico]
    icon: arsmagica2:blackAurem
    banner: "Etherium Sombrio"
    subtitle: "A fome da escuridão"
    desc: |
      Agora, o lado sombrio. §cA Aurem Negra puxa criaturas vivas para o centro e arranca a
      vida delas§r — mobs mortos por ela não deixam XP nem itens. Em troca, gera §5Etherium
      Sombrio§r.

      §e1.§r Desenhe o padrão do §eRitual da Corrupção§r em volta de um Obelisco (veja no
      Compêndio).
      §e2.§r Jogue dentro §eum Foco de Monstro§r e §euma Pedra do Sol§r.
      §e3.§r Acerte o Obelisco com um feitiço de §eDano de Fogo§r.

      §aDica:§r a Aurem fica ótima numa farm de mobs. Mantenha-a longe dos seus animais (e de
      você!).
    tasks:
      - get: arsmagica2:blackAurem
    rewards:
      - xp: 8
      - kit: {name: "Kit do Pacto Sombrio", items: [ore:gemSunstone x1, arsmagica2:essence:9 x2, minecraft:obsidian x16, minecraft:rotten_flesh x16]}
      - loot: raro

  - id: tres_luzes
    title: "As Três Luzes do Etherium"
    type: milestone
    deps: [prisma_celestial, aurem_negra, conduite_etherium]
    icon: arsmagica2:essenceConduit
    banner: "As Três Luzes"
    subtitle: "Neutro, Luminoso e Sombrio"
    desc: |
      Obelisco, Prisma Celestial e Aurem Negra — a sua rede agora tem os três tipos de
      Etherium. Isso abre os feitiços mais complexos do altar (que pedem tipos específicos) e
      as máquinas que exigem dois ou três tipos de uma vez.

      §aOrganização que eu recomendo:§r os três geradores perto do Altar de Criação, ligados
      por Conduítes, e uma Bateria de Mana como reserva. O Prisma perto do altar ainda ajuda a
      combater a instabilidade na criação; a Aurem, ao contrário, atrapalha — deixe-a mais
      afastada.

      Eu estou orgulhosíssima. Você domina a energia do Volume Arcano!
    tasks:
      - get: [arsmagica2:obelisk, arsmagica2:celestialPrism, arsmagica2:blackAurem]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Engenheiro de Etherium", items: [arsmagica2:essenceConduit x4, arsmagica2:manaBattery, ore:arcaneAsh x8, arsmagica2:itemOre:3 x4]}
      - loot: raro

  - id: bateria_mana
    title: "Bateria de Mana"
    type: normal
    deps: [cinza_arcana, quimerita, chave_cristal]
    icon: arsmagica2:manaBattery
    desc: |
      Uma moldura de Quimerita e Vinteum com Cinza Arcana no centro: a §eBateria de Mana§r
      armazena muito Etherium. Ela sempre fornece energia aos aparelhos ligados e, com sinal
      de redstone, puxa energia da rede.

      §aGuarde uma:§r ela também é o pára-raios do ritual do Guardião do Raio.
    tasks:
      - get: arsmagica2:manaBattery
    rewards:
      - xp: 3
      - item: ore:gemChimerite x2

  - id: calefator
    title: "Calefator"
    type: normal
    deps: [chave_cristal]
    icon: arsmagica2:calefactor
    desc: |
      Uma fornalha mágica movida a Etherium (lápis, pedra, redstone e Pó de Vinteum). O
      §eCalefator§r às vezes gera §ePó de Vinteum§r de brinde ao fundir e sempre tem uma
      pequena chance de dobrar comida.

      §eCom Etherium Luminoso, Neutro e Sombrio ao mesmo tempo, ele dobra minérios!§r
    tasks:
      - get: arsmagica2:calefactor
    rewards:
      - xp: 3
      - item: minecraft:iron_ore x8

  - id: reconstrutor_arcano
    title: "Reconstrutor Arcano"
    type: normal
    deps: [chave_cristal, parede_magica]
    icon: arsmagica2:blockArcaneReconstructor
    desc: |
      Direcionando Etherium para os pontos fracos de um item, a energia solidifica e conserta
      o estrago. O §eReconstrutor Arcano§r (pedra, Parede Mágica, Pó de Vinteum, diamante e
      obsidiana) repara ferramentas e armaduras.
    tasks:
      - get: arsmagica2:blockArcaneReconstructor
    rewards:
      - xp: 3
      - item: minecraft:diamond

  - id: parede_magica
    title: "Parede Mágica"
    type: normal
    deps: [po_vinteum]
    icon: arsmagica2:magicWall
    desc: |
      Uma tentativa antiga de bloco de ilusão que... não ficou ilusória, mas segura até bola de
      fogo! Pó de Vinteum, pedra e Pó de Vinteum em linha = §e16 Paredes Mágicas§r. Elas vão no
      Reconstrutor, no Pote de Flicker e no Filactério.
    tasks:
      - get: arsmagica2:magicWall x4
    rewards:
      - xp: 2
      - item: minecraft:stone x16

  - id: extrator_etherium
    title: "Extrator de Etherium"
    type: normal
    deps: [floresta_witchwood, topazio_azul]
    icon: arsmagica2:etheriumExtractor
    desc: |
      O jeito preferido dos magos de colher Etherium Líquido. Use o §eExtrator de Etherium§r
      (vidro, ferro e Topázio Azul) num §etronco de Witchwood§r com um balde vazio no
      inventário: a seiva vira §eBalde de Etherium Líquido§r e o tronco fica §7Drenado§r.

      O balde alimenta o Obelisco e é usado na Poção de Etherium Infundido.
    tasks:
      - get: arsmagica2:etheriumExtractor
    rewards:
      - xp: 3
      - item: minecraft:bucket x2

  - id: balde_etherium
    title: "Etherium Engarrafado"
    type: normal
    deps: [extrator_etherium]
    icon: arsmagica2:liquidEssenceBucket
    desc: |
      Um balde inteirinho de magia! Pegue um §eBalde de Etherium Líquido§r.

      §aIdeia:§r espalhe fontes de Etherium em volta de uma muda de Witchwood, ou cerque o
      Altar de Criação com giz e Etherium para estabilizar as criações.
    tasks:
      - get: arsmagica2:liquidEssenceBucket
    rewards:
      - xp: 2
      - item: minecraft:bucket

  - id: pocao_etherium
    title: "Poção de Etherium Infundido"
    type: optional
    deps: [balde_etherium, raiz_tarma]
    icon: arsmagica2:liquidEssenceBottle
    desc: |
      Balde de Etherium Líquido + Quimerita + Raiz de Tarma = §ePoção de Etherium Infundido§r,
      que aumenta temporariamente a mana máxima. O processo desperdiça muito Etherium, mas é
      reagente da Soulspike.
    tasks:
      - get: arsmagica2:liquidEssenceBottle
    rewards:
      - loot: comum

  - id: pedra_eterna
    title: "Pedra Eterna"
    type: optional
    deps: [topazio_azul, quimerita]
    icon: arsmagica2:everstone
    desc: |
      Um bloco que imita outros (clique nele com o bloco desejado). Quebrado, ele não cai: fica
      incorpóreo por um tempo e depois volta. Perfeito para portas secretas! A Chave de Cristal
      remove o disfarce.
    tasks:
      - get: arsmagica2:everstone
    rewards:
      - loot: comum

  - id: bloco_ilusao
    title: "Blocos de Ilusão"
    type: optional
    deps: [quimerita, runas_coloridas]
    icon: arsmagica2:illusionBlock
    desc: |
      Quimerita e runas pretas formam §eBlocos de Ilusão§r: parecem sólidos e são sólidos — a
      menos que você esteja com §eVisão Verdadeira§r. A versão §eEtérea§r (com vidro) é
      atravessável por qualquer um.
    tasks:
      - one_of: [arsmagica2:illusionBlock, arsmagica2:illusionBlock:1]
    rewards:
      - loot: comum

  - id: tocha_vinteum
    title: "Tocha de Vinteum"
    type: normal
    deps: [po_vinteum]
    icon: arsmagica2:VinteumTorch
    desc: |
      Pó de Vinteum sobre um graveto = §e4 Tochas de Vinteum§r. Puramente decorativas... exceto
      por um detalhe: o ritual do §eGuardião da Terra§r exige quatro delas!
    tasks:
      - get: arsmagica2:VinteumTorch x4
    rewards:
      - xp: 2
      - item: minecraft:stick x16

  - id: bolo_mana
    title: "Bolo de Mana"
    type: optional
    deps: [cerublossom, desert_nova]
    icon: arsmagica2:manaCake
    desc: |
      É bolo! Cerublossom, Desert Nova, açúcar e trigo rendem §e3 Bolos de Mana§r: matam a fome
      e aceleram a regeneração de mana. O lanche oficial do mago.
    tasks:
      - get: arsmagica2:manaCake x3
    rewards:
      - loot: comum

  - id: pocao_mana_menor
    title: "Poções de Mana"
    type: normal
    deps: [mana_e_nivel]
    icon: arsmagica2:lesserManaPotion
    desc: |
      O cafezinho do mago. Semente de trigo, açúcar e um frasco de poção = §ePoção de Mana
      Menor§r (100 de mana). Com pólvora vira a §ePadrão§r (250).

      Três poções iguais + linha = um §eFeixe§r de três usos (devolve os frascos).
    tasks:
      - get: [arsmagica2:lesserManaPotion, arsmagica2:standardManaPotion]
    rewards:
      - xp: 2
      - item: minecraft:glass_bottle x8

  - id: pocao_mana_maior
    title: "Poções Maior e Épica"
    type: optional
    deps: [pocao_mana_menor, cinza_arcana]
    icon: arsmagica2:epicManaPotion
    desc: |
      Padrão + Pó de Vinteum = §eMaior§r (2000 de mana). Maior + Cinza Arcana = §eÉpica§r
      (5000). Para as lutas contra os Guardiões, leve várias.
    tasks:
      - get: arsmagica2:epicManaPotion
    rewards:
      - loot: comum

  - id: pocao_mana_lendaria
    title: "Poção de Mana Lendária"
    type: optional
    deps: [pocao_mana_maior, vinteum_purificado]
    icon: arsmagica2:legendaryManaPotion
    desc: |
      Épica + Vinteum Purificado = §eLendária§r: §e10 000§r de mana de uma vez! Também é
      reagente do Ritual da Fusão com o Mundo.
    tasks:
      - get: arsmagica2:legendaryManaPotion
    rewards:
      - loot: incomum

  - id: martini_mana
    title: "Martíni de Mana"
    type: optional
    deps: [pocao_mana_menor]
    icon: arsmagica2:manaMartini
    desc: |
      Uma homenagem à versão "007" do AM2. Gelo, batata, açúcar, graveto e uma Poção de Mana
      Padrão = §eMartíni de Mana§r: §e25% menos esgotamento§r por um tempo. Batido, não mexido.
    tasks:
      - get: arsmagica2:manaMartini
    rewards:
      - loot: comum

  - id: pedra_mana
    title: "Pedra de Mana"
    type: optional
    deps: [po_vinteum]
    icon: arsmagica2:manaStone
    desc: |
      Diamante, ouro e Pó de Vinteum. A §ePedra de Mana§r guarda até §e1000§r da sua mana para
      depois; feitiços que não cabem na sua reserva puxam dela.
    tasks:
      - get: arsmagica2:manaStone
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 5 — VESTES DE MAGO E MAGO DE BATALHA
  # ======================================================================
  - id: capuz_mago
    title: "Capuz de Mago"
    type: normal
    deps: [runas_coloridas]
    icon: arsmagica2:mageHood
    desc: |
      A armadura do AM2 é feita para magos: pouca durabilidade, mas ela §einfunde-se§r —
      puxa mana de você para se consertar enquanto está vestida.

      O §eCapuz de Mago§r leva lã roxa, couro, uma §eRuna Roxa§r e um frasco de água. Peças de
      mago aceitam muito bem encantamentos.
    tasks:
      - get: arsmagica2:mageHood
    rewards:
      - xp: 2
      - item: minecraft:wool:10 x8

  - id: vestes_mago
    title: "Vestes de Mago"
    type: normal
    deps: [runas_coloridas]
    icon: arsmagica2:mageArmor
    desc: |
      Lã roxa, couro, carvão e duas §eRunas Brancas§r = §eVestes de Mago§r.
    tasks:
      - get: arsmagica2:mageArmor
    rewards:
      - xp: 2
      - item: minecraft:wool:10 x8

  - id: calcas_mago
    title: "Calças de Mago"
    type: normal
    deps: [runas_coloridas]
    icon: arsmagica2:mageLeggings
    desc: |
      Lã roxa, couro, pólvora e uma §eRuna Amarela§r = §eCalças de Mago§r.
    tasks:
      - get: arsmagica2:mageLeggings
    rewards:
      - xp: 2
      - item: minecraft:leather x6

  - id: botas_mago
    title: "Botas de Mago"
    type: normal
    deps: [runas_coloridas]
    icon: arsmagica2:mageBoots
    desc: |
      Couro, lã roxa, pena e duas §eRunas Pretas§r = §eBotas de Mago§r.
    tasks:
      - get: arsmagica2:mageBoots
    rewards:
      - xp: 2
      - item: minecraft:feather x8

  - id: traje_mago
    title: "O Traje Completo"
    type: milestone
    deps: [capuz_mago, vestes_mago, calcas_mago, botas_mago]
    icon: arsmagica2:mageArmor
    banner: "Traje de Mago"
    subtitle: "Mana fluindo pelas costuras"
    desc: |
      Capuz, vestes, calças e botas! Com o §econjunto completo§r, a sua regeneração de mana
      aumenta e todos os feitiços ficam um pouco mais eficazes.

      §aLembre:§r a armadura se repara com a sua mana (infusão) — se ela estiver gasta, parte da
      sua mana vai para ela. E qualquer armadura vestida ganha XP quando você ganha: guarde isso
      para a Mesa de Imbuimento.

      Próximo passo: obsidiana, Inlays de Ouro e essências para a §eArmadura de Mago de
      Batalha§r.
    tasks:
      - get: [arsmagica2:mageHood, arsmagica2:mageArmor, arsmagica2:mageLeggings, arsmagica2:mageBoots]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Alfaiate Arcano", items: [arsmagica2:standardManaPotion x4, arsmagica2:manaCake x3, arsmagica2:rune:1 x8, minecraft:wool:10 x16]}
      - loot: raro

  - id: inlay_redstone
    title: "Inlay de Redstone"
    type: normal
    deps: [po_vinteum]
    icon: arsmagica2:redstoneInlay
    desc: |
      Oito redstone em volta de um Pó de Vinteum = §e4 Inlays de Redstone§r. Inlays são runas
      de chão que §einvocam Guardiões§r quando dispostas num §eanel 3×3 com o centro vazio§r
      (todas no mesmo nível e do mesmo tipo — as runas acendem quando o anel está certo).

      §aCuriosidade:§r também funcionam como trilhos: o de redstone acelera carrinhos.
    tasks:
      - get: arsmagica2:redstoneInlay x8
    rewards:
      - xp: 3
      - item: minecraft:redstone x16

  - id: inlay_ferro
    title: "Inlay de Ferro"
    type: normal
    deps: [inlay_redstone, cinza_arcana]
    icon: arsmagica2:ironInlay
    desc: |
      Oito lingotes de ferro em volta de uma Cinza Arcana = §e4 Inlays de Ferro§r. Invocam os
      Guardiões da Terra e Arcano. (Como trilho, inverte o sentido do carrinho.)
    tasks:
      - get: arsmagica2:ironInlay x8
    rewards:
      - xp: 3
      - item: minecraft:iron_ingot x8

  - id: inlay_ouro
    title: "Inlay de Ouro"
    type: normal
    deps: [inlay_ferro, vinteum_purificado]
    icon: arsmagica2:goldInlay
    desc: |
      Oito lingotes de ouro em volta de um Vinteum Purificado = §e4 Inlays de Ouro§r: o inlay
      dos Guardiões mais poderosos e da Armadura de Mago de Batalha. (Como trilho, teleporta o
      carrinho até o próximo inlay de ouro a até 8 blocos!)
    tasks:
      - get: arsmagica2:goldInlay x8
    rewards:
      - xp: 3
      - item: minecraft:gold_ingot x8

  - id: capacete_batalha
    title: "Diadema de Mago de Batalha"
    type: normal
    deps: [traje_mago, inlay_ouro, essencia_agua]
    icon: arsmagica2:battlemageHood
    desc: |
      A Armadura de Mago de Batalha é dada só a quem provou seu valor: mais proteção e
      durabilidade, menos encantabilidade e bônus mágicos menores que a de mago. Com XP, ela
      libera feitiços de proteção que vêm em seu socorro.

      O §eDiadema§r: obsidiana, Inlay de Ouro, Runa em Branco e §eEssência da Água§r.
    tasks:
      - get: arsmagica2:battlemageHood
    rewards:
      - xp: 3
      - item: minecraft:obsidian x8

