    rewards:
      - xp: 3
      - item: arsmagica2:flickerJar x2

  - id: isca_flicker
    title: "Isca de Flicker"
    type: optional
    deps: [pote_flicker, chave_cristal]
    icon: arsmagica2:flickerLure
    desc: |
      Cansou de correr atrás deles? A §eIsca de Flicker§r, alimentada com Etherium e acionada
      com redstone, puxa Flickers para o nosso mundo. O tipo depende do lugar onde ela está.
    tasks:
      - get: arsmagica2:flickerLure
    rewards:
      - loot: comum

  - id: habitat_flicker
    title: "Habitat de Flicker"
    type: normal
    deps: [flicker_capturado, quimerita]
    icon: arsmagica2:elementalAttuner
    desc: |
      Cristais que deixam os Flickers ficarem no nosso mundo. O §eHabitat de Flicker§r (ferro,
      Pó de Vinteum e um §eBloco de Quimerita§r) recebe um §eFoco de Flicker§r e passa a
      trabalhar sozinho: crescer plantas, derrubar árvores, pescar, organizar itens...

      Um Habitat vizinho com um Pote de Flicker modifica o trabalho do primeiro.
    tasks:
      - get: arsmagica2:elementalAttuner
    rewards:
      - xp: 3
      - item: ore:dustVinteum x8

  - id: foco_flicker
    title: "Focos de Flicker"
    type: normal
    deps: [habitat_flicker]
    icon: arsmagica2:flickerFocus:832
    desc: |
      Cada foco combina Flickers de elementos diferentes (veja no NEI). Os favoritos:

      §e• Generosidade da Natureza§r (Vida+Natureza+Água) — acelera plantas num raio de 6.
      §e• Carvalho Abatido§r (Natureza+Raio) — derruba árvores; com Natureza, replanta.
      §e• Transporte de Itens§r (Ar) — logística com Cristais Marcadores.
      §e• Pesca§r (Água+Natureza) — pesca num poço 3×3 com 2 de fundo.
      §e• Marés Lunares§r — puxa os meteoros de Pedra da Lua para perto!

      Faça qualquer um.
    tasks:
      - one_of: [arsmagica2:flickerFocus:1, arsmagica2:flickerFocus:3, arsmagica2:flickerFocus:4, arsmagica2:flickerFocus:9, arsmagica2:flickerFocus:36, arsmagica2:flickerFocus:64, arsmagica2:flickerFocus:80, arsmagica2:flickerFocus:134, arsmagica2:flickerFocus:144, arsmagica2:flickerFocus:384, arsmagica2:flickerFocus:512, arsmagica2:flickerFocus:768, arsmagica2:flickerFocus:832]
    rewards:
      - xp: 3
      - choice: [minecraft:sapling x16, minecraft:fishing_rod, minecraft:dye:15 x32]

  - id: cristais_marcadores
    title: "Cristais Marcadores"
    type: optional
    deps: [foco_flicker, cajado_magitech]
    icon: arsmagica2:crystalMarker
    desc: |
      Com o foco de §eTransporte de Itens§r, os Flickers movem itens entre baús marcados por
      §eCristais§r: de Importação, de Exportação, Imitação, Definido, Regulado, Final e até o de
      Feitiço (busca os reagentes que o Altar de Criação pedir!). O Cajado Magitech ajusta a
      prioridade; os Óculos mostram.
    tasks:
      - one_of: [arsmagica2:crystalMarker, arsmagica2:crystalMarker:1, arsmagica2:crystalMarker:2, arsmagica2:crystalMarker:3, arsmagica2:crystalMarker:4, arsmagica2:crystalMarker:5, arsmagica2:crystalMarker:6, arsmagica2:crystalMarker:7, arsmagica2:crystalMarker:8]
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 9 — PEDRAS-CHAVE, PORTAIS E A MOO MOO FARM
  # ======================================================================
  - id: pedra_chave
    title: "Pedra-Chave"
    type: normal
    deps: [runas_coloridas, po_vinteum]
    icon: arsmagica2:keystone
    desc: |
      Ouro, ferro e Pó de Vinteum. A §ePedra-Chave§r guarda uma §ecombinação de runas§r (abra
      a interface e coloque runas coloridas). Ela tranca máquinas do AM2, Baús e Portas de
      Pedra-Chave e liga Portais entre si.
    tasks:
      - get: arsmagica2:keystone
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x4

  - id: bau_porta_chave
    title: "Baú e Porta de Pedra-Chave"
    type: optional
    deps: [pedra_chave]
    icon: arsmagica2:keystoneChest
    desc: |
      Segurança mágica! O §eBaú de Pedra-Chave§r só abre para quem tem a combinação certa; a
      §ePorta de Pedra-Chave§r idem — e zumbis não conseguem arrombá-la.
    tasks:
      - one_of: [arsmagica2:keystoneChest, arsmagica2:keystoneDoorPlacer]
    rewards:
