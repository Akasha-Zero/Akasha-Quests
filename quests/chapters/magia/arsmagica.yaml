      - loot: epico

  - id: guardiao_vida
    title: "Guardião da Vida"
    type: boss
    deps: [rituais_guardioes, giz_mago, vela_protecao]
    icon: arsmagica2:essence:8
    banner: "O Guardião da Vida caiu!"
    subtitle: "Um sacrilégio respondido"
    task_logic: OR
    desc: |
      Ele só aparece diante de um sacrilégio contra a vida — e o ritual é exatamente isso.
      §c(Sim, eu também fiquei chocada.)§r

      §eRitual:§r anel 5×5 de §eGiz de Mago§r com uma §eVela de Proteção§r do lado de fora, no
      meio de cada lado (4 velas). Numa noite de §elua cheia§r, mate um §ealdeão criança§r dentro
      do círculo.

      O Guardião quase não ataca: ele §efortalece outras criaturas§r que lutam por ele. Derrube
      os protetores. Lembrança: a §6Proteção da Vida§r (escudo de até 20 pontos de vida).
    tasks:
      - kill: {entity: "arsmagica2.BossLifeGuardian", count: 1}
      - get: arsmagica2:lifeWard
    rewards:
      - xp: 10
      - loot: epico

  - id: guardiao_natureza
    title: "Guardião da Natureza"
    type: boss
    deps: [rituais_guardioes]
    icon: arsmagica2:essence:5
    banner: "O Guardião da Natureza caiu!"
    subtitle: "A foice adormece"
    task_logic: OR
    desc: |
      Uma foice mortal e a habilidade de usá-la — tão perigoso de longe quanto de perto.
      §cMuito difícil; nível recomendado 60.§r

      §eRitual:§r a natureza não tolera um massacre. Mate §e5 Dríades§r em sequência rápida
      (elas vivem em florestas e campos) e o Guardião aparece para defendê-las.

      Lembrança: a §6Foice da Natureza§r, que limpa folhas e plantas e pode ser arremessada como
      bumerangue (250 de mana).
    tasks:
      - kill: {entity: "arsmagica2.BossNatureGuardian", count: 1}
      - get: arsmagica2:natureScythe
    rewards:
      - xp: 15
      - loot: [epico x2]

  - id: guardiao_fogo
    title: "Guardião do Fogo"
    type: boss
    deps: [rituais_guardioes, inlay_ouro, essencia_agua]
    icon: arsmagica2:essence:3
    banner: "O Guardião do Fogo caiu!"
    subtitle: "O inferno se apaga"
    task_logic: OR
    desc: |
      Um inferno vivo das profundezas do Nether. §cNível recomendado 90 — o mais forte da
      lista oficial.§r

      §eRitual:§r no §eNether§r, faça um §eanel de Inlay de Ouro sobre obsidiana§r com um
      §ebloco de carvão§r no centro. Jogue uma §eEssência da Água§r sobre o carvão. Ele odeia
      quem traz água ao seu domínio...

      Leve resistência ao fogo de sobra. Lembrança: a §6Antena do Guardião do Fogo§r, imunidade
      total a fogo e lava.
    tasks:
      - kill: {entity: "arsmagica2.BossFireGuardian", count: 1}
      - get: arsmagica2:fire_ears
    rewards:
      - xp: 15
      - loot: [epico x2]

  - id: guardiao_ender
    title: "Guardião do Ender"
    type: boss
    deps: [rituais_guardioes, inlay_ouro, aurem_negra, essencia_ender]
    icon: arsmagica2:essence:9
    banner: "O Guardião do Ender caiu!"
    subtitle: "O pesadelo do Fim tem fim"
    task_logic: OR
    desc: |
      "Ninguém jamais viu o Guardião e sobreviveu." Magnus Severinus, o Arquimago da Segunda Era,
      tentou. Só voltou um papel manchado de sangue com o ritual. §cO mais temido de todos.§r

      §eRitual:§r no §eFim§r, coloque uma §eAurem Negra§r sobre uma plataforma de §eblocos de
      carvão§r, cerque com um §eanel de Inlay de Ouro§r e acenda um §efogo§r em cada lado do
      anel. Jogue uma §eEssência do Ender§r e um §eOlho do Fim§r para desestabilizar a Aurem.

      Lembrança: as §6Botas do Ender§r (agache e pule para inverter a gravidade).
    tasks:
      - kill: {entity: "arsmagica2.BossEnderGuardian", count: 1}
      - get: arsmagica2:enderBoots
    rewards:
      - xp: 15
      - loot: [epico x2]

  - id: dez_guardioes
    title: "Os Dez Guardiões"
    type: milestone
    deps: [guardiao_agua, guardiao_terra, guardiao_arcano, guardiao_ar, guardiao_inverno, guardiao_raio, guardiao_vida, guardiao_natureza, guardiao_fogo, guardiao_ender]
    icon: arsmagica2:rune:19
    banner: "Os Dez Guardiões"
    subtitle: "Todos os elementos se curvam"
    desc: |
      Água, Terra, Arcano, Ar, Inverno, Raio, Vida, Natureza, Fogo e Ender. Herói... você
      derrotou §etodos§r os Guardiões do Ars Magica. São mais 20 000 de mana máxima, uma pilha
      de Orbes do Infinito e as essências de todos os elementos.

      Nos arquivos do Registro, os Guardiões eram os vigias dos dez Elementos — e cada um
      guardava uma página arrancada pela Fratura. Agora essas páginas voltam para casa.

      Falta só uma coisa: transformar as lembranças deles nas §6Vestes do Arquimago§r.
    tasks:
      - check
    rewards:
      - xp: 12
      - kit: {name: "Kit dos Dez Elementos", items: [arsmagica2:essence:10, arsmagica2:legendaryManaPotion x2, arsmagica2:rune:19, minecraft:nether_star]}
      - loot: epico

