    desc: |
      O Diadema de Mago de Batalha no centro, a §eAntena do Guardião do Fogo§r em cima,
      Essências do Fogo, duas §ePedras do Sol§r, Runas Laranja e uma §eEssência Pura§r.

      O §eCapuz do Arquimago§r dá visão noturna, resistência ao fogo e queima quem ataca você.
    tasks:
      - get: arsmagica2:ArchmageHood
    rewards:
      - xp: 4
      - item: arsmagica2:essence:3 x2

  - id: vestes_arquimago
    title: "Vestes do Arquimago"
    type: normal
    deps: [mago_batalha, guardiao_terra, guardiao_vida]
    icon: arsmagica2:ArchmageArmor
    desc: |
      A Armadura de Mago de Batalha no centro, a §eArmadura da Terra§r em cima, a §eProteção
      da Vida§r embaixo, Essências da Terra, §eduas Estrelas do Nether§r e Runas Marrons.

      As §eVestes do Arquimago§r anulam repulsão, fortalecem seus golpes e deixam você muito mais
      difícil de matar.
    tasks:
      - get: arsmagica2:ArchmageArmor
    rewards:
      - xp: 4
      - item: arsmagica2:essence:1 x2

  - id: calcas_arquimago
    title: "Calças do Arquimago"
    type: normal
    deps: [mago_batalha, guardiao_agua, essencia_pura]
    icon: arsmagica2:ArchmageLeggings
    desc: |
      As Calças de Mago de Batalha no centro, os §eOrbes da Água§r em cima, Essências da Água,
      §edois blocos de diamante§r, Runas Ciano e uma §eEssência Pura§r.

      Debaixo d'água você respira, corre e interage sem dificuldade.
    tasks:
      - get: arsmagica2:ArchmageLeggings
    rewards:
      - xp: 4
      - item: arsmagica2:essence:4 x2

  - id: botas_arquimago
    title: "Botas do Arquimago"
    type: normal
    deps: [mago_batalha, guardiao_ender, guardiao_ar, pedra_da_lua]
    icon: arsmagica2:ArchmageBoots
    desc: |
      As Botas de Mago de Batalha no centro, as §eBotas do Ender§r em cima, o §eTrenó Aéreo§r
      embaixo, Essências do Ar, duas §ePedras da Lua§r e Runas Brancas.

      Quedas amortecidas, imunidade a lentidão... e a liberdade de §evoar§r.
    tasks:
      - get: arsmagica2:ArchmageBoots
    rewards:
      - xp: 4
      - item: arsmagica2:essence:2 x2

  - id: maestria_arcana
    title: "Maestria Arcana"
    type: milestone
    deps: [capuz_arquimago, vestes_arquimago, calcas_arquimago, botas_arquimago, tres_luzes]
    icon: arsmagica2:ArchmageArmor
    size: 48
    banner: "Maestria Arcana"
    subtitle: "O Volume das Artes Arcanas está completo"
    effect: 4
    desc: |
      Capuz, Vestes, Calças e Botas do §6Arquimago§r. Com o conjunto completo, a mana regenera
      mais rápido e, ao golpear uma criatura agachado, você a §e"chicoteia" para o céu§r,
      invertendo a gravidade dela por alguns instantes. É a armadura máxima de um mago — capaz
      de competir com as melhores da Taumaturgia e da Magia de Sangue.

      Herói, olhe para trás: um livro numa moldura ao lado de uma poça azul, o primeiro
      Projétil, Obelisco, Prisma, Aurem, dez Guardiões... O §dVolume das Artes Arcanas§r foi
      reescrito, página por página, por você.

      Esta conquista vai brilhar no §6Selo Arcano§r. Eu estou chorando um pouquinho. De
      orgulho. Só de orgulho.
    tasks:
      - get: [arsmagica2:ArchmageHood, arsmagica2:ArchmageArmor, arsmagica2:ArchmageLeggings, arsmagica2:ArchmageBoots]
    rewards:
      - xp: 15
      - kit: {name: "Kit da Maestria Arcana", items: [arsmagica2:legendaryManaPotion x4, arsmagica2:essence:10 x2, arsmagica2:manaStone, arsmagica2:rune:19 x2, minecraft:nether_star]}
      - loot: [epico x2]
      - command: "/effect @p 23 1 0"

  # ======================================================================
  # FASE 8 — FLICKERS E AUTOMAÇÃO
  # ======================================================================
  - id: flickers
    title: "Flickers"
    type: info
    deps: [primeiro_feitico]
    icon: arsmagica2:flickerJar:1
    desc: |
      Pequenos elementais que "piscam" entre o plano deles e o nosso. Os §eFlickers§r são a base
      da §eautomação do Ars Magica§r. Cada afinidade tem o seu, e eles aparecem em lugares que
      lembram o seu elemento: Água em rios e oceanos, Ar no alto (~25 blocos acima do chão),
      Terra no subsolo, Fogo no Nether, Raio sobre praias e em tempestades, Natureza em
      florestas, Gelo em biomas gelados, Arcano nas florestas de Witchwood, Ender no Fim e Vida
      em qualquer lugar (raro).

      Eles fogem se atacados ou se você chegar perto demais. Um efeito mágico duradouro (como
      Invisibilidade) ajuda a se aproximar.
    tasks:
      - check
    rewards:
      - xp: 1

