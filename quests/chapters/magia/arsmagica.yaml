    title: "Pote de Flicker"
    type: normal
    deps: [flickers, parede_magica]
    icon: arsmagica2:flickerJar
    desc: |
      Pepitas de ouro, uma Parede Mágica e painéis de vidro: o §ePote de Flicker Vazio§r.
      Clique direito num Flicker para prendê-lo. Parece simples, né? Divirta-se...
    tasks:
      - get: arsmagica2:flickerJar
    rewards:
      - xp: 2
      - item: minecraft:glass_pane x8

