chapter:
  id: bloodmagic
  title: "Blood Magic"
  prefix: ""
  order: 540
  icon: AWWayofTime:Altar
  desc: |
    §dO Volume do Sangue.§r Faca, Altar de Sangue, Orbes, Sigilos, Rituais com Pedras
    Rituais, Alquimia de reagentes, Armadura Vinculada, Elementais e o Portal Demoníaco
    até o Orbe Transcendente. (Blood Magic: Alchemical Wizardry 1.9.12)

quests:
  # ======================================================================
  # FASE 0 — O ALTAR E A PRIMEIRA GOTA
  # ======================================================================
  - id: altar_sangue
    title: "O Altar de Sangue"
    type: main
    icon: AWWayofTime:Altar
    desc: |
      Este Volume foi escrito com tinta vermelha, Herói. Literalmente. Antes de abrir, me
      promete uma coisa: comer bem e nunca usar a faca com pouca vida. Combinado?

      O §eAltar de Sangue§r é o coração de tudo aqui. A receita é simples: pedra nas laterais,
      uma §eFornalha§r no meio, §e2 lingotes de ouro§r e §e1 diamante§r embaixo (confira no
      NEI). Coloque-o no chão: ele guarda até §e10 000 LP§r de Essência Vital e transmuta itens
      colocados na bacia com clique direito.

      §aDica:§r monte o altar num lugar com espaço em volta. Ele vai crescer... muito.
    tasks:
      - get: AWWayofTime:Altar
    rewards:
      - xp: 4
      - choice: [minecraft:cooked_beef x16, minecraft:golden_carrot x8, minecraft:bread x24]

  - id: faca_sacrificio
    title: "A Faca de Sacrifício"
    type: main
    deps: [altar_sangue]
    icon: AWWayofTime:sacrificialKnife
    desc: |
      Aqui começa a parte que dói. A §eFaca de Sacrifício§r (vidro, um lingote de ouro e um
      de ferro) transforma a sua própria vida em Essência Vital.

      Fique bem pertinho do altar (cerca de um bloco) e clique com a faca: você perde
      §c1 coração§r e o altar ganha cerca de §e200 LP§r. Depois deixe a vida voltar
      (comida com boa saturação ajuda muito) e repita.

      §cAviso de Akasha:§r a faca não liga se você está com meio coração. Ela corta do mesmo
      jeito. Nunca sacrifique perto de monstros, de lava ou caindo de fome!
    tasks:
      - get: AWWayofTime:sacrificialKnife
    rewards:
      - xp: 4
      - choice: [minecraft:cooked_porkchop x16, minecraft:baked_potato x24, minecraft:golden_apple x1]

  - id: info_rede_almas
    title: "A Rede de Almas e o LP"
    type: info
    deps: [faca_sacrificio]
    icon: AWWayofTime:lifeEssence
    desc: |
      Uma aulinha antes de sangrar mais, prometo que é rápida!

      §eEssência Vital§r é o fluido vermelho do altar. Para guardar poder, você precisa de um
      §eOrbe de Sangue§r vinculado (clique direito com ele na mão). Um orbe colocado no altar
      bombeia a essência para a sua §dRede de Almas§r, medida em §eLP§r (Life Points).

      Sigilos, rituais, alquimia e armaduras puxam LP da sua Rede. §cSe a Rede secar, o item
      cobra direto da sua vida§r — e alguns causam náusea quando faltam pontos.

      Cada orbe tem um teto de LP para a Rede. Orbes melhores, teto maior. Simples assim!
    tasks:
      - check
    rewards:
      - xp: 1

  - id: orbe_fraco
    title: "Orbe de Sangue Fraco"
    type: main
    deps: [faca_sacrificio]
    icon: AWWayofTime:weakBloodOrb
    desc: |
      O primeiro orbe nasce de um §ediamante§r. Encha o altar com pelo menos §e2000 LP§r
      (uns 10 cortes da faca... respire fundo) e coloque o diamante na bacia.

      Partículas vermelhas = transmutando. Partículas cinzentas = o altar secou e o processo
      está perdendo progresso, corra para cortar mais!

      Pronto o §eOrbe de Sangue Fraco§r, clique direito para vinculá-lo a você. Ele leva a
      sua Rede de Almas até §e5000 LP§r. Coloque-o no altar para encher a Rede.
    tasks:
      - get: AWWayofTime:weakBloodOrb
    rewards:
      - xp: 4
      - choice: [minecraft:diamond x1, minecraft:cooked_beef x16, minecraft:stone x32]

  - id: lousa_branca
    title: "Lousas em Branco"
    type: main
    deps: [orbe_fraco]
    icon: AWWayofTime:blankSlate
    desc: |
      Toda magia de sangue precisa de um "papel" para ser escrita: a §eLousa em Branco§r.
      Coloque §ePedra lisa§r no altar: custa §e1000 LP§r cada.

      Junte §e8 lousas§r — elas vão para sigilos, runas e quase tudo daqui para frente.
      §aDica:§r faça os cortes enquanto a lousa está na bacia; o altar consome a essência
      conforme você a fornece.
    tasks:
      - get: AWWayofTime:blankSlate x8
    rewards:
      - xp: 4
      - choice: [minecraft:stone x64, minecraft:glass x32, minecraft:cooked_chicken x16]

  - id: sigilo_divinacao
    title: "Sigilo da Divinação"
    type: main
    deps: [lousa_branca]
    icon: AWWayofTime:divinationSigil
    desc: |
      Como saber quanto sangue você já tem? Com o §eSigilo da Divinação§r: vidro em volta,
      uma Lousa em Branco e o Orbe Fraco na bancada (o orbe não é consumido, só "assina" a
      receita com LP).

      Clique no ar para ver o LP da sua Rede; clique no altar para ver o §etier§r, a
      capacidade e quanto ele guarda. Você vai usar isso o tempo todo, então deixe na hotbar!
    tasks:
      - get: AWWayofTime:divinationSigil
    rewards:
      - xp: 4
      - choice: [AWWayofTime:blankSlate x2, minecraft:glass x32, minecraft:diamond x1]

  - id: primeiro_sangue
    title: "O Primeiro Sangue"
    type: milestone
    deps: [orbe_fraco, sigilo_divinacao]
    icon: AWWayofTime:weakBloodOrb
    banner: "O Primeiro Sangue"
    subtitle: "O Volume do Sangue desperta"
    desc: |
      Altar, faca, orbe vinculado, sigilo... Herói, você acabou de escrever a primeira página
      vermelha do Registro! Eu sinto a sua Rede de Almas pulsando daqui.

      O que vem agora:
      §e• Sigilos§r de Água e Lava para facilitar a vida.
      §e• Runas de Sangue§r para o Altar de Tier 2.
      §e• Pedra Ritual Imperfeita§r para os primeiros rituais.

      Uma recomendação de quem gosta de você: monte uma horta, uma criação de animais e
      tenha sempre comida saturada por perto. Sangue não nasce em árvore!
    tasks:
      - get: [AWWayofTime:Altar, AWWayofTime:weakBloodOrb, AWWayofTime:divinationSigil]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Aprendiz de Sangue", items: [minecraft:cooked_beef x32, minecraft:golden_carrot x16, minecraft:stone x64, minecraft:glass x16, minecraft:gold_ingot x4]}
      - loot: raro

  - id: sigilo_agua
    title: "Sigilo da Água"
    type: normal
    deps: [lousa_branca]
    icon: AWWayofTime:waterSigil
    desc: |
      Água infinita no bolso! O §eSigilo da Água§r leva 7 baldes de água em volta de uma
      Lousa em Branco e o Orbe Fraco embaixo.

      Cada uso cria uma fonte de água e custa §e100 LP§r. Ótimo para fazendas, para apagar
      incêndios... e para quando a lava aparecer onde não devia.
    tasks:
      - get: AWWayofTime:waterSigil
    rewards:
      - xp: 2
      - item: minecraft:bucket x4

  - id: cristal_lava
    title: "Cristal de Lava"
    type: normal
    deps: [orbe_fraco]
    icon: AWWayofTime:lavaCrystal
    desc: |
      Um combustível que nunca acaba (enquanto a sua Rede aguentar)! O §eCristal de Lava§r
      usa vidro, baldes de lava, obsidiana, um diamante e o Orbe Fraco.

      Coloque-o como combustível em qualquer fornalha: ele queima puxando LP da sua Rede.
      §cSe a Rede secar, você sente náusea§r enquanto ele estiver na fornalha — tire-o de lá!
      Ele também vira o Cristal de Ativação, mais adiante.
    tasks:
      - get: AWWayofTime:lavaCrystal
    rewards:
      - xp: 2
      - item: minecraft:obsidian x4

  - id: sigilo_lava
    title: "Sigilo da Lava"
    type: normal
    deps: [cristal_lava]
    icon: AWWayofTime:lavaSigil
    desc: |
      Lava infinita e incêndios infinitos — escolha com sabedoria onde clica!

      O §eSigilo da Lava§r leva baldes de lava, um Creme de Magma, uma Lousa em Branco e o
      §eCristal de Lava§r. Cada uso cria uma fonte de lava e custa §e1000 LP§r — caro para
      uma Rede pequena. §cNunca use perto de madeira ou de você mesmo.§r
    tasks:
      - get: AWWayofTime:lavaSigil
    rewards:
      - xp: 2
      - item: minecraft:magma_cream x2

  - id: balde_vida
    title: "Balde de Vida"
    type: optional
    deps: [orbe_fraco]
    icon: AWWayofTime:bucketLife
    desc: |
      Um balde vazio no altar (1000 LP) vira um §eBalde de Vida§r com Essência Vital. Serve
      para transportar sangue e é ingrediente do Sigilo da Visão. Ah, e não, não é para
      beber. Eu sei que você pensou nisso.
    tasks:
      - get: AWWayofTime:bucketLife
    rewards:
      - loot: comum

  - id: pedra_imperfeita
    title: "Pedra Ritual Imperfeita"
    type: normal
    deps: [orbe_fraco]
    icon: AWWayofTime:imperfectRitualStone
    desc: |
      Os primeiros rituais de Magus eram simples: uma pedra que lê o bloco logo acima dela.
      A §ePedra Ritual Imperfeita§r usa obsidiana, pedra e o Orbe Fraco.

      Clique direito nela e um raio cai, ativando um efeito conforme o bloco em cima, por
      §e5000 LP§r. Veja a quest de informação ao lado para a lista.
    tasks:
      - get: AWWayofTime:imperfectRitualStone
    rewards:
      - xp: 2
      - item: minecraft:obsidian x4

  - id: info_rituais_fracos
    title: "Rituais Imperfeitos"
    type: info
    deps: [pedra_imperfeita]
    icon: minecraft:coal_block
    desc: |
      Bloco em cima da Pedra Ritual Imperfeita → efeito (5000 LP cada):
      §e• Fonte de água:§r invoca uma tempestade.
      §e• Bloco de carvão:§r invoca um zumbi fortalecido. §c(Ele vem bravo!)§r
      §e• Bloco de lápis-lazúli:§r vira noite.
      §e• Rocha-mãe (bedrock):§r Resistência II por 1 minuto.

      Um raio cai na ativação. Não fique em cima, nem perto de nada inflamável!
    tasks:
      - check
    rewards:
      - xp: 1

  # ======================================================================
  # FASE 1 — TIER 2: RUNAS, ADAGA, LOUSA REFORÇADA
  # ======================================================================
  - id: runas_sangue
    title: "Runas de Sangue"
    type: main
    deps: [primeiro_sangue]
    icon: AWWayofTime:AlchemicalWizardrybloodRune
    desc: |
      O poder do altar vem da estrutura em volta dele. A §eRuna de Sangue§r é feita com
      pedra, 2 Lousas em Branco e o Orbe Fraco.

      Faça §e8 runas§r e coloque-as num anel 3×3 §eum bloco abaixo§r do altar (o altar fica no
      centro, por cima do buraco do anel). Use o Sigilo da Divinação no altar: ele deve
      dizer §eTier 2§r.

      §aImportante:§r runas especiais substituem runas comuns em qualquer posição de runa.
    tasks:
      - get: AWWayofTime:AlchemicalWizardrybloodRune x8
    rewards:
      - xp: 4
      - choice: [AWWayofTime:blankSlate x4, minecraft:stone x64, minecraft:cooked_beef x16]

  - id: lousa_reforcada
    title: "Altar de Tier 2: Lousa Reforçada"
    type: milestone
    deps: [runas_sangue]
    icon: AWWayofTime:reinforcedSlate
    banner: "Altar de Tier 2"
    subtitle: "Oito runas despertas"
    desc: |
      Sentiu a vibração? É o altar acordando para o segundo andar!

      A prova de que o Tier 2 funciona: uma Lousa em Branco no altar, com §e2000 LP§r, vira
      §eLousa Reforçada§r — e isso só acontece de Tier 2 para cima. Junte §e4§r.

      O Tier 2 destrava a Adaga de Sacrifício, o Orbe de Aprendiz (esmeralda, 5000 LP) e o
      Frasco de Poção. Próxima parada: §eTier 3§r, com pilares e 20 runas a mais.
    tasks:
      - get: AWWayofTime:reinforcedSlate x4
    rewards:
      - xp: 8
      - kit: {name: "Kit das Runas", items: [AWWayofTime:blankSlate x8, minecraft:stone x64, minecraft:sugar x16, minecraft:emerald x1, minecraft:cooked_porkchop x32]}
      - loot: raro

  - id: runa_velocidade
    title: "Runa de Velocidade"
    type: normal
    deps: [runas_sangue]
    icon: AWWayofTime:speedRune
    desc: |
      Açúcar dá energia até para altares! A §eRuna de Velocidade§r leva uma Runa de Sangue,
      açúcar, pedra e Lousas em Branco.

      Cada uma aumenta em §e25%§r a velocidade com que o altar injeta essência nas
      transmutações e nos orbes. §aMas cuidado:§r mais rápido também significa que o altar
      seca mais rápido nas receitas caras.
    tasks:
      - get: AWWayofTime:speedRune
    rewards:
      - xp: 2
      - item: minecraft:sugar x16

  - id: adaga_sacrificio
    title: "Adaga do Sacrifício"
    type: main
    deps: [lousa_reforcada]
    icon: AWWayofTime:daggerOfSacrifice
    desc: |
      Chega de cortar a si mesmo o tempo todo. Uma §eEspada de Ferro§r no altar de Tier 2
      (3000 LP) vira a §eAdaga do Sacrifício§r.

      Golpeie uma criatura §eperto do altar§r: ela morre na hora e a vida dela vira essência.
      Animais rendem menos, monstros mais, e aldeões ainda mais. Chefes, filhotes e
      jogadores não podem ser sacrificados.

      §cAviso:§r máquinas não conseguem usar a adaga — para automatizar, existe o ritual
      Poço do Sofrimento.
    tasks:
      - get: AWWayofTime:daggerOfSacrifice
    rewards:
      - xp: 4
      - choice: [minecraft:wheat x32, minecraft:carrot x16, minecraft:lead x4]

  - id: orbe_aprendiz
    title: "Orbe de Sangue de Aprendiz"
    type: main
    deps: [lousa_reforcada]
    icon: AWWayofTime:apprenticeBloodOrb
    desc: |
      Se um diamante deu um orbe, imagina uma esmeralda!

      Coloque uma §eEsmeralda§r no altar de Tier 2: são §e5000 LP§r. O altar precisa ter
      essência suficiente fluindo; se ficar cinza, corra para sacrificar mais.

      O §eOrbe de Aprendiz§r leva a sua Rede até §e25 000 LP§r e é exigido por muitos sigilos,
      runas de sacrifício e Pedras Rituais.
    tasks:
      - get: AWWayofTime:apprenticeBloodOrb
    rewards:
      - xp: 4
      - choice: [minecraft:emerald x1, AWWayofTime:reinforcedSlate x2, minecraft:obsidian x16]

  - id: frasco_pocao
    title: "Frasco de Poção"
    type: optional
    deps: [lousa_reforcada]
    icon: AWWayofTime:alchemyFlask
    desc: |
      Um frasco de vidro no altar (2000 LP) vira o §eFrasco de Poção§r, que guarda várias
      doses de uma poção alquímica. É o recipiente das poções da Mesa Alquímica e um jeito
      de aplicar Fraqueza III (útil para os Fragmentos de Sangue, mais tarde).
    tasks:
      - get: AWWayofTime:alchemyFlask
    rewards:
      - loot: comum

  - id: cristal_nao_vinculado
    title: "Cristal Não Vinculado"
    type: optional
    deps: [lousa_reforcada]
    icon: AWWayofTime:blankSpell
    desc: |
      Vidro no altar de Tier 2 (1000 LP) vira o §eCristal Não Vinculado§r. Ele é a base do
      Cristal de Feitiço Complexo, a chave dos feitiços de sangue. Guarde um!
    tasks:
      - get: AWWayofTime:blankSpell
    rewards:
      - loot: comum

  - id: sigilo_vazio
    title: "Sigilo do Vazio"
    type: normal
    deps: [orbe_aprendiz]
    icon: AWWayofTime:voidSigil
    desc: |
      Criar líquido você já sabe. Agora, sumir com ele! O §eSigilo do Vazio§r leva baldes,
      linha, uma Lousa Reforçada e o Orbe de Aprendiz. Cada uso apaga uma fonte de líquido
      (50 LP). Perfeito para limpar lava de cavernas.
    tasks:
      - get: AWWayofTime:voidSigil
    rewards:
      - xp: 2
      - item: minecraft:string x8

  - id: sigilo_ar
    title: "Sigilo do Ar"
    type: normal
    deps: [orbe_aprendiz]
    icon: AWWayofTime:airSigil
    desc: |
      Voar como um passarinho... ou como uma pedra arremessada. O §eSigilo do Ar§r (penas,
      lágrima de Ghast, Lousa Reforçada e Orbe de Aprendiz) empurra você para onde olha.

      §cCuidado com o pouso!§r Ele não protege contra dano de queda. Planeje a aterrissagem
      (água ajuda muito).
    tasks:
      - get: AWWayofTime:airSigil
    rewards:
      - xp: 2
      - item: minecraft:feather x16

  - id: sigilo_minerador
    title: "Sigilo do Minerador Veloz"
    type: normal
    deps: [orbe_aprendiz]
    icon: AWWayofTime:sigilOfTheFastMiner
    desc: |
      Por que melhorar a ferramenta se dá para melhorar o braço? O §eSigilo do Minerador
      Veloz§r usa picareta, pá e machado de ferro, pedra, Lousa Reforçada e o Orbe de
      Aprendiz.

      Ligue/desligue com clique direito: dá Pressa enquanto ativo, cobrando LP de tempos em
      tempos. §aLembre de desligar§r quando não estiver minerando!
    tasks:
      - get: AWWayofTime:sigilOfTheFastMiner
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x8

  - id: sigilo_bosque
    title: "Sigilo do Bosque Verdejante"
    type: normal
    deps: [orbe_aprendiz]
    icon: AWWayofTime:growthSigil
    desc: |
      Uma farinha de osso infinita e portátil! O §eSigilo do Bosque Verdejante§r leva
      mudas, canas-de-açúcar, Lousa Reforçada e Orbe de Aprendiz.

      Clique numa planta para fertilizá-la, ou ative para acelerar as plantas em volta
      enquanto anda. É a versão de bolso do Ritual do Bosque Verdejante.
    tasks:
      - get: AWWayofTime:growthSigil
    rewards:
      - xp: 2
      - item: minecraft:sapling x8

  - id: sigilo_visao
    title: "Sigilo da Visão"
    type: optional
    deps: [orbe_aprendiz, balde_vida, sigilo_divinacao]
    icon: AWWayofTime:seerSigil
    desc: |
      Uma divinação mais técnica: o §eSigilo da Visão§r (vidro, Sigilo da Divinação, Balde de
      Vida e Orbe de Aprendiz) mostra os buffers do altar, o progresso da transmutação e a
      velocidade de consumo. Em troca, deixa de mostrar o tier. Ótimo para planejar receitas
      caras!
    tasks:
      - get: AWWayofTime:seerSigil
    rewards:
      - loot: comum

  - id: runa_sacrificio
    title: "Runa de Sacrifício"
    type: normal
    deps: [orbe_aprendiz, adaga_sacrificio]
    icon: AWWayofTime:runeOfSacrifice
    desc: |
      Ouro é ótimo para magia. A §eRuna de Sacrifício§r (pedra, ouro, Lousas Reforçadas e
      Orbe de Aprendiz) aumenta em §e12%§r por runa o LP das criaturas sacrificadas pela
      Adaga ou pelo Poço do Sofrimento.

      Se a sua base vai viver de fazenda de mobs, encha o altar delas!
    tasks:
      - get: AWWayofTime:runeOfSacrifice
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x4

  - id: runa_autosacrificio
    title: "Runa de Autossacrifício"
    type: normal
    deps: [orbe_aprendiz]
    icon: AWWayofTime:runeOfSelfSacrifice
    desc: |
      A irmã de pó de pedra luminosa: a §eRuna de Autossacrifício§r (pedra, pó de pedra
      luminosa, Lousas Reforçadas e Orbe de Aprendiz) aumenta em §e12%§r por runa o LP de
      cada corte da sua faca.

      Se o seu estilo é "sangrar com responsabilidade", essa é a runa.
    tasks:
      - get: AWWayofTime:runeOfSelfSacrifice
    rewards:
      - xp: 2
      - item: minecraft:glowstone_dust x8

  - id: mochila_sangue
    title: "Mochila do Sangrador"
    type: optional
    deps: [lousa_branca]
    icon: AWWayofTime:itemBloodPack
    desc: |
      Para quem não quer ficar parado ao lado do altar: a §eMochila do Sangrador§r (peitoral
      de couro, vidro, balde, sílex e Lousa em Branco) drena sua vida aos poucos quando você
      tem mais de 5 corações e guarda até 10 000 LP de essência.

      Despeje no altar depois — mas as runas não dão bônus a essa essência, e o altar só
      aceita quando não está transmutando.
    tasks:
      - get: AWWayofTime:itemBloodPack
    rewards:
      - loot: comum

  - id: pedra_ritual
    title: "Pedras Rituais"
    type: main
    deps: [orbe_aprendiz]
    icon: AWWayofTime:ritualStone
    desc: |
      As grandes magias de Magus são desenhadas no chão com pedras e tintas. A §ePedra
      Ritual§r é feita com obsidiana, Lousas Reforçadas e o Orbe de Aprendiz.

      Rituais pequenos usam 4 a 8 pedras; os grandes usam dezenas. Comece com §e8§r e vá
      juntando — você nunca terá pedras rituais demais.
    tasks:
      - get: AWWayofTime:ritualStone x8
    rewards:
      - xp: 4
      - choice: [minecraft:obsidian x16, AWWayofTime:reinforcedSlate x4, minecraft:diamond x1]

  - id: mesa_quimica
    title: "Conjunto de Química Alquímica"
    type: main
    deps: [orbe_fraco]
    icon: AWWayofTime:blockWritingTable
    desc: |
      Vlad, o aprendiz alquimista, inventou uma bancada que usa LP como combustível. O
      §eConjunto de Química Alquímica§r leva um Suporte de Poções, obsidiana e o Orbe Fraco.

      Coloque um §eOrbe de Sangue vinculado§r no espaço do orbe e até 5 ingredientes; a mesa
      processa drenando LP da Rede. Cada receita exige um tier mínimo de orbe (veja no NEI,
      aba "Alchemic Chemistry Set").
    tasks:
      - get: AWWayofTime:blockWritingTable
    rewards:
      - xp: 4
      - choice: [minecraft:redstone x16, minecraft:glowstone_dust x8, minecraft:gunpowder x8]

  # ======================================================================
  # FASE 2 — ALQUIMIA: CATALISADORES E REAGENTES
  # ======================================================================
  - id: catalisador_simples
    title: "Catalisador Simples"
    type: main
    deps: [mesa_quimica]
    icon: AWWayofTime:simpleCatalyst
    desc: |
      A base de quase toda alquimia: §eCatalisador Simples§r = açúcar, 2 redstone, pó de
      pedra luminosa e pólvora, com o Orbe Fraco na mesa.

      Faça §e8§r. Os reagentes, os agentes de ligação e os catalisadores de poção começam
      todos aqui.
    tasks:
      - get: AWWayofTime:simpleCatalyst x8
    rewards:
      - xp: 4
      - choice: [minecraft:redstone x16, minecraft:sugar x16, minecraft:gunpowder x8]

  - id: reagente_incendium
    title: "Incendium"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:incendium
    desc: |
      O reagente do fogo: balde de lava, 2 pós de blaze, rocha do Nether e um Catalisador
      Simples (Orbe de Aprendiz). O §eIncendium§r aparece em núcleos de fogo, catalisadores
      maiores e no Cristal de Ativação Desperto.
    tasks:
      - get: AWWayofTime:incendium
    rewards:
      - xp: 2
      - item: minecraft:blaze_powder x2

  - id: reagente_aether
    title: "Aether"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:aether
    desc: |
      O reagente do ar: 2 penas, pó de pedra luminosa, lágrima de Ghast e Catalisador
      Simples (Orbe de Aprendiz). O §eAether§r vira Núcleo de Vento e entra em convocações.
    tasks:
      - get: AWWayofTime:aether
    rewards:
      - xp: 2
      - item: minecraft:feather x8

  - id: reagente_sanctus
    title: "Sanctus"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:sanctus
    desc: |
      O reagente sagrado: 2 pós de pedra luminosa, pepita de ouro, vidro e Catalisador
      Simples. O §eSanctus§r cura e protege — e entra no Agente de Ligação Padrão.
    tasks:
      - get: AWWayofTime:sanctus
    rewards:
      - xp: 2
      - item: minecraft:glowstone_dust x8

  - id: reagente_crepitous
    title: "Crepitous"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:crepitous
    desc: |
      O reagente explosivo: 2 pólvoras, 2 pedregulhos e Catalisador Simples. §cTrate o
      Crepitous com respeito§r: ele está na Bazuca de Energia.
    tasks:
      - get: AWWayofTime:crepitous
    rewards:
      - xp: 2
      - item: minecraft:gunpowder x8

  - id: reagente_crystallos
    title: "Crystallos"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:crystallos
    desc: |
      O reagente do gelo: 2 gelos, 2 blocos de neve e Catalisador Simples. O §eCrystallos§r
      congela — e é parte do Agente de Ligação Padrão.
    tasks:
      - get: AWWayofTime:crystallos
    rewards:
      - xp: 2
      - item: minecraft:snowball x16

  - id: reagente_terrae
    title: "Terrae"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:terrae
    desc: |
      O reagente da terra: terra, areia, 2 obsidianas e Catalisador Simples. O §eTerrae§r
      também aumenta o tamanho de meteoros no ritual Marca da Torre Caída!
    tasks:
      - get: AWWayofTime:terrae
    rewards:
      - xp: 2
      - item: minecraft:obsidian x4

  - id: reagente_aquasalus
    title: "Aquasalus"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:aquasalus
    desc: |
      O reagente da água: 3 frascos de água, uma bolsa de tinta e Catalisador Simples. O
      §eAquasalus§r está nos catalisadores de duração maiores e no Agente de Enchimento
      Aprimorado.
    tasks:
      - get: AWWayofTime:aquasalus
    rewards:
      - xp: 2
      - item: minecraft:glass_bottle x8

  - id: reagente_tenebrae
    title: "Tenebrae"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:tennebrae
    desc: |
      O reagente da escuridão: 2 carvões, obsidiana, argila e Catalisador Simples. O
      §eTenebrae§r vira Praesidium e é pedido em várias convocações de demônios.
    tasks:
      - get: AWWayofTime:tennebrae
    rewards:
      - xp: 2
      - item: minecraft:coal x8

  - id: reagente_magicales
    title: "Magicales"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:magicales
    desc: |
      O reagente arcano: redstone, pólvora, 2 pós de pedra luminosa e Catalisador Simples. O
      §eMagicales§r vira o Cabo Magicales dos feitiços complexos.
    tasks:
      - get: AWWayofTime:magicales
    rewards:
      - xp: 2
      - item: minecraft:redstone x16

  - id: reagentes_completos
    title: "Os Nove Reagentes"
    type: milestone
    deps: [reagente_incendium, reagente_aether, reagente_sanctus, reagente_crepitous, reagente_crystallos, reagente_terrae, reagente_aquasalus, reagente_tenebrae, reagente_magicales]
    icon: AWWayofTime:magicales
    banner: "Os Nove Reagentes"
    subtitle: "Alquimia de sangue dominada"
    desc: |
      Fogo, ar, luz, explosão, gelo, terra, água, sombra e magia — os nove reagentes na sua
      mão! Vlad ficaria orgulhoso (e eu estou, MUITO).

      Esses reagentes alimentam a §eCalcinadora Alquímica§r (para rituais com reagentes), a
      convocação de §eElementais§r na Plinto Arcano e os catalisadores de poção. E guarde
      sempre alguns: o Catalisador Amorfo do Blood Arsenal leva oito deles!
    tasks:
      - get: [AWWayofTime:incendium, AWWayofTime:aether, AWWayofTime:sanctus, AWWayofTime:crepitous, AWWayofTime:crystallos, AWWayofTime:terrae, AWWayofTime:aquasalus, AWWayofTime:tennebrae, AWWayofTime:magicales]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Alquimista Rubro", items: [AWWayofTime:simpleCatalyst x8, minecraft:glowstone_dust x16, minecraft:redstone x32, minecraft:gunpowder x16, minecraft:blaze_powder x4]}
      - loot: raro

  - id: agente_ligacao_fraco
    title: "Agente de Ligação Fraco"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:weakBindingAgent
    desc: |
      2 Catalisadores Simples + argila (Orbe de Aprendiz) = §eAgente de Ligação Fraco§r. Ele
      "cola" catalisadores de poção e é a base do Agente de Ligação Padrão.
    tasks:
      - get: AWWayofTime:weakBindingAgent
    rewards:
      - xp: 2
      - item: minecraft:clay_ball x8

  - id: agente_ligacao_padrao
    title: "Agente de Ligação Padrão"
    type: normal
    deps: [agente_ligacao_fraco, reagente_sanctus, reagente_crystallos]
    icon: AWWayofTime:standardBindingAgent
    desc: |
      Agente Fraco + Sanctus + Crystallos (Orbe de Mago) = §eAgente de Ligação Padrão§r. Ele
      junta os catalisadores Mundanos em Médios. §aDica:§r também aparece em baús de
      masmorra!
    tasks:
      - get: AWWayofTime:standardBindingAgent
    rewards:
      - xp: 2
      - item: AWWayofTime:simpleCatalyst x2

  - id: catalisador_potencia
    title: "Catalisadores de Potência"
    type: normal
    deps: [agente_ligacao_fraco]
    icon: AWWayofTime:mundanePowerCatalyst
    desc: |
      As poções alquímicas ficam mais fortes com §eCatalisadores de Potência§r:
      §e• Mundano:§r 3 pós de pedra luminosa + Agente Fraco + Catalisador Simples.
      §e• Médio:§r 2 Mundanos + Agente Padrão.
      §e• Maior:§r 2 Médios + Incendium.

      Mostre o Mundano para começar. Aplicam-se ao Frasco de Poção na mesa (veja o NEI).
    tasks:
      - get: AWWayofTime:mundanePowerCatalyst
    rewards:
      - xp: 2
      - item: minecraft:glowstone_dust x8

  - id: catalisador_duracao
    title: "Catalisadores de Duração"
    type: normal
    deps: [agente_ligacao_fraco]
    icon: AWWayofTime:mundaneLengtheningCatalyst
    desc: |
      Para poções que duram mais, os §eCatalisadores de Prolongamento§r:
      §e• Mundano:§r 3 redstones + Agente Fraco + Catalisador Simples.
      §e• Médio:§r 2 Mundanos + Agente Padrão.
      §e• Maior:§r 2 Médios + Aquasalus.
    tasks:
      - get: AWWayofTime:mundaneLengtheningCatalyst
    rewards:
      - xp: 2
      - item: minecraft:redstone x16

  - id: catalisador_maior
    title: "Catalisadores Maiores"
    type: optional
    deps: [catalisador_potencia, catalisador_duracao, agente_ligacao_padrao]
    icon: AWWayofTime:greaterPowerCatalyst
    desc: |
      O topo da escada de catalisadores. Mostre um §eCatalisador de Potência Maior§r ou um
      §eCatalisador de Prolongamento Maior§r. Eles também aparecem raramente em baús de
      masmorra, de presente!
    tasks:
      - one_of: [AWWayofTime:greaterPowerCatalyst, AWWayofTime:greaterLengtheningCatalyst]
    rewards:
      - loot: incomum

  - id: agente_enchimento
    title: "Agentes de Enchimento"
    type: optional
    deps: [catalisador_simples]
    icon: AWWayofTime:weakFillingAgent
    desc: |
      Os §eAgentes de Enchimento§r recarregam doses do Frasco de Poção. Fraco: Catalisador
      Simples, verruga do Nether, redstone e pó de pedra luminosa. Padrão: Fraco + Terrae.
      Aprimorado: Padrão + Aquasalus + Magicales.
    tasks:
      - get: AWWayofTime:weakFillingAgent
    rewards:
      - loot: comum

  - id: catalisador_fortalecido
    title: "Catalisador Fortalecido"
    type: normal
    deps: [catalisador_simples]
    icon: AWWayofTime:bloodMagicBaseAlchemyItems:3
    desc: |
      2 Catalisadores Simples + farinha de osso + verruga do Nether (Orbe de Mago) =
      §eCatalisador Fortalecido§r. É o segundo degrau: dele saem Offensa, Praesidium, Orbis
      Terrae, Virtus, Reductus e Potentia, além dos roteadores alquímicos.
    tasks:
      - get: AWWayofTime:bloodMagicBaseAlchemyItems:3 x4
    rewards:
      - xp: 2
      - item: minecraft:nether_wart x8

  - id: osso_fraturado
    title: "Osso Fraturado"
    type: optional
    deps: [catalisador_simples]
    icon: AWWayofTime:bloodMagicBaseAlchemyItems:5
    desc: |
      4 ossos + pólvora na mesa (Orbe Fraco) = §eOsso Fraturado§r. Na bancada ele vira 5
      farinhas de osso, e é ingrediente do Catalisador Concentrado e do Incenso Purpura.
    tasks:
      - get: AWWayofTime:bloodMagicBaseAlchemyItems:5
    rewards:
      - loot: comum

  - id: catalisador_concentrado
    title: "Catalisador Concentrado"
    type: normal
    deps: [catalisador_fortalecido, osso_fraturado]
    icon: AWWayofTime:bloodMagicBaseAlchemyItems:4
    desc: |
      Fortalecido + Osso Fraturado + pepita de ouro (Orbe Mestre) = §eCatalisador
      Concentrado§r. Ele faz a Redoma de Cristal, o Relé Alquímico e as Placas Rúnicas
      Rachadas dos feitiços.
    tasks:
      - get: AWWayofTime:bloodMagicBaseAlchemyItems:4
    rewards:
      - xp: 3
      - item: minecraft:gold_nugget x9

  - id: reagentes_avancados
    title: "Offensa, Praesidium e Orbis Terrae"
    type: normal
    deps: [catalisador_fortalecido, reagentes_completos]
    icon: AWWayofTime:bloodMagicBaseAlchemyItems
    desc: |
      Reagentes de segunda geração (Orbe de Mago, base Catalisador Fortalecido):
      §e• Offensa:§r + Incendium, 2 flechas, sílex.
      §e• Praesidium:§r + Tenebrae, ferro, teia, redstone.
      §e• Orbis Terrae:§r + Terrae, pólvora, rocha do Nether, areia.

      Eles fazem os Núcleos Ofensivo, Defensivo e Ambiental dos feitiços.
    tasks:
      - get: [AWWayofTime:bloodMagicBaseAlchemyItems, AWWayofTime:bloodMagicBaseAlchemyItems:1, AWWayofTime:bloodMagicBaseAlchemyItems:2]
    rewards:
      - xp: 3
      - item: minecraft:arrow x16

  - id: reagentes_potencia
    title: "Virtus, Reductus e Potentia"
    type: normal
    deps: [catalisador_fortalecido, reagentes_completos]
    icon: AWWayofTime:bloodMagicBaseAlchemyItems:6
    desc: |
      Os reagentes que modulam feitiços (Orbe de Mago):
      §e• Virtus:§r redstones, carvão, pólvora → Núcleo de Poder.
      §e• Reductus:§r redstone, ouro, areia das almas, cenoura → Núcleo de Redução.
      §e• Potentia:§r pó de pedra luminosa, 2 lápis-lazúli, quartzo → Núcleo de Potência.
    tasks:
      - get: [AWWayofTime:bloodMagicBaseAlchemyItems:6, AWWayofTime:bloodMagicBaseAlchemyItems:7, AWWayofTime:bloodMagicBaseAlchemyItems:8]
    rewards:
      - xp: 3
      - item: minecraft:quartz x8

  - id: calcinadora
    title: "Calcinadora Alquímica"
    type: normal
    deps: [catalisador_fortalecido]
    icon: AWWayofTime:blockAlchemicCalcinator
    desc: |
      Alguns rituais aceitam §eAR§r (Reagente Alquímico puro). A §eCalcinadora Alquímica§r
      (Placas Rúnicas Rachadas, vidro, Catalisador Fortalecido e pedregulho) refina o
      reagente cru em AR: clique nela com um Orbe vinculado e depois com o reagente.

      O AR fica guardado dentro dela e pode ser levado aos rituais com Roteadores.
    tasks:
      - get: AWWayofTime:blockAlchemicCalcinator
    rewards:
      - xp: 2
      - item: minecraft:cobblestone x32

  - id: redoma_cristal
    title: "Redoma de Cristal"
    type: normal
    deps: [catalisador_concentrado]
    icon: AWWayofTime:blockCrystalBelljar
    desc: |
      Vidro, Catalisador Concentrado e lajes de madeira = §eRedoma de Cristal§r. Ela armazena
      AR e §emantém o conteúdo quando quebrada§r. A Convocação dos Condenados exige
      §e8 redomas§r em posições exatas — comece a fazer!
    tasks:
      - get: AWWayofTime:blockCrystalBelljar
    rewards:
      - xp: 2
      - item: minecraft:glass x16

  - id: roteador_alquimico
    title: "Roteador e Relé Alquímico"
    type: optional
    deps: [calcinadora]
    icon: AWWayofTime:itemAttunedCrystal
    desc: |
      O §eRoteador Alquímico§r liga fontes de AR a destinos: clique na fonte, depois no
      destino. O §eRelé Alquímico§r estende o alcance. O §eSegmentador§r limita tanques e o
      §eLimpador§r apaga ligações erradas. Mostre o Roteador ou o Relé.
    tasks:
      - one_of: [AWWayofTime:itemAttunedCrystal, AWWayofTime:blockReagentConduit]
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 3 — TIER 3: ORBE DE MAGO, TINTAS E A PEDRA MESTRA
  # ======================================================================
  - id: info_altar_t3
    title: "Estrutura: Altar de Tier 3"
    type: info
    deps: [lousa_reforcada]
    icon: minecraft:glowstone
    desc: |
      O Tier 3 exige o anel do Tier 2 §emais§r:
      §e• 20 runas§r num anel 7×7, §eum bloco abaixo do anel anterior§r (5 em cada lado,
      centralizadas, sem os cantos).
      §e• 4 pilares§r de 2 blocos (qualquer material) nos cantos, a 3 blocos do altar.
      §e• Tampas§r em cima dos pilares: §ePedra Luminosa§r (este pack aceita também Lanterna
      do Mar do Botania, do Et Futurum, pedra luminosa do Chisel e da ExtraUtilities, e a
      Pedra Luminosa Infundida do Blood Arsenal).

      Total: 28 runas. Os vãos podem ficar vazios ou decorados.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: altar_tier3
    title: "Altar de Tier 3: Lousa Imbuída"
    type: milestone
    deps: [info_altar_t3, runas_sangue]
    icon: AWWayofTime:imbuedSlate
    banner: "Altar de Tier 3"
    subtitle: "Pilares de luz"
    desc: |
      Vinte e oito runas e quatro chamas de pedra luminosa. Que lindo, Herói!

      Prova do Tier 3: uma Lousa Reforçada com §e5000 LP§r vira §eLousa Imbuída§r. Junte
      §e4§r. O Tier 3 também transmuta o Bloco de Ouro no Orbe de Mago (25 000 LP!), as
      quatro tintas elementais, o Cristal de Ativação e o Soquete Preenchido.

      §aDica:§r 25 000 LP é mais do que um altar sem runas de capacidade guarda — mantenha
      essência entrando enquanto o orbe transmuta (poções de cura ajudam muito).
    tasks:
      - get: AWWayofTime:imbuedSlate x4
    rewards:
      - xp: 8
      - kit: {name: "Kit do Mago de Sangue", items: [minecraft:glowstone x4, minecraft:gold_block x1, AWWayofTime:reinforcedSlate x4, minecraft:potion:8229 x4, minecraft:cooked_beef x32]}
      - loot: raro

  - id: orbe_mago
    title: "Orbe de Sangue de Mago"
    type: main
    deps: [altar_tier3]
    icon: AWWayofTime:magicianBloodOrb
    desc: |
      O orbe dourado! Um §eBloco de Ouro§r no altar de Tier 3 consome §e25 000 LP§r.

      Como o altar básico só guarda 10 000, você precisa repor essência enquanto ele
      transmuta. Poções de cura instantânea + faca = muito LP rápido (só não exagere).

      O §eOrbe de Mago§r leva a Rede a §e150 000 LP§r e destrava a Pedra Ritual Mestra, os
      sigilos de terceira geração e a Forja de Armadura da Alma.
    tasks:
      - get: AWWayofTime:magicianBloodOrb
    rewards:
      - xp: 4
      - choice: [minecraft:gold_block x1, AWWayofTime:imbuedSlate x2, minecraft:obsidian x32]

  - id: tinta_terra
    title: "Ferramenta de Inscrição: Terra"
    type: normal
    deps: [altar_tier3]
    icon: AWWayofTime:earthScribeTool
    desc: |
      Rituais são desenhados com quatro tintas elementais. A de §eTerra§r nasce de uma
      §eObsidiana§r no altar de Tier 3 (1000 LP). Cada ferramenta tem 10 usos: clique numa
      Pedra Ritual para pintá-la.
    tasks:
      - get: AWWayofTime:earthScribeTool
    rewards:
      - xp: 2
      - item: minecraft:obsidian x4

  - id: tinta_agua
    title: "Ferramenta de Inscrição: Água"
    type: normal
    deps: [altar_tier3]
    icon: AWWayofTime:waterScribeTool
    desc: |
      A tinta da §eÁgua§r vem de um §eBloco de Lápis-Lazúli§r no altar de Tier 3 (1000 LP).
      Pinte as pedras azuis dos rituais com ela.
    tasks:
      - get: AWWayofTime:waterScribeTool
    rewards:
      - xp: 2
      - item: minecraft:dye:4 x9

  - id: tinta_fogo
    title: "Ferramenta de Inscrição: Fogo"
    type: normal
    deps: [altar_tier3]
    icon: AWWayofTime:fireScribeTool
    desc: |
      A tinta do §eFogo§r vem de um §eCreme de Magma§r no altar de Tier 3 (1000 LP). Pedras
      vermelhas, rituais quentes!
    tasks:
      - get: AWWayofTime:fireScribeTool
    rewards:
      - xp: 2
      - item: minecraft:magma_cream x2

  - id: tinta_ar
    title: "Ferramenta de Inscrição: Ar"
    type: normal
    deps: [altar_tier3]
    icon: AWWayofTime:airScribeTool
    desc: |
      A tinta do §eAr§r vem de uma §eLágrima de Ghast§r no altar de Tier 3 (1000 LP). Sim, você
      vai precisar visitar o Nether e chorar junto com os Ghasts.
    tasks:
      - get: AWWayofTime:airScribeTool
    rewards:
      - xp: 2
      - item: minecraft:ghast_tear x1

  - id: pedra_mestra
    title: "Pedra Ritual Mestra"
    type: main
    deps: [orbe_mago, pedra_ritual]
    icon: AWWayofTime:masterStone
    desc: |
      O coração de todo ritual: a §ePedra Ritual Mestra§r, com 4 Pedras Rituais, obsidiana e
      o §eOrbe de Mago§r.

      Coloque-a, monte as Pedras Rituais em volta no desenho certo (com as cores certas de
      tinta) e ative com um §eCristal de Ativação§r vinculado. O ritual cobra um custo de
      ativação e, depois, um pequeno custo periódico da sua Rede.
    tasks:
      - get: AWWayofTime:masterStone
    rewards:
      - xp: 4
      - choice: [AWWayofTime:ritualStone x4, minecraft:obsidian x16, minecraft:diamond x2]

  - id: cristal_ativacao
    title: "Cristal de Ativação Fraco"
    type: main
    deps: [altar_tier3, cristal_lava]
    icon: AWWayofTime:activationCrystal
    desc: |
      Um §eCristal de Lava§r no altar de Tier 3 (10 000 LP) vira o §eCristal de Ativação
      Fraco§r. Vincule-o e clique na Pedra Ritual Mestra para iniciar rituais de nível 1 —
      quase todos os rituais iniciais.
    tasks:
      - get: AWWayofTime:activationCrystal
    rewards:
      - xp: 4
      - choice: [minecraft:lava_bucket x1, minecraft:diamond x1, minecraft:obsidian x8]

  - id: adivinho_ritual
    title: "Adivinho Ritual"
    type: normal
    deps: [tinta_terra, tinta_agua, tinta_fogo, tinta_ar]
    icon: AWWayofTime:itemRitualDiviner
    desc: |
      O presente de Tiberius para Magus! O §eAdivinho Ritual§r (as quatro ferramentas de
      inscrição, 4 diamantes e uma esmeralda) monta rituais sozinho.

      Shift + clique direito no ar troca o ritual (Shift + esquerdo volta). Shift + clique
      num bloco gira a direção. Clique direito na Pedra Mestra: ele coloca e pinta as
      pedras do seu inventário. Só funciona em espaços vazios!
    tasks:
      - get: AWWayofTime:itemRitualDiviner
    rewards:
      - xp: 3
      - item: AWWayofTime:ritualStone x8

  - id: info_rituais
    title: "Como Funcionam os Rituais"
    type: info
    deps: [pedra_mestra, cristal_ativacao]
