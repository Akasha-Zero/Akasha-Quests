    deps: [altar_tier4, fragmento_sangue_fraco]
    icon: AWWayofTime:masterBloodOrb
    desc: |
      Os fragmentos já fizeram parte de uma Rede de Almas — então por que não reconstruir um
      orbe inteiro com eles? Um §eFragmento de Sangue Fraco§r no altar de Tier 4 pede
      §e40 000 LP§r.

      O §eOrbe Mestre§r leva a Rede a §e1 000 000 LP§r. Ele também zera o custo extra dos
      upgrades da Armadura Vinculada e multiplica fragmentos (Orbe Mestre + fragmento + Lousa
      Imbuída = 5 fragmentos).
    tasks:
      - get: AWWayofTime:masterBloodOrb
    rewards:
      - xp: 6
      - choice: [AWWayofTime:weakBloodShard x2, AWWayofTime:demonicSlate x1, minecraft:diamond x4]

  - id: tinta_crepusculo
    title: "Ferramenta de Inscrição: Crepúsculo"
    type: normal
    deps: [altar_tier4]
    icon: AWWayofTime:duskScribeTool
    desc: |
      A tinta escura que o Tier 3 não conseguia fazer: um §eBloco de Carvão§r no altar de
      Tier 4 (2000 LP). Rituais grandes (Poço do Sofrimento, Colheita, Elipsoide,
      Evaporação...) usam pedras de §eCrepúsculo§r.
    tasks:
      - get: AWWayofTime:duskScribeTool
    rewards:
      - xp: 3
      - item: minecraft:coal_block x2

  - id: adivinho_crepusculo
    title: "Adivinho do Crepúsculo"
    type: optional
    deps: [tinta_crepusculo, adivinho_ritual]
    icon: AWWayofTime:itemRitualDiviner:1
    desc: |
      Adivinho Ritual + 2 tintas do Crepúsculo + 2 Lousas Demoníacas = um Adivinho que
      também monta rituais com pedras de Crepúsculo.
    tasks:
      - get: AWWayofTime:itemRitualDiviner:1
    rewards:
      - loot: incomum

  - id: foco_teleposicao
    title: "Foco de Teleposição"
    type: normal
    deps: [altar_tier4]
    icon: AWWayofTime:telepositionFocus
    desc: |
      Uma pérola do Ender no altar de Tier 4 (2000 LP) vira o §eFoco de Teleposição§r. Ele é o
      cérebro do Teleposer. O Foco Aprimorado (altar, 10 000 LP) move uma área 3×3×3; com um
      Fragmento de Sangue Fraco vira Reforçado (5×5×5); com um Fragmento Demoníaco, Demoníaco.
    tasks:
      - get: AWWayofTime:telepositionFocus
    rewards:
      - xp: 3
      - item: minecraft:ender_pearl x4

  - id: teleposer
    title: "Teleposer"
    type: normal
    deps: [foco_teleposicao]
    icon: AWWayofTime:blockTeleposer
    desc: |
      Ouro, 2 pérolas do Ender e um Foco de Teleposição. Para usar: vincule um foco a um
      Teleposer A (clique nele com o foco), coloque o foco no Teleposer B e dê um sinal de
      redstone em B. Tudo que estiver acima de A troca de lugar com o que estiver acima de B —
      jogadores, mobs e §eaté blocos com conteúdo§r. Custo depende do volume e da distância;
      criaturas não atravessam dimensões.
    tasks:
      - get: AWWayofTime:blockTeleposer x2
    rewards:
      - xp: 3
      - item: minecraft:gold_ingot x8

  - id: sigilo_pressa
    title: "Sigilo da Pressa"
    type: normal
    deps: [orbe_mestre]
    icon: AWWayofTime:sigilOfHaste
    desc: |
      Biscoitos, açúcar, Lousa Demoníaca, obsidiana e Orbe Mestre. Ativo, você corre mais e
      pula mais alto — e acumula com poções de velocidade e salto! (250 LP por intervalo.)
    tasks:
      - get: AWWayofTime:sigilOfHaste
    rewards:
      - xp: 3
      - item: minecraft:cookie x16

  - id: sigilo_redemoinho
    title: "Sigilo do Redemoinho"
    type: normal
    deps: [orbe_mestre, sigilo_ar]
    icon: AWWayofTime:sigilOfWind
    desc: |
      Penas, 2 lágrimas de Ghast, o Sigilo do Ar, Lousa Demoníaca e Orbe Mestre. Cria uma bolha
      de vento que desvia muitos projéteis. Não pega todos — e desvia os seus também!
    tasks:
      - get: AWWayofTime:sigilOfWind
    rewards:
      - xp: 3
      - item: minecraft:ghast_tear x1

  - id: sigilo_compressao
    title: "Sigilo da Compressão"
    type: normal
    deps: [orbe_mestre]
    icon: AWWayofTime:itemCompressionSigil
    desc: |
      Pistões, bancadas, Lousa Demoníaca, obsidiana e Orbe Mestre. Ativo, compacta seu
      inventário em blocos (redstone → bloco de redstone, etc.). Pedregulho só é compactado
      se você tiver mais de um pack. Adeus, inventário lotado!
    tasks:
      - get: AWWayofTime:itemCompressionSigil
    rewards:
      - xp: 3
      - item: minecraft:piston x2

  - id: sigilo_ender
    title: "Sigilo da Ruptura do Ender"
    type: normal
    deps: [orbe_mestre, fragmento_sangue_fraco]
    icon: AWWayofTime:sigilOfEnderSeverance
    desc: |
      Pérolas e olhos do Ender, Fragmento de Sangue Fraco, Lousa Demoníaca e Orbe Mestre.
      Impede que Endermen (e muitas outras coisas, inclusive pérolas) se teleportem perto de
      você. A vingança de Tiberius contra os Endermen fujões!
    tasks:
      - get: AWWayofTime:sigilOfEnderSeverance
    rewards:
      - xp: 3
      - item: minecraft:ender_pearl x4

  - id: sigilo_supressao
    title: "Sigilo da Supressão"
    type: normal
    deps: [orbe_mestre, teleposer, sigilo_vazio]
    icon: AWWayofTime:sigilOfSupression
    desc: |
      Baldes de água e lava, o Sigilo do Vazio, um Teleposer e o Orbe Mestre. Cria uma bolha
      sem líquidos em volta de você e devolve tudo quando você sai. Passeie no fundo do lago!
    tasks:
      - get: AWWayofTime:sigilOfSupression
    rewards:
      - xp: 3
      - item: minecraft:water_bucket x2

  - id: runa_orbe
    title: "Runa do Orbe"
    type: normal
    deps: [orbe_mestre]
    icon: AWWayofTime:AlchemicalWizardrybloodRune:3
    desc: |
      Pedra, Orbe Fraco, 2 Lousas Demoníacas e §eOrbe Mestre§r. Cada §eRuna do Orbe§r
      aumenta em §e4%§r (aditivo) o teto de LP do orbe colocado no altar. Com muitas runas, o
      Orbe Mestre enche bem além de 1 milhão!
    tasks:
      - get: AWWayofTime:AlchemicalWizardrybloodRune:3
    rewards:
      - xp: 3
      - item: AWWayofTime:demonicSlate x1

  - id: runa_capacidade_superior
    title: "Runa da Capacidade Superior"
    type: optional
    deps: [orbe_mestre, runa_capacidade]
    icon: AWWayofTime:AlchemicalWizardrybloodRune:4
    desc: |
      Obsidiana, baldes, Runa da Capacidade Aumentada, Lousa Demoníaca e Orbe Mestre. Cada
      uma multiplica a capacidade base em §e×1,14§r — com muitas runas supera as comuns.
    tasks:
      - get: AWWayofTime:AlchemicalWizardrybloodRune:4
    rewards:
      - loot: incomum

  - id: chave_vinculo
    title: "Chave do Vínculo"
    type: optional
    deps: [fragmento_sangue_fraco]
    icon: AWWayofTime:itemKeyOfDiablo
    desc: |
      Ouro, diamante e Fragmentos de Sangue Fracos. Clique com ela para definir o dono e
      entregue a um amigo: ela vincula o primeiro item sem dono do inventário dele à SUA
      Rede. Perfeito para equipar a sua turma!
    tasks:
      - get: AWWayofTime:itemKeyOfDiablo
    rewards:
      - loot: incomum

  # --- ARMADURA VINCULADA ---
  - id: soquete_vazio
    title: "Soquete Vazio e Preenchido"
    type: normal
    deps: [fragmento_sangue_fraco, altar_tier3]
    icon: AWWayofTime:bloodSocket
    desc: |
      O molde da armadura de demônio. §eSoquete Vazio§r = vidro, diamante e Fragmentos de
      Sangue Fracos. No altar de Tier 3 com §e30 000 LP§r ele vira §eSoquete Preenchido§r.

      Uma armadura completa pede MUITOS soquetes (o formato da peça). Comece com §e8§r.
    tasks:
      - get: AWWayofTime:bloodSocket x8
    rewards:
      - xp: 3
      - item: minecraft:diamond x2

  - id: forja_alma
    title: "Forja de Armadura da Alma"
    type: main
    deps: [soquete_vazio, orbe_mago]
    icon: AWWayofTime:armourForge
    desc: |
      Pedra, 4 Soquetes Preenchidos e Orbe de Mago. Para criar uma peça: coloque os Soquetes
      Preenchidos no chão com o §eformato da peça§r (como na bancada: capacete, peitoral...),
      a Forja ocupando um dos espaços, e clique direito na Forja.

      Antes de forjar, você pode clicar nos soquetes com §esigilos§r (efeito), §eFragmentos de
      Sangue§r (espaço de upgrade) e um §eorbe§r (reduz o custo). Mostre a Forja!
    tasks:
      - get: AWWayofTime:armourForge
    rewards:
      - xp: 6
      - choice: [AWWayofTime:bloodSocket x4, minecraft:diamond x4, AWWayofTime:weakBloodShard x4]

  - id: armadura_vinculada
    title: "Armadura Vinculada"
    type: milestone
    deps: [forja_alma]
    icon: AWWayofTime:boundPlate
    banner: "Armadura Vinculada"
    subtitle: "Um demônio por peça"
    desc: |
      Capacete, Peitoral, Calças e Botas Vinculados! Vincule cada peça a você: ela se
      repara puxando LP da sua Rede.

      Segundo o diário do Arquiteto, a armadura absorve cerca de 90% do dano comum e 80% do
      mágico, mas §cnão aceita encantamentos§r. Sigilos embutidos viram efeitos passivos
      (Sigilo da Água = respirar embaixo d'água, Minerador Veloz sempre ativo...). Para
      desligar os efeitos, use o §eInibidor de Armadura§r.
    tasks:
      - get: [AWWayofTime:boundHelmet, AWWayofTime:boundPlate, AWWayofTime:boundLeggings, AWWayofTime:boundBoots]
    rewards:
      - xp: 10
      - kit: {name: "Kit do Cavaleiro Rubro", items: [AWWayofTime:bloodSocket x4, AWWayofTime:weakBloodShard x4, minecraft:golden_apple x4, minecraft:cooked_beef x32]}
      - loot: raro

  - id: inibidor_armadura
    title: "Inibidor de Armadura"
    type: optional
    deps: [armadura_vinculada]
    icon: AWWayofTime:armourInhibitor
    desc: |
      Ouro e um Fragmento de Sangue Fraco. Ativo, suprime todos os efeitos especiais da
      Armadura Vinculada. É tudo-ou-nada, mas salva a sua Rede em dias tranquilos.
    tasks:
      - get: AWWayofTime:armourInhibitor
    rewards:
      - loot: incomum

  - id: armadura_sanguinea
    title: "Armadura Sanguínea (Thaumcraft)"
    type: optional
    deps: [ritual_vinculo]
    icon: AWWayofTime:sanguineRobe
    desc: |
      Uma ponte com o Thaumcraft! No Ritual do Vínculo, os §eÓculos da Revelação§r e as peças
      de §earmadura de Thaumium§r viram §eArmadura Sanguínea§r: proteção de diamante e um
      pequeno desconto de Vis. Ela também pode ser embutida (peça igual com peça igual) na
      Armadura Vinculada — o Capacete Sanguíneo dá visão de nodos ao capacete vinculado.
    tasks:
      - one_of: [AWWayofTime:sanguineHelmet, AWWayofTime:sanguineRobe, AWWayofTime:sanguinePants, AWWayofTime:sanguineBoots]
    rewards:
      - loot: incomum

  # --- INCENSO ---
  - id: cadinho_incenso
    title: "Cadinho de Incenso"
    type: normal
    deps: [orbe_fraco]
    icon: AWWayofTime:blockCrucible
    desc: |
      Uma forma (perigosa) de sangrar muito mais. O §eCadinho de Incenso§r (ferro, lajes de
      pedra e pedra) fica perto do altar; coloque incenso nele com clique direito.

      Com incenso aceso, cada uso da faca drena §ctoda a sua vida menos os últimos 10%§r de
      uma vez, rendendo muito mais LP — e deixa você com Desgaste da Alma por um tempo,
      sem poder sacrificar. Dura cerca de 10 sacrifícios.
    tasks:
      - get: AWWayofTime:blockCrucible
    rewards:
      - xp: 2
      - item: minecraft:stone_slab x8

  - id: incenso_cinza
    title: "Cinza de Madeira"
    type: normal
    deps: [cadinho_incenso]
    icon: AWWayofTime:bloodMagicIncenseItem
    desc: |
      8 toras em volta de um carvão vegetal = §eCinza de Madeira§r, o primeiro incenso
      (+40% de LP quando totalmente carregado). Também é a base dos incensos superiores.
    tasks:
      - get: AWWayofTime:bloodMagicIncenseItem x4
    rewards:
      - xp: 2
      - item: minecraft:log x16

  - id: incenso_byrrus
    title: "Byrrus"
    type: normal
    deps: [incenso_cinza]
    icon: AWWayofTime:bloodMagicIncenseItem:1
    desc: |
      Cinza de Madeira, 2 corantes vermelhos, redstone, 2 folhas e o Orbe Fraco = §eByrrus§r
      (+80%). Cada incenso exige o anterior aceso em outro cadinho.
    tasks:
      - get: AWWayofTime:bloodMagicIncenseItem:1
    rewards:
      - xp: 2
      - item: minecraft:redstone x8

  - id: incenso_livens
    title: "Livens"
    type: normal
    deps: [incenso_byrrus, orbe_aprendiz]
    icon: AWWayofTime:bloodMagicIncenseItem:2
    desc: |
      Cinza, 2 corantes azuis, 2 pepitas de ouro, pó de pedra luminosa, 2 linhas e Orbe de
      Aprendiz = §eLivens§r (+150%).
    tasks:
      - get: AWWayofTime:bloodMagicIncenseItem:2
    rewards:
      - xp: 2
      - item: minecraft:string x8

  - id: incenso_viridis
    title: "Viridis"
    type: normal
    deps: [incenso_livens]
    icon: AWWayofTime:bloodMagicIncenseItem:3
    desc: |
      Cinza, 2 corantes verdes, areia das almas, pólvora, olho de aranha fermentado, Lousa em
      Branco e Orbe de Aprendiz = §eViridis§r (+240%).
    tasks:
      - get: AWWayofTime:bloodMagicIncenseItem:3
    rewards:
      - xp: 2
      - item: minecraft:soul_sand x4

  - id: incenso_purpura
    title: "Purpura"
    type: normal
    deps: [incenso_viridis, orbe_mago, osso_fraturado]
    icon: AWWayofTime:bloodMagicIncenseItem:4
    desc: |
      Cinza, 2 corantes roxos, quartzo, verruga do Nether, pó de blaze, Osso Fraturado, Lousa
      Reforçada e Orbe de Mago = §ePurpura§r (+350%). O incenso máximo: cada corte vale uma
      fortuna. §cSó sacrifique em segurança total!§r
    tasks:
      - get: AWWayofTime:bloodMagicIncenseItem:4
    rewards:
      - xp: 3
      - item: minecraft:blaze_powder x4

  # --- ELEMENTAIS E DEMÔNIOS MENORES ---
  - id: pedestal_arcano
    title: "Pedestal e Plinto Arcanos"
    type: normal
    deps: [fragmento_sangue_fraco]
    icon: AWWayofTime:blockPlinth
    desc: |
      Para chamar demônios, Bella usava um Plinto. §ePedestal Arcano§r = obsidiana e um
      Fragmento de Sangue Fraco. §ePlinto Arcano§r = blocos de ferro e um Pedestal.

      Faça §e1 Plinto e 6 Pedestais§r: os pedestais ficam no anel externo de uma área 5×5
      em volta do Plinto, formando um hexágono.
    tasks:
      - get: [AWWayofTime:blockPlinth, AWWayofTime:blockPedestal x6]
    rewards:
      - xp: 3
      - item: minecraft:iron_block x2

  - id: info_convocacao
    title: "Convocando Elementais"
    type: info
    deps: [pedestal_arcano, reagentes_completos]
    icon: AWWayofTime:blockPedestal
    desc: |
      §cIsto invoca monstros de verdade. Venha armado e com armadura!§r

      Coloque um §eOrbe Mestre (ou melhor) vinculado§r no Plinto e o §emesmo reagente§r em
      cada um dos 6 Pedestais. Raios caem em cada pedestal e um Elemental aparece:
      §e• 6 Aether:§r de Ar §e• 6 Aquasalus:§r de Água §e• 6 Terrae:§r de Terra
      §e• 6 Incendium:§r de Fogo §e• 6 Tenebrae:§r de Sombra §e• 6 Sanctus:§r Sagrado

      Elementais voam, têm 100 de vida e atacam à distância. Outras combinações chamam
      demônios diferentes (veja o NEI no Plinto).
    tasks:
      - check
    rewards:
      - xp: 2

  - id: fragmento_demoniaco
    title: "Fragmento de Sangue Demoníaco"
    type: boss
    deps: [info_convocacao, orbe_mestre]
    icon: AWWayofTime:demonBloodShard
    banner: "Caçador de Elementais"
    subtitle: "Sangue de demônio"
    desc: |
      Os Elementais não precisam morrer para a Lâmina Vinculada: §eFragmentos de Sangue
      Demoníacos§r caem com certa chance (Pilhagem ajuda bastante).

      Junte §e4 fragmentos§r. Eles fazem o §eOrbe de Arquimago§r, o Cristal de Ativação
      Desperto e o Foco de Teleposição Demoníaco.

      §cDicas de combate:§r lute em área aberta, use a Armadura Vinculada e leve comida. Os
      elementais de fogo incendeiam tudo — não convoque dentro de casa de madeira!
    tasks:
      - get: AWWayofTime:demonBloodShard x4
    rewards:
      - xp: 10
      - loot: raro

  - id: elementais_derrotados
    title: "Seis Elementos"
    type: optional
    deps: [fragmento_demoniaco]
    icon: AWWayofTime:demonPlacer
    desc: |
      Para quem gosta de colecionar inimigos: derrote um §eElemental de Fogo§r e um
      §eElemental de Sombra§r (os mais perigosos). Os outros quatro ficam por sua conta!
    tasks:
      - kill: {entity: "AWWayofTime.FireElemental", count: 1}
      - kill: {entity: "AWWayofTime.ShadeElemental", count: 1}
    rewards:
      - loot: incomum

  # --- SISTEMA DE FEITIÇOS COMPLEXOS ---
  - id: cristal_feitico
    title: "Cristal de Feitiço Complexo"
    type: normal
    deps: [cristal_nao_vinculado, fragmento_sangue_fraco, mesa_quimica]
    icon: AWWayofTime:itemComplexSpellCrystal
    desc: |
      Os feitiços complexos de Demir são máquinas de blocos ligados por Condutores. O
      §eCristal de Feitiço Complexo§r (Cristal Não Vinculado, 2 Fragmentos Fracos, diamante e
      ouro na Mesa Alquímica) é a varinha: vincule-o a um Paradigma e conjure.
    tasks:
      - get: AWWayofTime:itemComplexSpellCrystal
    rewards:
      - xp: 3
      - item: minecraft:gold_ingot x4

  - id: info_feiticos
    title: "Feitiços Complexos"
    type: info
    deps: [cristal_feitico]
    icon: AWWayofTime:blockConduit
    desc: |
      Um feitiço é uma "linha de montagem" de blocos, ligados por §eCondutores de Feitiço§r
      na ordem certa:
      §e1. Paradigma§r (forma): Gerador de Partículas (projétil), Auto-Aumentador (em si),
      Agregador Corpo-a-Corpo, Forjador de Ferramentas.
      §e2. Efeito§r (elemento): Cadinho de Fogo, Fabricante de Gelo, Gerador de Vento,
      Moldador de Terra.
      §e3. Modificador:§r Padrão, Ofensivo, Defensivo, Ambiental.
      §e4. Aprimoramentos:§r Potencializadores (poder), Amortecedores (custo), Aumentadores
      (potência), em cinco níveis.

      Clique no Paradigma com o Cristal para vincular. Experimente combinações!
    tasks:
      - check
    rewards:
      - xp: 1

  - id: nucleos_feitico
    title: "Núcleos e Cabos"
    type: normal
    deps: [info_feiticos, reagentes_completos]
    icon: AWWayofTime:bloodMagicBaseItems:1
    desc: |
      Os blocos de feitiço são montados com peças: §eNúcleo Vazio§r (ouro, ferro, vidro,
      Catalisador Simples), §eCabo Magicales§r, §eCabos de Entrada/Saída§r, §ePlaca de
      Paradigma§r e §eSuportes§r. Os núcleos especializados levam reagentes e o Orbe de Mago
      (veja o NEI). Mostre um Núcleo Vazio e um Cabo Magicales.
    tasks:
      - get: [AWWayofTime:bloodMagicBaseItems:1, AWWayofTime:bloodMagicBaseItems:2]
    rewards:
      - xp: 3
      - item: AWWayofTime:simpleCatalyst x4

  - id: paradigma
    title: "Paradigma de Feitiço"
    type: normal
    deps: [nucleos_feitico]
    icon: AWWayofTime:AlchemicalWizardrytile.blockSpellParadigm
    desc: |
      O começo do feitiço. Qualquer um dos quatro Paradigmas serve: Gerador de Partículas
      (projétil), Auto-Aumentador, Agregador Corpo-a-Corpo ou Forjador de Ferramentas (que
      cria a Maça Dinâmica!).
    tasks:
      - one_of: [AWWayofTime:AlchemicalWizardrytile.blockSpellParadigm, AWWayofTime:AlchemicalWizardrytile.blockSpellParadigm:1, AWWayofTime:AlchemicalWizardrytile.blockSpellParadigm:2, AWWayofTime:AlchemicalWizardrytile.blockSpellParadigm:3]
    rewards:
      - xp: 3
      - item: minecraft:gold_ingot x4

  - id: efeito_feitico
    title: "Efeito de Feitiço"
    type: normal
    deps: [nucleos_feitico]
    icon: AWWayofTime:AlchemicalWizardrytile.blockSpellEffect
    desc: |
      O elemento do feitiço: Cadinho de Fogo (Incendium), Fabricante de Gelo (Crystallos),
      Gerador de Vento (Aether) ou Moldador de Terra (Terrae). Cada núcleo elemental usa
      diamante, Fragmento Fraco e Orbe de Mago.
    tasks:
      - one_of: [AWWayofTime:AlchemicalWizardrytile.blockSpellEffect, AWWayofTime:AlchemicalWizardrytile.blockSpellEffect:1, AWWayofTime:AlchemicalWizardrytile.blockSpellEffect:2, AWWayofTime:AlchemicalWizardrytile.blockSpellEffect:3]
    rewards:
      - xp: 3
      - item: minecraft:diamond x1

  - id: modificador_feitico
    title: "Modificador de Feitiço"
    type: normal
    deps: [nucleos_feitico, reagentes_avancados]
    icon: AWWayofTime:AlchemicalWizardrytile.blockSpellModifier
    desc: |
      O "como": Padrão (Catalisador Fortalecido), Ofensivo (Offensa), Defensivo (Praesidium)
      ou Ambiental (Orbis Terrae). Mude o modificador e o mesmo elemento faz coisas
      completamente diferentes!
    tasks:
      - one_of: [AWWayofTime:AlchemicalWizardrytile.blockSpellModifier, AWWayofTime:AlchemicalWizardrytile.blockSpellModifier:1, AWWayofTime:AlchemicalWizardrytile.blockSpellModifier:2, AWWayofTime:AlchemicalWizardrytile.blockSpellModifier:3]
    rewards:
