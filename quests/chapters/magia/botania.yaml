    at: [27, 1]
    deps: [terrasteel]
    desc: |
      Parece desperdício, mas não é! Uma Barra de Terrasteel na bancada vira nove §ePepitas de Terrasteel§r.
      O Núcleo do Portal Élfico pede três e cada Pilão da Natureza pede quatro, então planeje com carinho, Herói. Confira os totais que você precisa no NEI (R/U) antes de desmontar tudo!
    tasks:
      - get: "Botania:manaResource:18 x9"
    rewards:
      - xp: 3

  # ------------------------------------------------------------------ Lentes de Mana
  - id: lente_mana
    title: "Lentes de Mana"
    at: [20, 5]
    deps: [manasteel]
    desc: |
      Quatro Barras de Manasteel em volta de um Painel de Vidro: a §eLente de Mana§r básica. Sozinha
      ela não faz nada além de mudar a cor da rajada (pinte-a na bancada com corante, ou some uma
      Pérola de Mana para a lente arco-íris), mas é a base de todas as outras.

      Clique com a lente num dispersor para encaixá-la. Duas lentes + uma Bola de Slime na bancada
      viram uma lente composta, com os dois efeitos (nem toda combinação funciona).
    tasks:
      - craft: Botania:lens
    rewards:
      - xp: 2
      - item: "Botania:manaResource x2"

  - id: lente_velocidade
    title: "Lente: Velocidade"
    at: [21, 5]
    deps: [lente_mana]
    deps_hidden: [runa_ar]
    desc: |
      Quer rajadas mais rápidas? Lente + §eRuna do Ar§r dá a Lente: Velocidade. A rajada viaja muito mais rápido, mas carrega um pouco menos de Mana e a perde mais cedo.
      É boa para distâncias curtas com muito tráfego. Faça a sua, Herói, e veja a diferença!
    tasks:
      - get: Botania:lens:1
    rewards:
      - xp: 2

  - id: lente_potencia
    title: "Lente: Potência"
    at: [22, 5]
    deps: [lente_mana]
    deps_hidden: [runa_fogo]
    desc: |
      Mais Mana por rajada, Herói! Lente + §eRuna do Fogo§r dá a Lente: Potência. Cada rajada carrega o dobro de Mana, porém viaja mais devagar e, quando começa a perder Mana, perde rápido.
      É perfeita para um dispersor colado no alvo. Faça a sua e aproveite!
    tasks:
      - get: Botania:lens:2
    rewards:
      - xp: 2

  - id: lente_resistencia
    title: "Lente: Resistência"
    at: [23, 5]
    deps: [lente_mana]
    deps_hidden: [runa_terra]
    desc: |
      Para linhas longas, esta é a escolha! Lente + §eRuna da Terra§r dá a Lente: Resistência. A rajada aguenta bem mais tempo antes de começar a perder Mana, ao custo de ficar um pouco mais lenta.
      Monte a sua, Herói, e deixe seu sistema alcançar longe!
    tasks:
      - get: Botania:lens:3
    rewards:
      - xp: 2

  - id: lente_eficiencia
    title: "Lente: Eficiência"
    at: [24, 5]
    deps: [lente_mana]
    deps_hidden: [runa_agua]
    desc: |
      Lente + §eRuna da Água§r dá a Lente: Eficiência. A rajada começa a perder Mana mais cedo, mas perde num ritmo bem mais lento.
      Compare com a de Resistência no seu caso específico, Herói. Cada montagem tem a sua lente ideal. Faça a sua e teste!
    tasks:
      - get: Botania:lens:4
    rewards:
      - xp: 2

  - id: lente_ricochete
    title: "Lente: Ricochete"
    at: [25, 5]
    deps: [lente_mana]
    deps_hidden: [runa_verao]
    desc: |
      Quer rajadas que não desistem? Lente + §eRuna do Verão§r dá a Lente: Ricochete. Em vez de sumir ao bater num bloco, a rajada quica e continua.
      Dá para fazer caminhos em zigue-zague bem divertidos. Faça a sua e brinque com os ângulos, Herói!
    tasks:
      - get: Botania:lens:5
    rewards:
      - xp: 2

  - id: lente_gravidade
    title: "Lente: Gravidade"
    at: [26, 5]
    deps: [lente_mana]
    deps_hidden: [runa_inverno]
    desc: |
      Fazendo a Mana voar em arco! Lente + §eRuna do Inverno§r dá a Lente: Gravidade. A rajada passa a sofrer gravidade e voa em arco, o que é útil para passar por cima de obstáculos, e ainda demora um pouco mais para perder Mana.
      Monte a sua, Herói, e faça seus caminhos darem a volta por cima!
    tasks:
      - get: Botania:lens:6
    rewards:
      - xp: 2

  - id: lente_escavacao
    title: "Lente: Escavação"
    at: [27, 5]
    deps: [lente_mana]
    desc: |
      Uma mineradora improvisada, Herói! A Lente: Escavação leva Lente + §ePistão, 2 Lápis-lazúli e Redstone§r. A rajada quebra os blocos que toca, gastando a própria Mana (até nível de diamante, pela config do pack).
      Num Dispersor por Redstone, vira uma mineradora improvisada. Que tal testar?
    tasks:
      - get: Botania:lens:7
    rewards:
      - xp: 2
      - item: "minecraft:piston x2"

  - id: lente_dano
    title: "Lente: Dano"
    at: [21, 6]
    deps: [lente_mana]
    deps_hidden: [runa_ira]
    desc: |
      Uma torre de defesa botânica, se você quiser! Lente + §eRuna da Ira§r dá a Lente: Dano. A rajada fere qualquer criatura viva que atravessar, gastando Mana.
      Monte a sua e instale perto de onde os monstros costumam aparecer, Herói. Só cuidado com onde você passa!
    tasks:
      - get: Botania:lens:8
    rewards:
      - xp: 2

  - id: lente_fantasma
    title: "Lente: Fantasma"
    at: [22, 6]
    deps: [lente_mana]
    deps_hidden: [plataforma_abstrusa]
    desc: |
      Paredes não são mais problema! Lente + §ePlataforma Abstrusa§r dá a Lente: Fantasma. A rajada atravessa blocos, mas perde Mana mais cedo.
      Perfeita para chegar a lugares apertados sem abrir buracos na construção. Monte a sua, Herói, e deixe a rajada passar!
    tasks:
      - get: Botania:lens:9
    rewards:
      - xp: 2

  - id: lente_magnetismo
    title: "Lente: Magnetismo"
    at: [23, 6]
    deps: [lente_mana]
    desc: |
      Quando a mira não é perfeita, ela dá uma mãozinha! Lente + §eBarra de Ferro e Barra de Ouro§r (sem formato) dá a Lente: Magnetismo. A rajada é atraída por blocos que recebem Mana por perto.
      Ela também é ingrediente do Anel Magnético. Faça a sua, Herói, e erre menos!
    tasks:
      - get: Botania:lens:10
    rewards:
      - xp: 2
      - item: "minecraft:iron_ingot x4"

  - id: lente_entropia
    title: "Lente: Entropia"
    at: [24, 6]
    deps: [lente_mana]
    deps_hidden: [runa_inveja]
    desc: |
      Pirotecnia perigosa! Lente + §eRuna da Inveja§r dá a Lente: Entropia. Ao bater em algo que não recebe Mana, a rajada §cexplode§r.
      Mire longe da base, Herói, e cuide dos seus bens. Se tiver dúvida, confira a receita no NEI (R/U). Divirta-se com responsabilidade!
    tasks:
      - get: Botania:lens:11
    rewards:
      - xp: 2

  - id: lente_influencia
    title: "Lente: Influência"
    at: [25, 6]
    deps: [lente_mana]
    deps_hidden: [prismarinho, runa_ar]
    desc: |
      Uma esteira invisível, Herói! Lente + §eRuna do Ar + 7 Fragmentos de Prismarinho§r dá a Lente: Influência. A rajada arrasta itens soltos, orbes de XP e blocos caindo na mesma direção em que viaja.
      Monte a sua e deixe o transporte por conta da Mana!
    tasks:
      - get: Botania:lens:12
    rewards:
      - xp: 2

  - id: lente_peso
    title: "Lente: Peso"
    at: [26, 6]
    deps: [lente_mana]
    deps_hidden: [prismarinho, runa_agua]
    desc: |
      Pontes que desabam? Sim! Lente + §eRuna da Água + 7 Fragmentos de Prismarinho§r dá a Lente: Peso. Blocos atingidos sem nada embaixo caem como areia (até nível de ferro, pela config).
      Cuidado onde mira, Herói. Monte a sua e faça um desabamento controlado!
    tasks:
      - get: Botania:lens:13
    rewards:
      - xp: 2

  - id: lente_aquecer
    title: "Lente: Aquecer"
    at: [27, 6]
    deps: [lente_mana]
    desc: |
      Fogo à distância, Herói! Lente + §eCarga de Fogo§r dá a Lente: Aquecer. A rajada põe fogo no bloco que atinge, e pode acender ou fechar Portais do Nether. Não queima criaturas.
      Também acende Bandejas de Incenso. Monte a sua e acenda tudo sem sair do lugar!
    tasks:
      - get: Botania:lens:15
    rewards:
      - xp: 2
      - item: "minecraft:fire_charge x4"

  - id: lente_forca
    title: "Lente: Força"
    at: [21, 7]
    deps: [lente_mana]
    deps_hidden: [transmissor_mana]
    desc: |
      Engenhocas sem uma gota de redstone! Lente + §eTransmissor de Mana§r (o pistão infundido) dá a Lente: Força. A rajada age como um pistão, empurrando o bloco que atinge.
      Monte a sua, Herói, e teste em portas e armadilhas. A criatividade é o limite!
    tasks:
      - get: Botania:lens:16
    rewards:
      - xp: 2

  - id: lente_clarao
    title: "Lente: Clarão"
    at: [22, 7]
    deps: [lente_mana]
    desc: |
      Iluminação à distância! Lente + §e4 Pedras Luminosas e 4 Cargas de Fogo§r dá a Lente: Clarão. Ao bater num bloco, a rajada deixa uma chama decorativa da cor da rajada, que ilumina. Bater numa chama dessas a apaga.
      Monte a sua, Herói, e ilumine cada canto escuro!
    tasks:
      - get: Botania:lens:17
    rewards:
      - xp: 2

  - id: lente_teleporte
    title: "Lente: Teleporte"
    at: [23, 7]
    deps: [lente_mana]
    deps_hidden: [po_fada]
    desc: |
      Uma lente élfica, Herói! Lente + §ePó de Fada§r dá a Lente: Teleporte. Uma rajada que bate num Transmissor de Mana se teletransporta para o destino dele, mantendo o embalo.
      Combinada com a Lente de Escavação, ela leva os blocos quebrados em vez de derrubá-los. Que invenção!
    tasks:
      - get: Botania:lens:18
    rewards:
      - xp: 3

  - id: lente_redirecional
    title: "Lente: Redirecional"
    at: [24, 7]
    deps: [lente_mana]
    deps_hidden: [elementium]
    desc: |
      Redes que se alinham sozinhas! Lente + §eMadeira-viva e Elementium§r dá a Lente: Redirecional. Ela só funciona disparada de um dispersor: quando a rajada atinge outro dispersor, ele passa a mirar no dispersor que atirou.
      Monte a sua e economize na mira, Herói!
    tasks:
      - get: Botania:lens:19
    rewards:
      - xp: 3

  - id: lente_celebracao
    title: "Lente: Celebração"
    at: [25, 7]
    deps: [lente_mana]
    deps_hidden: [elementium]
    desc: |
      Festa no jardim, Herói! Lente + §eFogo de Artifício e Elementium§r dá a Lente: Celebração. Como a de Entropia, mas em vez de explodir solta um fogo de artifício da cor da rajada.
      Monte a sua e comemore suas conquistas com estilo!
    tasks:
      - get: Botania:lens:20
    rewards:
      - xp: 3
      - item: "minecraft:fireworks x8"

  - id: lente_labareda
    title: "Lente: Labareda"
    at: [26, 7]
    deps: [lente_mana]
    deps_hidden: [elementium, vidro_elfico]
    desc: |
      Pura decoração, e linda! Lente + §eVidro Élfico e Elementium§r dá a Lente: Labareda. O dispersor para de disparar rajadas e passa a soltar um jato contínuo de partículas da cor da lente.
      Monte a sua, Herói, e deixe sua base com um visual de encantamento. Eu adoro!
    tasks:
      - get: Botania:lens:21
    rewards:
      - xp: 3

  - id: lente_paintslinger
    title: "Lente: Paintslinger"
    at: [27, 7]
    deps: [lente_mana]
    deps_hidden: [elementium]
    desc: |
      Pintando o mundo com Mana! Lente + §e2 Lãs e 2 Elementium§r dá a Lente: Paintslinger; ela precisa ser tingida para funcionar.
      Ao atingir um bloco colorível (lã, argila tingida, vidro…), pinta todos os blocos conectados iguais com a cor da rajada. Funciona até em ovelhas! Confira no NEI (R/U) e divirta-se, Herói!
    tasks:
      - get: Botania:lens:14
    rewards:
      - xp: 3
      - item: "minecraft:wool x16"

  # ------------------------------------------------------------------ Aparatos naturais
  - id: info_aparatos
    title: "Aparatos Naturais"
    type: info
    at: [9, 6]
    deps: [rocha_viva]
    deps_hidden: [poco_mana]
    desc: |
      Além de flores, a Botânica tem uma oficina inteira de §eAparatos Naturais§r: catalisadores de
      alquimia, plataformas fantasmas, tambores, caixotes que fabricam sozinhos, um encantador
      gigante e muito mais. Esta parte do mapa reúne esses brinquedos.

      Quase todos funcionam com Mana chegando por um dispersor ou por fagulhas. Na dúvida, abra a
      categoria "Aparatos Naturais" da Lexica.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: catalisador_alquimico
    title: "Catalisador Alquímico"
    at: [8, 7]
    deps: [info_aparatos]
    deps_hidden: [perola_mana]
    desc: |
      Rocha-viva, Ouro, dois Suportes de Poção e uma Pérola de Mana. Colocado §eembaixo de um Poço
      de Mana§r, o §eCatalisador Alquímico§r muda as infusões do poço: Carne Podre vira Couro,
      madeiras e mudas trocam de espécie, Vara de Blaze vira Fungo do Nether, Lágrima de Ghast
      vira Pérola do Fim, Quartzo vira Prismarinho… Abra o NEI no catalisador para ver tudo.
    tasks:
      - craft: Botania:alchemyCatalyst
    rewards:
      - xp: 2
      - item: "minecraft:brewing_stand"

  - id: prismarinho
    title: "Prismarinho"
    at: [7, 8]
    deps: [catalisador_alquimico]
    desc: |
      Com o catalisador embaixo do poço, jogue §eQuartzo do Nether§r (200 de Mana cada) e receba Fragmentos de Prismarinho.
      Eles fazem blocos de Prismarinho, Lanternas do Mar, a Lente de Influência, a de Peso e o Frasco de Guelras. Junte 16, Herói, que tem muita coisa boa por vir!
    tasks:
      - get: "Botania:manaResource:10 x16"
    rewards:
      - xp: 2
      - item: "minecraft:quartz x16"

  - id: alquimia_couro
    title: "Alquimia: Couro e Pérolas"
    type: optional
    at: [8, 8]
    deps: [catalisador_alquimico]
    desc: |
      Duas conversões que salvam vidas, Herói! §eCarne Podre → Couro§r (600 de Mana) e Lágrima de Ghast → Pérola do Fim (28.000 de Mana), tudo no poço com o catalisador.
      Pegue um pouco de couro "alquímico" e nunca mais cace vaca por necessidade. Missão opcional, mas muito prática!
    tasks:
      - get: "minecraft:leather x8"
    rewards:
      - loot: comum

  - id: pedras_metamorficas
    title: "Alquimia das Pedras"
    type: optional
    at: [9, 8]
    deps: [catalisador_alquimico]
    desc: |
      Pedra jogada no poço catalisado vai ciclando entre Andesito, Basalto, Diorito e Granito (blocos do próprio Botania), cada um com versões polidas, tijolos e talhadas.
      Para os arquitetos de plantão, Herói! Missão opcional, mas capricha na construção. Confira as variações no NEI (R/U).
    tasks:
      - one_of: ["Botania:stone", "Botania:stone:1", "Botania:stone:2", "Botania:stone:3"]
    rewards:
      - loot: comum

  - id: catalisador_conjuracao
    title: "Catalizador de Conjurações"
    at: [8, 9]
    deps: [catalisador_alquimico]
    deps_hidden: [elementium, po_fada]
    desc: |
      Versão élfica do catalisador: Catalisador Alquímico, Elementium, Pó de Fada e Rocha-viva.
      Embaixo de um poço, ele faz o poço §eduplicar§r itens: Redstone, Pedra Luminosa, Quartzo,
      Carvão, Neve, Netherrack, Areia de Almas, Cascalho, Folhas e Grama Alta — cada um com seu
      custo de Mana. Mana virando recurso puro!
    tasks:
      - craft: Botania:conjurationCatalyst
    rewards:
      - xp: 3
      - item: "minecraft:redstone x16"

  - id: transmissor_mana
    title: "Transmissor de Mana"
    at: [10, 7]
    deps: [info_aparatos]
    desc: |
      Um Pistão infundido no poço (15.000 de Mana) vira o §eTransmissor de Mana§r: vincule-o a um
      bloco com a Varinha e toda força de pistão aplicada nele é repassada ao bloco vinculado.
      Dá para fazer "molduras" que andam. §cQuebre só com agachar + Varinha§r, senão ele se destrói.
    tasks:
      - get: Botania:pistonRelay
    rewards:
      - xp: 2
      - item: "minecraft:piston x2"

  - id: plataforma_abstrusa
    title: "Plataforma Abstrusa"
    at: [10, 8]
    deps: [info_aparatos]
    deps_hidden: [perola_mana]
    desc: |
      Madeira-viva em formato específico + Pérola de Mana = 2 §ePlataformas Abstrusas§r. Ela só é
      sólida para quem está em cima sem agachar; para todo o resto, é como se não existisse
      (rajadas de Mana passam direto). Clique com um bloco para camuflá-la. Portas secretas!
    tasks:
      - get: Botania:platform
    rewards:
      - xp: 2

  - id: plataforma_espectral
    title: "Plataforma Espectral"
    type: optional
    at: [10, 9]
    deps: [plataforma_abstrusa]
    deps_hidden: [po_fada]
    desc: |
      A versão élfica! Com Madeira dos Sonhos e Pó de Fada, a §ePlataforma Espectral§r faz o que nenhuma outra faz: nada colide com ela, nem você.
      É ingrediente do Prisma de Mana e do Trilho Espectral. Missão opcional, Herói, mas cheia de truques!
    tasks:
      - get: Botania:platform:1
    rewards:
      - loot: incomum

  - id: prisma_mana
    title: "Prisma de Mana"
    type: optional
    at: [11, 9]
    deps: [plataforma_espectral]
    desc: |
      Vidro, Fragmentos de Prismarinho e uma Plataforma Espectral. O §ePrisma de Mana§r não tem
      corpo físico; clique nele com uma lente e toda rajada que o atravessar ganha a cor e o
      efeito dessa lente. As quatro lentes básicas ainda estendem o alcance. Redstone desliga.
    tasks:
      - get: Botania:prism
    rewards:
      - loot: incomum

  - id: trilho_espectral
    title: "Trilho Espectral"
    type: optional
    at: [12, 9]
    deps: [plataforma_espectral]
    desc: |
      Montanha-russa fantasma! Trilho + Plataforma Espectral = §eTrilho Espectral§r. Um carrinho lançado para fora dele flutua um pouco e atravessa paredes, até cair num trilho ou bater em Madeira dos Sonhos.
      Monte um e teste o caminho, Herói. Missão opcional e divertida!
    tasks:
      - get: Botania:ghostRail
    rewards:
      - loot: incomum

  - id: encantador
    title: "Encantador de Mana"
    type: main
    at: [7, 6]
    deps: [info_aparatos]
    deps_hidden: [pilone_mana]
    desc: |
      Encantar §esem gastar os livros§r! A estrutura pede §e17 Obsidianas, 10 Flores Místicas
      (qualquer cor), 6 Pilões de Mana e um Bloco de Lápis-lazúli§r — a planta exata está na
      entrada "Encantando com Mana" da Lexica. Com tudo no lugar, clique no Bloco de Lápis com a
      Varinha e ele vira o §eEncantador de Mana§r.

      Uso: coloque o item (não encantado) no encantador, jogue os Livros Encantados no círculo e
      clique com a Varinha. Quando o círculo mágico aparecer, pode recolher os livros. Alimente com
      Mana (fagulha em cima é bem mais rápido). Só o primeiro encantamento de cada livro conta.
    tasks:
      - get: "minecraft:lapis_block"
      - check
    rewards:
      - xp: 4
      - choice: ["minecraft:obsidian x17", "minecraft:book x8", "Botania:pylon"]

  - id: caixote_inteligente
    title: "Caixote Inteligente"
    at: [12, 6]
    deps: [caixote_aberto]
    deps_hidden: [portal_alfheim]
    desc: |
      Madeira dos Sonhos e uma Bancada: o §eCaixote Inteligente§r fabrica sozinho. Os itens entram
      preenchendo a grade da esquerda para a direita, de cima para baixo; o §eReservante de
      Espaço§r (Bancada + Rocha-viva = 32) ocupa os buracos da receita. Ao completar 9 espaços ele
      ejeta o resultado — ou clique com a Varinha para fabricar o que tiver.
    tasks:
      - craft: Botania:openCrate:1
    rewards:
      - xp: 3
      - item: "Botania:manaResource:11 x32"

  - id: padroes_criacao
    title: "Padrões de Criação"
    type: optional
    at: [13, 6]
    deps: [caixote_inteligente]
    desc: |
      Automatizar receitas com buracos fica trivial! Nove §ePadrões de Criação§r (Redstone mais Reservantes) travam espaços específicos do Caixote Inteligente, como se houvesse reservantes ali.
      Clique o padrão no caixote (não é consumido). Missão opcional, Herói, mas muito esperta! Veja a receita no NEI (R/U) e aproveite a praticidade.
    tasks:
      - get: "Botania:craftPattern:*"
    rewards:
      - loot: incomum

  - id: olho_ancestrais
    title: "Olho dos Ancestrais"
    type: optional
    at: [11, 6]
    deps: [info_aparatos]
    desc: |
      Perfeito para automatizar currais, Herói! Manasteel, Rocha-viva e um Olho do Fim montam o §eOlho dos Ancestrais§r.
      Com um Comparador ao lado, ele emite sinal proporcional ao número de animais num raio de ~6 blocos (começa a contar a partir de 2). Missão opcional, mas muito prática!
    tasks:
      - craft: Botania:forestEye
    rewards:
      - loot: comum

  - id: tambor_selvagem
    title: "Tambores da Floresta"
    type: optional
    at: [11, 7]
    deps: [info_aparatos]
    deps_hidden: [sementes_pasto]
    desc: |
      Os §eTambores§r batem quando uma §erajada de Mana§r os atinge (eles não guardam Mana, então use
      um Dispersor por Redstone ou um Disparador de Mana). O §eTambor da Vida Selvagem§r (Berrante
      da Selva no meio) corta a vegetação em volta; o §eTambor do Toldo§r derruba folhas; o élfico
      §eTambor da União§r tosquia ovelhas e enche Baldes vazios colocados sob as vacas.
    tasks:
      - one_of: [Botania:forestDrum, "Botania:forestDrum:1", "Botania:forestDrum:2"]
    rewards:
      - loot: comum

  - id: ampulheta
    title: "Ampulheta Flutuante"
    type: optional
    at: [12, 7]
    deps: [info_aparatos]
    deps_hidden: [vidro_mana]
    desc: |
      Ouro, Vidro de Mana, Redstone e Manasteel. A §eAmpulheta Flutuante§r é um temporizador: dê a
      ela uma pilha de Areia (1 s por bloco), Areia Vermelha (10 s) ou Areia de Almas (1 min) e ela
      solta um pulso de redstone a cada virada. A Varinha trava/destrava; uma rajada de Mana pausa.
      Um relógio bonito para a Endoflame.
    tasks:
      - craft: Botania:hourglass
    rewards:
      - loot: comum

  - id: avatar
    title: "Avatar de Madeira-viva"
    type: optional
    at: [12, 8]
    deps: [info_aparatos]
    deps_hidden: [diamante_mana]
    desc: |
      Madeira-viva esculpida com um coração de Diamante de Mana. Sozinho, o §eAvatar§r é só uma
      estátua — mas dê a ele um §ecajado§r (clique direito) e Mana por um dispersor, e ele usa o
      cajado por você: Cajado dos Céus lança para o alto quem pular perto, Cajado dos Infernos
      cria um anel de fogo, Cajado do Manto Pleno revela minérios… Redstone desliga.
    tasks:
      - craft: Botania:avatar
    rewards:
      - loot: comum

  # ------------------------------------------------------------------ Flora Funcional
  - id: info_funcionais
    title: "Flora Funcional"
    type: info
    at: [12, -8]
    deps: [info_geradoras]
    deps_hidden: [altar_runico]
    desc: |
      As geradoras produzem; as §dflores funcionais§r trabalham. Cada uma puxa Mana do §ePoço de
      Mana mais próximo§r existente quando foi plantada (religue com a Varinha). Elas não recebem
      rajadas diretamente — sempre um poço por perto!

      Flores feitas com §eRaiz de Redstone§r podem ser ligadas/desligadas por redstone.
      Algumas têm alcance grande demais: num poço com Catalisador Alquímico elas encolhem e
      viram versões "Petite" de raio menor.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: raiz_redstone
    title: "Raiz de Redstone"
    at: [12, -9]
    deps: [info_funcionais]
    desc: |
      Muitas flores funcionais pedem Raiz de Redstone na receita, e é ela que permite controlar a flor com redstone. Pó de Redstone + Grama Alta (sem formato) = §eRaiz de Redstone§r.
      Faça várias de uma vez, Herói, porque vai ser bem usada. Confira a receita no NEI (R/U) se precisar!
    tasks:
      - get: "Botania:manaResource:6 x8"
    rewards:
      - xp: 2
      - item: "minecraft:redstone x16"

  - id: jaded_amaranthus
    title: "Jaded Amaranthus"
    at: [13, -8]
    deps: [info_funcionais]
    deps_hidden: [raiz_redstone, runa_primavera]
    desc: |
      Flores fazendo flores! A §eJaded Amaranthus§r gasta Mana para fazer brotar Flores Místicas aleatórias em todo espaço livre à sua volta.
      Receita: §ePétalas Roxa, Lima e Verde, Runa da Primavera e Raiz de Redstone§r. Fim da falta de pétalas, Herói!
    tasks:
      - {get: 'Botania:specialFlower {type:"jadedAmaranthus"}', nbt: true}
    rewards:
      - xp: 2
      - item: "minecraft:shears"

  - id: bellethorne
    title: "Bellethorne"
    at: [14, -8]
    deps: [info_funcionais]
    deps_hidden: [raiz_redstone]
    desc: |
      Uma flor malvada, Herói! A §eBellethorne§r fere aos poucos qualquer criatura viva por perto, menos jogadores. Ela é o coração de uma fazenda de mobs botânica.
      Receita: §e3 Pétalas Vermelhas, 2 Ciano e Raiz de Redstone§r. Plante com cuidado e aproveite o resultado!
    tasks:
      - {get: 'Botania:specialFlower {type:"bellethorn"}', nbt: true}
    rewards:
      - xp: 2
      - item: "minecraft:bone x8"

  - id: dreadthorne
    title: "Dreadthorne"
    at: [15, -8]
    deps: [info_funcionais]
    deps_hidden: [raiz_redstone]
    desc: |
      Versão seletiva da Bellethorne! A §eDreadthorne§r só machuca animais adultos: deixe os filhotes crescerem e o abate do curral fica automático.
      Receita: §e3 Pétalas Pretas, 2 Ciano e Raiz de Redstone§r. Faça a sua, Herói, e cuide dos seus animais com esperteza!
    tasks:
      - {get: 'Botania:specialFlower {type:"dreadthorn"}', nbt: true}
    rewards:
      - xp: 2
      - item: "minecraft:wheat x16"

  - id: heisei_dream
    title: "Heisei Dream"
    at: [16, -8]
    deps: [info_funcionais]
    deps_hidden: [runa_ira, po_fada]
    desc: |
      Que bagunça mais boa! A §eHeisei Dream§r desperta raiva nos monstros por perto e os faz lutar entre si. Ótima defesa, porque eles se distraem uns com os outros.
      Receita: §e2 Pétalas Magenta, 1 Roxa, 1 Rosa, Runa da Ira e Pó de Fada§r. Plante e assista ao espetáculo, Herói!
    tasks:
      - {get: 'Botania:specialFlower {type:"heiseiDream"}', nbt: true}
    rewards:
      - xp: 3

  - id: tigerseye
    title: "Tigerseye"
    at: [17, -8]
    deps: [info_funcionais]
    deps_hidden: [runa_outono]
    desc: |
      Creepers morrem de medo de gatos! A §eTigerseye§r emite uma "aura felina": Creepers por perto ficam paralisados, não explodem e fogem dos jogadores. Paz para o seu jardim!
      Receita: §ePétalas Amarela, Marrom, Laranja e Lima + Runa do Outono§r. Plante a sua e durma tranquilo, Herói!
    tasks:
      - {get: 'Botania:specialFlower {type:"tigerseye"}', nbt: true}
    rewards:
      - xp: 2
      - item: "minecraft:gunpowder x8"

  - id: orechid
    title: "Orechid"
    type: main
    at: [18, -8]
    deps: [info_funcionais]
    deps_hidden: [raiz_redstone, runa_orgulho, runa_ganancia, po_fada]
    desc: |
      Minério renovável sem sair de casa! A §eOrechid§r usa Mana para transformar §ePedra§r próxima
      em minérios aleatórios, sorteados de uma lista com pesos que favorece os mais comuns (carvão,
      ferro…) e inclui minérios de outros mods presentes no pack. Receita: §e2 Pétalas Cinzas, Amarela, Verde, Vermelha,
