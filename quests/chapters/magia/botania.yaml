    desc: |
      Cada peça é a peça de Manasteel + Terrasteel + Gravetos + uma runa de estação: §eElmo -
      Primavera, Peitoral - Verão, Calças - Outono, Botas - Inverno§r. Proteção de diamante, conserto
      com Mana e o bônus "Vontade dos Ancestrais": §e-20% de custo de Mana§r, regeneração mesmo sem
      fome cheia e geração passiva de Mana em Tabletes. Reúna o conjunto!
    tasks:
      - get: [Botania:terrasteelHelm, Botania:terrasteelChest, Botania:terrasteelLegs, Botania:terrasteelBoots]
    rewards:
      - xp: 4
      - item: "Botania:manaResource:4 x2"

  - id: chakram_espinhos
    title: "Chakram Espinhento"
    type: optional
    at: [25, 3]
    deps: [terrasteel]
    desc: |
      Oito Vinhas em volta de uma Barra de Terrasteel = dois §eChakrams Espinhentos§r. Arremesse:
      ele atravessa inimigos (às vezes envenenando), quica em blocos e volta como um bumerangue.
      Empilha até 6. Com Pó de Blaze e Pó de
      Fada vira o §eChakram Flamejante§r, que incendeia.
    tasks:
      - get: Botania:thornChakram
    rewards:
      - loot: incomum

  - id: pedra_temperanca
    title: "Pedra da Moderação"
    type: optional
    at: [26, 3]
    deps: [terra_shatterer]
    deps_hidden: [runa_terra]
    desc: |
      Às vezes você só quer um túnel 3×3, não uma cratera! Com a §ePedra da Moderação§r (Pedra + Runa da Terra) ativa no inventário, o Terra-Destruidor e o Terra-Truncador não quebram mais que 3×3.
      Clique para ligar/desligar. Missão opcional, mas faz uma diferença enorme no dia a dia, Herói!
    tasks:
      - craft: Botania:temperanceStone
    rewards:
      - loot: comum

  - id: espelho_mana
    title: "Espelho de Mana"
    at: [28, 3]
    deps: [terrasteel]
    deps_hidden: [tablete_mana]
    desc: |
      Um Tablete de Mana com Terrasteel, Pérola, Graveto e Rocha-viva. Agachado, clique com o
      §eEspelho de Mana§r num Poço de Mana para vinculá-lo: ele passa a funcionar como um tablete que
      puxa a Mana §edireto daquele poço§r, de longe. Suas ferramentas nunca mais ficam com fome.
    tasks:
      - craft: Botania:manaMirror
    rewards:
      - xp: 3

  # ------------------------------------------------------------------ Acessórios (Baubles)
  - id: info_acessorios
    title: "Acessórios"
    type: info
    at: [18, 7]
    deps: [tablete_mana]
    desc: |
      §dAcessórios§r (Baubles) são joias usadas em espaços próprios: abra o inventário e use o
      botão de Baubles para ver os espaços de §eAmuleto, Anéis e Cinto§r (outros mods do pack podem
      acrescentar mais tipos). O inventário de Baubles é compartilhado entre todos os mods.

      Quase todo acessório do Botania gasta um pouco de Mana do inventário para funcionar — um
      Tablete ou Bracelete de Mana carregado resolve.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: bracelete_mana
    title: "Bracelete de Mana"
    at: [17, 8]
    deps: [info_acessorios]
    desc: |
      Um Tablete de Mana envolto em Manasteel: o §eBracelete de Mana§r é um tablete que vai no espaço de anel. São 500.000 de Mana sempre no dedo, alimentando tudo o que você carrega.
      Confira a receita no NEI (R/U) e faça o seu, Herói. Poder na ponta dos dedos!
    tasks:
      - craft: Botania:manaRing:*
    rewards:
      - xp: 2
      - item: "Botania:manaResource x2"

  - id: bracelete_aura
    title: "Bracelete de Aura"
    at: [18, 8]
    deps: [info_acessorios]
    deps_hidden: [runa_mana]
    desc: |
      Runa de Mana + Manasteel. Em vez de guardar, o §eBracelete de Aura§r gera Mana devagarinho enquanto equipado e a deposita nos itens de Mana do inventário.
      Um pinga-pinga de energia que faz toda a diferença, Herói. Equipe e esqueça!
    tasks:
      - craft: Botania:auraRing
    rewards:
      - xp: 2

  - id: cinta_viajante
    title: "Cinta de Soujourner"
    at: [19, 8]
    deps: [info_acessorios]
    deps_hidden: [runa_terra, runa_ar]
    desc: |
      Couro, Manasteel e Runas da Terra e do Ar. A §eCinta de Soujourner§r aumenta velocidade, altura do pulo, reduz dano de queda e deixa você subir degraus de 1 bloco sem pular (quando não agachado), por um pouco de Mana.
      Faça a sua, Herói, e explore o mundo com mais ligeireza!
    tasks:
      - craft: Botania:travelBelt
    rewards:
      - xp: 2
      - item: "minecraft:leather x4"

  - id: cinturao_tectonico
    title: "Cinturão Tectônico"
    at: [20, 8]
    deps: [info_acessorios]
    deps_hidden: [runa_fogo, runa_terra]
    desc: |
      Couro, Manasteel e Runas do Fogo e da Terra. Com o §eCinturão Tectônico§r você ignora o empurrão (repulsão) de qualquer ataque.

      Firme como uma montanha, Herói! Equipe e aguente o tranco sem cair do penhasco. Se esquecer o formato da receita, o NEI (R/U) mostra tudo. Ótimo para quem enfrenta mobs perto de abismos!
    tasks:
      - craft: Botania:knockbackBelt
    rewards:
      - xp: 2

  - id: pingente_floco
    title: "Pingente do Floco de Neve"
    at: [21, 8]
    deps: [info_acessorios]
    deps_hidden: [runa_inverno, runa_agua]
    desc: |
      Linha, Manasteel e Runas do Inverno e da Água. Usando o §ePingente do Floco de Neve§r, a água parada aos seus pés vira gelo: você anda sobre lagos! O gelo derrete logo depois.
      Não funciona agachado nem submerso. Faça o seu, Herói, e atravesse rios sem molhar os pés!
    tasks:
      - craft: Botania:icePendant
    rewards:
      - xp: 2

  - id: pingente_piroclasta
    title: "Pingente do Piromântico"
    at: [22, 8]
    deps: [info_acessorios]
    deps_hidden: [runa_verao, runa_fogo]
    desc: |
      Linha, Manasteel e Runas do Verão e do Fogo. Se você pegar fogo (e não estiver em cima de fogo/lava), o §ePingente do Piromântico§r apaga as chamas na hora.
      A versão melhorada, com Espírito de Gaia, dá imunidade total a fogo e lava. Faça o seu e encare o Nether com mais tranquilidade, Herói!
    tasks:
      - craft: Botania:lavaPendant
    rewards:
      - xp: 2

  - id: anel_cordados
    title: "Anel dos Cordados"
    at: [23, 8]
    deps: [info_acessorios]
    deps_hidden: [runa_agua]
    desc: |
      Manasteel, Runa da Água e dois peixes (baiacu e salmão). O §eAnel dos Cordados§r faz você nadar como peixe: acelera debaixo d'água, melhora a visão e, gastando Mana, permite respirar indefinidamente.

      Perfeito com a Bubbell, para explorar o fundo dos lagos e oceanos. Confira a receita no NEI (R/U). Mergulhe fundo, Herói!
    tasks:
      - craft: Botania:waterRing
    rewards:
      - xp: 2

  - id: anel_manto
    title: "Anel do Manto"
    at: [24, 8]
    deps: [info_acessorios]
    deps_hidden: [runa_terra]
    desc: |
      Manasteel, Runa da Terra e uma Picareta de Ouro. Com Mana no inventário, o §eAnel do Manto§r dá Pressa enquanto você cava. Cada braçada gasta um pouco de Mana.
      Faça o seu, Herói, e cave como se não houvesse amanhã!
    tasks:
      - craft: Botania:miningRing
    rewards:
      - xp: 2

  - id: anel_magnetico
    title: "Anel Magnético"
    at: [25, 8]
    deps: [info_acessorios]
    deps_hidden: [lente_magnetismo]
    desc: |
      Os itens próximos voam até você! O §eAnel Magnético§r (uma Lente de Magnetismo virando anel) puxa tudo, exceto agachado, e pausa 5 segundos depois de você jogar algo, para não puxar de volta.
      Com Terrasteel na bancada vira o Anel Magnético Superior, de alcance maior. Faça o seu, Herói!
    tasks:
      - craft: Botania:magnetRing
    rewards:
      - xp: 2

  - id: anel_correcao
    title: "Anel da Correção"
    at: [26, 8]
    deps: [info_acessorios]
    desc: |
      Argila e Manasteel. Com o §eAnel da Correção§r, a ferramenta na sua mão vira sempre a certa para o bloco (picareta, machado ou pá), desde que sejam ferramentas que usam Mana.
      Faça o seu, Herói, e pare de trocar de ferramenta toda hora. Pura praticidade!
    tasks:
      - craft: Botania:swapRing
    rewards:
      - xp: 2

  - id: monoculo
    title: "Monóculo de Mana"
    at: [17, 9]
    deps: [info_acessorios]
    deps_hidden: [vidro_mana]
    desc: |
      Vidro de Mana, Manasteel e Pepitas de Ouro. Com o §eMonóculo§r você vê todas as rajadas de Mana por perto, mesmo atrás de paredes, e ao olhar para uma flor enxerga o raio de ação dela.
      O acessório favorito dos engenheiros botânicos. Faça o seu, Herói!
    tasks:
      - craft: Botania:monocle
    rewards:
      - xp: 2

  - id: pequeno_planeta
    title: "Pequeno Planeta"
    type: optional
    at: [18, 9]
    deps: [info_acessorios]
    deps_hidden: [perola_mana]
    desc: |
      Rocha-viva, Pedra e uma Pérola de Mana. O §ePequeno Planeta§r atrai rajadas de Mana próximas, que passam a orbitar você. Com mais Pedra ele vira um bloco com o mesmo efeito.
      Também é ingrediente do Encanto da Diva. Missão opcional, mas muito bonita, Herói!
    tasks:
      - craft: Botania:tinyPlanet
    rewards:
      - loot: comum

  - id: caixa_baubles
    title: "Caixa de Baubles"
    at: [19, 9]
    deps: [info_acessorios]
    desc: |
      Seus acessórios vão ganhar um lar, Herói!

      Manasteel, Ouro e um Baú: a §eCaixa de Baubles§r guarda seus acessórios e permite trocar o que está equipado rapidamente pela própria interface. Também aceita Tabletes de Mana. Confira a receita no NEI (R/U). Monte a sua e mantenha tudo organizado!
    tasks:
      - craft: Botania:baubleBox
    rewards:
      - xp: 2

  - id: cinta_desbravador
    title: "Cinta do Desbravador Planar"
    at: [20, 9]
    deps: [cinta_viajante]
    desc: |
      Cinta de Soujourner + Mapa + Sementes de Pasto + Açúcar. A §eCinta do Desbravador Planar§r não acelera parado: quanto mais você anda sem parar, mais ela carrega e mais rápido você fica, até passar de qualquer outra cinta.
      Parou, zerou. Faça a sua, Herói, e dispare!
    tasks:
      - craft: Botania:speedUpBelt
    rewards:
      - xp: 2

  - id: espectador
    title: "O Espectador"
    type: optional
    at: [21, 9]
    deps: [info_acessorios]
    desc: |
      Ferro, um Olho do Fim e uma Esmeralda. Com §eO Espectador§r na cabeça, segurando um item, você vê destacados os baús, carrinhos, mobs e itens no chão que têm aquele item.
      Achar aquela pedra perdida no armazém nunca foi tão fácil, Herói! Missão opcional, mas ajuda demais.
    tasks:
      - craft: Botania:itemFinder
    rewards:
      - loot: comum

  - id: cosmeticos
    title: "Acessórios Cosméticos"
    type: optional
    at: [22, 9]
    deps: [info_acessorios]
    deps_hidden: [linha_mana]
    desc: |
      Oito pétalas da mesma cor em volta de uma Linha Infundida em Mana = um dos 32 §eacessórios
      cosméticos§r (gravatas, orelhas de gato, óculos 3D…). Use no espaço de amuleto ou combine na
      bancada com outro acessório para trocar a aparência dele. Moda é importante, Herói.
    tasks:
      - get: "Botania:cosmetic:*"
    rewards:
      - loot: comum

  - id: bracelete_mana_superior
    title: "Bracelete de Mana Superior"
    at: [23, 9]
    deps: [bracelete_mana]
    deps_hidden: [terrasteel]
    desc: |
      Bracelete de Mana + Barra de Terrasteel. O §eBracelete de Mana Superior§r guarda §e2.000.000§r de Mana, quatro vezes mais que o comum.
      É indispensável para o Terra-Destruidor e os cajados mais caros. Faça o seu, Herói, e esqueça o aperto de Mana!
    tasks:
      - craft: Botania:manaRingGreater:*
    rewards:
      - xp: 3

  - id: bracelete_aura_superior
    title: "Bracelete de Aura Superior"
    type: optional
    at: [24, 9]
    deps: [bracelete_aura]
    deps_hidden: [terrasteel]
    desc: |
      Bracelete de Aura mais Terrasteel resulta no §eBracelete de Aura Superior§r, que gera Mana bem mais rápido para seus itens.
      Combine com o bracelete de armazenamento e você quase nunca precisa voltar ao poço. Missão opcional, Herói, mas cheia de comodidade! Confira a receita no NEI (R/U) e capriche.
    tasks:
      - craft: Botania:auraRingGreater
    rewards:
      - loot: incomum

  - id: anel_magnetico_superior
    title: "Anel Magnético Superior"
    type: optional
    at: [25, 9]
    deps: [anel_magnetico]
    deps_hidden: [terrasteel]
    desc: |
      Anel Magnético + Terrasteel: o §eAnel Magnético Superior§r tem o mesmo efeito do anel comum, mas com um raio de atração bem maior.

      Ideal para quem usa o Terra-Destruidor em área, Herói, porque tudo vem até você. Confira o formato da receita no NEI (R/U). Missão opcional, mas quem experimenta não volta atrás!
    tasks:
      - craft: Botania:magnetRingGreater
    rewards:
      - loot: incomum

  - id: anel_grande_fada
    title: "Anel da Grande Fada"
    type: optional
    at: [26, 9]
    deps: [info_acessorios]
    deps_hidden: [elementium, po_fada]
    desc: |
      Elementium e Pó de Fada. O §eAnel da Grande Fada§r aumenta a chance de uma Fada surgir para atacar quem bater em você. Funciona mesmo sem a armadura de Elementium, e soma com ela.
      Missão opcional, Herói, mas as fadinhas fazem um bom escudo!
    tasks:
      - craft: Botania:pixieRing
    rewards:
      - loot: incomum

  - id: anel_longo_alcance
    title: "Anel do Longo Alcance"
    at: [27, 9]
    deps: [info_acessorios]
    deps_hidden: [elementium, runa_orgulho]
    desc: |
      Elementium e Runa do Orgulho. O §eAnel do Longo Alcance§r aumenta em cerca de 3 blocos a distância em que você quebra, coloca e interage com blocos e criaturas.
      Construir nunca mais vai exigir tantas escadas, Herói. Faça o seu e esbanje alcance!
    tasks:
      - craft: Botania:reachRing
    rewards:
      - xp: 3

  # ------------------------------------------------------------------ Itens Místicos: cajados e ferramentas
  - id: info_cajados
    title: "Itens Místicos"
    type: info
    at: [3, 3]
    deps_hidden: [altar_runico]
    desc: |
      Agora que você tem runas, chegou a hora dos §dItens Místicos§r: cajados que conjuram terra,
      água e fogo, armas que disparam Mana e ferramentas que parecem trapaça.

      Quase todos §egastam Mana do seu inventário§r a cada uso — mantenha um Tablete ou Bracelete de
      Mana carregado. Os robes de Tecido de Mana barateiam o custo e deixam alguns cajados mais
      fortes.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: cajado_terras
    title: "Cajado das Terras"
    at: [0, 4]
    deps: [info_cajados]
    deps_hidden: [runa_terra]
    desc: |
      Terra, Graveto e Runa da Terra. O §eCajado das Terras§r coloca um bloco de Terra onde você clicar, pagando com Mana.

      Nunca mais carregue pilhas de terra para pontes improvisadas, Herói. É um item que poupa espaço e tempo na construção. Confira o NEI (R/U) se precisar da receita e boa obra!
    tasks:
      - craft: Botania:dirtRod
    rewards:
      - xp: 2

  - id: cajado_mares
    title: "Cajado dos Mares"
    at: [1, 4]
    deps: [info_cajados]
    deps_hidden: [runa_agua]
    desc: |
      Frasco de Água, Graveto e Runa da Água. O §eCajado dos Mares§r cria um bloco de água onde você clicar e também enche o Boticário de Pétalas.
      Adeus, viagens até o lago! Faça o seu, Herói, e deixe a água sempre à mão.
    tasks:
      - craft: Botania:waterRod
    rewards:
      - xp: 2

  - id: cajado_ceus
    title: "Cajado dos Céus"
    at: [2, 4]
    deps: [info_cajados]
    deps_hidden: [runa_ar]
    desc: |
      Pena, Graveto e Runa do Ar. Segure o clique como um arco e o §eCajado dos Céus§r te lança para o alto; enquanto ele recarrega, você não sofre dano de queda. Num Avatar de Madeira-viva, lança quem pular perto dele.
      Faça o seu, Herói, e voe alto!
    tasks:
      - craft: Botania:tornadoRod
    rewards:
      - xp: 2
      - item: "minecraft:feather x8"

  - id: cajado_infernos
    title: "Cajado dos Infernos"
    at: [3, 4]
    deps: [info_cajados]
    deps_hidden: [runa_fogo]
    desc: |
      Pó de Blaze, Graveto e Runa do Fogo. Usado no chão, o §eCajado dos Infernos§r cria um anel de fogo que queima tudo o que estiver dentro depois de se espalhar, §cvocê incluso§r!
      Saia do círculo rapidinho, Herói. Fogo é divertido, mas só de longe!
    tasks:
      - craft: Botania:fireRod
    rewards:
      - xp: 2

  - id: cajado_profundezas
    title: "Cajado das Profundezas"
    at: [4, 4]
    deps: [info_cajados]
    deps_hidden: [runa_fogo, runa_agua]
    desc: |
      Pedregulho, Gravetos e Runas do Fogo e da Água. É igual ao Cajado das Terras, mas o §eCajado das Profundezas§r conjura Pedregulho (um pouco mais caro).
      Pontes e torres instantâneas, Herói! Faça o seu e construa na velocidade da Mana.
    tasks:
      - craft: Botania:cobbleRod
    rewards:
      - xp: 2

  - id: cajado_nucleo
    title: "Cajado do Núcleo Derretido"
    at: [5, 4]
    deps: [info_cajados]
    deps_hidden: [runa_fogo]
    desc: |
      Varas de Blaze, Gravetos e Runa do Fogo. Segure o clique apontando para um bloco que pode ser fundido e o §eCajado do Núcleo Derretido§r o derrete no lugar: Pedregulho vira Pedra, Areia vira Vidro…
      Uma fornalha de bolso, Herói! Faça o seu e deixe as fornalhas descansarem.
    tasks:
      - craft: Botania:smeltRod
    rewards:
      - xp: 2

  - id: cajado_manto_pleno
    title: "Cajado do Manto Pleno"
    at: [0, 5]
    deps: [info_cajados]
    deps_hidden: [diamante_mana]
    desc: |
      Quer raio-X botânico (e honesto), Herói?

      Gravetos e um Diamante de Mana formam o §eCajado do Manto Pleno§r. Ele faz os minérios num raio grande brilharem por alguns instantes, através das paredes. Confira a receita no NEI (R/U) se tiver dúvida. Faça o seu e saia à caça dos minérios. Boa mineração!
    tasks:
      - craft: Botania:diviningRod
    rewards:
      - xp: 3

  - id: cajado_crosta
    title: "Cajado da Crosta Inconstante"
    at: [1, 5]
    deps: [info_cajados]
    deps_hidden: [runa_preguica]
    desc: |
      Pedra, Gravetos e Runa da Preguiça. Agachado + clique num bloco escolhe o material; clique
      esquerdo em outro bloco o §etroca§r pelo escolhido (tirando do seu inventário); clique direito
      troca uma área inteira destacada. O Cajado das Terras/Profundezas no inventário fornece terra
      ou pedregulho infinitos para ele.
    tasks:
      - craft: Botania:exchangeRod
    rewards:
      - xp: 3

  - id: cajado_highlands
    title: "Cajado de Highlands"
    at: [2, 5]
    deps: [cajado_terras]
    deps_hidden: [po_fada]
    desc: |
      Escadas para o céu! Cajado das Terras + Pó de Fada + Runa do Ar fazem o §eCajado de Highlands§r, que faz tudo o que o original faz e ainda coloca Terra no meio do ar, sem apoio (custa mais Mana).
      Monte o seu, Herói, e construa lá no alto sem precisar de andaime!
    tasks:
      - craft: Botania:skyDirtRod
    rewards:
      - xp: 3

  - id: cajado_terra_firma
    title: "Cajado de Terra Firma"
    at: [3, 5]
    deps: [cajado_terras]
    deps_hidden: [terrasteel, runa_primavera, runa_verao, runa_outono, runa_inverno]
    desc: |
      Terrasteel, as quatro runas das estações, Cajado das Terras e Sementes de Pasto. Segure o
      clique e o §eCajado de Terra Firma§r §eaplaina§r o terreno ao seu redor até a sua altura,
      colocando terra ou removendo blocos (§cos blocos removidos se perdem§r). Não funciona abaixo do
      nível do mar.
    tasks:
      - craft: Botania:terraformRod
    rewards:
      - xp: 3
      - item: "minecraft:dirt x64"

  - id: cajado_bifrost
    title: "Cajado de Bifrost"
    at: [4, 5]
    deps: [info_cajados]
    deps_hidden: [elementium, po_fada, pedra_draconiana]
    desc: |
      Elementium, Pó de Fada e Pedra Draconiana. O §eCajado de Bifrost§r cria uma ponte de arco-íris na direção em que você olha, de até 100 blocos, que dura uns 15 segundos (uma por vez).
      Bônus: com Vidro Élfico ele vira Blocos de Bifrost decorativos. Atravesse abismos com estilo, Herói!
    tasks:
      - craft: Botania:rainbowRod
    rewards:
      - xp: 3

  - id: poco_fabuloso
    title: "Poço de Mana Fabuloso"
    type: optional
    at: [4, 6]
    deps: [cajado_bifrost]
    desc: |
      Tudo começa com Cajado de Bifrost + Vidro Élfico = Bloco de Bifrost. Depois, Bloco de Bifrost + Rocha-viva = §eRocha Reluzente§r arco-íris.
      Cinco delas formam o §ePoço de Mana Fabuloso§r, que guarda o mesmo que um poço normal, só que é FABULOSO. Missão opcional, Herói, mas que charme!
    tasks:
      - craft: Botania:pool:3
    rewards:
      - loot: incomum

  - id: cajado_mesa
    title: "Cajado da Mesa Sombria"
    at: [5, 5]
    deps: [info_cajados]
    deps_hidden: [pedra_draconiana]
    desc: |
      Física é para os fracos! Gravetos de Madeira dos Sonhos, Trigo e Pedra Draconiana fazem o §eCajado da Mesa Sombria§r. Segure o clique num monstro ou item para levantá-lo no ar; solte para largar ou clique esquerdo para arremessá-lo com força.
      Diverta-se, Herói!
    tasks:
      - craft: Botania:gravityRod
    rewards:
      - xp: 3

  - id: disparador_mana
    title: "Disparador de Mana"
    at: [0, 6]
    deps: [info_cajados]
    deps_hidden: [dispersor_pulso, runa_mana, diamante_mana]
    desc: |
      Um dispersor de bolso em forma de pistola (Dispersor por Redstone, Runa de Mana, Diamante de
      Mana, Madeira-viva e TNT). O §eDisparador de Mana§r atira rajadas usando Mana do inventário —
      mais rápidas, com 3/4 da Mana de um dispersor. Coloque uma lente ao lado dele na bancada para
      encaixá-la (e dispare Lentes de Dano, Escavação…).
    tasks:
      - craft: Botania:manaGun
    rewards:
      - xp: 3
      - item: "minecraft:tnt x2"

  - id: estilingue
    title: "Estilingue e Bolas de Vinhas"
    type: optional
    at: [1, 6]
    deps: [info_cajados]
    deps_hidden: [runa_ar]
    desc: |
      Subindo por onde não dá! Nove Vinhas = uma §eBola de Vinhas§r: arremesse e onde ela bater nasce uma escada de vinhas firme, escalável mesmo sem parede atrás.
      O Estilingue de Madeira-viva (com Runa do Ar) atira as bolas em linha reta, ignorando a gravidade. Missão opcional, Herói, mas muito esperta!
    tasks:
      - get: [Botania:slingshot, "Botania:vineBall x8"]
    rewards:
      - loot: comum

  - id: arco_madeira_viva
    title: "Arco de Madeira-viva"
    at: [2, 6]
    deps: [info_cajados]
    deps_hidden: [linha_mana]
    desc: |
      Gravetos e Linha Infundida em Mana. O §eArco de Madeira-viva§r dura mais que um arco comum e se conserta com Mana do inventário, como as ferramentas de Manasteel.
      Faça o seu, Herói, e mire sem se preocupar com o desgaste!
    tasks:
      - craft: Botania:livingwoodBow
    rewards:
      - xp: 2
      - item: "minecraft:arrow x32"

  - id: arco_cristal
    title: "Arco de Cristal"
    at: [3, 6]
    deps: [arco_madeira_viva]
    deps_hidden: [pedra_draconiana]
    desc: |
      Pedras Draconianas no lugar dos gravetos. O §eArco de Cristal§r cria as flechas com Mana, então você não precisa carregar nenhuma, e atira bem mais rápido.
      A arma de longo alcance dos elfos, Herói! Faça o seu e mire alto.
    tasks:
      - craft: Botania:crystalBow
    rewards:
      - xp: 3

  - id: berrante
    title: "Berrante da Selva"
    type: optional
    at: [5, 6]
    deps: [info_cajados]
    deps_hidden: [sementes_pasto]
    desc: |
      Madeira-viva e Sementes de Pasto. Sopre o §eBerrante da Selva§r e a vegetação próxima é arrancada como se fosse quebrada à mão.
      Com Folhas vira o Berrante do Toldo (quebra folhas); com Bola de Neve, o Berrante das Neves (limpa neve). Missão opcional, Herói, mas dá um trabalhão a menos!
    tasks:
      - one_of: [Botania:grassHorn, "Botania:grassHorn:1", "Botania:grassHorn:2"]
    rewards:
      - loot: comum

  - id: picareta_vitrea
    title: "Picareta Vítrea"
    type: optional
    at: [0, 7]
    deps: [info_cajados]
    deps_hidden: [manasteel]
    desc: |
      Vidro, Manasteel e Gravetos: assim se faz a §ePicareta Vítrea§r. Ela quebra vidro e o devolve inteiro, um Toque Suave barato, só para vidro.
      Os decoradores agradecem, Herói! Missão opcional, mas não deixe os vidros se quebrarem à toa. Se precisar rever o desenho, o NEI (R/U) mostra a receita.
    tasks:
      - craft: Botania:glassPick
    rewards:
      - loot: comum

  - id: aureola_criacao
    title: "Auréola da Criação"
    at: [1, 7]
    deps: [info_cajados]
    deps_hidden: [perola_mana, manasteel]
    desc: |
      Manasteel, Pérola de Mana e uma Bancada. A §eAuréola da Criação§r é uma bancada portátil: na mão, mostra um "halo" de receitas salvas ao seu redor.
      Clique na bancada do halo para fabricar e guarde as receitas que mais usa para refazer num clique. Faça a sua, Herói!
    tasks:
      - craft: Botania:craftingHalo
    rewards:
      - xp: 2

  - id: aureola_manufatura
    title: "Auréola de Manufatura"
    at: [2, 7]
    deps: [aureola_criacao]
    deps_hidden: [diamante_mana]
    desc: |
      Auréola da Criação + Diamante de Mana. A §eAuréola de Manufatura§r faz tudo o que a outra faz e, quando não está na mão, executa sozinha as receitas salvas sempre que possível.
      Por exemplo, compactar minérios em blocos enquanto você minera. Que mágica, Herói!
    tasks:
      - craft: Botania:autocraftingHalo
    rewards:
      - xp: 3

  - id: sextante
    title: "Sextante do Modulador do Mundo"
    type: optional
    at: [3, 7]
    deps: [info_cajados]
    deps_hidden: [manasteel]
    desc: |
      Construir círculos em blocos é uma arte esquecida, mas não por você! Com o §eSextante§r, aponte para o centro, olhe em volta para definir o raio, e ele projeta o contorno perfeito para você seguir.
      Adeus, geradores de círculo na internet! Missão opcional, Herói.
    tasks:
      - craft: Botania:sextant
    rewards:
      - loot: comum

  - id: tinta_fantasma
    title: "Tinta Fantasmal"
    type: optional
    at: [4, 7]
    deps: [info_cajados]
    deps_hidden: [perola_mana]
    desc: |
      Pérola de Mana, corante, vidro e quatro frascos = 4 §eTintas Fantasmais§r. Na bancada, ela deixa sua armadura de Mana (Manasteel, Terrasteel, Elementium, Tecido de Mana) invisível sem perder a proteção.
      Clicada numa Fagulha, deixa a fagulha quase transparente. Missão opcional, Herói, mas estilosa!
    tasks:
      - get: Botania:phantomInk
    rewards:
      - loot: comum

  - id: semente_mundo
    title: "Semente do Mundo"
    type: optional
    at: [5, 7]
    deps: [info_cajados]
    deps_hidden: [pedra_draconiana]
    desc: |
      Uma saída de emergência! Grama, Sementes de Trigo e Pedra Draconiana = 4 §eSementes do Mundo§r. Se você estiver a mais de 24 blocos do ponto de nascimento do mundo, usar uma te leva instantaneamente até lá (ela é consumida).
      Guarde algumas na mochila, Herói. Missão opcional!
    tasks:
      - get: Botania:worldSeed
    rewards:
      - loot: incomum

  - id: balde_extrapolado
    title: "Balde sem Fundo"
    type: optional
    at: [0, 8]
    deps: [info_cajados]
    deps_hidden: [elementium]
    desc: |
      Um balde de Elementium que não segura nada: todo líquido que o §eBalde sem Fundo§r recolhe some no éter.

      Ótimo para limpar lava e água de cavernas, Herói! Use com cuidado e não espere receber o líquido de volta. Confira a receita no NEI (R/U). Missão opcional, mas faz uma boa faxina.
    tasks:
      - craft: Botania:openBucket
    rewards:
      - loot: incomum

  - id: hera_resoluta
    title: "Hera Resoluta"
    at: [1, 8]
    deps: [info_cajados]
    deps_hidden: [po_fada, ar_do_fim]
    desc: |
      Pó de Fada, Vinha e Ar do Fim. Junte a §eHera Resoluta§r a um item na bancada e ele fica no seu inventário quando você morrer. A hera se gasta na morte e precisa ser reaplicada.
      Proteja suas Relíquias com ela, Herói!
    tasks:
      - get: Botania:keepIvy
    rewards:
      - xp: 3

  - id: virus_equestre
    title: "Vírus Equestre"
    type: optional
    at: [2, 8]
    deps: [info_cajados]
    deps_hidden: [po_fada]
    desc: |
      Pó de Fada, Bola de Vinhas, Creme de Magma, Olho de Aranha Fermentado, Olho do Fim e uma
      caveira (de zumbi ou de esqueleto). O vírus transforma um Cavalo em §eCavalo Zumbi ou Esqueleto§r
      — e melhora muito todos os atributos dele. Montaria de elite.
    tasks:
      - one_of: [Botania:virus, "Botania:virus:1"]
    rewards:
      - loot: incomum

  - id: garrafa_slime
    title: "Slime Engarrafado"
    type: optional
    at: [3, 8]
    deps: [info_cajados]
    deps_hidden: [elementium, vidro_elfico]
    desc: |
      Elementium, Vidro Élfico e uma Bola de Slime. O §eSlime Engarrafado§r é um detector de Chunks de Slime: a gosma dentro começa a pular quando você está numa área onde Slimes nascem.
      O par perfeito da Narslimmus, Herói! Missão opcional, mas muito útil para as caçadas.
    tasks:
      - craft: Botania:slimeBottle
    rewards:
      - loot: incomum

  # ------------------------------------------------------------------ Botânica Alquímica: o Fermentador
  - id: fermentador
    title: "Fermentador Botânico"
    at: [20, 3]
    deps: [bloco_manasteel]
    deps_hidden: [runa_mana]
    desc: |
      Poções com receita fixa e várias doses! O §eFermentador Botânico§r (Rocha-viva, Suporte de
      Poção, Runa de Mana e Bloco de Manasteel) prepara §ePoções Botânicas§r usando Mana como
      solvente.

      Uso: coloque primeiro o §efrasco§r (ele fica em cima do fermentador), depois os ingredientes
      (clique ou jogue). Quando a combinação for válida, aponte um dispersor e a Mana começa a fluir.
      §aToda receita começa com Fungo do Nether§r — confira as combinações no NEI.
    tasks:
      - craft: Botania:brewery
    rewards:
      - xp: 3
      - item: "minecraft:nether_wart x8"

  - id: frascos
    title: "Frascos Pequenos"
    at: [21, 3]
    deps: [fermentador]
    deps_hidden: [vidro_mana]
    desc: |
      Três Vidros de Mana em "V" dão três §eFrascos Pequenos§r. Cada frasco de poção botânica tem 4 doses, bem melhor que uma garrafa comum.

      Faça uma pilha, Herói, porque as poções botânicas vão exigir muitos frascos! Se tiver dúvida no desenho da receita, o NEI (R/U) mostra. Prepare-se para as poções!
    tasks:
      - get: "Botania:vial x6"
    rewards:
      - xp: 2
      - item: "Botania:manaGlass x6"

  - id: primeira_pocao
    title: "Primeira Poção Botânica"
    at: [22, 3]
    deps: [frascos]
    desc: |
      Hora de cozinhar! Algumas receitas simples (todas com Fungo do Nether):
      §eVelocidade§r: Açúcar + Redstone. §eVigor§r: Pó de Blaze + Pó de Pedra Luminosa.
      §eCura§r: Melancia Reluzente + Batata. §eResistência§r: Barra de Ferro + Couro.
      §ePele de Magma§r: Creme de Magma + Netherrack. §eVisão Noturna§r: Olho de Aranha + Cenoura
      Dourada. Prepare qualquer uma e beba com orgulho.
    tasks:
      - get: "Botania:brewVial:*"
    rewards:
      - xp: 2
      - item: "minecraft:glowstone_dust x8"

  - id: pocoes_complexas
    title: "Poções Complexas"
    type: optional
    at: [23, 3]
    deps: [primeira_pocao]
    deps_hidden: [manasteel]
    desc: |
      Além das cópias de poções comuns há misturas exclusivas: §eSobrecarga§r (vários efeitos de
      força e velocidade de uma vez — Pó de Blaze, Açúcar, Pedra Luminosa, Manasteel e Olho de
      Aranha), §ePeso Pena§r, §eAlmas Cruzadas§r, §eAbsolução§r (remove efeitos), §eSedução Marinha§r
      (pesca) e outras. Com o Thaumcraft, existe até a §eMente Sã§r contra Warp! Veja no NEI.
    tasks:
      - one_of: ['Botania:brewVial {brewKey:"overload"}', 'Botania:brewVial {brewKey:"featherFeet"}', 'Botania:brewVial {brewKey:"soulCross"}', 'Botania:brewVial {brewKey:"clear"}', 'Botania:brewVial {brewKey:"allure"}', 'Botania:brewVial {brewKey:"emptiness"}', 'Botania:brewVial {brewKey:"bloodthirst"}', 'Botania:brewVial {brewKey:"warpWard"}']
        nbt: true
    rewards:
      - loot: incomum

  - id: frasco_elfico
    title: "Frasco de Vidro Élfico"
    type: optional
    at: [21, 4]
    deps: [frascos]
    deps_hidden: [vidro_elfico]
    desc: |
      Feito com Vidro Élfico, o §eFrasco Élfico§r guarda 6 doses em vez de 4 e gasta menos ingredientes por dose, mas o dobro de Mana. E bebe-se mais rápido, coisa de elfo.
      Missão opcional, Herói, mas rende bastante poção por frasco.
    tasks:
      - get: "Botania:vial:1 x3"
    rewards:
      - loot: incomum

  - id: incenso
    title: "Incensos"
    at: [22, 4]
    deps: [primeira_pocao]
    desc: |
      Uma Vara de Incenso (Graveto, Pó de Blaze e Lágrima de Ghast) colocada no Fermentador no lugar
      do frasco recebe a poção — custando cerca de 10× mais Mana. Na §eBandeja de Incensos§r, acesa com
      Isqueiro, ela dá o efeito a todos os jogadores num raio de §e30 blocos§r, durando 60× mais que a
      poção líquida. Poções instantâneas ou com vários efeitos não servem.
    tasks:
      - get: [Botania:incenseStick, Botania:incensePlate]
    rewards:
      - xp: 3
      - item: "minecraft:ghast_tear x2"

  - id: pingente_sangue
    title: "Pingente de Sangue"
    type: optional
    at: [23, 4]
    deps: [primeira_pocao]
    deps_hidden: [prismarinho, diamante_mana]
    desc: |
      Fragmentos de Prismarinho, Lágrima de Ghast e Diamante de Mana. Infunda o §ePingente de Sangue§r com uma poção no Fermentador (como se fosse um frasco) e, usando-o como amuleto, você recebe o efeito o tempo todo, pagando com Mana.
      Missão opcional, Herói, mas muito poderosa!
    tasks:
      - get: Botania:bloodPendant
    rewards:
      - loot: incomum

  # ------------------------------------------------------------------ O Portal de Alfheim
  - id: madeira_viva_reluzente
    title: "Madeira-viva Reluzente"
    at: [28, -2]
    deps: [terrasteel]
    desc: |
      Um brilho extra para o portal élfico, Herói!

      Madeira-viva + Pó de Pedra Luminosa (sem formato) = §eMadeira-viva Reluzente§r. O portal élfico precisa de três delas. Faça logo, porque o resto do portal é bem mais caro. Se tiver dúvida na receita, o NEI (R/U) ajuda. Junte os três e vá para a próxima etapa!
    tasks:
      - get: "Botania:livingwood:5 x3"
    rewards:
      - xp: 2
      - item: "minecraft:glowstone_dust x8"

  - id: nucleo_portal
    title: "Núcleo do Portal Élfico"
    type: main
    at: [28, 0]
    deps: [pepitas_terrasteel]
    desc: |
      Seis Madeiras-vivas com uma coluna de §etrês Pepitas de Terrasteel§r no meio: o §eNúcleo do
      Portal Élfico§r. É o coração da ponte entre o nosso mundo e Alfheim, a terra dos elfos — que
      foram banidos daqui há muito, muito tempo. (Eu tenho tantas perguntas para eles!)
    tasks:
      - craft: Botania:alfheimPortal
    rewards:
      - xp: 4
      - choice: ["Botania:livingwood x16", "minecraft:glowstone_dust x16", "Botania:manaResource:1 x2"]

  - id: pilone_natura
    title: "Pilão da Natureza"
    type: main
    at: [29, 1]
    deps: [pepitas_terrasteel]
    deps_hidden: [pilone_mana]
    desc: |
      Um Pilão de Mana cercado por §equatro Pepitas de Terrasteel§r e um Olho do Fim. O portal precisa
      de §edois Pilões da Natureza§r, cada um em cima de um Poço de Mana. Eles drenam a Mana dos poços
      para manter a ponte com Alfheim aberta.
    tasks:
      - get: "Botania:pylon:1 x2"
    rewards:
      - xp: 4
      - choice: ["minecraft:ender_eye x2", "Botania:livingrock x16", "minecraft:gold_ingot x4"]

  - id: portal_alfheim
    title: "Portal de Alfheim"
    type: portal
    at: [30, 0]
    deps: [nucleo_portal, pilone_natura, madeira_viva_reluzente]
    banner: "O Portal de Alfheim"
    subtitle: "Uma ponte para a terra dos elfos"
    desc: |
      §eMontagem§r (de frente para o portal): o Núcleo fica no §emeio da base§r; a moldura tem 5 de
      largura por 5 de altura, §esem os cantos§r, com o miolo 3×3 vazio. São 8 Madeiras-vivas e as 3
      Reluzentes no §emeio de cada lateral e no meio do topo§r. Dois Poços de Mana ficam 3 blocos para
      cada lado e 3 blocos à frente (ou atrás), cada um com um Pilão da Natureza em cima.

      Encha os poços e clique no Núcleo com a §eVarinha§r. Abrir custa muita Mana; mantê-lo aberto,
      pouca — então não fique fechando. §cSó itens atravessam§r. Jogue §eMadeira-viva§r e os elfos
      devolvem §eMadeira dos Sonhos§r!
      §cAtenção:§r itens que eles não trocam ficam como "presente" (somem). Ferro, Diamante e Pérola
      do Fim eles devolvem.
    tasks:
      - get: "Botania:dreamwood x8"
    rewards:
      - xp: 5
      - loot: raro

  - id: carta_elfos
    title: "Uma Carta de Elven Garde"
    type: info
    at: [30, -2]
    deps: [portal_alfheim]
    desc: |
      A Lexica só sabe o básico sobre Alfheim… então §ejogue a sua Lexica Botania no portal§r! Os elfos
      leem, se encantam com as notícias do nosso mundo e a devolvem com uma carta do Alto Conselho de
      Elven Garde e um capítulo inteiro de §dConhecimento Élfico§r desbloqueado: Pó de Fada, Pedra
      Draconiana, Elementium, Gaia…

      (Não tenha medo: o livro volta. O tempo lá passa diferente.)
    tasks:
      - check
    rewards:
      - xp: 2

  - id: elementium
    title: "Elementium"
    type: main
    at: [32, 0]
    deps: [portal_alfheim]
    desc: |
      O metal élfico! Jogue §eduas Barras de Manasteel§r no portal e receba uma Barra de Elementium (dois Blocos de Manasteel viram um Bloco de Elementium).
      Ele faz ferramentas e armaduras com poderes únicos, os Pilões de Gaia e boa parte do equipamento avançado. Junte quatro, Herói!
    tasks:
      - get: "Botania:manaResource:7 x4"
    rewards:
      - xp: 4
      - choice: ["Botania:manaResource x8", "minecraft:iron_block x2", "Botania:livingwood x16"]

  - id: po_fada
    title: "Pó de Fada"
    at: [31, -2]
    deps: [portal_alfheim]
    desc: |
      Uma §ePérola de Mana§r jogada no portal volta como Pó de Fada. Ele aparece em dezenas de receitas élficas: Kekimurus, Orechid, Loonium, lentes, melhorias de fagulha…
      Junte quatro, Herói, e mantenha um bom estoque. Você vai precisar! Se tiver dúvida do processo, o NEI (R/U) e a Lexica ajudam.
    tasks:
      - get: "Botania:manaResource:8 x4"
    rewards:
      - xp: 3
      - item: "minecraft:ender_pearl x4"

  - id: pedra_draconiana
    title: "Pedra Draconiana"
    at: [32, -2]
    deps: [portal_alfheim]
    desc: |
      Um §eDiamante de Mana§r no portal volta como Pedra Draconiana (o bloco também troca). Ela é a gema dos elfos: Arco de Cristal, Dispersor de Gaia, Índice Corporea, cajados e mais.
      Junte duas por agora, Herói, e já vá planejando as próximas!
    tasks:
      - get: "Botania:manaResource:9 x2"
    rewards:
      - xp: 3
      - item: "minecraft:diamond x2"

  - id: graveto_sonhos
    title: "Graveto de Madeira dos Sonhos"
    at: [33, -2]
    deps: [portal_alfheim]
    desc: |
      Igual ao de Madeira-viva: dois blocos de Madeira dos Sonhos em coluna dão um §eGraveto de Madeira dos Sonhos§r. É o cabo das ferramentas de Elementium e de vários cajados élficos.
      Faça um punhado, Herói, que a demanda é grande!
    tasks:
      - get: "Botania:manaResource:13 x4"
    rewards:
      - xp: 2

  - id: quartzo_elfico
    title: "Quartzo Élfico"
    type: optional
    at: [31, -3]
    deps: [portal_alfheim]
    desc: |
      Os elfos adoram o nosso Quartzo do Nether (o deles é verde). Jogue quartzo no portal e receba §eQuartzo Élfico§r, que vira blocos, pilares e escadas, e asas para a Tiara de Flügel!
      Missão opcional, Herói, mas muito bonita e útil.
    tasks:
      - get: "Botania:quartz:5 x8"
    rewards:
      - loot: comum

  - id: vidro_elfico
    title: "Vidro Élfico"
    at: [32, -3]
    deps: [portal_alfheim]
    deps_hidden: [vidro_mana]
    desc: |
      §eVidro de Mana§r no portal vira Vidro Élfico, com padrões que mudam conforme o lugar. Ele entra nos Frascos Élficos, na Lente de Labareda e no Cubo de Cristal Corporea.
      Jogue o vidro no portal e junte oito, Herói. Confira os usos no NEI (R/U)!
    tasks:
      - get: "Botania:elfGlass x8"
    rewards:
      - xp: 2

  - id: dispersor_elfico
    title: "Dispersor de Mana Élfico"
    at: [33, -3]
    deps: [graveto_sonhos]
    deps_hidden: [elementium]
    desc: |
      Madeira dos Sonhos e Elementium no lugar de Madeira-viva e Ouro. O §eDispersor Élfico§r dispara rajadas mais rápidas, que vão mais longe antes de perder Mana.

      Troque os dispersores das suas linhas longas, Herói, e sinta a diferença! Confira o formato da receita no NEI (R/U) antes de montar.
    tasks:
      - craft: Botania:spreader:2
    rewards:
      - xp: 3
      - item: "Botania:dreamwood x8"

  - id: melhorias_fagulha
    title: "Melhorias de Fagulha"
    at: [31, -4]
    deps: [po_fada]
    deps_hidden: [fagulha, runa_agua, runa_fogo, runa_terra, runa_ar]
    desc: |
      Pó de Fada + Manasteel + uma runa elemental = uma §eMelhoria de Fagulha§r (só funciona em
      fagulhas sobre poços, uma por fagulha):
      §eDispersiva§r (Água): carrega os itens de Mana dos jogadores próximos.
      §eDominante§r (Fogo): puxa Mana dos poços vizinhos até encher.
      §eRecessiva§r (Terra): empurra toda a Mana do seu poço para os vizinhos.
      §eIsolada§r (Ar): não interage com Dominantes/Recessivas.
    tasks:
      - one_of: [Botania:sparkUpgrade, "Botania:sparkUpgrade:1", "Botania:sparkUpgrade:2", "Botania:sparkUpgrade:3"]
    rewards:
      - xp: 3
      - item: "Botania:spark x2"

  - id: modificador_fagulhas
    title: "Modificador de Fagulhas"
    type: optional
    at: [32, -4]
    deps: [melhorias_fagulha]
    desc: |
      Elementium, Rocha-viva e Redstone. Encostado em poços com fagulhas, o §eModificador de Fagulhas§r guarda uma melhoria e, com sinal de redstone, troca-a pela de uma fagulha conectada escolhida ao acaso.
      Redes de Mana que se reconfiguram sozinhas! Missão opcional, Herói.
    tasks:
      - craft: Botania:sparkChanger
    rewards:
      - loot: incomum

  - id: fole_mana
    title: "Fole da Maré de Mana"
    type: optional
    at: [33, -4]
    deps: [po_fada]
    deps_hidden: [runa_ar]
    desc: |
      Lajes de Madeira-viva, Couro e Runa do Ar. Apontado para um Poço de Mana, o §eFole§r acelera a transferência do poço para Tabletes e outros itens (vários foles somam).
      Clicado à mão, ele também aviva uma Fornalha acesa. Missão opcional, Herói, mas muito prática!
    tasks:
      - craft: Botania:bellows
    rewards:
      - loot: comum

  # ------------------------------------------------------------------ Equipamento de Elementium
  - id: armadura_elementium
    title: "Armadura de Elementium"
    at: [31, 2]
    deps: [elementium]
    desc: |
      As peças de §eElementium§r têm boa resistência (cerca de metade da durabilidade do diamante), se
      consertam com Mana e,
      quando você é atingido, têm chance de invocar uma §eFada§r que ataca o agressor (mais peças, mais
      chance). Conjunto completo: as fadas aplicam efeitos de poção. Esta é a armadura que o Lexica
      recomenda para o Ritual de Gaia!
    tasks:
      - get: [Botania:elementiumHelm, Botania:elementiumChest, Botania:elementiumLegs, Botania:elementiumBoots]
    rewards:
      - xp: 4
      - item: "Botania:manaResource:7 x2"

  - id: picareta_elementium
    title: "Picareta de Elementium"
    at: [32, 2]
    deps: [elementium]
    deps_hidden: [graveto_sonhos]
    desc: |
      Ao minerar, a §ePicareta de Elementium§r destrói o entulho (pedregulho, terra, netherrack…) e deixa só minérios e coisas boas.
      Combine-a com o Terra-Destruidor na bancada para ele ganhar o mesmo poder (irreversível). Faça a sua e cave sem lixo no inventário, Herói!
    tasks:
      - craft: Botania:elementiumPick
    rewards:
      - xp: 3

  - id: pa_elementium
    title: "Pá de Elementium"
    type: optional
    at: [33, 2]
    deps: [elementium]
    deps_hidden: [graveto_sonhos]
    desc: |
      Cavou areia ou cascalho? A §ePá de Elementium§r leva junto a coluna inteira daquele material acima e/ou abaixo.

      Nunca mais cascalho caindo na cabeça, Herói! É uma missão opcional, mas poupa um bocado de tempo em escavações grandes. Confira a receita no NEI (R/U) e boa cavada!
    tasks:
      - craft: Botania:elementiumShovel
    rewards:
      - loot: incomum

  - id: machado_elementium
    title: "Machado de Elementium"
    at: [34, 2]
    deps: [elementium]
    deps_hidden: [graveto_sonhos]
    desc: |
      Também é arma! Dar o golpe final com o §eMachado de Elementium§r em Zumbis, Esqueletos, Creepers ou jogadores tem chance de decapitá-los, derrubando a cabeça (Pilhagem ajuda).
      Guarde este machado, Herói: ele tem uma surpresa reservada para o Guardião de Gaia.
    tasks:
      - craft: Botania:elementiumAxe
    rewards:
      - xp: 3

  - id: tesoura_elementium
    title: "Tesoura de Elementium"
    type: optional
    at: [32, 3]
    deps: [elementium]
    desc: |
      Lã em massa, Herói!

      Segure o clique como se fosse um arco e a §eTesoura de Elementium§r tosquia rapidamente todas as ovelhas numa área grande à sua volta. Confira a receita no NEI (R/U) se precisar. Missão opcional, mas ótima para quem gosta de decoração colorida e de juntar muita lã sem esforço!
    tasks:
      - craft: Botania:elementiumShears
    rewards:
      - loot: incomum

  - id: espada_elementium
    title: "Espada de Elementium"
    at: [33, 3]
    deps: [elementium]
    deps_hidden: [graveto_sonhos]
    desc: |
      A §eEspada de Elementium§r aumenta a chance de Fadas surgirem quando você é atingido (mesmo sem a armadura) e deixa essas fadas mais fortes.
      Fadas causam dano que o Guardião de Gaia aceita… anote isso, Herói! Guarde essa espada e use quando o grande momento chegar.
    tasks:
      - craft: Botania:elementiumSword
    rewards:
      - xp: 3

  # ------------------------------------------------------------------ Artefatos do Fim
  - id: ar_do_fim
    title: "Garrafa de Ar do Fim"
    at: [34, -2]
    deps: [elementium]
    desc: |
      O ar do vazio do Fim tem propriedades mutantes. §eNo Fim§r, clique com um Frasco de Vidro vazio
      no ar para engarrafar §eAr do Fim§r. Arremessado, ele transforma Pedra em Pedra do Fim. Ele é
      ingrediente do Fio-vermelho, da Corporea, da Tiara de Flügel e de várias relíquias élficas —
      encha uns 16 frascos de uma vez.
    tasks:
      - get: "Botania:manaResource:15 x8"
    rewards:
      - xp: 3
      - item: "minecraft:glass_bottle x16"

  - id: fiscalizador_fim
    title: "Fiscalizador do Fim"
    type: optional
    at: [35, 2]
    deps: [ar_do_fim]
    desc: |
      Portas que abrem com um olhar! Olhos do Fim, Obsidiana e Redstone fazem o §eFiscalizador do Fim§r, que emite redstone quando um jogador a até 64 blocos olha diretamente para ele (abóbora na cabeça engana).
      Missão opcional, Herói, mas cheia de truques de redstone!
    tasks:
      - craft: Botania:enderEyeBlock
    rewards:
      - loot: comum

  - id: mao_ender
    title: "Mão do Fim"
    at: [36, 2]
    deps: [ar_do_fim]
    deps_hidden: [perola_mana]
    desc: |
      Pérola de Mana, Couro, Obsidiana e um Baú do Fim. A §eMão do Fim§r abre seu §eBaú do Fim§r de
      qualquer lugar (por Mana); usada em outro jogador, abre o inventário dele (bem mais caro). E
      ainda abastece o Cajado da Crosta Inconstante com o conteúdo do seu Baú do Fim.
    tasks:
      - craft: Botania:enderHand
    rewards:
      - xp: 3

  - id: soulscribe
    title: "Soulscribe"
    type: optional
    at: [37, 2]
    deps: [ar_do_fim]
    deps_hidden: [perola_mana]
    desc: |
      Uma adaga de Manasteel com Pérola de Mana que corta §eEndermen§r como manteiga. A energia dela impede o conserto por Mana, então dura poucas mortes.
      Feita para farmar pérolas no Fim, Herói! Missão opcional, mas ótima para quem precisa de pérolas.
    tasks:
      - craft: Botania:enderDagger
    rewards:
      - loot: incomum

  - id: invocador_monstros
    title: "Invocador de Monstros"
    type: optional
    at: [35, 3]
    deps: [ar_do_fim]
    deps_hidden: [elementium, prismarinho]
    desc: |
      Fazendas de mob sem babá, Herói! Varas de Blaze, Elementium, Prismarinho Escuro, Bloco de Manasteel e Ar do Fim montam o §eInvocador de Monstros§r.
      Colocado em cima de um spawner de monstros e alimentado com bastante Mana, ele faz o spawner funcionar mesmo sem jogadores por perto. Missão opcional!
    tasks:
      - craft: Botania:spawnerClaw
    rewards:
      - loot: incomum

  - id: luminizer
    title: "Luminizer"
    type: optional
    at: [36, 3]
    deps: [ar_do_fim]
    deps_hidden: [fio_vermelho, pedra_draconiana]
    desc: |
      Fio-vermelho, Pedra Draconiana e Pó de Pedra Luminosa. Vincule §eLuminizers§r com a Varinha (alcance de 20 blocos, encadeáveis) e clique num deles para viajar numa trilha de luz até o outro.
      O Lançador Luminizer manda animais e itens; a versão Detectora emite redstone. Missão opcional, Herói!
    tasks:
      - get: Botania:lightRelay
    rewards:
      - loot: incomum

  - id: projetor_estrelas
    title: "Projetor de Estrelas"
    type: optional
    at: [37, 3]
    deps: [ar_do_fim]
    deps_hidden: [elementium, po_fada]
    desc: |
      Elementium, Pó de Fada e Obsidiana: eis o §eProjetor de Estrelas§r. À noite, ele enche o céu de uma área grande com um campo estrelado.
      Romântico, inútil, maravilhoso, Herói! Missão opcional, mas eu adoro. Se esquecer o desenho da receita, o NEI (R/U) mostra. Capriche no lugar onde instalar!
    tasks:
      - craft: Botania:starfield
    rewards:
      - loot: comum

  - id: casulo
    title: "Casulo de Caprice"
    type: optional
    at: [38, 3]
    deps: [ar_do_fim]
    deps_hidden: [po_fada, pedra_draconiana]
    desc: |
      Linha, Pó de Fada e Pedra Draconiana. Colocado no mundo, o §eCasulo§r lentamente "choca" um filhote de animal, geralmente de fazenda, às vezes um lobo ou cavalo.
      Dizem que Esmeraldas dadas ao casulo mudam o resultado… Missão opcional, Herói. Que tal descobrir?
    tasks:
      - craft: Botania:cocoon
    rewards:
      - loot: comum

  - id: abobora_fel
    title: "Abóbora Fel"
    type: optional
    at: [35, 4]
    deps: [ar_do_fim]
    desc: |
      Fazenda de pó sem ir ao Nether! Abóbora, Linha, Osso, Carne Podre e Pólvora fazem a §eAbóbora Fel§r. Coloque-a em cima de duas Barras de Ferro (como um Golem de Neve) e nasce um Blaze que derruba Pó de Blaze em boa quantidade.
      Missão opcional, Herói, e muito prática.
    tasks:
      - craft: Botania:felPumpkin
    rewards:
      - loot: comum

  # ------------------------------------------------------------------ Fio-vermelho
  - id: fio_vermelho
    title: "Fio-vermelho"
    at: [34, -5]
    deps: [ar_do_fim]
    deps_hidden: [po_fada]
    desc: |
      Diz a lenda que os deuses amarram um fio vermelho nos tornozelos de quem deve se encontrar.
      §eLinha, Bloco de Redstone, Pó de Fada e Ar do Fim§r dão o §eFio-vermelho§r. Blocos feitos com ele
      se ligam "pelo ar" ao primeiro bloco compatível na direção para onde apontam (veja o fio com a
      Varinha). Não dá para encadear um no outro.
    tasks:
      - get: "Botania:manaResource:12 x4"
    rewards:
      - xp: 3
      - item: "minecraft:redstone_block x2"

  - id: fio_recipiente
    title: "Recipiente de Fio-vermelho"
    at: [33, -6]
    deps: [fio_vermelho]
    desc: |
      Um "baú remoto" sem canos! O §eRecipiente de Fio-vermelho§r liga-se a qualquer inventário; itens colocados nele (funil, tubo…) vão parar no inventário ligado, entrando pelo mesmo lado.

      Faça o seu, Herói, e conecte seus baús sem fiação. Se tiver dúvida sobre a receita, o NEI (R/U) mostra o caminho.
    tasks:
      - craft: Botania:redStringContainer
    rewards:
      - xp: 2

  - id: fio_ejetor
    title: "Ejetor de Fio-vermelho"
    type: optional
    at: [34, -6]
    deps: [fio_vermelho]
    desc: |
      Liga-se a um Ejetor ou Liberador: o §eEjetor de Fio-vermelho§r recebe itens como o recipiente e, com sinal de redstone, faz o bloco ligado disparar.
      Missão opcional, Herói, mas muito útil para automação à distância. Confira a receita no NEI (R/U).
    tasks:
      - craft: Botania:redStringDispenser
    rewards:
      - loot: comum

  - id: fio_fertilizador
    title: "Fertilizador de Fio-vermelho"
    type: optional
    at: [35, -6]
    deps: [fio_vermelho]
    desc: |
      Farinha de Osso usada no §eFertilizador de Fio-vermelho§r fertiliza o bloco ligado. Perfeito para fertilizar plantas inalcançáveis… ou uma Margarida esquecida no meio da base.

      Missão opcional, Herói, mas dá uma ajuda e tanto. Confira a receita no NEI (R/U) e deixe o jardim sempre florido!
    tasks:
      - craft: Botania:redStringFertilizer
    rewards:
      - loot: comum

  - id: fio_comparador
    title: "Comparador de Fio-vermelho"
    type: optional
    at: [36, -6]
    deps: [fio_vermelho]
    desc: |
      Leitura de nível à distância! O §eComparador de Fio-vermelho§r liga-se a qualquer bloco que um Comparador consegue ler (baús, Poços de Mana, Altar Rúnico…) e repassa esse sinal para um Comparador encostado nele.
      Missão opcional, Herói, mas excelente para circuitos.
    tasks:
      - craft: Botania:redStringComparator
    rewards:
      - loot: comum

  - id: fio_materializador
    title: "Materializador de Fio-vermelho"
    at: [33, -7]
    deps: [fio_vermelho]
    desc: |
      Coloque uma flor com efeito em cima do §eMaterializador§r e ligue-o a outra flor/cogumelo: a flor de cima para de funcionar e o bloco ligado passa a agir como se fosse ela.
      Dá para "teletransportar" a posição de uma flor sem replantar o jardim. Faça o seu, Herói!
    tasks:
      - craft: Botania:redStringRelay
    rewards:
      - xp: 2

  - id: fio_interceptador
    title: "Interceptador de Fio-vermelho"
    type: optional
    at: [34, -7]
    deps: [fio_vermelho]
    desc: |
      Alarmes e campainhas à sua disposição, Herói!

      O §eInterceptador de Fio-vermelho§r liga-se a um bloco complexo (baú, fornalha, Boticário…) e emite um pulso de redstone sempre que alguém clica nesse bloco. Confira a receita no NEI (R/U). Missão opcional, mas ótima para proteger seus tesouros!
    tasks:
      - craft: Botania:redStringInterceptor
    rewards:
      - loot: comum

  # ------------------------------------------------------------------ Corporea
  - id: fagulha_corporea
    title: "Fagulha Corporea"
    type: main
    at: [35, -4]
    deps: [ar_do_fim]
    deps_hidden: [fagulha, po_fada]
    desc: |
      §eCorporea§r é a rede élfica de transporte instantâneo de itens. Uma Fagulha + Pó de Fada + Ar do
      Fim = §eFagulha Corporea§r, que vai em cima de §einventários§r (baús, ejetores…), não de poços.

      Cada rede tem §euma Fagulha Corporea Mestre§r (fagulha corporea + Pedra Draconiana); as fagulhas
      próximas se encadeiam até ela. Pó Floral clicado na fagulha muda a cor: só fagulhas da mesma
      cor formam a mesma rede. Itens só entram na rede fisicamente (funis etc.).
    tasks:
      - get: ["Botania:corporeaSpark x4", "Botania:corporeaSpark:1"]
    rewards:
      - xp: 4
      - choice: ["minecraft:chest x8", "Botania:manaResource:15 x4", "minecraft:hopper x4"]

  - id: indice_corporea
    title: "Índice Corporea"
    type: main
    at: [36, -4]
    deps: [fagulha_corporea]
    deps_hidden: [pedra_draconiana]
    desc: |
      Um cristal com uma Fagulha Corporea em cima: chegue perto do §eÍndice Corporea§r e §eescreva no
      chat§r o que quer — "iron ingot", "10 apples", "a stack of cobblestone", "all diamonds", "count
      redstone"… — e os itens surgem na sua frente! O índice compara com o nome do item; se o nome em
      português não for reconhecido no servidor, tente o nome em inglês. Mais fácil ainda: com o NEI,
      a tecla §eC§r sobre um item pede 1 (Shift = pilha). TAB no chat autocompleta.
    tasks:
      - craft: Botania:corporeaIndex
    rewards:
      - xp: 4
      - item: "minecraft:obsidian x8"

  - id: funil_corporea
    title: "Exaustor Corporea"
    at: [35, -5]
    deps: [fagulha_corporea]
    desc: |
      Liberador + Fagulha Corporea. Com sinal de redstone, o §eExaustor Corporea§r pede à rede um dos
      itens das Molduras de Item presas nele (girar a moldura muda a quantidade: 1, 16, 32, 64) e o
      deposita no inventário 1–2 blocos abaixo — ou solta no chão.
    tasks:
      - craft: Botania:corporeaFunnel
    rewards:
      - xp: 3

  - id: interceptador_corporea
    title: "Interceptador Corporea"
    type: optional
    at: [36, -5]
    deps: [fagulha_corporea]
    desc: |
      Bloco de Redstone + Fagulha Corporea. Quando alguém pede à rede um item (das Molduras presas nele) que não existe, o §eInterceptador Corporea§r emite um pulso.
      Perfeito para disparar um Caixote Inteligente que fabrica o que falta. Missão opcional, Herói, para quem curte automação!
    tasks:
      - craft: Botania:corporeaInterceptor
    rewards:
      - loot: incomum

  - id: cubo_corporea
    title: "Cubo de Cristal Corporea"
    type: optional
    at: [37, -5]
    deps: [fagulha_corporea]
    deps_hidden: [vidro_elfico]
    desc: |
      Clique com um item no §eCubo de Cristal§r (com fagulha) e ele mostra quantos existem na rede; clique esquerdo pede um, agachado pede uma pilha. Um Comparador lê a quantidade em escala logarítmica.
      Missão opcional, Herói, mas deixa o armazenamento muito mais visual.
    tasks:
      - craft: Botania:corporeaCrystalCube
    rewards:
      - loot: incomum

  - id: retentor_corporea
    title: "Retentor Corporea"
    type: optional
    at: [38, -5]
    deps: [interceptador_corporea]
    desc: |
      Baú mais Fagulha Corporea formam o §eRetentor Corporea§r. Ao lado de um Interceptador, ele memoriza o pedido que falhou; quando recebe redstone, refaz o pedido original.
      Autocrafting sob demanda completo: pediu, faltou, fabricou, entregou. Missão opcional, Herói, e uma maravilha da engenharia! Confira a receita no NEI (R/U) antes de montar.
    tasks:
      - craft: Botania:corporeaRetainer
    rewards:
      - loot: incomum

  # ------------------------------------------------------------------ O Ritual de Gaia
  - id: pilone_gaia
    title: "Pilão de Gaia"
    type: main
    at: [34, 0]
    deps: [elementium]
    deps_hidden: [po_fada, pilone_mana]
    desc: |
      Um Pilão de Mana com §eduas Barras de Elementium e dois Pós de Fada§r: o §ePilão de Gaia§r. São os
      catalisadores do Ritual de Gaia — você vai precisar de §equatro§r. Eles também servem de base
      para o Dispersor Natural do Advanced Botany, lá na frente.
    tasks:
      - get: "Botania:pylon:2 x4"
    rewards:
      - xp: 5
      - choice: ["Botania:manaResource:7 x4", "Botania:manaResource:8 x4", "minecraft:gold_ingot x8"]

  - id: sinalizador
    title: "O Altar: um Sinalizador"
    at: [35, 1]
    deps: [pilone_gaia]
    desc: |
      O altar do ritual é um §eSinalizador§r (Beacon). Para fabricá-lo você precisa de uma §eEstrela do
      Nether§r — ou seja, de derrotar o Wither (veja o capítulo do Nether). O Lexica pede um
      sinalizador §eativo§r: monte a pirâmide de blocos de minério embaixo dele.
      §aDica:§r faça a pirâmide e a arena num lugar plano e aberto, longe da base.
    tasks:
      - get: minecraft:beacon
    rewards:
      - xp: 3
      - item: "minecraft:iron_block x9"

  - id: info_ritual_gaia
    title: "Ritual de Gaia: Preparação e Regras"
    type: info
    at: [36, -1]
    deps: [pilone_gaia]
    desc: |
      §cLeia com calma, Herói. Este é um dos chefes mais duros do Registro.§r

      §eO altar:§r Sinalizador ativo + §e4 Pilões de Gaia§r um bloco §eacima§r do sinalizador, nas
      diagonais, a 4 blocos em X e 4 em Z (posições ±4, +1, ±4).
      §eA arena:§r um círculo de §e12 blocos de raio§r em volta do sinalizador com chão firme perto da
      altura dele e pelo menos 3 blocos livres acima, sem paredes, pilares ou buracos grandes. Se a
      área estiver errada, o sinalizador recusa o sacrifício com uma mensagem vermelha. Não
      funciona no modo Pacífico. Armadilhas de urso (OpenBlocks) e ímãs (Thaumic Tinkerer) na arena
      são destruídos.
      §eInvocação:§r agachado + clique no sinalizador com uma §eBarra de Terrasteel§r (Gaia I) ou uma
      §eBarra de Espírito de Gaia§r (Gaia II). Afaste-se: ele carrega por alguns segundos.

      §eRegras da luta:§r só conta §edano corpo a corpo de jogadores de verdade§r (e das Fadas da
      armadura/espada de Elementium) — flechas, magias, torres e "jogadores falsos" de máquinas não
      ferem. Cada golpe é limitado (40 de dano, 60 no crítico). Vida: §e800 por jogador§r na arena.
      Os efeitos do Sinalizador são anulados (poções botânicas valem!). Quem sai do círculo é puxado
      de volta. Fuja das §dmanchas roxas§r (Armadilhas de Gaia). Abaixo de 20% de vida ele fica
      invulnerável e chama §eondas de Zumbis, Esqueletos (alguns Wither) e Bruxas§r — limpe tudo e volte a bater.
      Com mais de 5 jogadores vira caos: não recomendado.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: gaia1
    title: "Guardião de Gaia"
    type: boss
    at: [36, 0]
    deps: [pilone_gaia, sinalizador, info_ritual_gaia]
    deps_hidden: [terrasteel]
    banner: "Guardião de Gaia derrotado!"
    subtitle: "O Ritual de Gaia I"
    desc: |
      O teste final dos botânicos élficos. Ofereça a §eBarra de Terrasteel§r e o §eGuardião de Gaia§r —
      um reflexo seu — desce sobre a arena. Ele se teletransporta, dispara mísseis mágicos e espalha
      armadilhas roxas.

      §eLeve:§r Armadura de Elementium encantada, Lâmina da Terra (ou Espada de Elementium para mais
      fadas), Frascos de Cura/Revitalização/Vigor, comida e um Bracelete de Mana cheio. Ataque em
      sequência, mova-se sempre e §cnão fique parado nas manchas roxas§r.

      Recompensa: §eEspíritos de Gaia§r (8 para quem bateu primeiro, 6 para cada outro participante) e
      chance de um Disco de Música. Eu sabia que você conseguia!
    tasks:
      - kill: "Botania.botania:doppleganger x1"
      - get: "Botania:manaResource:5 x4"
    rewards:
      - xp: 10
      - loot: epico

  - id: barra_espirito_gaia
    title: "Barra de Espírito de Gaia"
    type: main
    at: [38, 0]
    deps: [gaia1]
    desc: |
      Terrasteel e Espírito de Gaia se anulam quando fundidos: §euma Barra de Terrasteel cercada por
      quatro Espíritos de Gaia§r vira uma §eBarra de Espírito de Gaia§r — inútil como metal… mas com
      tanta energia concentrada que invoca um §cGuardião muito mais forte§r. Prepare-se antes de usá-la.
    tasks:
      - craft: Botania:manaResource:14
    rewards:
      - xp: 5
      - choice: ["Botania:manaResource:4", "minecraft:golden_apple x4", "Botania:manaResource:2 x4"]

  - id: gaia2
    title: "Guardião de Gaia II"
    type: boss
    at: [40, 0]
    deps: [barra_espirito_gaia]
    banner: "Gaia II derrotado!"
    subtitle: "O Ritual de Gaia II"
    effect: 4
    desc: |
      A revanche. Ofereça a §eBarra de Espírito de Gaia§r ao sinalizador e o Guardião volta mais
      resistente (recebe só 60% do dano), mais forte e mais rápido, com mais Bruxas nas ondas. As
      regras da arena são as mesmas — releia o guia do ritual.

      A recompensa vale cada gota de suor: §eEspíritos de Gaia§r (16 para o primeiro, 10 para os demais),
      uma §eVontade dos Antigos§r garantida, o §eDado do Destino§r (relíquias!) e chances de Lótus Negra,
      Semente do Super-crescimento, pilhas de Manasteel, Pérolas e Diamantes de Mana, runas e até o
      Pinkinator.

      Esta vitória ecoa no Registro inteiro: é uma das provas do §dSelo Arcano§r.
    tasks:
      - kill: "Botania.botania:doppleganger x1"
      - get: "Botania:ancientWill:*"
    rewards:
      - xp: 15
      - loot: [epico, epico]

  # ------------------------------------------------------------------ Tesouros de Gaia
  - id: dispersor_gaia
    title: "Dispersor de Mana de Gaia"
    at: [37, -2]
    deps: [gaia1]
    deps_hidden: [dispersor_elfico, pedra_draconiana]
    desc: |
      O melhor dispersor do mod! Dispersor Élfico + Espírito de Gaia + Pedra Draconiana fazem o §eDispersor de Gaia§r, superior em praticamente tudo: rajadas maiores, mais rápidas e mais longas.
      Faça o seu, Herói, e deixe sua rede de Mana no topo!
    tasks:
      - craft: Botania:spreader:3
    rewards:
      - xp: 4

  - id: tiara_flugel
    title: "Tiara de Flügel"
    type: main
    at: [38, -2]
    deps: [gaia1]
    deps_hidden: [elementium, ar_do_fim]
    desc: |
      Os Flügel eram uma raça alada criada para matar deuses. Com §equatro Espíritos de Gaia§r, Elementium,
      Penas e Ar do Fim você recria um pedacinho desse poder: a §eTiara de Flügel§r dá §evoo§r usando Mana.

      A barra de voo dura uns 30 segundos antes de precisar recarregar. Correr (Ctrl) voando dá um
      §eimpulso§r; agachar caindo §eplana§r e evita dano de queda. Na bancada, a tiara + um tipo de
      quartzo muda as asas.
    tasks:
      - craft: Botania:flightTiara:*
    rewards:
      - xp: 6
      - item: "Botania:quartz:5 x4"

  - id: coroa_laurel
    title: "Coroa Dourada de Laurel"
    at: [39, -2]
    deps: [gaia1]
    desc: |
      Uma segunda chance, Herói! Ouro, Folhas e um Espírito de Gaia fazem a §eCoroa de Laurel§r. Se você morrer usando a coroa, ela se despedaça e te devolve toda a vida, com alguns instantes de invencibilidade.
      Leve uma para o Gaia II!
    tasks:
      - craft: Botania:goldenLaurel
    rewards:
      - xp: 4

  - id: encanto_diva
    title: "Encanto da Diva"
    type: optional
    at: [40, -2]
    deps: [gaia1]
    deps_hidden: [pequeno_planeta, runa_orgulho]
    desc: |
      Espíritos de Gaia, Ouro, Pequeno Planeta e Runa do Orgulho. Com o §eEncanto da Diva§r, o mob que você atacar passa a obedecer sua vontade e ataca os inimigos próximos.

      Charme irresistível, Herói! Confira o formato da receita no NEI (R/U). Missão opcional, mas diverte demais em qualquer batalha.
    tasks:
      - craft: Botania:divaCharm
    rewards:
      - loot: incomum

  - id: pingente_carmesim
    title: "Pingente Carmesiano"
    at: [41, -2]
    deps: [gaia1]
    deps_hidden: [pingente_piroclasta]
    desc: |
      Pingente do Piromântico + Varas de Blaze + Tijolos do Nether + Espírito de Gaia. O §ePingente Carmesiano§r dá imunidade total a fogo e lava.
      Nadar em lava nunca foi tão relaxante, Herói! Faça o seu e passeie pelo Nether sem medo.
    tasks:
      - craft: Botania:superLavaPendant
    rewards:
      - xp: 4

  - id: cinta_globetrotter
    title: "Cinta do Viajante Mundial"
    type: optional
    at: [42, -2]
    deps: [gaia1]
    deps_hidden: [cinta_viajante, elementium]
    desc: |
      Cinta de Soujourner + Elementium + Espírito de Gaia. A §eCinta do Viajante Mundial§r é a versão turbinada: velocidades que a original nem sonha.

      Missão opcional, Herói, mas se você ama correr, vai adorar. Confira a receita no NEI (R/U) e prepare-se para cruzar o mundo num piscar de olhos!
    tasks:
      - craft: Botania:superTravelBelt
    rewards:
      - loot: incomum

  - id: capas_julgamento
    title: "Capas do Julgamento"
    type: optional
    at: [43, -2]
    deps: [gaia1]
    desc: |
      Lã, Pedra Luminosa (ou Redstone) e Espírito de Gaia. A §eCapa da Virtude§r (branca) bloqueia por
      completo um golpe recebido (exceto mágico); a §eCapa do Pecado§r (preta) devolve o dano recebido
      aos monstros próximos. Ambas recarregam por 10 segundos e vão no espaço de cinto.
    tasks:
      - one_of: [Botania:holyCloak, Botania:unholyCloak]
    rewards:
      - loot: incomum

  - id: talisma_buraco_negro
    title: "Talismã do Buraco-negro"
    at: [37, -3]
    deps: [gaia1]
    deps_hidden: [elementium, ar_do_fim]
    desc: |
      Mineradores, chorem de alegria! Espírito de Gaia, Elementium e Ar do Fim fazem o §eTalismã do Buraco-negro§r, que guarda uma quantidade praticamente infinita de um único tipo de bloco (pedregulho, terra…).
      Faça o seu, Herói, e sua mochila nunca mais vai encher!
    tasks:
      - craft: Botania:blackHoleTalisman
    rewards:
      - xp: 4

  - id: hera_eterna
    title: "Hera Eterna"
    at: [38, -3]
    deps: [gaia1]
    deps_hidden: [elementium]
    desc: |
      Vinha, Espírito de Gaia e Elementium. Junte a §eHera Eterna§r a praticamente qualquer item na bancada e ele passa a se consertar com Mana, como as ferramentas do Botania.
      Sua picareta favorita de outro mod agradece, Herói. Faça a sua e esqueça o desgaste!
    tasks:
      - get: Botania:regenIvy
    rewards:
      - xp: 4

  - id: agregador_vida
    title: "Agregador de Vida"
    type: optional
    at: [39, -3]
    deps: [gaia1]
    deps_hidden: [elementium, ar_do_fim, pedra_draconiana]
    desc: |
      Espíritos de Gaia, Elementium, Ar do Fim e Pedra Draconiana. O §eAgregador de Vida§r captura um spawner de monstros e permite recolocá-lo em outro lugar.
      Ele se quebra depois de um uso, então escolha bem o destino, Herói. Missão opcional!
    tasks:
      - craft: Botania:spawnerMover
    rewards:
      - loot: incomum

  - id: cajado_reservatorio
    title: "Cajado do Depósito Instável"
    type: optional
    at: [40, -3]
    deps: [gaia1]
    deps_hidden: [pedra_draconiana, graveto_sonhos]
    desc: |
      A resposta para hordas! Espíritos de Gaia, Pedras Draconianas e Gravetos de Madeira dos Sonhos fazem o §eCajado do Depósito Instável§r. Canalize e incontáveis mísseis arcanos perseguem os inimigos ao redor, a um custo pesado de Mana.
      Missão opcional, Herói!
    tasks:
      - craft: Botania:missileRod
    rewards:
      - loot: incomum

  - id: carga_manastorm
    title: "Carga de Manastorm"
    type: optional
    at: [41, -3]
    deps: [gaia1]
    desc: |
      Madeira-viva, TNT e um Espírito de Gaia. Atingida por uma rajada de Mana, a §eCarga de Manastorm§r cria um epicentro instável que dispara rajadas explosivas por um bom tempo.
      §cSó um maníaco usaria isso perto de algo que ama.§r Você foi avisado, Herói!
    tasks:
      - get: Botania:manaBomb
    rewards:
      - loot: incomum

  - id: fragmento_laputa
    title: "Fragmento de Laputa"
    type: optional
    at: [42, -3]
    deps: [gaia1]
    deps_hidden: [flores_flutuantes, prismarinho, pedra_draconiana]
    desc: |
      Espíritos de Gaia, uma Flor Flutuante, Prismarinho, Pedra Draconiana e Runas do Ar e da Terra.
      Usado no chão, o §eFragmento de Laputa§r §elevanta uma esfera de terreno§r para o céu (pode levar
      uns dez minutos). Mais Espíritos de Gaia na bancada aumentam o nível — e o tamanho da ilha.
    tasks:
      - get: "Botania:laputaShard:*"
    rewards:
      - loot: incomum

  - id: laminas_estelares
    title: "Starcaller e Thundercaller"
    at: [27, 3]
    deps: [terra_blade]
    deps_hidden: [ar_do_fim, elementium]
    desc: |
      Uma Lâmina da Terra + Ar do Fim + Elementium + (Pedra Draconiana ou Diamante de Mana). A
      §eStarcaller§r às vezes invoca uma §eestrela cadente§r onde você mira; a §eThundercaller§r troca o
      feixe por §erelâmpagos em cadeia§r que pulam entre os monstros. (Os encantamentos da Lâmina da
      Terra se perdem na receita.)
    tasks:
      - one_of: [Botania:starSword, Botania:thunderSword]
    rewards:
      - xp: 5

  # ------------------------------------------------------------------ Espólios do Gaia II e Relíquias
  - id: cabeca_gaia
    title: "Cabeça do Guardião"
    type: optional
    at: [38, 2]
    deps: [gaia1]
    deps_hidden: [machado_elementium]
    desc: |
      Lembra da surpresa do Machado de Elementium? Dê o golpe final no Guardião de Gaia com ele e há uma pequena chance (maior com Pilhagem) de ele derrubar a §eCabeça do Guardião de Gaia§r.
      Troféu de respeito na parede, Herói! Missão opcional, mas vale a tentativa.
    tasks:
      - get: Botania:gaiaHead
    rewards:
      - loot: incomum

  - id: discos_gaia
    title: "Trilha Sonora de Gaia"
    type: optional
    at: [39, 2]
    deps: [gaia1]
    desc: |
      Os Guardiões às vezes deixam cair um §eDisco de Música§r com a trilha da batalha ("Endure Emptiness" no Gaia I, "Fight For Quiescence" no Gaia II).
      Para relembrar a luta em paz, na base, Herói. Missão opcional, mas que trilha sonora!
    tasks:
      - one_of: [Botania:recordGaia1, Botania:recordGaia2]
    rewards:
      - loot: incomum

  - id: vontades_antigas
    title: "Vontades dos Antigos"
    at: [40, 2]
    deps: [gaia2]
    deps_hidden: [armadura_terrasteel]
    desc: |
      O Gaia II sempre deixa uma §eVontade§r: Ahrim, Dharok, Guthan, Torag, Verac ou Karil. Junte a
      vontade ao §eElmo de Terrasteel§r na bancada; com o conjunto de Terrasteel completo, seus golpes
      críticos ganham o poder dela — Fraqueza (Ahrim), mais dano com pouca vida (Dharok), roubo de vida
      (Guthan), Lentidão (Torag), ignorar armadura (Verac) ou Apodrecimento (Karil). Dá para pôr várias.
    tasks:
      - get: "Botania:ancientWill:*"
    rewards:
      - xp: 5

  - id: lotus_negra
    title: "Lótus Negra"
    type: optional
    at: [41, 2]
    deps: [gaia2]
    desc: |
      Uma flor que não cresce nem se reproduz, recheada de Mana. Jogue a §eLótus Negra§r num Poço de Mana que já tenha alguma Mana e ela libera §e8.000§r de uma vez; a Lótus Profunda libera §e100.000§r.
      O Gaia II deixa algumas, Herói! Missão opcional.
    tasks:
      - get: "Botania:blackLotus:*"
    rewards:
      - loot: incomum

  - id: semente_supercrescimento
    title: "Semente do Super-crescimento"
    type: optional
    at: [39, 3]
    deps: [gaia2]
    desc: |
      Rara: cai do Gaia II e aparece em estruturas antigas. Clique com a §eSemente do Super-crescimento§r num bloco de Grama para criar Solo Encantado: flores plantadas nele funcionam com o dobro da velocidade, e flores passivas simplesmente nunca murcham.
      Coloque sua melhor flor nele, Herói!
    tasks:
      - get: Botania:overgrowthSeed
    rewards:
      - loot: incomum

  - id: dado_destino
    title: "O Dado do Destino"
    type: main
    at: [42, 0]
    deps: [gaia2]
    desc: |
      "Quem rolar o Dado do Destino será recompensado com os Presentes dos Deuses." O §eDado do Destino§r
      do Gaia II é seu e de mais ninguém. Clique para rolar: ele vira uma das seis §eRelíquias dos
      Aesir§r que você ainda não tem (o resultado depende da fase da lua). Se você já tiver todas,
      o dado some.

      Relíquias são §evinculadas a quem as ganhou§r — não adianta emprestar. Proteja-as com Hera Resoluta!
    tasks:
      - one_of: [Botania:infiniteFruit, Botania:kingKey, Botania:flugelEye, Botania:thorRing, Botania:odinRing, Botania:lokiRing]
    rewards:
      - xp: 8
      - choice: ["Botania:keepIvy x2", "Botania:manaResource:5 x4", "Botania:manaRingGreater:1000"]

  - id: fruta_grisaia
    title: "A Fruta de Grisaia"
    type: optional
    at: [43, 2]
    deps: [dado_destino]
    desc: |
      Uma maçã que nunca acaba, que sonho!

      A §eFruta de Grisaia§r é comida como qualquer outra, mas consome Mana do inventário em vez de sumir. Isso quer dizer que, com mana por perto, o lanche está garantido. Confira a receita no NEI (R/U). Fome, nunca mais, Herói (espero que você goste de maçã). Missão opcional!
    tasks:
      - get: Botania:infiniteFruit
    rewards:
      - loot: incomum

  - id: chave_rei
    title: "Chave das Leis do Rei"
    type: optional
    at: [44, 2]
    deps: [dado_destino]
    desc: |
      Segure o clique e a §eChave das Leis do Rei§r materializa até vinte armas no ar atrás de você; solte e elas disparam, uma a uma, para onde você olha, explodindo no impacto.
      Um portão do tesouro só seu, Herói! Missão opcional, mas um espetáculo.
    tasks:
      - get: Botania:kingKey
    rewards:
      - loot: incomum

  - id: olho_flugel
    title: "Olho de Flügel"
    type: optional
    at: [45, 2]
    deps: [dado_destino]
    desc: |
      Agachado + clique vincula o §eOlho de Flügel§r a um lugar; depois, segure o clique para ser
      §echamado de volta§r para lá (custa Mana e não funciona entre dimensões). Ter o olho no inventário
      ainda deixa a Tiara de Flügel voar além do limite normal, por um custo maior.
    tasks:
      - get: Botania:flugelEye
    rewards:
      - loot: incomum

  - id: anel_thor
    title: "Anel de Thor"
    type: optional
    at: [43, 1]
    deps: [dado_destino]
    desc: |
      O poder do Deus do Trovão! Com o §eAnel de Thor§r equipado, a mineração em área do Terra-Destruidor fica drasticamente mais forte. É um dos três anéis dos Aesir.
      Missão opcional, Herói, mas vale cada esforço para quem quer minerar em grande estilo.
    tasks:
      - get: Botania:thorRing
    rewards:
      - loot: incomum

  - id: anel_odin
    title: "Anel de Odin"
    type: optional
    at: [44, 1]
    deps: [dado_destino]
    desc: |
      A vitalidade do Pai de Todos, Herói! O §eAnel de Odin§r dá §e+10 corações§r e proteção contra afogamento, sufocamento, fogo e fome. (A resistência a fogo está ligada nesta config.)
      É um dos três anéis dos Aesir. Missão opcional, mas muito poderosa!
    tasks:
      - get: Botania:odinRing
    rewards:
      - loot: incomum

  - id: anel_loki
    title: "Anel de Loki"
    type: optional
    at: [45, 1]
    deps: [dado_destino]
    desc: |
      O truque do Deus da Trapaça: com a mão vazia, agachado, clique num bloco de origem e depois em
      outros para marcar posições relativas; ao colocar um bloco agachado, ele é copiado em todas as
      posições (e o Terra-Destruidor/Truncador quebram nelas também). Cada bloco custa Mana — mais
      posições, mais caro.
    tasks:
      - get: Botania:lokiRing
    rewards:
      - loot: incomum

  - id: anel_aesir
    title: "Anel dos Aesir"
    type: milestone
    at: [46, 0]
    deps: [anel_thor, anel_odin, anel_loki]
    banner: "Anel dos Aesir"
    subtitle: "Como os Deuses dizem"
    desc: |
      Três anéis, três deuses, um destino. Combine o §eAnel de Thor§r, o §eAnel de Odin§r e o §eAnel de
      Loki§r na bancada e eles se fundem no §eAnel dos Aesir§r, que reúne os poderes dos três num único
      espaço.

      Para chegar aqui você derrotou o Guardião de Gaia várias vezes e rolou o Dado do Destino até os
      deuses se renderem. Herói… você reescreveu o Volume das Flores Vivas inteirinho. Os elfos de
      Elven Garde mandam lembranças — e eu mando um abraço enorme.
    tasks:
      - get: Botania:aesirRing
    rewards:
      - xp: 12
      - kit: {name: "Tesouro de Elven Garde", items: ["Botania:manaResource:5 x8", "Botania:storage:2 x2", "Botania:blackLotus:1", "Botania:manaResource:9 x4"]}
      - loot: epico

  # ------------------------------------------------------------------ Conteúdo Diverso e decoração
  - id: info_decoracao
    title: "Conteúdo Diverso"
    type: info
    at: [3, 10]
    deps_hidden: [decor_viva]
    desc: |
      A Lexica tem uma categoria inteira de §eConteúdo Diverso§r: quartzos coloridos, tijolos novos, azulejos portugueses, pavimentos, prismarinho, blocos do Fim e alguns truques curiosos.
      Nada disso é obrigatório, mas o seu templo élfico merece, Herói! Dê uma espiada nela e escolha o que combina com sua base.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: quartzos
    title: "Quartzos Decorativos"
    type: optional
    at: [1, 11]
    deps: [info_decoracao]
    desc: |
      Oito Quartzos do Nether em volta de um "tempero" criam quartzos novos: Carvão Vegetal = §eQuartzo
      Escuro§r, Pó de Blaze = §eFlamejante§r, Allium (flor roxa) = §eLavanda§r, Redstone = §eQuartzo-
      vermelho§r, Girassol = §eSolar§r. O §eQuartzo de Mana§r sai do poço (250 de Mana) e o §eÉlfico§r da troca
      com os elfos. Todos viram blocos, pilares e escadas.
    tasks:
      - one_of: [Botania:quartz, "Botania:quartz:1", "Botania:quartz:2", "Botania:quartz:3", "Botania:quartz:4", "Botania:quartz:6"]
    rewards:
      - loot: comum

  - id: tijolos_botania
    title: "Tijolos e Azulejos"
    type: optional
    at: [2, 11]
    deps: [info_decoracao]
    desc: |
      Tijolos de Pedra cercados de Netherrack, Areia de Almas ou Neve viram §eTijolos Infernais, da Alma
      ou Invernais§r; há também Ladrilhos de telhado, Palha, Bloco de Cana e uma coleção de §eAzulejos§r
      portugueses. O autor do mod é português — dá para sentir o carinho!
    tasks:
      - one_of: [Botania:customBrick, "Botania:customBrick:1", "Botania:customBrick:2", "Botania:customBrick:3", "Botania:customBrick:4"]
    rewards:
      - loot: comum

  - id: prismarinho_blocos
    title: "Blocos de Prismarinho"
    type: optional
    at: [3, 11]
    deps: [info_decoracao]
    deps_hidden: [prismarinho]
    desc: |
