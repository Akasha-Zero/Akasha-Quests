chapter:
  id: thaumcraft2
  title: "Thaumcraft II — O Taumaturgo"
  prefix: ""
  order: 501
  icon: Thaumcraft:ItemEldritchObject:3
  desc: |
    §dO Volume da Taumaturgia, segunda parte.§r Amuletos e cajados, proteção rúnica,
    encantamentos por infusão, nós energizados, golemancia avançada, Warp, Mácula e os
    mistérios Eldritch das Terras Exteriores. (Thaumcraft 4.2.3.5)

quests:
  - link: thaumcraft:aprendiz_completo

  # ======================================================================
  # FASE 0 — O TAUMATURGO
  # ======================================================================
  - id: taumaturgo
    title: "O Taumaturgo"
    type: info
    deps_hidden: [thaumcraft:infusao]
    icon: Thaumcraft:ItemEldritchObject:3
    desc: |
      Bem-vindo de volta, Herói. Se você chegou aqui, já sabe infundir objetos no altar. Agora
      a coisa fica séria — e um pouco perigosa.

      Neste capítulo:
      §e•§r Primal Charm, cajados e amuletos de vis.
      §e•§r Proteção rúnica e encantamentos feitos no altar.
      §e•§r Nós energizados, relés de vis e o Manipulador Focal.
      §e•§r Golens avançados.
      §e•§r O §cWarp§r, a §cMácula§r e o caminho §dEldritch§r até as Terras Exteriores.

      §cAviso honesto:§r muitas pesquisas daqui deixam marcas na mente. Eu vou avisar sempre.
    tasks:
      - check
    rewards:
      - xp: 2

  # ======================================================================
  # FASE 1 — PRIMAL CHARM, CAJADOS E VIS PORTÁTIL
  # ======================================================================
  - id: primal_charm
    title: "Primal Charm"
    type: main
    deps: [taumaturgo]
    icon: Thaumcraft:ItemResource:15
    desc: |
      O §ePrimal Charm§r (Amuleto Primal) não faz nada sozinho: ele §ecanaliza§r energia
      primal, e por isso aparece em cajados, cetros, no Pedestal de Recarga, no Manipulador
      Focal e em vários addons.

      Na Mesa Arcana (pesquisa Basic Artifacing, aba Artifício): um estilhaço de cada primal
      nas fileiras de cima e de baixo, ouro e um estilhaço equilibrado no meio. Custa §e25 de
      cada primal§r. Faça §e3§r.
    tasks:
      - get: Thaumcraft:ItemResource:15 x3
    rewards:
      - xp: 4
      - choice: [Thaumcraft:ItemShard:6 x4, minecraft:gold_ingot x6, Thaumcraft:ItemResource:14 x4]

  - id: cetro
    title: "Cetro de Manufatura"
    type: optional
    deps: [primal_charm]
    icon: Thaumcraft:WandCasting:128
    desc: |
      Uma varinha só para fabricar: o §eCetro§r não aceita focos, mas guarda §e50% a mais§r de
      vis e dá §e10% de desconto extra§r em receitas arcanas. Na Mesa Arcana: três pontas
      iguais, a haste no meio e um Primal Charm no canto superior direito. O custo é 1,5× o de
      uma varinha. Pesquisa: Crafting Scepters.
    tasks:
      - {get: 'Thaumcraft:WandCasting:* {sceptre:1b}', nbt: true}
    rewards:
      - loot: incomum

  - id: nucleo_cajado_greatwood
    title: "Núcleo de Cajado de Greatwood"
    type: normal
    deps: [primal_charm]
    icon: Thaumcraft:WandRod:50
    desc: |
      Cajados são varinhas grandes: guardam muito mais vis e servem até como arma, mas não
      podem ser usados na Mesa Arcana. Duas Hastes de Greatwood na diagonal + um Primal Charm
      = §eNúcleo de Cajado de Greatwood§r (125 de vis). Monte o cajado com duas pontas, como
      uma varinha. Pesquisa: Magic Staves.
    tasks:
      - get: Thaumcraft:WandRod:50
    rewards:
      - xp: 3
      - item: Thaumcraft:WandRod x2

  - id: cajado_silverwood
    title: "Cajado de Silverwood"
    type: main
    deps: [nucleo_cajado_silverwood]
    icon: Thaumcraft:WandRod:52
    desc: |
      Duas Hastes de Silverwood e um Primal Charm formam o §eNúcleo de Cajado de Silverwood§r, com §e250 de vis§r por primal.

      Monte com pontas de táumio para ter um reservatório enorme para os focos e para o ritual do Oculus. É o upgrade de capacidade que todo mago merece, Herói! Se faltar alguma peça, aperte R no NEI. Que o vis te acompanhe!
    tasks:
      - {get: 'Thaumcraft:WandCasting:* {rod:"silverwood_staff"}', nbt: true}
    rewards:
      - xp: 4
      - choice: [Thaumcraft:ItemResource:15, Thaumcraft:ItemShard:6 x4, Thaumcraft:ItemResource:14 x4]

  - id: pedestal_recarga
    title: "Pedestal de Recarga de Varinha"
    type: main
    deps: [primal_charm]
    icon: Thaumcraft:blockStoneDevice:5
    desc: |
      Chega de correr atrás de nós! O §ePedestal de Recarga§r (Pedestal Arcano infundido com
      ouro, diamantes e um Primal Charm) recarrega sozinho a varinha colocada nele, puxando vis
      dos nós por perto. Ele não esgota o nó (a não ser com varinha de madeira e ferro).

      Pesquisa: Wand Recharge Pedestal (exige Infusão, Preservação e Estabilizador de Nós).
      Neste pack ele também puxa CV de relés de vis.
    tasks:
      - get: Thaumcraft:blockStoneDevice:5
    rewards:
      - xp: 4
      - choice: [minecraft:diamond x2, Thaumcraft:ItemResource:15, minecraft:gold_ingot x6]

  - id: foco_composto
    title: "Foco de Recarga Composto"
    type: optional
    deps: [pedestal_recarga]
    icon: Thaumcraft:blockStoneDevice:8
    desc: |
      Colocado sobre o Pedestal de Recarga, o foco deixa a varinha drenar também os §easpectos compostos§r dos nós. Cada ponto composto vira 1 ponto primal, e o resto se perde.

      É uma missão opcional, Herói, mas bem interessante para quem recarrega a varinha em nós ricos. Confira a receita no NEI (R/U) e experimente num nó próximo. Magia sem desperdício!
    tasks:
      - get: Thaumcraft:blockStoneDevice:8
    rewards:
      - loot: comum

  - id: amuleto_vis
    title: "Amuleto de Vis"
    type: normal
    deps: [pedestal_recarga]
    icon: Thaumcraft:ItemAmuletVis:1
    desc: |
      Um Amuleto Mundano infundido com Primal Charms e Cachos Mistos de Cristal: o §eAmuleto de
      Armazenamento de Vis§r guarda vis e recarrega a varinha no seu cinto de Baubles (neste
      pack, em todo o inventário). Ele só recarrega no Pedestal ou perto de relés.

      Também alimenta a Proteção Rúnica e o encantamento Reparo.
    tasks:
      - get: Thaumcraft:ItemAmuletVis:1
    rewards:
      - xp: 3
      - item: Thaumcraft:blockCrystal:6

  # ======================================================================
  # FASE 2 — PROTEÇÃO RÚNICA
  # ======================================================================
  - id: anel_runico
    title: "Anel de Proteção Rúnica"
    type: main
    deps: [taumaturgo]
    icon: Thaumcraft:ItemRingRunic:1
    desc: |
      A §eProteção Rúnica§r é um escudo invisível com pontos próprios: o dano bate nele antes de
      você. Ele se recarrega gastando §eAer e Terra§r das varinhas (ou do amuleto de vis) que você
      carrega. Não protege de afogamento, fome e afins.

      Anel Mundano infundido com Primal Charm, âmbar, tecido encantado, nitor e ferramenta de
      escrita. Pesquisa: Runic Shielding (aba Artifício).
    tasks:
      - get: Thaumcraft:ItemRingRunic:1
    rewards:
      - xp: 4
      - choice: [Thaumcraft:ItemResource:6 x4, Thaumcraft:ItemResource:7 x4, Thaumcraft:ItemResource:1 x4]

  - id: amuleto_runico
    title: "Amuleto de Proteção Rúnica"
    type: normal
    deps: [anel_runico]
    icon: Thaumcraft:ItemAmuletRunic
    desc: |
      A versão de amuleto guarda mais carga que o anel, Herói. A receita segue a mesma lógica, com mais nitor.

      Os pontos de todas as peças rúnicas se somam, então cada peça que você faz reforça o escudo. Confira a receita no NEI (R/U) e separe o nitor com antecedência. Proteção em dobro faz toda a diferença nas aventuras perigosas!
    tasks:
      - get: Thaumcraft:ItemAmuletRunic
    rewards:
      - xp: 3
      - item: Thaumcraft:ItemResource:6 x2

  - id: cinto_runico
    title: "Cinto de Proteção Rúnica"
    type: normal
    deps: [anel_runico]
    icon: Thaumcraft:ItemGirdleRunic
    desc: |
      O cinto é a peça rúnica de maior carga, Herói! Use anel, amuleto e cinto juntos para um escudo respeitável.

      Os pontos de todas as peças rúnicas se somam, então vale muito completar o conjunto. Confira a receita no NEI (R/U) e separe os materiais com antecedência. Com ele, você enfrenta o que vier!
    tasks:
      - get: Thaumcraft:ItemGirdleRunic
    rewards:
      - xp: 3
      - item: Thaumcraft:ItemResource:1 x2

  - id: anel_carregado
    title: "Anel Carregado"
    type: optional
    deps: [anel_runico]
    icon: Thaumcraft:ItemRingRunic:2
    desc: |
      Um pouco menos de carga, mas a proteção rúnica recarrega §e25% mais rápido§r. Dá para usar dois!

      É feito por infusão com estilhaços de fogo e uma poção de velocidade, Herói. É uma missão opcional, mas ótima para quem sofre muitos golpes seguidos. Confira a receita no NEI (R/U) e separe tudo com calma. Escudo sempre pronto!
    tasks:
      - get: Thaumcraft:ItemRingRunic:2
    rewards:
      - loot: comum

  - id: anel_revitalizante
    title: "Anel Revitalizante"
    type: optional
    deps: [anel_runico]
    icon: Thaumcraft:ItemRingRunic:3
    desc: |
      Quando o escudo quebra, este anel solta um pulso de regeneração por alguns segundos (no máximo a cada 20 s).

      É feito por infusão com estilhaços de água e uma poção de regeneração, Herói. É uma missão opcional, mas ótima para quem enfrenta chefes difíceis. Confira a receita no NEI (R/U) e prepare os ingredientes com carinho. Cura na hora certa!
    tasks:
      - get: Thaumcraft:ItemRingRunic:3
    rewards:
      - loot: comum

  - id: amuleto_emergencia
    title: "Amuleto de Emergência"
    type: optional
    deps: [amuleto_runico]
    icon: Thaumcraft:ItemAmuletRunic:1
    desc: |
      Quando o escudo quebra, este amuleto devolve instantaneamente §e8 pontos§r de proteção (uma vez por minuto).

      É uma infusão do Amuleto Rúnico com estilhaços de terra e uma Poção de Força II, Herói. É uma missão opcional, mas um salva-vidas em lutas apertadas. Confira a receita no NEI (R/U) e prepare os ingredientes com calma. Reforço de emergência!
    tasks:
      - get: Thaumcraft:ItemAmuletRunic:1
    rewards:
      - loot: comum

  - id: cinto_cinetico
    title: "Cinto Cinético"
    type: optional
    deps: [cinto_runico]
    icon: Thaumcraft:ItemGirdleRunic:1
    desc: |
      Quando o escudo quebra, uma explosão de energia cinética empurra e machuca tudo em volta (no máximo a cada 20 s).

      É uma infusão com estilhaços de ar e uma Poção Arremessável de Dano, Herói. É uma missão opcional, mas ótima para se livrar de multidões. Confira a receita no NEI (R/U) e prepare os ingredientes. Defesa e ataque num só item!
    tasks:
      - get: Thaumcraft:ItemGirdleRunic:1
    rewards:
      - loot: comum

  - id: aumento_runico
    title: "Aumento Rúnico"
    type: info
    deps: [anel_runico]
    icon: Thaumcraft:ItemResource:14
    desc: |
      A pesquisa §eRunic Shielding Augmentation§r adiciona +1 de proteção rúnica a peças
      "magicamente estáveis" (Táumio, Tecido Encantado, metal do vazio...) no Altar de Infusão.
      Pode repetir: cada nível pede mais Salis Mundus (igual ao nível) e a essência cresce
      exponencialmente. Em anéis rúnicos o custo parte da carga que eles já têm — caríssimo.
    tasks:
      - check
    rewards:
      - xp: 2

  # ======================================================================
  # FASE 3 — INFUSÃO AVANÇADA E ENCANTAMENTOS
  # ======================================================================
  - id: estabilizadores
    title: "Altar Estável"
    type: normal
    deps: [taumaturgo]
    icon: minecraft:skull
    desc: |
      As infusões daqui têm instabilidade alta (de 5 a 10 ou mais). Estabilize o altar com
      §ecrânios, velas e cachos de cristal§r em posições §esimétricas§r em relação à matriz: cada
      par simétrico ajuda; um bloco sem par atrapalha.

      Junte §e4 crânios§r (qualquer tipo) e §e8 velas§r para montar o seu anel de proteção.
    tasks:
      - get: [ore:itemSkull x4, Thaumcraft:blockCandle:* x8]
    rewards:
      - xp: 3
      - item: Thaumcraft:blockCrystal:6

  - id: infusao_encantamento
    title: "Infusão de Encantamento"
    type: main
    deps: [estabilizadores]
    deps_hidden: [thaumcraft:cerebro_jarra]
    icon: minecraft:enchanted_book
    desc: |
      Chega de sorte na mesa de encantamento! Depois do Cérebro na Jarra vem a §eInfusão de
      Encantamento§r: ponha o item no pedestal central, os ingredientes em volta, e o altar
      aplica §eexatamente§r o encantamento escolhido. Gasta essência e um pouco de XP de quem
      estiver por perto.

      Para subir de nível, repita a infusão (custo × nível). Itens já encantados custam ~10% a
      mais por nível existente e ficam mais instáveis. Exemplos: Proteção (ferro + Salis), Afiação
      (espada de ferro), Fortuna (picareta + diamante), e os exclusivos §eReparo§r e §ePressa§r.
    tasks:
      - check
    rewards:
      - xp: 4

  - id: encanto_reparo
    title: "Encantamentos Taumaturgicos"
    type: info
    deps: [infusao_encantamento]
    icon: Thaumcraft:ItemPickThaumium
    desc: |
      Dois encantamentos só existem no Thaumcraft:

      §eReparo§r (infusão: bigorna + Salis Mundus) — conserta o item aos poucos usando vis das
      varinhas que você carrega. Só funciona em itens do Thaumcraft (e nem todos).
      §ePressa§r (infusão: Nitor + Salis Mundus) — para calçados (e o Catalisador
      Taumostático): mais velocidade em terra.

      §aDica:§r Reparo em ferramentas de Táumio = ferramentas eternas.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: fortaleza
    title: "Armadura Fortaleza de Táumio"
    type: main
    deps: [infusao_encantamento]
    icon: Thaumcraft:ItemChestplateFortress
    desc: |
      Infunda as peças de Táumio com mais Táumio, ouro e esmeralda/couro: cada peça da
      §eArmadura Fortaleza§r protege como diamante, dura mais, resiste a magia e fogo, e cada
      peça extra vestida aumenta a proteção das outras.

      A pesquisa aparece ao descobrir Tutamen, depois de Infusão de Encantamento. Faça as três
      peças (as botas continuam sendo as de Táumio, ou as do Viajante).
    tasks:
      - get: [Thaumcraft:ItemHelmetFortress, Thaumcraft:ItemChestplateFortress, Thaumcraft:ItemLeggingsFortress]
    rewards:
      - xp: 4
      - choice: [Thaumcraft:ItemResource:2 x8, minecraft:emerald x3, minecraft:gold_ingot x8]

  - id: elmo_revelador
    title: "Elmo da Revelação"
    type: normal
    deps: [fortaleza]
    icon: Thaumcraft:ItemGoggles
    desc: |
      Infunda o Elmo Fortaleza com os Óculos da Revelação e slime, Herói: ele passa a ter todas as funções dos óculos, sem o desconto de vis.

      Pode ter óculos e máscara ao mesmo tempo, o que é muito conveniente. Confira a receita no NEI (R/U) e separe os ingredientes com antecedência. Proteção e visão num capacete só!
    tasks:
      - {get: 'Thaumcraft:ItemHelmetFortress:* {goggles:1b}', nbt: true}
    rewards:
      - xp: 3
      - item: minecraft:slime_ball x8

  - id: mascara_diabo
    title: "Máscara do Diabo Sorridente"
    type: normal
    deps: [fortaleza]
    icon: Thaumcraft:ItemHelmetFortress
    desc: |
      A máscara anti-Warp! Ela não diminui quantos eventos de Warp acontecem, mas §ediminui a gravidade§r deles.

      É uma infusão no Elmo Fortaleza com tinta, ferro, couro, Flor Brilhante e cérebro de zumbi (64 Cognitio, 64 Sano: prepare essência, Herói!). Confira a receita no NEI (R/U) e junte os ingredientes com calma. Sua sanidade agradece!
    tasks:
      - {get: 'Thaumcraft:ItemHelmetFortress:* {mask:0}', nbt: true}
    rewards:
      - xp: 3
      - item: Thaumcraft:blockCustomPlant:2 x2

  - id: mascara_fantasma
    title: "Máscara do Fantasma Raivoso"
    type: optional
    deps: [fortaleza]
    icon: Thaumcraft:ItemHelmetFortress
    desc: |
      Quem te bate às vezes sofre Murchar! É uma infusão com crânio de wither, batata venenosa e outros ingredientes (64 Perditio, 64 Mortuus).

      §cA pesquisa dá 1 de Warp.§r Pense bem antes de pesquisar, Herói. É uma missão opcional, mas uma defesa e tanto contra inimigos insistentes. Confira a receita no NEI (R/U) e prepare as essências com calma.
    tasks:
      - {get: 'Thaumcraft:ItemHelmetFortress:* {mask:1}', nbt: true}
    rewards:
      - loot: incomum

  - id: mascara_demonio
    title: "Máscara do Demônio Bebedor"
    type: optional
    deps: [fortaleza]
    icon: Thaumcraft:ItemHelmetFortress
    desc: |
      Seus golpes às vezes roubam um pouco da vida do alvo! É uma infusão com lágrima de ghast, balde de leite e outros ingredientes (64 Exanimis, 64 Victus).

      §cA pesquisa dá 1 de Warp.§r Pense bem antes de pesquisar, Herói. É uma missão opcional, mas ótima para quem luta muito de perto. Confira a receita no NEI (R/U) e junte as essências com calma.
    tasks:
      - {get: 'Thaumcraft:ItemHelmetFortress:* {mask:2}', nbt: true}
    rewards:
      - loot: incomum

  - id: catalisador_taumostatico
    title: "Catalisador Taumostático"
    type: main
    deps: [taumaturgo]
    icon: Thaumcraft:HoverHarness
    desc: |
      O segredo do voo! Infunda um peitoral de couro com estilhaços de ar, tábuas de greatwood,
      comparador, ouro e ferro (32 Volatus, 32 Potentia, 32 Machina, 16 Iter). Pesquisa:
      Thaumostatic Harness (exige Botas do Viajante).

      O combustível é §ePotentia§r: clique com o catalisador em jarros cheios para abastecer. A
      tecla §eH§r liga e desliga. Aceita o encantamento Pressa.
    tasks:
      - get: Thaumcraft:HoverHarness
    rewards:
      - xp: 4
      - choice: [Thaumcraft:blockJar x4, Thaumcraft:ItemShard x6, minecraft:feather x16]

  - id: cinto_taumostatico
    title: "Cinto Taumostático"
    type: optional
    deps: [catalisador_taumostatico]
    icon: Thaumcraft:ItemGirdleHover
    desc: |
      Sozinho, este cinto só evita dano de queda. Com o Catalisador, você voa §emuito mais rápido§r, gastando um pouco mais de Potentia.

      A pesquisa aparece ao descobrir Volatus, Herói. É uma missão opcional, mas voar mais rápido é uma delícia. Confira a receita no NEI (R/U) e prepare os materiais com calma. Céu aberto, aí vai você!
    tasks:
      - get: Thaumcraft:ItemGirdleHover
    rewards:
      - loot: incomum

  - id: pedra_sinistra
    title: "Pedra-Ímã Sinistra"
    type: normal
    deps: [taumaturgo]
    icon: Thaumcraft:ItemCompassStone
    desc: |
      Nós §eSinistros§r emitem uma energia fácil de rastrear. A §ePedra-Ímã Sinistra§r (sílex
      infundido com nitor, estilhaços e um Fragmento de Conhecimento) brilha quando apontada
      para um deles. Isso vai ser MUITO útil: o ritual Eldritch precisa de um nó sinistro.

      §cA pesquisa dá 2 de Warp e o item, mais 1.§r
    tasks:
      - get: Thaumcraft:ItemCompassStone
    rewards:
      - xp: 3
      - item: minecraft:flint x8

  # ======================================================================
  # FASE 4 — FOCOS AVANÇADOS
  # ======================================================================
  - id: foco_buraco
    title: "Foco: Buraco Portátil"
    type: normal
    deps: [taumaturgo]
    icon: Thaumcraft:FocusPortableHole
    desc: |
      Atravesse paredes, Herói! O foco abre um túnel extradimensional temporário através de blocos (alguns materiais e blocos complexos bloqueiam). É uma Pérola do Fim infundida com quartzo e estilhaços.

      Pesquisa: Focus de Varinha: Buraco Portátil (exige Troca Equivalente). Confira a receita no NEI (R/U) e prepare os ingredientes. Atalhos para todos os lados!
    tasks:
      - get: Thaumcraft:FocusPortableHole
    rewards:
      - xp: 3
      - item: minecraft:ender_pearl x2

  - id: foco_nove_infernos
    title: "Foco: Nove Infernos"
    type: optional
    deps: [taumaturgo]
    icon: Thaumcraft:FocusHellbat
    desc: |
      Invoque morcegos de fogo para atacar seus inimigos! A pesquisa aparece ao examinar um Firebat no Nether. É creme de magma infundido com quartzo e estilhaços.

      §cWarp: 2 na pesquisa e 1 no item.§r O Manipulador Focal ainda pode transformar os morcegos em vampiros. É uma missão opcional, Herói. Confira a receita no NEI (R/U) e prepare-se com calma.
    tasks:
      - get: Thaumcraft:FocusHellbat
    rewards:
      - loot: incomum

  - id: foco_protecao
    title: "Foco: Guarda"
    type: optional
    deps: [foco_buraco]
    icon: Thaumcraft:FocusWarding
    desc: |
      Torna blocos §eindestrutíveis§r até você usar o foco de novo neles, "congelados no tempo". Só você vê os blocos protegidos.

      Custa uma §eEstrela do Nether§r no centro da infusão, Herói. É uma missão opcional, mas ótima para proteger construções importantes de explosões e travessuras. Confira a receita no NEI (R/U) e planeje com cuidado.
    tasks:
      - get: Thaumcraft:FocusWarding
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 5 — NÓS ENERGIZADOS E VIS EM REDE
  # ======================================================================
  - id: transdutor
    title: "Transdutor de Nó"
    type: main
    deps: [taumaturgo]
    deps_hidden: [thaumcraft:estabilizador_nos]
    icon: Thaumcraft:blockStoneDevice:11
    desc: |
      Um nó é uma portinha minúscula para uma fonte de energia. E se a gente §eabrisse a porta§r?

      Com o nó estabilizado (Estabilizador embaixo), coloque o §eTransdutor de Nó§r em cima e dê
      sinal de redstone. O nó perde o vis guardado e vira um §eNó Energizado§r: não dá mais para
      drenar com varinha, mas ele produz §eCV§r (centi-vis) sem parar. Mantenha estabilizador e
      transdutor sempre ligados; desligar o transdutor reverte o nó (que volta vazio e frágil).

      Pesquisa: Harnessing Vis (rara, aparece por exame).
    tasks:
      - get: Thaumcraft:blockStoneDevice:11
    rewards:
      - xp: 4
      - choice: [minecraft:redstone_block x4, minecraft:comparator x2, Thaumcraft:ItemResource:1 x4]

  - id: rele_vis
    title: "Relés de Vis"
    type: main
    deps: [transdutor]
    icon: Thaumcraft:blockMetalDevice:14
    desc: |
      Os §eRelés de Vis§r captam CV de um nó energizado até 8 blocos e repassam de relé em relé,
      formando uma árvore (cada relé tem um só "pai"). Clique com um estilhaço (ou a varinha)
      para sintonizar num primal.

      Ferro e um estilhaço equilibrado = 2 relés. A produção de um nó é limitada: não pendure
      máquinas demais num só.
    tasks:
      - get: Thaumcraft:blockMetalDevice:14 x4
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, Thaumcraft:ItemShard:6 x2, minecraft:gold_ingot x4]

  - id: rele_recarga
    title: "Relé de Recarga de Vis"
    type: normal
    deps: [rele_vis]
    icon: Thaumcraft:blockMetalDevice:2
    desc: |
      Colocado em cima da Mesa Arcana, o Relé recarrega a varinha que está nela usando CV dos relés. É mais lento que o Pedestal, mas muito prático, Herói.

      Confira a receita no NEI (R) e posicione o relé com cuidado. Com ele, sua varinha vai estar sempre pronta quando você voltar do laboratório. Que conveniência!
    tasks:
      - get: Thaumcraft:blockMetalDevice:2
    rewards:
      - xp: 3
      - item: minecraft:iron_ingot x4

  - id: manipulador_focal
    title: "Manipulador Focal"
    type: main
    deps: [rele_vis]
    icon: Thaumcraft:blockStoneDevice:13
    desc: |
      Melhore seus focos! No §eManipulador Focal§r você coloca um foco, escolhe uma melhoria
      (Potência, Frugalidade, Ampliação... cada foco tem as suas), fornece CV pelos relés e paga
      XP. Cada foco aceita §e5 melhorias§r e cada nível dobra o custo.

      Neste pack o Salis Arcana adiciona §eFocal Disenchanting§r: remover melhorias com
      reembolso de 75% do XP.
    tasks:
      - get: Thaumcraft:blockStoneDevice:13
    rewards:
      - xp: 4
      - choice: [minecraft:experience_bottle x16, Thaumcraft:ItemResource:15, minecraft:gold_ingot x6]

  - id: estabilizador_avancado
    title: "Estabilizador de Nós Avançado"
    type: optional
    deps: [transdutor]
    icon: Thaumcraft:blockStoneDevice:10
    desc: |
      Faz tudo o que o comum faz e mais: o nó estabilizado pode drenar nós menores, e a chance de curar nós instáveis ou desbotados é maior. Em troca, a recarga do nó quase para.

      É uma missão opcional, Herói, mas excelente para quem quer manter nós saudáveis. Confira a receita no NEI (R/U) e pese bem os prós e contras antes de instalar.
    tasks:
      - get: Thaumcraft:blockStoneDevice:10
    rewards:
      - loot: incomum

  - id: lavador_fluxo
    title: "Lavador de Fluxo"
    type: normal
    deps: [rele_vis]
    icon: Thaumcraft:blockStoneDevice:14
    desc: |
      Alimentado com §eAer§r (CV), o §eFlux Scrubber§r limpa gosma e gás de fluxo num raio de 16 blocos e ainda recupera um pouco como essência Praecantatio (esvazie o buffer).

      Coloque um perto do altar de infusão e outro perto da Fornalha Infernal, Herói. Confira a receita no NEI (R/U) e mantenha o ar da base limpinho. Menos fluxo, mais sossego!
    tasks:
      - get: Thaumcraft:blockStoneDevice:14
    rewards:
      - xp: 3
      - item: Thaumcraft:blockTube x8

  - id: vis_em_rede
    title: "Vis em Rede"
    type: milestone
    deps: [rele_recarga, manipulador_focal]
    icon: Thaumcraft:blockMetalDevice:14
    banner: "Vis em Rede"
    subtitle: "Um nó energizado alimenta o laboratório"
    desc: |
      Um nó energizado zumbindo, relés riscando o ar com fios de luz, a varinha recarregando sozinha na Mesa Arcana e o Manipulador Focal afiando seus focos. Herói, o seu laboratório agora tem §erede elétrica mágica§r. Os engenheiros do capítulo do IC2 ficariam com inveja!

      §aDica:§r use relés sintonizados para separar as linhas (por exemplo, uma só de Aer para os lavadores de fluxo e o Escavador Arcano). Que marco bonito! Comemore, e depois siga para as próximas pesquisas. Se esquecer alguma receita, o NEI (R/U) e o Tomo Arcano ajudam.
    tasks:
      - get: [Thaumcraft:blockStoneDevice:11, Thaumcraft:blockMetalDevice:14 x2, Thaumcraft:blockStoneDevice:13]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Eletricista Arcano", items: [Thaumcraft:blockMetalDevice:14 x4, Thaumcraft:ItemShard:6 x4, minecraft:redstone_block x2, minecraft:experience_bottle x16]}
      - loot: raro

  # ======================================================================
  # FASE 6 — GOLEMANCIA AVANÇADA
  # ======================================================================
  - id: nucleo_usar
    title: "Núcleo: Usar"
    type: normal
    deps: [taumaturgo]
    deps_hidden: [thaumcraft:operarios]
    icon: Thaumcraft:ItemGolemCore:8
    desc: |
      O núcleo mais versátil: o golem tira itens do baú e §eos usa§r no bloco ou lugar marcado,
      como se fosse você clicando (direito ou esquerdo, agachado ou não). Sem baú, clica com a
      mão vazia. Infusão do Núcleo Esvaziar com comparador, isqueiro, tesoura e alavanca.

      A Melhoria de Ar acelera os cliques.
    tasks:
      - get: Thaumcraft:ItemGolemCore:8
    rewards:
      - xp: 3
      - item: minecraft:comparator x2

  - id: nucleo_ordenar
    title: "Núcleo: Ordenar"
    type: normal
    deps: [nucleo_usar]
    icon: Thaumcraft:ItemGolemCore:10
    desc: |
      Como o Esvaziar, mas só leva um item se ele §ejá existir§r num dos baús marcados. É o organizador automático de depósito, Herói!

      Infusão de um cérebro de zumbi com os núcleos Preencher e Esvaziar, comparador e papel. Confira a receita no NEI (R/U) e prepare os núcleos com antecedência. Seus baús nunca mais vão ficar bagunçados!
    tasks:
      - get: Thaumcraft:ItemGolemCore:10
    rewards:
      - xp: 3
      - item: minecraft:chest x4

  - id: nucleo_lenhador
    title: "Núcleo: Lenhador"
    type: normal
    deps: [taumaturgo]
    deps_hidden: [thaumcraft:operarios, thaumcraft:machado_corrente]
    icon: Thaumcraft:ItemGolemCore:7
    desc: |
      O golem procura árvores por perto e as derruba (golens mais fortes cortam mais rápido). Ele não replanta, Herói, então fique de olho.

      É uma infusão do Núcleo Colher com o Machado da Corrente e três machados de ferro. Confira a receita no NEI (R/U) e prepare os ingredientes. Madeira à vontade, sem nem pegar no machado!
    tasks:
      - get: Thaumcraft:ItemGolemCore:7
    rewards:
      - xp: 3
      - item: minecraft:sapling x16

  - id: nucleo_pescar
    title: "Núcleo: Pescar"
    type: optional
    deps: [nucleo_lenhador]
    icon: Thaumcraft:ItemGolemCore:11
    desc: |
      Um golem pescador para o seu jantar, Herói! Ele precisa de água funda e aberta.

      Melhorias: Ar (às vezes pega mais de um), Fogo (assa o peixe), Ordem e Entropia (melhores resultados). É uma missão opcional, mas ótima para quem quer comida automática. Confira a receita no NEI (R/U) e escolha um bom lago. Peixe fresco a caminho!
    tasks:
      - get: Thaumcraft:ItemGolemCore:11
    rewards:
      - loot: comum

  - id: nucleo_acougueiro
    title: "Núcleo: Açougueiro"
    type: optional
    deps: [nucleo_lenhador]
    icon: Thaumcraft:ItemGolemCore:9
    desc: |
      Um guarda que só ataca animais adultos mais velhos e §esempre deixa um casal§r para reprodução. Que respeito pela natureza!

      É feito com Núcleo Proteger, 5 Corpus e 5 Bestia no Crisol. §cA pesquisa dá 1 de Warp.§r É uma missão opcional, Herói. Confira a receita no NEI (R/U) e prepare as essências com calma.
    tasks:
      - get: Thaumcraft:ItemGolemCore:9
    rewards:
      - loot: comum

  - id: nucleo_decantar
    title: "Núcleo: Decantar"
    type: normal
    deps: [taumaturgo]
    deps_hidden: [thaumcraft:operarios]
    icon: Thaumcraft:ItemGolemCore:5
    desc: |
      O golem mantém um tanque cheio de líquido (100 mB por item que ele carregaria; um balde
      inteiro se pegar do mundo). Com a Melhoria de Entropia, esvazia lagos inteiros a partir do
      bloco mais distante. Núcleo em branco + 5 Aqua + 5 Vacuos no Crisol.
    tasks:
      - get: Thaumcraft:ItemGolemCore:5
    rewards:
      - xp: 3
      - item: minecraft:bucket x2

  - id: nucleo_alquimia
    title: "Núcleo: Alquimia"
    type: main
    deps: [nucleo_decantar]
    icon: Thaumcraft:ItemGolemCore:6
    desc: |
      O sonho do alquimista: preso a uma Fornalha Alquímica ou alambique, o golem puxa essência
      da pilha inteira de alambiques e enche os jarros marcados (e os vizinhos). Prefere jarros
      rotulados e deixa os do vazio por último. Infusão do Núcleo Decantar com jarro e poções.
    tasks:
      - get: Thaumcraft:ItemGolemCore:6
    rewards:
      - xp: 4
      - choice: [Thaumcraft:blockJar x4, Thaumcraft:ItemResource:13 x8, Thaumcraft:ItemResource x4]

  - id: golem_avancado
    title: "Golem Avançado"
    type: main
    deps: [nucleo_usar, nucleo_alquimia]
    icon: Thaumcraft:ItemGolemPlacer:7
    desc: |
      Exige as seis melhorias de golem pesquisadas. Infunda qualquer golem com redstone,
      glowstone, pólvora, um jarro e um cérebro: o §eGolem Avançado§r aceita §euma melhoria a
      mais§r (no máximo 2 do mesmo tipo), é mais rápido e enxerga mais longe.

      "Você tem certeza de que o brilho malicioso nos olhos dele é imaginação sua." §cA pesquisa
      dá 5 de Warp.§r
    tasks:
      - {get: 'Thaumcraft:ItemGolemPlacer:* {advanced:1b}', nbt: true}
    rewards:
      - xp: 4
      - choice: [Thaumcraft:ItemGolemUpgrade:1, Thaumcraft:ItemGolemUpgrade:4, Thaumcraft:ItemGolemUpgrade]

  - id: fabrica_golens
    title: "A Fábrica de Golens"
    type: milestone
    deps: [golem_avancado, nucleo_ordenar]
    icon: Thaumcraft:ItemGolemCore:10
    banner: "A Fábrica de Golens"
    subtitle: "Golemancia avançada"
    desc: |
      Golens que usam ferramentas, organizam o depósito, cortam lenha, pescam e engarrafam essência. Você não tem mais operários, Herói: tem uma §efábrica§r inteira de autômatos mágicos. Que marco incrível depois de tantas pesquisas e montagens!

      Sugestão: coloque um Golem de Alquimia em cada pilha de alambiques e um de Ordenar no depósito principal. E dê um chapéu para cada um. Eles merecem. Confira as configurações no NEI (R/U) e no manual do mod. Comemore esta conquista e prepare-se para o que vem a seguir!
    tasks:
      - get: [Thaumcraft:ItemGolemCore:6, Thaumcraft:ItemGolemCore:8, Thaumcraft:ItemGolemCore:10]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Mestre Golemante", items: [Thaumcraft:ItemGolemCore:100 x4, Thaumcraft:ItemZombieBrain x2, Thaumcraft:ItemGolemDecoration, minecraft:comparator x2, Thaumcraft:blockJar x2]}
      - loot: raro

  # ======================================================================
  # FASE 7 — WARP
  # ======================================================================
  - id: warp
    title: "O Warp"
    type: info
    deps: [taumaturgo]
    icon: Thaumcraft:ItemSanityChecker
    desc: |
      "Muitos acreditam que o homem não deveria mexer com magia" — e o §cWarp§r é a prova. Ele
      vem de pesquisas proibidas, itens perigosos e equipamento corrompido, e distorce a mente.

      §eTrês tipos:§r §eTemporário§r (some sozinho), §eNormal§r ("pegajoso", removível com
      esforço) e §cPermanente§r (não sai). Pesquisas com Warp dão metade permanente e metade
      normal. Algumas armaduras (metal do vazio, cultistas) dão Warp enquanto vestidas.

      §eEfeitos:§r sussurros, fome mágica, visões, cegueira, névoa de criaturas, aranhas da
      mente... Neste pack o §eWarpTheory§r adiciona ainda MAIS eventos (veja o capítulo Thaumic
      Energistics, Boots e o Warp). O Warp também traz conhecimento: é ele que libera as
      pesquisas Eldritch.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: verificador_sanidade
    title: "Verificador de Sanidade"
    type: normal
    deps: [warp]
    icon: Thaumcraft:ItemSanityChecker
    desc: |
      Quanto Warp eu tenho, Herói? O §eSanity Checker§r (Taumômetro infundido com vidro espelhado, cérebro e diamante) mostra, de forma propositalmente enigmática, as três barras de Warp.

      Pesquisa: Sanity Check (aba Eldritch, aparece com a Epifania Eldritch). Confira a receita no NEI (R/U) e prepare a infusão com calma. Conheça seus limites!
    tasks:
      - get: Thaumcraft:ItemSanityChecker
    rewards:
      - xp: 3
      - item: Thaumcraft:ItemZombieBrain x2

  - id: sais_banho
    title: "Sais de Banho Purificantes"
    type: main
    deps: [warp]
    icon: Thaumcraft:ItemBathSalts
    desc: |
      Quando seu Warp passar de 10 (permanente + normal), um evento revela a pista dos §eSais de
      Banho§r. No Crisol: Salis Mundus + 6 Cognitio, 6 Auram, 6 Ordo, 6 Sano.

      Jogue os sais numa fonte de água: ela vira §eFluido Purificador§r. Banhar-se nele dá
      §eWarp Ward§r, que bloqueia os eventos de Warp por um tempo (menos tempo quanto mais Warp
      você tiver). §cOs sais se desfazem se ficarem jogados por aí.§r
    tasks:
      - get: Thaumcraft:ItemBathSalts x2
    rewards:
      - xp: 4
      - choice: [Thaumcraft:ItemResource:14 x4, minecraft:water_bucket x2, Thaumcraft:blockCustomPlant:2 x2]

  - id: fluido_purificador
    title: "Fluido Purificador"
    type: normal
    deps: [sais_banho]
    icon: Thaumcraft:ItemBucketPure
    desc: |
      Encha um balde no Fluido Purificador para levar a "banheira" com você, Herói. Quando der, deixe uma piscininha perto da base para os dias de crise de sanidade.

      É uma forma deliciosa de livrar a mente do Warp. Confira os detalhes no NEI (R/U) e guarde o balde num lugar seguro. Um mergulho resolve quase tudo!
    tasks:
      - get: Thaumcraft:ItemBucketPure
    rewards:
      - xp: 3
      - item: minecraft:bucket x2

  - id: spa_arcano
    title: "Spa Arcano"
    type: optional
    deps: [fluido_purificador]
    icon: Thaumcraft:blockStoneDevice:12
    desc: |
      Que tal um spa para a sua base? Encha com água e sais de banho (à mão ou automação): o §eSpa Arcano§r mistura e bombeia o fluido para uma área 5×5 acima dele. Funciona com quase qualquer líquido. Redstone desliga.

      É uma missão opcional, Herói, mas muito charmosa e útil. Confira a receita no NEI (R/U) e instale num lugar espaçoso. Relaxe, você merece!
    tasks:
      - get: Thaumcraft:blockStoneDevice:12
    rewards:
      - loot: incomum

  - id: sabao
    title: "Sabão Sanitizante"
    type: main
    deps: [sais_banho]
    icon: Thaumcraft:ItemSanitySoap
    desc: |
      Um Bloco de Sebo no Crisol com §e16 Cognitio, 16 Alienis, 16 Ordo e 16 Sano§r vira o
      §eSabão Sanitizante§r. Usado, ele §eremove todo o Warp temporário§r e tem chance de reduzir
      o Warp normal. A chance aumenta se você estiver sob Warp Ward ou dentro do Fluido
      Purificador. Ele não toca no Warp permanente.

      Faça §e4 sabões§r. Higiene mental em dia!
    tasks:
      - get: Thaumcraft:ItemSanitySoap x4
    rewards:
      - xp: 4
      - choice: [Thaumcraft:ItemResource:4 x18, Thaumcraft:ItemBathSalts, Thaumcraft:ItemResource:14 x4]

  - id: epifania
    title: "Epifania Eldritch"
    type: info
    deps: [warp]
    icon: Thaumcraft:ItemEldritchObject
    desc: |
      Algo se mexe nos cantos escuros do universo... Quando o seu Warp (permanente + normal)
      passar de §e25§r, um evento de Warp concede a §eEpifania Eldritch§r: ela abre a aba
      Eldritch com o Metal do Vazio, o Foco Primal e o Verificador de Sanidade. Acima de §e50§r
      vem a §eRevelação Eldritch§r, exigida pelo Oculus e pelas vestes do vazio.

      Ou seja: para avançar aqui, você §cprecisa§r acumular Warp. Planeje, use a Máscara do Diabo
      Sorridente e tenha sabão à mão.
    tasks:
      - check
    rewards:
      - xp: 2

  # ======================================================================
  # FASE 8 — MÁCULA E PERIGOS ALQUÍMICOS
  # ======================================================================
  - id: macula
    title: "A Mácula"
    type: info
    deps: [taumaturgo]
    icon: Thaumcraft:blockTaintFibres
    desc: |
      Quando a magia apodrece, nasce a §5Mácula§r (Taint). As Terras Maculadas existem
      naturalmente (bioma "Tainted Land") e também surgem onde o fluxo fica parado tempo demais.
      Neste pack ela §cse espalha§r (1 chance em 200 por atualização de bloco).

      Fibras roxas cobrem tudo, a terra vira Solo Maculado, animais viram versões monstruosas e
      encostar nas fibras dá §cVeneno de Fluxo§r. Os esporos explodem em mais mácula.

      Defesa: §eFlores Etéreas§r e nós puros recuperam a terra; a Pá do Purificador (Forbidden
      Magic) arranca a mácula com as mãos... digo, com a pá.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: terras_maculadas
    title: "Terras Maculadas"
    type: normal
    deps: [macula]
    icon: Thaumcraft:blockTaint:1
    desc: |
      Hora de encarar a mácula, Herói! Encontre um bioma maculado e sobreviva para contar a história. Leve armadura, comida e Flores Etéreas para abrir uma área segura.

      §cNão durma por lá.§r O ambiente é hostil e a mácula se espalha, então vá com cuidado e saia quando sentir que ficou perigoso. Eu estou torcendo por você. Boa sorte, e volte inteiro!
    tasks:
      - visit: {dim: 0, biome: 192, name: "Terras Maculadas"}
    rewards:
      - xp: 3
      - item: Thaumcraft:blockCustomPlant:4

  - id: gosma_maculada
    title: "Gosma e Vinhas Maculadas"
    type: normal
    deps: [terras_maculadas]
    icon: Thaumcraft:ItemResource:11
    desc: |
      Criaturas maculadas e blocos de mácula deixam §eGosma Maculada§r e §eVinha Maculada§r. São ingredientes da Mácula Engarrafada e de vários itens de Tainted e Forbidden Magic (a Haste Maculada, por exemplo).

      §cAmbas apodrecem com o tempo no inventário§r, então use rápido, Herói! Confira os usos no NEI (R/U) e planeje o que fazer antes de coletar. Boa caça!
    tasks:
      - get: [Thaumcraft:ItemResource:11, Thaumcraft:ItemResource:12]
    rewards:
      - xp: 3
      - item: Thaumcraft:blockCustomPlant:4

  - id: tentaculo
    title: "Taintáculos"
    type: optional
    deps: [terras_maculadas]
    icon: Thaumcraft:ItemSpawnerEgg:17
    desc: |
      Tentáculos gigantes saindo do chão maculado, Herói! Eles agarram e batem forte, então ataque de longe se puder. Derrote 3.

      Um arco e boa mobilidade fazem toda a diferença. Não se aproxime demais e mantenha a armadura em dia. É uma missão opcional, mas rende uma boa experiência com a mácula. Boa caçada, e cuidado com as garras!
    tasks:
      - kill: "Thaumcraft.Taintacle x3"
    rewards:
      - loot: incomum

  - id: macula_engarrafada
    title: "Mácula Engarrafada"
    type: optional
    deps: [gosma_maculada]
    icon: Thaumcraft:ItemBottleTaint
    desc: |
      "Já pensou em ESPALHAR a mácula?" Um frasco de Vitium no Crisol com mais Vitium e
      Praecantatio. Arremessar cria uma mancha de mácula. Por que você faria isso? Não sei e
      prefiro não saber. §cWarp: 2 na pesquisa, 1 no item.§r Ingrediente de focos do Tainted
      Magic.
    tasks:
      - get: Thaumcraft:ItemBottleTaint
    rewards:
      - loot: incomum

  - id: morte_liquida
    title: "Morte Líquida"
    type: optional
    deps: [warp]
    icon: Thaumcraft:ItemBucketDeath
    desc: |
      Um balde no Crisol com 32 Mortuus, 32 Venenum e 32 Perditio. Esse líquido dissolve qualquer coisa viva, e as criaturas dissolvidas deixam §eessência cristalizada§r dos seus aspectos. Uma fazenda de essência macabra!

      §cWarp: 3 na pesquisa, 1 no item. NUNCA entre.§r Manuseie com extremo cuidado, Herói. Confira os detalhes no NEI (R/U) antes de começar.
    tasks:
      - get: Thaumcraft:ItemBucketDeath
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 9 — O CULTO CARMESIM
  # ======================================================================
  - id: obelisco
    title: "O Anel de Obeliscos"
    type: normal
    deps: [epifania]
    icon: Thaumcraft:blockCosmeticSolid:11
    desc: |
      Pelo mundo existem estruturas estranhas: um §ealtar Eldritch§r de pedra antiga cercado por
      §eobeliscos§r, com um §enó Sinistro§r flutuando sobre a pedra-chave. Use a Pedra-Ímã
      Sinistra para encontrá-los.

      Esses altares atraem §ecultistas carmesins§r ou §eGuardiões Eldritch§r. Pegue um bloco de
      §ePedra Antiga§r como prova de que esteve lá.
    tasks:
      - get: Thaumcraft:blockCosmeticSolid:11
    rewards:
      - xp: 4
      - item: Thaumcraft:ItemResource:9 x2

  - id: cavaleiro_carmesim
    title: "Cavaleiros Carmesins"
    type: normal
    deps: [obelisco]
    icon: Thaumcraft:ItemHelmetCultistPlate
    desc: |
      Os §eCavaleiros e Clérigos Carmesins§r guardam os altares. Os clérigos lançam magia e curam os outros: derrube-os primeiro. Cultistas deixam cair Fragmentos de Conhecimento, §eSementes do Vazio§r, moedas de ouro e, raramente, o livro Ritos Carmesins.

      Derrote §e5 cavaleiros§r, Herói. Leve boa armadura, poções e muita atenção. Eu confio em você!
    tasks:
      - kill: "Thaumcraft.CultistKnight x5"
    rewards:
      - xp: 4
      - loot: incomum

  - id: ritos_carmesins
    title: "Ritos Carmesins"
    type: main
    deps: [cavaleiro_carmesim]
    icon: Thaumcraft:ItemEldritchObject:1
    desc: |
      O livro sagrado do Culto. Clique com ele na mão: você aprende §eThe Crimson Cult§r. O
      texto fala do ritual "Apertis Oculis" — Abrir o Olho — que os cultistas nunca conseguiram
      completar. "Só um louco seguiria esse caminho..."

      §cA pesquisa dá 3 de Warp.§r (Eu falei que só um louco...)
    tasks:
      - get: Thaumcraft:ItemEldritchObject:1
    rewards:
      - xp: 4
      - choice: [Thaumcraft:ItemResource:9 x3, Thaumcraft:ItemSanitySoap, minecraft:golden_apple]

  - id: vestes_carmesins
    title: "Vestes do Culto"
    type: optional
    deps: [cavaleiro_carmesim]
    icon: Thaumcraft:ItemChestplateCultistRobe
    desc: |
      Às vezes os cultistas deixam cair as próprias vestes. Elas protegem razoavelmente, mas §cdão Warp enquanto vestidas§r.

      Pegue qualquer peça, Herói: o Tainted Magic ensina a fabricá-las. É uma missão opcional, mas bem curiosa. Vista com cuidado ou apenas guarde como troféu. Se tiver dúvida sobre o uso, aperte U no NEI.
    tasks:
      - one_of: [Thaumcraft:ItemHelmetCultistRobe, Thaumcraft:ItemChestplateCultistRobe, Thaumcraft:ItemLeggingsCultistRobe, Thaumcraft:ItemBootsCultist, Thaumcraft:ItemHelmetCultistPlate, Thaumcraft:ItemChestplateCultistPlate, Thaumcraft:ItemLeggingsCultistPlate]
    rewards:
      - loot: incomum

  - id: guardiao_eldritch
    title: "Guardião Eldritch"
    type: normal
    deps: [obelisco]
    icon: Thaumcraft:ItemSpawnerEgg:6
    desc: |
      Altos, pálidos e com uma aura que suga seu fôlego: os §eGuardiões Eldritch§r aparecem nos altares e nas Terras Exteriores. Atiram orbes de matéria escura e às vezes deixam cair um §eOlho Eldritch§r.

      Derrote §e3 guardiões§r, Herói. Leve armadura boa, poções de cura e mantenha a distância dos orbes. Respire fundo e vá com tudo, estou torcendo por você!
    tasks:
      - kill: "Thaumcraft.EldritchGuardian x3"
    rewards:
      - xp: 5
      - loot: raro

  # ======================================================================
  # FASE 10 — METAL DO VAZIO
  # ======================================================================
  - id: semente_vazio
    title: "Semente do Vazio"
    type: normal
    deps: [epifania]
    icon: Thaumcraft:ItemResource:17
    desc: |
      Uma semente de trigo no Crisol com §e8 Tenebrae, 8 Vacuos e 2 Alienis§r vira uma §eSemente do Vazio§r (os cultistas também deixam cair). Ela é o catalisador do Metal do Vazio e entra no Olho Eldritch.

      Faça §e4§r, Herói. Separe as essências com antecedência para não faltar nada. Confira a receita no NEI (R/U) e mãos à obra!
    tasks:
      - get: Thaumcraft:ItemResource:17 x4
    rewards:
      - xp: 4
      - item: minecraft:wheat_seeds x16

  - id: metal_vazio
    title: "Metal do Vazio"
    type: main
    deps: [semente_vazio]
    icon: Thaumcraft:ItemResource:16
    desc: |
      "Chegou a hora de deixar o Táumio para os amadores." Uma Semente do Vazio no Crisol com
      §e8 Metallum§r vira §eLingote de Metal do Vazio§r: quente ao toque, mole como ouro e duro
      como táumio quando golpeado. Itens de Metal do Vazio §ese consertam sozinhos§r.

      Pesquisa: Void metal (exige Táumio e a Epifania Eldritch). Faça §e8 lingotes§r.
      §cSer ferido por ele enfraquece você por um tempo.§r
    tasks:
      - get: Thaumcraft:ItemResource:16 x8
    rewards:
      - xp: 6
      - choice: [Thaumcraft:ItemResource:17 x4, Thaumcraft:ItemNugget:7 x9, Thaumcraft:ItemResource:2 x8]

  - id: ferramentas_vazio
    title: "Ferramentas do Vazio"
    type: normal
    deps: [metal_vazio]
    icon: Thaumcraft:ItemPickVoid
    desc: |
      Chegou a hora do Metal do Vazio, Herói! Picareta, espada, machado, pá e enxada têm receitas normais de bancada. O nível de mineração é alto, tudo se auto-repara e a espada causa Fraqueza.

      Faça a picareta e a espada para cumprir a missão. Confira as receitas no NEI (R) e guarde o metal com carinho. Ferramentas de outro mundo!
    tasks:
      - get: [Thaumcraft:ItemPickVoid, Thaumcraft:ItemSwordVoid]
    rewards:
      - xp: 4
      - item: Thaumcraft:ItemNugget:7 x9

  - id: ferramentas_vazio_completas
    title: "Arsenal Completo do Vazio"
    type: optional
    deps: [ferramentas_vazio]
    icon: Thaumcraft:ItemAxeVoid
    desc: |
      Para os completistas: machado, pá e enxada do vazio! A pá e a picareta do vazio vão virar o §eTriturador Primal§r lá na frente, então guarde-as.

      É uma missão opcional, Herói, mas completa o arsenal e dá orgulho de ver. Confira as receitas no NEI (R) e separe o metal do vazio. Kit completo, à sua espera!
    tasks:
      - get: [Thaumcraft:ItemAxeVoid, Thaumcraft:ItemShovelVoid, Thaumcraft:ItemHoeVoid]
    rewards:
      - loot: incomum

  - id: armadura_vazio
    title: "Armadura do Vazio"
    type: normal
    deps: [metal_vazio]
    icon: Thaumcraft:ItemChestplateVoid
    desc: |
      As quatro peças de Metal do Vazio têm receitas normais, Herói. A proteção é boa e a armadura se auto-repara, mas §ccada peça vestida dá Warp§r.

      Use com Sabão por perto para não ficar com a mente embaralhada. Confira as receitas no NEI (R) e separe o metal com calma. Proteção de outro mundo, mas com responsabilidade!
    tasks:
      - get: [Thaumcraft:ItemHelmetVoid, Thaumcraft:ItemChestplateVoid, Thaumcraft:ItemLeggingsVoid, Thaumcraft:ItemBootsVoid]
    rewards:
      - xp: 4
      - item: Thaumcraft:ItemSanitySoap

  - id: pontas_vazio
    title: "Pontas de Metal do Vazio"
    type: main
    deps: [metal_vazio]
    icon: Thaumcraft:WandCap:7
    desc: |
      As melhores pontas do Thaumcraft: §e80% de custo§r (20% de desconto)! Pepitas do vazio na Mesa Arcana (pontas inertes), depois infusão com 4 Salis Mundus.

      §cA pesquisa dá 1 de Warp.§r Monte um cajado de Silverwood com elas e sinta a diferença, Herói. Faça 2 pontas. Confira a receita no NEI (R/U) e separe as pepitas com antecedência. Que economia de vis!
    tasks:
      - get: Thaumcraft:WandCap:7 x2
    rewards:
      - xp: 6
      - choice: [Thaumcraft:ItemResource:14 x6, Thaumcraft:ItemNugget:7 x9, Thaumcraft:ItemResource:15]

  - id: reservatorio
    title: "Reservatório de Essência"
    type: normal
    deps: [metal_vazio]
    icon: Thaumcraft:blockEssentiaReservoir
    desc: |
      Guarda §e256 de essência§r em qualquer mistura, com compartimentos que se reorganizam
      sozinhos. Só se enche e esvazia por tubos ou golens, e acessa um lado só. "Pegar um
      reservatório cheio é... desaconselhável." Infusão de um Buffer de Essência com Metal do
      Vazio e jarros.
    tasks:
      - get: Thaumcraft:blockEssentiaReservoir
    rewards:
      - xp: 4
      - item: Thaumcraft:blockTube x8

  - id: vestes_vazio
    title: "Vestes do Taumaturgo do Vazio"
    type: optional
    deps: [armadura_vazio]
    icon: Thaumcraft:ItemChestplateVoidFortress
    desc: |
      O melhor dos dois mundos! A armadura do vazio infundida com robes, tecido encantado e (no capuz) os Óculos da Revelação. Protege, dá desconto de vis, se conserta e o capuz funciona como óculos.

      Exige a Revelação Eldritch. Pode tingir, Herói! §cDá Warp vestida.§r É uma missão opcional, mas é puro estilo. Confira a receita no NEI (R/U) e prepare as peças.
    tasks:
      - get: [Thaumcraft:ItemHelmetVoidFortress, Thaumcraft:ItemChestplateVoidFortress, Thaumcraft:ItemLeggingsVoidFortress]
    rewards:
      - loot: raro

  - id: foco_primal
    title: "Foco Primal"
    type: normal
    deps: [epifania]
    icon: Thaumcraft:FocusPrimal
    desc: |
      "Que loucura te levou a criar isso?" O §eFoco Primal§r dispara um orbe de energia primal
      devastador... e de trajetória errática. Primal Charm no centro, quartzo e diamantes, 25
      de cada primal. §cWarp: 2 na pesquisa, 1 no item.§r Ele abre o caminho para o Núcleo de
      Cajado Primal.
    tasks:
      - get: Thaumcraft:FocusPrimal
    rewards:
      - xp: 4
      - item: minecraft:diamond x2

  # ======================================================================
  # FASE 11 — O OLHO SE ABRE: TERRAS EXTERIORES
  # ======================================================================
  - id: olho_eldritch
    title: "Olhos Eldritch"
    type: main
    deps: [ritos_carmesins, guardiao_eldritch, metal_vazio]
    icon: Thaumcraft:ItemEldritchObject
    desc: |
      Com Ritos Carmesins lidos e a §eRevelação Eldritch§r (Warp acima de 50), surge a pesquisa
      §eOpening the Eye§r (Oculus). Ela ensina a infundir um §eOlho do Fim§r com Semente do Vazio
      e ouro (64 Alienis, 16 Vacuos, 16 Tenebrae, 16 Iter) para criar §eOlhos Eldritch§r.

      Você precisa de §e4 olhos§r. Os Guardiões Eldritch também deixam cair alguns. §cO Oculus
      dá 6 de Warp.§r
    tasks:
      - get: Thaumcraft:ItemEldritchObject x4
    rewards:
      - xp: 6
      - choice: [Thaumcraft:ItemResource:17 x4, minecraft:ender_eye x4, Thaumcraft:ItemSanitySoap x2]

  - id: ritual_oculus
    title: "O Ritual do Oculus"
    type: info
    deps: [olho_eldritch, cajado_silverwood]
    icon: Thaumcraft:ItemEldritchObject
    desc: |
      §eO ritual "Apertis Oculis":§r
      §e1.§r Vá a um altar Eldritch (anel de obeliscos) cujo §enó Sinistro§r esteja intacto.
      §e2.§r Coloque os §e4 Olhos Eldritch§r nos encaixes da pedra-chave.
      §e3.§r Clique na pedra-chave com a varinha: §e100 de vis de cada primal§r (antes do
      desconto das pontas). Silverwood com táumio, ou um cajado, dão conta.

      Se tudo estiver certo, o Olho se abre num portal. "Só os tolos temem o desconhecido!"
      §cLeve o seu melhor equipamento.§r
    tasks:
      - check
    rewards:
      - xp: 3

  - id: terras_exteriores
    title: "As Terras Exteriores"
    type: portal
    deps: [ritual_oculus]
    icon: Thaumcraft:blockEldritch:4
    banner: "As Terras Exteriores"
    subtitle: "Além do Olho"
    effect: 5
    desc: |
      Você atravessou. Pedra antiga desmoronando, corredores que não levam a lugar nenhum, uma
      escuridão que parece pensar... As §dTerras Exteriores§r (dimensão -42) são um §elabirinto
      infinito§r construído como armadilha — "um lugar para testar visitantes e eliminar os
      fracos". Herói, eu acho que estas são as rachaduras da própria Fratura.

      §e•§r Guardiões Eldritch, caranguejos e cascas cambaleantes vagam pelos corredores.
      §e•§r Salas-chave guardam §eTábuas Rúnicas§r; salas trancadas guardam chefes.
      §e•§r Examine os blocos estranhos com o Taumômetro: há pesquisas "perdidas" aqui.
      §cMarque o caminho de volta ao portal. Sério.§r
    tasks:
      - visit: {dim: -42, name: "Terras Exteriores"}
    rewards:
      - xp: 8
      - loot: raro

  - id: tabua_runica
    title: "A Tábua Rúnica"
    type: main
    deps: [terras_exteriores]
    icon: Thaumcraft:ItemEldritchObject:2
    desc: |
      Em certas salas do labirinto, uma §eTábua Rúnica§r flutua sobre um pedestal. Ela é a chave
      das §efechaduras Eldritch§r: as portas seladas das salas dos chefes.

      Clique na fechadura com a tábua e prepare-se: alguns segundos depois o guardião daquela
      sala desperta. Pode ser o Warden Eldritch, o Construto Eldritch, o Portal Carmesim ou
      Taintáculos Gigantes.
    tasks:
      - get: Thaumcraft:ItemEldritchObject:2
    rewards:
      - xp: 6
      - choice: [minecraft:golden_apple x2, minecraft:potion:8229 x3, Thaumcraft:ItemSanitySoap x2]

  - id: revelacoes_exteriores
    title: "Revelações nas Terras Exteriores"
    type: optional
    deps: [terras_exteriores]
    icon: Thaumcraft:ItemThaumometer
    desc: |
      A pesquisa perdida §eRevelations in the Outer Lands§r surge ao examinar os blocos
      especiais do labirinto (certas pedras e cristais). Ela confirma: aquilo não é o lar dos
      Eldritch — é algo construído, "tanto mental quanto físico". Pegue um bloco de Pedra
      Antiga Brilhante como lembrança.
    tasks:
      - get: Thaumcraft:blockEldritch:4
    rewards:
      - loot: raro

  - id: warden_eldritch
    title: "O Warden Eldritch"
    type: boss
    deps: [tabua_runica]
    icon: Thaumcraft:ItemSpawnerEgg:7
    banner: "O Warden Eldritch"
    subtitle: "Guardião do labirinto"
    desc: |
      O guardião mais temido das Terras Exteriores. Ele tem §e200 de vida§r, um escudo que se regenera, ataques fortes e convoca ajudantes. Não lute cansado.

      §e•§r Use armadura Fortaleza ou do Vazio, proteção rúnica e comida boa.
      §e•§r Foco Primal e espadas com Fraqueza ajudam muito.
      §e•§r Ao morrer, deixa uma §dPérola Primordial§r e um Tesouro Raro.

      Você chegou longe, Herói, passando por cada aspecto, cada infusão e cada perigo eldritch. Respire fundo e vá com tudo. Eu acredito em você. (E pega a pérola, eu quero ver de perto!)
    tasks:
      - kill: "Thaumcraft.EldritchWarden x1"
    rewards:
      - xp: 10
      - loot: epico

  - id: construto_eldritch
    title: "O Construto Eldritch"
    type: boss
    deps: [tabua_runica]
    icon: Thaumcraft:ItemSpawnerEgg:12
    banner: "O Construto Eldritch"
    subtitle: "Pedra que pensa"
    desc: |
      Prepare-se, Herói: um golem colossal de pedra antiga, com §e250 de vida§r e golpes que arremessam você longe! Lento, mas implacável. Depois de tantas pesquisas e masmorras, este é um teste à altura.

      Mantenha distância, ataque e recue; não deixe ele te encurralar. Leve armadura boa, poções e atenção total. Como o Warden, deixa cair uma §dPérola Primordial§r e um Tesouro Raro, que abrem o próximo passo do capítulo. Respire fundo, escolha bem a arena e traga a vitória para casa. Eu acredito em você, vá e volte vitorioso!
    tasks:
      - kill: "Thaumcraft.EldritchGolem x1"
    rewards:
      - xp: 10
      - loot: epico

  - id: portal_carmesim
    title: "O Portal Carmesim"
    type: boss
    deps: [tabua_runica]
    icon: Thaumcraft:ItemSpawnerEgg:11
    banner: "O Portal Carmesim"
    subtitle: "O Culto invade"
    desc: |
      Algumas fechaduras despertam um §ePortal Carmesim§r (500 de vida) que despeja cultistas sem parar, incluindo o §ePretor§r, líder com armadura dourada que pode empunhar a Lâmina Carmesim. Destrua o portal enquanto controla a horda, Herói.

      O portal deixa a §dPérola Primordial§r. O Pretor deixa um Tesouro Raro. Leve boa armadura, poções de cura e armas afiadas, e não lute no meio da horda. Depois de tanta pesquisa, você está pronto para isso. Confira o NEI (U) se quiser rever os drops. Boa luta!
    tasks:
      - kill: "Thaumcraft.CultistPortal x1"
    rewards:
      - xp: 10
      - loot: epico

  - id: pretor
    title: "O Pretor Carmesim"
    type: optional
    deps: [portal_carmesim]
    icon: Thaumcraft:ItemHelmetCultistLeaderPlate
    desc: |
      O líder do Culto, Herói: 125 de vida e muito rápido! Derrote um Pretor.

      A armadura dele é rara de conseguir, e o Tainted Magic ensina a forjá-la. É uma missão opcional, mas rende troféus valiosos. Leve armadura boa, poções e mantenha a calma durante a luta. Respire fundo e vá com tudo, estou torcendo por você!
    tasks:
      - kill: "Thaumcraft.CultistLeader x1"
    rewards:
      - loot: raro

  - id: taintaculo_gigante
    title: "Taintáculos Gigantes"
    type: boss
    deps: [tabua_runica]
    icon: Thaumcraft:ItemSpawnerEgg:28
    banner: "Taintáculos Gigantes"
    subtitle: "A Mácula tem raízes"
    desc: |
      A sala mais nojenta do labirinto! Várias §eTaintáculos Gigantes§r (125 de vida cada) brotam do chão e a mácula toma as paredes. Só o último a morrer deixa a §dPérola Primordial§r.

      Ataque de longe e cuidado com o Veneno de Fluxo, Herói. Leve arco, poções e armadura boa. É uma luta bem suja, mas a recompensa vale a pena. Depois de tantas pesquisas e trabalho para chegar até aqui, você está pronto. Respire fundo, mire bem e vá com tudo. Eu estou aqui torcendo por você, e depois vamos comemorar juntos!
    tasks:
      - kill: "Thaumcraft.TaintacleGiant x1"
    rewards:
      - xp: 10
      - loot: epico

  - id: perola_primordial
    title: "A Pérola Primordial"
    type: milestone
    deps_any: true
    deps: [warden_eldritch, construto_eldritch, portal_carmesim, taintaculo_gigante]
    icon: Thaumcraft:ItemEldritchObject:3
    banner: "A Pérola Primordial"
    subtitle: "Matéria do começo de tudo"
    desc: |
      "Pela primeira vez você tem nas mãos um enigma que talvez não possa ser resolvido." A
      §dPérola Primordial§r contém aspectos primais puros, diferentes de tudo que você conhece:
      restos da aurora da realidade... ou matéria de um lugar fora das regras da magia.

      Herói, eu sinto o Registro tremer quando você segura isso. É uma página do começo do
      mundo. Use com sabedoria: Triturador Primal, Fornalha Alquímica Avançada, manipulação de
      nós primordiais, e muitos addons (Tainted, Forbidden, Thaumic Horizons) pedem pérolas.
    tasks:
      - get: Thaumcraft:ItemEldritchObject:3
    rewards:
      - xp: 12
      - kit: {name: "Kit do Explorador Eldritch", items: [Thaumcraft:ItemResource:16 x8, Thaumcraft:ItemSanitySoap x2, Thaumcraft:ItemResource:15 x2, minecraft:golden_apple x4]}
      - loot: epico

  # ======================================================================
  # FASE 12 — OS PODERES DA PÉROLA
  # ======================================================================
  - id: triturador_primal
    title: "Triturador Primal"
    type: main
    deps: [perola_primordial, ferramentas_vazio_completas]
    deps_hidden: [thaumcraft:picareta_nucleo, thaumcraft:pa_movedor]
    icon: Thaumcraft:ItemPrimalCrusher
    desc: |
      A Pérola Primordial no centro, cercada pela Picareta do Núcleo, Pá do Movedor de Terra,
      picareta e pá do vazio e Primal Charms: o §eTriturador Primal§r minera §e3×3§r em terra e
      pedra, às vezes solta aglomerados nativos, se conserta e serve de arma. (Perde as funções
      de construir e "escutar" das ferramentas originais.)
    tasks:
      - get: Thaumcraft:ItemPrimalCrusher
    rewards:
      - xp: 6
      - choice: [Thaumcraft:ItemResource:16 x4, minecraft:diamond x4, Thaumcraft:ItemResource:15 x2]

  - id: fornalha_avancada
    title: "Fornalha Alquímica Avançada"
    type: normal
    deps: [perola_primordial, metal_vazio]
    icon: Thaumcraft:blockMetalDevice:3
    desc: |
      Construtos Alquímicos Avançados (construtos + Metal do Vazio + a Pérola) formam com
      alambiques, construtos comuns e uma Fornalha Alquímica uma estrutura 3×2×3; clique com a
      varinha (50 Ignis, 50 Aqua, 50 Ordo). Ela processa muito mais rápido usando §eIgnis§r como
      calor (sempre), Perditio e Aqua ao trabalhar. Confira a montagem exata no livro.
    tasks:
      - get: Thaumcraft:blockMetalDevice:3 x4
    rewards:
      - xp: 4
      - item: Thaumcraft:blockMetalDevice:1 x2

  - id: no_primordial
    title: "Manipulação de Nó Primordial"
    type: optional
    deps: [perola_primordial]
    icon: Thaumcraft:blockAiry
    desc: |
      "Uma teoria meio maluca": use a Pérola Primordial diretamente num nó. Ela se dissolve e
      §eembaralha§r o nó: aspectos primais podem subir ou descer, compostos às vezes caem, e nós
      desbotados podem melhorar (ou um nó comum ficar brilhante). Com a pesquisa Primordial
      Node Manipulation as chances melhoram "um pouquinho". Arrisque num nó que valha a pena.
    tasks:
      - check
    rewards:
      - loot: raro

  - id: cajado_primal
