    deps_hidden: [texploration:botas_meteoro, texploration:botas_cometa]
    icon: thaumicboots:item.ItemCometMeteor
    desc: |
      As Botas do Meteoro e do Cometa (do Thaumic Exploration) numa só! Infusão
