    tasks:
      - get: industrialupgrade:basecircuit:3
    rewards:
      - xp: 3
      - item: industrialupgrade:iuingot:10 x4

  - id: qfp_nano
    title: "Chip QFP Nano"
    type: main
    deps: [capacitor_nano]
    icon: industrialupgrade:basecircuit:6
    desc: |
