  - id: fundamentos_completos
    title: "Fundamentos das Melhorias"
    type: milestone
    deps: [painel_solar_avancado, fabrica_melhorada, metalurgia_iu, mfsu_iu]
    icon: industrialupgrade:QuantumItems9
    banner: "Fundamentos das Melhorias"
    subtitle: "Industrial Upgrade I completo"
    effect: 3
    desc: |
      Herói, pare um segundo e olhe a sua base. Dezessete metais novos nos baús. Dez ligas.
      Uma fábrica de chips aquecida a 4500 graus. Máquinas que trabalham em dobro. Um MFSU que
