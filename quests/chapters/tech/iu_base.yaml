      - kit: {name: "Kit do Primeiro Sol", items: [IC2:blockGenerator:3 x3, industrialupgrade:sunnarium:4 x8, industrialupgrade:ssp_crafting_items:1 x2, industrialupgrade:ItemCore x2, IC2:itemPartCircuit x2]}
