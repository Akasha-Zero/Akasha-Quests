      - kit: {name: "Kit do Minerador Automático", items: ["BuildCraft|Core:markerBlock x4", "BuildCraft|Transport:item.buildcraftPipe.pipeitemsvoid x2", "BuildCraft|Transport:item.buildcraftPipe.pipeitemsdiamond x2", minecraft:chest x4, minecraft:diamond x2]}
      - loot: raro

