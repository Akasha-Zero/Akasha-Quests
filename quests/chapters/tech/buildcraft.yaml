      §e60 RF/t§r (o dobro do petróleo), e no Dínamo de Compressão do Thermal vale 1 500 000 RF por
      balde. Galacticraft e outros mods também usam.
    tasks:
      - get: "BuildCraft|Energy:bucketFuel"
    rewards:
      - xp: 5
      - choice: [minecraft:bucket x4, "BuildCraft|Core:ironGearItem x2", minecraft:water_bucket x2]

