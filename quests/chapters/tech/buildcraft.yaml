    tasks:
      - get: "BuildCraft|Factory:pumpBlock"
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x12, "BuildCraft|Factory:tankBlock x2", minecraft:bucket x4]

  - id: comporta
    title: "Comporta Hidráulica"
    type: optional
    deps: [bomba]
    icon: "BuildCraft|Factory:floodGateBlock"
    desc: |
