      interface aceita qualquer recipiente como exemplo). §e• Ferro:§r válvula. §e• Vazio:§r
      apaga fluidos. Faça qualquer um.
    tasks:
      - one_of: ["BuildCraft|Transport:item.buildcraftPipe.pipefluidsemerald", "BuildCraft|Transport:item.buildcraftPipe.pipefluidsdiamond", "BuildCraft|Transport:item.buildcraftPipe.pipefluidsiron", "BuildCraft|Transport:item.buildcraftPipe.pipefluidsvoid"]
    rewards:
      - loot: comum

  - id: tanque_bc
    title: "Tanque"
    type: main
    deps: [canos_fluido]
    icon: "BuildCraft|Factory:tankBlock"
    desc: |
