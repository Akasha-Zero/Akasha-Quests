chapter:
  id: buildcraft
  title: "BuildCraft"
  prefix: ""
  order: 310
  icon: "BuildCraft|Core:woodenGearItem"
  desc: |
    §bO Volume das Engrenagens.§r Motores que bombeiam, canos de todas as cores, pedreiras que
    devoram o chão, petróleo virando combustível, lasers, portas lógicas e robôs.
    (BuildCraft 7.1.63 + BuildCraft Compat 7.1.22)

quests:
  # ======================================================================
  # FASE 0 — ENGRENAGENS
  # ======================================================================
  - id: engrenagem_madeira
    title: "A Primeira Engrenagem"
    type: main
    icon: "BuildCraft|Core:woodenGearItem"
    desc: |
      Antes de qualquer cano, motor ou robô, existe uma roda dentada de madeira. É um dos Volumes
      mais antigos do Registro, Herói — os Antigos aprenderam a automatizar com ele.

      4 gravetos em cruz (centro vazio) = §eEngrenagem de Madeira§r. Daqui em diante cada
      engrenagem usa a anterior no centro: madeira → pedra → ferro → ouro → diamante.
    tasks:
      - get: "BuildCraft|Core:woodenGearItem x2"
    rewards:
      - xp: 3
      - choice: [minecraft:stick x32, minecraft:planks x32, minecraft:cobblestone x32]

  - id: engrenagem_pedra
    title: "Engrenagem de Pedra"
    type: main
    deps: [engrenagem_madeira]
    icon: "BuildCraft|Core:stoneGearItem"
    desc: |
      4 pedregulhos em volta de uma Engrenagem de Madeira. A §eEngrenagem de Pedra§r vai na Chave
      Inglesa, no Motor Stirling, na Mesa de Trabalho Automática e no Funil. Faça 4.
    tasks:
      - get: "BuildCraft|Core:stoneGearItem x4"
    rewards:
      - xp: 3
      - choice: [minecraft:cobblestone x64, minecraft:iron_ingot x4, minecraft:stick x32]

  - id: engrenagem_ferro
    title: "Engrenagem de Ferro"
    type: main
    deps: [engrenagem_pedra]
    icon: "BuildCraft|Core:ironGearItem"
    desc: |
      4 lingotes de ferro em volta de uma Engrenagem de Pedra. Motor de Combustão, Bomba, Pedreira,
      Minerador de Poços... a §eEngrenagem de Ferro§r está em toda parte. Faça 4.

      §aObs.:§r ela conta como `gearIron` no oredict, então serve em receitas de outros mods.
    tasks:
      - get: "BuildCraft|Core:ironGearItem x4"
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x12, minecraft:redstone x16, minecraft:gold_ingot x4]

  - id: engrenagem_ouro
    title: "Engrenagem de Ouro"
    type: main
    deps: [engrenagem_ferro]
    icon: "BuildCraft|Core:goldGearItem"
    desc: |
      4 de ouro em volta de uma de ferro. Vai na Pedreira, no Preenchedor, no Marco de Construção e
      na Mesa de Carga. Faça 2.
    tasks:
      - get: "BuildCraft|Core:goldGearItem x2"
    rewards:
      - xp: 3
      - choice: [minecraft:gold_ingot x8, minecraft:redstone x16, minecraft:iron_ingot x8]

  - id: engrenagem_diamante
    title: "Engrenagem de Diamante"
    type: main
    deps: [engrenagem_ouro]
    icon: "BuildCraft|Core:diamondGearItem"
    desc: |
      4 diamantes em volta de uma de ouro. Cara? Muito. Mas é ela que gira a Pedreira, a
      Refinaria, o Construtor, a Mesa de Arquitetura e as mesas de laser. Faça 2 quando puder.
    tasks:
      - get: "BuildCraft|Core:diamondGearItem x2"
    rewards:
      - xp: 4
      - choice: [minecraft:diamond x2, minecraft:gold_ingot x8, minecraft:redstone_block x2]

  - id: chave_inglesa
    title: "Chave Inglesa"
    type: normal
    deps: [engrenagem_pedra]
    icon: "BuildCraft|Core:wrenchItem"
    desc: |
      3 ferros e uma Engrenagem de Pedra. A §eChave Inglesa§r gira motores, muda a saída dos canos
      de madeira/ferro e configura portas lógicas. Quase todo mod do pack aceita ela como chave.
    tasks:
      - get: "BuildCraft|Core:wrenchItem"
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x4

  - id: aula_energia
    title: "Aula: Energia no BuildCraft 7"
    type: info
    deps: [engrenagem_madeira]
    icon: "BuildCraft|Core:engineBlock"
    desc: |
      Antigamente o BuildCraft usava MJ. §bNa versão 7 tudo funciona em RF§r — o mesmo fluxo do
      Thermal, do Ender IO e de meio pack. Motores do BuildCraft alimentam máquinas de outros mods
      e vice-versa.

      Regras importantes:
      §e•§r Motores esquentam: azul → verde → amarelo → vermelho. §aNo pack os motores não
      explodem§r (`canEnginesExplode=false`), mas superaquecidos param até esfriar.
      §e•§r O §eMotor de Redstone§r só "empurra" canos (extração de canos de madeira); ele não
      alimenta máquinas.
      §e•§r Para levar RF use os §eTubos Cinéticos§r (tubo de itens + redstone).
    tasks:
      - check
    rewards:
      - xp: 1

  # ======================================================================
  # FASE 1 — MOTORES
  # ======================================================================
  - id: motor_redstone
    title: "Motor de Redstone"
    type: main
    deps: [engrenagem_madeira]
    icon: "BuildCraft|Core:engineBlock"
    desc: |
      Tábuas, vidro, um pistão e duas Engrenagens de Madeira. O §eMotor de Redstone§r é ligado
      com um sinal de redstone (alavanca!) e serve para uma coisa: fazer o §eCano de Madeira§r
      puxar itens de um baú. Fraquinho, mas nunca superaquece.
    tasks:
      - get: "BuildCraft|Core:engineBlock"
    rewards:
      - xp: 3
      - choice: [minecraft:lever x4, minecraft:redstone x16, minecraft:planks x32]

  - id: motor_stirling
    title: "Motor Stirling"
    type: main
    deps: [motor_redstone, engrenagem_pedra]
    icon: "BuildCraft|Core:engineBlock:1"
    desc: |
      O jogo em pt_BR chama de "Motor a Vapor", mas é o §eMotor Stirling§r: pedregulho, vidro,
      pistão e Engrenagens de Pedra. Queima qualquer combustível de fornalha e gera RF de
      verdade (~10 RF/t). Ligue com redstone, encoste numa máquina ou num Tubo Cinético de
      Madeira.
    tasks:
      - get: "BuildCraft|Core:engineBlock:1"
    rewards:
      - xp: 3
      - choice: [minecraft:coal x32, minecraft:cobblestone x64, minecraft:lever x4]

  - id: motor_combustao
    title: "Motor de Combustão"
    type: main
    deps: [motor_stirling, engrenagem_ferro]
    icon: "BuildCraft|Core:engineBlock:2"
    desc: |
      Ferro, vidro, pistão e Engrenagens de Ferro. O §eMotor de Combustão§r queima combustíveis
      líquidos — no pack: §ePetróleo 30 RF/t§r e §eCombustível 60 RF/t§r — e precisa de
      §earrefecimento§r (água) para não superaquecer e parar.

      Ele guarda até 100 000 RF de buffer. Bombeie água com uma Bomba, um Acumulador Aquoso do
      Thermal ou nós de líquido do Extra Utilities.
    tasks:
      - get: "BuildCraft|Core:engineBlock:2"
    rewards:
      - xp: 4
      - choice: [minecraft:water_bucket x2, minecraft:iron_ingot x12, minecraft:redstone x16]

  # ======================================================================
  # FASE 2 — CANOS DE ITENS
  # ======================================================================
  - id: aula_canos
    title: "Aula: Como os Canos Pensam"
    type: info
    deps: [engrenagem_madeira]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemscobblestone"
    desc: |
      Um cano é: §e2 materiais com um vidro no meio§r, em linha = 8 canos. Regras de ouro:
      §e•§r Itens §esó entram§r em canos por um §eCano de Madeira§r (ou Esmeralda) acionado por um
      motor — ou por máquinas que empurram sozinhas.
      §e•§r Canos de Pedregulho, Pedra e Quartzo §cnão se conectam entre si§r — use isso para
      separar linhas vizinhas.
      §e•§r Itens perdem velocidade no caminho (o pedregulho "freia" mais, o quartzo menos); o
      §eCano de Ouro§r acelera.
      §e•§r Num cruzamento sem regra, o item escolhe um caminho aleatório.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: cano_madeira
    title: "Cano de Madeira"
    type: main
    deps: [aula_canos, motor_redstone]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemswood"
    desc: |
      Tábua + vidro + tábua. O §eCano de Transporte de Madeira§r é o "aspirador": com um motor
      encostado, ele puxa itens do inventário ao lado. Use a Chave Inglesa para escolher de qual
      lado ele puxa. Faça 8.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemswood x8"
    rewards:
      - xp: 3
      - choice: [minecraft:planks x32, minecraft:glass x16, minecraft:chest x2]

  - id: cano_pedregulho
    title: "Cano de Pedregulho"
    type: main
    deps: [cano_madeira]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemscobblestone"
    desc: |
      O cano mais barato e o mais "pegajoso": itens andam devagar. Perfeito para trechos curtos.
      Faça 16 e leve os itens do Cano de Madeira até um baú.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemscobblestone x16"
    rewards:
      - xp: 3
      - choice: [minecraft:cobblestone x64, minecraft:glass x16, minecraft:chest x2]

  - id: cano_pedra
    title: "Cano de Pedra"
    type: normal
    deps: [cano_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsstone"
    desc: |
      Pedra lisa + vidro. Atrito médio. Não se conecta ao de pedregulho nem ao de quartzo — ótimo
      para correr duas linhas lado a lado sem misturar.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsstone x8"
    rewards:
      - xp: 2
      - item: minecraft:stone x16

  - id: cano_quartzo
    title: "Cano de Quartzo"
    type: normal
    deps: [cano_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsquartz"
    desc: |
      Bloco de quartzo + vidro. O cano básico de §emenor atrito§r: os itens deslizam longe.
      Também não se conecta aos de pedra e pedregulho.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsquartz x8"
    rewards:
      - xp: 2
      - item: minecraft:quartz x8

  - id: cano_ouro
    title: "Cano de Ouro"
    type: normal
    deps: [cano_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsgold"
    desc: |
      Ouro + vidro. O §eCano de Ouro§r §eacelera§r os itens que passam por ele. Coloque um a cada
      tantos blocos numa linha longa e nada fica parado no caminho.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsgold x4"
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x2

  - id: cano_ferro
    title: "Cano de Ferro"
    type: normal
    deps: [cano_pedregulho, chave_inglesa]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsiron"
    desc: |
      Ferro + vidro. O §eCano de Ferro§r tem §euma única saída§r: tudo que entra sai pelo lado
      escolhido (gire com a Chave Inglesa ou por porta lógica). Ideal para impedir que itens voltem.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsiron x4"
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x4

  - id: cano_diamante
    title: "Cano de Diamante"
    type: main
    deps: [cano_ouro, cano_ferro]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsdiamond"
    desc: |
      O seletor! Diamante + vidro. Abra a interface do §eCano de Diamante§r: são 6 linhas
      coloridas, uma para cada lado. Coloque um exemplar do item na linha da cor do lado por onde
      ele deve sair. Itens sem regra vão pelos lados sem filtro.

      É aqui que nasce a sua primeira triagem automática de minérios.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsdiamond x2"
    rewards:
      - xp: 4
      - choice: [minecraft:diamond, minecraft:gold_ingot x6, minecraft:chest x4]

  - id: cano_obsidiana
    title: "Cano de Obsidiana"
    type: normal
    deps: [cano_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsobsidian"
    desc: |
      Obsidiana + vidro. O §eCano de Obsidiana§r §esuga itens soltos§r no chão perto da ponta
      aberta. Com um motor ligado, o alcance aumenta. Ótimo embaixo de uma fazenda de mobs.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsobsidian x2"
    rewards:
      - xp: 2
      - item: minecraft:obsidian x4

  - id: cano_esmeralda
    title: "Cano de Esmeralda"
    type: normal
    deps: [cano_madeira]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsemerald"
    desc: |
      O irmão rico do Cano de Madeira: extrai itens com §efiltro§r (lista branca, lista negra ou
      rodízio em ordem). Precisa de motor, como o de madeira. Esmeralda + vidro.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsemerald x2"
    rewards:
      - xp: 2
      - item: minecraft:emerald

  - id: cano_arenito
    title: "Cano de Arenito"
    type: normal
    deps: [cano_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemssandstone"
    desc: |
      Arenito + vidro. O §eCano de Arenito§r §esó se conecta a outros canos§r, nunca a baús ou
      máquinas. Passe ao lado de um baú sem medo de os itens entrarem nele.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemssandstone x8"
    rewards:
      - xp: 2
      - item: minecraft:sandstone x16

  - id: cano_vazio
    title: "Cano do Vazio"
    type: normal
    deps: [cano_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsvoid"
    desc: |
      Corante preto + vidro + redstone. Tudo que entra no §eCano Vazio§r §cdesaparece§r. Junte com
      um Cano de Diamante para jogar fora só o pedregulho e a terra.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsvoid"
    rewards:
      - xp: 2
      - item: minecraft:redstone x8

  - id: cano_argila
    title: "Cano de Argila"
    type: normal
    deps: [cano_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsclay"
    desc: |
      Argila + vidro. O §eCano de Argila§r é de inserção: ele §eprioriza máquinas e baús vizinhos§r
      antes de mandar itens adiante pelos canos. Bom para alimentar uma fileira de fornalhas.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsclay x4"
    rewards:
      - xp: 2
      - item: minecraft:clay_ball x16

  - id: cano_lapis
    title: "Cano de Lápis-Lazúli"
    type: optional
    deps: [cano_diamante]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemslapis"
    desc: |
      Blocos de lápis + vidro. O §eCano de Lazuli§r §epinta§r os itens que passam com uma cor
      (agachado + clique para trocar). Itens pintados podem ser roteados pelo Cano de Daizuli.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemslapis"
    rewards:
      - loot: comum

  - id: cano_daizuli
    title: "Cano de Daizuli"
    type: optional
    deps: [cano_lapis]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsdaizuli"
    desc: |
      Bloco de lápis + vidro + diamante. O §eDaizuli§r manda itens §eda cor escolhida§r para um
      lado específico e os outros seguem o fluxo. Lazuli + Daizuli = triagem por cor.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsdaizuli"
    rewards:
      - loot: comum

  - id: cano_emzuli
    title: "Cano de Emzuli"
    type: optional
    deps: [cano_lapis, cano_esmeralda]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsemzuli"
    desc: |
      Bloco de lápis + vidro + esmeralda. Um cano de §eextração com predefinições§r: até quatro
      filtros que podem pintar os itens extraídos, trocados por portas lógicas. O sonho de quem
      gosta de logística complicada (eu!).
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsemzuli"
    rewards:
      - loot: comum

  - id: cano_listrado
    title: "Cano Listrado"
    type: optional
    deps: [cano_ouro, engrenagem_ouro]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsstripes"
    desc: |
      Engrenagens de Ouro + vidro. O §eCano Listrado§r "usa" os itens que chegam à ponta dele:
      coloca blocos, usa ferramentas, planta... Com energia, ele também pode se estender. Um
      pequeno construtor de canos.
    tasks:
      - get: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsstripes"
    rewards:
      - loot: comum

  - id: cano_estrutura
    title: "Cano de Estrutura"
    type: optional
    deps: [cano_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipestructurecobblestone"
    desc: |
      Pedregulho + cascalho. O §eCano de Estrutura§r não transporta nada: serve de suporte para
      portas lógicas, fios e fachadas. Quebrado em 4, vira §eTampa de Cano§r, que fecha um lado de
      qualquer cano.
    tasks:
      - get: ["BuildCraft|Transport:item.buildcraftPipe.pipestructurecobblestone x4", "BuildCraft|Transport:pipePlug x4"]
    rewards:
      - loot: comum

  - id: lentes_filtros
    title: "Lentes e Filtros"
    type: optional
    deps: [cano_diamante, mesa_montagem]
    icon: "BuildCraft|Transport:pipeLens"
    desc: |
      Na Mesa de Montagem: vidro + corante = 2 §eLentes§r; vidro + corante + barras de ferro = 2
      §eFiltros§r. Encaixados num cano, a lente pinta os itens que passam e o filtro só deixa
      passar itens daquela cor.
    tasks:
      - one_of: ["BuildCraft|Transport:pipeLens:*"]
    rewards:
      - loot: comum

  - id: buffer_filtrado
    title: "Buffer Filtrado"
    type: optional
    deps: [cano_diamante]
    icon: "BuildCraft|Transport:filteredBufferBlock"
    desc: |
      Tábuas, baú, pistão e um Cano de Diamante. O §eBuffer Filtrado§r é um baú com 9 slots que só
      aceita os itens que você marcar. Ótimo para alimentar máquinas com a quantia certinha.
    tasks:
      - get: "BuildCraft|Transport:filteredBufferBlock"
    rewards:
      - loot: comum

  - id: funil_bc
    title: "Funil do BuildCraft"
    type: optional
    deps: [engrenagem_pedra]
    icon: "BuildCraft|Factory:blockHopper"
    desc: |
      Um funil comum + Engrenagem de Pedra (ou ferro, baú e engrenagem). O "Chute" do BuildCraft
      despeja os itens direto em canos — e, com motor, empurra mais rápido.
    tasks:
      - get: "BuildCraft|Factory:blockHopper"
    rewards:
      - loot: comum

  - id: bancada_automatica
    title: "Mesa de Trabalho Automática"
    type: normal
    deps: [engrenagem_pedra]
    icon: "BuildCraft|Factory:autoWorkbenchBlock"
    desc: |
      Uma bancada + 2 Engrenagens de Pedra. Monte a receita na grade, coloque os ingredientes no
      inventário de baixo e ela fabrica sozinha (mais rápido com motor). Puxe o resultado com um
      Cano de Madeira. Engrenagens automáticas? Sim, por favor.
    tasks:
      - get: "BuildCraft|Factory:autoWorkbenchBlock"
    rewards:
      - xp: 2
      - item: minecraft:crafting_table x2

  - id: triagem
    title: "A Primeira Triagem"
    type: milestone
    deps: [cano_diamante, cano_vazio, motor_stirling, bancada_automatica]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipeitemsdiamond"
    banner: "Os Canos Vivem"
    subtitle: "Itens correndo sozinhos"
    desc: |
      Motores batendo, Canos de Madeira puxando, Diamante separando, Vazio sumindo com o lixo e
      uma Mesa de Trabalho fabricando sozinha. Herói, você acabou de ensinar a base a se
      organizar!

      Dicas:
      §e•§r Coloque um §eCano de Ouro§r a cada 10–15 blocos em linhas longas.
      §e•§r Use canos de §eArenito§r ao passar perto de baús que não devem receber itens.
      §e•§r Itens que não acham destino §cvoltam ou caem no chão§r — sempre tenha um baú de
      "sobras" no fim da linha.

      Agora: fluidos, energia e... petróleo.
    tasks:
      - get: ["BuildCraft|Transport:item.buildcraftPipe.pipeitemsdiamond", "BuildCraft|Transport:item.buildcraftPipe.pipeitemsvoid", "BuildCraft|Core:engineBlock:1", "BuildCraft|Factory:autoWorkbenchBlock"]
    rewards:
      - xp: 6
      - kit: {name: "Kit do Encanador", items: ["BuildCraft|Transport:item.buildcraftPipe.pipeitemscobblestone x32", "BuildCraft|Transport:item.buildcraftPipe.pipeitemsgold x4", "BuildCraft|Core:ironGearItem x2", minecraft:glass x16, minecraft:chest x2]}
      - loot: incomum

  # ======================================================================
  # FASE 3 — FLUIDOS
  # ======================================================================
  - id: vedacao
    title: "Vedação de Tubo"
    type: main
    deps: [cano_pedregulho]
    icon: "BuildCraft|Transport:pipeWaterproof"
    desc: |
      §eVedação de Tubo§r = 1 corante verde de cacto (ou 1 cera de abelha do Forestry). Cano de
      itens + vedação na bancada = §eCano de Fluido§r do mesmo material. Faça 4.
    tasks:
      - get: "BuildCraft|Transport:pipeWaterproof x4"
    rewards:
      - xp: 3
      - choice: [minecraft:cactus x8, minecraft:dye:2 x8, minecraft:bucket x2]

  - id: canos_fluido
    title: "Canos de Fluido"
    type: main
    deps: [vedacao]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipefluidscobblestone"
    desc: |
      Os canos de fluido seguem as regras dos de itens: §eMadeira§r extrai (com motor), §ePedra/
      Pedregulho/Quartzo§r não se misturam, §eOuro§r leva mais por segundo, §eFerro§r é válvula
      de mão única, §eArenito§r só liga em canos, §eVazio§r apaga, §eArgila§r insere.

      Faça §e1 Cano de Fluido de Madeira§r e §e8 de Pedregulho§r.
    tasks:
      - get: ["BuildCraft|Transport:item.buildcraftPipe.pipefluidswood", "BuildCraft|Transport:item.buildcraftPipe.pipefluidscobblestone x8"]
    rewards:
      - xp: 3
      - choice: [minecraft:bucket x4, minecraft:glass x16, minecraft:cobblestone x64]

