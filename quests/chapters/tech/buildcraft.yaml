    tasks:
      - get: "BuildCraft|Factory:floodGateBlock"
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 4 — ENERGIA: TUBOS CINÉTICOS
  # ======================================================================
  - id: cinetico_madeira
    title: "Tubo Cinético de Madeira"
    type: main
    deps: [motor_stirling, cano_madeira]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipepowerwood"
    desc: |
