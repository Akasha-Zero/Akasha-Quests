      - get: "BuildCraft|Silicon:laserTableBlock:1"
    rewards:
      - xp: 2
      - item: minecraft:obsidian x4

  - id: mesa_integracao
    title: "Mesa de Integração"
    type: normal
    deps: [chipset_redstone, engrenagem_diamante]
    icon: "BuildCraft|Silicon:laserTableBlock:2"
    desc: |
      Obsidiana, ouro, chipset e Engrenagem de Diamante. A §eMesa de Integração§r §ecombina§r
