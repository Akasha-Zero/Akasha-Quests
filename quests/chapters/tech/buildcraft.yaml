    rewards:
      - xp: 3
      - choice: [minecraft:redstone x16, minecraft:cobblestone x64, minecraft:glass x16]

  - id: cinetico_ouro
    title: "Tubos Cinéticos de Ouro e Diamante"
    type: normal
    deps: [cinetico_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipepowergold"
    desc: |
      Para a Pedreira e a Refinaria você vai querer tubos que aguentem bastante RF. Faça 4 de
      §eOuro§r (ou de Diamante, se estiver com diamante sobrando).
    tasks:
      - one_of: ["BuildCraft|Transport:item.buildcraftPipe.pipepowergold x4", "BuildCraft|Transport:item.buildcraftPipe.pipepowerdiamond x4"]
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x4

  - id: cinetico_especiais
    title: "Tubos Cinéticos Especiais"
    type: optional
    deps: [cinetico_pedregulho]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipepoweriron"
    desc: |
      §e• Ferro:§r limitador ajustável (Chave Inglesa ou portas lógicas mudam o limite).
      §e• Esmeralda:§r outra entrada de energia, como a Madeira.
      §e• Arenito:§r só se conecta a outros tubos.
      Faça qualquer um.
    tasks:
      - one_of: ["BuildCraft|Transport:item.buildcraftPipe.pipepoweriron", "BuildCraft|Transport:item.buildcraftPipe.pipepoweremerald", "BuildCraft|Transport:item.buildcraftPipe.pipepowersandstone"]
    rewards:
      - loot: comum

