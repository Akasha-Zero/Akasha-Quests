    deps: [porta_basica, chipsets_metal]
    icon: "BuildCraft|Transport:pipeGate"
    desc: |
      Chipset de Ferro + fios vermelho e azul. A §ePorta de Ferro§r tem 2 gatilhos e 2 ações, em
      lógica §eE§r (todos os gatilhos) ou §eOU§r (qualquer um) — troque na Mesa de Integração ou
      escolha ao fabricar.
    tasks:
      - {get: 'BuildCraft|Transport:pipeGate {mat:1b}', nbt: true}
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x4

  - id: porta_ouro
    title: "Porta Lógica de Ouro"
    type: normal
    deps: [porta_ferro, fios_todos]
    icon: "BuildCraft|Transport:pipeGate"
    desc: |
      Chipset de Ouro + fios vermelho, azul e verde. Mais gatilhos, mais ações e parâmetros. Para
      sistemas que precisam "pensar" um pouco mais.
    tasks:
      - {get: 'BuildCraft|Transport:pipeGate {mat:2b}', nbt: true}
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x4

  - id: porta_diamante
    title: "Portas de Diamante e Esmeralda"
    type: optional
    deps: [porta_ouro, chipset_diamante]
    icon: "BuildCraft|Transport:pipeGate"
    desc: |
      Chipset de Diamante (ou de Esmeralda) + os quatro fios = as portas mais poderosas, com 8
      gatilhos/ações e as quatro cores de fio. A de Quartzo (chipset de quartzo + 3 fios) fica
      no meio do caminho. Faça a de Diamante ou a de Esmeralda.
    tasks:
      - one_of: ['BuildCraft|Transport:pipeGate {mat:3b}', 'BuildCraft|Transport:pipeGate {mat:4b}']
        nbt: true
    rewards:
      - loot: incomum

  - id: expansoes_porta
    title: "Expansões de Porta"
    type: optional
    deps: [porta_basica, mesa_integracao, chipsets_especiais]
    icon: "BuildCraft|Silicon:redstoneChipset:4"
    desc: |
      Na Mesa de Integração, uma porta + um chipset especial = porta com §eexpansão§r:
      §e• Pulsar§r (Chipset Pulsante): emite pulsos de energia/sinal — liga motores em intervalos.
      §e• Temporizador§r (Chipset de Quartzo) e §e• Fader§r (Chipset Comparador): sinais que mudam
      com o tempo. Mostre que tem os chipsets e a mesa.
    tasks:
      - get: ["BuildCraft|Silicon:laserTableBlock:2", "BuildCraft|Silicon:redstoneChipset:4"]
    rewards:
      - loot: comum

  - id: copiadora
    title: "Copiadora de Porta Lógica"
    type: optional
    deps: [porta_basica, chave_inglesa]
    icon: "BuildCraft|Transport:gateCopier"
    desc: |
      Chave Inglesa + Chipset de Redstone. A §eCopiadora§r grava a configuração de uma porta e
      cola em outra igual. Configurar vinte portas iguais? Uma só vez.
    tasks:
      - get: "BuildCraft|Transport:gateCopier"
    rewards:
      - loot: comum

  - id: fachadas
    title: "Fachadas"
    type: optional
    deps: [mesa_montagem, cano_estrutura]
    icon: "BuildCraft|Transport:pipeFacade"
    desc: |
      Uma §eFachada§r cobre o lado de um cano com a textura de um bloco (pedra, madeira, vidro...)
      e esconde a bagunça. Feitas na bancada/Mesa de Montagem a partir de canos de estrutura e do
      bloco (confira no NEI: há milhares). Base bonita, Herói!
    tasks:
      - get: "BuildCraft|Transport:pipeFacade:*"
    rewards:
      - loot: comum

  - id: pincel
    title: "Pincel"
    type: optional
    deps: [engrenagem_madeira]
    icon: "BuildCraft|Core:paintbrush"
    desc: |
      O §ePincel§r do BuildCraft pinta canos de 16 cores. Canos pintados de cores diferentes não se
      conectam entre si: uma forma elegante de passar duas linhas coladinhas.
    tasks:
      - get: "BuildCraft|Core:paintbrush:*"
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 9 — CONSTRUTORES
  # ======================================================================
  - id: modelo
    title: "Modelo"
    type: normal
    deps: [marcador]
    icon: "BuildCraft|Builders:templateItem"
    desc: |
      8 papéis + corante preto = §eModelo§r. Ele guarda só a §eforma§r de uma construção (blocos
      cheios ou vazios), sem tipos de bloco.
    tasks:
      - get: "BuildCraft|Builders:templateItem"
    rewards:
      - xp: 2
      - item: minecraft:paper x16

  - id: diagrama
    title: "Diagrama"
    type: main
    deps: [marcador]
    icon: "BuildCraft|Builders:blueprintItem"
    desc: |
      8 papéis + lápis-lazúli = §eDiagrama (Blueprint)§r. Ao contrário do Modelo, ele guarda os
      §eblocos exatos§r de uma construção. Faça 2.
    tasks:
      - get: "BuildCraft|Builders:blueprintItem x2"
    rewards:
      - xp: 3
      - choice: [minecraft:paper x32, minecraft:dye:4 x8, minecraft:book x4]

  - id: mesa_arquitetura
    title: "Mesa de Arquitetura"
    type: main
    deps: [diagrama, engrenagem_diamante]
    icon: "BuildCraft|Builders:architectBlock"
    desc: |
      Corantes, Marcador, bancada, Diagrama e Engrenagens de Diamante. Coloque a §eMesa de
      Arquitetura§r encostada numa área marcada com Marcadores, ponha um Diagrama ou Modelo vazio e
      ela §eescaneia a construção§r. Dê um nome e pronto: sua casa virou papel.
    tasks:
      - get: "BuildCraft|Builders:architectBlock"
    rewards:
      - xp: 4
      - choice: ["BuildCraft|Builders:blueprintItem x2", "BuildCraft|Core:markerBlock x4", minecraft:diamond]

  - id: construtor
    title: "O Construtor"
    type: milestone
    deps: [mesa_arquitetura]
    icon: "BuildCraft|Builders:builderBlock"
    banner: "O Construtor"
    subtitle: "Do papel para o mundo"
    desc: |
      Corantes, Marcador, bancada, baú e Engrenagens de Diamante: o §eConstrutor§r. Coloque um
      Diagrama gravado e encha o inventário (ou um baú ao lado) com os blocos necessários — a
      interface mostra a lista. Com RF, os lasers dele erguem a construção bloco a bloco.

      Herói, você acabou de copiar uma página do mundo e colá-la em outro lugar. Os Antigos fariam
      fila para ver isso.

      §aDica:§r a §eBiblioteca de Diagramas§r guarda e troca diagramas com outros jogadores.
    tasks:
      - get: "BuildCraft|Builders:builderBlock"
    rewards:
      - xp: 8
      - kit: {name: "Kit do Arquiteto", items: ["BuildCraft|Builders:blueprintItem x4", "BuildCraft|Builders:templateItem x2", "BuildCraft|Core:markerBlock x8", minecraft:stonebrick x64, minecraft:glass x32]}
      - loot: raro

  - id: preenchedor
    title: "Preenchedor"
    type: normal
    deps: [marcador, engrenagem_ouro]
    icon: "BuildCraft|Builders:fillerBlock"
    desc: |
      Corantes, Marcador, bancada, baú e Engrenagens de Ouro. O §ePreenchedor§r enche (ou limpa) a
      área marcada seguindo um padrão escolhido na interface: preencher, limpar, caixa, pirâmide,
      escada... Terraplanagem nunca foi tão preguiçosa.
    tasks:
      - get: "BuildCraft|Builders:fillerBlock"
    rewards:
      - xp: 3
      - item: minecraft:cobblestone x64

  - id: biblioteca
    title: "Biblioteca de Diagramas"
    type: optional
    deps: [diagrama]
    icon: "BuildCraft|Builders:libraryBlock"
    desc: |
      Ferro, Engrenagem de Ferro, estantes, um Diagrama e redstone. A §eBiblioteca Eletrônica§r
      salva diagramas e modelos e permite copiá-los — inclusive trocar com amigos.
    tasks:
      - get: "BuildCraft|Builders:libraryBlock"
    rewards:
      - loot: comum

  - id: marcadores_extras
    title: "Marcadores de Caminho e de Construção"
    type: optional
    deps: [marcador]
    icon: "BuildCraft|Core:pathMarkerBlock"
    desc: |
      O §eMarcador de Caminhos§r (corante verde + tocha de redstone) traça rotas; o §eMarco de
      Construção§r (Engrenagem de Ouro + tocha de redstone) marca onde robôs construtores devem
      trabalhar. Faça qualquer um.
    tasks:
      - one_of: ["BuildCraft|Core:pathMarkerBlock", "BuildCraft|Builders:constructionMarkerBlock"]
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 10 — ROBÓTICA
  # ======================================================================
  - id: placa_redstone
    title: "Placa de Redstone"
    type: main
    deps: [mesa_programacao]
    icon: "BuildCraft|Robotics:redstone_board"
    desc: |
      8 papéis + redstone = §ePlaca de Redstone§r em branco. Leve à Mesa de Programação para
      gravar um programa. Os programas disponíveis aparecem na interface da mesa.
    tasks:
      - get: "BuildCraft|Robotics:redstone_board"
    rewards:
      - xp: 3
      - choice: [minecraft:paper x32, minecraft:redstone x32, minecraft:emerald]

  - id: placa_programada
    title: "Um Programa para o Robô"
    type: main
    deps: [placa_redstone]
    icon: "BuildCraft|Robotics:redstone_board"
    desc: |
      Programe uma placa útil: §eLenhador, Plantador, Colheitadeira, Fazendeiro, Minerador,
      Carregador, Entregador, Bomba...§r Cada programa define o "emprego" do robô.
    tasks:
      - one_of: ['BuildCraft|Robotics:redstone_board {id:"buildcraft:boardRobotLumberjack"}', 'BuildCraft|Robotics:redstone_board {id:"buildcraft:boardRobotPlanter"}', 'BuildCraft|Robotics:redstone_board {id:"buildcraft:boardRobotHarvester"}', 'BuildCraft|Robotics:redstone_board {id:"buildcraft:boardRobotFarmer"}', 'BuildCraft|Robotics:redstone_board {id:"buildcraft:miner"}', 'BuildCraft|Robotics:redstone_board {id:"buildcraft:boardRobotCarrier"}', 'BuildCraft|Robotics:redstone_board {id:"buildcraft:boardRobotDelivery"}', 'BuildCraft|Robotics:redstone_board {id:"buildcraft:boardRobotPump"}', 'BuildCraft|Robotics:redstone_board {id:"buildcraft:shovelman"}', 'BuildCraft|Robotics:redstone_board {id:"buildcraft:boardRobotButcher"}']
        nbt: true
    rewards:
      - xp: 3
      - choice: [minecraft:redstone x32, minecraft:iron_ingot x8, minecraft:paper x16]

  - id: robo
    title: "O Robô"
    type: main
    deps: [cristal_redstone, chipset_diamante]
    icon: "BuildCraft|Robotics:robot"
    desc: |
      Ferro, um §eCristal de Redstone§r e dois §eChipsets de Diamante§r: o §eRobô§r. Sozinho ele não
      faz nada — na Mesa de Integração, junte o robô com uma placa programada e ele ganha o
      emprego.
    tasks:
      - get: "BuildCraft|Robotics:robot"
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x12, "BuildCraft|Silicon:redstoneChipset:2 x2", minecraft:redstone_block x2]

  - id: estacao
    title: "Estação de Encaixe"
    type: main
    deps: [robo]
    icon: "BuildCraft|Robotics:robotStation"
    desc: |
      Ferro + Chipset de Ouro. A §eEstação de Encaixe§r vai no lado de um cano: é a "casa" do robô,
      onde ele recarrega (com RF vindo do cano) e troca itens e fluidos com o sistema. Com portas
      lógicas na estação você controla o que o robô faz.
    tasks:
      - get: "BuildCraft|Robotics:robotStation x2"
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x8, "BuildCraft|Silicon:redstoneChipset:2", minecraft:gold_ingot x4]

  - id: planejador_setores
    title: "Planejador de Setores"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:zonePlan"
    desc: |
      Ferro, redstone, mapa e engrenagens de ouro e diamante. O §ePlanejador de Setores§r desenha
      num mapa as áreas onde os robôs podem trabalhar (com o Mapa de Localização você marca
      pontos). Robôs organizados, base organizada.
    tasks:
      - get: "BuildCraft|Robotics:zonePlan"
    rewards:
      - loot: incomum

  - id: requisicoes
    title: "Requisições"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:requester"
    desc: |
      Ferro, pistão, engrenagens, baú e redstone. O bloco de §eRequisições§r pede itens que os
      robôs entregadores vão buscar na sua rede. Uma "lista de compras" automatizada.
    tasks:
      - get: "BuildCraft|Robotics:requester"
    rewards:
      - loot: comum

  - id: mapa_lista
    title: "Mapa de Localização e Lista"
    type: optional
    deps: [modelo]
    icon: "BuildCraft|Core:list"
    desc: |
      O §eMapa de Localização§r (8 papéis + corante amarelo) marca um ponto ou área para robôs e
      portas lógicas; a §eLista§r (feita na Mesa de Montagem) guarda um conjunto de itens usado
      como filtro. Faça qualquer um.
    tasks:
      - one_of: ["BuildCraft|Core:mapLocation", "BuildCraft|Core:list:*"]
    rewards:
      - loot: comum

  - id: frota_robos
    title: "A Frota de Robôs"
    type: milestone
    deps: [estacao, placa_programada]
    icon: "BuildCraft|Robotics:robot"
    banner: "Mãos de Metal"
    subtitle: "Os robôs acordaram"
    desc: |
      Um robô programado, uma Estação de Encaixe no cano e energia correndo. Herói... ele está
      §etrabalhando sozinho§r. Cortando árvores, colhendo, minerando, entregando. Eu confesso que
      fiquei um pouco emocionada.

      Mantenha as estações sempre com energia, ou os robôs param no meio do serviço. E dê nomes a
      eles — não é obrigatório, mas é mais fofo.
    tasks:
      - get: ["BuildCraft|Robotics:robot x2", "BuildCraft|Robotics:robotStation x2"]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Roboticista", items: ["BuildCraft|Silicon:redstoneChipset:3 x2", "BuildCraft|Silicon:redstoneChipset:2 x2", "BuildCraft|Robotics:redstone_board x4", minecraft:iron_ingot x16, minecraft:redstone_block x2]}
      - loot: raro

  # ======================================================================
  # INTEGRAÇÕES E FINAL
  # ======================================================================
  - id: robo_lenhador
    title: "Robô Lenhador"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:robot"
    desc: |
      Robô + placa programada na Mesa de Integração. Corta árvores perto da estação e traz a
      madeira para casa. Com um robô Plantador repondo as mudas, você tem uma floresta infinita.
    tasks:
      - {get: 'BuildCraft|Robotics:robot {board:{id:"buildcraft:boardRobotLumberjack"}}', nbt: true}
    rewards:
      - loot: comum

  - id: robo_plantador
    title: "Robô Plantador"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:robot"
    desc: |
      Robô + placa programada na Mesa de Integração. Planta mudas e sementes que encontra na
      estação. O parceiro natural do Lenhador e do Colheitador.
    tasks:
      - {get: 'BuildCraft|Robotics:robot {board:{id:"buildcraft:boardRobotPlanter"}}', nbt: true}
    rewards:
      - loot: comum

  - id: robo_colheitador
    title: "Robô Colheitador"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:robot"
    desc: |
      Robô + placa programada na Mesa de Integração. Colhe plantações maduras e devolve os
      produtos à estação. Trigo, cenoura, batata... sem levantar um dedo.
    tasks:
      - {get: 'BuildCraft|Robotics:robot {board:{id:"buildcraft:boardRobotHarvester"}}', nbt: true}
    rewards:
      - loot: comum

  - id: robo_fazendeiro
    title: "Robô Fazendeiro"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:robot"
    desc: |
      Robô + placa programada na Mesa de Integração. Ara a terra com enxada para preparar
      canteiros. Com Plantador e Colheitador, fecha o ciclo da fazenda.
    tasks:
      - {get: 'BuildCraft|Robotics:robot {board:{id:"buildcraft:boardRobotFarmer"}}', nbt: true}
    rewards:
      - loot: comum

  - id: robo_minerador
    title: "Robô Minerador"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:robot"
    desc: |
      Robô + placa programada na Mesa de Integração. Escava blocos dentro da área definida (Mapa
      de Localização ou Planejador de Setores). Dê a ele uma picareta e uma área bem marcada!
    tasks:
      - {get: 'BuildCraft|Robotics:robot {board:{id:"buildcraft:miner"}}', nbt: true}
    rewards:
      - loot: comum

  - id: robo_entregador
    title: "Robôs Carregador e Entregador"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:robot"
    desc: |
      Robô + placa programada na Mesa de Integração. O Carregador leva itens de uma estação para
      outra; o Entregador atende às Requisições. Logística voadora!
    tasks:
      - one_of: ['BuildCraft|Robotics:robot {board:{id:"buildcraft:boardRobotCarrier"}}', 'BuildCraft|Robotics:robot {board:{id:"buildcraft:boardRobotDelivery"}}']
        nbt: true
    rewards:
      - loot: comum

  - id: robo_bomba
    title: "Robô Bomba"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:robot"
    desc: |
      Robô + placa programada na Mesa de Integração. Suga fluidos de uma área e leva para a
      estação. Um balde voador muito educado.
    tasks:
      - {get: 'BuildCraft|Robotics:robot {board:{id:"buildcraft:boardRobotPump"}}', nbt: true}
    rewards:
      - loot: comum

  - id: robo_guerreiro
    title: "Robôs Cavaleiro e Açougueiro"
    type: optional
    deps: [estacao]
    icon: "BuildCraft|Robotics:robot"
    desc: |
      Robô + placa programada na Mesa de Integração. O Cavaleiro ataca monstros por perto; o
      Açougueiro abate animais. Segurança e churrasco, cada um com seu robô.
    tasks:
      - one_of: ['BuildCraft|Robotics:robot {board:{id:"buildcraft:boardRobotKnight"}}', 'BuildCraft|Robotics:robot {board:{id:"buildcraft:boardRobotButcher"}}']
        nbt: true
    rewards:
      - loot: comum

  - id: aula_gatilhos
    title: "Aula: Gatilhos e Ações"
    type: info
    deps: [porta_basica]
    icon: "BuildCraft|Transport:pipeGate"
    desc: |
      Uma porta lógica é um "se... então...". Na interface:
      §e• Gatilhos (esquerda):§r condições — sinal de redstone, fio colorido ligado, inventário ao
      lado cheio/vazio/com espaço, tanque cheio/vazio, motor quente, energia na estação...
      §e• Ações (direita):§r o que fazer — emitir redstone, ligar um fio colorido, trocar a saída do
      Cano de Ferro, ligar o motor, mandar o robô trabalhar...

      Exemplo clássico: porta no cano que sai do motor com "Inventário cheio → desligar" e o motor
      para quando o baú enche. Simples e econômico!
    tasks:
      - check
    rewards:
      - xp: 1

  - id: porta_quartzo
    title: "Porta Lógica de Quartzo"
    type: optional
    deps: [porta_ferro, chipsets_especiais]
    icon: "BuildCraft|Transport:pipeGate"
    desc: |
      Chipset de Quartzo + fios vermelho, azul e verde. Uma porta intermediária entre a de Ouro e
      a de Diamante — e o mesmo chipset vira a expansão de Temporizador.
    tasks:
      - {get: 'BuildCraft|Transport:pipeGate {mat:5b}', nbt: true}
    rewards:
      - loot: comum

  - id: cano_fluido_argila
    title: "Canos de Fluido de Argila e Arenito"
    type: optional
    deps: [canos_fluido]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipefluidsclay"
    desc: |
      O de §eArgila§r prioriza tanques e máquinas vizinhos; o de §eArenito§r só conversa com outros
      canos. Úteis para alimentar uma fileira de motores sem que o fluido "escape" para o lado
      errado. Faça qualquer um.
    tasks:
      - one_of: ["BuildCraft|Transport:item.buildcraftPipe.pipefluidsclay", "BuildCraft|Transport:item.buildcraftPipe.pipefluidssandstone"]
    rewards:
      - loot: comum

  - id: torre_tanques
    title: "Torre de Tanques"
    type: optional
    deps: [tanque_bc]
    icon: "BuildCraft|Factory:tankBlock"
    desc: |
      Empilhe tanques e eles viram uma coluna só: 8 tanques = 128 baldes. Reserve uma torre para
      combustível e outra para a água dos motores.
    tasks:
      - get: "BuildCraft|Factory:tankBlock x8"
    rewards:
      - loot: comum

  - id: banco_stirling
    title: "Banco de Motores Stirling"
    type: optional
    deps: [motor_stirling, cinetico_madeira]
    icon: "BuildCraft|Core:engineBlock:1"
    desc: |
      Um motor sozinho é tímido; quatro, lado a lado, ligados a Tubos Cinéticos de Madeira, já
      tocam uma Pedreira pequena. Alimente com carvão por um funil ou Cano de Madeira.
    tasks:
      - get: "BuildCraft|Core:engineBlock:1 x4"
    rewards:
      - loot: comum

  - id: canos_fluido_pedra
    title: "Separando Linhas de Fluido"
    type: optional
    deps: [canos_fluido]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipefluidsstone"
    desc: |
      Assim como os de itens, os canos de fluido de §ePedra§r e §eQuartzo§r não se conectam aos de
      pedregulho. Faça uma linha de pedra ao lado da de pedregulho: água de um lado, petróleo do
      outro, sem misturar.
    tasks:
      - one_of: ["BuildCraft|Transport:item.buildcraftPipe.pipefluidsstone x8", "BuildCraft|Transport:item.buildcraftPipe.pipefluidsquartz x8"]
    rewards:
      - loot: comum

  - id: cano_apicultor
    title: "Tubo do Apicultor"
    type: optional
    deps: [cano_diamante]
    icon: "BuildCraft|Compat:item.buildcraftPipe.pipeitemspropolis"
    desc: |
      O BuildCraft Compat faz uma ponte com o Forestry: Cano de Diamante + 2 Própolis = §eTubo do
      Apicultor§r, que separa abelhas por espécie, geração ou característica. Se você vai criar
      abelhas, ele é ouro (ou mel).
    tasks:
      - get: "BuildCraft|Compat:item.buildcraftPipe.pipeitemspropolis"
    rewards:
      - loot: incomum

  - id: mestre_engrenagens
    title: "Maestria das Engrenagens"
    type: milestone
    deps: [pedreira, usina_combustao, construtor, frota_robos, porta_ouro]
    icon: "BuildCraft|Core:diamondGearItem"
    banner: "Mestre das Engrenagens"
