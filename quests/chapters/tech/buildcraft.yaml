    icon: "BuildCraft|Factory:miningWellBlock"
    desc: |
      Ferro, redstone, Engrenagem de Ferro e uma picareta de ferro. O §eMinerador de Poços§r cava
      §euma coluna reta§r até a camada mais funda, colocando Tubos de Mineração atrás de si e
