    tasks:
      - get: "BuildCraft|Silicon:laserTableBlock:2"
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x4

  - id: mesa_carga
    title: "Mesa de Carga"
    type: optional
    deps: [chipset_redstone, engrenagem_ouro]
    icon: "BuildCraft|Silicon:laserTableBlock:3"
