    title: "Tubos Cinéticos de Transporte"
    type: main
    deps: [cinetico_madeira]
    icon: "BuildCraft|Transport:item.buildcraftPipe.pipepowercobblestone"
    desc: |
      Pedregulho, Pedra, Quartzo, Ouro e Diamante: cada material aguenta mais RF/t. O de
      pedregulho basta para os primeiros motores; o de Ouro e o de Diamante carregam muito mais.

      Faça §e8 Tubos Cinéticos de Pedregulho§r (ou de Pedra).
    tasks:
