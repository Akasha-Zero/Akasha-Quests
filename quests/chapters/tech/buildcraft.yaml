    rewards:
      - xp: 8
      - kit: {name: "Kit do Petroleiro", items: ["BuildCraft|Transport:item.buildcraftPipe.pipefluidsgold x8", "BuildCraft|Factory:tankBlock x4", minecraft:water_bucket x2, "BuildCraft|Core:ironGearItem x4", minecraft:bucket x4]}
      - loot: raro

