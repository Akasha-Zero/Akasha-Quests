    type: optional
    deps: [cano_estrutura, cinetico_pedregulho]
    icon: "BuildCraft|Transport:pipePowerAdapter"
    desc: |
      Canos de Estrutura + ouro + engrenagem: §e4 Adaptadores de Energia§r. Encaixe no lado de um
