    icon: IC2:itemToolIridiumDrill:1
    desc: |
      Broca de Diamante + 3 Placas de Irídio + Cristal de Energia = §eBroca de Irídio§r: 300 000
      EU, Fortuna III de fábrica e um modo §eToque Suave§r. A última picareta que você vai
      precisar no IC2.
    tasks:
      - get: IC2:itemToolIridiumDrill:*
    rewards:
      - loot: incomum

  - id: quantum_capacete
    title: "Capacete QuantumSuit"
    type: main
    deps: [nano_capacete, placa_iridio, cristal_lapotron, traje_hazmat, vidro_reforcado]
    icon: IC2:itemArmorQuantumHelmet:1
    desc: |
      Capacete Nano + Capacete de Respiração (Hazmat) + 2 Placas de Irídio + Lapotron + 2
      Vidros Reforçados + 2 Circuitos Avançados = §6Capacete QuantumSuit§r.

      Ele dá respiração debaixo d'água, visão noturna, cura venenos, wither e radiação e
      ainda te §ealimenta com Latas de Estanho Cheias§r do inventário. (Vale a pena montar a
      Máquina de Conservas Sólidas!)
    tasks:
      - get: IC2:itemArmorQuantumHelmet:*
    rewards:
      - xp: 6
      - choice: [IC2:itemTinCan x32, IC2:itemPartIridium, minecraft:golden_apple x2]

  - id: quantum_peitoral
    title: "Armadura QuantumSuit"
    type: main
    deps: [nano_peitoral, jetpack_eletrico, placa_iridio, cristal_lapotron]
    icon: IC2:itemArmorQuantumChestplate:1
    desc: |
      Armadura Nano + §eJetpack Elétrico§r + 4 Placas de Irídio + Lapotron + 2 Ligas Avançadas
      = §6Armadura QuantumSuit§r.

      Ela absorve quase qualquer dano com energia e traz o jetpack embutido: você §dvoa§r (com
      modo de pairar). 10 000 000 EU por peça — carregue numa MFSU!
    tasks:
      - get: IC2:itemArmorQuantumChestplate:*
    rewards:
      - xp: 6
      - choice: [IC2:itemBatLamaCrystal:26, IC2:itemPartIridium, minecraft:diamond_block]

  - id: quantum_calcas
    title: "Calças QuantumSuit"
    type: main
    deps: [nano_calcas, placa_iridio, cristal_lapotron]
    icon: IC2:itemArmorQuantumLegs:1
    desc: |
      Calças Nano + Placas de Irídio + Lapotron + 2 Carcaças de Máquina + 2 glowstone = §6Calças
      QuantumSuit§r. Corra e sinta o vento: elas dão uma §evelocidade absurda§r — neste pack o
      impulso ativa §esó de correr§r (sprint), sem segurar tecla extra.
    tasks:
      - get: IC2:itemArmorQuantumLegs:*
    rewards:
      - xp: 6
      - choice: [IC2:itemBatLamaCrystal:26, IC2:itemPartIridium, minecraft:diamond_block]

  - id: quantum_botas
    title: "Botas QuantumSuit"
    type: main
    deps: [nano_botas, botas_borracha, placa_iridio, cristal_lapotron]
    icon: IC2:itemArmorQuantumBoots:1
    desc: |
      Botas Nano + §e2 Botas de Borracha§r + 2 Placas de Irídio + Lapotron = §6Botas
      QuantumSuit§r.
      Pulos altíssimos e nenhum dano de queda (enquanto houver energia). Lembra daquelas botas
      de borracha do começo? Eu disse que não era pra jogar fora!
    tasks:
      - get: IC2:itemArmorQuantumBoots:*
    rewards:
      - xp: 6
      - choice: [IC2:itemBatLamaCrystal:26, IC2:itemPartIridium, minecraft:diamond_block]

  - id: quantum_completo
    title: "QuantumSuit Completa"
    type: milestone
    deps: [quantum_capacete, quantum_peitoral, quantum_calcas, quantum_botas]
    icon: IC2:itemArmorQuantumChestplate:1
    banner: "QuantumSuit"
    subtitle: "A armadura mais poderosa do IC2"
    effect: 3
    desc: |
      ...Herói. Deixa eu só olhar um pouquinho. Pronto. Agora posso falar.

      A §6QuantumSuit§r completa é o ápice da armadura do IC2:
      §e• Capacete:§r respira debaixo d'água, visão noturna, cura venenos e radiação, te
      alimenta com Latas de Estanho.
      §e• Armadura:§r voo com jetpack embutido e absorção massiva de dano.
      §e• Calças:§r velocidade extrema ao correr.
      §e• Botas:§r superpulos e zero dano de queda.

      Cada peça guarda 10 milhões de EU. §aMantenha uma MFSU com Bloco de Carregar§r em casa e
      uma Bateria de Carregar de Lapotron no inventário em expedições longas.

      Os Antigos tentaram vestir algo assim antes da Fratura. Você conseguiu — e com as
      próprias mãos.
    tasks:
      - get: [IC2:itemArmorQuantumHelmet:*, IC2:itemArmorQuantumChestplate:*, IC2:itemArmorQuantumLegs:*, IC2:itemArmorQuantumBoots:*]
    rewards:
      - xp: 12
      - kit: {name: "Kit do Viajante Quântico", items: [IC2:itemBatLamaCrystal:26, IC2:itemTinCan x64, minecraft:golden_apple:1, minecraft:diamond_block x2]}
      - loot: epico

  # ======================================================================
  # FASE 10 — NUCLEAR
  # ======================================================================
  - id: info_radiacao
    title: "Antes de Tocar no Urânio"
    type: info
    deps: [centrifuga_termica]
    icon: IC2:itemArmorHazmatHelmet
    desc: |
      §cHerói, preciso que você me escute com atenção agora.§r

      §e1. Radiação.§r U-238, U-235, Combustível Enriquecido, MOX, Plutônio, Pelotas RTG e
      barras esgotadas são §cradioativos§r: só de estarem no seu inventário causam radiação.
      Use o §eTraje Hazmat completo§r e guarde-os na §eCaixa de Contenção§r.

      §e2. Calor.§r Um reator acima de 40% de calor incendeia em volta; acima de 50% evapora
      água; acima de 70% fere quem está perto; acima de 85% derrete blocos; a 100%
      §cEXPLODE§r. Neste pack a potência da explosão é limitada (45, TNT = 4) — ainda assim
      destrói a sua sala inteira.

      §e3. Planeje.§r Monte o layout num simulador de reator do IC2 1.7.10 antes de colocar
      a primeira barra. Teste com pouca barra, observando o calor.

      Prometo que, seguindo isso, a parte nuclear é a mais divertida do capítulo.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: minerio_uranio
    title: "Minério de Urânio"
    type: main
    deps: [info_radiacao]
    icon: IC2:blockOreUran
    desc: |
      O §eMinério de Urânio§r aparece em veios pequenos (até 3 blocos) entre Y 0 e 63. O
      Scanner OD é seu melhor amigo aqui.

      Triture cada minério (2 Urânios Triturados), lave e centrifugue. O minério em si é seguro;
      o perigo começa nos produtos. Junte §e8 minérios§r.
    tasks:
      - get: ore:oreUranium x8
    rewards:
      - xp: 6
      - choice: [IC2:itemCellEmpty:5 x6, minecraft:water_bucket x2, ore:ingotLead x8]

  - id: uranio_238
    title: "Urânio 238 e 235"
    type: main
    deps: [minerio_uranio]
    icon: IC2:itemUran238
    desc: |
      No Centrifugador Térmico (calor 3000):
      §e• Urânio Triturado§r → 1 Pequeno Monte de U-235 + 4 U-238 + Pó de Pedra
      §e• Urânio Purificado§r → 2 Pequenos Montes de U-235 + 5 U-238

      Ou seja: §elave antes de centrifugar§r. Junte §e12 U-238§r e §e6 Pequenos Montes de
      U-235§r (9 montes = 1 U-235 inteiro).
    tasks:
      - get: [IC2:itemUran238 x12, IC2:itemUran235small x6]
    rewards:
      - xp: 6
      - choice: [IC2:itemCasing:6 x8, IC2:itemCellEmpty:5 x8, minecraft:water_bucket x2]

  - id: caixa_contencao
    title: "Caixa de Contenção"
    type: normal
    deps: [chumbo, martelo_forja]
    icon: IC2:itemContainmentbox
    desc: |
      Radiação no bolso, nunca mais.

      Um baú dentro de 8 Invólucros de Chumbo = §eCaixa de Contenção§r. Itens radioativos lá
      dentro não te afetam. Leve sempre uma ao mexer no reator.
    tasks:
      - get: IC2:itemContainmentbox
    rewards:
      - xp: 4
      - item: ore:ingotLead x6

  - id: combustivel_enriquecido
    title: "Combustível de Urânio Enriquecido"
    type: main
    deps: [uranio_238]
    icon: IC2:itemUran
    desc: |
      6 U-238 nas bordas e 3 Pequenos Montes de U-235 no meio = §eCombustível Nuclear de Urânio
      Enriquecido§r. §aDica do pack:§r receitas de urânio aceitam `ingotUranium` no lugar do
      U-238 — incluindo o Yellorium do Big Reactors!

      Faça §e2§r. Ele ainda precisa ir para dentro de uma barra.
    tasks:
      - get: IC2:itemUran x2
    rewards:
      - xp: 6
      - choice: [IC2:itemPlates:4 x6, ore:ingotLead x8, IC2:itemCellEmpty:5 x8]

  - id: barra_vazia
    title: "Barra de Combustível Vazia"
    type: normal
    deps: [formador_metal]
    icon: IC2:itemFuelRod
    desc: |
      Antes do fogo atômico, a garrafa que vai guardá-lo.

      Extruda uma Placa de Ferro no Formador de Metal para obter uma §eBarra de Combustível
      Vazia§r. Faça §e4§r.

      Uma barra vazia vira barra de urânio ou de MOX na Máquina de Conservas.
    tasks:
      - get: IC2:itemFuelRod x4
    rewards:
      - xp: 4
      - item: IC2:itemPlates:4 x4

  - id: barra_uranio
    title: "Barra de Combustível de Urânio"
    type: main
    deps: [combustivel_enriquecido, barra_vazia, maquina_conservas]
    icon: IC2:reactorUraniumSimple:1
    desc: |
      Na §eMáquina de Conservas§r (modo enlatar), coloque a Barra Vazia e o Combustível
      Enriquecido: sai uma §eBarra de Combustível (Urânio)§r.

      Cada barra gera energia e calor, e "conversa" com barras vizinhas por pulsos de
      nêutrons — quanto mais barras juntas, mais energia e MUITO mais calor. Faça §e2§r.
    tasks:
      - get: IC2:reactorUraniumSimple:* x2
    rewards:
      - xp: 6
      - choice: [IC2:reactorCoolantSimple:1 x2, IC2:itemPlates:4 x8, IC2:itemPlates:1 x8]

  - id: barra_dupla
    title: "Barra Dupla de Urânio"
    type: normal
    deps: [barra_uranio]
    icon: IC2:reactorUraniumDual:1
    desc: |
      2 Barras de Urânio + 1 Placa de Ferro = §eBarra Dupla§r. Ocupa um slot só e pulsa como duas
      barras grudadas — mais energia e mais calor por slot.
    tasks:
      - get: IC2:reactorUraniumDual:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates:4 x4

  - id: barra_quadrupla
    title: "Barra Quádrupla de Urânio"
    type: normal
    deps: [barra_dupla]
    icon: IC2:reactorUraniumQuad:1
    desc: |
      4 Barras de Urânio + 3 Placas de Ferro + 2 de Cobre = §eBarra Quádrupla§r. O máximo de
      combustível num slot. §cGera calor de verdade§r: só use em layouts testados.
    tasks:
      - get: IC2:reactorUraniumQuad:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates x4

  - id: placa_chumbo_densa
    title: "Placa de Chumbo Densa"
    type: normal
    deps: [chumbo, compressor, martelo_forja]
    icon: IC2:itemDensePlates:6
    desc: |
      Chumbo é a muralha entre você e a radiação — e quanto mais denso, melhor.

      9 Placas de Chumbo no Compressor = §ePlaca de Chumbo Densa§r ("Chumbro" no jogo —
      perdoe a tradução). O Reator Nuclear pede §e4§r.
    tasks:
      - get: ore:plateDenseLead x4
    rewards:
      - xp: 4
      - item: ore:ingotLead x8

  - id: camara_reator
    title: "Câmara do Reator"
    type: normal
    deps: [chumbo, carcaca_maquina, martelo_forja]
    icon: IC2:blockReactorChamber
    desc: |
      Uma Carcaça cercada por 4 Placas de Chumbo = §eCâmara do Reator§r. O reator precisa de 3
      na receita; colocadas encostadas nele (até 6), cada câmara §eamplia a grade interna§r
      em uma coluna (de 3 até 9 colunas de 6 slots).
    tasks:
      - get: IC2:blockReactorChamber x3
    rewards:
      - xp: 4
      - item: ore:ingotLead x8

  - id: reator
    title: "Reator Nuclear"
    type: main
    deps: [camara_reator, placa_chumbo_densa, circuito_avancado, gerador]
    icon: IC2:blockGenerator:5
    desc: |
      4 Placas de Chumbo Densas, Circuito Avançado, 3 Câmaras do Reator e 1 Gerador = §eReator
      Nuclear§r.

      Ele §esó funciona com sinal de redstone§r — use uma alavanca como "chave de segurança".
      Sem câmaras, a grade tem 3×6 slots. No modo comum (EU) a saída vai direto para cabos; a
      janela mostra a produção e a temperatura do núcleo.

      §cNão ligue sem resfriamento!§r Próximas quests: os componentes.
    tasks:
      - get: IC2:blockGenerator:5
    rewards:
      - xp: 6
      - choice: [IC2:reactorCoolantSimple:1 x4, IC2:itemRecipePart:1 x2, ore:ingotLead x16]

  - id: info_componentes
    title: "Como Pensa um Reator"
    type: info
    deps: [reator]
    icon: IC2:reactorVent:1
    desc: |
      Cada componente da grade tem um papel:
      §e• Barras§r geram EU e calor; barras vizinhas trocam pulsos (mais EU, mais calor).
      §e• Células Refrigerantes§r guardam calor (10k/30k/60k) até encher.
      §e• Respiradouros§r jogam calor fora (alguns puxam do casco, outros dos vizinhos).
      §e• Trocadores§r equilibram calor entre componentes e o casco.
      §e• Refletores§r devolvem pulsos às barras (mais EU, sem calor extra próprio).
      §e• Condensadores§r absorvem muito calor e são recarregados com redstone/lápis.
      §e• Placas§r aumentam o calor máximo do casco ou reduzem a explosão.

      O calor que ninguém tira vai para o §ecasco§r. Casco a 100% = adeus. §aRegra:§r um
      layout estável é aquele em que o calor do casco fica parado em 0.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: celula_refrigerante_30k
    title: "30k Célula Refrigerante"
    type: normal
    deps: [celula_refrigerante_10k, info_componentes]
    icon: IC2:reactorCoolantTriple:1
    desc: |
      Mais calor guardado por slot significa mais espaço para barras.

      3 Células 10k + 6 Placas de Estanho = §e30k Célula Refrigerante§r. Guarda o triplo de
      calor no mesmo slot.

      §cAtenção:§r se o calor acumulado chegar ao limite, a célula se desfaz — combine com
      respiradouros que a resfriem.
    tasks:
      - get: IC2:reactorCoolantTriple:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates:1 x6

  - id: celula_refrigerante_60k
    title: "60k Célula Refrigerante"
    type: normal
    deps: [celula_refrigerante_30k]
    icon: IC2:reactorCoolantSix:1
    desc: |
      A maior célula refrigerante do IC2.

      2 Células 30k + 6 Placas de Estanho + 1 Placa de Ferro = §e60k Célula Refrigerante§r.
      Lembre: células só §eguardam§r calor; quando enchem, quebram. Combine com respiradouros.
    tasks:
      - get: IC2:reactorCoolantSix:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates:1 x6

  - id: respiradouro
    title: "Respiradouro de Calor"
    type: normal
    deps: [info_componentes, motor_eletrico]
    icon: IC2:reactorVent:1
    desc: |
      4 barras de ferro, 4 Placas de Ferro e 1 Motor Elétrico = §eRespiradouro de Calor§r. Ele
      dissipa o calor que §eele mesmo§r recebe. É a base de todos os outros respiradouros.
      Faça §e4§r.
    tasks:
      - get: IC2:reactorVent:* x4
    rewards:
      - xp: 4
      - item: IC2:itemRecipePart:1 x2

  - id: respiradouro_reator
    title: "Respiradouro de Calor de Reator"
    type: normal
    deps: [respiradouro]
    icon: IC2:reactorVentCore:1
    desc: |
      O casco do reator também precisa respirar.

      Respiradouro + 8 Placas de Cobre = §eRespiradouro de Reator§r. Ele §epuxa calor do casco§r
      e dissipa. Ótimo para manter o casco em zero.
    tasks:
      - get: IC2:reactorVentCore:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates x8

  - id: respiradouro_overclock
    title: "Respiradouro com Overclocker"
    type: normal
    deps: [respiradouro_reator]
    icon: IC2:reactorVentGold:1
    desc: |
      Respiradouro de Reator + 4 Placas de Ouro = §eRespiradouro com Overclocker§r. Puxa ainda
      mais calor do casco — às vezes mais do que consegue dissipar sozinho. Cerque-o de
      Respiradouros Componentes.
    tasks:
      - get: IC2:reactorVentGold:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates:3 x4

  - id: respiradouro_componente
    title: "Respiradouro Componente"
    type: normal
    deps: [respiradouro]
    icon: IC2:reactorVentSpread
    desc: |
      Às vezes quem esquenta não é o casco, são os vizinhos.

      Respiradouro + 4 barras de ferro + 4 Placas de Estanho = §eRespiradouro Componente§r. Ele
      §eresfria os componentes vizinhos§r (os 4 lados), sem tocar no casco.
    tasks:
      - get: IC2:reactorVentSpread:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates:1 x6

  - id: respiradouro_avancado
    title: "Respiradouro Avançado"
    type: normal
    deps: [respiradouro]
    icon: IC2:reactorVentDiamond:1
    desc: |
      Um diamante bem investido — esse respiradouro aguenta o tranco.

      2 Respiradouros + 6 barras de ferro + 1 diamante = §eRespiradouro Avançado§r. Dissipa
      bem mais calor próprio que o comum. O preferido de muitos layouts estáveis.
    tasks:
      - get: IC2:reactorVentDiamond:*
    rewards:
      - xp: 4
      - item: minecraft:diamond

  - id: trocador_reator
    title: "Trocador de Calor de Reator"
    type: normal
    deps: [trocador_calor, info_componentes]
    icon: IC2:reactorHeatSwitchCore:1
    desc: |
      Calor parado no casco é calor perigoso.

      Trocador de Calor + 8 Placas de Cobre = §eTrocador de Calor de Reator§r. Troca calor
      principalmente com o §ecasco§r — o par perfeito dos Respiradouros de Reator.
    tasks:
      - get: IC2:reactorHeatSwitchCore:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates x8

  - id: trocador_componente
    title: "Trocador de Calor Componente"
    type: normal
    deps: [trocador_calor, info_componentes]
    icon: IC2:reactorHeatSwitchSpread:1
    desc: |
      Trocador de Calor + 4 Placas de Ouro = §eTrocador de Calor Componente§r. Equilibra o calor
      só entre os §ecomponentes vizinhos§r. Também é peça da Bateria de Carregar de Cristal.
    tasks:
      - get: IC2:reactorHeatSwitchSpread:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates:3 x4

  - id: refletor
    title: "Refletor de Nêutrons"
    type: normal
    deps: [info_componentes]
    icon: IC2:reactorReflector:1
    desc: |
      4 Pós de Estanho, 4 Pós de Carvão e 1 Placa de Cobre = §eRefletor de Nêutrons§r. Ao lado
      de uma barra, devolve os pulsos dela: §emais EU sem gastar combustível extra§r. Desgasta
      com o tempo.
    tasks:
      - get: IC2:reactorReflector:* x2
    rewards:
      - xp: 4
      - item: IC2:itemDust:2 x8

  - id: refletor_grosso
    title: "Refletor de Nêutrons Grosso"
    type: normal
    deps: [refletor]
    icon: IC2:reactorReflectorThick:1
    desc: |
      Mais duradouro, mais confiável.

      4 Refletores + 5 Placas de Cobre = §eRefletor Grosso§r: dura muito mais. (Ele também é
      peça de uma certa... Nuke. Mas vamos fingir que eu não disse isso.)
    tasks:
      - get: IC2:reactorReflectorThick:*
    rewards:
      - xp: 4
      - item: IC2:itemPlates x5

  - id: condensador_rsh
    title: "Condensador RSH"
    type: normal
    deps: [respiradouro, trocador_calor]
    icon: IC2:reactorCondensator:1
    desc: |
      7 redstone + Respiradouro + Trocador de Calor = §eCondensador RSH§r. Ele absorve calor
      até encher e então §erecarrega com redstone§r (combine com um bloco de redstone na
      bancada). Ótimo para reatores que funcionam em ciclos.
    tasks:
      - get: IC2:reactorCondensator:*
    rewards:
      - xp: 4
      - item: minecraft:redstone_block x2

  - id: condensador_lzh
    title: "Condensador LZH"
    type: normal
    deps: [condensador_rsh, respiradouro_reator, trocador_reator]
    icon: IC2:reactorCondensatorLap:1
    desc: |
      O primo rico do RSH.

      2 Condensadores RSH, Respiradouro de Reator, Trocador de Reator, redstone e um bloco de
      lápis = §eCondensador LZH§r. Absorve muito mais calor e §erecarrega com blocos de
      lápis-lazúli§r.
    tasks:
      - get: IC2:reactorCondensatorLap:*
    rewards:
      - xp: 4
      - item: minecraft:lapis_block x2

  - id: placas_reator
    title: "Placas do Reator"
    type: normal
    deps: [info_componentes, liga_avancada]
    icon: IC2:reactorPlating
    desc: |
      Placa de Chumbo + Liga Avançada = §ePlaca de Reator§r (+ calor máximo do casco). Com 8
      Placas de Cobre vira §ePlaca de Capacidade de Calor§r (ainda mais calor máximo); com 2
      Ligas a mais vira §ePlaca de Contenção§r (reduz a explosão).

      Faça uma de cada.
    tasks:
      - get: [IC2:reactorPlating, IC2:reactorPlatingHeat, IC2:reactorPlatingExplosive]
    rewards:
      - xp: 4
      - item: IC2:itemPartAlloy x4

  - id: reator_nuclear
    title: "Fogo Atômico"
    type: milestone
    deps: [reator, barra_uranio, respiradouro_avancado, respiradouro_reator, trocador_reator]
    icon: IC2:blockGenerator:5
    banner: "Fogo Atômico"
    subtitle: "O primeiro reator nuclear"
    desc: |
      O reator está montado, as barras dentro, os respiradouros girando. Herói... respira
      fundo. Agora puxe a alavanca.

      ...

      Está zumbindo! Olha esse EU/t!

      §aChecklist do operador responsável:§r
      §e• Calor do casco parado em 0§r depois de alguns minutos? Ótimo.
      §e• Subindo?§r Desligue a redstone, retire uma barra e reforce os respiradouros.
      §e• Sala§r de Pedra Reforçada e Vidro Reforçado, longe da base.
      §e• Traje Hazmat§r e Caixa de Contenção para trocar barras esgotadas.

      As barras esgotadas não são lixo: no Centrifugador Térmico viram U-238 e §ePlutônio§r —
      o caminho para o combustível MOX e os geradores RTG. Eu tô tremendo de orgulho!
    tasks:
      - get: [IC2:blockGenerator:5, IC2:reactorUraniumSimple:*, IC2:reactorVentDiamond:*]
    rewards:
      - xp: 12
      - kit: {name: "Kit do Operador Nuclear", items: [IC2:reactorVentDiamond:1 x2, IC2:reactorHeatSwitchCore:1 x2, IC2:itemPlates:1 x16, IC2:blockAlloyGlass x8, IC2:itemContainmentbox]}
      - loot: epico

  - id: plutonio
    title: "Barra Esgotada e Plutônio"
    type: normal
    deps: [reator_nuclear]
    icon: IC2:itemPlutonium
    desc: |
      Barras esgotadas no Centrifugador Térmico (calor 4000+) devolvem U-238, pó de ferro e
      §ePequenos Montes de Plutônio§r (9 = 1 Plutônio). As de MOX esgotadas rendem bem mais
      plutônio.

      Junte §e3 Plutônios§r — com cuidado, ele é bem radioativo.
    tasks:
      - get: IC2:itemPlutonium x3
    rewards:
      - xp: 4
      - item: IC2:itemUran238 x6

  - id: mox
    title: "Combustível MOX"
    type: normal
    deps: [plutonio]
    icon: IC2:itemMOX
    desc: |
      6 U-238 + 3 Plutônios = §eCombustível Nuclear MOX§r. Enlatado numa Barra Vazia (Máquina de
      Conservas) vira §eBarra de MOX§r. No reator EU, a MOX rende §emais quanto mais quente o
      casco§r — poderosa, mas exige mão firme no controle do calor.
    tasks:
      - get: IC2:reactorMOXSimple:*
    rewards:
      - xp: 4
      - item: IC2:itemFuelRod x2

  - id: mox_dupla
    title: "Barra Dupla de MOX"
    type: optional
    deps: [mox]
    icon: IC2:reactorMOXDual:1
    desc: |
      Duas barras de MOX, um slot só.

      Como a de urânio: 2 Barras de MOX + 1 Placa de Ferro = §eBarra Dupla de MOX§r.

      Lembre que barras agrupadas esquentam mais: ajuste o resfriamento antes de trocar.
    tasks:
      - get: IC2:reactorMOXDual:*
    rewards:
      - loot: incomum

  - id: mox_quadrupla
    title: "Barra Quádrupla de MOX"
    type: optional
    deps: [mox_dupla]
    icon: IC2:reactorMOXQuad:1
    desc: |
      4 Barras de MOX + 3 Placas de Ferro + 2 de Cobre = §eBarra Quádrupla de MOX§r. Só para
      quem já domina o reator. Eu vou ficar olhando daqui... de bem longe.
    tasks:
      - get: IC2:reactorMOXQuad:*
    rewards:
      - loot: incomum

  - id: pelotas_rtg
    title: "Pelotas de Combustível RTG"
    type: normal
    deps: [plutonio]
    icon: IC2:itemRTGPellet
    desc: |
      Plutônio que não explode? Existe, e é lindo.

      6 Placas de Ferro Densas + 3 Plutônios = §ePelotas de Combustível RTG§r. Elas
      alimentam geradores de radioisótopos — energia lenta, silenciosa e praticamente eterna.
    tasks:
      - get: IC2:itemRTGPellet
    rewards:
      - xp: 4
      - item: IC2:itemDensePlates:4 x3

  - id: gerador_rtg
    title: "Gerador Termoelétrico Radioisótopo"
    type: normal
    deps: [pelotas_rtg, camara_reator]
    icon: IC2:blockGenerator:6
    desc: |
      7 Invólucros de Ferro, 1 Câmara do Reator e 1 Gerador = §eRTG§r. Coloque Pelotas RTG: cada
      pelota a mais §edobra§r a produção. Sem calor, sem explosão, sem manutenção — só EU
      pingando para sempre.
    tasks:
      - get: IC2:blockGenerator:6
    rewards:
      - xp: 4
      - item: IC2:itemCasing:4 x6

  - id: calor_radioisotopo
    title: "Gerador de Calor por Radioisótopos"
    type: optional
    deps: [pelotas_rtg, camara_reator, condutor_calor]
    icon: IC2:blockHeatGenerator:2
    desc: |
      Calor eterno, sem uma gota de combustível.

      A versão "calor" do RTG: Invólucros de Ferro, Câmara do Reator e Condutor de Calor. Com
      Pelotas RTG, ele aquece Stirlings, Alto-Fornos e Geradores de Vapor eternamente.
    tasks:
      - get: IC2:blockHeatGenerator:2
    rewards:
      - loot: incomum

  - id: vaso_pressao
    title: "Cuba do Reator"
    type: normal
    deps: [reator_nuclear]
    icon: IC2:blockreactorvessel
    desc: |
      Reatores de §efluido§r são o modo "profissional" da Experimental. A casca é feita de
      §eCubas do Reator§r (Reactor Pressure Vessel): 5 Placas de Chumbo + 4 pedras = 4 cubas.

      Você vai precisar de um cubo §e5×5×5§r oco — são 98 blocos de casca (alguns serão portas).
      Comece juntando §e64§r.
    tasks:
      - get: IC2:blockreactorvessel x64
    rewards:
      - xp: 4
      - item: ore:ingotLead x16

  - id: portas_reator
    title: "Portas do Reator de Fluido"
    type: normal
    deps: [vaso_pressao, celula_universal]
    icon: IC2:blockReactorFluidPort
    desc: |
      Três blocos especiais substituem cubas da casca (cada um = 8 cubas + 1 item):
      §e• Porta de Fluidos§r (+ Célula Universal) — entra refrigerante frio, sai refrigerante
      quente.
      §e• Escotilha de Acesso§r (+ alçapão) — abre a janela do reator por fora.
      §e• Porta de Redstone§r (+ redstone) — leva o sinal de liga/desliga ao núcleo.

      Faça §e2 Portas de Fluidos§r, 1 Escotilha e 1 Porta de Redstone.
    tasks:
      - get: [IC2:blockReactorFluidPort x2, IC2:blockReactorAccessHatch, IC2:blockReactorRedstonePort]
    rewards:
      - xp: 4
      - item: IC2:itemFluidCell x4

  - id: trocador_liquido
    title: "Trocador de Calor Líquido"
    type: normal
    deps: [condutor_calor, celula_vazia, reator_nuclear]
    icon: IC2:blockMachine2:12
    desc: |
      4 vidros, 2 Células Vazias, 2 Invólucros de Ferro e um Condutor de Calor = §eTrocador de
      Calor Líquido§r. Ele recebe §eFluido Refrigerante Quente§r, devolve refrigerante frio e
      emite §6calor (hU)§r. Coloque §eCondutores de Calor§r nos slots para acelerar.

      Também converte lava em calor (sobra Magma Semi-Sólido)!
    tasks:
      - get: IC2:blockMachine2:12
    rewards:
      - xp: 4
      - item: IC2:itemRecipePart:5 x4

  - id: reator_fluido
    title: "O Reator de Fluido"
    type: milestone
    deps: [portas_reator, trocador_liquido, gerador_vapor, cinetico_vapor]
    icon: IC2:blockReactorFluidPort
    banner: "Reator de Fluido"
    subtitle: "Calor, vapor e movimento"
    desc: |
      Este é o desafio mais técnico do capítulo. Respira, eu explico.

      §e1. Estrutura:§r o Reator Nuclear fica no centro de um cubo §e5×5×5§r. A casca externa é
      toda de Cubas do Reator (Portas de Fluidos, Escotilha e Porta de Redstone podem substituir
      cubas). O interior 3×3×3 só pode ter o núcleo, Câmaras, ar ou refrigerante.
      §e2. Modo fluido:§r com a casca completa, o reator para de gerar EU e passa a aquecer
      §eFluido Refrigerante§r (entra frio, sai quente). A janela avisa: em modo EU a saída é
      reduzida a 50%; em modo fluido você aproveita 100%.
      §e3. Calor → EU:§r refrigerante quente → §eTrocador de Calor Líquido§r (hU) → §eGerador de
      Vapor§r (com Água Destilada) → §eGerador de Vapor Cinético§r (kU) → §eGerador Cinético§r
      (EU). Ou hU → Gerador Stirling.

      §cOs mesmos riscos de calor valem aqui.§r Se o refrigerante parar de circular, o núcleo
      esquenta. Planeje bombas e tanques de sobra. Mostre-me o reator e a primeira porta de
      fluidos instalada — e muito orgulho!
    tasks:
      - get: [IC2:blockGenerator:5, IC2:blockReactorFluidPort, IC2:blockMachine2:12]
    rewards:
      - xp: 12
      - kit: {name: "Kit do Engenheiro Térmico", items: [IC2:itemRecipePart:5 x8, IC2:itemSteamTurbine:1, IC2:upgradeModule:4 x2, IC2:itemFluidCell x8]}
      - loot: epico

  # ======================================================================
  # FASE 11 — MATÉRIA UU
  # ======================================================================
  - id: fabricador_massa
    title: "Fabricador de Massa"
    type: main
    deps: [carcaca_avancada, cristal_lapotron, circuito_avancado]
    icon: IC2:blockMachine:14
    desc: |
      Energia vira matéria. Literalmente. O §eFabricador de Massa§r (4 glowstone, 2 Circuitos
      Avançados, 2 Carcaças Avançadas e 1 Lapotron) produz §dMatéria UU§r.

      O preço é brutal: §c1 000 000 EU para cada 1 mB§r de UU (entrada HV). Coloque §eSucata§r
      (ou Caixas de Sucata) no slot amplificador: enquanto houver sucata, cada EU que entra vale
      até 6. Ou seja: o Reciclador acabou de virar a máquina mais importante da sua base.
    tasks:
      - get: IC2:blockMachine:14
    rewards:
      - xp: 6
      - choice: [IC2:itemScrapbox x8, IC2:itemScrap x64, IC2:itemPartCircuitAdv x4]

  - id: materia_uu_balde
    title: "Matéria UU"
    type: normal
    deps: [fabricador_massa]
    icon: IC2:itemCellEmpty:3
    desc: |
      O Fabricador enche um tanque interno de §dMatéria UU§r; tire-a com células (slot de
      recipiente) ou canos. Junte §e100 mB§r em qualquer recipiente.

      Parece pouco. Não é. Faça as contas e chore um pouquinho comigo.
    tasks:
      - fluid: "ic2uumatter x100"
    rewards:
      - xp: 4
      - item: IC2:itemScrap x32

  - id: cristal_memoria
    title: "Cristal de Memória"
    type: normal
    deps: [centrifuga_termica]
    icon: IC2:itemcrystalmemory
    desc: |
      5 Dióxidos de Silício (4 Pós de Argila no Centrifugador Térmico) + 4 Pós de Obsidiana =
      §eCristal de Memória Bruto§r → fornalha → §eCristal de Memória§r. Ele guarda um padrão de
      replicação e é peça do Padrão de Armazenamento (que pede 2).
    tasks:
      - get: IC2:itemcrystalmemory x2
    rewards:
      - xp: 4
      - item: minecraft:obsidian x8

  - id: teleportador
    title: "Teletransportador"
    type: normal
    deps: [carcaca_avancada, fibra_vidro, transmissor_frequencia, circuito_avancado]
    icon: IC2:blockMachine2
    desc: |
      4 Circuitos Avançados, Transmissor de Frequência, 2 Cabos de Fibra de Vidro, Carcaça
      Avançada e 1 diamante = §eTeletransportador§r. Ligue dois deles com o Transmissor (clique
      num, depois no outro) e pise para viajar — gastando EU conforme a distância e o peso do
      seu inventário (`teleporterUseInventoryWeight = true` neste pack).

      O Replicador pede §e3§r deles. Sim, três.
    tasks:
      - get: IC2:blockMachine2
    rewards:
      - xp: 4
      - item: IC2:itemPartCircuitAdv x2

  - id: transmissor_frequencia
    title: "Transmissor de Frequência"
    type: normal
    deps: [circuito]
    icon: IC2:itemFreq
    desc: |
      Uma pecinha simples que conversa à distância.

      Circuito + Cabo de Cobre Isolado = §eTransmissor de Frequência§r. Ele "pareia" coisas à
      distância: Teletransportadores e a Dinamite Remota.

      Clique direito num Teletransportador, depois no outro, e eles ficam pareados.
    tasks:
      - get: IC2:itemFreq
    rewards:
      - xp: 3
      - item: IC2:itemCable x8

  - id: examinador
    title: "Examinador (Scanner)"
    type: normal
    deps: [carcaca_avancada, vidro_reforcado, iluminador, circuito_avancado]
    icon: IC2:blockMachine2:7
    desc: |
      Placas de Ferro, Vidro Reforçado, 2 Motores, Iluminador, 2 Circuitos Avançados e Carcaça
      Avançada = §eExaminador§r. Coloque um item e ele o §eescaneia§r (gastando EU) para
      descobrir quanta UU custa replicá-lo. O resultado vai para um Padrão de Armazenamento
      encostado.
    tasks:
      - get: IC2:blockMachine2:7
    rewards:
      - xp: 4
      - item: IC2:itemRecipePart:1 x2

  - id: padrao_armazenamento
    title: "Padrão de Armazenamento"
    type: normal
    deps: [cristal_memoria, laser_mineracao, pedra_reforcada]
    icon: IC2:blockMachine2:6
    desc: |
      3 Pedras Reforçadas, 2 Cristais de Memória, Carcaça Avançada, Circuito Avançado e §e2
      Lasers de Mineração§r = §ePadrão de Armazenamento§r. Ele guarda os padrões escaneados (e
      importa/exporta padrões para Cristais de Memória).
    tasks:
      - get: IC2:blockMachine2:6
    rewards:
      - xp: 4
      - item: IC2:blockAlloy x4

  - id: replicador
    title: "Replicador"
    type: main
    deps: [teleportador, examinador, padrao_armazenamento, mfe, transformador_hv]
    icon: IC2:blockMachine2:8
    desc: |
      2 Pedras Reforçadas, Vidro Reforçado, 3 Teletransportadores, 2 HV-Transformadores e 1
      MFE = §eReplicador§r. Encostado no Padrão de Armazenamento, ele escolhe um padrão e
      §ereconstrói o item§r a partir de Matéria UU e EU (modo único ou repetir).

      Escaneie um Minério de Irídio e... bom, você entendeu. É assim que se alimenta a
      QuantumSuit.
    tasks:
      - get: IC2:blockMachine2:8
    rewards:
      - xp: 6
      - choice: [IC2:itemScrapbox x16, IC2:itemPartIridium, IC2:itemBatLamaCrystal:26]

  - id: materia_uu
    title: "Matéria do Nada"
    type: milestone
    deps: [replicador, materia_uu_balde]
    icon: IC2:itemCellEmpty:3
    banner: "Matéria do Nada"
    subtitle: "Energia virou coisa"
    effect: 4
    desc: |
      Fabricador de Massa, Examinador, Padrão de Armazenamento e Replicador. Herói, você
      transformou §beletricidade em matéria§r. Os Antigos chamavam isso de "a pena que escreve
      sozinha" — e foi tentando escrever páginas demais com ela que eles racharam o Registro.

      §aUse com sabedoria:§r
      §e• Replique o que é raro§r (Irídio, diamantes), não o que é fácil de minerar.
      §e• Amplifique com sucata§r: Reciclador → sucata → Fabricador.
      §e• Escaneie antes§r: cada item só precisa ser escaneado uma vez.

      Para fechar a página, mostre-me um §eMinério de Irídio§r saindo do Replicador... ou de
      onde for, eu não vou contar a ninguém.
    tasks:
      - get: [IC2:blockMachine2:8, IC2:itemOreIridium]
    rewards:
      - xp: 12
      - kit: {name: "Kit do Alquimista Industrial", items: [IC2:itemScrapbox x16, IC2:itemcrystalmemory x2, IC2:itemPartCircuitAdv x4, IC2:blockAlloy x8]}
      - loot: epico

  # ======================================================================
  # FASE 12 — UTILIDADES, AUTOMAÇÃO E CURIOSIDADES
  # ======================================================================
  - id: andaime
    title: "Andaime"
    type: optional
    deps: [arvore_borracha]
    icon: IC2:blockScaffold
    desc: |
      Antes de tudo ficar alto e elétrico, a gente precisa alcançar o alto.

      Tábuas e gravetos = §e4 Andaimes§r. Dá para subir por eles como por uma escada — ótimos
      para construir alto (os moinhos de vento agradecem).
    tasks:
      - get: IC2:blockScaffold x8
    rewards:
      - loot: comum

  - id: andaime_ferro
    title: "Cerca e Andaime de Ferro"
    type: normal
    deps: [formador_metal]
    icon: IC2:blockIronScaffold
    desc: |
      Extruda Invólucros de Ferro no Formador de Metal para fazer §eCercas de Ferro§r. 6 Placas
      de Ferro + 3 Cercas = §e16 Andaimes de Ferro§r — a base para a Pedra Reforçada e para o
      Magnetizador.
    tasks:
      - get: [IC2:blockFenceIron x4, IC2:blockIronScaffold x16]
    rewards:
      - xp: 3
      - item: IC2:itemPlates:4 x6

  - id: magnetizador
    title: "Magnetizador"
    type: optional
    deps: [andaime_ferro]
    icon: IC2:blockMachine:9
    desc: |
      6 redstone, 2 Cercas de Ferro e Carcaça = §eMagnetizador§r. Ele magnetiza uma coluna de
      Cercas de Ferro acima dele: quem estiver com §ebotas de metal§r sobe e desce como num
      elevador. (A janela avisa se detectou suas botas.)
    tasks:
      - get: IC2:blockMachine:9
    rewards:
      - loot: comum

  - id: bobina_tesla
    title: "Bobina de Tesla"
    type: optional
    deps: [transformador_mv, circuito]
    icon: IC2:blockMachine2:1
    desc: |
      5 redstone, MV-Transformador, Circuito e 2 Invólucros de Ferro = §eBobina de Tesla§r. Com
      energia e sinal de redstone, ela dá choques em criaturas próximas. Defesa elétrica de
      base — mantenha os amigos longe!
    tasks:
      - get: IC2:blockMachine2:1
    rewards:
      - loot: incomum

  - id: terraformer
    title: "Transformador de Bioma"
    type: optional
    deps: [carcaca_avancada, circuito_avancado]
    icon: IC2:blockMachine:15
    desc: |
      O §eTerraformer§r (TFBP vazio, glowstone, terra e Carcaça Avançada) usa §eprojetos TFBP§r
      para remodelar o terreno em volta: plantar, irrigar, resfriar, desertificar, aplainar ou
      espalhar cogumelos. O TFBP vazio leva 1 Circuito, 1 Circuito Avançado e 2 redstone.
    tasks:
      - get: [IC2:blockMachine:15, IC2:itemTFBP]
    rewards:
      - loot: incomum

  - id: tfbp_projetos
    title: "Projetos TFBP"
    type: optional
    deps: [terraformer]
    icon: IC2:itemTFBPCultivation
    desc: |
      Cada projeto nasce de um TFBP vazio cercado por 4 itens-tema:
      §e• Cultivação§r (sementes) • §eIrrigação§r (baldes d'água) • §eRefrigeração§r (bolas de
      neve) • §eDesertificação§r (areia) • §ePlanificação§r (terra) • §eCogumelos§r (cogumelos
      e micélio).

      Faça qualquer um e veja o mundo mudar ao redor da máquina. §cUse longe da base!§r
    tasks:
      - one_of: [IC2:itemTFBPCultivation, IC2:itemTFBPIrrigation, IC2:itemTFBPChilling, IC2:itemTFBPDesertification, IC2:itemTFBPFlatification, IC2:itemTFBPMushroom]
    rewards:
      - loot: incomum

  - id: cofre_pessoal
    title: "Cofres e Comércio"
    type: optional
    deps: [circuito, carcaca_maquina]
    icon: IC2:blockPersonal
    desc: |
      Três blocos para servidores (oi, Rede Akashic!):
      §e• Cofre Pessoal§r — só o dono abre.
      §e• Trade-O-Mat§r — vende itens por itens, sem você estar lá.
      §e• Energy-O-Mat§r — vende energia.

      Faça qualquer um deles.
    tasks:
      - one_of: [IC2:blockPersonal, IC2:blockPersonal:1, IC2:blockPersonal:2]
    rewards:
      - loot: comum

  - id: porta_reforcada
    title: "Porta Reforçada"
    type: optional
    deps: [chumbo, placas]
    icon: IC2:itemDoorAlloy
    desc: |
      Placas de Ferro e de Chumbo = §ePorta Reforçada§r, resistente a explosões. A porta ideal
      para a sala do reator (e para o seu quarto, se você tem irmãos com TNT).
    tasks:
      - get: IC2:itemDoorAlloy
    rewards:
      - loot: comum

  - id: explosivos
    title: "TNT Industrial e Dinamite"
    type: optional
    deps: [resina]
    icon: IC2:blockITNT
    desc: |
      TNT + sílex = §e4 TNTs Industriais§r; TNT Industrial + linha = §e8 Dinamites§r para
      arremessar; Dinamite + Resina = Dinamite Grudenta. Com um Transmissor de Frequência, dá até
      para fazer a §eDinamite Remota§r. Mineração com estilo (e com cuidado)!
    tasks:
      - one_of: [IC2:blockITNT, IC2:itemDynamite, IC2:itemDynamiteSticky]
    rewards:
      - loot: comum

  - id: nuke
    title: "A Página Proibida"
    type: optional
    deps: [refletor_grosso, carcaca_avancada]
    icon: IC2:blockNuke
    visibility: hidden
    desc: |
      ...você achou. Eu escondi essa página por um motivo.

      A §cNuke§r (6 Refletores Grossos, 2 Circuitos Avançados e Carcaça Avançada) está
      §cHABILITADA§r neste pack, com potência limitada a 60 (TNT = 4). Isso ainda apaga um bairro
      inteiro. Em servidor, detoná-la perto de outros jogadores é griefing — e a Akasha vai
      ficar MUITO decepcionada.

      Construa só para colecionar. Por favor.
    tasks:
      - get: IC2:blockNuke
    rewards:
      - loot: incomum

  - id: estacas_plantacao
    title: "Plantações do IC2"
    type: optional
    deps: [arvore_borracha]
    icon: IC2:blockCrop
    desc: |
      4 gravetos = 2 §eEstacas de Plantação§r. Plante sementes nelas; para §ecruzar§r espécies,
      coloque uma estaca dupla (clique de novo com estacas) entre duas plantas maduras. Assim
      nascem plantas como Ferru (ferro!), Aurelia (ouro!) e Cyprium (cobre!).

      Coloque 8 estacas no inventário para começar a sua fazenda genética.
    tasks:
      - get: IC2:blockCrop x8
    rewards:
      - loot: comum

  - id: analisador_plantacao
    title: "Analisador de Plantação"
    type: optional
    deps: [estacas_plantacao, circuito]
    icon: IC2:itemCropnalyzer:1
    desc: |
      Cabos, redstone, vidro e Circuito = §eAnalisador de Plantação§r (Cropnalyzer). Ele lê os
      pacotes de sementes do IC2 e mostra a espécie e os atributos (crescimento, ganho e
      resistência). Essencial para melhorar suas linhagens.
    tasks:
      - get: IC2:itemCropnalyzer:*
    rewards:
      - loot: comum

  - id: semente_ic2
    title: "Sementes Cruzadas"
    type: optional
    deps: [analisador_plantacao]
    icon: IC2:itemCropSeed
    desc: |
      Colha uma planta cruzada e ganhe um §ePacote de Sementes§r do IC2 — qualquer espécie
      vale. Quanto melhores os atributos, melhor a próxima geração. O Registro também tem
      páginas de botânica, sabia?
    tasks:
      - get: IC2:itemCropSeed
    rewards:
      - loot: incomum

  - id: crop_matron
    title: "Crop-Matron e Colheitadeira"
    type: optional
    deps: [estacas_plantacao, celula_vazia, circuito]
    icon: IC2:blockMachine2:2
    desc: |
      O §eCrop-Matron§r cuida das plantações em volta: aplica Fertilizante (sucata + farinha de
      osso) e hidrata com água ou Células de Hidratação. A §eColheitadeira§r (Crop Harvester,
      mesma receita com tesoura no lugar das células) colhe tudo sozinha.

      Faça qualquer um dos dois.
    tasks:
      - one_of: [IC2:blockMachine2:2, IC2:blockMachine3:7]
    rewards:
      - loot: comum

  - id: cafe
    title: "Café Industrial"
    type: optional
    deps: [estacas_plantacao]
    icon: IC2:itemMugCoffee:2
    desc: |
      Toda boa engenharia precisa de café. Cultive Café nas estacas, moa os grãos (bancada ou
      Triturador), junte Caneca de Pedra + Pó de Café + água = Café Frio → fornalha → Café
      Preto → + açúcar + leite = §eCafé§r. Energia para o jogador, finalmente!
    tasks:
      - get: IC2:itemMugCoffee:2
    rewards:
      - loot: comum

  - id: lata_estanho
    title: "Comida Enlatada"
    type: normal
    deps: [formador_metal, maquina_conservas]
    icon: IC2:itemTinCanFilled
    desc: |
      Extruda Invólucros de Estanho para fazer §eLatas de Estanho§r. Na §eMáquina de Conservas
      Sólidas§r (2 latas, 2 Circuitos e Carcaça) — ou na Máquina de Conservas comum, no modo
      enlatar — comida + latas = §eLatas Cheias§r.

      O Capacete Quântico come essas latas sozinho quando você tem fome. Faça §e16§r.
    tasks:
      - get: IC2:itemTinCanFilled x16
    rewards:
      - xp: 3
      - item: minecraft:cooked_beef x16

  - id: logistica_ic2
    title: "Logística do IC2"
    type: optional
    deps: [upgrade_ejetor, upgrade_ejetor_fluidos]
    icon: IC2:blockMachine3:5
    desc: |
      O IC2 também tem automação própria:
      §e• Máquina de Classificação§r (6 Upgrades de Ejetor, Circuito, Carcaça, baú) — separa
      itens por destino.
      §e• Tampão de Itens§r — um buffer de itens entre máquinas.
      §e• Distribuidor de Fluidos§r (5 Upgrades de Ejetor de Fluidos) — reparte ou concentra
      fluidos.
      §e• Regulador de Fluidos§r — controla a vazão.
      §e• Engarrafador de Líquidos§r — enche e esvazia recipientes.

      Faça qualquer um.
    tasks:
      - one_of: [IC2:blockMachine3:5, IC2:blockMachine3:6, IC2:blockMachine3:4, IC2:blockMachine2:14, IC2:blockMachine2:10]
    rewards:
      - loot: incomum

  - id: rolos_pintura
    title: "Rolos de Pintura"
    type: optional
    deps: [pulverizador_cf]
    icon: IC2:itemToolPainterRed
    desc: |
      Lã e ferro = §eRolo de Pintura§r; com um corante, ele pega a cor. Use-o nas paredes de
      Espuma de Construção para colorir a sua base industrial. São 16 cores!
    tasks:
      - one_of: [IC2:itemToolPainterBlack:*, IC2:itemToolPainterRed:*, IC2:itemToolPainterGreen:*, IC2:itemToolPainterBrown:*, IC2:itemToolPainterBlue:*, IC2:itemToolPainterPurple:*, IC2:itemToolPainterCyan:*, IC2:itemToolPainterLightGrey:*, IC2:itemToolPainterDarkGrey:*, IC2:itemToolPainterPink:*, IC2:itemToolPainterLime:*, IC2:itemToolPainterYellow:*, IC2:itemToolPainterCloud:*, IC2:itemToolPainterMagenta:*, IC2:itemToolPainterOrange:*, IC2:itemToolPainterWhite:*]
    rewards:
      - loot: comum

  - id: barcos_ic2
    title: "Canoa de Carbono e Bote Elétrico"
    type: optional
    deps: [placa_carbono, rotor_ferro]
    icon: IC2:itemBoat
    desc: |
      5 Placas de Carbono = §eCanoa de Fibra de Carbono§r, resistente e rápida. Para os fãs de
      velocidade: o §eBote Elétrico§r leva Placas de Ferro, cabos, Motor Elétrico e um Rotor
      de Ferro. Faça qualquer um e vá passear — você merece.
    tasks:
      - one_of: [IC2:itemBoat, IC2:itemBoat:3]
    rewards:
      - loot: comum

  # ======================================================================
  # MARCO FINAL
  # ======================================================================
  - id: mestre_industrial
    title: "Maestria da Indústria"
    type: milestone
    deps: [quantum_completo, reator_nuclear, materia_uu, mfsu]
    icon: IC2:itemArmorQuantumHelmet:1
    banner: "Mestre da Indústria"
    subtitle: "O Volume da Indústria está completo"
    effect: 3
    desc: |
      Herói. Senta aqui um minutinho comigo.

      Você começou batendo numa árvore que chorava resina. Depois veio o cobre, o primeiro
      gerador, a BatBox que você ligou com a mão tremendo. Veio o aço de um alto-forno a 50 000
      hU, a rede de tensões sem nenhuma explosão (ok, quase nenhuma), o vento, o sol, o vapor.
      Veio o átomo — e você o domou. Veio a Matéria UU — e você a usou com sabedoria. E agora
      você veste uma §6QuantumSuit§r.

      §bO Volume da Indústria está reescrito.§r Esta página brilha no §6Selo da Engrenagem§r —
      uma das oito luzes que vão fechar a Fratura.

      E a história das máquinas não termina aqui: o §eIndustrial Upgrade§r continua exatamente
      de onde o IC2 parou — painéis solares absurdos, máquinas de tier altíssimo, novos
      minérios e muito mais. É o próximo passo natural (procure os capítulos §eIndustrial
      Upgrade I, II e III§r).

      Eu nunca vou esquecer este dia. Obrigada por consertar o meu livro.
    tasks:
      - get: [IC2:itemArmorQuantumChestplate:*, IC2:blockGenerator:5, IC2:blockMachine2:8, IC2:blockElectric:2]
    rewards:
      - xp: 15
      - kit: {name: "Legado do Mestre da Indústria", items: [IC2:itemPartIridium x4, IC2:itemBatLamaCrystal:26 x2, IC2:upgradeModule x8, IC2:upgradeModule:1 x4, IC2:upgradeModule:2 x4]}
      - loot: [epico x2]
      - command: "/effect @p 1 1200 1"
