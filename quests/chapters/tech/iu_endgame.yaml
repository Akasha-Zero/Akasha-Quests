chapter:
  id: iu_endgame
  title: "Industrial Upgrade III — Endgame"
  prefix: ""
  order: 304
  icon: industrialupgrade:BlockSolarPanel:13
  desc: |
    §bO Volume das Melhorias, parte III.§r Prótons e nêutrons, a fusão nuclear, matéria sólida,
    a Pedreira Quântica, a Armadura Quântica Espectral, MFSUs de centenas de bilhões e a escada
    solar até o Painel Quark. (Integrações: Avaritia e Botania.)

quests:
  # ======================================================================
  # FASE 0 — ABERTURA
  # ======================================================================
  - id: boas_vindas_iii
    title: "Números Absurdos"
    type: info
    icon: industrialupgrade:ItemCore:13
    desc: |
      Herói, respira fundo. Este é o capítulo em que o Volume das Melhorias deixa de medir as
      coisas em milhões e passa a medir em §ebilhões§r. Ele continua de onde o §eIndustrial
      Upgrade II§r parou (Painel Espectral, Circuito Espectral, Caixa Quântica Melhorada).

      Algumas contas para você sentir o tamanho: um Núcleo Fotônico custa 900 milhões de EU no
      Transformador Molecular; um Lingote de Nêutron custa uns 146 bilhões de EU; o Painel
      Quark gera mais de §6339 milhões de EU/t§r.

      §aConselho de amiga:§r monte primeiro uma base de energia de verdade — vários Painéis
      Espectrais, reatores, ou a energia de outros mods convertida — e um MFSU grande. Depois
      venha subir a escada comigo.
    tasks:
      - check
    rewards:
      - xp: 2

  - id: compactando_iridio
    title: "Irídio Comprimido Melhorado"
    type: main
    deps: [boas_vindas_iii]
    deps_hidden: [iu_avancado:placa_iridio_comprimida]
    icon: industrialupgrade:QuantumItems4
    desc: |
      §e9 Placas de Irídio Comprimidas§r no Compressor = §eImproved Compressed Iridium Plate§r. São
      36 Placas Reforçadas de Irídio do IC2 numa placa só!

      Ela está nos painéis do Difrativo ao Quark (2 por painel), no MFSU Quark, no
      Gerador de Partículas de Nêutron, nos Reatores Perfeitos, nos módulos de pedreira de
      nível alto... Faça §e2§r e já planeje uma linha de Irídio molecular.
    tasks:
      - get: industrialupgrade:QuantumItems4 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:QuantumItems2 x3, IC2:itemPartIridium x8, IC2:itemOreIridium x8]

  # ======================================================================
  # FASE 1 — PRÓTON E O PAINEL PROTÔNICO
  # ======================================================================
  - id: plutonio
    title: "Plutônio"
    type: normal
    deps: [boas_vindas_iii]
    icon: IC2:itemPlutonium
    desc: |
      O Próton nasce do §ePlutônio§r do IC2: barras de urânio (ou MOX) esgotadas na Centrífuga
      Térmica soltam Pequenos Montes de Plutônio, e 9 montes viram 1 Plutônio. Mais tarde, o Reator de Fusão Nuclear do IU também
      transforma §eNetúnio + Tório§r em Plutônio.

      §cRadioativo!§r Use o Traje Antirradiação. Junte §e2 Plutônios§r.
    tasks:
      - get: IC2:itemPlutonium x2
    rewards:
      - xp: 4
      - item: IC2:reactorUraniumSimple:1 x2

  - id: proton
    title: "Carga Positiva"
    type: main
    deps: [plutonio]
    deps_hidden: [iu_base:transformador_molecular]
    icon: industrialupgrade:proton
    desc: |
      No Transformador Molecular: §ePlutônio → Próton§r (15,5 milhões de EU). O Próton é
      radioativo (use o traje!) e tem dois usos:
      §e•§r 2 Prótons vão em cada §eVidro Protônico§r;
      §e•§r na Máquina de Conservas Sólidas, Vareta vazia + Próton = §eBarra de Próton§r, um
      combustível de reator duradouro. Esgotada, a Centrífuga Térmica devolve o Próton.
      Faça §e2§r.
    tasks:
      - get: industrialupgrade:proton x2
    rewards:
      - xp: 6
      - choice: [IC2:itemPlutonium x2, industrialupgrade:iuplate:7 x4, industrialupgrade:ItemCore:4]

  - id: nucleo_protonico
    title: "Carga Positiva Concentrada"
    type: main
    deps: [boas_vindas_iii]
    deps_hidden: [iu_avancado:nucleo_espectral]
    icon: industrialupgrade:ItemCore:5
    desc: |
      §e4 Núcleos Espectrais → 1 Núcleo Protônico§r (7,5 milhões de EU). Além do painel, ele vai em
      pares em cada §eGerador de Matéria Sólida§r, no Gerador de Matéria Melhorado, nos Módulos de
      Tier do painel e no Núcleo de Neutrônio (Avaritia). Faça §e2§r.
    tasks:
      - get: industrialupgrade:ItemCore:5 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:ItemCore:4 x2, industrialupgrade:iuingot:17 x16, industrialupgrade:QuantumItems5]

  - id: placa_sunnarium_protonica
    title: "Placa de Sunnarium Protônica"
    type: main
    deps: [boas_vindas_iii]
    deps_hidden: [iu_avancado:placa_sunnarium_espectral]
    icon: industrialupgrade:sunnariumpanel:4
    desc: |
      §ePlaca Espectral + Placa de Magnésio§r no Fabricante de Placas de Sunnarium = §eProtonic
      Sunnarium Plate§r. A escada de metais continua: Zinco (Singular), Manganês (Difrativa),
      Cobalto (Fotônica), Níquel (Nêutron), Prata (Bárion), Vanádio (Hádron), Vitálio
      (Gráviton) e Caravky (Quark). Faça §e2§r.
    tasks:
      - get: industrialupgrade:sunnariumpanel:4 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:sunnariumpanel:3, industrialupgrade:iuplate:7 x6, industrialupgrade:sunnarium:2 x4]

  - id: vidro_protonico
    title: "Vidro Protônico"
    type: main
    deps: [proton, placa_sunnarium_protonica]
    deps_hidden: [iu_avancado:vidro_espectral]
    icon: industrialupgrade:IUphotonglass:5
    desc: |
      Este vidro é diferente: §e4 Varetas de Manganês§r e §e2 Prótons§r em volta, §eVidro
      Espectral§r no centro e §e2 Placas de Sunnarium Protônicas§r = §eProtonic Glass§r. Faça §e2§r.

      §aDica:§r os próximos vidros voltam ao padrão de 6 varetas: Invar (Singular), Espinélio
      (Difrativo), Cromo (Fotônico), Germânio + 2 Lingotes de Nêutron (Nêutron), Zinco (Bárion),
      Vanádio (Hádron), Cobalto (Gráviton) e Caravky (Quark).
    tasks:
      - get: industrialupgrade:IUphotonglass:5 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:IUphotonglass:4, industrialupgrade:IUstik:16 x8, industrialupgrade:proton]

  - id: painel_protonico
    title: "Energia Positiva"
    type: milestone
    deps: [nucleo_protonico, vidro_protonico]
    deps_hidden: [iu_avancado:painel_espectral]
    icon: industrialupgrade:BlockSolarPanel:5
    banner: "Painel Solar Protônico"
    subtitle: "5120 EU/t"
    desc: |
      §e2 Vidros Protônicos, Núcleo Protônico, 2 Placas de Irídio Comprimidas, 3 Painéis
      Espectrais e um Circuito Nano§r = §eProtonic Solar Panel§r.

      §e5120 EU/t§r de dia, 50 milhões de EU de buffer, saída de 10 240 EU/t. Isso já passa do
      limite de um cabo de fibra de vidro do IC2 — use Cabos Espectrais (32 768 EU/t) ou acima.

      §aLembre:§r o tier dos módulos não pode ser maior que o do painel, e os Kits de Upgrade de
      Painel economizam desmontagem.
    tasks:
      - get: industrialupgrade:BlockSolarPanel:5
    rewards:
      - xp: 12
      - kit: {name: "Kit da Carga Positiva", items: [industrialupgrade:ItemCore:4 x4, industrialupgrade:sunnariumpanel:3 x2, industrialupgrade:QuantumItems2 x2, industrialupgrade:iuplate:15 x4, industrialupgrade:IUstik:4 x6]}
      - loot: epico

  # ======================================================================
  # FASE 2 — SINGULAR E DIFRATIVO
  # ======================================================================
  - id: nucleo_singular
    title: "Singularidade"
    type: main
    deps: [nucleo_protonico]
    icon: industrialupgrade:ItemCore:6
    desc: |
      §e4 Núcleos Protônicos → 1 Núcleo Singular§r (45 milhões de EU). Além do Painel Singular, ele
      vai no Transformador de Matéria Sólida e nos módulos de Eficiência III da pedreira.
      Faça §e2§r.
    tasks:
      - get: industrialupgrade:ItemCore:6 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:ItemCore:5 x2, industrialupgrade:QuantumItems5 x2, industrialupgrade:QuantumItems4]

  - id: placa_sunnarium_singular
    title: "Placa de Sunnarium Singular"
    type: main
    deps: [placa_sunnarium_protonica]
    icon: industrialupgrade:sunnariumpanel:5
    desc: |
      §ePlaca Protônica + Placa de Zinco§r = §eSingular Sunnarium Plate§r. Faça §e2§r.
    tasks:
      - get: industrialupgrade:sunnariumpanel:5 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:sunnariumpanel:4, industrialupgrade:iuplate:15 x6, industrialupgrade:sunnarium:2 x4]

  - id: vidro_singular
    title: "Vidro Singular"
    type: main
    deps: [vidro_protonico, placa_sunnarium_singular]
    icon: industrialupgrade:IUphotonglass:6
    desc: |
      §e6 Varetas de Invar§r + §eVidro Protônico§r + §e2 Placas de Sunnarium Singulares§r =
      §eSingular Glass§r. Faça §e2§r.
    tasks:
      - get: industrialupgrade:IUphotonglass:6 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:IUphotonglass:5, industrialupgrade:IUstik:4 x8, industrialupgrade:iuingot:4 x9]

  - id: painel_singular
    title: "Energia Emaranhada"
    type: milestone
    deps: [painel_protonico, nucleo_singular, vidro_singular]
    icon: industrialupgrade:BlockSolarPanel:6
    banner: "Painel Solar Singular"
    subtitle: "20 480 EU/t de dia, 10 240 de noite"
    desc: |
      §e2 Vidros Singulares, Núcleo Singular, 2 Placas de Irídio Comprimidas, 3 Painéis Protônicos e
      um Circuito Quântico§r = §eSingular Solar Panel§r.

      §e20 480 EU/t de dia e 10 240 de noite§r, 1 bilhão de EU de buffer, saída 40 960 EU/t. O
      Capacete Solar Singular, o mais forte dos capacetes, usa um destes no topo.
    tasks:
      - get: industrialupgrade:BlockSolarPanel:6
    rewards:
      - xp: 12
      - kit: {name: "Kit do Emaranhado", items: [industrialupgrade:ItemCore:5 x4, industrialupgrade:sunnariumpanel:4 x2, industrialupgrade:QuantumItems4, industrialupgrade:iuplate:16 x4, industrialupgrade:IUstik:12 x6]}
      - loot: epico

  - id: nucleo_difrativo
    title: "Grade de Difração"
    type: main
    deps: [nucleo_singular]
    icon: industrialupgrade:ItemCore:7
    desc: |
      §e4 Núcleos Singulares → 1 Núcleo Difrativo§r (180 milhões de EU). Ele também é o coração da
      §ePedreira Quântica§r e do Gerador de Matéria Avançado. Faça §e2§r.
    tasks:
      - get: industrialupgrade:ItemCore:7 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:ItemCore:6 x2, industrialupgrade:QuantumItems4, industrialupgrade:QuantumItems3 x2]

  - id: placa_sunnarium_difrativa
    title: "Placa de Sunnarium Difrativa"
    type: main
    deps: [placa_sunnarium_singular]
    icon: industrialupgrade:sunnariumpanel:6
    desc: |
      §ePlaca Singular + Placa de Manganês§r = §eDiffractive Sunnarium Plate§r. Faça §e2§r.
    tasks:
      - get: industrialupgrade:sunnariumpanel:6 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:sunnariumpanel:5, industrialupgrade:iuplate:16 x6, industrialupgrade:sunnarium:2 x4]

  - id: vidro_difrativo
    title: "Vidro Difrativo"
    type: main
    deps: [vidro_singular, placa_sunnarium_difrativa]
    icon: industrialupgrade:IUphotonglass:7
    desc: |
      §e6 Varetas de Espinélio§r + §eVidro Singular§r + §e2 Placas de Sunnarium Difrativas§r =
      §eDiffractive Glass§r. Faça §e2§r.
    tasks:
      - get: industrialupgrade:IUphotonglass:7 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:IUphotonglass:6, industrialupgrade:IUstik:12 x8, industrialupgrade:iuingot:12 x9]

  - id: painel_difrativo
    title: "Coletor de Interferência"
    type: milestone
    deps: [painel_singular, nucleo_difrativo, vidro_difrativo, compactando_iridio]
    icon: industrialupgrade:BlockSolarPanel:7
    banner: "Painel Solar Difrativo"
    subtitle: "81 920 EU/t"
    desc: |
      §e2 Vidros Difrativos, Núcleo Difrativo, 2 Placas de Irídio Comprimidas Melhoradas, 3 Painéis
      Singulares e um Circuito Quântico§r = §eDiffractive Solar Panel§r.

      §e81 920 EU/t§r, 1,5 bilhão de EU de buffer, saída 327 680 EU/t. A partir daqui, todo painel
      pede §ePlacas de Irídio Comprimidas Melhoradas§r. Prepare o irídio molecular!
    tasks:
      - get: industrialupgrade:BlockSolarPanel:7
    rewards:
      - xp: 12
      - kit: {name: "Kit da Difração", items: [industrialupgrade:ItemCore:6 x4, industrialupgrade:sunnariumpanel:5 x2, industrialupgrade:QuantumItems4, industrialupgrade:iuplate:6 x4, industrialupgrade:IUstik:11 x6]}
      - loot: epico

  # ======================================================================
  # FASE 3 — FOTÔNICO
  # ======================================================================
  - id: nucleo_fotonico
    title: "A Luz Não É Só Onda"
    type: main
    deps: [nucleo_difrativo]
    icon: industrialupgrade:ItemCore:8
    desc: |
      §e4 Núcleos Difrativos → 1 Núcleo Fotônico§r: §c900 milhões de EU§r. Ele também vai no Gerador
      de Matéria Perfeito, no Combinador de Painéis, no Combinador de Geradores de Matéria, no
      MFSU Bárion e na Pedreira Quântica Melhorada. Faça §e2§r — com calma.
    tasks:
      - get: industrialupgrade:ItemCore:8 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:ItemCore:7 x2, industrialupgrade:QuantumItems4 x2, industrialupgrade:QuantumItems3 x2]

  - id: placa_sunnarium_fotonica
    title: "Placa de Sunnarium Fotônica"
    type: main
    deps: [placa_sunnarium_difrativa]
    icon: industrialupgrade:sunnariumpanel:7
    desc: |
      §ePlaca Difrativa + Placa de Cobalto§r = §ePhotonic Sunnarium Plate§r. Faça §e2§r.
    tasks:
      - get: industrialupgrade:sunnariumpanel:7 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:sunnariumpanel:6, industrialupgrade:iuplate:6 x6, industrialupgrade:sunnarium:2 x4]

  - id: vidro_fotonico
    title: "Vidro Fotônico"
    type: main
    deps: [vidro_difrativo, placa_sunnarium_fotonica]
    icon: industrialupgrade:IUphotonglass:8
    desc: |
      §e6 Varetas de Cromo§r + §eVidro Difrativo§r + §e2 Placas de Sunnarium Fotônicas§r = §ePhotonic
      Glass§r. Faça §e2§r.
    tasks:
      - get: industrialupgrade:IUphotonglass:8 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:IUphotonglass:7, industrialupgrade:IUstik:11 x8, industrialupgrade:iuingot:11 x9]

  - id: painel_fotonico
    title: "Energia das Partículas de Luz"
    type: milestone
    deps: [painel_difrativo, nucleo_fotonico, vidro_fotonico]
    icon: industrialupgrade:BlockSolarPanel:8
    banner: "Painel Solar Fotônico"
    subtitle: "327 680 EU/t"
    desc: |
      §e2 Vidros Fotônicos, Núcleo Fotônico, 2 Placas de Irídio Comprimidas Melhoradas, 3 Painéis
      Difrativos e um Circuito Espectral§r = §ePhotonic Solar Panel§r.

      §e327 680 EU/t§r e 5 bilhões de EU de buffer. Herói, um único painel destes alimenta uma
      cidade industrial inteira. E ainda é só o nono degrau...

      Para quem joga com o §6Avaritia§r: 4 Painéis Fotônicos + Núcleo de Neutrônio = §6Painel de
      Neutrônio§r (veja a seção do Avaritia).
    tasks:
      - get: industrialupgrade:BlockSolarPanel:8
    rewards:
      - xp: 12
      - kit: {name: "Kit da Luz Sólida", items: [industrialupgrade:ItemCore:7 x4, industrialupgrade:sunnariumpanel:6 x2, industrialupgrade:QuantumItems4, industrialupgrade:iuplate:8 x4, industrialupgrade:IUstik:18 x6]}
      - loot: epico

  # ======================================================================
  # FASE 4 — GERADORES DE MATÉRIA E O NÊUTRON
  # ======================================================================
  - id: gerador_materia_melhorado
    title: "Gerador de Matéria Melhorado"
    type: main
    deps: [nucleo_protonico]
    deps_hidden: [ic2:materia_uu, iu_avancado:caixa_quantica]
    icon: industrialupgrade:machines:1
    desc: |
      O §eFabricante de Massa§r do IC2 no centro, 2 Circuitos Quânticos, um Núcleo Protônico, 2
      Placas Densas de Alumel e 3 Caixas Quânticas = §eImproved Matter Generator§r.

      Ele fabrica Matéria UU gastando §e900 mil EU por mB§r (o do IC2 gasta 1 milhão), com tanque
      de 8 baldes. O Avançado gasta 800 mil e o Perfeito 700 mil. §cEntrada tier 3 (HV)§r — não
      ligue direto num MFSU sem transformador.
    tasks:
      - get: industrialupgrade:machines:1
    rewards:
      - xp: 6
      - choice: [IC2:itemScrapbox x16, industrialupgrade:QuantumItems6 x2, IC2:upgradeModule x4]

  - id: gerador_materia_avancado
    title: "Gerador de Matéria Avançado"
    type: main
    deps: [gerador_materia_melhorado, nucleo_difrativo]
    deps_hidden: [iu_avancado:caixa_quantica_melhorada]
    icon: industrialupgrade:machines:2
    desc: |
      O Gerador Melhorado + Núcleo Difrativo + 2 Circuitos Quânticos + 2 Placas Densas de Vitálio +
      3 Caixas Quânticas Melhoradas = §eAdvanced Matter Generator§r (800 mil EU/mB, tanque de 10
      baldes).
    tasks:
      - get: industrialupgrade:machines:2
    rewards:
      - xp: 6
      - choice: [IC2:itemScrapbox x16, industrialupgrade:QuantumItems3, IC2:upgradeModule x4]

  - id: gerador_materia_perfeito
    title: "Gerador de Matéria Perfeito"
    type: main
    deps: [gerador_materia_avancado, nucleo_fotonico, compactando_iridio]
    icon: industrialupgrade:machines:3
    desc: |
      O Avançado + Núcleo Fotônico + 2 Circuitos Espectrais + 2 Placas Densas de Duralumínio + 2
      Caixas Quânticas Melhoradas + uma Placa de Irídio Comprimida Melhorada = §ePerfect Matter
      Generator§r (700 mil EU/mB, 12 baldes). Ele é o centro do próximo passo: o nêutron.
    tasks:
      - get: industrialupgrade:machines:3
    rewards:
      - xp: 6
      - choice: [IC2:itemScrapbox x16, industrialupgrade:QuantumItems5 x2, industrialupgrade:photoniy_ingot x2]

  - id: caixa_sucata_dupla
    title: "Caixa de Sucata Dupla"
    type: optional
    deps: [gerador_materia_melhorado]
    deps_hidden: [iu_base:montador_sucata]
    icon: industrialupgrade:doublescrapBox
    desc: |
      No Montador de Sucata, §e9 Caixas de Sucata = 1 Caixa de Sucata Dupla§r. No amplificador do
      Fabricante de Massa do IC2, ela vale um bônus enorme: 405 000 de amplificação por
      unidade. Fabricação de UU nunca mais foi a mesma (os Geradores de Matéria do IU também
      aceitam sucata como amplificador).
    tasks:
      - get: industrialupgrade:doublescrapBox
    rewards:
      - loot: incomum

  - id: gerador_neutrons
    title: "Gerador de Partículas de Nêutron"
    type: main
    deps: [gerador_materia_perfeito]
    deps_hidden: [iu_avancado:lingote_foton]
    icon: industrialupgrade:machines:5
    desc: |
      O Gerador de Matéria Perfeito no centro, 4 Lingotes de Fóton, 2 Circuitos Espectrais e 2
      Placas de Irídio Comprimidas Melhoradas = §eNeutron Particle Generator§r.

      Ele transforma energia em §eNêutron líquido§r: §c16,25 milhões de EU por mB§r. Uma célula
      (1000 mB) custa mais de 16 bilhões de EU. Herói, é aqui que a sua base de energia é posta à
      prova. Ponha várias fontes num MFSU grande e deixe ligado... por dias.
    tasks:
      - get: industrialupgrade:machines:5
    rewards:
      - xp: 6
      - choice: [industrialupgrade:cell x16, industrialupgrade:QuantumItems5 x2, industrialupgrade:QuantumItems4]

  - id: celula_neutron
    title: "Célula de Nêutron Liquefeito"
    type: normal
    deps: [gerador_neutrons]
    icon: industrialupgrade:cell:1
    desc: |
      Encha uma Célula Avançada na saída do gerador: §eLiquefied Neutron Cell§r (1000 mB de nêutron
      cada). Mostre uma.
    tasks:
      - get: industrialupgrade:cell:1
    rewards:
      - xp: 4
      - item: industrialupgrade:cell x8

  - id: estilhaco_neutron
    title: "Partícula Neutra"
    type: main
    deps: [celula_neutron]
    icon: industrialupgrade:neutronium
    desc: |
      Uma Célula de Nêutron no Compressor = §eNeutron Shard§r (Estilhaço de Nêutron). Nove
      estilhaços no Compressor = um §eLingote de Nêutron§r. Junte §e9 estilhaços§r — e respeite cada
      um deles: são 146 bilhões de EU na sua mão.
    tasks:
      - get: industrialupgrade:neutronium x9
    rewards:
      - xp: 6
      - choice: [industrialupgrade:cell x8, industrialupgrade:QuantumItems5 x2, industrialupgrade:ItemCore:8]

  - id: lingote_neutron
    title: "Lingote de Nêutron"
    type: main
    deps: [estilhaco_neutron]
    icon: industrialupgrade:neutroniumingot
    desc: |
      §eNeutron Ingot§r! Ele vai no §eVidro de Nêutron§r (2 por vidro) e no §eReator de Fusão
      Nuclear§r (4). Junte §e2§r para o vidro.
    tasks:
      - get: industrialupgrade:neutroniumingot x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:neutronium x3, industrialupgrade:QuantumItems4, industrialupgrade:ItemCore:8]

  - id: nucleo_neutron
    title: "Partícula Sem Carga"
    type: main
    deps: [nucleo_fotonico]
    icon: industrialupgrade:ItemCore:9
    desc: |
      §e4 Núcleos Fotônicos → 1 Núcleo de Nêutron§r (2,7 bilhões de EU). Ele também vai no Gerador
      de Matéria Combinado e no MFSU Hádron. Faça §e2§r.
    tasks:
      - get: industrialupgrade:ItemCore:9 x2
    rewards:
      - xp: 6
      - choice: [industrialupgrade:ItemCore:8 x2, industrialupgrade:QuantumItems4 x2, industrialupgrade:QuantumItems5 x2]

  - id: placa_sunnarium_neutron
    title: "Placa de Sunnarium de Nêutron"
    type: main
