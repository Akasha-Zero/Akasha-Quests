  - id: mestre_quimico
    title: "Mestre da Química"
    type: milestone
    deps: [primeira_fabrica_mek, tres_ligas, processamento_5x, logistica_mek, matriz_inducao, dobrando_espaco, arsenal_mek]
    icon: Mekanism:AtomicAlloy
    banner: "Mestre da Química"
    subtitle: "O Volume da Química está completo"
    effect: 3
    desc: |
      Herói. Respira fundo comigo.

      Lembra do primeiro minério azulado? Do Infusor Metalúrgico zumbindo pela primeira vez, do
      aço que nasceu de ferro com carvão? Depois vieram as três ligas, os gases engarrafados, o
      cloro, o ácido sulfúrico — e cada minério passou a valer §ecinco§r. Vieram as fábricas, a
      Matriz de Indução, o portal de obsidiana refinada e o Minerador Digital.

      §bO Volume da Química está reescrito.§r Ele brilha no §6Selo da Engrenagem§r junto com os
      outros grandes Volumes de tecnologia.

      E ainda há fogo pela frente: no capítulo §eMekanism: Geradores e Fusão§r, este mesmo
      conhecimento acende turbinas industriais e um §eReator de Fusão§r com deutério e trítio.
      Obrigada por consertar mais esta página do meu livro.
    tasks:
      - get: [Mekanism:MachineBlock2:8, Mekanism:BasicBlock2:2, Mekanism:MachineBlock:11, Mekanism:AtomicDisassembler:*]
    rewards:
      - xp: 12
      - kit: {name: "Legado do Mestre da Química", items: [Mekanism:AtomicAlloy x8, Mekanism:ControlCircuit:3 x2, Mekanism:SpeedUpgrade x8, Mekanism:EnergyUpgrade x8, Mekanism:TeleportationCore]}
      - loot: [epico]
      - command: "/effect @p 1 1200 1"
