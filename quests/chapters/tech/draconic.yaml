  # ======================================================================
  # FASE 5 — O CAOS
  # ======================================================================
  - id: ilha_caos_info
    title: "As Ilhas do Caos"
    type: info
    deps: [armadura_draconica]
    icon: DraconicEvolution:chaosShard
    desc: |
      Achou o Dragão fácil? O Draconic ri disso.

      Em qualquer múltiplo de §e10 000 blocos§r do Fim (por exemplo x=0 z=10000, x=10000 z=0,
      x=0 z=-10000...) existe uma §5Ilha do Caos§r: pedra do Fim e obsidiana moldadas por energia
      escura. No centro, numa câmara de obsidiana alguns blocos abaixo da superfície, está o
      §eChaos Crystal§r.

      A ilha é guardada pelo §cGuardião do Caos§r, um Dragão do Fim mutado. Os ataques dele
      atravessam quase qualquer armadura — exceto a Dracônica — e drenam rápido a energia de
      armaduras de RF. Leve um Flux Capacitor Dracônico carregado!
    tasks:
      - check
    rewards:
      - xp: 3

  - id: ilha_caos
    title: "Chegada à Ilha do Caos"
    type: normal
    deps: [ilha_caos_info]
    icon: minecraft:end_stone
    task_logic: OR
    desc: |
      Voe até uma das Ilhas do Caos mais próximas do centro do Fim. A viagem é longa: leve
      Pérolas do Fim, um Enhanced Charm of Dislocation para marcar a volta e comida.

      Esta quest conclui quando você chegar perto do centro de uma das quatro ilhas mais
      próximas (x=±10000 ou z=±10000).
    tasks:
      - visit: {dim: 1, x: 0, y: 80, z: 10000, range: 250, name: "Ilha do Caos (Sul)"}
      - visit: {dim: 1, x: 0, y: 80, z: -10000, range: 250, name: "Ilha do Caos (Norte)"}
      - visit: {dim: 1, x: 10000, y: 80, z: 0, range: 250, name: "Ilha do Caos (Leste)"}
      - visit: {dim: 1, x: -10000, y: 80, z: 0, range: 250, name: "Ilha do Caos (Oeste)"}
    rewards:
      - xp: 6
      - item: minecraft:golden_apple x4

  - id: guardiao_caos
    title: "O Guardião do Caos"
    type: boss
    deps: [ilha_caos]
    icon: DraconicEvolution:chaosShard
    banner: "O Guardião do Caos Caiu"
    subtitle: "O Selo do Abismo treme"
    desc: |
      Este é o maior desafio do Volume do Dragão — e uma das três provas do §5Selo do Abismo§r.

      §eComo lutar:§r
      §e• Cristais de cura:§r espalhados pela ilha, cada um com 50 pontos de vida e um escudo
      temporário quando atingido. §cO Guardião não leva dano enquanto houver cristais ativos.§r
      Quando a vida dele fica baixa, ele tenta reacender alguns.
      §e• Ataques:§r rajadas, projéteis do caos e investidas que perfuram armaduras. Só a
      Dracônica bloqueia esse dano perfurante.
      §e• Energia:§r ele drena armaduras de RF rapidamente; mantenha o capacitor no inventário.

      Use o Arco Dracônico com onda de choque nos cristais e a espada ou o cajado no Guardião.
      Eu estou rezando por você daqui do Registro.
    tasks:
      - kill: {entity: "DraconicEvolution.ChaosGuardian", count: 1}
    rewards:
      - xp: 15
      - loot: [epico, epico]

  - id: fragmento_caos
    title: "Chaos Shard"
    type: main
    deps: [guardiao_caos]
    icon: DraconicEvolution:chaosShard
    desc: |
      Com o Guardião derrotado, cave até a câmara no centro da ilha e quebre o §eChaos
      Crystal§r: ele solta §e5 Chaos Shards§r.

      §c§lCORRA!§r Quando o cristal quebra, o campo de energia colapsa e §ca ilha inteira é
      aniquilada em segundos§r. Sem a armadura Dracônica completa, você tem pouquíssimo tempo para
      pegar os fragmentos e fugir. Tenha a rota de fuga pronta ANTES de quebrar.
    tasks:
      - get: DraconicEvolution:chaosShard x5
    rewards:
      - xp: 10
      - choice: [DraconicEvolution:awakenedCore, DraconicEvolution:draconicBlock, DraconicEvolution:wyvernCore x2]

  - id: nucleo_caotico
    title: "Chaotic Core"
    type: main
    deps: [fragmento_caos, lote_nucleos_despertados]
    icon: DraconicEvolution:chaoticCore
    desc: |
      O último núcleo! Misture 4 Awakened Cores, 4 Awakened Draconium Ingots e um Chaos Shard no centro.

      O §5Chaotic Core§r é o núcleo de melhoria mais forte do Upgrade Modifier e a peça central dos Estabilizadores do Reator. Cuide bem dele e planeje tudo com calma. Se tiver dúvida na receita, aperte R no NEI. Você chegou longe, Herói!
    tasks:
      - get: DraconicEvolution:chaoticCore
    rewards:
      - xp: 10
      - choice: [DraconicEvolution:awakenedCore, DraconicEvolution:draconicBlock, DraconicEvolution:draconium:2 x4]

  - id: fragmentos_menores
    title: "Fragmentos do Caos"
    type: optional
    deps: [reator_draconico]
    icon: DraconicEvolution:chaosFragment
    desc: |
      Quando o Reator converte combustível, o resultado é §eCaos§r — que você retira na GUI do
      reator, desligado, em forma de Fragmentos do Caos (Tiny → Small → Large, 9 para 1 a cada
      degrau) e Chaos Shards. Ou seja: o reator também é uma fonte renovável de fragmentos!
    tasks:
      - get: DraconicEvolution:chaosFragment:2
    rewards:
      - loot: raro

  # ======================================================================
  # FASE 6 — O REATOR DRACÔNICO
  # ======================================================================
  - id: reator_info
    title: "§cLeia Antes: o Reator Dracônico"
    type: info
    deps: [nucleo_caotico]
    icon: DraconicEvolution:reactorCore
    desc: |
      Eu vou ser muito franca: §co Reator Dracônico é a coisa mais perigosa do pack§r.

      §eComo funciona:§r combustível de Draconium Despertado + Caos geram calor e RF; o Caos
      acelera a reação. Um §ecampo de contenção§r (alimentado por você!) segura a esfera de plasma.
      §e• Temperatura ideal:§r cerca de §e8 000 °C§r. Acima disso a carga no campo dispara (10×
      a 10 000 °C, ~20× a 11 000 °C).
      §e• Saturação:§r quanto mais energia você tira, mais quente fica.
      §e• Conversão:§r §cnunca deixe chegar a 100%§r — a temperatura sobe sem controle e não há
      como desligar. Desligue e reabasteça em 80–90%.
      §e• Campo em 0% = explosão§r de 20 a 200 blocos de raio (conforme o combustível). A onda de
      choque §catravessa obsidiana e qualquer outra coisa§r — e a config deste pack mantém a
      explosão grande ligada.

      Construa §clonge da base§r, num posto avançado, com reserva de energia de sobra. Não é
      brincadeira.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: estrutura_estabilizador
    title: "Reactor Stabilizer Frame"
    type: normal
    deps: [reator_info]
    icon: DraconicEvolution:reactorCraftingPart
    desc: |
      Primeira peça do estabilizador! Misture 6 lingotes de ferro, um Wyvern Core e um Awakened Draconium Ingot.

      Você vai precisar de §e4§r, um por estabilizador. Faça de uma vez e guarde. Se tiver dúvida na receita, aperte R no NEI. Peça por peça, Herói, a obra vai tomando forma!
    tasks:
      - get: DraconicEvolution:reactorCraftingPart x4
    rewards:
      - xp: 4
      - item: minecraft:iron_block x4

  - id: rotor_interno
    title: "Reactor Stabilizer Inner Rotor"
    type: normal
    deps: [reator_info]
    icon: DraconicEvolution:reactorCraftingPart:1
    desc: |
      Peça de reator, Herói! Misture 3 Awakened Draconium Ingots, um Draconic Core e 2 Draconium Ingots para fazer o Rotor Interno.

      Cada Rotor Assembly pede 2 rotores internos e o Injetor de Energia pede 4: faça §e12§r no total. Planeje com calma, faça tudo de uma vez e guarde. Se tiver dúvida, aperte R no NEI. Peça por peça, o reator vai nascendo!
    tasks:
      - get: DraconicEvolution:reactorCraftingPart:1 x12
    rewards:
      - xp: 4
      - item: DraconicEvolution:draconicCore x2

  - id: rotor_externo
    title: "Reactor Stabilizer Outer Rotor"
    type: normal
    deps: [reator_info]
    icon: DraconicEvolution:reactorCraftingPart:2
    desc: |
      Igual ao interno, mas com 3 diamantes no lugar do Draconium Despertado. Faça §e8§r (2 por montagem de rotor).

      Vale a pena fazer tudo de uma vez, para não precisar voltar à bancada toda hora. Se tiver dúvida na receita, aperte R no NEI. Os diamantes aparecem em abundância aqui, Herói, e o reator agradece!
    tasks:
      - get: DraconicEvolution:reactorCraftingPart:2 x8
    rewards:
      - xp: 4
      - item: minecraft:diamond x4

  - id: montagem_rotor
    title: "Reactor Stabilizer Rotor Assembly"
    type: normal
    deps: [rotor_interno, rotor_externo]
    icon: DraconicEvolution:reactorCraftingPart:3
    desc: |
      Hora de montar o rotor! Misture 2 rotores internos, 2 externos, um Wyvern Core e 2 Draconium Ingots.

      Você precisa de §e4 montagens§r, uma para cada estabilizador. Confira se tem os rotores suficientes antes de começar. Se tiver dúvida na receita, aperte R no NEI. Quase lá, Herói, a engrenagem está girando!
    tasks:
      - get: DraconicEvolution:reactorCraftingPart:3 x4
    rewards:
      - xp: 4
      - item: DraconicEvolution:draconiumIngot x8

  - id: anel_foco
    title: "Reactor Stabilizer Focus Ring"
    type: normal
    deps: [reator_info]
    icon: DraconicEvolution:reactorCraftingPart:4
    desc: |
      Mais uma peça do estabilizador! Misture 4 lingotes de ouro, 4 diamantes e um Wyvern Core. Também §e4§r.

      Um anel para cada estabilizador, então já faça os quatro de uma vez para poupar tempo. Se tiver dúvida na receita, aperte R no NEI. Foco total no reator, Herói!
    tasks:
      - get: DraconicEvolution:reactorCraftingPart:4 x4
    rewards:
      - xp: 4
      - item: minecraft:gold_ingot x8

  - id: estabilizador_reator
    title: "Reactor Stabilizer"
    type: main
    deps: [estrutura_estabilizador, montagem_rotor, anel_foco]
    icon: DraconicEvolution:reactorStabilizer
    desc: |
      Frame + Rotor Assembly + Focus Ring + §5Chaotic Core§r + Draconic Energy Core + 4 Awakened
      Draconium Ingots = um §eReactor Stabilizer§r. São necessários §e4§r (quatro Chaotic Cores!).

      Eles mantêm o campo de contenção e são por onde a energia SAI do reator. §cSe um deles for
      destruído com o reator ligado, o campo cai.§r
    tasks:
      - get: DraconicEvolution:reactorStabilizer x4
    rewards:
      - xp: 10
      - choice: [DraconicEvolution:draconicBlock, DraconicEvolution:awakenedCore, DraconicEvolution:chaosShard]

  - id: injetor_energia
    title: "Reactor Energy Injector"
    type: normal
    deps: [rotor_interno]
    icon: DraconicEvolution:reactorEnergyInjector
    desc: |
      Por onde entra a energia! Misture 4 rotores internos, um Wyvern Core e Draconium para fazer o §eReactor Energy Injector§r.

      É por ele que entra a energia para dar a partida e para manter o campo de contenção. Guarde bem, porque o reator não funciona sem ele. Se tiver dúvida na receita, aperte R no NEI. Quase pronta a parte mecânica, Herói!
    tasks:
      - get: DraconicEvolution:reactorEnergyInjector
    rewards:
      - xp: 5
      - item: minecraft:redstone_block x16

  - id: nucleo_reator
    title: "Draconic Reactor Core"
    type: main
    deps: [nucleo_caotico]
    icon: DraconicEvolution:reactorCore
    desc: |
      A semente da reação! Coloque 4 Awakened Draconium Ingots em cruz com um §eChaos Shard§r no centro.

      O núcleo fica no meio da estrutura e cresce (até o dobro do tamanho) conforme esquenta. Trate com todo o cuidado, porque ele é o coração do reator. Se tiver dúvida na receita, aperte R no NEI ou consulte o Tablet de Informações. Muita responsabilidade, Herói, e eu confio em você!
    tasks:
      - get: DraconicEvolution:reactorCore
    rewards:
      - xp: 8
      - choice: [DraconicEvolution:nugget:1 x18, DraconicEvolution:chaosFragment:2 x2, DraconicEvolution:draconium:2 x2]

  - id: montagem_reator
    title: "Montando o Reator"
    type: info
    deps: [estabilizador_reator, injetor_energia, nucleo_reator, portao_fluxo]
    icon: DraconicEvolution:reactorStabilizer
    desc: |
      §e1.§r Núcleo no centro.
      §e2.§r 4 Estabilizadores em volta, §evirados para o núcleo§r, a até 8 blocos e a pelo menos
      4 blocos de distância (o núcleo cresce!). Não precisa ser um anel horizontal.
      §e3.§r Nada entre os estabilizadores e o núcleo. Clique num estabilizador: se a GUI mostrar
      §a"OFFLINE"§r está tudo certo; §c"INVALID SETUP"§r, reposicione.
      §e4.§r O Injetor num dos dois lados livres.
      §e5.§r §eFlux Gate§r na saída dos estabilizadores e §eoutro§r na entrada do injetor.

      §ePartida:§r coloque até 8 blocos de Awakened Draconium no slot de combustível, aperte
      "Charge", alimente pelo injetor até campo e saturação chegarem a 50% e a temperatura a
      2 000 °C, e então "Activate". Comparadores nos estabilizadores dão leituras externas; com
      OpenComputers dá para ler tudo e desligar remotamente.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: segunda_ilha
    title: "Outra Ilha, Outro Guardião"
    type: optional
    deps: [fragmento_caos]
    icon: DraconicEvolution:chaosShard
    desc: |
      As ilhas se repetem a cada 10 000 blocos, e cada uma tem o seu Guardião e o seu cristal.
      O reator inteiro pede 5 shards (4 Chaotic Cores + o núcleo do reator); mais Chaotic Cores
      para melhorias pedem mais. Junte §e10 Chaos Shards§r se tiver coragem para uma segunda
      ilha.
    tasks:
      - get: DraconicEvolution:chaosShard x10
    rewards:
      - loot: epico

  - id: fragmento_minusculo
    title: "Tiny Chaos Fragment"
    type: optional
    deps: [fragmento_caos]
    icon: DraconicEvolution:chaosFragment
    desc: |
      A menor unidade de Caos! 9 Tiny → 1 Small, 9 Small → 1 Large, 9 Large → 1 Chaos Shard.

      Eles saem do reator quando você retira o combustível convertido. A config dá a cada fragmento minúsculo 16 unidades de combustível convertido. É opcional, mas útil para quem quer reciclar. Se tiver dúvida, aperte R no NEI. Pequenos, mas valiosos, Herói!
    tasks:
      - get: DraconicEvolution:chaosFragment x9
    rewards:
      - loot: incomum

  - id: fragmento_pequeno
    title: "Small Chaos Fragment"
    type: optional
    deps: [fragmento_minusculo]
    icon: DraconicEvolution:chaosFragment:1
    desc: |
      Junte 9 Tiny Chaos Fragments na bancada para fazer um fragmento pequeno.

      É um passo mais perto de um novo Chaos Shard sem precisar enfrentar outro Guardião. É opcional, mas economiza muito esforço. Se tiver dúvida na receita, aperte R no NEI. Que esperteza, Herói!
    tasks:
      - get: DraconicEvolution:chaosFragment:1
    rewards:
      - loot: incomum

  - id: portoes_reator
    title: "Dois Registros de Segurança"
    type: normal
    deps: [portao_fluxo, reator_info]
    icon: DraconicEvolution:flowGate
    desc: |
      O reator exige §e2 Flux Gates§r: um limitando a saída dos estabilizadores e outro controlando a entrada do injetor.

      Sem eles, a energia sai sem freio e o campo não aguenta. Use um Potentiometer em cada um para ajustes finos. Se tiver dúvida na receita, aperte R no NEI. Dois registros de segurança, Herói, e muito cuidado com o reator!
    tasks:
      - get: DraconicEvolution:flowGate x2
    rewards:
      - xp: 4
      - item: DraconicEvolution:potentiometer x2

  - id: combustivel_reator
    title: "Combustível Despertado"
    type: normal
    deps: [reator_info, draconio_despertado]
    icon: DraconicEvolution:draconicBlock
    desc: |
      O reator aceita até §e8 blocos§r de Awakened Draconium (em blocos, lingotes ou pepitas).

      §cQuanto mais combustível, maior a explosão se algo der errado§r: 20 blocos de raio com um lingote, 200 com tudo cheio. Comece pequeno: §e2 blocos§r já é muita energia. Se tiver dúvida, aperte R no NEI. Prudência, Herói!
    tasks:
      - get: ore:blockDraconiumAwakened x2
    rewards:
      - xp: 5
      - item: minecraft:obsidian x16

  - id: reator_computador
    title: "Reator por Controle Remoto"
    type: optional
    deps: [montagem_reator]
    icon: minecraft:comparator
    desc: |
      Encoste um computador do OpenComputers num estabilizador ou no injetor e use
      §egetReactorInfo()§r (temperatura, campo, saturação, conversão, geração...),
      §echargeReactor()§r, §eactivateReactor()§r e §estopReactor()§r. Um script que desliga o
      reator quando o campo cai é o melhor seguro de vida que existe. Comparadores também
      servem: Shift + clique no estabilizador escolhe qual leitura ele envia.
    tasks:
      - check
    rewards:
      - loot: raro

  - id: reator_draconico
    title: "O Reator Dracônico"
    type: milestone
    deps: [montagem_reator, portoes_reator, combustivel_reator]
    icon: DraconicEvolution:reactorCore
    banner: "A Estrela Engarrafada"
    subtitle: "Milhões de RF por tick — com responsabilidade"
    desc: |
      Um núcleo de plasma girando, quatro estabilizadores segurando o campo, Flux Gates
      regulando cada RF... Herói, você engarrafou uma estrela.

      §eLembretes de quem se importa com você:§r
      §e• Mantenha o campo fora do vermelho§r: dar energia a mais é o "modo seguro".
      §e• Desligue em 80–90% de conversão§r e reabasteça.
      §e• Ao desligar, tenha reserva§r (o Núcleo de Energia é perfeito para isso) para segurar o
      campo enquanto a temperatura cai abaixo de 2 000 °C.

      Mostre-me o reator completo: núcleo, 4 estabilizadores, injetor e 2 Flux Gates.
    tasks:
      - get: [DraconicEvolution:reactorCore, DraconicEvolution:reactorStabilizer x4, DraconicEvolution:reactorEnergyInjector, DraconicEvolution:flowGate x2]
    rewards:
      - xp: 12
      - kit: {name: "Kit do Domador de Estrelas", items: [DraconicEvolution:draconicBlock, DraconicEvolution:flowGate x2, DraconicEvolution:potentiometer x2, DraconicEvolution:energyPylon x2]}
      - loot: epico

  - id: mestre_draconico
    title: "Maestria do Volume do Dragão"
    type: milestone
    deps: [reator_draconico, cajado_poder, nucleo_ativo, guardiao_caos]
    icon: DraconicEvolution:chaoticCore
    banner: "Mestre do Dragão"
    subtitle: "O Volume do Dragão está completo"
    desc: |
      Draconium do Fim, núcleos Wyvern, Despertado e Caótico, um Núcleo de Energia de bilhões,
      armadura que voa, o Cajado do Poder, o Guardião do Caos derrotado e um reator que não
      explodiu (ufa!). Herói, o Volume do Dragão inteiro foi reescrito por você.

      Esta página é uma das que sustentam o §5Selo do Abismo§r — e os Awakened Cores que você
      aprendeu a fazer vão brilhar de novo lá na §6Estrela ATM§r.

      Eu estou tão orgulhosa que, se eu tivesse escamas, elas estariam brilhando.
    tasks:
      - get: [DraconicEvolution:chaoticCore, DraconicEvolution:draconicDistructionStaff, DraconicEvolution:draconicChest]
    rewards:
      - xp: 15
      - kit: {name: "Tesouro do Dragão", items: [DraconicEvolution:awakenedCore x2, DraconicEvolution:draconicBlock x2, minecraft:dragon_egg]}
      - loot: lendario
