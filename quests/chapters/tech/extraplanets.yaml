    icon: ExtraPlanets:advancedRefinery
    desc: |
      Foguetes grandes bebem muito combustível, Herói! A §eAdvanced Refinery§r é uma Refinaria do Galacticraft com 2 Zinc Ingots, e refina petróleo mais rápido.
      Se você pretende abastecer vários foguetes, ela vale cada lingote. Monte e deixe funcionando num cantinho da base. Confira a receita no NEI (R) se tiver dúvida. Combustível farto, viagens tranquilas!
    tasks:
      - get: ExtraPlanets:advancedRefinery
    rewards:
      - xp: 4
      - item: GalacticraftCore:item.bucketFuel x2

  - id: refinaria_definitiva
    title: "Ultimate Refinery"
    type: optional
    deps: [refinaria_avancada, ferro_escuro]
    icon: ExtraPlanets:ultimateRefinery
    desc: |
      A refinaria mais rápida do Registro! A §eUltimate Refinery§r é a Advanced Refinery com 2 Dark Iron Ingots.
      É uma missão opcional, Herói, mas excelente para quem abastece foguetes grandes o tempo todo. Confira a receita no NEI (R) e deixe a máquina ligada num lugar seguro da base. Seu estoque de combustível nunca mais vai secar!
    tasks:
      - get: ExtraPlanets:ultimateRefinery
    rewards:
      - loot: raro

  - id: wafers_ep
    title: "Wafers do ExtraPlanets"
    type: normal
    deps: [carbono]
    icon: ExtraPlanets:item.wafer:1
    task_logic: OR
    desc: |
      O Fabricador de Circuitos ganhou novos wafers, Herói: §eDiamond, Carbon, Titanium, Red Gem, Blue Gem e White Gem§r! Eles são usados nos carregadores avançados e nas §eestações espaciais§r dos planetas do ExtraPlanets (o tooltip avisa qual é qual).
      Confira as receitas no NEI (R/U) e faça qualquer um para cumprir a missão. Dica de quem conhece o Registro: guarde os wafers extras, porque as máquinas mais avançadas vão pedir.
    tasks:
      - get: ExtraPlanets:item.wafer
      - get: ExtraPlanets:item.wafer:1
      - get: ExtraPlanets:item.wafer:2
      - get: ExtraPlanets:item.wafer:3
      - get: ExtraPlanets:item.wafer:4
      - get: ExtraPlanets:item.wafer:5
    rewards:
      - xp: 4
      - item: minecraft:diamond x2

  - id: carregador_avancado
    title: "Advanced Fuel Loader"
    type: normal
    deps: [paladio, wafers_ep]
    icon: ExtraPlanets:advancedFuelLoader
    desc: |
      Foguetes grandes têm tanques enormes, e esperar encher é um tédio! O §eAdvanced Fuel Loader§r é um Carregador de Combustível com níquel, paládio e um Carbon Wafer, e enche os tanques mais rápido.
      Separe os materiais, Herói, e confira a receita exata no NEI (R). Lembre que o níquel e o paládio vêm de Júpiter, então a viagem compensa. Bom abastecimento!
    tasks:
      - get: ExtraPlanets:advancedFuelLoader
    rewards:
      - xp: 4
      - item: GalacticraftCore:item.bucketFuel x2

  - id: carregador_definitivo
    title: "Ultimate Fuel Loader"
    type: optional
    deps: [carregador_avancado, tungstenio]
    icon: ExtraPlanets:ultimateFuelLoader
    desc: |
      O carregador mais rápido do pedaço! O §eUltimate Fuel Loader§r leva tungstênio, zinco, um Titanium Wafer e o Advanced Fuel Loader.
      É uma missão opcional, Herói, mas ótima para quem abastece foguetes o tempo todo. Guarde o Advanced Fuel Loader até a hora de montar, e confira os detalhes no NEI (R/U). Abasteça num piscar de olhos!
    tasks:
      - get: ExtraPlanets:ultimateFuelLoader
    rewards:
      - loot: raro

  - id: compressor_oxigenio_avancado
    title: "Advanced Oxygen Compressor"
    type: optional
    deps: [magnesio]
    icon: ExtraPlanets:advancedOxygenCompressor
    desc: |
      Respirar fundo nunca foi tão rápido! O §eAdvanced Oxygen Compressor§r leva 4 Compressores de Oxigênio e 5 Magnesium Ingots, e enche tanques muito mais rápido.
      Também existem a versão Descompressor e as versões §eUltimate§r (com tungstênio). É uma missão opcional, Herói, mas bem útil para quem passa muito tempo no espaço. Confira as receitas no NEI (R/U).
    tasks:
      - get: ExtraPlanets:advancedOxygenCompressor
    rewards:
      - loot: incomum

  - id: compressor_oxigenio_definitivo
    title: "Ultimate Oxygen Compressor"
    type: optional
    deps: [compressor_oxigenio_avancado, tungstenio]
    icon: ExtraPlanets:ultimateOxygenCompressor
    desc: |
      O ar mais rápido do sistema solar! O §eUltimate Oxygen Compressor§r leva 4 Advanced Oxygen Compressors e 5 Tungsten Ingots.
      É uma missão opcional, Herói, mas ideal para bases grandes que precisam de muito oxigênio. Separe os compressores avançados com antecedência e confira a receita completa no NEI (R). Respire à vontade, o Registro está de olho em você!
    tasks:
      - get: ExtraPlanets:ultimateOxygenCompressor
    rewards:
      - loot: raro

  - id: solar_hibrido
    title: "Hybrid Solar Panel"
    type: normal
    deps: [magnesio]
    icon: ExtraPlanets:tile.solar
    desc: |
      Mais energia por painel, Herói! O §eHybrid Solar Panel§r é um Painel Solar Avançado do Galacticraft com 2 Compressed Magnesium.
      Se a sua base vive faminta por energia, este é o upgrade certo. Posicione no sol, de preferência bem alto, e conecte aos seus cabos. Para ver a receita exata, aperte R no NEI. Energia limpa e abundante a caminho!
    tasks:
      - get: ExtraPlanets:tile.solar
    rewards:
      - xp: 4
      - item: ore:waferSolar x9

  - id: solar_definitivo
    title: "Ultimate Solar Panel"
    type: optional
    deps: [solar_hibrido, cristal]
    icon: ExtraPlanets:tile.solar:4
    desc: |
      O painel solar mais forte do Galacticraft no pack! O §eUltimate Solar Panel§r é o Hybrid Solar Panel com 2 Compressed Crystal.
      É uma missão opcional, Herói, mas excelente para bases grandes. Guarde o Hybrid Solar Panel e o cristal prensado até a hora de montar. Confira a receita no NEI (R/U) e deixe o sol trabalhar por você!
    tasks:
      - get: ExtraPlanets:tile.solar:4
    rewards:
      - loot: raro

  - id: baterias_ep
    title: "Baterias Planetárias"
    type: normal
    deps: [paladio, zinco]
    icon: ExtraPlanets:zincBattery
    desc: |
      Cada planeta traz uma bateria, Herói: a §eNickel Battery§r (45 000 gJ, Júpiter), a §eMercury Battery§r (85 000) e a §eZinc Battery§r (125 000, Netuno).
      Para esta missão, faça a de níquel e a de zinco. Elas guardam muito mais energia que as baterias comuns, então valem o esforço. Confira as receitas no NEI (R/U) e separe os metais com antecedência. Energia de sobra!
    tasks:
      - get: [ExtraPlanets:nickelBattery, ExtraPlanets:zincBattery]
    rewards:
      - xp: 4
      - item: minecraft:redstone_block x4

  - id: bateria_avancada_ep
    title: "Advanced Battery"
    type: optional
    deps: [baterias_ep]
    icon: ExtraPlanets:item.advancedBattery
    desc: |
      Uma bateria sólida e simples de fazer! A §eAdvanced Battery§r leva 5 Titânio Prensado, uma Bateria e um Bloco de Desh, e guarda 50 000 gJ.
      É uma missão opcional, Herói, mas serve de base para a Ultimate Battery mais à frente. Confira a receita no NEI (R) e guarde com carinho. Seu estoque de energia agradece!
    tasks:
      - get: ExtraPlanets:item.advancedBattery
    rewards:
      - loot: incomum

  - id: bateria_definitiva_ep
    title: "Ultimate Battery"
    type: optional
    deps: [bateria_avancada_ep, tungstenio, cristal, gema_azul, gema_branca, gema_vermelha]
    icon: ExtraPlanets:item.ultimateBattery
    desc: |
      Um "tour" pelo sistema solar numa bateria só! A §eUltimate Battery§r leva blocos de White Gem, Red Gem, Blue Gem, Carbon, Palladium e Magnesium, lingotes de Tungsten e Zinc e uma Advanced Battery. Ela guarda 200 000 gJ.
      É uma missão opcional, Herói, mas é a prova de que você visitou tudo. Separe com calma e confira a receita no NEI (R/U).
    tasks:
      - get: ExtraPlanets:item.ultimateBattery
    rewards:
      - loot: raro

  - id: macas_especiais
    title: "Maçãs de Metal"
    type: optional
    deps: [mundos_distantes]
    icon: ExtraPlanets:diamondApple
    task_logic: OR
    desc: |
      Hora de um lanchinho para a batalha! O ExtraPlanets tem §eIron Apples§r (8 ferros e uma maçã) e §eDiamond Apples§r (8 diamantes e uma maçã), com versões "Notch" feitas de blocos.
      São ótimas para as lutas contra os chefes, Herói. Esta missão é opcional, mas dá um bom fôlego extra. Confira as receitas no NEI (R/U) e guarde algumas no inventário.
    tasks:
      - get: ExtraPlanets:ironApple
      - get: ExtraPlanets:diamondApple
    rewards:
      - loot: incomum

  - id: comida_enlatada_ep
    title: "Carnes Enlatadas"
    type: optional
    deps: [mundos_distantes]
    icon: ExtraPlanets:cannedFood
    desc: |
      Proteína para a viagem! Uma Lata de Estanho com 2 carnes assadas (porco, peixe, salmão, frango ou filé) vira comida enlatada do ExtraPlanets. Faça §e8§r.
      Comida enlatada dura e alimenta bem, Herói, perfeita para expedições longas pelo espaço. É uma missão opcional, mas prática. Confira a receita no NEI (R) e guarde no inventário. Bom apetite!
    tasks:
      - get: ExtraPlanets:cannedFood:* x8
    rewards:
      - loot: comum

  - id: kit_espacial
    title: "Kit Espacial Completo"
    type: optional
    deps: [traje_termico_t2]
    icon: ExtraPlanets:item.tier2_kit
    task_logic: OR
    desc: |
      Quer se vestir para o espaço num clique só? Os §eKits§r guardam máscara, equipamento, tanques, módulo de frequência, paraquedas e, no Full Kit, o "Protection Kit" com o traje térmico.
      Clique direito para vestir tudo de uma vez, Herói! Faça qualquer Full Kit (Nível 1 a 4). Esta missão é opcional, mas poupa muito tempo. Confira as receitas no NEI (R/U).
    tasks:
      - get: ExtraPlanets:item.tier1_kit
      - get: ExtraPlanets:item.tier2_kit
      - get: ExtraPlanets:item.tier3_kit
      - get: ExtraPlanets:item.tier4_kit
    rewards:
      - loot: incomum

  - id: estacoes_planetarias
    title: "Estações em Outros Planetas"
    type: optional
    deps: [foguete_t4, wafers_ep]
    icon: GalacticraftCore:tile.spaceStationBase
    desc: |
      O ExtraPlanets permite criar §eEstações Espaciais§r em volta de Mercúrio, Vênus, Ceres, Marte,
      Júpiter, Saturno, Urano, Netuno, Plutão, Éris e Kepler 22b (todas ativas na config). Os
      materiais aparecem no Mapa da Galáxia ao selecionar o planeta, e os wafers do ExtraPlanets
      entram nessas receitas. Construa uma estação em qualquer planeta além da Terra.
    tasks:
      - check
    rewards:
      - loot: raro

  - id: cristal_reforcado
    title: "Compressed Reinforced Crystal"
    type: normal
    deps: [cristal]
    icon: ExtraPlanets:tier7Items:6
    desc: |
      Dois Compressed Crystal juntos na Prensa viram §eCompressed Reinforced Crystal§r, o ingrediente da Blindagem Nível 7. Faça §e8§r antes de começar o foguete.
      Já deixe a Prensa e os cristais prontos, Herói, porque a produção toma um tempo. Se esquecer a receita, aperte R no NEI. Organizar antes economiza dor de cabeça depois!
    tasks:
      - get: ExtraPlanets:tier7Items:6 x8
    rewards:
      - xp: 4
      - item: ore:ingotCrystal x8

  - id: pecas_rover_t2
    title: "Rodas e Bateria Nível 2"
    type: optional
    deps: [blindagem_t4, pecas_rover_t1]
    icon: ExtraPlanets:item.electricParts:3
    desc: |
      Para o Venus Rover, as peças também sobem de nível! A §eTier 2 Wheel§r leva 4 Heavy-Duty Plates Nível 4 e uma Tier 1 Wheel. A §eTier 2 Battery§r leva 5 lingotes de chumbo e 4 Heavy-Duty Plates Nível 4.
      É uma missão opcional, Herói. Confira as receitas no NEI (R) e separe os materiais antes de montar. Bom passeio em Vênus!
    tasks:
      - get: [ExtraPlanets:item.electricParts:3 x4, ExtraPlanets:item.electricParts:1]
    rewards:
      - loot: incomum

  - id: cinzas
    title: "Cinzas Vulcânicas"
    type: optional
    deps: [marreta]
    icon: ExtraPlanets:tier4Items:6
    desc: |
      Cinzas vulcânicas, Herói! Com o Sledge Hammer num Ash Block você obtém 2 Ash Shards, e 4 shards formam 1 Ash. Faça §e4§r.
      As cinzas são ingrediente da Fire Bomb, então guarde algumas para quando chegar a hora. Esta missão é opcional e bem tranquila. Se esquecer a receita, aperte R no NEI. Boa coleta!
    tasks:
      - get: ExtraPlanets:tier4Items:6 x4
    rewards:
      - loot: comum

  - id: vilas_planetarias
    title: "Vizinhos Planetários"
    type: optional
    deps: [venus]
    icon: minecraft:emerald
    desc: |
      Que tal bater um papo com os vizinhos? Quase todos os mundos do ExtraPlanets têm §evilas§r (todas ativas na config), de Mercúrio a Éris, passando pelas luas.
      Encontre uma vila fora da Terra, da Lua e de Marte e confirme aqui, Herói. É uma missão opcional e sem item para entregar. Explore com calma, mantenha o traje em dia e boa busca!
    tasks:
      - check
    rewards:
      - loot: incomum

  - id: mares_saturno
    title: "Mares Estranhos"
    type: optional
    deps: [saturno]
    icon: ExtraPlanets:bucket_infected_water
    task_logic: OR
    desc: |
      Saturno tem mares de §eHidrocarboneto Líquido§r e terras com §cÁgua Infectada§r. Encha um balde de qualquer um dos dois, com cuidado.
      É uma missão opcional, Herói, mas curiosa para conhecer o planeta. Leve um balde vazio e proteção, e não beba nada por impulso! Se tiver dúvida sobre o fluido, aperte U no NEI. Boa exploração!
    tasks:
      - get: ExtraPlanets:bucket_infected_water
      - get: ExtraPlanets:bucket_liquid_hydrocarbon
    rewards:
      - loot: comum

  - id: metano_tita
    title: "Os Lagos de Titã"
    type: optional
    deps: [tita]
    icon: ExtraPlanets:bucket_methane
    desc: |
      Titã tem mares e colinas de §eMetano Líquido§r. Encha um balde: é a mesma molécula que o Sintetizador de Metano de Marte fabrica.
      É uma missão opcional e tranquila, Herói, perfeita para uma passada rápida pela lua. Leve um balde vazio, pouse com cuidado e traga o metano de volta. Para ver outros usos, aperte U no NEI. Boa coleta!
    tasks:
      - get: ExtraPlanets:bucket_methane
    rewards:
      - loot: comum

  - id: nitrogenio_congelado
    title: "Nitrogênio Congelado"
    type: optional
    deps: [urano]
    icon: ExtraPlanets:frozenNitrogen
    task_logic: OR
    desc: |
      Os mundos gelados guardam fluidos estranhos, Herói: §eNitrogênio Líquido§r e §eÁgua Congelada§r. Um balde de nitrogênio na bancada vira 2 blocos de Frozen Nitrogen.
      Traga um balde de qualquer um deles para cumprir a missão. É opcional e tranquila. Leve um balde vazio e o traje térmico, e confira o NEI (R/U) para ver outros usos. Boa coleta!
    tasks:
      - get: ExtraPlanets:bucket_nitrogen
      - get: ExtraPlanets:bucket_frozen_water
    rewards:
      - loot: comum

  - id: evoluidos_quentes
    title: "Evoluídos do Fogo"
    type: optional
    deps: [venus]
    icon: minecraft:blaze_rod
    task_logic: OR
    desc: |
      Os mundos quentes do ExtraPlanets têm suas próprias criaturas evoluídas: §eBlazes§r e §eCubos de Magma§r Evoluídos. Derrote 3 de cada (a config deixa todos ligados).
      São inimigos mais fortes que os comuns, Herói, então leve armadura boa e Resistência ao Fogo. É uma missão opcional, mas rende uma boa experiência de combate. Boa caçada!
    tasks:
      - kill: {entity: "extraplanets.EvolvedBlaze", count: 3}
      - kill: {entity: "extraplanets.EvolvedMagmaCube", count: 3}
    rewards:
      - loot: comum

  - id: evoluidos_gelados
    title: "Evoluídos do Gelo"
    type: optional
    deps: [urano]
    icon: minecraft:snowball
    task_logic: OR
    desc: |
      Nos mundos gelados aparecem §eSlimes de Gelo§r e §eCreepers Azuis§r Evoluídos. Derrote 3 de cada.
      São inimigos mais fortes que os comuns, Herói, então mantenha distância dos Creepers e leve armadura de qualidade. É uma missão opcional, mas rende uma boa experiência de combate. Cuidado com o frio e com as explosões. Boa caçada!
    tasks:
      - kill: {entity: "extraplanets.EvolvedIceSlime", count: 3}
      - kill: {entity: "extraplanets.EvolvedBlueCreeper", count: 3}
    rewards:
      - loot: comum

  - id: evoluidos_estranhos
    title: "Bestiário Planetário"
    type: optional
    deps: [jupiter]
    icon: minecraft:spider_eye
    task_logic: OR
    desc: |
      Endermen e Mini-Endermen Evoluídos, Aranhas Gigantes, Bruxas, Esqueletos Poderosos e Creepers Vermelhos: o ExtraPlanets tem um zoológico inteiro!
      Derrote 3 de cada espécie que cobre a missão. Em caso de dúvida sobre quais valem, olhe a lista da quest. É opcional, Herói, mas rende ótimo treino de combate. Leve armadura boa e boa caçada!
    tasks:
      - kill: {entity: "extraplanets.EvolvedEnderman", count: 3}
      - kill: {entity: "extraplanets.EvolvedMiniEnderman", count: 3}
      - kill: {entity: "extraplanets.EvolvedGiantSpider", count: 3}
      - kill: {entity: "extraplanets.EvolvedWitch", count: 3}
      - kill: {entity: "extraplanets.EvolvedPowerSkeleton", count: 3}
      - kill: {entity: "extraplanets.EvolvedRedCreeper", count: 3}
    rewards:
      - loot: comum

  # ======================================================================
  # FERRAMENTAS E ARMADURAS PLANETÁRIAS
  # ======================================================================
  - id: equip_mercurio_carbono
    title: "Equipamento de Mercúrio e Carbono"
    type: optional
    deps: [carbono, mercurio_metal]
    icon: ExtraPlanets:carbonPickaxe
    task_logic: OR
    desc: |
      Cada metal novo tem ferramentas e armadura completas, Herói! As de Carbono são leves; as de Mercúrio, mais duráveis.
      Faça uma peça qualquer de uma das duas linhas para cumprir a missão. É opcional, mas um equipamento melhor ajuda muito nos próximos planetas. Confira as receitas no NEI (R/U) e escolha a que mais combina com o seu estilo. Boa forja!
    tasks:
      - one_of: [ExtraPlanets:carbonPickaxe, ExtraPlanets:carbonSword, ExtraPlanets:carbonChest]
      - one_of: [ExtraPlanets:mercuryPickaxe, ExtraPlanets:mercurySword, ExtraPlanets:mercuryChest]
    rewards:
      - loot: incomum

  - id: equip_uranio
    title: "Equipamento de Urânio"
    type: optional
    deps: [uranio_ceres]
    icon: ExtraPlanets:uraniumPickaxe
    desc: |
      Ferramentas e armadura de Urânio, feitas com o metal de Ceres! Faça uma peça.
      É uma missão opcional, Herói, mas equipamento novo sempre ajuda a explorar com mais segurança. Escolha entre picareta, espada ou peitoral e confira a receita no NEI (R/U). Cuidado com a radiação nos mods que a simulam. Boa forja!
    tasks:
      - one_of: [ExtraPlanets:uraniumPickaxe, ExtraPlanets:uraniumSword, ExtraPlanets:uraniumChest]
    rewards:
      - loot: incomum

  - id: equip_jupiter
    title: "Equipamento Joviano"
    type: optional
    deps: [paladio, gema_vermelha]
    icon: ExtraPlanets:redGemPickaxe
    task_logic: OR
    desc: |
      Paládio e Red Gem dão duas linhas de equipamento, Herói! Faça uma peça de qualquer uma delas.
      É uma missão opcional, mas ferramentas e armaduras melhores fazem diferença nas viagens longas. Escolha a que preferir e confira as receitas no NEI (R/U). Os metais e as gemas vêm de Júpiter, então a viagem compensa. Boa forja!
    tasks:
      - one_of: [ExtraPlanets:palladiumPickaxe, ExtraPlanets:palladiumSword, ExtraPlanets:palladiumChest]
      - one_of: [ExtraPlanets:redGemPickaxe, ExtraPlanets:redGemSword, ExtraPlanets:redGemChest]
    rewards:
      - loot: incomum

  - id: equip_magnesio
    title: "Equipamento de Magnésio"
    type: optional
    deps: [magnesio]
    icon: ExtraPlanets:magnesiumPickaxe
    desc: |
      O magnésio de Saturno também vira ferramentas e armadura, Herói! Faça uma peça, escolhendo entre picareta, espada ou peitoral.
      É uma missão opcional, mas equipamento novo sempre ajuda nas próximas viagens. Confira a receita no NEI (R/U) e aproveite o magnésio que sobrou da blindagem. Boa forja, e que o frio de Saturno não te alcance!
    tasks:
      - one_of: [ExtraPlanets:magnesiumPickaxe, ExtraPlanets:magnesiumSword, ExtraPlanets:magnesiumChest]
    rewards:
      - loot: incomum

  - id: equip_urano
    title: "Equipamento de Urano"
    type: optional
    deps: [cristal, gema_branca]
    icon: ExtraPlanets:crystalPickaxe
    task_logic: OR
    desc: |
      Crystal e White Gem: duas linhas de equipamento geladas e muito duráveis! Faça uma peça de qualquer uma delas, Herói.
      É uma missão opcional, mas equipamento forte ajuda muito contra os chefes de Netuno e Plutão. Confira as receitas no NEI (R/U) e escolha a linha que mais combina com você. Boa forja, e que o frio de Urano não te alcance!
    tasks:
      - one_of: [ExtraPlanets:crystalPickaxe, ExtraPlanets:crystalSword, ExtraPlanets:crystalChest]
      - one_of: [ExtraPlanets:whiteGemPickaxe, ExtraPlanets:whiteGemSword, ExtraPlanets:whiteGemChest]
    rewards:
      - loot: incomum

  - id: equip_netuno
    title: "Equipamento de Netuno"
    type: optional
    deps: [zinco, gema_azul]
    icon: ExtraPlanets:blueGemPickaxe
    task_logic: OR
    desc: |
      Zinc e Blue Gem! As armaduras de zinco e de gema azul estão entre as mais duráveis do mod, Herói. Faça uma peça de qualquer uma das duas linhas.
      É uma missão opcional, mas vale muito para encarar os chefes de Plutão e Éris. Confira as receitas no NEI (R/U) e escolha o que combina mais com você. Boa forja!
    tasks:
      - one_of: [ExtraPlanets:zincPickaxe, ExtraPlanets:zincSword, ExtraPlanets:zincChest]
      - one_of: [ExtraPlanets:blueGemPickaxe, ExtraPlanets:blueGemSword, ExtraPlanets:blueGemChest]
    rewards:
      - loot: incomum

  - id: equip_tungstenio
    title: "Equipamento de Tungstênio"
    type: optional
    deps: [tungstenio]
    icon: ExtraPlanets:tungstenPickaxe
    desc: |
      A armadura de tungstênio é a mais durável do ExtraPlanets, Herói! Faça uma peça: picareta, espada ou peitoral.
      É uma missão opcional, mas ótima para quem enfrenta os chefes finais. O tungstênio exige bastante lingote, então confira a receita no NEI (R/U) e organize o estoque antes de começar. Boa forja, e que nada te derrube!
    tasks:
      - one_of: [ExtraPlanets:tungstenPickaxe, ExtraPlanets:tungstenSword, ExtraPlanets:tungstenChest]
    rewards:
      - loot: incomum

  - id: equip_kepler
    title: "Equipamento de Diamante Colorido"
    type: optional
    deps: [diamantes_coloridos]
    icon: ExtraPlanets:blueDiamondPickaxe
    desc: |
      Cada diamante colorido de Kepler 22b tem uma linha completa de ferramentas, as mais duráveis do mod! Faça uma picareta de qualquer cor, Herói.
      É uma missão opcional, mas uma bela recompensa para quem chegou tão longe. Escolha a cor que mais gostar e confira a receita no NEI (R/U). Boa forja, e aproveite o brilho!
    tasks:
