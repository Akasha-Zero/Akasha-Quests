    banner: "Os Gigantes Gasosos"
    subtitle: "Júpiter e Saturno conquistados"
    desc: |
      Relâmpagos de Júpiter, anéis de Saturno e dois chefes a menos. Herói, você já viajou mais longe
      do que qualquer página do Registro imaginava!

      Daqui em diante, o frio manda: Urano, Netuno, Plutão e Éris pedem o Traje Térmico Nível 4.
