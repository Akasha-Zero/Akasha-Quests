chapter:
  id: extraplanets
  title: "ExtraPlanets"
  prefix: ""
  order: 391
  icon: ExtraPlanets:itemTier4Rocket
  desc: |
    §bO Volume dos Mundos Distantes.§r De Vênus a Kepler 22b: foguetes Nível 4 a 10, trajes
    térmicos, sete chefes de calabouço, luas geladas e metais que não existem na Terra.
    (ExtraPlanets 2.1.4 — requer o capítulo do Galacticraft)

quests:
  # ======================================================================
  # FASE 0 — ALÉM DOS ASTEROIDES
  # ======================================================================
  - link: galacticraft:foguete_t3

  - id: mundos_distantes
    title: "Mundos Distantes"
    type: info
    icon: ExtraPlanets:itemTier4Rocket
    desc: |
      O Galacticraft leva você até os Asteroides. O §bExtraPlanets§r leva até a borda do sistema
      solar — e além.

      §eA escada dos foguetes (Mapa da Galáxia):§r
      §e• Nível 2:§r Fobos e Deimos (luas de Marte).
      §e• Nível 3:§r Vênus.
      §e• Nível 4:§r Mercúrio, Ceres, Júpiter e as luas Io, Europa, Ganimedes e Calisto.
      §e• Nível 5:§r Saturno, Titã, Reia e Oberon.
      §e• Nível 6:§r Urano, Titânia e Jápeto.
      §e• Nível 7:§r Netuno e Tritão. §e• Nível 8:§r Plutão. §e• Nível 9:§r Éris.
      §e• Nível 10:§r Kepler 22b, em outro sistema estelar.

      Cada planeta principal (Vênus, Júpiter, Saturno, Urano, Netuno, Plutão e Éris) tem um
      §ccalabouço com chefe§r. A chave do chefe abre o baú com o §eesquemático do próximo
      foguete§r. Os sete chefes fazem parte do §5Selo das Estrelas§r.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: termico_info
    title: "§cCalor e Frio Extremos"
    type: info
    deps: [mundos_distantes]
    icon: ExtraPlanets:item.tier2ThermalPadding:1
    desc: |
      Os trajes térmicos do Galacticraft não aguentam o sistema solar exterior. O ExtraPlanets
      traz três novos níveis (as peças vão nos mesmos espaços térmicos do inventário do
      Galacticraft):

      §e• Traje Térmico Nível 2:§r necessário em §eVênus e Mercúrio§r (calor).
      §e• Traje Térmico Nível 3:§r §eJúpiter, Saturno e suas luas§r.
      §e• Traje Térmico Nível 4:§r §eUrano, Netuno, Plutão, Éris e suas luas§r (frio extremo).

      Sem o traje certo a sua temperatura dispara ou despenca até causar dano. Dentro de ar
      respirável ela volta ao normal.

      §aDica:§r os §eKits§r do ExtraPlanets (clique direito para vestir) guardam todo o
      equipamento — máscara, equipamento, tanques, paraquedas, módulo de frequência e traje —
      num único item.
    tasks:
      - check
    rewards:
      - xp: 3

  # ======================================================================
  # FASE 1 — AS LUAS DE MARTE (NÍVEL 2)
  # ======================================================================
  - id: fobos
    title: "Fobos"
    type: normal
    deps: [mundos_distantes]
    deps_hidden: [galacticraft:foguete_t2]
    icon: ExtraPlanets:tile.phobos:2
    desc: |
      Primeira parada depois de Marte, Herói: Fobos, a maior lua marciana! Vá de §eFoguete Nível 2§r e leve o traje térmico do Galacticraft, porque é uma pedra cinza, fria e sem ar.
      Por lá tem minérios comuns e o §eMinério de Chumbo§r, a matéria-prima das baterias dos rovers. Pouse, dê uma olhada em volta e minere à vontade. Se precisar lembrar a receita do foguete, o NEI (R/U) ajuda.
    tasks:
      - visit: {dim: -33, name: "Fobos"}
    rewards:
      - xp: 5
      - loot: raro

  - id: deimos
    title: "Deimos"
    type: normal
    deps: [mundos_distantes]
    deps_hidden: [galacticraft:foguete_t2]
    icon: ExtraPlanets:tile.deimos:2
    desc: |
      Fobos tem uma irmã menor, e ela está esperando por você! Deimos também pede apenas o Foguete Nível 2, também é fria (leve o traje térmico) e também esconde §eMinério de Chumbo§r.
      É uma visita rápida e rende o mesmo tesouro. Pouse, minere o que precisar e volte com o inventário recheado. Vale lembrar que lá não tem ar, então confira o oxigênio antes de sair da nave.
    tasks:
      - visit: {dim: -35, name: "Deimos"}
    rewards:
      - xp: 5
      - loot: raro

  - id: chumbo_luas
    title: "Chumbo das Luas"
    type: normal
    deps: [fobos, deimos]
    deps_any: true
    icon: ExtraPlanets:tile.phobos:6
    desc: |
      Hora de transformar pedra em energia! Os Minérios de Chumbo de Fobos e Deimos fundem em lingotes de chumbo comuns, e você vai precisar de §e16§r deles.
      A conta é simples: as Baterias Nível 1 e 2 dos rovers pedem 5 lingotes cada, e sobra um pouquinho para outras receitas. Use a fornalha que preferir e guarde tudo em um baú. Dúvida sobre outro uso do chumbo? Aperte U no NEI.
    tasks:
      - get: ore:ingotLead x16
    rewards:
      - xp: 4
      - item: ore:ingotTin x8

  # ---- Mars Rover ----
  - id: esquematico_mars_rover
    title: "Esquemático: Mars Rover"
    type: normal
    deps: [mundos_distantes]
    icon: ExtraPlanets:item.schematicMarsRover
    desc: |
      Quer passear por Marte sem gastar combustível? Então precisa do esquemático certo! O ExtraPlanets espalhou o esquemático do §eMars Rover§r pelos §ebaús dos calabouços lunares§r, junto dos esquemáticos do Galacticraft.
      Se ele apareceu no seu baú, é só destravar na Bancada NASA. Não veio? Explore mais um calabouço e abra os baús com calma. Eu torço por você, Herói!
    tasks:
      - get: ExtraPlanets:item.schematicMarsRover
    rewards:
      - xp: 4
      - item: GalacticraftCore:item.buggymat x2

  - id: pecas_rover_t1
    title: "Rodas e Bateria Nível 1"
    type: normal
    deps: [esquematico_mars_rover, chumbo_luas]
    icon: ExtraPlanets:item.electricParts:2
    desc: |
      O Mars Rover é elétrico, então esqueça o combustível! Ele pede duas peças. A §eTier 1 Wheel§r leva 4 Blindagens Pesadas e uma Roda de Buggy. A §eTier 1 Battery§r leva 5 lingotes de chumbo e 4 Blindagens Pesadas.
      Separe o material com carinho, porque as blindagens somem rápido. Se algo estiver faltando na receita, confira no NEI (R) como cada peça é montada. Falta pouco para o seu rover!
    tasks:
      - get: [ExtraPlanets:item.electricParts:2 x4, ExtraPlanets:item.electricParts]
    rewards:
      - xp: 4
      - item: GalacticraftCore:item.heavyPlating x4

  - id: mars_rover
    title: "Mars Rover"
    type: optional
    deps: [pecas_rover_t1]
    icon: ExtraPlanets:item.marsRover
    desc: |
      Chegou a hora de rodar por Marte sem gastar uma gota de combustível! Monte o §eMars Rover§r na Bancada NASA e saia explorando.
      A bateria dele recarrega numa §eVehicle Charging Pad§r (5×5) com um §eVehicle Charger§r encostado. Esta missão é opcional, mas é muito divertida, e passear de rover é bem mais prático do que ir a pé. Boa viagem, Herói, e não esqueça de recarregar!
    tasks:
      - get: ExtraPlanets:item.marsRover:*
    rewards:
      - loot: incomum

  - id: carregador_veiculos
    title: "Vehicle Charger"
    type: optional
    deps: [mars_rover]
    icon: ExtraPlanets:chargingBlock
    desc: |
      Todo rover precisa de uma tomada, Herói! A §eVehicle Charging Pad§r é feita com 3 Blocos de Desh e 3 Barras de Desh, que rendem 5 blocos. Como a pista é um quadrado §e5×5§r (25 blocos), faça a receita as vezes necessárias.
      O §eVehicle Charger§r leva 6 Barras de Desh e 3 Baterias, e precisa ficar encostado na pista. Opcional, mas essencial para quem curte rover. Confira os detalhes no NEI.
    tasks:
      - get: [ExtraPlanets:tile.advancedLaunchPad:2 x25, ExtraPlanets:chargingBlock]
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 2 — VÊNUS (NÍVEL 3)
  # ======================================================================
  - id: tecido_termico_t2
    title: "Tier 2 Thermal Cloth"
    type: main
    deps: [termico_info]
    icon: ExtraPlanets:item.thermalCloth
    desc: |
      Vênus e Mercúrio são quentes demais para qualquer roupa comum! O primeiro passo é o §eTier 2 Thermal Cloth§r, feito com 3 Desh Prensado e 2 Tecidos Térmicos do Galacticraft.
      As 4 peças do traje (elmo, peitoral, perneiras e botas) pedem muito tecido, então faça §e20§r de uma vez. Dá trabalho, mas é um passo obrigatório. Cuide do estoque de Desh e capriche, Herói!
    tasks:
      - get: ExtraPlanets:item.thermalCloth x20
    rewards:
      - xp: 6
      - choice: [ore:compressedDesh x6, GalacticraftMars:item.itemBasicAsteroids:7 x8, minecraft:wool x16]

  - id: traje_termico_t2
    title: "Traje Térmico Nível 2"
    type: main
    deps: [tecido_termico_t2]
    icon: ExtraPlanets:item.tier2ThermalPadding:1
    desc: |
      Seu traje de proteção contra o calor está quase pronto! Monte as quatro peças do §eTier 2 Thermal Padding§r: elmo, peitoral, perneiras e botas. O elmo, por exemplo, leva 5 tecidos de Nível 2 e um Desh Prensado.
      Ele é obrigatório em §eVênus e Mercúrio§r, então não tente passar sem ele. Se tiver dúvida sobre as demais peças, o NEI (R/U) mostra cada receita. Vista tudo e prepare-se para o calor!
    tasks:
      - get: [ExtraPlanets:item.tier2ThermalPadding, ExtraPlanets:item.tier2ThermalPadding:1, ExtraPlanets:item.tier2ThermalPadding:2, ExtraPlanets:item.tier2ThermalPadding:3]
    rewards:
      - xp: 6
      - choice: [GalacticraftCore:item.oxygenTankHeavyFull, ore:compressedDesh x6, ExtraPlanets:item.thermalCloth x4]

  - id: venus
    title: "Vênus"
    type: portal
    deps: [traje_termico_t2]
    deps_hidden: [galacticraft:foguete_t3]
    icon: ExtraPlanets:tile.venus
    banner: "O Planeta Escaldante"
    subtitle: "Chegada a Vênus"
    effect: 3
    desc: |
      Uma estufa do tamanho de um planeta, Herói: calor que derrete, céu amarelado e §evulcões§r (ativos na config). Vênus pede o Foguete Nível 3 e o Traje Térmico Nível 2.

      O que tem aqui: Minério de Carbono (o metal dos foguetes Nível 4), Rocha Vulcânica, blocos de cinza, minérios comuns e o §cCalabouço de Vênus§r, com o primeiro chefe do ExtraPlanets. Confira o NEI (R/U) para as receitas do equipamento. Depois de tantas viagens espaciais, este planeta é mais um passo na sua jornada. Leve oxigênio sobrando e boa exploração!
    tasks:
      - visit: {dim: -14, name: "Vênus"}
    rewards:
      - xp: 10
      - loot: epico

  - id: carbono
    title: "Carbono"
    type: main
    deps: [venus]
    icon: ExtraPlanets:tile.venus:6
    desc: |
      Um material novo entra em cena, Herói: o carbono! Funda o §eCarbon Ore§r para obter §eCarbon Ingot§r. Se preferir, use o minério com Pó de Pyrotheum na bancada.
      Junte §e24§r, porque esse metal vai virar blindagem, motores e tecidos térmicos mais adiante. Vale juntar tudo de uma vez para não precisar voltar a minerar. Ficou na dúvida? Confira no NEI (R/U).
    tasks:
      - get: ore:ingotCarbon x24
    rewards:
      - xp: 6
      - choice: [ExtraPlanets:tile.venus:6 x6, ore:compressedDesh x4, minecraft:coal_block x6]

  - id: carbono_prensado
    title: "Compressed Carbon"
    type: main
    deps: [carbono]
    icon: ExtraPlanets:tier4Items:4
    desc: |
      Hora de usar a Prensa! Dois Carbon Ingots viram um §eCompressed Carbon§r, e esse material é muito versátil. Ele faz a Blindagem Nível 4, os Motores Auxiliares Nível 4 e o Tecido Térmico Nível 3.
      Faça §e16§r para não faltar depois. Se a Prensa ainda estiver livre, aproveite e deixe várias unidades prontas no baú. Seu foguete mais forte começa aqui, Herói!
    tasks:
      - get: ExtraPlanets:tier4Items:4 x16
    rewards:
      - xp: 6
      - choice: [ore:ingotCarbon x8, GalacticraftMars:item.itemBasicAsteroids x4, ore:compressedTitanium x4]

  - id: rocha_vulcanica
    title: "Rocha Vulcânica"
    type: normal
    deps: [venus]
    icon: ExtraPlanets:volcanicRock
    desc: |
      Vulcões podem ser perigosos, mas esconderem tesouros! A §eVolcanic Rock§r funde em §eVolcanic Ingot§r, e você precisa de §e8§r unidades da rocha.
      Com os lingotes você faz o §eSledge Hammer§r: 3 lingotes vulcânicos, 2 Barras de Ferro Meteórico e 2 gravetos. Cuidado com a lava na hora de minerar, Herói! Para conferir outras receitas com esse material, use R ou U no NEI.
    tasks:
      - get: ExtraPlanets:tier4Items:11 x8
    rewards:
      - xp: 4
      - item: GalacticraftCore:item.meteoricIronIngot x4

  - id: marreta
    title: "Sledge Hammer"
    type: normal
    deps: [rocha_vulcanica]
    icon: ExtraPlanets:tier4Items:8
    desc: |
      Que tal uma ferramenta que bate forte? O §eSledge Hammer§r é uma marreta de bancada. Com um §eAsh Block§r ela rende 2 §eAsh Shards§r, e 4 shards formam 1 Ash.
      Também é ingrediente do Grinding Wheel, o próximo passo. Guarde ela com cuidado, porque ela é peça-chave de um bom pedaço da cadeia. Se esquecer a receita, o NEI (R) mostra num instante.
    tasks:
      - get: ExtraPlanets:tier4Items:8
    rewards:
      - xp: 3
      - item: ExtraPlanets:ashBlock x8

  - id: rebolo
    title: "Grinding Wheel"
    type: optional
    deps: [marreta]
    icon: ExtraPlanets:tier4Items:9
    desc: |
      Um rebolo para moer o que for preciso! O §eGrinding Wheel§r leva 4 Volcanic Ingots, 4 Ash Shards e o Sledge Hammer.
      Com 5 lingotes vulcânicos ele faz 2 Volcanic Shards. Com 5 Magnesium Ingots, faz 2 Magnesium Shards, que vão na Fire Bomb. Esta missão é opcional, mas abre portas para receitas explosivas. Confira os detalhes no NEI (R/U), Herói!
    tasks:
      - get: ExtraPlanets:tier4Items:9
    rewards:
      - loot: comum

  - id: bomba_fogo
    title: "Fire Bomb"
    type: optional
    deps: [rebolo]
    icon: ExtraPlanets:fireBomb
    desc: |
      Gosta de fogo? Esta é a Fire Bomb! Ela leva cinzas, areia, um lingote e um estilhaço vulcânico e um Magnesium Shard, e espalha chamas por toda parte.
      §cUse longe de qualquer coisa que você ame.§r Nada de testar perto de casa ou de baús, combinado? É uma missão opcional e bem divertida. Se faltar algum ingrediente, o NEI (R) mostra a receita certinha.
    tasks:
      - get: ExtraPlanets:fireBomb
    rewards:
      - loot: incomum

  - id: calabouco_venus
    title: "O Calabouço de Vênus"
    type: normal
    deps: [venus]
    icon: ExtraPlanets:veunsDungeonBrick
    desc: |
      Vênus guarda um segredo, Herói! Como os calabouços da Lua e de Marte, o de Vênus fica escondido e é feito de §eVenus Dungeon Brick§r.
      No fundo mora o primeiro chefe do ExtraPlanets. Ache o calabouço, enfrente o que aparecer e pegue alguns tijolos como prova. Leve armadura boa e paciência, porque o caminho é longo. Eu acredito em você!
    tasks:
      - get: ExtraPlanets:veunsDungeonBrick x8
    rewards:
      - xp: 4
      - item: minecraft:arrow x32

  - id: chefe_venus
    title: "O Cubo de Magma Evoluído"
    type: boss
    deps: [calabouco_venus]
    icon: minecraft:magma_cream
    banner: "Vênus Respira Aliviada"
    subtitle: "O Cubo de Magma-Chefe caiu"
    desc: |
      O guardião de Vênus é um §cCubo de Magma Evoluído§r gigante: pula, esmaga e se divide em
      pedaços menores. §cO calor é tanto quanto o do planeta§r — traje térmico, Resistência ao Fogo
      e muita vida extra.

      Derrotado, ele deixa a §eTier 4 Dungeon Key§r. Primeiro chefe do ExtraPlanets no §5Selo das
      Estrelas§r!
    tasks:
      - kill: {entity: "extraplanets.EvolvedMagmaCubeBoss", count: 1}
      - get: ExtraPlanets:T4key
    rewards:
      - xp: 15
      - loot: [epico, epico]

  - id: tesouro_venus
    title: "Esquemático: Foguete Nível 4"
    type: main
    deps: [chefe_venus]
    icon: ExtraPlanets:schematicTier4
    desc: |
      Que sensação boa, Herói: a chave abre o §eTier 4 Treasure Chest§r! Dentro dele está o esquemático do §eFoguete Nível 4§r, e ele pode trazer também o do §eVenus Rover§r.
      Destrave os esquemáticos na Bancada NASA e prepare o próximo salto. Não deixe de guardar a chave com cuidado até chegar ao baú, e se perdeu a receita de algo, o NEI (R/U) ajuda.
    tasks:
      - get: ExtraPlanets:schematicTier4
    rewards:
      - xp: 8
      - choice: [ExtraPlanets:tier4Items:4 x6, ore:ingotCarbon x12, GalacticraftMars:item.itemBasicAsteroids x6]

  - id: venus_rover
    title: "Venus Rover"
    type: optional
    deps: [tesouro_venus, pecas_rover_t1]
    icon: ExtraPlanets:item.venusRover
    desc: |
      Com o esquemático do Venus Rover em mãos, monte o irmão mais forte do Mars Rover! Ele usa §eTier 2 Wheels§r (4 Blindagens Nível 4 + Tier 1 Wheel) e a §eTier 2 Battery§r (5 lingotes de chumbo + 4 Blindagens Nível 4).
      Missão opcional, mas rodar por Vênus de rover é bem mais divertido. Confira as receitas no NEI (R) e bom passeio!
    tasks:
      - get: ExtraPlanets:item.venusRover:*
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 3 — O FOGUETE NÍVEL 4
  # ======================================================================
  - id: blindagem_t4
    title: "Heavy-Duty Plate Nível 4"
    type: main
    deps: [tesouro_venus, carbono_prensado]
    icon: ExtraPlanets:tier4Items:3
    desc: |
      Chegou a hora de reforçar tudo, Herói! Na Prensa: §eBlindagem Pesada Nível 3 (Galacticraft) + Compressed Carbon = Heavy-Duty Plate Nível 4§r.
      A regra se repete daqui até o Nível 10: cada blindagem nova é a anterior mais o metal prensado do planeta da vez. Entender esse padrão economiza muito tempo. Faça §e20§r placas e guarde bem, porque o foguete e o resto do equipamento vão consumir tudo.
    tasks:
      - get: ExtraPlanets:tier4Items:3 x20
    rewards:
      - xp: 6
      - choice: [ExtraPlanets:tier4Items:4 x6, GalacticraftMars:item.itemBasicAsteroids x6, ore:compressedDesh x6]

  - id: pecas_t4
    title: "Peças do Foguete Nível 4"
    type: main
    deps: [blindagem_t4]
    icon: ExtraPlanets:tier4Items
    desc: |
      Todas as peças seguem o mesmo molde do Galacticraft, com as blindagens novas:
      §e• Tier 4 Nose Cone:§r 3 blindagens + Tocha de Redstone.
      §e• Tier 4 Rocket Engine:§r 4 blindagens, Lata de Estanho, Respirador, Isqueiro e Botão.
      §e• Tier 4 Booster:§r 4 Compressed Carbon, Lã Laranja, Lata de Combustível Cheia, 2
      blindagens e Respirador.
      §e• Tier 4 Rocket Fins:§r 2 Blindagens Pesadas comuns + 4 blindagens Nível 4.
      Confira as quantidades exatas do foguete na Bancada NASA.
    tasks:
      - get: [ExtraPlanets:noseConeTier4, ExtraPlanets:tier4Items, ExtraPlanets:tier4Items:1 x2, ExtraPlanets:tier4Items:2 x4]
    rewards:
      - xp: 6
      - choice: [GalacticraftCore:item.bucketFuel x3, ExtraPlanets:tier4Items:3 x4, GalacticraftCore:item.airVent x4]

  - id: plataforma_t2
    title: "Tier 2 Rocket Launch Pad"
    type: main
    deps: [tesouro_venus]
    icon: ExtraPlanets:tile.advancedLaunchPad
    desc: |
      Foguetes Nível 4 a 8 são grandes demais para a base 3×3. A §eTier 2 Rocket Launch Pad§r
      (3 Blocks of Titanium + 3 Barras de Titânio rendem 5) forma um quadrado §e5×5§r — ou seja,
      §e25 blocos§r. Cada Block of Titanium são 9 barras de titânio dos Asteroides.
    tasks:
      - get: ExtraPlanets:tile.advancedLaunchPad x25
    rewards:
      - xp: 6
      - choice: [ore:ingotTitanium x12, ExtraPlanets:tile.venus:9 x2, ore:compressedTitanium x6]

  - id: foguete_t4
    title: "Foguete Nível 4"
    type: main
    deps: [pecas_t4, plataforma_t2]
    icon: ExtraPlanets:itemTier4Rocket
    desc: |
      Seu foguete mais ambicioso até agora! Monte o §eFoguete Nível 4§r na Bancada NASA. Ele abre §eMercúrio, Ceres, Júpiter§r e as quatro grandes luas de Júpiter.
      Lance-o da plataforma 5×5, Herói, e confira se o combustível e o oxigênio estão em dia antes da decolagem. Se alguma peça faltar, o NEI (R/U) mostra cada receita. Contagem regressiva: 3, 2, 1... decolar!
    tasks:
      - get: ExtraPlanets:itemTier4Rocket:*
    rewards:
      - xp: 8
      - choice: [GalacticraftCore:item.bucketFuel x4, ExtraPlanets:tier4Items:3 x6, ExtraPlanets:tier4Items:4 x6]

  # ======================================================================
  # FASE 4 — MERCÚRIO E CERES (NÍVEL 4)
  # ======================================================================
  - id: mercurio
    title: "Mercúrio"
    type: portal
    deps: [foguete_t4, traje_termico_t2]
    icon: ExtraPlanets:tile.mercury
    banner: "Colado no Sol"
    subtitle: "Chegada a Mercúrio"
    desc: |
      O planeta mais perto do Sol: pequeno, quente e sem ar! Para chegar lá, você precisa do §eFoguete Nível 4§r (config) e do §eTraje Térmico Nível 2§r.
      O tesouro daqui é o §eMercury Ore§r, então traga picareta e muito oxigênio. Confira bem o equipamento antes de embarcar, porque o calor não perdoa. Pronto para a viagem, Herói? Eu estarei torcendo por você!
    tasks:
      - visit: {dim: -13, name: "Mercúrio"}
    rewards:
      - xp: 10
      - loot: epico

  - id: mercurio_metal
    title: "Mercury Ingot"
    type: normal
    deps: [mercurio]
    icon: ExtraPlanets:ingotMercury
    desc: |
      O Mercury Ore funde em §eMercury Ingot§r, ou você pode usar o minério com Pó de Pyrotheum na bancada. Junte §e12§r.
      Esse metal vira Compressed Mercury, a §eMercury Battery§r (85 000 gJ) e o equipamento de Mercúrio. Vale guardar bastante, Herói, porque as próximas receitas pedem esse lingote. Para ver todos os usos, aperte U no NEI. Boa mineração!
    tasks:
      - get: ExtraPlanets:ingotMercury x12
    rewards:
      - xp: 4
      - item: minecraft:redstone x16

  - id: bateria_mercurio
    title: "Mercury Battery"
    type: optional
    deps: [mercurio_metal]
    icon: ExtraPlanets:mercuryBattery
    desc: |
      Uma bateria que impressiona! A §eMercury Battery§r leva 5 Compressed Mercury, redstone e carvão, e carrega mais de cinco vezes a carga da Bateria do Galacticraft.
      É uma missão opcional, mas vale muito a pena para quem precisa de energia de sobra. Confira a receita no NEI (R) e guarde bem, Herói. Sua base e seus rovers agradecem!
    tasks:
      - get: ExtraPlanets:mercuryBattery
    rewards:
      - loot: incomum

  - id: ceres
    title: "Ceres"
    type: portal
    deps: [foguete_t4]
    icon: ExtraPlanets:tile.ceres
    banner: "O Planeta-Anão"
    subtitle: "Chegada a Ceres"
    desc: |
      O maior objeto do cinturão de asteroides é um planeta-anão de verdade, com chão firme! Ceres pede o §eFoguete Nível 4§r, é frio e tem vilas (config ativa) e §eCeres Uranium Ore§r.
      Leve traje térmico e muito oxigênio, e explore com cuidado, Herói. Esse portal abre novas oportunidades, então anote o que encontrar. Se algo faltar para a viagem, o NEI (R/U) ajuda.
    tasks:
      - visit: {dim: -20, name: "Ceres"}
    rewards:
      - xp: 10
      - loot: epico

  - id: uranio_ceres
    title: "Urânio de Ceres"
    type: normal
    deps: [ceres]
    icon: ExtraPlanets:tile.ceres:6
    desc: |
      O Ceres Uranium Ore funde em lingotes de urânio (oredict "ingotUranium", que o IC2 e outros mods aceitam). Junte §e8§r.
      Cuidado com a radiação dos mods que a simulam! Manuseie com cautela e guarde em baú separado. Se quiser saber onde mais o urânio é útil, aperte U no NEI. Boa mineração, Herói!
    tasks:
      - get: ore:ingotUranium x8
    rewards:
      - xp: 4
      - item: minecraft:obsidian x8

  - id: bomba_nuclear
    title: "Nuclear Bomb"
    type: optional
    deps: [uranio_ceres]
    icon: ExtraPlanets:nuclearBomb
    desc: |
      Pólvora, areia e um lingote de urânio. §cUma explosão enorme.§r
      Eu não vou dizer que você deveria fazer uma... mas também não vou fingir que não é tentador. Faça só se tiver certeza, Herói, e longe de tudo que importa. É uma missão opcional, e o NEI (R) mostra a receita completa caso você queira conferir.
    tasks:
      - get: ExtraPlanets:nuclearBomb
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 5 — JÚPITER (NÍVEL 4)
  # ======================================================================
  - id: tecido_termico_t3
    title: "Tier 3 Thermal Cloth"
    type: main
    deps: [carbono_prensado, tecido_termico_t2]
    icon: ExtraPlanets:item.thermalCloth:1
    desc: |
      Mais um degrau no calor extremo! O §eTier 3 Thermal Cloth§r leva 3 Compressed Carbon e 2 Tier 2 Thermal Cloth.
      Faça §e20§r para montar o traje completo, porque cada peça consome bastante tecido. Dá trabalho, mas é obrigatório para Júpiter e além. Confira a receita no NEI (R) se tiver dúvida. Você já está no caminho certo, Herói!
    tasks:
      - get: ExtraPlanets:item.thermalCloth:1 x20
    rewards:
      - xp: 6
      - choice: [ExtraPlanets:tier4Items:4 x6, ExtraPlanets:item.thermalCloth x6, minecraft:wool x16]

  - id: traje_termico_t3
    title: "Traje Térmico Nível 3"
    type: main
    deps: [tecido_termico_t3]
    icon: ExtraPlanets:item.tier3ThermalPadding:1
    desc: |
      Mais proteção para mais longe! Monte as quatro peças de Nível 3: o elmo leva 5 tecidos de Nível 3 e um Compressed Carbon, e as outras seguem o mesmo molde.
      O traje é obrigatório em §eJúpiter, Saturno e suas luas§r, então não pule esta etapa. Se esquecer algum item, o NEI (R/U) mostra a receita. Vista-se bem, Herói, e prepare-se para o calor!
    tasks:
      - get: [ExtraPlanets:item.tier3ThermalPadding, ExtraPlanets:item.tier3ThermalPadding:1, ExtraPlanets:item.tier3ThermalPadding:2, ExtraPlanets:item.tier3ThermalPadding:3]
    rewards:
      - xp: 6
      - choice: [GalacticraftCore:item.oxygenTankHeavyFull x2, ExtraPlanets:item.thermalCloth:1 x4, ExtraPlanets:tier4Items:4 x6]

  - id: jupiter
    title: "Júpiter"
    type: portal
    deps: [foguete_t4, traje_termico_t3]
    icon: ExtraPlanets:tile.jupiter
    banner: "O Gigante"
    subtitle: "Chegada a Júpiter"
    effect: 3
    desc: |
      Nuvens rodando, §erelâmpagos de verdade caindo do céu§r (a config deixa ligados), neblina e um calor sufocante. Júpiter pede o Foguete Nível 4 e o Traje Térmico Nível 3, Herói.

      Recursos: Palladium e Nickel (os metais do Foguete Nível 5) e Red Gem. No subsolo, o calabouço do segundo chefe. Cuidado com os raios e leve oxigênio de sobra. Confira o NEI (R/U) se faltar alguma receita. Você chegou muito longe na exploração espacial, então aproveite esta vitória. Pouse com calma e boa viagem!
    tasks:
      - visit: {dim: -15, name: "Júpiter"}
    rewards:
      - xp: 10
      - loot: epico

  - id: paladio
    title: "Palladium e Nickel"
    type: main
    deps: [jupiter]
    icon: ExtraPlanets:tile.jupiter:6
    desc: |
      Júpiter esconde metais valiosos, Herói! Funda os minérios de §ePalladium§r e §eNickel§r daquele planeta. O Compressed Palladium faz a blindagem e os motores auxiliares do Nível 5; o Nickel faz a Nickel Battery e o Advanced Fuel Loader.
      Junte §e24 de paládio§r e §e12 de níquel§r. Organize os dois em baús separados para não se perder. Confira os usos no NEI (R/U).
    tasks:
      - get: [ore:ingotPalladium x24, ore:ingotNickel x12]
    rewards:
      - xp: 6
      - choice: [ExtraPlanets:tile.jupiter:6 x6, ExtraPlanets:tile.jupiter:7 x6, ExtraPlanets:tier4Items:3 x4]

  - id: gema_vermelha
    title: "Red Gem"
    type: normal
    deps: [jupiter]
    icon: ExtraPlanets:tier5Items:8
    desc: |
      Brilho vermelho vindo do espaço! O Red Gem Ore funde em §eRed Gem§r, ou rende 1 gema com o Martelo de Engenheiro. Junte §e6§r.
      Essas gemas viram ferramentas, armadura e o Red Gem Wafer. Capriche na coleta, Herói, e guarde com cuidado, porque elas são difíceis de repor. Para ver todas as receitas, aperte U no NEI.
    tasks:
      - get: ore:gemRedGem x6
    rewards:
      - xp: 4
      - item: minecraft:diamond x2

  - id: chefe_jupiter
    title: "O Morcego de Fogo Evoluído"
    type: boss
    deps: [jupiter]
    icon: minecraft:blaze_powder
    banner: "Júpiter Silencia"
    subtitle: "O Morcego de Fogo-Chefe caiu"
    desc: |
      Prepare-se, Herói: o calabouço de Júpiter (feito de Jupiter Dungeon Brick) esconde um §cMorcego de Fogo Evoluído§r gigante! Ele voa rápido e incendeia, então leve Resistência ao Fogo, arco e paciência.

      Ele deixa a §eTier 5 Dungeon Key§r. Mais um chefe do §5Selo das Estrelas§r! Respire fundo, confira seu equipamento e vá com tudo. Eu estou torcendo por você!
    tasks:
      - kill: {entity: "extraplanets.EvolvedFireBatBoss", count: 1}
      - get: ExtraPlanets:T5key
    rewards:
      - xp: 15
      - loot: [epico, epico]

  - id: tesouro_jupiter
    title: "Esquemático: Foguete Nível 5"
    type: main
    deps: [chefe_jupiter]
    icon: ExtraPlanets:schematicTier5
    desc: |
      Vitória merece recompensa! Abra o §eTier 5 Treasure Chest§r com a chave e destrave o §eFoguete Nível 5§r.
      Saturno está logo ali, Herói, esperando por você. Leve o esquemático para a Bancada NASA e prepare os materiais do próximo foguete. Se precisar rever alguma receita, o NEI (R/U) está à mão. Bom trabalho!
    tasks:
      - get: ExtraPlanets:schematicTier5
    rewards:
      - xp: 8
      - choice: [ore:ingotPalladium x12, ExtraPlanets:tier4Items:3 x6, GalacticraftCore:item.bucketFuel x3]

  - id: io
    title: "Io"
    type: normal
    deps: [jupiter]
    icon: ExtraPlanets:tile.io:2
    desc: |
      A lua vulcânica de Júpiter, com terras de cinza e planícies em chamas! Para chegar a Io, você precisa do Foguete Nível 4 e do Traje Térmico Nível 3.
      Prepare-se para um cenário bem quente, Herói, e confira o oxigênio antes de sair da nave. Pouse, explore um pouco e anote tudo o que encontrar. Se faltar alguma peça, aperte R no NEI.
    tasks:
      - visit: {dim: -2004, name: "Io"}
    rewards:
      - xp: 5
      - loot: raro

  - id: europa
    title: "Europa"
    type: normal
    deps: [jupiter]
    icon: ExtraPlanets:tile.europa:2
    desc: |
      Uma lua de gelo com oceanos escondidos! Para visitar Europa, você precisa do Foguete Nível 4 e do Traje Térmico Nível 3.
      O cenário é belíssimo, mas perigoso, então confira o oxigênio e o combustível antes de decolar. Pouse, dê uma olhada em volta e anote o que encontrar, Herói. Em caso de dúvida sobre as receitas, o NEI (R/U) ajuda.
    tasks:
      - visit: {dim: -2002, name: "Europa"}
    rewards:
      - xp: 5
      - loot: raro

  - id: ganimedes
    title: "Ganimedes"
    type: normal
    deps: [jupiter]
    icon: ExtraPlanets:tile.ganymede:2
    desc: |
      A maior lua do sistema solar, Herói! Para chegar a Ganimedes, você precisa do Foguete Nível 4 e do Traje Térmico Nível 3.
      O tamanho impressiona, então reserve tempo para explorar com calma. Confira o oxigênio, o combustível e a armadura antes da viagem. Se esquecer alguma receita, o NEI (R/U) mostra num instante.
    tasks:
      - visit: {dim: -2003, name: "Ganimedes"}
    rewards:
      - xp: 5
      - loot: raro

  - id: calisto
    title: "Calisto"
    type: normal
    deps: [jupiter]
    icon: ExtraPlanets:tile.callisto:2
    desc: |
      Uma lua antiga, cheia de crateras! Para visitar Calisto, você precisa do Foguete Nível 4 e do Traje Térmico Nível 3.
      É a quarta das luas de Júpiter, então você já está quase lá, Herói. Leve oxigênio extra, pouse com cuidado e explore as crateras. Em caso de dúvida sobre algum item, aperte R ou U no NEI.
    tasks:
      - visit: {dim: -2001, name: "Calisto"}
    rewards:
      - xp: 5
      - loot: raro

  - id: luas_galileanas
    title: "As Luas de Galileu"
    type: optional
    deps: [io, europa, ganimedes, calisto]
    icon: ExtraPlanets:tile.ganymede:2
    desc: |
      Io, Europa, Ganimedes e Calisto, as quatro luas que Galileu viu pela primeira vez! Visitar todas é um feito digno de Herói.
      Esta quest marca que você esteve nas quatro e não pede nenhum item. É opcional, mas é uma bela conquista. Se ainda faltar alguma lua, volte às quests anteriores, escolha seu destino e boa viagem!
    tasks:
      - check
    rewards:
      - loot: raro

  # ======================================================================
  # FASE 6 — SATURNO (NÍVEL 5)
  # ======================================================================
  - id: foguete_t5
    title: "Foguete Nível 5"
    type: main
    deps: [tesouro_jupiter, paladio]
    icon: ExtraPlanets:itemTier5Rocket
    desc: |
      Mais um foguete, mais um planeta! A §eBlindagem Nível 5§r é a Blindagem Nível 4 mais Compressed Palladium, feita na Prensa. Nariz, motor, aletas (6 blindagens) e propulsores (4 Compressed Palladium, Lã Azul...) seguem o mesmo molde.
      Monte o §eFoguete Nível 5§r e conquiste Saturno, Titã, Reia e Oberon. Confira as receitas no NEI (R/U), Herói!
    tasks:
      - get: [ExtraPlanets:tier5Items:3 x8, ExtraPlanets:itemTier5Rocket:*]
    rewards:
      - xp: 8
      - choice: [GalacticraftCore:item.bucketFuel x4, ExtraPlanets:tier5Items:4 x6, ore:ingotPalladium x12]

  - id: saturno
    title: "Saturno"
    type: portal
    deps: [foguete_t5, traje_termico_t3]
    icon: ExtraPlanets:tile.saturn
    banner: "O Senhor dos Anéis"
    subtitle: "Chegada a Saturno"
    effect: 3
    desc: |
      Os anéis cortando o céu... é a vista mais bonita do sistema solar. Saturno pede o §eFoguete
      Nível 5§r e o §eTraje Térmico Nível 3§r.

      §eRecursos:§r §eMagnesium§r (Nível 6 e Tecido Térmico Nível 4), §eSlime Ore§r, mares de
      hidrocarbonetos e terras "infectadas" com §cÁgua Infectada§r. E o terceiro chefe.
    tasks:
      - visit: {dim: -16, name: "Saturno"}
    rewards:
      - xp: 10
      - loot: epico

  - id: magnesio
    title: "Magnesium"
    type: main
    deps: [saturno]
    icon: ExtraPlanets:tile.saturn:6
    desc: |
      Saturno traz um novo metal! O §eSaturn Magnesium Ore§r funde em Magnesium Ingot. Junte §e32§r.
      O Compressed Magnesium faz a Blindagem Nível 6, o Tecido Térmico Nível 4, o Hybrid Solar Panel e o Advanced Oxygen Compressor, então não economize. Organize bem o inventário, Herói, e confira os outros usos no NEI (R/U).
    tasks:
      - get: ore:ingotMagnesium x32
    rewards:
      - xp: 6
      - choice: [ExtraPlanets:tile.saturn:6 x8, ExtraPlanets:tier5Items:3 x4, ore:ingotPalladium x8]

  - id: slime_saturno
    title: "Slime Ore"
    type: optional
    deps: [saturno]
    icon: ExtraPlanets:tile.saturn:11
    desc: |
      Um minério que dá gosma de slime! Junte §e16§r bolas de slime.
      Elas são úteis para Manipuladores de Fluidos e pistões grudentos. Também existe um Slime Block do ExtraPlanets, caso queira variar. É uma missão opcional, mas divertida de fazer. Se quiser saber mais usos, aperte U no NEI. Boa mineração, Herói!
    tasks:
      - get: minecraft:slime_ball x16
    rewards:
      - loot: comum

  - id: chefe_saturno
    title: "O Ghast Evoluído"
    type: boss
    deps: [saturno]
    icon: minecraft:ghast_tear
    banner: "Os Anéis Brilham em Paz"
    subtitle: "O Ghast-Chefe caiu"
    desc: |
      Atenção, Herói: o calabouço de Saturno guarda um §cGhast Evoluído§r gigante, que dispara bolas de fogo explosivas! Rebata as bolas, use arco e lute sempre com cobertura por perto.

      Quando ele cair, deixa a §eTier 6 Dungeon Key§r. Mais um chefe do §5Selo das Estrelas§r! Leve armadura boa, poções de cura e muita calma. Eu aposto todas as minhas páginas do Registro em você. Vá lá e mostre quem manda!
    tasks:
      - kill: {entity: "extraplanets.EvolvedGhastBoss", count: 1}
      - get: ExtraPlanets:T6key
    rewards:
      - xp: 15
      - loot: [epico, epico]

  - id: tesouro_saturno
    title: "Esquemático: Foguete Nível 6"
    type: main
    deps: [chefe_saturno]
    icon: ExtraPlanets:schematicTier6
    desc: |
      Boa, Herói! O §eTier 6 Treasure Chest§r guarda o projeto do §eFoguete Nível 6§r. Use a chave que o chefe deixou, abra o baú e leve o esquemático para a Bancada NASA.
      Urano espera por você lá na frente. Antes de partir, confira no NEI (R/U) o que o novo foguete vai pedir, para já ir separando os materiais. Falta pouco para a próxima fronteira!
    tasks:
      - get: ExtraPlanets:schematicTier6
    rewards:
      - xp: 8
      - choice: [ore:ingotMagnesium x12, ExtraPlanets:tier5Items:3 x6, GalacticraftCore:item.bucketFuel x3]

  - id: tita
    title: "Titã"
    type: normal
    deps: [saturno]
    icon: ExtraPlanets:tile.titan:2
    desc: |
      A lua de Saturno com colinas e mares de metano! Para visitar Titã, você precisa do Foguete Nível 5 e do Traje Térmico Nível 3.
      O cenário é de cair o queixo, Herói. Confira o oxigênio, o combustível e a armadura antes de decolar, pouse com cuidado e explore à vontade. Se faltar alguma peça, o NEI (R/U) mostra a receita.
    tasks:
      - visit: {dim: -40, name: "Titã"}
    rewards:
      - xp: 5
      - loot: raro

  - id: reia
    title: "Reia"
    type: normal
    deps: [saturno]
    icon: ExtraPlanets:tile.rhea:2
    desc: |
      Outra lua de Saturno esperando sua visita! Reia é acessível com o Foguete Nível 5 e o Traje Térmico Nível 3.
      A viagem é parecida com a de Titã, então você já sabe o caminho, Herói. Verifique o oxigênio, pouse com cuidado e dê uma boa explorada. Se esquecer alguma receita, aperte R no NEI. Boa viagem!
    tasks:
      - visit: {dim: -2006, name: "Reia"}
    rewards:
      - xp: 5
      - loot: raro

  - id: japeto
    title: "Jápeto"
    type: normal
    deps: [saturno, foguete_t6]
    icon: ExtraPlanets:iapetus:2
    desc: |
      A lua "de duas cores" de Saturno é mais difícil de alcançar, Herói! Para chegar a Jápeto, você precisa do §eFoguete Nível 6§r e, como é lua de Saturno, do Traje Térmico Nível 3.
      Portanto, prepare o foguete novo antes de embarcar. Confira o oxigênio e o combustível, e explore com calma. O NEI (R/U) ajuda caso falte alguma peça. Boa sorte!
    tasks:
      - visit: {dim: -43, name: "Jápeto"}
    rewards:
      - xp: 5
      - loot: raro

  # ======================================================================
  # FASE 7 — URANO (NÍVEL 6)
  # ======================================================================
  - id: foguete_t6
    title: "Foguete Nível 6"
    type: main
    deps: [tesouro_saturno, magnesio]
    icon: ExtraPlanets:itemTier6Rocket
    desc: |
      Subindo mais um degrau! A §eBlindagem Nível 6§r é a Blindagem Nível 5 mais Compressed Magnesium. Os propulsores levam Compressed Magnesium e Lã Verde-Limão.
      Monte o §eFoguete Nível 6§r na Bancada NASA e conquiste Urano, Titânia e Jápeto. Confira as receitas completas no NEI (R/U) e separe o material com antecedência. Falta pouco, Herói, e o espaço é todo seu!
    tasks:
      - get: [ExtraPlanets:tier6Items:3 x8, ExtraPlanets:itemTier6Rocket:*]
    rewards:
      - xp: 8
      - choice: [GalacticraftCore:item.bucketFuel x4, ExtraPlanets:tier6Items:4 x6, ore:ingotMagnesium x12]

  - id: tecido_termico_t4
    title: "Tier 4 Thermal Cloth"
    type: main
    deps: [magnesio, tecido_termico_t3]
    icon: ExtraPlanets:item.thermalCloth:2
    desc: |
      Chegamos ao último tecido térmico, Herói! O §eTier 4 Thermal Cloth§r leva 3 Compressed Magnesium e 2 Tier 3 Thermal Cloth.
      Faça §e20§r, porque o traje inteiro consome bastante tecido. Dá trabalho, mas é o que protege você do frio extremo mais adiante. Confira a receita no NEI (R) se tiver dúvida e capriche na produção!
    tasks:
      - get: ExtraPlanets:item.thermalCloth:2 x20
    rewards:
      - xp: 6
      - choice: [ExtraPlanets:tier6Items:4 x6, ExtraPlanets:item.thermalCloth:1 x6, minecraft:wool x16]

  - id: traje_termico_t4
    title: "Traje Térmico Nível 4"
    type: main
    deps: [tecido_termico_t4]
    icon: ExtraPlanets:item.tier4ThermalPadding:1
    desc: |
      O traje definitivo do ExtraPlanets! Monte as quatro peças do Nível 4, que são obrigatórias em §eUrano, Netuno, Plutão, Éris e suas luas§r, onde o frio passa de -100 na escala térmica do Galacticraft.
      Sem ele, nem pense em sair da nave, Herói. Confira cada peça no NEI (R/U) e vista tudo antes de pousar. Você está quase no fim da jornada!
    tasks:
      - get: [ExtraPlanets:item.tier4ThermalPadding, ExtraPlanets:item.tier4ThermalPadding:1, ExtraPlanets:item.tier4ThermalPadding:2, ExtraPlanets:item.tier4ThermalPadding:3]
    rewards:
      - xp: 6
      - choice: [GalacticraftCore:item.oxygenTankHeavyFull x2, ExtraPlanets:item.thermalCloth:2 x4, ExtraPlanets:tier6Items:4 x6]

  - id: urano
    title: "Urano"
    type: portal
    deps: [foguete_t6, traje_termico_t4]
    icon: ExtraPlanets:tile.uranus
    banner: "O Gigante de Gelo"
    subtitle: "Chegada a Urano"
    effect: 3
    desc: |
      Tudo é gelo, Herói: mares congelados, terras de neve, §eespinhos de gelo§r e até iglus (ambos ativos na config)! Para chegar, você precisa do Foguete Nível 6 e do Traje Térmico Nível 4.

      Recursos: Crystal (o metal do Nível 7) e White Gem. Leve oxigênio de sobra, pouse com cuidado e explore. O NEI (R/U) ajuda caso falte alguma receita. Cada planeta vencido é uma página nova no Registro, e você já passou por tantos. Respire fundo, aproveite a vista congelada e boa viagem!
    tasks:
      - visit: {dim: -17, name: "Urano"}
    rewards:
      - xp: 10
      - loot: epico

  - id: cristal
    title: "Crystal"
    type: main
    deps: [urano]
    icon: ExtraPlanets:tile.uranus:3
    desc: |
      O §eUranus Crystal Ore§r funde em Crystal Ingot, e esse é o metal do Nível 7. Para a Blindagem Nível 7 você vai precisar de §eCompressed Reinforced Crystal§r, que são dois Compressed Crystal juntos na Prensa.
      Junte §e32§r lingotes e deixe tudo organizado no baú, Herói. Se quiser ver outros usos do cristal, aperte U no NEI. Mãos à obra!
    tasks:
      - get: ore:ingotCrystal x32
    rewards:
      - xp: 6
      - choice: [ExtraPlanets:tile.uranus:3 x8, ExtraPlanets:tier6Items:3 x4, ore:ingotMagnesium x8]

  - id: gema_branca
