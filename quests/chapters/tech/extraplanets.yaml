    icon: ExtraPlanets:itemTier10Rocket
    banner: "Além do Sol"
    subtitle: "O Volume dos Mundos Distantes está completo"
    desc: |
      De Fobos a Kepler 22b. Dez níveis de foguete, quatro de traje térmico, sete guardiões e um
      planeta de árvores coloridas em outra estrela. O Volume dos Mundos Distantes está inteiro de
