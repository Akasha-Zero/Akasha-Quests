    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:260
    rewards:
      - xp: 4
      - choice: [minecraft:piston x2, appliedenergistics2:item.ItemMultiMaterial:43 x2, minecraft:iron_ingot x8]

  - id: cartao_basico
    title: "Cartões Básico e Avançado"
    type: normal
    deps: [processador_calculo]
    icon: appliedenergistics2:item.ItemMultiMaterial:25
    desc: |
      As melhorias do AE2 são cartões. Eles partem de duas bases (Processador de Cálculo, ferro e redstone; rendem 2):
      §e• Cartão Básico§r com ouro.
      §e• Cartão Avançado§r com diamante.
      Faça um de cada: deles saem os cartões de capacidade, redstone, fabricação, aceleração... Receitas completas no NEI (R/U), Herói.
    tasks:
      - get: [appliedenergistics2:item.ItemMultiMaterial:25, appliedenergistics2:item.ItemMultiMaterial:28]
    rewards:
      - xp: 3
      - item: minecraft:gold_ingot x4

  - id: cartao_capacidade
    title: "Cartão de Capacidade"
    type: normal
    deps: [cartao_basico]
    icon: appliedenergistics2:item.ItemMultiMaterial:27
    desc: |
      Cartão Básico + cristal de certus = §eCartão de Capacidade§r. Num barramento, ele abre mais slots de filtro; em barramentos de armazenamento e células, mais espaço de configuração.
      É o cartão mais usado do mod, Herói, então faça logo alguns. Se precisar rever a receita, aperte R ou U no NEI.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:27
    rewards:
      - xp: 2
      - item: ore:crystalCertusQuartz x4

  - id: cartao_redstone
    title: "Cartão de Redstone"
    type: optional
    deps: [cartao_basico]
    icon: appliedenergistics2:item.ItemMultiMaterial:26
    desc: |
      Cartão Básico + tocha de redstone = §eCartão de Redstone§r. Com ele, o barramento passa a obedecer a um sinal de redstone (ligado com sinal, sem sinal, ou num pulso).
      É opcional, mas útil para controlar o fluxo de itens na sua automação. Receita no NEI (R/U), Herói.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:26
    rewards:
      - loot: comum

  - id: cartao_impreciso
    title: "Cartão Impreciso"
    type: optional
    deps: [cartao_basico]
    icon: appliedenergistics2:item.ItemMultiMaterial:29
    desc: |
      Cartão Avançado + lã = §eCartão Impreciso§r ("Fuzzy"). O filtro passa a ignorar dano/durabilidade (e pode agrupar por faixas).
      É útil para ferramentas e armaduras usadas, que de outro jeito não casariam com o filtro. Opcional, mas muito prático em salas de armazenamento. Receita no NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:29
    rewards:
      - loot: comum

  - id: cartao_inversor
    title: "Cartão Inversor"
    type: optional
    deps: [cartao_basico]
    icon: appliedenergistics2:item.ItemMultiMaterial:31
    desc: |
      Cartão Avançado + tocha de redstone = §eCartão Inversor§r. O filtro vira uma "lista negra": passa tudo, menos o que estiver configurado.
      É ótimo para importar tudo de um baú, menos o que você quer manter lá dentro. Opcional, Herói. Se quiser ver a receita, NEI, R ou U.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:31
    rewards:
      - loot: comum

  - id: cartao_aceleracao
    title: "Cartão de Aceleração"
    type: normal
    deps: [cartao_basico]
    icon: appliedenergistics2:item.ItemMultiMaterial:30
    desc: |
      Cartão Avançado + Cristal de Fluix = §eCartão de Aceleração§r. Barramentos movem mais itens por operação, e Inscritores e Montadores Moleculares trabalham mais rápido.
      Neste pack há até versões "Hyper" e "Superluminal", feitas com componentes de armazenamento! Faça um e sinta a diferença na velocidade. Receita no NEI (R/U), Herói.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:30
    rewards:
      - xp: 2
      - item: appliedenergistics2:item.ItemMultiMaterial:7 x4

  - id: cartoes_especiais
    title: "Cartões Especiais"
    type: optional
    deps: [cartao_capacidade]
    icon: appliedenergistics2:item.ItemMultiMaterial:55
    desc: |
      Esta versão do AE2 traz vários cartões extras (todos sem forma na bancada):
      §e• Filtro de Oredict§r (avançado + livro) · §eAderente§r (básico + gosma)
      §e• Descarte de Excesso§r (básico + pérola do Fim) · §eDistribuição Igual§r (avançado +
      Processador Lógico) · §eTravamento§r e §eBloqueio Avançado§r para fabricação.
      Leia os tooltips e faça qualquer um.
    tasks:
      - one_of: [appliedenergistics2:item.ItemMultiMaterial:55, appliedenergistics2:item.ItemMultiMaterial:64, appliedenergistics2:item.ItemMultiMaterial:68, appliedenergistics2:item.ItemMultiMaterial:69, appliedenergistics2:item.ItemMultiMaterial:65, appliedenergistics2:item.ItemMultiMaterial:63]
    rewards:
      - loot: incomum

  - id: cartoes_aceleracao_extremos
    title: "Aceleração Hiper e Superluminal"
    type: optional
    deps: [cartao_aceleracao, componente_16k]
    icon: appliedenergistics2:item.ItemMultiMaterial:56
    desc: |
      Cartão de Aceleração + Componente 16k = §eHyper-Acceleration Card§r. Esse + Componente 1024k = §eSuperluminal Acceleration Card§r.
      Velocidade de máquinas e barramentos levada ao exagero, do jeitinho que eu gosto! É opcional, mas dá um gás enorme na produção, e a segunda versão vem da primeira. Receitas no NEI (R/U), Herói.
    tasks:
      - one_of: [appliedenergistics2:item.ItemMultiMaterial:56, appliedenergistics2:item.ItemMultiMaterial:67]
    rewards:
      - loot: incomum

  - id: barramento_armazenamento
    title: "Barramento de Armazenamento ME"
    type: main
    deps: [interface]
    icon: appliedenergistics2:item.ItemMultiPart:220
    desc: |
      Interface + pistão grudento + pistão = §eBarramento de Armazenamento§r. Encoste-o num baú,
      numa DSU do MineFactory, numa gaveta... e §eaquele inventário passa a fazer parte da
      rede§r, como se fosse uma célula.

      Combine com prioridade e particionamento: "pedregulho vai para a DSU", "o resto vai para
      os discos". Um baú gigante sem bytes!
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:220
    rewards:
      - xp: 4
      - choice: [minecraft:sticky_piston x2, minecraft:chest x8, appliedenergistics2:item.ItemMultiMaterial:27 x1]

  - id: interface
    title: "Interface ME"
    type: main
    deps: [nucleos, primeira_rede]
    icon: appliedenergistics2:tile.BlockInterface
    desc: |
      A peça mais versátil do AE2! A §eInterface ME§r (ferro, vidro e os dois Núcleos) é uma
      "porta" entre a rede e o mundo:
      §e• Estoque:§r configure itens e quantidades, e ela mantém essa reserva disponível para
      tubos e máquinas vizinhas.
      §e• Entrada:§r o que for inserido nela vai para a rede.
      §e• Fabricação:§r segura padrões e empurra ingredientes para máquinas e Montadores
      Moleculares.
      Existe em bloco e em "peça" (de cabo) — uma vira a outra na bancada.
    tasks:
      - one_of: [appliedenergistics2:tile.BlockInterface, appliedenergistics2:item.ItemMultiPart:440]
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:item.ItemMultiMaterial:43 x2, appliedenergistics2:item.ItemMultiMaterial:44 x2, minecraft:iron_ingot x8]

  - id: emissor_nivel
    title: "Emissor de Nível ME"
    type: normal
    deps: [processador_calculo, primeira_rede]
    icon: appliedenergistics2:item.ItemMultiPart:280
    desc: |
      Processador de Cálculo + tocha de redstone = §eEmissor de Nível§r. Ele emite redstone
      quando a quantidade de um item na rede passa (ou fica abaixo) de um valor. Ligue uma
      fazenda só quando o trigo acabar, desligue a pedreira quando tiver pedregulho demais...
      Com um Cartão de Fabricação, ele até liga quando a rede quer fabricar aquele item.
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:280
    rewards:
      - xp: 3
      - item: minecraft:redstone_torch x8

  - id: monitores
    title: "Monitores de Armazenamento e Conversão"
    type: optional
    deps: [emissor_nivel, painel_iluminado]
    icon: appliedenergistics2:item.ItemMultiPart:400
    desc: |
      Emissor de Nível + Painel Iluminado = §eMonitor de Armazenamento§r: uma "placa" na parede
      que mostra a quantidade de um item (clique com o item para configurar). Com os dois
      Núcleos, ele vira o §eMonitor de Conversão§r, que também deixa depositar e retirar
      aquele item ali mesmo. Faça qualquer um.
    tasks:
      - one_of: [appliedenergistics2:item.ItemMultiPart:400, appliedenergistics2:item.ItemMultiPart:420, appliedenergistics2:item.ItemMultiPart:410]
    rewards:
      - loot: comum

  - id: planos
    title: "Planos de Formação e Aniquilação"
    type: optional
    deps: [nucleos, primeira_rede]
    icon: appliedenergistics2:item.ItemMultiPart:300
    desc: |
      Os planos interagem com o §emundo§r:
      §e• Plano de Aniquilação§r — quebra blocos à frente (e recolhe itens caídos) para a rede.
      §e• Plano de Formação§r — coloca blocos (ou solta itens) à frente, a partir da rede.
      Um gerador de pedregulho + Plano de Aniquilação = pedregulho infinito nos discos. O de
      Identidade (com Pérola de Fluix) mantém dados/NBT dos blocos. Faça qualquer um.
    tasks:
      - one_of: [appliedenergistics2:item.ItemMultiPart:300, appliedenergistics2:item.ItemMultiPart:320, appliedenergistics2:item.ItemMultiPart:301]
    rewards:
      - loot: comum

  - id: barramento_alternancia
    title: "Barramento de Alternância"
    type: optional
    deps: [cabo_vidro]
    icon: appliedenergistics2:item.ItemMultiPart:80
    desc: |
      2 Cabos de Vidro, redstone e uma alavanca = §eBarramento de Alternância§r: liga ou corta a conexão da rede naquele ponto com redstone (a versão Invertida faz o contrário).
      Ótimo para "desligar" uma ala inteira da base. Faça qualquer uma das versões. Dúvidas? NEI, R ou U.
    tasks:
      - one_of: [appliedenergistics2:item.ItemMultiPart:80, appliedenergistics2:item.ItemMultiPart:100]
    rewards:
      - loot: comum

  - id: porta_es
    title: "Porta de Entrada-Saída ME"
    type: normal
    deps: [acionador, processador_logico]
    icon: appliedenergistics2:tile.BlockIOPort
    desc: |
      A §ePorta de Entrada-Saída ME§r (2 Acionadores, vidro, ferro, Cabo de Vidro e Processador Lógico) esvazia ou enche células automaticamente.
      Use-a para transferir o conteúdo de um disco antigo para um maior, sem tirar item por item. Dá um alívio enorme, Herói! Receita no NEI (R/U).
    tasks:
      - get: appliedenergistics2:tile.BlockIOPort
    rewards:
      - xp: 3
      - item: appliedenergistics2:item.ItemMultiMaterial:22 x2

  - id: condensador
    title: "Condensador de Matéria"
    type: normal
    deps: [po_fluix, vidro_quartzo]
    icon: appliedenergistics2:tile.BlockCondenser
    desc: |
      O §eCondensador de Matéria§r (ferro, vidro e Pó de Fluix) destrói itens — e, com
      componentes de armazenamento instalados, transforma o que destrói em energia
      condensada: §eBolas de Matéria§r ou, com muito, muito material, uma §eSingularidade§r.

      É a lixeira mais útil do Registro. As Bolas de Matéria são munição do Canhão de Matéria.
    tasks:
      - get: appliedenergistics2:tile.BlockCondenser
    rewards:
      - xp: 3
      - item: minecraft:cobblestone x64

  - id: singularidade
    title: "Singularidade"
    type: optional
    deps: [condensador, componente_64k]
    icon: appliedenergistics2:item.ItemMultiMaterial:47
    desc: |
      Uma estrela de nêutrons de bolso! Encha o Condensador de Matéria (com um componente de armazenamento grande instalado) até ele condensar uma §eSingularidade§r. Ela é peça da ponte quântica e das células "Artificial Universe".
      §cAviso:§r leva MUITO material. Use pedregulho de um gerador automático. Paciência, Herói!
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:47
    rewards:
      - loot: raro

  - id: bola_materia
    title: "Bola de Matéria"
    type: optional
    deps: [condensador]
    icon: appliedenergistics2:item.ItemMultiMaterial:6
    desc: |
      Configure o Condensador de Matéria para produzir §eBolas de Matéria§r (com um componente instalado) e jogue itens inúteis nele.
      Cada bola é "matéria comprimida", munição perfeita para o Canhão de Matéria. Junte 4. Aproveite para se livrar do lixo da base, Herói. Confira detalhes no NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:6 x4
    rewards:
      - loot: comum

  - id: canhao_materia
    title: "Canhão de Matéria"
    type: optional
    deps: [condensador, celula_energia]
    icon: appliedenergistics2:item.ToolMassCannon
    desc: |
      Ferro, Componente 4k, Célula de Energia e Núcleo de Formação = §eCanhão de Matéria§r. Ele dispara itens da célula interna (Bolas de Matéria, pepitas de metal...) com força.
      Carregue no Carregador antes de usar. A arma mais "digital" do Registro, Herói! Receita no NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ToolMassCannon
    rewards:
      - loot: comum

  - id: logistica_digital
    title: "Logística Digital"
    type: milestone
    deps: [barramento_importacao, barramento_exportacao, barramento_armazenamento, interface]
    icon: appliedenergistics2:tile.BlockInterface
    banner: "Logística Digital"
    subtitle: "A rede aprende a mover"
    desc: |
      Importação puxando, Exportação empurrando, Barramento de Armazenamento transformando baús em discos e Interfaces mantendo estoques. Herói, sua rede agora §emexe nas coisas§r!

      Três montagens clássicas para estrear:
      • Fornalha automática: Exportação de minério e carvão por cima/lado, Importação embaixo.
      • DSU do MineFactory: Barramento de Armazenamento com prioridade alta para pedregulho.
      • Estoque de tochas: Interface configurada com 64 tochas ao lado de um baú.

      Lembre-se dos canais: cada barramento é 1 canal. Um Cabo Denso salva vidas. Parabéns pelo marco!
    tasks:
      - get: [appliedenergistics2:item.ItemMultiPart:240, appliedenergistics2:item.ItemMultiPart:260, appliedenergistics2:item.ItemMultiPart:220]
    rewards:
      - xp: 10
      - kit: {name: "Kit do Logístico", items: [appliedenergistics2:item.ItemMultiMaterial:27 x4, appliedenergistics2:item.ItemMultiMaterial:30 x2, appliedenergistics2:item.ItemMultiPart:76 x8, appliedenergistics2:item.ItemMultiMaterial:43 x2, appliedenergistics2:item.ItemMultiMaterial:44 x2]}
      - loot: raro

  # ======================================================================
  # FASE 4 — FABRICAÇÃO AUTOMÁTICA
  # ======================================================================
  - id: padrao_branco
    title: "Padrão em Branco"
    type: main
    deps: [logistica_digital]
    icon: appliedenergistics2:item.ItemMultiMaterial:52
    desc: |
      Chegou a hora da página mais bonita do Volume: a rede que §efabrica sozinha§r.

      Tudo começa num §ePadrão em Branco§r (2 Vidros de Quartzo, 3 glowstones, 3 ferros e um
      cristal de certus). Um padrão é uma "receita gravada": diz à rede o que entra e o que
      sai. Faça §e8§r.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:52 x8
    rewards:
      - xp: 5
      - choice: [minecraft:glowstone_dust x32, appliedenergistics2:tile.BlockQuartzGlass x8, minecraft:iron_ingot x16]

  - id: terminal_padroes
    title: "Terminal de Padrões ME"
    type: main
    deps: [padrao_branco, terminal_fabricacao]
    icon: appliedenergistics2:item.ItemMultiPart:340
    desc: |
      Terminal de Fabricação + Processador de Engenharia = §eTerminal de Padrões§r. Nele você
      grava padrões:
      §e• Modo Fabricação:§r receitas de bancada (feitas pelo Montador Molecular).
      §e• Modo Processamento:§r "entra X, sai Y" — para máquinas (fornalha, triturador,
      inscritor...).
      Monte a receita, coloque um Padrão em Branco e clique em "codificar".
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:340
    rewards:
      - xp: 5
      - choice: [appliedenergistics2:item.ItemMultiMaterial:52 x4, appliedenergistics2:item.ItemMultiMaterial:24 x2, appliedenergistics2:item.ItemMultiPart:180 x3]

  - id: padrao_codificado
    title: "O Primeiro Padrão"
    type: main
    deps: [terminal_padroes]
    icon: appliedenergistics2:item.ItemEncodedPattern
    desc: |
      Codifique o seu primeiro §ePadrão Codificado§r: que tal tochas, ou tábuas a partir de
      troncos? Segure Shift sobre o padrão para conferir entrada e saída.
      §aDica:§r errou? Com Shift + clique direito no ar, o padrão codificado na mão volta a ser
      um Padrão em Branco.
    tasks:
      - get: appliedenergistics2:item.ItemEncodedPattern
    rewards:
      - xp: 5
      - choice: [appliedenergistics2:item.ItemMultiMaterial:52 x4, minecraft:log x16, minecraft:coal x16]

  - id: montador_molecular
    title: "Montador Molecular"
    type: main
    deps: [nucleos, vidro_quartzo]
    icon: appliedenergistics2:tile.BlockMolecularAssembler
    desc: |
      A bancada que trabalha sozinha: o §eMontador Molecular§r (ferro, Vidros de Quartzo,
      bancada e os dois Núcleos). Coloque-o §eencostado numa Interface§r: a Interface envia os
      padrões de fabricação e os ingredientes, o montador faz a receita e devolve o resultado.

      Cartões de Aceleração deixam o montador mais rápido. Montadores encostados uns nos
      outros repassam o trabalho entre si.
    tasks:
      - get: appliedenergistics2:tile.BlockMolecularAssembler
    rewards:
      - xp: 5
      - choice: [appliedenergistics2:item.ItemMultiMaterial:30 x1, minecraft:crafting_table x4, appliedenergistics2:tile.BlockQuartzGlass x4]

  - id: unidade_fabricacao
    title: "Unidade de Fabricação"
    type: main
    deps: [processador_calculo, processador_logico, cabo_vidro]
    icon: appliedenergistics2:tile.BlockCraftingUnit
    desc: |
      A rede precisa de um "cérebro de fabricação" — a §eCPU de Fabricação§r. Ela é um
      multibloco montado com §eUnidades de Fabricação§r (ferro, Cabos de Vidro, 2 Processadores
      de Cálculo e um Lógico) e blocos derivados delas.

      Sozinha, a Unidade é só "enchimento". Ela vira os outros blocos da CPU na bancada.
    tasks:
      - get: appliedenergistics2:tile.BlockCraftingUnit x2
    rewards:
      - xp: 5
      - choice: [appliedenergistics2:item.ItemMultiMaterial:23 x2, appliedenergistics2:item.ItemMultiMaterial:22 x2, minecraft:iron_ingot x16]

  - id: armazenamento_fabricacao
    title: "Armazenamento de Fabricação"
    type: main
    deps: [unidade_fabricacao, componente_1k]
    icon: appliedenergistics2:tile.BlockCraftingStorage
    desc: |
      Unidade de Fabricação + Componente 1k = §eArmazenamento de Fabricação de 1k§r: a memória da CPU. Cada pedido de fabricação ocupa bytes durante o cálculo.
      Receitas grandes precisam de mais memória (4k, 16k, 64k... e até 16384k neste pack). Comece com o de 1k e suba conforme precisar, Herói. Receitas no NEI (R/U).
    tasks:
      - get: appliedenergistics2:tile.BlockCraftingStorage
    rewards:
      - xp: 5
      - choice: [appliedenergistics2:item.ItemMultiMaterial:35 x1, appliedenergistics2:tile.BlockCraftingUnit x1, appliedenergistics2:item.ItemMultiMaterial:22 x2]

  - id: coprocessador
    title: "Unidade de Co-Processamento"
    type: normal
    deps: [unidade_fabricacao]
    icon: appliedenergistics2:tile.BlockCraftingUnit:1
    desc: |
      Unidade de Fabricação + Processador de Engenharia = §eUnidade de Co-Processamento§r. Cada co-processador deixa a CPU despachar mais tarefas em paralelo.
      Quatro deles viram um de 4 núcleos, e assim por diante (até 4096 núcleos!). Sua fábrica vai agradecer, Herói. Se precisar da receita, aperte R ou U no NEI.
    tasks:
      - get: appliedenergistics2:tile.BlockCraftingUnit:1
    rewards:
      - xp: 3
      - item: appliedenergistics2:item.ItemMultiMaterial:24

  - id: monitor_fabricacao
    title: "Monitor de Fabricação"
    type: optional
    deps: [unidade_fabricacao, monitores]
    icon: appliedenergistics2:tile.BlockCraftingMonitor
    desc: |
      Unidade de Fabricação + Monitor de Armazenamento = §eMonitor de Fabricação§r. Ele faz parte da CPU e mostra, na face, o item que ela está fabricando agora.
      É opcional, mas lindo de ver funcionando e ótimo para acompanhar pedidos grandes. Receita no NEI (R/U), Herói.
    tasks:
      - get: appliedenergistics2:tile.BlockCraftingMonitor
    rewards:
      - loot: comum

  - id: cpu_info
    title: "Montando a CPU de Fabricação"
    type: info
    deps: [armazenamento_fabricacao]
    icon: appliedenergistics2:tile.BlockCraftingStorage
    desc: |
      Regras da CPU de Fabricação:

      §e• Formato:§r um §eparalelepípedo sólido§r (caixa cheia, sem buracos) feito só de
      blocos da família da Unidade de Fabricação.
      §e• Conteúdo mínimo:§r pelo menos §eum Armazenamento de Fabricação§r.
      §e• Opcionais:§r Co-Processadores (mais velocidade), Monitores (visual).
      §e• Conexão:§r a caixa precisa encostar na rede por um cabo (usa canal).
      §e• Várias CPUs:§r caixas separadas = CPUs separadas, cada uma faz um pedido por vez.

      Quando a estrutura forma, os blocos mudam de aparência. Peça algo no Terminal (clique
      do meio ou na opção de fabricar) e veja a mágica!
    tasks:
      - check
    rewards:
      - xp: 1

  - id: autocraft_info
    title: "Fabricação vs. Processamento"
    type: info
    deps: [padrao_codificado, montador_molecular]
    icon: appliedenergistics2:item.ItemEncodedPattern
    desc: |
      Dois tipos de padrão, dois destinos:

      §e• Padrão de Fabricação§r (receita de bancada): vai numa §eInterface§r encostada num
      §eMontador Molecular§r. O montador faz a receita.
      §e• Padrão de Processamento§r (máquinas): vai numa §eInterface encostada na máquina§r. A
      Interface empurra os ingredientes para a máquina; o resultado precisa §evoltar para a
      rede§r (por um Barramento de Importação, ou empurrado para a própria Interface).

      §aDica:§r o "Modo de Bloqueio" da Interface evita que ela mande o próximo lote antes da
      máquina terminar o anterior — essencial para máquinas com várias entradas.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: primeiro_autocraft
    title: "A Rede que Fabrica"
    type: milestone
    deps: [cpu_info, autocraft_info, interface]
    icon: appliedenergistics2:tile.BlockMolecularAssembler
    banner: "A Rede que Fabrica"
    subtitle: "Peça, e será feito"
    desc: |
      Você clica num item no Terminal, escolhe a quantidade... e a CPU calcula, a Interface
      distribui, o Montador Molecular monta e o resultado aparece nos discos. Herói, a sua
      rede §efabrica sozinha§r!

      Eu esperei séculos por este momento. Os Antigos tinham cidades inteiras funcionando
      assim, e quando a Fratura veio, as CPUs ficaram em silêncio. Você acabou de acordá-las.

      Próximos degraus:
      §e• Mais padrões§r — inclusive de processamento para fornalhas e máquinas.
      §e• Mais CPUs§r — para vários pedidos ao mesmo tempo.
      §e• Emissores de Nível com Cartão de Fabricação§r — fabricar sob demanda.
    tasks:
