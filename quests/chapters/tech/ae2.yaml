    title: "Cabos Âncora e Fachadas"
    type: optional
    deps: [faca_corte, cabo_vidro]
    icon: appliedenergistics2:item.ItemMultiPart:120
    desc: |
      Ferro + Faca de Corte = 3 §eCabos Âncora§r. Âncoras + um bloco na bancada viram §eFachadas§r: "capas" que escondem os cabos com a textura do bloco escolhido.
      Sala de servidores com paredes de madeira? Com fachadas, pode! Faça qualquer um dos dois. É opcional, mas deixa tudo muito mais bonito. Receita no NEI (R/U).
    tasks:
      - one_of: [appliedenergistics2:item.ItemMultiPart:120, appliedenergistics2:item.ItemFacade]
    rewards:
      - loot: comum

