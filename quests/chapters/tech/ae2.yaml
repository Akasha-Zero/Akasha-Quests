      São 65 536 bytes, a maior das células "básicas". Orgulhe-se, Herói! Em caso de dúvida, NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemBasicStorageCell.64k
    rewards:
      - xp: 4
      - item: appliedenergistics2:item.ItemMultiMaterial:24 x2

  - id: encaixe_avancado
    title: "Encaixe de Armazenamento Avançado"
    type: optional
    deps: [componente_64k]
    icon: appliedenergistics2:item.ItemMultiMaterial:61
    desc: |
