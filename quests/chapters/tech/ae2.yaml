    rewards:
      - xp: 12
      - kit: {name: "Kit do Cartógrafo Espacial", items: [appliedenergistics2:item.ItemMultiMaterial:33 x1, appliedenergistics2:tile.BlockSpatialPylon x8, appliedenergistics2:tile.BlockDenseEnergyCell x1, minecraft:glowstone x8, appliedenergistics2:item.ItemMultiMaterial:9 x4]}
      - loot: epico

  # ======================================================================
  # FASE 8 — FERRAMENTAS E CURIOSIDADES
  # ======================================================================
  - id: cajado_carregado
    title: "Cajado Carregado"
    type: optional
    deps: [carregador]
    icon: appliedenergistics2:item.ToolChargedStaff
    desc: |
      Um Cristal Carregado na ponta de 2 ferros = §eCajado Carregado§r. Ele dá choques nos inimigos usando energia.
      Recarregue no Carregador e saia distribuindo faíscas, Herói! Opcional, mas divertido, e bom para quem quer uma arma diferente. Receita no NEI (R/U). Não esqueça de recarregá-lo quando a energia acabar, viu?
    tasks:
      - get: appliedenergistics2:item.ToolChargedStaff
    rewards:
      - loot: comum

  - id: manipulador_entropia
    title: "Manipulador de Entropia"
    type: optional
    deps: [celula_energia, processador_engenharia]
    icon: appliedenergistics2:item.ToolEntropyManipulator
    desc: |
      O §eManipulador de Entropia§r (Fluix, Processador de Engenharia, Célula de Energia e ferro) esquenta ou esfria blocos: derrete gelo, transforma água em gelo, funde coisas no lugar...
      Experimente com e sem Shift. Recarregue no Carregador. Opcional, Herói. Receita no NEI (R/U). Teste em lugar seguro primeiro, para ver o que cada modo faz.
    tasks:
      - get: appliedenergistics2:item.ToolEntropyManipulator
    rewards:
      - loot: comum

  - id: aplicador_cor
    title: "Aplicador de Cor"
    type: optional
    deps: [nucleos, celula_energia]
    icon: appliedenergistics2:item.ToolColorApplicator
    desc: |
      O §eAplicador de Cor§r pinta cabos já instalados (e outros blocos) usando corantes, bolas de neve ou Bolas de Tinta guardadas numa célula interna.
      Recolorir uma rede inteira sem quebrar nada: um sonho! Opcional, Herói, mas deixa a base muito mais organizada. Receita no NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ToolColorApplicator
    rewards:
      - loot: comum

  - id: tnt_minuscula
    title: "TNT Minúscula"
    type: optional
    deps: [po_certus]
    icon: appliedenergistics2:tile.BlockTinyTNT
    desc: |
      2 Pós de Certus + 2 pólvoras = §eTNT Minúscula§r: uma explosão pequenininha, ótima para abrir caminho na Pedra do Céu ou cavar com precisão.
      Pequena, mas ainda é TNT, então §ccuidado§r onde você acende, Herói. Faça 2 e use com respeito. Receita no NEI (R/U).
    tasks:
      - get: appliedenergistics2:tile.BlockTinyTNT x2
    rewards:
      - loot: comum

  - id: iluminacao_quartzo
    title: "Iluminação de Quartzo"
    type: optional
    deps: [carregador]
    icon: appliedenergistics2:tile.BlockQuartzTorch
    desc: |
      Cristal Carregado + ferro = 2 §eInstalações de Quartzo Carregado§r, umas "tochas" de cristal elegantes. A §eInstalação Detectora de Luz§r (quartzo do Nether + ferro) emite redstone conforme a luz do ambiente.
      Faça qualquer uma, Herói. Opcional. Receitas no NEI (R/U). A tocha de cristal combina muito com a decoração de quartzo da sua sala.
    tasks:
      - one_of: [appliedenergistics2:tile.BlockQuartzTorch, appliedenergistics2:tile.BlockLightDetector]
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 9 — ARMAZENAMENTO EXTREMO E MARCO FINAL
  # ======================================================================
  - id: celula_fluido_quantica
    title: "Células de Fluido Extremas"
    type: optional
    deps: [celulas_fluido_maiores, ponte_quantica]
    icon: ae2fc:fluid_storage.quantum
    desc: |
      As versões líquidas das células extremas: §eFluid Quantum§r (Anéis Quânticos + componentes de fluido 16384k), §eDigital Singularity§r e §eArtificial Universe§r.
      Faça qualquer uma, e guarde um oceano inteiro, Herói! Opcional, mas é o auge do armazenamento de fluidos. Receitas no NEI (R/U). Vá com calma, porque os componentes pedem muito material.
    tasks:
      - one_of: [ae2fc:fluid_storage.quantum, ae2fc:fluid_storage.singularity, ae2fc:fluid_storage.Universe]
    rewards:
      - loot: epico

  - id: armazenamento_singularidade
    title: "Singularity Crafting Storage"
    type: optional
    deps: [celula_quantica, cpu_avancada]
    icon: appliedenergistics2:tile.BlockSingularityCraftingStorage
    desc: |
      O topo absoluto da CPU: 8 células Digital Singularity + uma Unidade de Fabricação = §eSingularity Crafting Storage§r.
      Se você chegou até aqui, eu não tenho mais nada a ensinar sobre bytes. Só a aplaudir, Herói! Opcional, mas é o troféu de quem domina o AE2. Receitas no NEI (R/U).
    tasks:
      - get: appliedenergistics2:tile.BlockSingularityCraftingStorage
    rewards:
      - loot: epico

  - id: celula_quantica
    title: "Célula de Armazenamento Quântica"
    type: optional
    deps: [celulas_gigantes, ponte_quantica]
    icon: appliedenergistics2:item.ItemExtremeStorageCell.Quantum
    desc: |
      Para quem acha 16384k pouco: 4 Anéis Quânticos + 4 Componentes 16384k + uma Célula Densa
      de Energia = §eQuantum ME Storage Cell§r. Daqui saem ainda a "Digital Singularity" (8
      quânticas + Condensador) e a "Artificial Universe" (com Singularidades e uma Estrela do
      Nether). Faça qualquer uma.
    tasks:
      - one_of: [appliedenergistics2:item.ItemExtremeStorageCell.Quantum, appliedenergistics2:item.ItemExtremeStorageCell.Singularity, appliedenergistics2:item.ItemExtremeStorageCell.Universe]
    rewards:
      - loot: epico

  - id: mestre_me
    title: "Maestria do Armazenamento Digital"
    type: milestone
    deps: [fabrica_digital, rede_fluidos, ponte_quantica, espaco_guardado, armazem_digital]
    icon: appliedenergistics2:tile.BlockController
    banner: "Mestre do Armazenamento Digital"
    subtitle: "O Volume do Armazenamento Digital está completo"
    effect: 3
    desc: |
      Herói... deixa eu respirar fundo (no sentido figurado — eu sou um livro).

      Você começou quebrando um minério azulado. Jogou cristais na água e viu o Fluix nascer.
      Caçou meteoritos atrás de quatro prensas caídas do céu. Gravou processadores, ligou o
      primeiro Controlador e viu o mundo caber num disco. Ensinou a rede a mover, depois a
      fabricar, depois a cuidar de fluidos. Atravessou o espaço com túneis e pontes quânticas.
      E, por fim, guardou o próprio espaço dentro de um cristal.

      §bO Volume do Armazenamento Digital está reescrito.§r Esta página é uma das mais
      brilhantes do §6Selo da Engrenagem§r: nenhuma grande indústria do Registro funciona sem
      um sistema que lembre de tudo.

      Obrigada, de coração. Agora vá — e ligue essa rede a cada máquina do pack.
    tasks:
      - get: [appliedenergistics2:tile.BlockController, appliedenergistics2:tile.BlockMolecularAssembler, ae2fc:fluid_interface, appliedenergistics2:tile.BlockQuantumLinkChamber, appliedenergistics2:tile.BlockSpatialIOPort]
    rewards:
      - xp: 15
      - kit: {name: "Legado do Mestre ME", items: [appliedenergistics2:item.ItemAdvancedStorageCell.256k x1, ae2fc:fluid_storage64 x1, appliedenergistics2:tile.BlockCraftingUnit:3 x1, appliedenergistics2:item.ItemMultiMaterial:30 x4, appliedenergistics2:tile.BlockDenseEnergyCell x2]}
      - loot: [epico x2]
