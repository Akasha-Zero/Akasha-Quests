    rewards:
      - xp: 4
      - choice: [minecraft:sticky_piston x2, appliedenergistics2:item.ItemMultiMaterial:44 x2, minecraft:iron_ingot x8]

  - id: barramento_exportacao
    title: "Barramento de Exportação ME"
    type: main
    deps: [nucleos, primeira_rede]
    icon: appliedenergistics2:item.ItemMultiPart:260
    desc: |
      Agora o contrário: ferro + Núcleo de Formação + pistão = §eBarramento de Exportação§r. Ele §eempurra§r para fora os itens que você configurar no filtro.
