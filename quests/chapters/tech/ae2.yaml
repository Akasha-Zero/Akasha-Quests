chapter:
  id: ae2
  title: "Applied Energistics 2"
  prefix: ""
  order: 370
  icon: appliedenergistics2:tile.BlockController
  desc: |
    §bO Volume do Armazenamento Digital.§r Quartzo certus, meteoritos, prensas, canais, células
    de bytes, fabricação automática, fluidos, túneis P2P, pontes quânticas e espaço guardado
    num cristal. (Applied Energistics 2 rv3-beta-1035-GTNH + AE2 Fluid Crafting +
    NotEnoughEnergistics)

quests:
  # ======================================================================
  # FASE 0 — QUARTZO E METEORITOS
  # ======================================================================
  - id: certus
    title: "Quartzo Certus"
    type: main
    icon: appliedenergistics2:tile.OreQuartz
    desc: |
      Sabe o que os Antigos usavam para guardar o mundo inteiro dentro de uma caixinha?
      Cristais. Mais especificamente: §eQuartzo Certus§r.

      O §eMinério de Quartzo Certus§r gera no subsolo do mundo normal, em pequenos veios
      (parece um minério de quartzo azulado). Quebre com picareta de ferro ou melhor e junte
      §e16 Cristais de Quartzo Certus§r. Fortuna ajuda — e muito!

      Este Volume inteiro é construído em cima desse cristal. Bem-vindo à era digital, Herói!
    tasks:
      - get: ore:crystalCertusQuartz x16
    rewards:
      - xp: 4
      - choice: [minecraft:iron_ingot x16, minecraft:redstone x16, minecraft:torch x32]

  - id: certus_carregado
    title: "Certus Carregado"
    type: main
    deps: [certus]
    icon: appliedenergistics2:item.ItemMultiMaterial:1
    desc: |
      Alguns veios de certus vêm §ecarregados§r: o §eMinério de Quartzo Certus Carregado§r
      brilha e solta faíscas (neste pack, cerca de 8% dos veios). Quebrando-o, você recebe
      §eCristais Carregados de Quartzo Certus§r.

      No começo, esse é o único jeito de conseguir cristais carregados — e eles são a chave
      do Fluix, da Bússola de Meteoritos e do Carregador. Junte §e4§r.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:1 x4
    rewards:
      - xp: 4
      - choice: [minecraft:redstone x16, minecraft:quartz x8, minecraft:iron_pickaxe x1]

  - id: quartzo_nether
    title: "Quartzo do Nether"
    type: normal
    deps: [certus]
    icon: minecraft:quartz
    desc: |
      O AE2 também usa o velho conhecido §eQuartzo do Nether§r: no Fluix, nos Núcleos de
      Aniquilação, nas ferramentas de quartzo e nos Detectores de Luz. Faça uma viagem ao
      Nether e traga §e16§r.
      §cLembre:§r leve armadura, comida e um balde de água... ah não, água não funciona lá.
      Leve blocos!
    tasks:
      - get: minecraft:quartz x16
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x4

  - id: fluix
    title: "Cristal de Fluix"
    type: main
    deps: [certus_carregado, quartzo_nether]
    icon: appliedenergistics2:item.ItemMultiMaterial:7
    desc: |
      Agora uma alquimia moderna! Jogue §edentro da água§r (água parada, um bloco de fonte):
      §e1 Cristal Carregado de Certus + 1 Pó de Redstone + 1 Quartzo do Nether§r. Depois de
      alguns segundos, eles se fundem em §e2 Cristais de Fluix§r!

      O Fluix é o "sangue" das redes ME: cabos, controladores, cartões, planos... Faça §e8§r.
      §aDica:§r jogue um item de cada vez, todos no mesmo bloco de água.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:7 x8
    rewards:
      - xp: 4
      - choice: [minecraft:redstone x32, minecraft:quartz x8, minecraft:water_bucket x1]

  - id: rebolo
    title: "Rebolo de Quartzo"
    type: main
    deps: [certus]
    icon: appliedenergistics2:tile.BlockGrinder
    desc: |
      Antes de qualquer máquina elétrica, um moinho à moda antiga. O §eRebolo de Quartzo§r
      (pedra, pedregulho, cristais de certus e uma §eengrenagem de madeira§r do BuildCraft no
      centro) mói itens quando você gira a §eManivela de Madeira§r (5 gravetos) colocada em
      cima dele.

      Ele faz Pó de Certus, Pó de Quartzo do Nether, Pó de Fluix, Farinha e mais. Clique com o
      botão direito na manivela até a mó girar. É braçal, mas funciona sem energia!
    tasks:
      - get: [appliedenergistics2:tile.BlockGrinder, appliedenergistics2:tile.BlockCrank]
    rewards:
      - xp: 4
      - choice: [BuildCraft|Core:woodenGearItem x2, minecraft:cobblestone x32, minecraft:stick x16]

  - id: po_certus
    title: "Pó de Quartzo Certus"
    type: normal
    deps: [rebolo]
    icon: appliedenergistics2:item.ItemMultiMaterial:2
    desc: |
      Hora de moer! Cristais (ou minério) de certus viram pó no Rebolo, e quase toda máquina de moagem do pack aceita o serviço: Triturador, Pulverizador, Moinho SAG...
      Junte §e16 Pós de Quartzo Certus§r. Eles viram Vidro de Quartzo, Fibra de Quartzo e Sementes de Cristal, então vão sumir rápido. Se tiver dúvida de qual máquina serve, aperte R ou U no NEI.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:2 x16
    rewards:
      - xp: 2
      - item: minecraft:sand x16

  - id: po_nether
    title: "Pó de Quartzo do Nether"
    type: optional
    deps: [rebolo, quartzo_nether]
    icon: appliedenergistics2:item.ItemMultiMaterial:3
    desc: |
      Sobrou quartzo do Nether? Moa e você ganha §ePó de Quartzo do Nether§r. Misturado com areia, ele faz Sementes de Quartzo do Nether, que crescem na água até virar Cristal Puro de Quartzo do Nether.
      É opcional, mas vale a pena. Junte 4 e, se não souber qual máquina mói, confira no NEI com R ou U.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:3 x4
    rewards:
      - loot: comum

  - id: farinha
    title: "Farinha"
    type: optional
    deps: [rebolo]
    icon: appliedenergistics2:item.ItemMultiMaterial:4
    desc: |
      Uma pausa para o pão! Trigo no Rebolo vira §eFarinha§r, que vale como "pó de trigo" no oredict e entra em receitas de pão e massas de outros mods.
      Junte 8 se quiser. O AE2 é tecnológico, mas também gosta de um pão quentinho. Se a receita que você procura não aparecer, olhe no NEI com R ou U.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:4 x8
    rewards:
      - loot: comum

  - id: ferramentas_quartzo
    title: "Ferramentas de Quartzo"
    type: optional
    deps: [certus]
    icon: appliedenergistics2:item.ToolCertusQuartzPickaxe
    desc: |
      Certus ou Quartzo do Nether também viram ferramentas: picareta, machado, pá, enxada e espada, com durabilidade parecida com a do ferro.
      Faça qualquer uma delas, Herói. Elas quebram o galho enquanto o ferro estiver em falta. Não é obrigatório, mas é um bom reforço para o começo. As receitas estão no NEI (R/U).
    tasks:
      - one_of: [appliedenergistics2:item.ToolCertusQuartzPickaxe, appliedenergistics2:item.ToolCertusQuartzAxe, appliedenergistics2:item.ToolCertusQuartzSpade, appliedenergistics2:item.ToolCertusQuartzSword, appliedenergistics2:item.ToolCertusQuartzHoe, appliedenergistics2:item.ToolNetherQuartzPickaxe, appliedenergistics2:item.ToolNetherQuartzAxe, appliedenergistics2:item.ToolNetherQuartzSpade, appliedenergistics2:item.ToolNetherQuartzSword, appliedenergistics2:item.ToolNetherQuartzHoe]
    rewards:
      - loot: comum

  - id: chave_quartzo
    title: "Chave de Quartzo"
    type: normal
    deps: [certus]
    icon: appliedenergistics2:item.ToolCertusQuartzWrench
    desc: |
      Chegou a ferramenta que todo engenheiro de rede carrega! 5 cristais de quartzo (certus ou do Nether) em forma de chave dão a §eChave de Quartzo§r.
      Ela gira blocos do AE2 e, com Shift, desmonta peças da rede. É também a base da §eFerramenta de Rede§r, mais à frente. Guarde bem a sua, ela vai ser muito usada.
    tasks:
      - one_of: [appliedenergistics2:item.ToolCertusQuartzWrench, appliedenergistics2:item.ToolNetherQuartzWrench]
    rewards:
      - xp: 2
      - item: appliedenergistics2:item.ItemMultiMaterial x4

  - id: faca_corte
    title: "Faca de Corte de Quartzo"
    type: optional
    deps: [certus]
    icon: appliedenergistics2:item.ToolCertusQuartzCuttingKnife
    desc: |
      Quer capricho na rede? Ferro, 2 cristais de quartzo e gravetos fazem a §eFaca de Corte§r.
      Junto com ferro na bancada, ela faz §eCabos Âncora§r, o suporte das fachadas. Abrindo a faca, você também grava nomes em itens com a Prensa de Nome. É opcional, mas ajuda a organizar tudo. Dúvidas na receita? NEI, R ou U.
    tasks:
      - one_of: [appliedenergistics2:item.ToolCertusQuartzCuttingKnife, appliedenergistics2:item.ToolNetherQuartzCuttingKnife]
    rewards:
      - loot: comum

  - id: vidro_quartzo
    title: "Vidro de Quartzo"
    type: main
    deps: [po_certus]
    icon: appliedenergistics2:tile.BlockQuartzGlass
    desc: |
      Transparência com classe! 5 Pós de Quartzo Certus (ou do Nether) intercalados com 4 vidros dão §e4 Vidros de Quartzo§r.
      Ele aparece em muita coisa: células de armazenamento, aceitadores de energia, painéis, pilões espaciais... Faça §e8§r e guarde. Bonito, transparente e, eu juro, digitalmente nobre. Você vai agradecer o estoque depois.
    tasks:
      - get: appliedenergistics2:tile.BlockQuartzGlass x8
    rewards:
      - xp: 4
      - choice: [minecraft:glass x16, minecraft:sand x32, appliedenergistics2:item.ItemMultiMaterial:2 x8]

  - id: vidro_vibrante
    title: "Vidro Vibrante de Quartzo"
    type: optional
    deps: [vidro_quartzo]
    icon: appliedenergistics2:tile.BlockQuartzLamp
    desc: |
      Que tal iluminar a sala do servidor com estilo? Vidro de Quartzo + 2 pós de glowstone fazem o §eVidro Vibrante§r, um vidro que também ilumina.
      É decoração de luxo e ainda serve de ingrediente para as células de fluido mais avançadas. Opcional, mas lindo, Herói. Confira a receita no NEI (R/U) se precisar.
    tasks:
      - get: appliedenergistics2:tile.BlockQuartzLamp x4
    rewards:
      - loot: comum

  - id: blocos_certus
    title: "Arquitetura de Quartzo"
    type: optional
    deps: [certus]
    icon: appliedenergistics2:tile.BlockQuartzPillar
    desc: |
      Dá para construir bonito com certus! 4 cristais fazem 1 Bloco de Quartzo Certus, e o bloco volta a ser 4 cristais quando você quiser.
      Dele saem pilares, blocos talhados, escadas e lajes. Faça qualquer um deles. Imagina uma sala de servidores com piso de certus... que lindo! Se quiser ver todas as variações, abra o NEI (R/U).
    tasks:
      - one_of: [appliedenergistics2:tile.BlockQuartz, appliedenergistics2:tile.BlockQuartzPillar, appliedenergistics2:tile.BlockQuartzChiseled]
    rewards:
      - loot: comum

  - id: carregador
    title: "Carregador"
    type: main
    deps: [fluix]
    icon: appliedenergistics2:tile.BlockCharger
    desc: |
      Chega de depender da sorte com minério carregado! O §eCarregador§r (5 ferros e 2
      Cristais de Fluix) carrega Cristais de Quartzo Certus comuns, transformando-os em
      §eCristais Carregados§r.

      Ele precisa de energia: ligue RF/EU direto, a rede ME... ou, no começo, gire uma
      §eManivela de Madeira§r em cima dele. Também recarrega ferramentas do AE2, como o
      Terminal Sem Fio.
    tasks:
      - get: appliedenergistics2:tile.BlockCharger
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:tile.BlockCrank x1, ore:crystalCertusQuartz x8, minecraft:iron_ingot x8]

  - id: carga_em_serie
    title: "Carga em Série"
    type: normal
    deps: [carregador]
    icon: appliedenergistics2:item.ItemMultiMaterial:1
    desc: |
      Agora que o Carregador está funcionando, cristal carregado deixa de ser sorte. Carregue §e16 Cristais de Quartzo Certus§r, um de cada vez ou automatizando com funis e tubos.
      §aDica:§r com o Fluix ficando barato, vale montar uma "piscina" de fabricação de Fluix perto do Carregador. Poupa muito trabalho, você vai ver!
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:1 x16
    rewards:
      - xp: 2
      - item: minecraft:redstone x16

  - id: bussola_meteoritos
    title: "Bússola de Meteoritos"
    type: main
    deps: [certus_carregado]
    icon: appliedenergistics2:tile.BlockSkyCompass
    desc: |
      Pedras do céu caíram durante a Fratura — e dentro delas estão as §eprensas§r que
      imprimem os circuitos do AE2.

      A §eBússola de Meteoritos§r (4 ferros em volta de um Cristal Carregado) aponta para o
      meteorito mais próximo. Neste pack eles caem §esó no mundo normal§r, com bastante
      distância entre si. Siga a agulha... e prepare-se para cavar.
    tasks:
      - get: appliedenergistics2:tile.BlockSkyCompass
    rewards:
      - xp: 4
      - choice: [minecraft:bread x16, minecraft:torch x32, minecraft:iron_shovel x1]

  - id: meteorito
    title: "Pedra do Céu"
    type: main
    deps: [bussola_meteoritos]
    icon: appliedenergistics2:tile.BlockSkyStone
    desc: |
      Achou a cratera? A rocha preta é §ePedra do Céu§r — duríssima, então use uma picareta
      boa (diamante é o ideal). Cave até o centro do meteorito: lá dentro há um §eBaú de
      Pedra do Céu§r com uma prensa, pepitas de metal e mais pedra.

      Junte §e16 Pedras do Céu§r. Elas viram Blocos de Pedra do Céu na fornalha, que entram no
      Controlador ME.
      §aDica:§r cada meteorito traz §euma§r das quatro prensas. Vai ser preciso visitar alguns!
    tasks:
      - get: appliedenergistics2:tile.BlockSkyStone x16
    rewards:
      - xp: 4
      - choice: [minecraft:diamond x1, minecraft:cooked_beef x16, minecraft:torch x32]

  - id: bloco_pedra_ceu
    title: "Bloco de Pedra do Céu"
    type: normal
    deps: [meteorito]
    icon: appliedenergistics2:tile.BlockSkyStone:1
    desc: |
      Pedra do Céu na fornalha vira §eBloco de Pedra do Céu§r, mais liso e bonito. Junte 4 deles, porque o Controlador ME leva exatamente essa quantidade.
      Os blocos também viram tijolos e tijolos pequenos para decoração, então não gaste tudo de uma vez. Se faltar Pedra do Céu, procure nos meteoritos. Receitas no NEI (R/U).
    tasks:
      - get: appliedenergistics2:tile.BlockSkyStone:1 x4
    rewards:
      - xp: 2
      - item: minecraft:coal x8

  - id: bau_pedra_ceu
    title: "Baú de Pedra do Céu"
    type: optional
    deps: [meteorito]
    icon: appliedenergistics2:tile.BlockSkyChest
    desc: |
      Segurança máxima! 8 Pedras do Céu fazem o §eBaú de Pedra do Céu§r, um baú resistente a explosões e com cara de ficção científica.
      É perfeito para guardar as suas prensas preciosas, Herói, longe de qualquer creeper mal-educado. Opcional, mas muito útil para quem gosta de dormir tranquilo. Receita no NEI (R/U).
    tasks:
      - one_of: [appliedenergistics2:tile.BlockSkyChest, appliedenergistics2:tile.BlockSkyChest:1]
    rewards:
      - loot: comum

  - id: prensa_calculo
    title: "Prensa de Cálculo"
    type: normal
    deps: [meteorito]
    icon: appliedenergistics2:item.ItemMultiMaterial:13
    desc: |
      A §ePrensa Inscritora de Cálculo§r imprime o Circuito de Cálculo a partir de um §eCristal
      Puro de Quartzo Certus§r. Sem ela, nada de Processador de Cálculo (células 4k, cartões,
      terminais de fabricação...).
      §aAlternativa do pack:§r 8 Essências de Certus do Magical Crops + 1 ferro também fazem
      esta prensa.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:13
    rewards:
      - xp: 3
      - item: minecraft:iron_block

  - id: prensa_engenharia
    title: "Prensa de Engenharia"
    type: normal
    deps: [meteorito]
    icon: appliedenergistics2:item.ItemMultiMaterial:14
    desc: |
      A §ePrensa Inscritora de Engenharia§r imprime o Circuito de Engenharia a partir de um §ediamante§r. Ela é a mais importante das prensas: o Processador de Engenharia vai no Controlador, no Acionador ME e em metade do mod.
      §aAlternativa:§r 8 Essências de Certus + 1 diamante. Escolha o caminho que for mais fácil para você!
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:14
    rewards:
      - xp: 3
      - item: minecraft:iron_block

  - id: prensa_logica
    title: "Prensa Lógica"
    type: normal
    deps: [meteorito]
    icon: appliedenergistics2:item.ItemMultiMaterial:15
    desc: |
      Próxima prensa da coleção! A §ePrensa Inscritora Lógica§r imprime o Circuito Lógico a partir de um §elingote de ouro§r.
      O Processador Lógico aparece nos Componentes de Armazenamento, nos Núcleos e no Terminal ME, então ela vai trabalhar bastante.
      §aAlternativa:§r 8 Essências de Certus + 1 ouro. Qualquer dúvida, o NEI (R/U) mostra tudo.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:15
    rewards:
      - xp: 3
      - item: minecraft:iron_block

  - id: prensa_silicio
    title: "Prensa de Silício"
    type: normal
    deps: [meteorito]
    icon: appliedenergistics2:item.ItemMultiMaterial:19
    desc: |
      A §ePrensa de Silício§r (o jogo escreve "Compressa Inscitora de Silício", tradução criativa!) imprime o §eSilício Impresso§r, que entra em §etodos§r os três processadores. Sem ela, nada de processador.
      §aAlternativa:§r 8 Essências de Certus + um silício. É a terceira e última prensa, Herói, falta pouco!
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:19
    rewards:
      - xp: 3
      - item: minecraft:iron_block

  - id: tijolos_pedra_ceu
    title: "Tijolos de Pedra do Céu"
    type: optional
    deps: [bloco_pedra_ceu]
    icon: appliedenergistics2:tile.BlockSkyStone:2
    desc: |
      Quer um ciclo decorativo infinito? Bloco de Pedra do Céu na bancada vira §eTijolos§r, que viram §eTijolos Pequenos§r, que voltam a ser Bloco.
      Pedra do Céu é resistente a explosões, então é ótima para as paredes da sala do Controlador. Faça qualquer tipo e capriche no visual. As receitas estão no NEI (R/U).
    tasks:
      - one_of: [appliedenergistics2:tile.BlockSkyStone:2, appliedenergistics2:tile.BlockSkyStone:3]
    rewards:
      - loot: comum

  - id: quatro_prensas
    title: "As Quatro Prensas"
    type: milestone
    deps: [prensa_calculo, prensa_engenharia, prensa_logica, prensa_silicio]
    icon: appliedenergistics2:item.ItemMultiMaterial:14
    banner: "As Quatro Prensas"
    subtitle: "Os moldes caídos do céu"
    desc: |
      Cálculo, Engenharia, Lógica e Silício. Herói, você juntou os quatro moldes que os
      Antigos deixaram cair do céu! Sem eles não existe AE2 — com eles, existe §etudo§r.

      §cGuarde-as como relíquias.§r As prensas não se gastam no Inscritor, mas perder uma
      significa voltar a caçar meteoritos.
      §aDica de ouro:§r o Inscritor também §ecopia prensas§r — uma prensa + um bloco de ferro
      geram uma cópia. Faça reservas!

      Agora, ao Inscritor.
    tasks:
      - get: [appliedenergistics2:item.ItemMultiMaterial:13, appliedenergistics2:item.ItemMultiMaterial:14, appliedenergistics2:item.ItemMultiMaterial:15, appliedenergistics2:item.ItemMultiMaterial:19]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Caçador de Meteoritos", items: [minecraft:iron_block x4, ore:crystalCertusQuartz x16, appliedenergistics2:item.ItemMultiMaterial:7 x8, minecraft:diamond x2, minecraft:gold_ingot x8]}
      - loot: raro

  - id: sementes_cristal
    title: "Sementes de Cristal"
    type: normal
    deps: [po_certus]
    icon: appliedenergistics2:item.ItemCrystalSeed
    desc: |
      Areia + Pó de Quartzo Certus = §e2 Sementes de Quartzo Certus§r (com Pó de Fluix ou de
      Quartzo do Nether, saem sementes de Fluix ou de Nether).

      §eJogue as sementes na água§r e espere: elas crescem devagar até virar §eCristais
      Puros§r. O tooltip mostra o progresso. Faça várias de uma vez!
    tasks:
      - get: appliedenergistics2:item.ItemCrystalSeed:* x4
    rewards:
      - xp: 2
      - item: minecraft:sand x32

  - id: cristal_puro
    title: "Cristal Puro de Quartzo Certus"
    type: main
    deps: [sementes_cristal]
    icon: appliedenergistics2:item.ItemMultiMaterial:10
    desc: |
      Paciência recompensada! As sementes que cresceram na água viram §eCristais Puros de Quartzo Certus§r. Eles são o material do Circuito de Cálculo, e 8 deles fazem um bloco de certus.

      Junte §e4§r. Com o Acelerador de Crescimento, tudo isso fica muito mais rápido. Não desanime se demorar um pouquinho, Herói, o cristal vale a espera.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:10 x4
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:item.ItemMultiMaterial:2 x16, minecraft:sand x32, minecraft:water_bucket x1]

  - id: fluix_puro
    title: "Cristal Fluix Puro"
    type: normal
    deps: [sementes_cristal, po_fluix]
    icon: appliedenergistics2:item.ItemMultiMaterial:12
    desc: |
      Sementes de Fluix (areia + Pó de Fluix) crescem na água até virar §eCristais Fluix Puros§r. É um processo parecido com o do certus, só que mais colorido.
      Junte §e4§r, porque o Controlador ME leva exatamente 4 deles. Deixe as sementes na água e tenha paciência. Se precisar rever a receita, o NEI (R/U) ajuda.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:12 x4
    rewards:
      - xp: 3
      - item: appliedenergistics2:item.ItemMultiMaterial:8 x4

  - id: nether_puro
    title: "Cristal Puro de Quartzo do Nether"
    type: optional
    deps: [sementes_cristal, po_nether]
    icon: appliedenergistics2:item.ItemMultiMaterial:11
    desc: |
      Hora da versão do Nether! O §eCristal Puro de Quartzo do Nether§r cresce de sementes na água, sem você precisar sair de casa.
      Ele vale como quartzo do Nether nas receitas, ou seja, é quartzo renovável sem visitar o Nether. Junte 4. Opcional, mas muito prático para quem odeia lava. Receitas no NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:11 x4
    rewards:
      - loot: comum

  - id: fazenda_cristais
    title: "Fazenda de Cristais"
    type: normal
    deps: [cristal_puro]
    icon: appliedenergistics2:item.ItemMultiMaterial:10
    desc: |
      Monte uma §efazenda de cristais§r: um poço de água, um funil embaixo e um bom estoque de sementes. Cristais Puros de Certus viram blocos (8 → 1) e depois 4 cristais comuns, ou seja, a semente multiplica o seu quartzo.
      Junte §e16 Cristais Puros§r e deixe a fazenda trabalhar sozinha. Bom plantio, Herói!
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:10 x16
    rewards:
      - xp: 2
      - item: minecraft:sand x64

  - id: acelerador_crescimento
    title: "Acelerador de Crescimento de Cristais"
    type: optional
    deps: [cristal_puro, cabo_vidro, aceitador_energia]
    icon: appliedenergistics2:tile.BlockQuartzGrowthAccelerator
    desc: |
      Quer cristais em minutos? O §eAcelerador de Crescimento de Cristais§r (ferro, Vidro de Quartzo, Cabos de Vidro e um Bloco de Fluix) precisa estar energizado e encostado na água onde estão as sementes.
      Vários aceleradores em volta aceleram muito o crescimento. Fazenda de quartzo oficialmente aberta! Receita no NEI (R/U).
    tasks:
      - get: appliedenergistics2:tile.BlockQuartzGrowthAccelerator
    rewards:
      - loot: incomum

  - id: po_fluix
    title: "Pó de Fluix"
    type: normal
    deps: [fluix, rebolo]
    icon: appliedenergistics2:item.ItemMultiMaterial:8
    desc: |
      Moa Cristais de Fluix e ganhe §ePó de Fluix§r. Ele serve para sementes de fluix, Células de Energia, Núcleos de Formação e Aniquilação, Condensador de Matéria... uma lista longa!
      Junte §e8§r para não ficar sem. Se não souber qual máquina mói cristais, aperte R ou U no NEI, Herói, que ele mostra as opções.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:8 x8
    rewards:
      - xp: 2
      - item: minecraft:redstone x16

  - id: perola_fluix
    title: "Pérola de Fluix"
    type: normal
    deps: [po_fluix]
    icon: appliedenergistics2:item.ItemMultiMaterial:9
    desc: |
      Uma pérola do Fim envolvida por Pó e Cristais de Fluix dá a §ePérola de Fluix§r. Ela é o coração do Receptor Sem Fio, da Câmara de Ligação Quântica e dos Componentes Espaciais.
      Junte 2, mas já vá se preparando, porque vai precisar de mais adiante. Confira a receita completa no NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:9 x2
    rewards:
      - xp: 2
      - item: minecraft:ender_pearl x2

  - id: bloco_fluix
    title: "Bloco de Fluix"
    type: optional
    deps: [fluix]
    icon: appliedenergistics2:tile.BlockFluix
    desc: |
      Quatro Cristais de Fluix fazem 1 Bloco de Fluix (e ele volta a ser cristais quando quiser). Roxo, brilhante, digno de uma sala de controle!
      O bloco também vai no Acelerador de Crescimento, então é útil além de bonito. Opcional, mas vale fazer um, Herói. A receita completa está no NEI (R/U).
    tasks:
      - get: appliedenergistics2:tile.BlockFluix
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 1 — INSCRITOR E PROCESSADORES
  # ======================================================================
  - id: inscritor
    title: "Inscritor"
    type: main
    deps: [fluix, quatro_prensas]
    icon: appliedenergistics2:tile.BlockInscriber
    desc: |
      A impressora dos Antigos! O §eInscritor§r (5 ferros, um Cristal de Fluix e 2 pistões
      grudentos) usa as prensas para gravar circuitos.

      Ele precisa de §eenergia§r (RF/EU direto ou pela rede ME). Coloque a prensa no slot de
      cima (ou de baixo), o material no meio e espere. Uma prensa no slot não é gasta.
      §aDica:§r tenha um Inscritor para cada prensa — trocar prensa toda hora cansa!
    tasks:
      - get: appliedenergistics2:tile.BlockInscriber
    rewards:
      - xp: 5
      - choice: [minecraft:sticky_piston x2, minecraft:iron_ingot x16, appliedenergistics2:item.ItemMultiMaterial:7 x4]

  - id: inscritor_info
    title: "Como o Inscritor Pensa"
    type: info
    deps: [inscritor]
    icon: appliedenergistics2:item.ItemMultiMaterial:20
    desc: |
      Os processadores saem em duas etapas:

      §e1. Circuitos impressos§r (prensa + material):
      §e• Cálculo:§r prensa de cálculo + Cristal Puro de Certus.
      §e• Engenharia:§r prensa de engenharia + diamante.
      §e• Lógico:§r prensa lógica + lingote de ouro.
      §e• Silício Impresso:§r prensa de silício + Silício.

      §e2. Processador§r: circuito impresso no slot de cima, Silício Impresso no de baixo e
      §eredstone§r no meio.

      §aCópia de prensa:§r prensa + bloco de ferro no Inscritor = outra prensa igual. Tudo isso
      aparece no NEI (aba "Inscritor").
    tasks:
      - check
    rewards:
      - xp: 1

  - id: silicio
    title: "Silício"
    type: normal
    deps: [inscritor]
    icon: EnderIO:itemMaterial
    desc: |
      Atenção a este detalhe: neste pack o AE2 não tem silício próprio. A Prensa de Silício aceita o §eSilício do EnderIO ou do Galacticraft§r (qualquer "itemSilicon").
      Uma forma fácil é triturar §eareia§r: o Moinho SAG do EnderIO e o Triturador do Mekanism fazem isso. Junte §e8§r e siga em frente!
    tasks:
      - get: ore:itemSilicon x8
    rewards:
      - xp: 2
      - item: minecraft:sand x32

  - id: circuito_calculo
    title: "Circuito Impresso de Cálculo"
    type: normal
    deps: [inscritor_info, cristal_puro]
    icon: appliedenergistics2:item.ItemMultiMaterial:16
    desc: |
      Prensa de Cálculo + Cristal Puro de Quartzo Certus = §eCircuito Impresso de Cálculo§r. Coloque os dois no Inscritor e deixe a máquina imprimir.
      Faça §e4§r para começar, Herói. Eles vão virar Processadores de Cálculo logo, então já guarde o resto do cristal puro. Se travar na receita, o NEI (R/U) mostra o passo a passo.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:16 x4
    rewards:
      - xp: 2
      - item: appliedenergistics2:item.ItemMultiMaterial:10 x2

  - id: circuito_engenharia
    title: "Circuito Impresso de Engenharia"
    type: normal
    deps: [inscritor_info]
    icon: appliedenergistics2:item.ItemMultiMaterial:17
    desc: |
      Prensa de Engenharia + diamante (o diamante industrial do IC2 também serve) = §eCircuito Impresso de Engenharia§r. Coloque tudo no Inscritor e pronto.
      É o mais caro dos três, então comece uma reserva de diamantes agora. Faça 4 por enquanto. Quem tem diamante guardado já sai na frente, Herói!
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:17 x4
    rewards:
      - xp: 3
      - item: minecraft:diamond

  - id: circuito_logico
    title: "Circuito Impresso Lógico"
    type: normal
    deps: [inscritor_info]
    icon: appliedenergistics2:item.ItemMultiMaterial:18
    desc: |
      Prensa Lógica + lingote de ouro = §eCircuito Impresso Lógico§r. Coloque os dois no Inscritor e a máquina cuida do resto.
      Você vai precisar de MUITOS, porque cada componente de armazenamento leva um processador lógico. Faça 4 agora e já separe bastante ouro para as próximas levas. Boa produção, Herói!
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:18 x4
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x4

  - id: silicio_impresso
    title: "Silício Impresso"
    type: normal
    deps: [inscritor_info, silicio]
    icon: appliedenergistics2:item.ItemMultiMaterial:20
    desc: |
      Prensa de Silício + Silício = §eSilício Impresso§r. Ele vai no slot de baixo de todo processador, então nunca é demais ter estoque.
      Faça §e8§r e guarde. Se o silício estiver acabando, lembre que o Moinho SAG e o Triturador do Mekanism transformam areia nele. Qualquer dúvida de receita, NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:20 x8
    rewards:
      - xp: 2
      - item: ore:itemSilicon x4

  - id: processador_logico
    title: "Processador Lógico"
    type: main
    deps: [circuito_logico, silicio_impresso]
    icon: appliedenergistics2:item.ItemMultiMaterial:22
    desc: |
      Circuito Lógico (em cima) + redstone (no meio) + Silício Impresso (embaixo) = §eProcessador Lógico§r. Monte no Inscritor, que aceita as três peças.
      Ele aparece em componentes de armazenamento, Núcleos de Formação e Aniquilação e no Terminal ME. Faça §e4§r e vá se acostumando, porque a rede toda depende dele!
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:22 x4
    rewards:
      - xp: 5
      - choice: [minecraft:gold_ingot x8, minecraft:redstone x32, ore:itemSilicon x4]

  - id: processador_calculo
    title: "Processador de Cálculo"
    type: main
    deps: [circuito_calculo, silicio_impresso]
    icon: appliedenergistics2:item.ItemMultiMaterial:23
    desc: |
      Circuito de Cálculo + redstone + Silício Impresso = §eProcessador de Cálculo§r. Monte no Inscritor com o circuito em cima e o silício embaixo.
      Ele é usado em cartões, Célula Densa de Energia, Emissor de Nível, Terminal de Fabricação, Componente 4k... Faça §e4§r. Se esquecer a ordem das peças, confira no NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:23 x4
    rewards:
      - xp: 5
      - choice: [appliedenergistics2:item.ItemMultiMaterial:10 x4, minecraft:redstone x32, ore:itemSilicon x4]

  - id: processador_engenharia
    title: "Processador de Engenharia"
    type: main
    deps: [circuito_engenharia, silicio_impresso]
    icon: appliedenergistics2:item.ItemMultiMaterial:24
    desc: |
      Circuito de Engenharia + redstone + Silício Impresso = §eProcessador de Engenharia§r. Monte no Inscritor, como os outros processadores.
      O Controlador ME leva 1, o Acionador ME leva 2, e ele aparece em quase todo bloco avançado. Faça §e4§r. Cuidado com o diamante, que anda pesando no bolso, Herói!
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:24 x4
    rewards:
      - xp: 5
      - choice: [minecraft:diamond x2, minecraft:redstone x32, ore:itemSilicon x4]

  - id: copia_prensa
    title: "Prensas de Reserva"
    type: optional
    deps: [inscritor_info]
    icon: minecraft:iron_block
    desc: |
      Prevenir é melhor que remediar! Coloque uma prensa e um §ebloco de ferro§r no Inscritor e sai uma cópia da prensa.
      Faça uma reserva de qualquer uma (tenha duas iguais) e durma tranquilo, porque as prensas originais são difíceis de recuperar se algo der errado. Opcional, mas muito recomendado. Receita no NEI (R/U).
    tasks:
      - one_of: [appliedenergistics2:item.ItemMultiMaterial:13 x2, appliedenergistics2:item.ItemMultiMaterial:14 x2, appliedenergistics2:item.ItemMultiMaterial:15 x2, appliedenergistics2:item.ItemMultiMaterial:19 x2]
    rewards:
      - loot: incomum

  - id: tres_processadores
    title: "Os Três Processadores"
    type: milestone
    deps: [processador_logico, processador_calculo, processador_engenharia]
    icon: appliedenergistics2:item.ItemMultiMaterial:24
    banner: "Os Três Processadores"
    subtitle: "Lógica, Cálculo e Engenharia"
    desc: |
      Lógico, de Cálculo e de Engenharia. Herói, você tem os três "cérebros" do AE2! Os
      Antigos chamavam isso de "a trindade digital" (tá, fui eu que inventei agora, mas
      combina, não combina?).

      §aRecomendação séria:§r automatize. Três Inscritores (um por circuito) + um quarto para o
      silício + um quinto para montar os processadores. Daqui a pouco você vai usar a própria
      rede ME para alimentá-los sozinha.

      Próximo passo: energia, cabos e o Controlador ME. A primeira rede está a poucos passos!
    tasks:
      - get: [appliedenergistics2:item.ItemMultiMaterial:22 x2, appliedenergistics2:item.ItemMultiMaterial:23 x2, appliedenergistics2:item.ItemMultiMaterial:24 x2]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Gravador de Circuitos", items: [appliedenergistics2:item.ItemMultiMaterial:20 x8, minecraft:diamond x4, minecraft:gold_ingot x8, appliedenergistics2:item.ItemMultiMaterial:10 x8, minecraft:redstone x32]}
      - loot: raro

  # ======================================================================
  # FASE 2 — ENERGIA, CABOS E A PRIMEIRA REDE
  # ======================================================================
  - id: aceitador_energia
    title: "Aceitador de Energia"
    type: main
    deps: [vidro_quartzo, fluix]
    icon: appliedenergistics2:tile.BlockEnergyAcceptor
    desc: |
      A rede ME funciona com §eAE§r, a energia própria do mod. O §eAceitador de Energia§r (ferro,
      4 Vidros de Quartzo e um Cristal de Fluix) converte §eRF e EU§r de outros mods em AE.

      Coloque-o na rede e ligue um cabo de energia nele. Uma rede pequena gasta pouco, mas cada
      dispositivo soma um tanto por tick — o Terminal mostra o consumo total.
    tasks:
      - get: appliedenergistics2:tile.BlockEnergyAcceptor
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:tile.BlockQuartzGlass x4, minecraft:iron_ingot x8, minecraft:redstone x16]

  - id: energia_ae
    title: "Energia AE"
    type: info
    deps: [aceitador_energia]
    icon: appliedenergistics2:tile.BlockEnergyAcceptor
    desc: |
      Um resumo da economia de energia do AE2:

      §e• Consumo passivo:§r todo dispositivo da rede gasta um pouquinho de AE por tick, mesmo
      parado (cabos quase nada; Acionadores, Interfaces e Pontos de Acesso mais).
      §e• Consumo ativo:§r mover itens, fabricar, recortar espaço e usar ferramentas sem fio
      gastam energia extra.
      §e• Entrada:§r Aceitador de Energia (RF/EU), Câmara de Vibração (combustível) ou
      Túneis P2P de energia.
      §e• Reserva:§r Células de Energia seguram os picos.

      Clique com a Ferramenta de Rede em qualquer cabo para ver a energia armazenada e o
      consumo médio.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: camara_vibracao
    title: "Câmara de Vibração"
    type: optional
    deps: [aceitador_energia]
    icon: appliedenergistics2:tile.BlockVibrationChamber
    desc: |
      Sem gerador de outro mod? A §eCâmara de Vibração§r (ferro, fornalha e um Aceitador de Energia) queima combustível de fornalha e gera AE direto na rede.
      Não é eficiente, mas salva o começo, Herói. Coloque combustível e deixe trabalhando. Quando tiver algo melhor, aposente-a com honras. Receita no NEI (R/U).
    tasks:
      - get: appliedenergistics2:tile.BlockVibrationChamber
    rewards:
      - loot: comum

  - id: celula_energia
    title: "Célula de Energia"
    type: normal
    deps: [aceitador_energia, po_fluix]
    icon: appliedenergistics2:tile.BlockEnergyCell
    desc: |
      A bateria da rede: §eCélula de Energia§r (cristais de certus, Pó de Fluix e Vidro de
      Quartzo). Ela segura picos de consumo — e, se a energia externa cair por um instante, a
      rede continua de pé. Pelo NBT do registro, ela guarda 200 000 AE.
    tasks:
      - get: appliedenergistics2:tile.BlockEnergyCell
    rewards:
      - xp: 3
      - item: appliedenergistics2:item.ItemMultiMaterial:8 x4

  - id: celula_densa
    title: "Célula Densa de Energia"
    type: optional
    deps: [celula_energia, processador_calculo]
    icon: appliedenergistics2:tile.BlockDenseEnergyCell
    desc: |
      8 Células de Energia + 1 Processador de Cálculo = §eCélula Densa de Energia§r, que guarda 1 600 000 AE. Ela é ingrediente do Terminal Sem Fio e das células quânticas lá no fim.
      Opcional agora, mas é um ótimo investimento para ter reserva de energia na rede. Confira a receita no NEI (R/U) antes de montar.
    tasks:
      - get: appliedenergistics2:tile.BlockDenseEnergyCell
    rewards:
      - loot: incomum

  - id: fibra_quartzo
    title: "Fibra de Quartzo"
    type: normal
    deps: [po_certus]
    icon: appliedenergistics2:item.ItemMultiPart:140
    desc: |
      6 vidros + 3 Pós de Quartzo = §e3 Fibras de Quartzo§r. Elas conduzem §esó energia§r (sem canais) entre partes da rede, e são o miolo do Cabo de Vidro.
      Faça a sua produção, porque o cabo vai precisar delas em quantidade. Se faltar vidro ou pó, volte para as etapas anteriores. NEI (R/U) tira dúvidas.
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:140 x3
    rewards:
      - xp: 2
      - item: minecraft:glass x16

  - id: cabo_vidro
    title: "Cabo de Vidro ME"
    type: main
    deps: [fibra_quartzo, fluix]
    icon: appliedenergistics2:item.ItemMultiPart:16
    desc: |
      Fibra de Quartzo + 2 Cristais de Fluix = §e4 Cabos de Vidro ME - Fluix§r. É o cabo mais
      básico: leva energia e até §e8 canais§r.

      Pinte com corante na bancada (8 cabos + 1 corante) para separar linhas: cabos de cores
      diferentes não se conectam entre si (o Fluix se liga a todos). Faça §e16§r.
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:16 x16
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:item.ItemMultiMaterial:7 x8, appliedenergistics2:item.ItemMultiPart:140 x6, minecraft:glass x16]

  - id: cabo_coberto
    title: "Cabo Coberto ME"
    type: optional
    deps: [cabo_vidro]
    icon: appliedenergistics2:item.ItemMultiPart:36
    desc: |
      Cabo de Vidro + lã = §eCabo Coberto§r. A capacidade é a mesma (8 canais), só que com acabamento de tecido, mais discreto.
      Quatro Cabos Cobertos sem mais nada viram um §eCabo Coberto Denso§r. Decoração de cabos é coisa séria numa sala de servidores bonita! Opcional, mas fica lindo. Receita no NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:36 x8
    rewards:
      - loot: comum

  - id: cabos_coloridos
    title: "Cabos Coloridos"
    type: optional
    deps: [cabo_vidro]
    icon: appliedenergistics2:item.ItemMultiPart:14
    desc: |
      8 cabos (de qualquer tipo) + 1 corante = 8 cabos coloridos. Cabos de cores diferentes
      §enão se conectam§r — o Fluix (sem cor) se liga a todos. Assim você passa duas redes lado
      a lado sem que se misturem. Faça cabos de qualquer cor.
    tasks:
      - one_of: [appliedenergistics2:item.ItemMultiPart, appliedenergistics2:item.ItemMultiPart:4, appliedenergistics2:item.ItemMultiPart:11, appliedenergistics2:item.ItemMultiPart:14, appliedenergistics2:item.ItemMultiPart:15, appliedenergistics2:item.ItemMultiPart:34, appliedenergistics2:item.ItemMultiPart:51, appliedenergistics2:item.ItemMultiPart:54, appliedenergistics2:item.ItemMultiPart:74, appliedenergistics2:item.ItemMultiPart:71]
    rewards:
      - loot: comum

  - id: cabo_coberto_denso
    title: "Cabo Coberto Denso"
    type: optional
    deps: [cabo_coberto]
    icon: appliedenergistics2:item.ItemMultiPart:536
    desc: |
      4 Cabos Cobertos, sem mais nada, viram um §eME Dense Covered Cable§r: a versão densa (32 canais) sem as luzinhas do inteligente.
      É mais barato que o Cabo Denso comum, então vale como opção econômica para redes grandes. Opcional, Herói. Se quiser comparar com as outras versões de cabo, abra o NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:536
    rewards:
      - loot: comum

  - id: cabo_inteligente
    title: "Cabo Inteligente ME"
    type: normal
    deps: [cabo_vidro]
    icon: appliedenergistics2:item.ItemMultiPart:56
    desc: |
      Cabo Coberto + redstone + glowstone = §eCabo Inteligente§r. Ele também leva 8 canais, mas §emostra os canais em uso§r com luzinhas coloridas.
      É indispensável para entender onde a rede está apertada, Herói. Faça um lote e use nos trechos principais. Dúvidas na receita? NEI, R ou U.
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:56 x8
    rewards:
      - xp: 2
      - item: minecraft:glowstone_dust x8

  - id: cabo_denso
    title: "Cabo Denso ME"
    type: main
    deps: [cabo_inteligente]
    icon: appliedenergistics2:item.ItemMultiPart:76
    desc: |
      4 Cabos Cobertos + redstone + glowstone = §eCabo Denso ME§r: §e32 canais§r num só cabo!

      Use cabos densos como "espinha dorsal" saindo do Controlador e ramifique em cabos
      comuns perto dos dispositivos. Repare: o cabo denso é grosso e não aceita peças
      (barramentos, terminais) encostadas diretamente nele.
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:76 x4
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:item.ItemMultiPart:36 x8, minecraft:glowstone_dust x16, minecraft:redstone x16]

  - id: controlador
    title: "Controlador ME"
    type: main
    deps: [bloco_pedra_ceu, fluix_puro, processador_engenharia, aceitador_energia]
    icon: appliedenergistics2:tile.BlockController
    desc: |
      O coração da rede: o §eControlador ME§r (4 Blocos de Pedra do Céu, 4 Cristais Fluix
      Puros e um Processador de Engenharia).

      Sem controlador, uma rede "improvisada" aguenta só 8 dispositivos. Com ele, §ecada face
      do Controlador fornece 32 canais§r. Controladores encostados formam um bloco maior (até
      certo tamanho) — mas §cnunca ligue duas estruturas de controlador separadas na mesma
      rede§r: ela entra em conflito e para.
    tasks:
      - get: appliedenergistics2:tile.BlockController
    rewards:
      - xp: 5
      - choice: [appliedenergistics2:tile.BlockSkyStone:1 x4, appliedenergistics2:item.ItemMultiMaterial:12 x4, appliedenergistics2:item.ItemMultiMaterial:24 x1]

  - id: canais_info
    title: "Canais: a Regra de Ouro"
    type: info
    deps: [controlador, cabo_denso]
    icon: appliedenergistics2:item.ItemMultiPart:56
    desc: |
      Esta é a aula mais importante do AE2 (puxa uma cadeira!):

      §e• Dispositivos§r como Acionadores, Terminais, Interfaces, barramentos e planos usam
      §e1 canal§r cada. Cabos, Fibras, Células de Energia e o próprio Controlador não usam.
      §e• Cabos comuns§r (vidro, coberto, inteligente) levam §e8 canais§r.
      §e• Cabos densos§r levam §e32 canais§r.
      §e• Cada face do Controlador§r entrega até 32 canais.
      §e• Sem Controlador§r, a rede inteira suporta só 8 dispositivos.

      Se um dispositivo ficar sem canal, ele simplesmente desliga. Use Cabos Inteligentes para
      ver as luzinhas e a Ferramenta de Rede para inspecionar.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: encaixe_armazenamento
    title: "Encaixe de Armazenamento ME"
    type: normal
    deps: [vidro_quartzo]
    icon: appliedenergistics2:item.ItemMultiMaterial:39
    desc: |
      A "carcaça" das células: §eEncaixe de Armazenamento ME§r (2 Vidros de Quartzo, 3 redstones e 3 ferros). Encaixe + componente na bancada = célula.
      Esvaziou uma célula? Com Shift + clique direito vazio no ar, ela se desmonta de volta em encaixe e componente! Faça 2 para começar. Qualquer dúvida, NEI (R/U).
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:39 x2
    rewards:
      - xp: 2
      - item: minecraft:redstone x8

  - id: componente_1k
    title: "Componente de Armazenamento 1k"
    type: main
    deps: [processador_logico]
    icon: appliedenergistics2:item.ItemMultiMaterial:35
    desc: |
      Começa a parte divertida do armazenamento! 4 redstones + 4 cristais de certus em volta de um Processador Lógico dão o §eComponente de Armazenamento ME de 1k§r.
      Atenção: "1k" significa 1024 §ebytes§r, e o AE2 conta bytes, não pilhas! Faça um e coloque num Encaixe para virar célula. Receita no NEI (R/U), Herói.
    tasks:
      - get: appliedenergistics2:item.ItemMultiMaterial:35
    rewards:
      - xp: 4
      - choice: [ore:crystalCertusQuartz x8, minecraft:redstone x16, appliedenergistics2:item.ItemMultiMaterial:22 x1]

  - id: celula_1k
    title: "Célula de Armazenamento 1k"
    type: main
    deps: [componente_1k, encaixe_armazenamento]
    icon: appliedenergistics2:item.ItemBasicStorageCell.1k
    desc: |
      Encaixe + Componente 1k = §eCélula de Armazenamento ME de 1k§r.

      Como contar: cada §etipo§r de item diferente ocupa uma parte dos bytes, e cada byte
      guarda §e8 itens§r. Uma célula aceita até §e63 tipos§r. Ou seja: poucas variedades em
      grande quantidade cabem muito melhor que muitas variedades soltas. Segure Shift no tooltip
      para ver os bytes usados.
    tasks:
      - get: appliedenergistics2:item.ItemBasicStorageCell.1k
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:item.ItemMultiMaterial:39 x1, ore:crystalCertusQuartz x8, minecraft:redstone x16]

  - id: acionador
    title: "Acionador ME"
    type: main
    deps: [processador_engenharia, cabo_vidro]
    icon: appliedenergistics2:tile.BlockDrive
    desc: |
      O §eAcionador ME§r (o "ME Drive"; ferro, 2 Cabos de Vidro e 2 Processadores de Engenharia)
      guarda até §e10 células§r e as disponibiliza para a rede inteira. Ele usa 1 canal.

      As luzinhas da frente mostram o estado de cada célula: verde (espaço livre), laranja
      (tipos esgotados) e vermelho (cheia).
    tasks:
      - get: appliedenergistics2:tile.BlockDrive
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:item.ItemMultiMaterial:24 x1, appliedenergistics2:item.ItemMultiPart:16 x8, minecraft:iron_ingot x8]

  - id: bau_me
    title: "Baú ME"
    type: optional
    deps: [terminal, celula_1k]
    icon: appliedenergistics2:tile.BlockChest
    desc: |
      O §eBaú ME§r é um Terminal + slot de uma célula num bloco só. Funciona até sozinho (com energia), como um "baú de bytes", ou ligado à rede como mais um disco.
      Ótimo para a primeira semana de AE2, quando a rede ainda está nascendo. Opcional, mas muito prático. Confira a receita no NEI (R/U) e experimente!
    tasks:
      - get: appliedenergistics2:tile.BlockChest
    rewards:
      - loot: comum

  - id: painel_iluminado
    title: "Painel Iluminado"
    type: normal
    deps: [vidro_quartzo]
    icon: appliedenergistics2:item.ItemMultiPart:180
    desc: |
      Ferro, glowstone, redstone e Vidro de Quartzo dão §e3 Painéis Iluminados§r. Eles são a "tela" de todos os terminais e monitores (e também uma luminária bonitinha).
      Existem variantes clara e escura, e é só trocar na bancada. Faça os 3 e guarde, porque os terminais vão pedir. Dúvidas? NEI, R ou U.
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:180 x3
    rewards:
      - xp: 2
      - item: minecraft:glowstone_dust x8

  - id: nucleos
    title: "Núcleos de Formação e Aniquilação"
    type: normal
    deps: [processador_logico, po_fluix, quartzo_nether]
    icon: appliedenergistics2:item.ItemMultiMaterial:43
    desc: |
      Dois opostos que andam juntos:
      §e• Núcleo de Formação§r (certus + Pó de Fluix + Processador Lógico, rende 2) — "coloca"
      coisas: exportação, planos de formação.
      §e• Núcleo de Aniquilação§r (quartzo do Nether + Pó de Fluix + Processador Lógico, rende
      2) — "tira" coisas: importação, planos de aniquilação.
      O Terminal ME, a Interface e o Montador Molecular levam um de cada.
    tasks:
      - get: [appliedenergistics2:item.ItemMultiMaterial:43 x2, appliedenergistics2:item.ItemMultiMaterial:44 x2]
    rewards:
      - xp: 3
      - item: appliedenergistics2:item.ItemMultiMaterial:8 x4

  - id: terminal
    title: "Terminal ME"
    type: main
    deps: [painel_iluminado, nucleos]
    icon: appliedenergistics2:item.ItemMultiPart:380
    desc: |
      A janela para o mundo digital! O §eTerminal ME§r (Painel Iluminado, Processador Lógico e
      os dois Núcleos) é colocado num cabo ou bloco da rede e mostra §etodos os itens
      guardados§r. Pesquise, ordene, retire com um clique.

      §aAtalhos:§r Shift + clique manda tudo para o inventário; a barra de pesquisa aceita
      nome do mod com "@" (ex.: @minecraft).
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:380
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:item.ItemMultiPart:180 x3, appliedenergistics2:item.ItemMultiMaterial:22 x1, minecraft:glowstone_dust x16]

  - id: primeira_rede
    title: "A Primeira Rede ME"
    type: milestone
    deps: [controlador, acionador, celula_1k, terminal]
    icon: appliedenergistics2:tile.BlockDrive
    banner: "A Primeira Rede ME"
    subtitle: "O mundo cabe num disco"
    desc: |
      Controlador zumbindo, Acionador com a primeira célula, energia entrando pelo Aceitador e um
      Terminal mostrando cada pedrinha que você guardou. Herói... o seu inventário agora é
      §edigital§r!

      Uma montagem simples que funciona:
      §e• Controlador ME§r com um Cabo Denso saindo de uma face.
      §e• Aceitador de Energia§r encostado no controlador (ou na linha), recebendo RF/EU.
      §e• Acionador ME§r e §eTerminal§r ligados por cabos comuns.

      A partir daqui, cada célula maior multiplica o espaço. E logo, logo, a rede vai começar a
      fabricar coisas sozinha. Eu estou literalmente saltitando de alegria!
    tasks:
      - get: [appliedenergistics2:tile.BlockController, appliedenergistics2:tile.BlockDrive, appliedenergistics2:item.ItemBasicStorageCell.1k, appliedenergistics2:item.ItemMultiPart:380]
    rewards:
      - xp: 8
      - kit: {name: "Kit do Primeiro Servidor", items: [appliedenergistics2:item.ItemMultiPart:16 x32, appliedenergistics2:item.ItemMultiPart:76 x4, appliedenergistics2:item.ItemMultiMaterial:39 x4, appliedenergistics2:item.ItemMultiMaterial:22 x4, appliedenergistics2:tile.BlockEnergyCell x1]}
      - loot: raro

  - id: terminal_fabricacao
    title: "Terminal de Fabricação ME"
    type: main
    deps: [primeira_rede, processador_calculo]
    icon: appliedenergistics2:item.ItemMultiPart:360
    desc: |
      Terminal ME + bancada de trabalho + Processador de Cálculo = §eTerminal de Fabricação§r: um
      terminal com grade 3×3 que puxa os ingredientes direto da rede. Com o NEI aberto, clique
      no "?" ou "+" da receita para preencher a grade automaticamente.

      Você nunca mais vai fabricar tochas "na mão".
    tasks:
      - get: appliedenergistics2:item.ItemMultiPart:360
    rewards:
      - xp: 4
      - choice: [appliedenergistics2:item.ItemMultiMaterial:23 x2, minecraft:crafting_table x2, appliedenergistics2:item.ItemMultiPart:180 x3]

  - id: componente_4k
    title: "Célula de 4k"
    type: normal
    deps: [celula_1k, processador_calculo]
    icon: appliedenergistics2:item.ItemBasicStorageCell.4k
    desc: |
