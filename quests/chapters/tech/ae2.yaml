    tasks:
      - get: appliedenergistics2:item.ItemBasicStorageCell.16k
    rewards:
      - xp: 3
      - item: minecraft:glowstone_dust x16

  - id: componente_64k
    title: "Célula de 64k"
    type: normal
    deps: [componente_16k]
    icon: appliedenergistics2:item.ItemBasicStorageCell.64k
    desc: |
