      itens. Herói, a sua rede agora tem §erios digitais§r!

      Ideias:
      §e• Usina:§r Exportação de Fluido levando combustível aos geradores.
      §e• Fábrica:§r padrões de processamento com fluidos em máquinas de outros mods, usando a
