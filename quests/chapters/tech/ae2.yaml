      célula: você define quais itens ela aceita. Ótimo para criar discos dedicados (só
      minérios, só pedregulho...) e evitar que a célula encha de tralha. Também é onde se
      instalam cartões em células.
    tasks:
      - get: appliedenergistics2:tile.BlockCellWorkbench
    rewards:
      - xp: 3
      - item: minecraft:wool x4

