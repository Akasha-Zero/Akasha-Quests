  - id: gerador_ender
    title: "Gerador do Fim"
    type: normal
    deps: [gerador_fornalha]
    icon: ExtraUtilities:generator:3
    desc: |
      Pérolas e olhos do Ender e um bloco de ferro. Queima §epérolas do Ender, olhos do Ender e
