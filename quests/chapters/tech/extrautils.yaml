chapter:
  id: extrautils
  title: "Extra Utilities"
  prefix: ""
  order: 355
  icon: ExtraUtilities:angelBlock
  desc: |
    §bO Volume das Pequenas Maravilhas.§r Blocos que flutuam no ar, geradores para tudo,
    nós de transferência, lingotes que explodem, um ritual à meia-noite e duas dimensões
    estranhas. (Extra Utilities 1.2.13a)

quests:
  # ======================================================================
  # FASE 0 — UTILIDADES DO DIA A DIA
  # ======================================================================
  - id: bloco_anjo
    title: "O Bloco Anjo"
    type: main
    icon: ExtraUtilities:angelBlock
    desc: |
      Vou começar pelo meu favorito, Herói. O §eBloco Anjo§r pode ser colocado §eno ar§r — sem
      nenhum bloco de apoio. Clique direito no vazio e ele aparece na sua frente. Quebrar é
      instantâneo, e no modo sobrevivência ele volta direto para o inventário.

      Receita: ouro em cima, penas dos lados e obsidiana no meio. Ponte sobre a lava, andaime no
      céu, ilha no oceano... você vai querer uns cinco.
    tasks:
      - get: ExtraUtilities:angelBlock x2
    rewards:
      - xp: 3
      - choice: [minecraft:feather x16, minecraft:obsidian x8, minecraft:gold_ingot x4]

  - id: pedregulho_comprimido
    title: "Pedregulho Comprimido"
    type: main
    deps: [bloco_anjo]
    icon: ExtraUtilities:cobblestone_compressed
    desc: |
      Baús e mais baús de pedregulho? 9 pedregulhos = 1 §ePedregulho Comprimido§r. 9 desses = 1
      Duplamente Comprimido... e assim até o §eOctuplamente§r (43 milhões de pedregulhos!). Dá
      para descomprimir na bancada a qualquer momento.

      Faça §e4 Pedregulhos Comprimidos§r. Mais tarde eles viram portais e Bedrockium.
    tasks:
      - get: ExtraUtilities:cobblestone_compressed x4
    rewards:
      - xp: 3
      - choice: [minecraft:cobblestone x64, minecraft:iron_ingot x6, minecraft:torch x32]

  - id: comprimido_duplo
    title: "Duplamente Comprimido"
    type: normal
    deps: [pedregulho_comprimido]
    icon: ExtraUtilities:cobblestone_compressed:1
    desc: |
      81 pedregulhos num bloco só. Junte §e4 Duplamente Comprimidos§r — o caminho até o Bedrockium
      e o Portal do Escuro Profundo passa por aqui.
    tasks:
      - get: ExtraUtilities:cobblestone_compressed:1 x4
    rewards:
      - xp: 2
      - item: minecraft:cobblestone x64

  - id: comprimido_triplo
    title: "Triplamente Comprimido"
    type: normal
    deps: [comprimido_duplo]
    icon: ExtraUtilities:cobblestone_compressed:2
    desc: |
      729 pedregulhos por bloco. Um Extrusor Ígneo, um Nó de Transferência com melhoria de
      interação ou uma Pedreira ajudam muito. Junte §e4§r.
    tasks:
      - get: ExtraUtilities:cobblestone_compressed:2 x4
    rewards:
      - xp: 2
      - item: ExtraUtilities:cobblestone_compressed x9

  - id: comprimido_quadruplo
    title: "Quadruplamente Comprimido"
    type: normal
    deps: [comprimido_triplo]
    icon: ExtraUtilities:cobblestone_compressed:3
    desc: |
      6 561 pedregulhos por bloco. É ingrediente do §eBedrockium§r (junto do Triplamente
      Comprimido e de um bloco de diamante) e do §ePortal do Escuro Profundo§r. Junte §e4§r.
    tasks:
      - get: ExtraUtilities:cobblestone_compressed:3 x4
    rewards:
      - xp: 3
      - item: ExtraUtilities:cobblestone_compressed:1 x9

  - id: comprimido_quintuplo
    title: "Quintuplamente Comprimido"
    type: optional
    deps: [comprimido_quadruplo]
    icon: ExtraUtilities:cobblestone_compressed:4
    desc: |
      59 049 pedregulhos. Vai no centro do Portal do Escuro Profundo. Sim, eu fiz a conta duas
      vezes.
    tasks:
      - get: ExtraUtilities:cobblestone_compressed:4
    rewards:
      - loot: incomum

  - id: comprimido_octuplo
    title: "Octuplamente Comprimido"
    type: optional
    deps: [comprimido_quintuplo]
    icon: ExtraUtilities:cobblestone_compressed:7
    desc: |
      §e43 046 721 pedregulhos§r num único bloco. Na fornalha, ele vira um §eBloco de
      Bedrockium§r. Isso é um projeto de vida — e eu vou torcer por você em cada compressão.
    tasks:
      - get: ExtraUtilities:cobblestone_compressed:7
    rewards:
      - loot: raro

  - id: outros_comprimidos
    title: "Terra, Cascalho e Areia Comprimidos"
    type: optional
    deps: [pedregulho_comprimido]
    icon: ExtraUtilities:cobblestone_compressed:8
    desc: |
      A mesma compressão vale para §eterra§r (até 4×), §ecascalho§r e §eareia§r (até 2×). Faça
      qualquer um e libere espaço no baú.
    tasks:
      - one_of: [ExtraUtilities:cobblestone_compressed:8, ExtraUtilities:cobblestone_compressed:12, ExtraUtilities:cobblestone_compressed:14]
    rewards:
      - loot: comum

  - id: lata_lixo
    title: "Lata de Lixo"
    type: normal
    deps: [bloco_anjo]
    icon: ExtraUtilities:trashcan
    desc: |
      Pedra, pedregulho e um baú. A §eLata de Lixo§r destrói tudo que entra: arraste ou use
      agachado + clique. Funis e canos também podem despejar nela, e um Filtro de Itens no slot
      faz ela aceitar só o que você quiser. Sem lag, sem drama.
    tasks:
      - get: ExtraUtilities:trashcan
    rewards:
      - xp: 2
      - item: minecraft:chest x2

  - id: lixo_fluido_energia
    title: "Lixeiras de Fluido e de Energia"
    type: optional
    deps: [lata_lixo]
    icon: ExtraUtilities:trashcan:1
    desc: |
      Lata de Lixo + balde = §eLixeira de Fluidos§r; + ouro e redstone = §eLixeira de Energia§r.
      Para aquele excesso de água, lava ou RF que você não sabe onde pôr.
    tasks:
      - one_of: [ExtraUtilities:trashcan:1, ExtraUtilities:trashcan:2]
    rewards:
      - loot: comum

  - id: regador
    title: "Regador"
    type: normal
    deps: [bloco_anjo]
    icon: ExtraUtilities:watering_can:1
    desc: |
      Ferro, farinha de osso e uma tigela. Encha o §eRegador§r com água (clique numa fonte) e
      segure o botão direito sobre as plantas: elas crescem bem mais rápido. Também apaga fogo
      (inclusive em você!) e, de vez em quando, esvazia.
    tasks:
      - get: ExtraUtilities:watering_can:*
    rewards:
      - xp: 2
      - item: minecraft:wheat_seeds x16

  - id: abafa_som
    title: "Abafa-Som"
    type: normal
    deps: [bloco_anjo]
    icon: ExtraUtilities:sound_muffler
    desc: |
      Lã em volta de um bloco musical. O §eAbafa-Som§r reduz em 90% qualquer som num raio de 8
      blocos. Sua fazenda de ovelhas finalmente vai ficar em silêncio.
    tasks:
      - get: ExtraUtilities:sound_muffler
    rewards:
      - xp: 2
      - item: minecraft:wool x8

  - id: abafa_chuva
    title: "Abafa-Chuva"
    type: optional
    deps: [abafa_som]
    icon: ExtraUtilities:sound_muffler:1
    desc: |
      Lã em volta de um balde de água. O §eAbafa-Chuva§r silencia o som de chuva num raio de 64
      blocos. Clique nele para pôr "algodão mágico nos ouvidos" e nunca mais ouvir chuva (só
      afeta o som).
    tasks:
      - get: ExtraUtilities:sound_muffler:1
    rewards:
      - loot: comum

  - id: relogio_redstone
    title: "Loop de Redstone"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:timer
    desc: |
      Redstone, pedra e uma tocha de redstone. Emite §eum pulso por segundo§r, sem montar relógio
      de repetidores. Barato e confiável.
    tasks:
      - get: ExtraUtilities:timer
    rewards:
      - loot: comum

  - id: bud
    title: "Detector de Atualização de Bloco"
    type: optional
    deps: [relogio_redstone]
    icon: ExtraUtilities:budoff
    desc: |
      O §eBUD§r manda um pulso quando um bloco vizinho é atualizado — ótimo para colher abóboras ou
      detectar crescimento. A versão §eAvançada§r (com blocos de redstone) percebe qualquer mudança
      de bloco, sem precisar de atualização, e a Chave Inglesa escolhe o lado de saída.
    tasks:
      - one_of: [ExtraUtilities:budoff, ExtraUtilities:budoff:3]
    rewards:
      - loot: comum

  - id: esteira
    title: "Esteira"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:conveyor
    desc: |
      Trilhos, ferro e redstone = 8 §eEsteiras§r. Feitas para fazendas de mobs: movem criaturas e
      itens, mantêm tudo centralizado e até sobem degraus. Leve o drop direto para o baú.
    tasks:
      - get: ExtraUtilities:conveyor x8
    rewards:
      - loot: comum

  - id: baus
    title: "Baús Pequenos e Médios"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:chestFull
    desc: |
      O §eBaú Um Pouco Maior§r (baú cercado de gravetos) tem mais espaço que um baú comum sem
      ocupar dois blocos; quebrado em 9, ele vira §eMini-Baús§r de um slot — ótimos como buffer de
      máquinas.
    tasks:
      - one_of: [ExtraUtilities:chestFull, ExtraUtilities:chestMini]
    rewards:
      - loot: comum

  - id: arquivador
    title: "Arquivador"
    type: normal
    deps: [baus]
    icon: ExtraUtilities:filing
    desc: |
      Três baús e ferro. O §eArquivador§r guarda §e270 itens que não empilham§r, desde que tenham o
      mesmo ID (espadas de diamante com encantamentos diferentes, por exemplo), e mantém tudo em
      ordem alfabética.
    tasks:
      - get: ExtraUtilities:filing
    rewards:
      - xp: 2
      - item: minecraft:chest x2

  - id: lustre
    title: "Lustre"
    type: normal
    deps: [bloco_anjo]
    icon: ExtraUtilities:chandelier
    desc: |
      Ouro, diamante e tochas. O §eLustre§r ilumina um pouquinho mais que uma tocha e, mais
      importante, §eimpede monstros de nascerem num raio de 16 blocos§r, mesmo sem linha de visão.
      Luxo com função!
    tasks:
      - get: ExtraUtilities:chandelier
    rewards:
      - xp: 2
      - item: minecraft:torch x32

  - id: cortinas
    title: "Cortinas de Blackout"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:curtains
    desc: |
      6 lãs = 12 cortinas. Elas reduzem a luz pela metade e dá para atravessá-las. Perfeitas para o
      quarto (ou para uma sala de spawn escura).
    tasks:
      - get: ExtraUtilities:curtains x4
    rewards:
      - loot: comum

  - id: posto_trocas
    title: "Posto de Trocas"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:trading_post
    desc: |
      Tábuas, um bloco de esmeralda e uma jukebox. O §ePosto de Trocas§r lista as trocas de todos
      os aldeões próximos: clique numa e a tela de troca daquele aldeão abre. Caçar o
      bibliotecário certo ficou fácil.
    tasks:
      - get: ExtraUtilities:trading_post
    rewards:
      - loot: comum

  - id: mesa_pacifica
    title: "Mesa do Pacífico"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:peaceful_table_top
    desc: |
      Esmeraldas, tábuas e uma pérola do Ender. Ao lado de um baú com uma espada, a §eMesa do
      Pacífico§r "gera e abate" mobs e guarda os drops. §cMas atenção:§r pela config do pack
      (`peacefulTableInAllDifficulties=false`) ela §cfunciona apenas na dificuldade Pacífica§r —
      num servidor normal, é decoração.
    tasks:
      - get: ExtraUtilities:peaceful_table_top
    rewards:
      - loot: comum

  - id: sacola_dourada
    title: "Sacola Dourada"
    type: normal
    deps: [bloco_anjo]
    icon: ExtraUtilities:golden_bag
    desc: |
      Lã, ouro, diamante, um baú e um bloco de ouro. A §eSacola Dourada§r carrega o equivalente a
      §eum baú duplo§r: clique direito para abrir. Mais tarde, combinada com Madeira Mágica na
      bancada, ela fica "encantada" (confira o tooltip para o efeito).
    tasks:
      - get: ExtraUtilities:golden_bag
    rewards:
      - xp: 3
      - item: minecraft:gold_ingot x4

  - id: laco_dourado
    title: "Laço Dourado"
    type: normal
    deps: [bloco_anjo]
    icon: ExtraUtilities:golden_lasso
    desc: |
      Pepitas de ouro, barbante e um olho do Ender. Clique num animal passivo com o §eLaço Dourado§r
      e ele fica guardado dentro do item; clique no chão para soltar. Nada de puxar vaca com trigo
      pela floresta! (E ele ajuda num certo ritual, mais adiante...)
    tasks:
      - get: ExtraUtilities:golden_lasso
    rewards:
      - xp: 2
      - item: minecraft:wheat x16

  - id: barril
    title: "Barril"
    type: normal
    deps: [bloco_anjo]
    icon: ExtraUtilities:drum
    desc: |
      Ferro, placas de pressão pesadas e um caldeirão. O §eBarril§r guarda §e256 baldes§r de um
      fluido. Clique com um graveto (ou agachado com chave inglesa) para pegá-lo §esem perder o
      conteúdo§r. Tinja com corante.
    tasks:
      - get: ExtraUtilities:drum
    rewards:
      - xp: 2
      - item: minecraft:bucket x4

  - id: luva
    title: "Luva"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:glove
    desc: |
      Lã e barbante. Com a §eLuva§r na mão, você clica nos blocos "de mão vazia" sem liberar um
      slot. Segure correr ao clicar para usar a própria luva. A cor da lã muda a cor da luva!
    tasks:
      - get: ExtraUtilities:glove
    rewards:
      - loot: comum

  - id: escaneador
    title: "Escaneador Portátil"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:scanner
    desc: |
      Ferro, olho do Ender e redstone. Clique num bloco complexo para ver informações dele; com o
      escaneador na mão, você enxerga o caminho de itens e fluidos dentro dos Tubos de
      Transferência. Ótimo para achar o entupimento.
    tasks:
      - get: ExtraUtilities:scanner
    rewards:
      - loot: comum

  - id: pincel_cores
    title: "Pincel e Blocos Coloridos"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:paintbrush
    desc: |
      O §ePincel§r (barbante + gravetos) transforma tijolos de pedra e tábuas em versões coloridas.
      O truque: tingir um bloco colorido muda a "paleta" daquela cor em todo o chunk. Faça o
      pincel e algumas Tábuas Coloridas.
    tasks:
      - get: [ExtraUtilities:paintbrush, ExtraUtilities:colorWoodPlanks:* x8]
    rewards:
      - loot: comum

  - id: bobina_inducao
    title: "Bobina de Indução"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:heatingElement
    desc: |
      Placas de pressão pesadas e redstone. A §eBobina de Indução§r é um item que guarda RF —
      confira no tooltip/NEI como ela é usada como "combustível" recarregável.
    tasks:
      - get: ExtraUtilities:heatingElement
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 1 — ESPINHOS E ENCANTAMENTO
  # ======================================================================
  - id: espinhos_madeira
    title: "Espinho de Madeira"
    type: normal
    deps: [bloco_anjo]
    icon: ExtraUtilities:spike_base_wood
    desc: |
      Espadas de madeira, tábuas e tronco = 4 §eEspinhos de Madeira§r. Espinhos ferem qualquer
      criatura que encoste neles e são a base das fazendas de mobs. O de madeira é o mais fraco
      da família (leia o tooltip de cada um: eles se comportam diferente).
    tasks:
      - get: ExtraUtilities:spike_base_wood x4
    rewards:
      - xp: 2
      - item: minecraft:planks x16

  - id: espinhos_ferro
    title: "Espinho de Ferro"
    type: normal
    deps: [espinhos_madeira]
    icon: ExtraUtilities:spike_base
    desc: |
      Espadas de ferro, ferro e um bloco de ferro = 4. Dano alto; mobs mortos por eles soltam até
      os itens "raros", §cmas não soltam experiência§r. Combine com Esteiras e um Cano de Obsidiana.
    tasks:
      - get: ExtraUtilities:spike_base x4
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x6

  - id: espinhos_ouro
    title: "Espinho de Ouro"
    type: optional
    deps: [espinhos_ferro, madeira_magica]
    icon: ExtraUtilities:spike_base_gold
    desc: |
      Espadas de ouro, Madeira Mágica e um bloco de ouro. Uma variante "encantada" do espinho —
      confira no tooltip a diferença em relação ao de ferro antes de montar a sua fazenda.
    tasks:
      - get: ExtraUtilities:spike_base_gold x4
    rewards:
      - loot: incomum

  - id: espinhos_diamante
    title: "Espinho de Diamante"
    type: optional
    deps: [espinhos_ouro]
    icon: ExtraUtilities:spike_base_diamond
    desc: |
      Espadas de diamante, Espinhos de Ouro e um bloco de diamante: o espinho mais forte. Caro,
      mas transforma qualquer fazenda de mobs numa máquina de drops.
    tasks:
      - get: ExtraUtilities:spike_base_diamond x4
    rewards:
      - loot: incomum

  - id: obsidiana_ender
    title: "Obsidiana Fundida em Ender"
    type: main
    deps: [bloco_anjo]
    icon: ExtraUtilities:decorativeBlock1:1
    desc: |
      4 obsidianas em volta de uma pérola do Ender = 4 §eObsidianas Fundidas em Ender§r. Ela é a
      base de quase tudo que é "Ender" neste mod: Coletor, Bomba, QED, Pedreira do Fim, Núcleo de
      Ender. Faça 8.
    tasks:
      - get: ExtraUtilities:decorativeBlock1:1 x8
    rewards:
      - xp: 3
      - choice: [minecraft:obsidian x8, minecraft:ender_pearl x4, minecraft:diamond]

  - id: madeira_magica
    title: "Madeira Mágica"
    type: normal
    deps: [bloco_anjo]
    icon: ExtraUtilities:decorativeBlock1:8
    desc: |
      Uma estante, ouro e §elivros encantados§r. A §eMadeira Mágica§r aumenta em 5 níveis o máximo
      das mesas de encantamento próximas (até o limite de 30). Também é ingrediente do Núcleo de
      Ender, do Arquivador Avançado e do Espinho de Ouro.
    tasks:
      - get: ExtraUtilities:decorativeBlock1:8
    rewards:
      - xp: 2
      - item: minecraft:book x8

  - id: nucleo_ender
    title: "Núcleo de Ender"
    type: normal
    deps: [madeira_magica, obsidiana_ender]
    icon: ExtraUtilities:decorativeBlock1:11
    desc: |
      Madeira Mágica + Obsidiana Fundida em Ender + olho do Ender. O §eNúcleo de Ender§r turbina a
      mesa de encantamento em §e20 níveis§r (até 30) — uma estante inteira num bloco. Também vai na
      Pedreira do Fim.
    tasks:
      - get: ExtraUtilities:decorativeBlock1:11
    rewards:
      - xp: 3
      - item: minecraft:ender_eye x2

  - id: arquivador_avancado
    title: "Arquivador Avançado"
    type: optional
    deps: [arquivador, madeira_magica]
    icon: ExtraUtilities:filing:1
    desc: |
      Arquivadores + Madeira Mágica. A versão avançada guarda §e540 itens não-empilháveis de
      qualquer tipo§r, em ordem alfabética. O armário de ferramentas dos sonhos.
    tasks:
      - get: ExtraUtilities:filing:1
    rewards:
      - loot: comum

  - id: vidro_temperado
    title: "Vidros Decorativos"
    type: optional
    deps: [bloco_anjo]
    icon: ExtraUtilities:decorativeBlock2
    desc: |
      Areia + vidro = Vidro "Areiado"; na fornalha ele vira §eVidro Temperado§r, que se une sem
      bordas. Daí saem vidro com bordas, tijolos de vidro, vidro de coração, vidro escuro... Faça
      alguns Vidros Temperados.
    tasks:
      - get: ExtraUtilities:decorativeBlock2 x8
    rewards:
      - loot: comum

  - id: coletor_ender
    title: "Coletor do Fim"
    type: optional
    deps: [obsidiana_ender]
    icon: ExtraUtilities:enderCollector
    desc: |
      Pérolas do Ender e Obsidiana Fundida em Ender. O §eEnder Collector§r puxa itens caídos ao
      redor dele para o inventário encostado. Um aspirador silencioso.
    tasks:
      - get: ExtraUtilities:enderCollector
    rewards:
      - loot: comum

  - id: lirio_ender
    title: "Vitória-Régia do Fim"
    type: optional
    deps: [obsidiana_ender]
    icon: ExtraUtilities:plant/ender_lilly
    desc: |
      As §eSementes de Vitória-Régia do Fim§r só aparecem em §ebaús de masmorra§r. A planta cresce
      MUITO devagar (cerca de uma semana de jogo) e, madura, solta uma pérola do Ender. Cuidado:
      ela cria espinhos conforme envelhece. As sementes também alimentam o Gerador do Fim.
    tasks:
      - get: ExtraUtilities:plant/ender_lilly
    rewards:
      - loot: incomum

  - id: bomba_endertermica
    title: "Bomba Ender-Térmica"
    type: optional
    deps: [obsidiana_ender]
    icon: ExtraUtilities:enderThermicPump
    desc: |
      Uma bomba de lava "sem lag": ao bombear, ela troca a lava por pedra sem causar atualização e
      carrega os chunks que precisa. Coloque logo acima da superfície de um lago de lava do
      §eNether§r (por padrão só funciona lá). Funciona com energia, como a bomba do BuildCraft.
    tasks:
      - get: ExtraUtilities:enderThermicPump
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 2 — GERADORES
  # ======================================================================
  - id: aula_geradores
    title: "Aula: Os Geradores"
    type: info
    deps: [bloco_anjo]
    icon: ExtraUtilities:generator
    desc: |
      O Extra Utilities tem §e12 geradores de RF§r, cada um queimando algo diferente: combustível
      de fornalha, lava, pérolas do Ender, comida, poções, sol, TNT, corante rosa, estrelas do
      Nether... Quase todos levam fornalha e redstone embaixo da receita.

      Eles empurram RF para os vizinhos? Não automaticamente para todos os mods: ligue com cabos
      de outro mod (Ender IO, Mekanism, BuildCraft) ou com um §eNó de Transferência de Energia§r.
      E existem versões §ex8§r e §ex64§r de cada gerador (8 ou 64 geradores num bloco).
    tasks:
      - check
    rewards:
      - xp: 1

