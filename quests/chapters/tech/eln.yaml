    desc: |
      Você começou com uma resina pingando de uma árvore e uma pilha de carvão. Agora tem
      turbinas girando eixos, transformadores com núcleo de ferro, fusíveis vigiando cada linha,
      sensores conversando em 5 V e uma mineradora cavando a 800 V.

      Isso não é mais "um mod de energia". É §beletrotécnica§r, Herói — a mesma que acende as
