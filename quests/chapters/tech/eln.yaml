    type: milestone
    deps: [gerador_3200, mineradora, exportador, processador_sinal, fusiveis]
    icon: Eln:Eln.sharedItem:641
    banner: "Mestre Eletricista"
    subtitle: "O Volume da Eletricidade está completo"
