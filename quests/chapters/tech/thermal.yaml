    type: normal
    deps: [caixa_forte, invar]
    icon: ThermalExpansion:Strongbox:2
    desc: |
      Mais espaço, o mesmo truque! Junte uma Caixa Forte + 4 Invar para ter uma Caixa Forte Endurecida.
      O conteúdo continua vindo junto quando você a quebra, e agora cabe mais coisa lá dentro. Perfeito para mudar de base sem esvaziar tudo. Se tiver dúvida na receita, aperte R no NEI. Mais um passo da evolução, Herói!
    tasks:
      - get: ThermalExpansion:Strongbox:2
    rewards:
      - xp: 2
      - item: ore:ingotInvar x2

  - id: estoque_endurecido
    title: "Estoque Endurecido"
    type: normal
    deps: [estoque, invar]
    icon: ThermalExpansion:Cache:2
    desc: |
      Um item, muitas unidades! Junte Estoque + 4 Invar e ganhe §e40 000 itens§r de um tipo.
      Clique agachado para travar o item e ele nunca aceitará outro. Ótimo para pedregulho, terra e outros blocos que você acumula demais. Se precisar da receita, o NEI (R/U) mostra. Seu inventário agradece, Herói!
    tasks:
      - get: ThermalExpansion:Cache:2
    rewards:
      - xp: 2
      - item: ore:ingotInvar x2

  - id: sacola_endurecida
    title: "Sacola Endurecida"
    type: normal
    deps: [sacola, invar]
    icon: ThermalExpansion:satchel:2
    desc: |
      Mais linhas, mais carga! Junte Sacola + Invar + pepitas de estanho para fazer a Sacola Endurecida.
      Agora você carrega ainda mais itens por aí, sem precisar voltar à base toda hora. Se tiver dúvida na receita, aperte R no NEI. Uma aventureira cheia de coisas boas na mochila é uma aventureira feliz, e você é quem manda, Herói!
    tasks:
      - get: ThermalExpansion:satchel:2
    rewards:
      - xp: 2
      - item: ore:ingotTin x4

  - id: capacitor_endurecido
    title: "Capacitor Endurecido"
    type: normal
    deps: [capacitor_leadstone, invar]
    icon: ThermalExpansion:capacitor:3
    desc: |
      Mais bateria no bolso! Junte Capacitor de Leadstone + Invar + estanho + redstone e ganhe §e400 000 RF§r de capacidade.
      Carregue no Infusor Energético, como o anterior. Se travar na receita, aperte R no NEI. Com tanta energia à mão, suas ferramentas elétricas podem trabalhar o dia todo, Herói!
    tasks:
      - get: ThermalExpansion:capacitor:3
    rewards:
      - xp: 2
      - item: minecraft:redstone x16

  - id: bancada_endurecida
