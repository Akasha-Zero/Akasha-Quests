    type: optional
    deps: [bancada_maquinista, invar]
    icon: ThermalExpansion:Workbench:2
    desc: |
      Tudo sobe de nível! A Bancada do Maquinista também evolui (Invar → Signalo → Endério), ganhando mais slots de esquema e de inventário.
      Atualize a sua uma vez para sentir a diferença. É opcional, mas ajuda bastante quem usa muitos esquemas. Confira os detalhes no NEI (R/U). Mais espaço para suas receitas, Herói!
    tasks:
      - get: ThermalExpansion:Workbench:2
    rewards:
      - loot: comum

  - id: placa_estrutura
    title: "Placa de Estrutura"
    type: optional
    deps: [signalo, vidro_endurecido]
    icon: ThermalExpansion:Plate
    desc: |
      Chão que reage ao toque! Signalo, Invar e Vidro Endurecido = §ePlaca de Estrutura§r, a base das placas do Thermal: blocos finos de chão que agem quando algo encosta.
      Confira no NEI as receitas de cada uma (aperte R ou U sobre a placa). É opcional, mas dá para montar armadilhas e portas inteligentes depois. Divirta-se experimentando, Herói!
    tasks:
      - get: ThermalExpansion:Plate
    rewards:
      - loot: comum

  - id: placas_basicas
    title: "Placas de Sinal, Impulso e Translocação"
    type: optional
    deps: [placa_estrutura]
    icon: ThermalExpansion:Plate:2
    desc: |
      §e• Placa de Redstone:§r emite sinal quando algo pisa.
      §e• Placa de Impulso:§r arremessa o que tocar nela (configurável).
      §e• Placa de Translocação:§r teleporta o que tocar para um ponto próximo.

      Faça qualquer uma — e tente não se lançar no rio na primeira tentativa.
    tasks:
      - one_of: [ThermalExpansion:Plate:1, ThermalExpansion:Plate:2, ThermalExpansion:Plate:3]
    rewards:
      - loot: comum

  - id: placas_avancadas
    title: "Placas de Carga e de Excursão"
    type: optional
    deps: [placas_basicas]
    icon: ThermalExpansion:Plate:4
    desc: |
      Duas placas especiais, escolha uma! Faça qualquer uma delas:
      §e• Placa de Carga§r (atualização da de Redstone com Electro e diamante): carrega itens de quem pisa nela.
      §e• Placa de Excursão§r (atualização da de Impulso com Signalo e quartzo): projeta um feixe de força que carrega você.
      Se tiver dúvida nas receitas, o NEI (R/U) mostra. Divirta-se, Herói!
    tasks:
      - one_of: [ThermalExpansion:Plate:4, ThermalExpansion:Plate:5]
    rewards:
      - loot: incomum

  - id: iluminador
    title: "Iluminador de Pedra Luminosa"
    type: optional
    deps: [vidro_endurecido, signalo, transpositor]
    icon: ThermalExpansion:Light
    desc: |
      Luz com estilo! Faça a §eEstrutura de Iluminador§r (Vidro Endurecido + quartzo + Signalo) e encha com Pedra Luminosa Energizada no Transpositor.
      O §eIluminador§r acende por redstone e pode ter quase qualquer cor (tinja na bancada). As §eLâmpadas de Lúmio§r são a versão de metal. Se tiver dúvida, o NEI (R/U) mostra. Acenda seu mundo, Herói!
    tasks:
      - one_of: [ThermalExpansion:Light, ThermalExpansion:Light:1, ThermalExpansion:Light:2]
    rewards:
      - loot: comum

  - id: vidro_lumio
    title: "Vidro Endurecido de Lúmio"
    type: optional
    deps: [lumio, vidro_endurecido]
    icon: ThermalExpansion:Glass:1
    desc: |
      À prova de explosão E iluminado! Na Fundição, junte Lúmio + 4 Obsidianas Pulverizadas e ganhe §e2 Vidros Endurecidos de Lúmio§r.
      Uma janela de bunker com estilo, perfeita para decorar sua base sem perder a segurança. Se travar na receita, aperte R no NEI. Brilhe com segurança, Herói!
    tasks:
      - get: ThermalExpansion:Glass:1 x2
    rewards:
      - loot: comum

  - id: ferramentas_eletro
    title: "Equipamento de Electro e Bronze"
    type: optional
    deps: [eletro, bronze]
    icon: ThermalFoundation:tool.pickaxeElectrum
    desc: |
      O Electro faz ferramentas rapidíssimas (e frágeis); o bronze, ferramentas equilibradas.
      Faça qualquer ferramenta de Electro, só para sentir a velocidade! É opcional, mas é divertido ver o bloco desaparecer no primeiro golpe. Se quiser ver as receitas, o NEI (R/U) mostra. Leve uma de bronze também para os trabalhos mais longos, Herói!
    tasks:
      - one_of: [ThermalFoundation:tool.pickaxeElectrum, ThermalFoundation:tool.swordElectrum, ThermalFoundation:tool.shovelElectrum, ThermalFoundation:tool.axeElectrum]
    rewards:
      - loot: comum

  - id: oficina_endurecida
    title: "Tudo Endurecido"
    type: milestone
    deps: [maquina_endurecida, celula_endurecida, dinamo_magmatico, aumento_velocidade_1, signalo]
    icon: ThermalExpansion:Frame:1
    banner: "Nível Endurecido"
    subtitle: "Invar, Electro e engrenagens girando"
    desc: |
      Máquinas Endurecidas, aumentos de nível I, uma Célula de 2 milhões de RF e um Dínamo
      Magmático roncando com lava. Herói, a sua fábrica deixou de ser uma oficina: ela virou uma
      §busina§r.

      Para o próximo nível você vai precisar de muito §eVidro Endurecido§r (pense no Extrusor +
      Pulverizador fazendo obsidiana) e de §eSignalo§r para as engrenagens. E lá no fim espera o
      §5Endério§r, com platina e Ender Ressonante. Bora?
    tasks:
      - get: [ThermalExpansion:Cell:2, ThermalExpansion:Dynamo:1, ThermalExpansion:augment:128]
      - {get: 'ThermalExpansion:Machine:* {Level:1b}', nbt: true}
    rewards:
      - xp: 8
      - kit: {name: "Kit do Engenheiro Térmico", items: [ore:ingotInvar x8, ore:ingotElectrum x4, ThermalExpansion:Glass x8, ThermalExpansion:material:1 x4, ThermalFoundation:material:512 x4]}
      - loot: raro

  # ======================================================================
  # FASE 7 — NÍVEL REFORÇADO
  # ======================================================================
  - id: estrutura_reforcada
    title: "Estrutura Reforçada"
    type: main
    deps: [oficina_endurecida, vidro_endurecido, engrenagem_signalo]
    icon: ThermalExpansion:Frame:2
    desc: |
      Subindo mais um degrau! Estrutura Endurecida + §e4 Vidros Endurecidos + 1 Engrenagem de Signalo§r = §eEstrutura (Reforçada)§r.
      Com o mesmo padrão, máquinas Endurecidas viram Reforçadas. Se travar na receita, aperte R no NEI. Falta pouco para suas máquinas ficarem ainda mais poderosas, e a Estrutura Reforçada é o primeiro passo, Herói!
    tasks:
      - get: ThermalExpansion:Frame:2
