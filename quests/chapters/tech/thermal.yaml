chapter:
  id: thermal
  title: "Thermal Expansion"
  prefix: ""
  order: 315
  icon: ThermalExpansion:Frame
  desc: |
    §bO Volume do Fluxo.§r Metais novos, ligas brilhantes, máquinas que sobem de nível,
    elementais de gelo e fogo, Redstone Flux (RF) e o Tesserato que dobra o espaço.
    (Thermal Expansion 4.1.5 + Thermal Foundation 1.2.6 + CoFH Core)

quests:
  # ======================================================================
  # FASE 0 — A FUNDAÇÃO: MINÉRIOS E METAIS
  # ======================================================================
  - id: fundacao_termica
    title: "A Fundação Térmica"
    type: main
    icon: ThermalFoundation:Ore
    desc: |
      Sabe o que eu mais amo neste Volume, Herói? Ele é organizado. Cada metal tem seu lugar,
      cada máquina tem quatro níveis, cada liga tem uma receita certinha. Um paraíso para uma
      bibliotecária!

      O §eThermal Foundation§r espalha pelo mundo minérios de §eCobre, Estanho, Prata, Chumbo,
      Ferroso§r (níquel) e §eBrilhante§r (platina). Comece pelo básico: o Cobre aparece entre
      Y 40 e 96 (há duas faixas de geração), o Estanho entre Y 20 e 55. Funda e junte
      §e8 lingotes de cada§r — de qualquer mod, o Thermal usa o oredict.

      §aDica:§r nenhum minério do Thermal gera no Nether nem no Fim.
    tasks:
      - get: [ore:ingotCopper x8, ore:ingotTin x8]
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:coal x16, minecraft:torch x32]

  - id: prata
    title: "Prata"
    type: normal
    deps: [fundacao_termica]
    icon: ThermalFoundation:Ore:2
    desc: |
      Prata brilha bonito, mas aqui ela é trabalho: bobinas de transmissão, Electro, Signalo,
      Lúmio... quase tudo que é "avançado" no Thermal passa por ela.

      O §eMinério de Prata§r gera fundo, entre §eY 5 e 30§r, e os veios vêm misturados com um
      pouco de chumbo (e os de chumbo com um pouco de prata). Junte §e8 lingotes de prata§r.
    tasks:
      - get: ore:ingotSilver x8
    rewards:
      - xp: 2
      - item: minecraft:redstone x8

  - id: chumbo
    title: "Chumbo"
    type: normal
    deps: [fundacao_termica]
    icon: ThermalFoundation:Ore:3
    desc: |
      Pesado, cinzento e indispensável. O §eMinério de Chumbo§r aparece entre §eY 10 e 35§r
      (às vezes com prata no meio). O chumbo vira a §eCélula de Energia de Leadstone§r, o
      §eVidro Endurecido§r e os aumentos dos dínamos.

      Junte §e8 lingotes de chumbo§r. Chumbo de outros mods (IC2, Immersive...) também serve.
    tasks:
      - get: ore:ingotLead x8
    rewards:
      - xp: 2
      - item: minecraft:glass x8

  - id: minerio_ferroso
    title: "O Minério Ferroso"
    type: main
    deps: [fundacao_termica]
    icon: ThermalFoundation:Ore:4
    desc: |
      Esse aqui é tímido. O §eMinério Ferroso§r (é o níquel, oredict `oreNickel`) gera em
      veios pequenos, só §e3 por chunk entre Y 5 e 20§r. Mas sem ele não existe §6Invar§r — e
      sem Invar não existe nenhuma máquina Endurecida.

      Junte §e4 Barras Ferrosas§r. Quando tiver o Pulverizador, cada minério rende 2 pós e
      ainda pode soltar um pouquinho de platina como subproduto.
    tasks:
      - get: ore:ingotNickel x4
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, ore:ingotCopper x8, minecraft:torch x32]

  - id: minerio_brilhante
    title: "O Minério Brilhante"
    type: optional
    deps: [minerio_ferroso]
    icon: ThermalFoundation:Ore:5
    desc: |
      O §eMinério Brilhante§r é a platina do Thermal — e é RARO: no máximo §eum veiozinho de
      até 3 blocos por chunk§r, entre Y 5 e 30 (e 20% desses veios são de minério ferroso).

      Você vai precisar dela lá na frente, para o §5Endério§r. Guarde cada barra! Outras fontes:
      o subproduto do minério ferroso no Pulverizador e a platina de outros mods (mesmo oredict).
    tasks:
      - get: ore:ingotPlatinum
    rewards:
      - loot: incomum

  - id: mana_infundido
    title: "Um Metal que Não Nasce"
    type: info
    deps: [minerio_brilhante]
    icon: ThermalFoundation:material:70
    desc: |
      Uma curiosidade, para você não perder tempo cavando: o Thermal registra o §dMinério
      Infundido em Mana§r (mithril), mas a configuração de geração do pack
      (`config/cofh/world/ThermalFoundation-Ores.json`) §cnão gera esse minério§r.

      Se um dia aparecer uma Barra Infundida em Mana, ela terá vindo de outro caminho (troca,
      outro mod, recompensa). Até lá, nada de procurar mithril embaixo da terra!
    tasks:
      - check
    rewards:
      - xp: 1

  - id: engrenagens
    title: "Engrenagens"
    type: main
    deps: [fundacao_termica]
    icon: ThermalFoundation:material:129
    desc: |
      O Thermal adora engrenagens. Quatro lingotes em cruz com um §eLingote de Ferro§r no
      centro viram uma engrenagem do metal escolhido (no pack as receitas usam engrenagens, não
      lingotes).

      Faça uma §eEngrenagem de Estanho§r (vai na Estrutura de Máquina) e duas §eEngrenagens de
      Cobre§r (vão no fundo de quase toda máquina).
    tasks:
      - get: [ThermalFoundation:material:129, ThermalFoundation:material:128 x2]
    rewards:
      - xp: 3
      - choice: [ore:ingotCopper x8, ore:ingotTin x8, minecraft:iron_ingot x8]

  - id: forge_lexicon
    title: "O Léxico da Forja"
    type: optional
    deps: [fundacao_termica]
    icon: ThermalFoundation:lexicon
    desc: |
      Já ficou com três cobres diferentes no baú, cada um de um mod? O §eForge Lexicon§r
      (livro + diamante + ouro + ferro + redstone) mostra os nomes do oredict de um item e
      deixa você trocar uma versão pela outra.

      É uma ferramenta de bibliotecária, então você já sabe que eu aprovo.
    tasks:
      - get: ThermalFoundation:lexicon
    rewards:
      - loot: comum

  - id: ferramentas_metal
    title: "Ferramentas de Metal Comum"
    type: optional
    deps: [fundacao_termica]
    icon: ThermalFoundation:tool.pickaxeCopper
    desc: |
      O Thermal Foundation traz ferramentas e armaduras de quase todos os seus metais, além de
      §eFoices§r (colhem plantações em área), §eTesouras§r, §eVaras de Pesca§r e §eArcos
      reforçados§r.

      Faça qualquer peça de cobre, estanho, prata, chumbo ou bronze. Nada revolucionário — mas
      ajuda a guardar o ferro para as máquinas.
    tasks:
      - one_of: [ThermalFoundation:tool.pickaxeCopper, ThermalFoundation:tool.pickaxeTin, ThermalFoundation:tool.pickaxeSilver, ThermalFoundation:tool.pickaxeLead, ThermalFoundation:tool.pickaxeBronze, ThermalFoundation:tool.sickleCopper, ThermalFoundation:tool.sickleIron, ThermalFoundation:tool.sickleBronze]
    rewards:
      - loot: comum

  - id: armadura_metal
    title: "Armadura de Metal"
    type: optional
    deps: [ferramentas_metal]
    icon: ThermalFoundation:armor.plateBronze
    desc: |
      Quer sobreviver a mais um creeper? Então vista metal! O Thermal tem peitorais de cobre, estanho, prata, chumbo, bronze, invar, electro e até de platina, o "Brilhante", o mais resistente da família.
      Faça um peitoral de qualquer um desses metais e a vida fica bem menos explosiva. Se quiser ver a receita de cada um, aperte R ou U no NEI. Escolha o metal que você já tem de sobra e vista com orgulho!
    tasks:
      - one_of: [ThermalFoundation:armor.plateCopper, ThermalFoundation:armor.plateTin, ThermalFoundation:armor.plateSilver, ThermalFoundation:armor.plateLead, ThermalFoundation:armor.plateBronze, ThermalFoundation:armor.plateNickel]
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 1 — A PRIMEIRA MÁQUINA
  # ======================================================================
  - id: martelo
    title: "Martelo Tramontina"
    type: main
    deps: [engrenagens]
    icon: ThermalExpansion:wrench
    desc: |
      Sim, o jogo chama o §eCrescent Hammer§r de "Martelo Tramontina (Chave Inglesa)". Eu ri
      por dez minutos. Ele é a chave inglesa do Thermal: gira máquinas, configura lados e,
      agachado + clique, desmonta o bloco guardando o conteúdo.

      Receita: 3 lingotes de ferro + 1 de estanho (confira o formato no NEI). Ele também
      funciona como chave na maioria dos mods do pack.
    tasks:
      - get: ThermalExpansion:wrench
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x8, minecraft:redstone x16, ore:ingotTin x8]

  - id: bobinas
    title: "Servo e Bobinas"
    type: main
    deps: [martelo, prata]
    icon: ThermalExpansion:material:1
    desc: |
      Três peças que você vai fabricar centenas de vezes:
      §e• Servo Pneumático§r — ferro, vidro e redstone; move itens e fluidos.
      §e• Bobina Receptora de Redstone§r — ouro + 2 redstone; "recebe" energia (máquinas).
      §e• Bobina Transmissora de Redstone§r — prata + 2 redstone; "envia" energia (dínamos).

      Faça uma de cada. A Bobina Receptora vai no centro de baixo de toda máquina.
    tasks:
      - get: [ThermalExpansion:material, ThermalExpansion:material:1, ThermalExpansion:material:2]
    rewards:
      - xp: 3
      - choice: [minecraft:redstone x16, minecraft:gold_ingot x4, ore:ingotSilver x4]

  - id: estrutura_maquina
    title: "Estrutura de Máquina"
    type: main
    deps: [engrenagens]
    icon: ThermalExpansion:Frame
    desc: |
      O esqueleto de tudo! A §eEstrutura de Máquina (Básica)§r leva 4 lingotes de ferro, 4
      vidros e uma Engrenagem de Estanho no centro.

      Toda máquina do Thermal é: Estrutura no meio, a peça característica em cima, dois
      materiais nas laterais, Engrenagens de Cobre nos cantos de baixo e a Bobina Receptora no
      centro de baixo. Aprenda esse "molde" e o NEI vira só confirmação.
    tasks:
      - get: ThermalExpansion:Frame
    rewards:
      - xp: 3
      - choice: [minecraft:glass x16, minecraft:iron_ingot x8, ore:ingotTin x8]

  - id: energia_rf
    title: "Aula: Redstone Flux"
    type: info
    deps: [estrutura_maquina]
    icon: ThermalExpansion:meter
    desc: |
      O Thermal fala §bRF (Redstone Flux)§r, medido em RF/t. Quase todo mod tecnológico do pack
      entende RF, então suas células e dínamos alimentam muita coisa além do Thermal.

      §cAtenção:§r o pack §enão tem Thermal Dynamics§r (os condutos/"ducts" do Thermal). Para
      levar energia, itens e fluidos você usa outros mods:
      §e•§r Condutos do §bEnder IO§r; Cabos Universais e transmissores do §bMekanism§r;
      §e•§r Tubos Cinéticos do §bBuildCraft§r (tubo + redstone);
      §e•§r Nós e Tubos de Transferência do §bExtra Utilities§r;
      §e•§r os Tubos Universais do §bOmni Pipes§r (mod do próprio pack).

      Dínamo encostado na máquina também funciona: ele empurra RF para o bloco em frente ao
      eixo. Máquinas do Thermal não explodem com "voltagem" — RF não tem tiers como o EU.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: fornalha_redstone
    title: "Fornalha de Redstone"
    type: main
    deps: [estrutura_maquina, bobinas]
    icon: ThermalExpansion:Machine
    desc: |
      A primeira máquina: uma fornalha elétrica rapidinha. Molde padrão com §eredstone em
      cima§r e §etijolos§r nas laterais.

      Ela funde tudo que a fornalha comum funde, gastando RF em vez de carvão. Coloque, ligue
      numa fonte de energia e me diga se não é a coisa mais satisfatória do mundo ver aquele
      botão vermelho brilhar!
    tasks:
      - get: ThermalExpansion:Machine
    rewards:
      - xp: 3
      - choice: [minecraft:coal x16, ore:ingotCopper x8, minecraft:brick_block x8]

  - id: dinamo_vapor
    title: "Dínamo a Vapor"
    type: main
    deps: [bobinas]
    icon: ThermalExpansion:Dynamo
    desc: |
      Energia! O §eDínamo a Vapor§r queima combustível sólido e precisa de §eágua§r (bombeie ou
      coloque um balde... na prática, um Acumulador Aquoso ou outro mod de água ajuda muito).
      Produz até §e80 RF/t§r.

      Valores do pack: carvão = 48 000 RF, carvão vegetal = 32 000 RF. Ele empurra energia
      pela face do eixo — gire com o Martelo para apontar para a máquina ou para a célula.
      Ele também aceita vapor de outros mods no lugar da água + combustível.
    tasks:
      - get: ThermalExpansion:Dynamo
    rewards:
      - xp: 3
      - choice: [minecraft:coal x32, minecraft:water_bucket, ore:ingotCopper x8]

  - id: estrutura_leadstone
    title: "Estrutura de Célula de Leadstone"
    type: normal
    deps: [chumbo, bobinas]
    icon: ThermalExpansion:Frame:4
    desc: |
      Antes da célula de energia vem a moldura, Herói! Ela leva 4 chumbo, 4 vidros e um §eBloco de Redstone§r no centro.
      Essa mesma estrutura aparece na receita do Crisol Magmático e do Infusor Energético, então já faça duas de uma vez e poupe viagens depois. Se algum ingrediente confundir, confira no NEI (R/U). Você está montando a base de toda a sua rede de energia, e isso merece capricho!
    tasks:
      - get: ThermalExpansion:Frame:4
    rewards:
      - xp: 2
      - item: minecraft:redstone x9

  - id: celula_leadstone
    title: "Célula de Energia de Leadstone"
    type: main
    deps: [estrutura_leadstone, dinamo_vapor, eletro]
    icon: ThermalExpansion:Cell:1
    desc: |
      Uma bateria de bloco: §e400 000 RF§r, entrada/saída de até §e200 RF/t§r (valores do
      pack). Estrutura de Leadstone + cobre + uma §eBobina Condutora de Redstone§r (Electro +
      2 redstone).

      Clique com o Martelo para escolher que lados recebem (azul) e enviam (laranja). Ela
      guarda a carga quando desmontada.
    tasks:
      - get: ThermalExpansion:Cell:1
    rewards:
      - xp: 3
      - choice: [minecraft:redstone x16, ore:ingotLead x8, ore:ingotCopper x8]

  - id: pulverizador
    title: "Pulverizador"
    type: main
    deps: [fornalha_redstone]
    icon: ThermalExpansion:Machine:1
    desc: |
      O coração do processamento: molde padrão com §epistão em cima§r e §esílex§r nas laterais
      (no pack não precisa de diamante).

      Cada minério vira §e2 pós§r, às vezes com um subproduto: minério de ouro solta Cinábrio,
      ferroso solta platina, carvão solta Enxofre, arenito solta Salitre... Abra o NEI no
      Pulverizador para ver os 260+ processos.
    tasks:
      - get: ThermalExpansion:Machine:1
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ore x8, minecraft:gold_ore x4, minecraft:redstone x16]

  - id: pos_pulverizados
    title: "Dobrando os Minérios"
    type: normal
    deps: [pulverizador]
    icon: ThermalFoundation:material
    desc: |
      Pulverize e veja os números dobrarem! Junte §e16 Pós de Ferro Pulverizado§r e §e8 Pós de Cobre Pulverizado§r e depois funda tudo na Fornalha de Redstone para colher o dobro de lingotes.

      Os pós também são ingredientes: as misturas de liga (Invar, Electro, Bronze) se fazem na bancada a partir deles. Então guarde um pouquinho, combinado? Cada minério passando pelo Pulverizador rende mais, e seu estoque agradece!
    tasks:
      - get: [ThermalFoundation:material x16, ThermalFoundation:material:32 x8]
    rewards:
      - xp: 2
      - item: minecraft:coal x16

  - id: carvao_pulverizado
    title: "Carvão Pulverizado"
    type: normal
    deps: [pulverizador]
    icon: ThermalFoundation:material:2
    desc: |
      Carvão no Pulverizador vira §eCarvão Pulverizado§r, com chance de soltar §eEnxofre§r de brinde.
      O pó de carvão é ingrediente do Pyrotheum, do aço na Fundição e do Carvão Liquefeito no Crisol, ou seja, vai render muito mais adiante. Junte 8 e deixe guardadinho no baú. Se faltar carvão, uma mina rápida resolve. Você já está pegando o jeito da cadeia de pós, Herói!
    tasks:
      - get: ThermalFoundation:material:2 x8
    rewards:
      - xp: 2
      - item: minecraft:coal x16

  - id: enxofre_salitre
    title: "Enxofre e Salitre"
    type: normal
    deps: [carvao_pulverizado]
    icon: ThermalFoundation:material:16
    desc: |
      Dois pós amarelinhos que a química do Thermal adora:
      §e• Enxofre§r — subproduto do Pulverizador (carvão, Netherrack, minério de quartzo,
      bastão de blaze...).
      §e• Salitre (Niter)§r — subproduto do arenito no Pulverizador; o Blitz também deixa cair.

      Junte §e4 de cada§r. O Enxofre vai no Pyrotheum e no Capacitor; o Salitre no Cryotheum,
      no Aerotheum e na Fito-Gosma.
    tasks:
      - get: [ore:dustSulfur x4, ore:dustSaltpeter x4]
    rewards:
      - xp: 2
      - item: minecraft:sandstone x16

  - id: cinabrio
    title: "Cristal de Cinábrio"
    type: optional
    deps: [pulverizador]
    icon: ThermalFoundation:material:20
    desc: |
      Que tal um pouco de sorte na mineração? Pulverize §eminério de redstone§r ou §eminério de ouro§r e, de vez em quando, sai um §eCristal de Cinábrio§r. Guarde!
      Na Fundição Induzida, minério + Cinábrio rende §e3 lingotes§r, o fundente mais forte do Thermal. Não é obrigatório, mas se pintar um, não jogue fora. Se quiser conferir outras receitas com ele, o NEI (R/U) mostra tudo.
    tasks:
      - get: ThermalFoundation:material:20
    rewards:
      - loot: comum

  - id: serraria
    title: "Serraria"
    type: normal
    deps: [fornalha_redstone]
    icon: ThermalExpansion:Machine:2
    desc: |
      Madeira que vira muito mais madeira? Siga o molde padrão com §emachado de ferro em cima§r e §etábuas§r nas laterais.
      A Serraria tira §e6 tábuas por tronco§r (multiplicador 1,5 do pack) e ainda solta §eSerragem§r de bônus. Também desmonta escadas, baús e outras coisas de madeira de volta em tábuas. Alimente com RF, coloque os troncos e relaxe: sua casa nunca mais vai passar necessidade de tábua!
    tasks:
      - get: ThermalExpansion:Machine:2
    rewards:
      - xp: 2
      - item: minecraft:log x16

  - id: serragem
    title: "Serragem"
    type: optional
    deps: [serraria]
    icon: ThermalExpansion:material:512
    desc: |
      Nada se perde no Thermal, Herói! A Serragem que sai da Serraria tem usos de sobra: 8 Serragens em anel viram §eSerragem Comprimida§r, que na fornalha vira carvão vegetal.
      A Serragem também entra nos Florbs e na Fito-Gosma, então vale guardar um estoquinho. Junte o que o quest pedir e, se quiser ver mais usos, aperte U no NEI sobre o item. Lixo? Aqui não existe essa palavra!
    tasks:
      - get: ThermalExpansion:material:513
    rewards:
      - loot: comum

  - id: fundicao_inducao
    title: "Fundição Induzida"
    type: main
    deps: [pulverizador, mistura_invar]
    icon: ThermalExpansion:Machine:3
    desc: |
      Agora sim, metalurgia de verdade! Molde padrão com §ebalde em cima§r e §eInvar§r nas
      laterais... espera, Invar? Pois é: a primeira Fundição precisa de 2 Barras de Invar.
      Faça-as pela §eMistura de Invar§r (2 pós de ferro + 1 pó ferroso na bancada = 3
      misturas) fundida na fornalha.

      A Fundição tem duas entradas: liga metais, faz Vidro Endurecido, aço, e funde minério com
      fundente (areia, Escória Rica, Cinábrio) para render mais lingotes.
    tasks:
      - get: ThermalExpansion:Machine:3
    rewards:
      - xp: 3
      - choice: [minecraft:sand x32, minecraft:iron_ingot x12, ore:ingotNickel x2]

  - id: invar
    title: "Invar"
    type: main
    deps: [fundicao_inducao]
    icon: ThermalFoundation:material:72
    desc: |
      §e2 ferros + 1 níquel = 3 Invar§r (na Fundição, com lingotes ou pós). Duro, resistente ao
      calor e onipresente: Estrutura Endurecida, dínamo magmático, todas as atualizações de
      nível Endurecido, ferramentas e a Picareta que o Quebrador de Terreno exige.

      Junte §e16 Barras de Invar§r. Prometo que vai faltar mesmo assim.
    tasks:
      - get: ore:ingotInvar x16
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ingot x16, ore:ingotNickel x2, minecraft:redstone x16]

  - id: eletro
    title: "Electro"
    type: main
    deps: [fundicao_inducao, prata]
    icon: ThermalFoundation:material:71
    desc: |
      O jogo em pt_BR chama o Electrum de §e"Electro"§r. É §eouro + prata = 2 barras§r. Um condutor perfeito, usado na Bobina Condutora, na Engrenagem de Electro (estrutura Endurecida), no Dínamo de Enervação, no Multímetro...

      Junte §e8 Barras de Electro§r. Misture ouro e prata na Fundição ou na bancada e logo você terá o suficiente. Vai por mim, você usará muito esse metal brilhante daqui para a frente!
    tasks:
      - get: ore:ingotElectrum x8
    rewards:
      - xp: 3
      - choice: [minecraft:gold_ingot x6, ore:ingotSilver x6, minecraft:redstone x16]

  - id: bronze
    title: "Bronze"
    type: normal
    deps: [fundicao_inducao]
    icon: ThermalFoundation:material:73
    desc: |
      Hora de ligar cobre e estanho! A receita é §e3 cobres + 1 estanho = 4 bronzes§r.
      No Thermal o bronze vai no Dínamo Reagente, nos aumentos de velocidade, no Tesserato e no Montador, ou seja, é metal que não encalha. Junte §e8§r e guarde com carinho. Se precisar relembrar a proporção, o NEI (R/U) mostra. Falta pouco para você ter máquinas mais poderosas, Herói!
    tasks:
      - get: ore:ingotBronze x8
    rewards:
      - xp: 2
      - item: ore:ingotCopper x6

  - id: mistura_invar
    title: "Mistura de Invar"
    type: main
    deps: [pulverizador, minerio_ferroso]
    icon: ThermalFoundation:material:40
    desc: |
      Antes da Fundição existir, existe a bancada. §e2 Pós de Ferro Pulverizado + 1 Pó Ferroso =
      3 Misturas de Invar§r. Funda as misturas numa fornalha comum e pronto: Invar sem máquina
      nenhuma.

      Faça §e3 misturas§r. Duas barras vão para a Fundição Induzida, que pede Invar nas laterais.
    tasks:
      - get: ThermalFoundation:material:40 x3
    rewards:
      - xp: 3
      - choice: [minecraft:iron_ore x6, ore:ingotNickel x1, minecraft:coal x16]

  - id: outras_misturas
    title: "Misturas de Bancada"
    type: optional
    deps: [mistura_invar, prata]
    icon: ThermalFoundation:material:39
    desc: |
      O mesmo truque vale para outras ligas: §eMistura de Electro§r (pó de ouro + pó de prata = 2)
      e §eMistura de Bronze§r (3 pós de cobre + 1 de estanho = 4). Pulverizar, misturar e fundir
      dispensa a Fundição — só é mais trabalhoso. Faça qualquer uma.
    tasks:
      - one_of: [ThermalFoundation:material:39, ThermalFoundation:material:41]
    rewards:
      - loot: comum

  - id: aula_lados
    title: "Aula: Configurando os Lados"
    type: info
    deps: [fornalha_redstone]
    icon: ThermalExpansion:wrench
    desc: |
      Toda máquina do Thermal tem uma aba de §eConfiguração§r na lateral da interface. Ali você vê
      o bloco em 3D: clique em cada face para trocar a função dela — cada cor é uma função
      (entrada, saída principal, saída secundária, entrada e saída...). Passe o mouse em cima para
      ler o nome da função.

      Também dá para clicar com o §eMartelo§r direto numa face da máquina. A aba de §eredstone§r
      escolhe se ela ignora, exige ou é desligada por sinal. E, no pack, toda máquina já vem com
      §aauto-entrada e auto-saída§r: ligue a aba de transferência e ela empurra sozinha para o
      que estiver encostado.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: engrenagem_invar
    title: "Engrenagem de Invar"
    type: normal
    deps: [invar]
    icon: ThermalFoundation:material:136
    desc: |
      Engrenagem é coração de máquina! Faça com 4 Invar + 1 ferro e você tem uma §eEngrenagem de Invar§r.
      Ela vai no §eDínamo Magmático§r (duas peças!) e em receitas de outros mods do pack, então não economize. Faça 2. Se o Invar ainda não saiu, ele é ferro com níquel na fundição, confira no NEI (R/U). Cada engrenagem pronta é um passo para a sua usina de energia!
    tasks:
      - get: ThermalFoundation:material:136 x2
    rewards:
      - xp: 2
      - item: minecraft:iron_ingot x4

  - id: engrenagem_eletro
    title: "Engrenagem de Electro"
    type: normal
    deps: [eletro]
    icon: ThermalFoundation:material:135
    desc: |
      Esta é a peça-chave do nível Endurecido! Misture 4 Electros + 1 ferro e pronto.
      A estrutura e cada atualização de máquina leva uma, além do Multímetro, do Dínamo de Enervação e do Flux Transfuser. Faça 2 para começar e, se for evoluir muitas máquinas, faça mais. É um gasto de electro que se paga rápido. Se tiver dúvida no molde, o NEI (R/U) resolve!
    tasks:
      - get: ThermalFoundation:material:135 x2
    rewards:
      - xp: 2
      - item: minecraft:gold_ingot x4

  - id: engrenagem_bronze
    title: "Engrenagem de Bronze"
    type: normal
    deps: [bronze]
    icon: ThermalFoundation:material:137
    desc: |
      Mais uma engrenagem para a coleção! Misture 4 bronzes + 1 ferro e você terá uma §eEngrenagem de Bronze§r.
      Elas são usadas no §eDínamo Reagente§r e no §eFluiVac§r, então valem cada pedacinho de metal. Faça 2 e guarde junto das outras. Se faltar bronze, volte à Fundição e misture mais cobre com estanho. Estamos colecionando peças e a lista de máquinas só cresce, Herói!
    tasks:
      - get: ThermalFoundation:material:137 x2
    rewards:
      - xp: 2
      - item: ore:ingotCopper x6

  - id: aco_fundicao
    title: "Aço na Fundição"
    type: optional
    deps: [fundicao_inducao, carvao_pulverizado]
    icon: minecraft:iron_ingot
    desc: |
      Atalho para quem tem pressa! Como o pack tem aço (oredict `ingotSteel`), a Fundição Induzida ganha uma receita bônus: §e1 ferro + 2 Carvões Pulverizados = 1 aço§r (ou 4 pós de carvão vegetal).
      É um atalho ótimo para os mods que pedem aço, e você não precisa de forno especial nenhum. Junte 2 aços e guarde. Se quiser ver a receita, aperte R no NEI. Quem tem aço na mão ganha tempo!
    tasks:
      - get: ore:ingotSteel x2
    rewards:
      - loot: comum

  - id: obsidiana_pulverizada
    title: "Obsidiana Pulverizada"
    type: normal
    deps: [pulverizador]
    icon: ThermalFoundation:material:4
    desc: |
      Obsidiana no Pulverizador vira §eObsidiana Pulverizada§r, e você vai precisar de MUITA: 4 por cada par de Vidro Endurecido. Junte §e8§r para começar.

      Uma dica para mais tarde: Extrusor Ígneo + Pulverizador = obsidiana infinita. Por enquanto, quebre as suas à mão com um bom pico de diamante e leve ao Pulverizador. Vai ter muito vidro reforçado no seu futuro, Herói!
    tasks:
      - get: ThermalFoundation:material:4 x8
    rewards:
      - xp: 2
      - item: minecraft:obsidian x8

  - id: vidro_endurecido
    title: "Vidro Endurecido"
    type: main
    deps: [obsidiana_pulverizada, fundicao_inducao, chumbo]
    icon: ThermalExpansion:Glass
    desc: |
      Vidro que aguenta explosão? Pode apostar! Na Fundição: §e1 chumbo (lingote ou pó) + 4 Obsidianas Pulverizadas = 2 Vidros Endurecidos§r.
      É à prova de explosão e é a base do nível Reforçado: estruturas, tanques, caixas, células...

      Junte §e8§r. O Alloy Smelter do Ender IO também faz, se preferir. Se travar na receita, aperte R no NEI. Com ele em mãos, sua oficina fica bem mais segura!
    tasks:
      - get: ThermalExpansion:Glass x8
    rewards:
      - xp: 3
      - choice: [minecraft:obsidian x8, ore:ingotLead x6, minecraft:glass x16]

  - id: escoria
    title: "Escória e Escória Rica"
    type: optional
    deps: [fundicao_inducao]
    icon: ThermalExpansion:material:515
    desc: |
      Nem toda sobra é lixo! Fundir minério com areia solta §eEscória§r e, às vezes, §eEscória Rica§r. A Rica é ouro disfarçado: minério + Escória Rica na Fundição rende §e3 lingotes§r.
      A Escória comum vira Lã Rochosa na fornalha e é ingrediente dos Florbs. Guarde as duas, que a missão pede um de cada. Se não aparecer, tente fundir mais minérios com areia, Herói. Um dia você agradece!
    tasks:
      - get: [ThermalExpansion:material:514, ThermalExpansion:material:515]
    rewards:
      - loot: comum

  - id: la_rochosa
    title: "Lã Rochosa"
    type: optional
    deps: [escoria]
    icon: ThermalExpansion:Rockwool
    desc: |
      Quer decorar sem medo de incêndio? Escória na fornalha vira §eLã Rochosa§r, um bloco de lã que não pega fogo.
      Tinja como lã comum e use para forrar a casa das máquinas, que costuma esquentar bastante. Junte 8 blocos e veja como fica bonito. Se quiser conferir corantes e usos, aperte U no NEI. Estética e segurança juntas, o sonho de toda guardiã e de todo Herói!
    tasks:
      - get: ThermalExpansion:Rockwool:* x8
    rewards:
      - loot: comum

  - id: rendimento_minerio
    title: "Aula: Quanto Rende um Minério?"
    type: info
    deps: [fundicao_inducao]
    icon: ThermalExpansion:Machine:3
    desc: |
      Vamos às contas, Herói (eu trouxe o caderninho):
      §e• Fornalha:§r 1 minério = 1 lingote.
      §e• Minério + Pó de Pyrotheum na bancada:§r 1 lingote, sem gastar combustível.
      §e• Pulverizador:§r 1 minério = 2 pós (+ subproduto).
      §e• Fundição + Areia:§r 1 minério = 2 lingotes (+ chance de Escória Rica).
      §e• Fundição + Escória Rica ou Cinábrio:§r 1 minério = §63 lingotes§r.

      Conclusão: guarde a Escória Rica e o Cinábrio para os minérios caros (prata, platina,
      ferroso). Para os baratos, Pulverizador está ótimo.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: primeira_oficina
    title: "A Primeira Oficina Térmica"
    type: milestone
    deps: [pulverizador, fundicao_inducao, celula_leadstone, invar, eletro]
    icon: ThermalExpansion:Machine:1
    banner: "A Oficina Térmica"
    subtitle: "O Fluxo começa a correr"
    desc: |
      Olhe a sua bancada: Pulverizador dobrando minério, Fundição Induzida fazendo ligas, um
      dínamo soprando vapor e uma Célula de Leadstone cheia de RF. Herói, este é o primeiro
      capítulo inteiro do Volume do Fluxo reescrito!

      Dicas de organização:
      §e•§r Use o Martelo nas máquinas para configurar os lados (cada cor é uma função) e
      ligue a §eauto-saída§r — no pack toda máquina já vem com auto-entrada/saída, lados
      configuráveis e controle de redstone de fábrica.
      §e•§r Ponha a Célula entre o dínamo e as máquinas: ela segura os picos.

      Agora vêm os fluidos, os elementais e o nível §eEndurecido§r. Eu estou radiante!
    tasks:
      - get: [ThermalExpansion:Machine:1, ThermalExpansion:Machine:3, ThermalExpansion:Cell:1, ore:ingotInvar x4, ore:ingotElectrum x4]
    rewards:
      - xp: 6
      - kit: {name: "Kit do Aprendiz Térmico", items: [ThermalExpansion:material:1 x4, ThermalExpansion:material:2 x2, ThermalFoundation:material:128 x4, ThermalFoundation:material:129 x2, minecraft:redstone x32]}
      - loot: incomum

  # ======================================================================
  # FASE 2 — FLUIDOS, CRISOL E TRANSPOSITOR
  # ======================================================================
  - id: crisol_magmatico
    title: "Crisol Magmático"
    type: main
    deps: [primeira_oficina, estrutura_leadstone]
    icon: ThermalExpansion:Machine:4
    desc: |
      Uma máquina que derrete pedra! Molde padrão com uma §eEstrutura de Célula de Leadstone§r
      em cima e §etijolos do Nether§r nas laterais. Gasta bastante energia (base 400 RF/t).

      Ele transforma sólidos em fluidos: Redstone → §eRedstone Desestabilizada§r (100 mB),
      Pó de Pedra Luminosa → §ePedra Luminosa Energizada§r (250 mB), Pérola do Ender →
      §eEnder Ressonante§r (250 mB), pedregulho/pedra/obsidiana/Netherrack → lava, e os pós
      elementais → seus fluidos.
    tasks:
      - get: ThermalExpansion:Machine:4
    rewards:
      - xp: 4
      - choice: [minecraft:redstone x32, minecraft:netherrack x32, minecraft:nether_brick x16]

  - id: transpositor
    title: "Transpositor de Fluidos"
    type: main
    deps: [primeira_oficina]
    icon: ThermalExpansion:Machine:5
    desc: |
      Molde padrão com §ebalde em cima§r e §evidro§r nas laterais. O §eTranspositor§r enche e
      esvazia recipientes (baldes, Florbs, tanques portáteis) e faz receitas de "banho":
      arenito + Ender Ressonante = Pedra do Fim, gelo + Cryotheum = gelo compactado, pó de
      pedra luminosa + Redstone Desestabilizada = pó de blaze...

      Use o botão da interface para alternar entre §eencher§r e §eesvaziar§r.
    tasks:
      - get: ThermalExpansion:Machine:5
    rewards:
      - xp: 4
      - choice: [minecraft:bucket x4, minecraft:glass x16, minecraft:redstone x16]

  - id: tanque_portatil
    title: "Tanque Portátil"
    type: normal
    deps: [transpositor]
    icon: ThermalExpansion:Tank:1
    desc: |
      Hora de carregar líquido no bolso! Coloque cobre no meio e 4 vidros em volta para fazer um §eTanque Portátil§r de §e8 000 mB§r (config do pack).
      Ele guarda o fluido quando quebrado, ótimo para carregar lava ou água. Também sobe de nível com Invar, Vidro Endurecido e Endério. Se tiver dúvida no molde, confira no NEI (R/U). Vai ser útil quando você precisar levar combustível para longe, Herói!
    tasks:
      - get: ThermalExpansion:Tank:1
    rewards:
      - xp: 2
      - item: minecraft:glass x8

  - id: redstone_desestabilizada
    title: "Redstone Desestabilizada"
    type: main
    deps: [crisol_magmatico, transpositor]
    icon: ThermalFoundation:bucket
    desc: |
      Derreta redstone no Crisol e coloque o fluido num balde com o Transpositor: §eBalde de
      Redstone Desestabilizada§r. Ela é o "sangue" do Signalo, das Células de Redstone e das
      Ressonantes (4 000 mB por estrutura!).

      §aDica:§r 1 Bloco de Redstone rende 900 mB de uma vez. Use blocos.
    tasks:
      - get: ThermalFoundation:bucket
    rewards:
      - xp: 4
      - choice: [minecraft:redstone_block x4, minecraft:bucket x4, ore:ingotCopper x8]

  - id: pedra_energizada
    title: "Pedra Luminosa Energizada"
    type: normal
    deps: [redstone_desestabilizada]
    icon: ThermalFoundation:bucket:1
    desc: |
      Luz que flutua? Pois é! Coloque Pó de Pedra Luminosa no Crisol (ou blocos, que rendem 1 000 mB) e um balde no Transpositor para fazer o §eBalde de Pedra Luminosa Energizada§r.
      Ele é ingrediente do §eLúmio§r. Essa coisa é tão leve que flutua... §ccuidado ao derramar!§r Se precisar conferir as quantidades, o NEI (R/U) mostra a receita. Divirta-se, Herói!
    tasks:
      - get: ThermalFoundation:bucket:1
    rewards:
      - xp: 3
      - item: minecraft:glowstone_dust x16

  - id: ender_ressonante
    title: "Ender Ressonante"
    type: normal
    deps: [redstone_desestabilizada]
    icon: ThermalFoundation:bucket:2
    desc: |
      Pérolas do Ender no Crisol (250 mB cada) e um balde no Transpositor dão o §eBalde de Ender Ressonante§r.
      Ele é a alma do §5Endério§r e enche a Estrutura do Tesserato (1 000 mB). Já separe as pérolas antes de começar, porque o gasto é alto.

      §cCuidado:§r esse fluido teleporta quem nada nele. Não faça piscina, Herói!
    tasks:
      - get: ThermalFoundation:bucket:2
    rewards:
      - xp: 3
      - item: minecraft:ender_pearl x4

  - id: signalo
    title: "Signalo"
    type: main
    deps: [redstone_desestabilizada, prata]
    icon: ThermalFoundation:material:74
    desc: |
      O §eSignalum§r (aqui "Signalo") é cobre com alma de redstone. Na bancada: §e3 pós de cobre
      + 1 pó de prata + 1 Balde de Redstone Desestabilizada = 4 Misturas de Signalo§r (o balde
      volta vazio). Funda as misturas (fornalha serve).

      Junte §e8 Barras de Signalo§r: elas vão na Engrenagem de Signalo (estrutura Reforçada), na
      Trava de Segurança, nas Placas e nas Lâmpadas.
    tasks:
      - get: ore:ingotSignalum x8
    rewards:
      - xp: 4
      - choice: [ore:ingotCopper x12, ore:ingotSilver x4, minecraft:redstone_block x2]

  - id: lumio
    title: "Lúmio"
    type: main
    deps: [pedra_energizada]
    icon: ThermalFoundation:material:75
    desc: |
      O §eLumium§r ("Lúmio") é estanho que brilha: §e3 pós de estanho + 1 pó de prata + 1 Balde
      de Pedra Luminosa Energizada = 4 Misturas de Lúmio§r, fundidas na fornalha.

      Junte §e4 Barras de Lúmio§r — uma engrenagem delas vai no Insolador Fitogênico, e o pó vira
      lâmpadas lindas.
    tasks:
      - get: ore:ingotLumium x4
    rewards:
      - xp: 4
      - choice: [ore:ingotTin x12, ore:ingotSilver x4, minecraft:glowstone x4]

  - id: engrenagem_signalo
    title: "Engrenagem de Signalo"
    type: normal
    deps: [signalo]
    icon: ThermalFoundation:material:138
    desc: |
      Engrenagem nova na área! Misture 4 Signalos + 1 ferro e pronto.
      Cada estrutura e cada atualização para o nível §eReforçado§r leva uma, então vale ter estoque. Faça 2 e já vá separando o Vidro Endurecido para as próximas peças. Se o Signalo ainda estiver difícil, confira a receita no NEI (R/U). Está na reta final da transição para o nível Reforçado, bora!
    tasks:
      - get: ThermalFoundation:material:138 x2
    rewards:
      - xp: 2
      - item: minecraft:redstone x16

  - id: engrenagem_lumio
    title: "Engrenagem de Lúmio"
    type: normal
    deps: [lumio]
    icon: ThermalFoundation:material:139
    desc: |
      Chegou a vez do Lúmio, Herói! Misture 4 Lúmios + 1 ferro e você terá uma §eEngrenagem de Lúmio§r.
      Ela vai em cima do §eInsolador Fitogênico§r, a estufa do Thermal, então não vai demorar para ter utilidade. Se não tiver o Lúmio ainda, volte à Fundição e à etapa do Balde de Pedra Luminosa Energizada. Confira o NEI (R/U) para ver tudo. Sua estufa te espera!
    tasks:
      - get: ThermalFoundation:material:139
    rewards:
      - xp: 2
      - item: minecraft:glowstone_dust x8

  - id: balde_pyrotheum
    title: "Balde de Pyrotheum"
    type: normal
    deps: [pyrotheum, transpositor]
    icon: ThermalFoundation:bucket:3
    desc: |
      Fogo líquido no balde! Derreta Pó de Pyrotheum no Crisol (250 mB por pó) e encha um balde no Transpositor.
      Esse balde vale §e2 000 000 RF§r no Dínamo Magmático, uma energia e tanto para as suas máquinas. Leve o balde direto ao dínamo e deixe a mágica acontecer.

      §cO fluido queima tudo que encosta.§r Cuidado ao carregar, Herói!
    tasks:
      - get: ThermalFoundation:bucket:3
    rewards:
      - xp: 3
      - item: minecraft:blaze_rod x2

  - id: balde_cryotheum
    title: "Balde de Cryotheum"
    type: optional
    deps: [cryotheum, transpositor]
    icon: ThermalFoundation:bucket:4
    desc: |
      Gelo derretido? Sim, é isso mesmo! Derreta Cryotheum no Crisol e encha um balde no Transpositor para ter o melhor refrigerante do Dínamo de Compressão.
      Se a ideia é ter uma usina potente, ele vale o esforço. Confira no NEI (R/U) a quantidade de pó necessária.

      §cEle congela água e fere quem nadar nele.§r Mantenha-se longe da borda, Herói!
    tasks:
      - get: ThermalFoundation:bucket:4
    rewards:
      - loot: comum

  - id: carvao_liquefeito
    title: "Carvão Liquefeito"
    type: optional
    deps: [carvao_pulverizado, crisol_magmatico, transpositor]
    icon: ThermalFoundation:bucket:6
    desc: |
      Combustível barato feito de carvão! Carvão Pulverizado no Crisol vira §eCarvão Liquefeito§r (100 mB por pó).
      No Dínamo de Compressão rende 1 000 000 RF por balde, um combustível líquido feito só de carvão. Se você tem uma mina que dá carvão de sobra, isso é ouro. Encha o balde no Transpositor e leve ao dínamo. Se tiver dúvida, o NEI (R/U) ajuda!
    tasks:
      - get: ThermalFoundation:bucket:6
    rewards:
      - loot: comum

  - id: banhos_transpositor
    title: "Banhos do Transpositor"
    type: optional
    deps: [ender_ressonante, pedra_energizada]
    icon: minecraft:end_stone
    desc: |
      Três truques do Transpositor que conferi no NEI:
      §e•§r Arenito + Ender Ressonante = §ePedra do Fim§r.
      §e•§r Gelo + Cryotheum = §eGelo Compactado§r.
      §e•§r Pó de Pedra Luminosa + Redstone Desestabilizada = §ePó de Blaze§r (Pyrotheum sem ir ao
      Nether!).

      Faça qualquer um deles.
    tasks:
      - one_of: [minecraft:end_stone x4, minecraft:packed_ice x4, minecraft:blaze_powder x4]
    rewards:
      - loot: comum

  - id: florb_magmatico
    title: "Florb Magmático"
    type: optional
    deps: [florbs]
    icon: ThermalExpansion:florb:1
    desc: |
      Quer pescar lava? Misture Serragem + Escória + Creme de Magma (ou slime + pó de blaze) para fazer 4 §eFlorbs Magmáticos§r.
      São os únicos que aguentam lava e outros fluidos quentes. Encha um com lava e... use com responsabilidade, por favor! Se a receita parecer estranha, aperte R no NEI. Você já está dominando o Thermal, Herói!
    tasks:
      - get: ThermalExpansion:florb:1
    rewards:
      - loot: comum

  - id: florbs
    title: "Florbs"
    type: optional
    deps: [transpositor, escoria, serragem]
    icon: ThermalExpansion:florb
    desc: |
      Serragem + Escória + Bola de Slime = §e4 Florbs§r. Encha no Transpositor com 1 000 mB de
      qualquer fluido e §earremesse§r: onde ele cair, vira um bloco de fluido. Com Creme de Magma
      no lugar do slime saem os §eFlorbs Magmáticos§r, que aguentam fluidos quentes (lava!).

      Sim, você pode jogar lava nos inimigos. Não, eu não recomendo dentro de casa.
    tasks:
      - get: ThermalExpansion:florb:*
    rewards:
      - loot: comum

  - id: esponja_termica
    title: "Esponjas Térmicas"
    type: optional
    deps: [serragem]
    icon: ThermalExpansion:Sponge:1
    desc: |
      Vazou, derramou, secou! Barbante + Serragem + Bola de Slime = §eEsponja Simples§r, que absorve água. Com Creme de Magma vira a §eEsponja Magmática§r, que também absorve lava.
      Ótimas para limpar aquele vazamento que você jura que não foi culpa sua. Faça uma de cada e guarde na bolsa para emergências. A receita completa está no NEI (R). Prevenir é bem mais barato que reconstruir!
    tasks:
      - one_of: [ThermalExpansion:Sponge:1, ThermalExpansion:Sponge:2]
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 3 — OS ELEMENTAIS
  # ======================================================================
  - id: elementais
    title: "Aula: Os Elementais"
    type: info
    deps: [crisol_magmatico]
    icon: ThermalFoundation:material:1024
    desc: |
      O Thermal Foundation tem três "primos" do Blaze, e cada um deixa cair um bastão:
      §b• Blizz§r — biomas frios/nevados. Bastão de Blizz (+ bolas de neve).
      §e• Blitz§r — planícies e biomas arenosos. Bastão de Blitz (+ Salitre).
      §6• Basalz§r — montanhas e terras devastadas. Bastão de Basalz (+ Obsidiana Pulverizada).

      Todos aparecem no escuro (luz 8 ou menos), em grupos de até 4, e atiram projéteis do seu
      elemento. Bastões viram 2 pós na bancada ou no Pulverizador. E não esqueça do bom e velho
      §cBlaze§r do Nether: o Pyrotheum precisa do pó dele.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: blaze
    title: "Pó de Blaze"
    type: normal
    deps: [elementais]
    icon: minecraft:blaze_powder
    desc: |
      Hora de ir ao Nether, Herói! Vá às fortalezas e cace Blazes. No Pulverizador, cada §eBastão de Blaze§r rende §e4 Pós de Blaze§r (+ enxofre de vez em quando), o dobro da bancada!
      Junte §e8 pós§r. Leve armadura boa e água para apagar o fogo, porque eles atiram bolas flamejantes. Com o pó em mãos, o Pyrotheum fica mais perto. Boa caçada!
    tasks:
      - get: minecraft:blaze_powder x8
    rewards:
      - xp: 3
      - item: minecraft:glowstone_dust x8

  - id: pyrotheum
    title: "Pyrotheum Ardente"
    type: main
    deps: [blaze, enxofre_salitre]
    icon: ThermalFoundation:material:512
    desc: |
      O fogo engarrafado do Thermal! Na bancada: §eCarvão Pulverizado + Enxofre + Redstone + Pó
      de Blaze = 2 Pós de Pyrotheum§r.

      Ele vira fluido no Crisol (250 mB), que no Dínamo Magmático vale §e2 000 000 RF por
      balde§r (11× a lava!). Também é fundente da Fundição (Endério!), vai nos aumentos de
      velocidade e no Capacitor Ressonante. Junte §e8 pós§r.
    tasks:
      - get: ThermalFoundation:material:512 x8
    rewards:
      - xp: 4
      - choice: [minecraft:blaze_rod x4, ThermalFoundation:material:2 x8, minecraft:redstone x16]

  - id: blizz
    title: "O Blizz"
    type: normal
    deps: [elementais]
    icon: ThermalFoundation:material:1024
    desc: |
      Agasalhe-se, Herói! Procure o §bBlizz§r em biomas nevados, à noite ou em cavernas. Ele atira bolas de gelo que deixam você lento, então mantenha distância e ataque rápido.
      Traga §e4 Bastões de Blizz§r. Eles servem para o pó de Cryotheum mais adiante, confira no NEI (R/U). Uma boa espada e uma boa armadura fazem toda a diferença. Boa sorte nessa caçada gelada!
    tasks:
      - get: ThermalFoundation:material:1024 x4
    rewards:
      - xp: 3
      - item: minecraft:snowball x16

  - id: cryotheum
    title: "Cryotheum Gélido"
    type: normal
    deps: [blizz, enxofre_salitre]
    icon: ThermalFoundation:material:513
    desc: |
      Bola de neve + Salitre + Redstone + Pó de Blizz = §e2 Pós de Cryotheum§r. É o melhor
      refrigerante do Dínamo de Compressão (4 000 000 por balde contra 400 000 da água) e vai nos
      aumentos de dínamo de nível III. Junte §e4§r.
    tasks:
      - get: ThermalFoundation:material:513 x4
    rewards:
      - xp: 3
      - item: minecraft:snowball x16

  - id: blitz
    title: "O Blitz"
    type: optional
    deps: [elementais]
    icon: ThermalFoundation:material:1026
    desc: |
      Um elemental de ar que gosta de planícies e desertos. Derrote alguns e traga §e2 Bastões de Blitz§r. Bônus: ele deixa cair Salitre.
      É uma tarefa opcional, mas os bastões servem para o Aerotheum, o terceiro elemento do quarteto. Fique de olho no céu e leve um arco, que eles voam e atiram rajadas de ar. Se precisar de ajuda para achar a receita, o NEI (R/U) mostra. Boa caçada, Herói!
    tasks:
      - get: ThermalFoundation:material:1026 x2
    rewards:
      - loot: comum

  - id: aerotheum
    title: "Aerotheum Zéfiro"
    type: optional
    deps: [blitz, enxofre_salitre]
    icon: ThermalFoundation:material:514
    desc: |
      Areia + Salitre + Redstone + Pó de Blitz = §e2 Pós de Aerotheum§r. Nesta versão os usos
      são poucos: vira um fluido mais leve que o ar no Crisol e serve em algumas receitas de
      outros mods (confira com U no NEI). Mais pela coleção que pela fábrica.
    tasks:
      - get: ThermalFoundation:material:514 x2
    rewards:
      - loot: comum

  - id: basalz
    title: "O Basalz"
    type: optional
    deps: [elementais]
    icon: ThermalFoundation:material:1028
    desc: |
      Um elemental de pedra das montanhas e terras devastadas. Ele joga pedrinhas e deixa cair Obsidiana Pulverizada.
      Traga §e2 Bastões de Basalz§r. É um desafio opcional, mas o Basalz é essencial para o Petrotheum, o último elemento do quarteto. Leve uma boa armadura, porque as pedradas doem. Se quiser ver outros usos, aperte U no NEI. Está quase completando o quarteto, Herói!
    tasks:
      - get: ThermalFoundation:material:1028 x2
    rewards:
      - loot: comum

  - id: petrotheum
    title: "Petrotheum Tectônico"
    type: optional
    deps: [basalz, obsidiana_pulverizada]
    icon: ThermalFoundation:material:515
    desc: |
      Argila + Obsidiana Pulverizada + Redstone + Pó de Basalz = §e2 Pós de Petrotheum§r.
      Como o Aerotheum, aqui é quase um item de coleção: vira fluido no Crisol. Completa o quarteto elemental, e eu adoro um quarteto completo! Se algum ingrediente faltar, confira o NEI (R/U) e volte à caçada do Basalz. Quando chegar aqui, você já terá os quatro pós, e o cantinho elemental ficará lindo.
    tasks:
      - get: ThermalFoundation:material:515 x2
    rewards:
      - loot: comum

  - id: quarteto_elemental
    title: "O Quarteto Elemental"
    type: optional
    deps: [pyrotheum, cryotheum, aerotheum, petrotheum]
    icon: ThermalFoundation:material:512
    desc: |
      Fogo, gelo, ar e terra numa mesma mochila! Junte 1 pó de cada elemento: Pyrotheum, Cryotheum, Aerotheum e Petrotheum.
      Os Antigos chamavam isso de "os quatro cantos da página". Eu chamo de "tarde produtiva". Se faltar algum, a receita está no NEI (R/U) e os elementais estão pelo mundo te esperando. Reunir tudo é a parte divertida, Herói!
    tasks:
      - get: [ThermalFoundation:material:512, ThermalFoundation:material:513, ThermalFoundation:material:514, ThermalFoundation:material:515]
    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 4 — AS OUTRAS MÁQUINAS
  # ======================================================================
  - id: precipitador
    title: "Precipitador Glacial"
    type: normal
    deps: [primeira_oficina]
    icon: ThermalExpansion:Machine:6
    desc: |
      Frio sem sair de casa! Siga o molde padrão com §epistão em cima§r e §eInvar§r nas laterais para fazer o Precipitador Glacial.
      Ele congela água em §eneve, blocos de neve e gelo§r usando energia. Bolas de neve para o Cryotheum, gelo para o Transpositor... sem viajar até a tundra. Ligue a energia e um tanque de água e deixe trabalhar. Confira o NEI (R/U) se travar!
    tasks:
      - get: ThermalExpansion:Machine:6
    rewards:
      - xp: 2
      - item: minecraft:water_bucket

  - id: extrusor
    title: "Extrusor Ígneo"
    type: normal
    deps: [primeira_oficina]
    icon: ThermalExpansion:Machine:7
    desc: |
      Molde com §epistão em cima§r, §evidro§r nas laterais e um §eServo Pneumático§r no lugar da
      bobina. Ele mistura lava e água para fazer rocha, sem gastar RF:
      §e• Pedregulho:§r não consome nada.
      §e• Pedra:§r consome água (1 000 mB).
      §e• Obsidiana:§r consome 1 000 mB de lava e de água.

      Obsidiana automática = Obsidiana Pulverizada infinita = Vidro Endurecido infinito.
    tasks:
      - get: ThermalExpansion:Machine:7
    rewards:
      - xp: 2
      - item: minecraft:lava_bucket

  - id: acumulador
    title: "Acumulador Aquoso"
    type: normal
    deps: [primeira_oficina]
    icon: ThermalExpansion:Machine:8
    desc: |
      Molde com §ebalde em cima§r, §evidro§r nas laterais e Servo embaixo. Coloque-o encostado em
      §epelo menos 2 blocos-fonte de água§r e ele gera §e25 mB/t§r de graça (no pack não há
      geração passiva sem as fontes). Água infinita para o Dínamo a Vapor e o Extrusor!
    tasks:
      - get: ThermalExpansion:Machine:8
    rewards:
      - xp: 2
      - item: minecraft:water_bucket x2

  - id: montador
    title: "Montador Cíclico"
    type: normal
    deps: [primeira_oficina, bronze]
    icon: ThermalExpansion:Machine:9
    desc: |
      Uma bancada que trabalha sozinha! Molde com §ebaú em cima§r e §eEngrenagens de Estanho§r nas laterais.
      O §eMontador Cíclico§r é uma bancada automática: coloque um §eEsquema§r (2 papéis + corante azul) gravado numa Bancada do Maquinista ou na própria máquina, alimente os ingredientes e ele fabrica sozinho, com RF. Ótimo para produzir em escala. Se quiser, o NEI (R/U) mostra as receitas, Herói!
    tasks:
      - get: ThermalExpansion:Machine:9
    rewards:
      - xp: 2
      - item: minecraft:paper x16

  - id: infusor
    title: "Infusor Energético"
    type: normal
    deps: [primeira_oficina, estrutura_leadstone]
    icon: ThermalExpansion:Machine:10
    desc: |
      Carregue qualquer coisa! Molde com §eEstrutura de Leadstone em cima§r e §eBobinas Transmissoras§r nas laterais para fazer o Infusor Energético.
      Ele §ecarrega itens com RF§r: capacitores, ferramentas elétricas, armaduras de outros mods... Enfie a energia na máquina e o item no slot. Se tiver dúvida no molde, o NEI (R/U) ajuda. Nunca mais fique sem bateria no meio da aventura, Herói!
    tasks:
      - get: ThermalExpansion:Machine:10
    rewards:
      - xp: 2
      - item: minecraft:redstone x16

  - id: insolador
    title: "Insolador Fitogênico"
    type: normal
    deps: [engrenagem_lumio]
    icon: ThermalExpansion:Machine:11
    desc: |
      Uma estufa dentro de casa! Molde com §eEngrenagem de Lúmio em cima§r e §eterra§r nas laterais.
      É uma estufa: semente + fertilizante + água + RF = colheita (e mais sementes). Planta árvores, cana, cacto, vinhas, melancias, cogumelos... (264 receitas no NEI!). Aperte R e U para explorar e escolha o que quer plantar. Seu estoque de comida e madeira acaba de ganhar um upgrade, Herói!
    tasks:
      - get: ThermalExpansion:Machine:11
    rewards:
      - xp: 3
      - item: minecraft:wheat_seeds x16

  - id: fito_gosma
    title: "Fito-Gosma"
    type: optional
    deps: [insolador, escoria]
    icon: ThermalExpansion:material:516
    desc: |
      O adubo do Insolador! Carvão Vegetal Pulverizado + Salitre + Escória = §e32 Fito-Gosmas§r (ou 2 serragens + salitre + escória = 8).
      Com Escória Rica sai a §eFito-Gosma Enriquecida§r, que no Insolador triplica a colheita. Funciona como farinha de osso também. Junte 16 para começar e confira outras variações no NEI (R/U). Sua plantação nunca esteve tão bem alimentada, Herói!
    tasks:
      - get: ThermalExpansion:material:516 x16
    rewards:
      - loot: comum

  - id: dinamo_magmatico
    title: "Dínamo Magmático"
    type: main
    deps: [engrenagem_invar, crisol_magmatico]
    icon: ThermalExpansion:Dynamo:1
    desc: |
      O dínamo de Invar queima §efluidos quentes§r: lava vale §e180 000 RF por balde§r e
      Pyrotheum fundido vale §e2 000 000 RF§r. Um Crisol derretendo Netherrack + um Dínamo
      Magmático é a usina clássica do Thermal (o Crisol gasta, o dínamo devolve com lucro).

      Produção base: 80 RF/t, como todos os dínamos — os aumentos multiplicam isso.
    tasks:
      - get: ThermalExpansion:Dynamo:1
    rewards:
      - xp: 4
      - choice: [minecraft:lava_bucket x2, minecraft:netherrack x64, ore:ingotInvar x4]

  - id: dinamo_compressao
    title: "Dínamo de Compressão"
    type: normal
    deps: [dinamo_magmatico]
    icon: ThermalExpansion:Dynamo:2
    desc: |
      De estanho. Queima §ecombustível líquido§r e precisa de §erefrigerante§r. Valores do pack:
      Combustível do BuildCraft 1 500 000 RF/balde, Carvão Liquefeito 1 000 000, biocombustível e
      etanol 500 000, petróleo 150 000. Refrigerante: água (400 000) ou, muito melhor,
      §bCryotheum§r (4 000 000).

      Ótimo par para a Refinaria do capítulo do BuildCraft!
    tasks:
      - get: ThermalExpansion:Dynamo:2
    rewards:
      - xp: 3
      - item: minecraft:water_bucket

  - id: dinamo_reagente
    title: "Dínamo Reagente"
    type: normal
    deps: [dinamo_magmatico, engrenagem_bronze]
    icon: ThermalExpansion:Dynamo:3
    desc: |
      De bronze. Usa um §efluido§r (Redstone Desestabilizada, Pedra Luminosa Energizada,
      biomassa, creosoto, óleo de sementes, essência de mob, lodo...) junto de um §ereagente
      sólido§r. Confira no NEI quais reagentes ele aceita — o tooltip do dínamo também mostra.
      É a ponte perfeita com fazendas do MineFactory e do Forestry.
    tasks:
      - get: ThermalExpansion:Dynamo:3
    rewards:
      - xp: 3
      - item: minecraft:sugar x16

  - id: dinamo_enervacao
    title: "Dínamo de Enervação"
    type: normal
    deps: [dinamo_magmatico, eletro]
    icon: ThermalExpansion:Dynamo:4
    desc: |
      Um dínamo que come energia guardada! Faça com Electro. Ele "suga" o fluxo de objetos: §eredstone§r (64 000 RF cada no pack) e itens que guardam RF (capacitores e baterias cheias).
      Útil para esvaziar baterias velhas ou queimar a redstone que sobra das minas. Confira o NEI (R/U) se travar na receita. Mais uma forma de aproveitar tudo que você junta, Herói!
    tasks:
      - get: ThermalExpansion:Dynamo:4
    rewards:
      - xp: 3
      - item: minecraft:redstone x32

  # ======================================================================
  # FASE 5 — FERRAMENTAS E DISPOSITIVOS
  # ======================================================================
  - id: multimetro
    title: "Multímetro"
    type: normal
    deps: [eletro]
    icon: ThermalExpansion:meter
    desc: |
      Para quem gosta de números! Cobre, chumbo, uma Bobina Condutora e uma Engrenagem de Electro formam o §eMultímetro§r.
      Ele mostra energia, fluidos e estado de máquinas ao clicar nelas, e agachado configura alguns dispositivos. Para quem gosta de números (oi!), é amor à primeira leitura. Guarde na hotbar e use sempre que algo estiver estranho. Se precisar da receita, aperte R no NEI.
    tasks:
      - get: ThermalExpansion:meter
    rewards:
      - xp: 2
      - item: ore:ingotElectrum x2

  - id: chave_batalha
    title: "Chave Inglesa de Batalha"
    type: optional
    deps: [invar, martelo]
    icon: ThermalExpansion:tool.battleWrenchInvar
    desc: |
      "90% martelo, 10% chave inglesa", diz o tooltip! A §eChave Inglesa de Batalha§r de Invar é arma e ferramenta ao mesmo tempo.
      Perfeita para quem configura máquinas no meio de um ataque de zumbis, Herói. É opcional, mas fica ótima na hotbar. Se a receita confundir, aperte R no NEI e confira os ingredientes. Pronta para bater e consertar com a mesma mão?
    tasks:
      - get: ThermalExpansion:tool.battleWrenchInvar
    rewards:
      - loot: comum

  - id: ferramentas_invar
    title: "Picareta de Invar"
    type: normal
    deps: [invar]
    icon: ThermalFoundation:tool.pickaxeInvar
    desc: |
      Vamos minerar com estilo! A §ePicareta de Invar§r minera como uma de ferro com mais durabilidade, e é ingrediente obrigatório do §eQuebrador de Terreno§r.
      Faça uma e, se quiser, o resto do conjunto de Invar: espada, pá, machado, enxada, foice... Se a receita parecer estranha, o NEI (R/U) ajuda. Seu Quebrador de Terreno já está esperando essa picareta, Herói!
    tasks:
      - get: ThermalFoundation:tool.pickaxeInvar
    rewards:
      - xp: 2
      - item: ore:ingotInvar x3

  - id: armadura_invar
    title: "Armadura de Invar"
    type: optional
    deps: [ferramentas_invar]
    icon: ThermalFoundation:armor.plateInvar
    desc: |
      Invar resiste ao calor e às pancadas, e a armadura dele é uma das mais duráveis entre os metais comuns do Thermal.
      Vista as quatro peças: capacete, peitoral, calças e botas. É opcional, mas combina bem com quem vai mexer com fogo e lava nas próximas etapas. Se faltar alguma receita, confira no NEI (R/U). Vai ficar tão elegante quanto protegida, Herói!
    tasks:
      - get: [ThermalFoundation:armor.helmetInvar, ThermalFoundation:armor.plateInvar, ThermalFoundation:armor.legsInvar, ThermalFoundation:armor.bootsInvar]
    rewards:
      - loot: incomum

  - id: capacitor_leadstone
    title: "Capacitor de Flux de Leadstone"
    type: normal
    deps: [chumbo, enxofre_salitre]
    icon: ThermalExpansion:capacitor:2
    desc: |
      Uma bateria de bolso, Herói! Faça com chumbo, cobre, redstone e §eEnxofre§r e guarde §e80 000 RF§r (pack).
      Agachado + clique ativa o modo de carregar os itens da sua barra de atalhos. Para encher, use o Infusor Energético. Se faltar enxofre, volte ao Pulverizador e processe mais carvão. Com ela no bolso, suas ferramentas elétricas nunca ficam sem energia!
    tasks:
      - get: ThermalExpansion:capacitor:2
    rewards:
      - xp: 2
      - item: minecraft:redstone x16

  - id: capacitor_batata
    title: "Capacitor de Batata"
    type: optional
    deps: [capacitor_leadstone]
    icon: ThermalExpansion:capacitor:1
    desc: |
      Batata, redstone e pepita de chumbo viram um §eCapacitor de Flux Tuberoso§r! Ele vem com 32 000 RF e §cnão recarrega§r.
      "Esperto! Mas não recarregável", diz o tooltip. Eu só queria que você soubesse que isso existe. É opcional, claro, mas é divertido ter um capacitor de batata na coleção. Se quiser ver a receita, aperte R no NEI.
    tasks:
      - get: ThermalExpansion:capacitor:1
    rewards:
      - loot: comum

  - id: ferramentas_fluxo
    title: "Ferramentas de Fluxo"
    type: optional
    deps: [capacitor_leadstone]
    icon: ThermalExpansion:igniter
    desc: |
      Com um Capacitor de Leadstone no meio da receita, o Thermal faz quatro brinquedos:
      §e• Ignição por Flux§r (acende fogo a distância), §e• Flux Chiller§r (congela a
      distância), §e• FluiVac§r (bomba de fluidos portátil) e §e• Flux Transfuser§r (passa RF
      entre itens e blocos). Faça qualquer um.
    tasks:
      - one_of: [ThermalExpansion:igniter, ThermalExpansion:chiller, ThermalExpansion:pump, ThermalExpansion:transfuser]
    rewards:
      - loot: comum

  - id: ativador
    title: "Ativador Autônomo"
    type: normal
    deps: [primeira_oficina]
    icon: ThermalExpansion:Device:2
    desc: |
      Um jogador falso trabalhando por você! Misture baú + pistão + Engrenagens de Estanho + Bobina Receptora para criar o §eAtivador Autônomo§r.
      Ele usa o item que estiver dentro dele (clique direito ou esquerdo, agachado ou não). Planta, alimenta animais, usa ferramentas... "Faz mais do que um tooltip consegue explicar." Confira o NEI (R/U) para ideias. Boa automação, Herói!
    tasks:
      - get: ThermalExpansion:Device:2
    rewards:
      - xp: 2
      - item: minecraft:wheat_seeds x16

  - id: quebrador
    title: "Quebrador de Terreno"
    type: normal
    deps: [ferramentas_invar]
    icon: ThermalExpansion:Device:3
    desc: |
      Bloco no caminho? Resolva com um Quebrador de Terreno! Misture Picareta de Invar + pistão + Engrenagens de Estanho + Servo.
      O §eQuebrador de Terreno§r quebra o bloco à frente quando recebe sinal de redstone. Pedregulho do Extrusor + Quebrador + Pulverizador = areia/cascalho automáticos. "Quebra blocos. Simples assim." Confira o NEI (R/U) se quiser, Herói!
    tasks:
      - get: ThermalExpansion:Device:3
    rewards:
      - xp: 2
      - item: minecraft:cobblestone x64

  - id: coletor
    title: "Aparelho de Aquisição"
    type: normal
    deps: [primeira_oficina]
    icon: ThermalExpansion:Device:4
    desc: |
      Quem quebra, alguém tem que recolher! Funil + pistão + Engrenagens de Estanho + Servo formam o §eAparelho de Aquisição§r.
      Ele recolhe itens caídos numa área à frente dele e guarda ou empurra para um inventário. Par perfeito do Quebrador de Terreno, então monte os dois juntos. Se o molde confundir, aperte R no NEI. Nada de coletar à mão, Herói!
    tasks:
      - get: ThermalExpansion:Device:4
    rewards:
      - xp: 2
      - item: minecraft:hopper

  - id: nulificador
    title: "Nulificador"
    type: normal
    deps: [primeira_oficina, invar]
    icon: ThermalExpansion:Device:5
    desc: |
      Ele "remove coisas da existência"! Misture Invar + balde de lava + Engrenagens de Estanho + Servo para fazer o §eNulificador§r.
      Itens e fluidos que entram nele simplesmente somem. É a lixeira oficial para o pedregulho que sobra das minas, então coloque ele no fim da linha de produção. Confira o NEI (R/U) se travar na receita. Adeus, inventário lotado!
    tasks:
      - get: ThermalExpansion:Device:5
    rewards:
      - xp: 2
      - item: minecraft:lava_bucket

  - id: alocador
    title: "Alocador de Itens"
    type: normal
    deps: [primeira_oficina]
    icon: ThermalExpansion:Device:6
    desc: |
      Um pequeno buffer entre máquinas! Misture Engrenagem de Cobre + funil + Engrenagens de Estanho + Servo para fazer o §eAlocador de Itens§r.
      Ele guarda e transfere itens, com entrada e saída configuráveis. Ótimo entre uma máquina rápida e uma lenta, para ninguém ficar esperando. Se quiser ver a receita, aperte R no NEI. Organização é meio caminho andado, Herói!
    tasks:
      - get: ThermalExpansion:Device:6
    rewards:
      - xp: 2
      - item: minecraft:chest x2

  - id: caixa_forte
    title: "Caixa Forte"
    type: normal
    deps: [fundacao_termica]
    icon: ThermalExpansion:Strongbox:1
    desc: |
      Um baú que se muda com você! Coloque um baú com 4 estanhos em volta para fazer a §eCaixa Forte§r.
      Ela §eguarda o conteúdo quando quebrada§r (mudar de casa nunca foi tão fácil) e sobe de nível com Invar, Vidro Endurecido e Endério, ganhando espaço a cada nível. Se travar na receita, o NEI (R/U) resolve. Mude de base sem esvaziar nenhum baú, Herói!
    tasks:
      - get: ThermalExpansion:Strongbox:1
    rewards:
      - xp: 2
      - item: minecraft:chest x2

  - id: estoque
    title: "Estoque"
    type: normal
    deps: [fundacao_termica]
    icon: ThermalExpansion:Cache:1
    desc: |
      Seu baú agradece! Coloque um tronco cercado de 4 estanhos para criar o §eEstoque (Cache)§r, que guarda MUITO de um único item.
      São §e10 000§r no básico, 40 000 no Endurecido, 160 000 no Reforçado e 640 000 no Ressonante (pack). Cobblestone, terra, areia... tudo cabe. Se tiver dúvida, o NEI (R/U) mostra a receita. Chega de inventário lotado de pedregulho, Herói!
    tasks:
      - get: ThermalExpansion:Cache:1
    rewards:
      - xp: 2
      - item: minecraft:log x8

  - id: sacola
    title: "Sacola"
    type: normal
    deps: [fundacao_termica]
    icon: ThermalExpansion:satchel:1
    desc: |
      Uma mochila extra para a mão! Misture lã, estanho e couro (ou Lã Rochosa) e crie a §eSacola§r.
      Cada nível (Endurecida, Reforçada, Ressonante) aumenta o espaço. Leve com você quando for explorar e guarde o que não cabe no inventário. A receita está no NEI (R/U), caso tenha dúvida. Mais espaço para tesouros, Herói!
    tasks:
      - get: ThermalExpansion:satchel:1
    rewards:
      - xp: 2
      - item: minecraft:leather x6

  - id: bancada_maquinista
    title: "Bancada do Maquinista"
    type: optional
    deps: [caixa_forte]
    icon: ThermalExpansion:Workbench:1
    desc: |
      Uma bancada de trabalho com superpoderes! Ela tem inventário próprio (mantido ao quebrar) e slots para §eEsquemas§r: grave uma receita e refaça com um clique.
      Esquemas (2 papéis + corante azul) também alimentam o Montador Cíclico. É opcional, mas economiza um tempão em quem faz o mesmo item toda hora. Confira as receitas no NEI (R/U). Quem automatiza, ganha tempo, Herói!
    tasks:
      - get: [ThermalExpansion:Workbench:1, ThermalExpansion:diagram]
    rewards:
      - loot: comum

  - id: planta_vermelha
    title: "Planta Vermelha"
    type: optional
    deps: [bancada_maquinista]
    icon: ThermalExpansion:diagram:1
    desc: |
      Copiar e colar em Minecraft? Sim! 2 papéis + redstone = §ePlanta Vermelha (Redprint)§r.
      Clique numa máquina configurada para copiar os lados e ajustes, e depois clique em outra para colar. Montar vinte Pulverizadores iguais nunca foi tão rápido! É opcional, mas se você pretende ter várias máquinas iguais, vale o investimento. Confira o NEI (R/U) se travar.
    tasks:
      - get: ThermalExpansion:diagram:1
    rewards:
      - loot: comum

  - id: trava_seguranca
    title: "Trava de Segurança"
    type: optional
    deps: [signalo]
    icon: ThermalExpansion:material:16
    desc: |
      Segurança em primeiro lugar! Bronze + pepitas de Signalo = §eTrava de Segurança§r.
      Combine com uma máquina, célula, caixa ou sacola na bancada e ela passa a ter dono: público, amigos ou só você. Num servidor cheio de gente curiosa, isso vale ouro. Se jogar sozinho, é opcional, mas dá tranquilidade. Veja a receita no NEI (R/U). Seus tesouros, suas regras, Herói!
    tasks:
      - get: ThermalExpansion:material:16
    rewards:
      - loot: comum

  # ======================================================================
  # FASE 6 — NÍVEL ENDURECIDO
  # ======================================================================
  - id: estrutura_endurecida
    title: "Estrutura Endurecida"
    type: main
    deps: [primeira_oficina, engrenagem_eletro]
    icon: ThermalExpansion:Frame:1
    desc: |
      Agora as máquinas sobem de nível! Estrutura Básica no centro + §e4 Invar + 1 Engrenagem de Electro§r em cima = §eEstrutura de Máquina (Endurecida)§r.

      Você pode fabricar máquinas novas já com essa estrutura... ou fazer melhor: atualizar as que já tem (próxima quest). Se tiver dúvida no molde, aperte R no NEI. Um passo gigante na evolução, Herói, vamos nessa!
    tasks:
      - get: ThermalExpansion:Frame:1
    rewards:
      - xp: 4
      - choice: [ore:ingotInvar x4, ore:ingotElectrum x4, minecraft:iron_ingot x16]

  - id: maquina_endurecida
    title: "Máquina Endurecida"
    type: main
    deps: [estrutura_endurecida]
    icon: ThermalExpansion:Machine:1
    desc: |
      Coloque uma máquina Básica no centro da bancada com o mesmo padrão da estrutura (§e4 Invar
      + Engrenagem de Electro§r) e ela vira §eEndurecida§r, mantendo a configuração.

      Cada nível dá §e+1 slot de aumento§r (Básico 3, Endurecido 4, Reforçado 5, Ressonante 6),
      mais energia guardada e mais RF/t aceito. E só máquinas Endurecidas aceitam aumentos de
      nível I. Atualize qualquer máquina.
    tasks:
      - {get: 'ThermalExpansion:Machine:* {Level:1b}', nbt: true}
    rewards:
      - xp: 4
      - choice: [ore:ingotInvar x6, ThermalFoundation:material:135, ore:ingotBronze x6]

  - id: aula_aumentos
    title: "Aula: Aumentos"
    type: info
    deps: [maquina_endurecida]
    icon: ThermalExpansion:augment:128
    desc: |
      Os §eAumentos§r (augments) entram na aba lateral das máquinas e dínamos. Regras que eu
      conferi no próprio código do mod:
      §e•§r Aumentos têm níveis I, II e III. §cEm máquinas, o nível I exige máquina Endurecida,
      o II Reforçada e o III Ressonante.§r Dínamos não têm níveis e aceitam qualquer um.
      §e•§r O nível II só funciona se o I também estiver instalado (e o III precisa do II).
      §e•§r Não adianta repetir o mesmo aumento.
      §e•§r Os aumentos "integrados" (auto-saída, auto-entrada, lados configuráveis e controle de
      redstone) §ajá vêm embutidos em toda máquina deste pack§r — não precisa fabricá-los.

      Velocidade: ×2/×4/×8, mas a máquina gasta +50%/+100%/+150% de energia por item.
    tasks:
      - check
    rewards:
      - xp: 1

  - id: aumento_velocidade_1
    title: "Velocidade I"
    type: normal
    deps: [aula_aumentos, bronze]
    icon: ThermalExpansion:augment:128
    desc: |
      A máquina mais rápida da região! Faça a §eCaixa de Engrenagem Secundária§r com bronze + Bobina Receptora + redstone. Ela dobra a velocidade de processamento.
      Comece pelo Pulverizador, porque é sempre ele o gargalo. Instale o aumento no slot da máquina que você quiser acelerar. Se a receita parecer estranha, o NEI (R/U) confirma. Seu fluxo de produção vai agradecer, Herói!
    tasks:
      - get: ThermalExpansion:augment:128
    rewards:
      - xp: 2
      - item: ore:ingotBronze x4

  - id: aumento_secundario_1
    title: "Saída Secundária I"
    type: normal
    deps: [aula_aumentos, bronze]
    icon: ThermalExpansion:augment:112
    desc: |
      Mais subprodutos, mais lucro! Faça a §ePeneira Secundária§r com bronze + lã. Ela aumenta a chance de subprodutos (cinábrio, enxofre, platina...) nas máquinas que os produzem.
      Para minérios raros, isso é dinheiro no bolso. Instale nas máquinas que processam minérios, como o Pulverizador. Se travar na receita, aperte R no NEI. Mais recompensas pelo mesmo trabalho, Herói!
    tasks:
      - get: ThermalExpansion:augment:112
    rewards:
      - xp: 2
      - item: minecraft:wool x4

  - id: aumento_eficiencia_1
    title: "Eficiência de Dínamo I"
    type: normal
    deps: [aula_aumentos]
    icon: ThermalExpansion:augment:64
    desc: |
      "Otimização de Ligação de Flux... quer dizer, o nível I"! Misture chumbo + Bobina Transmissora + redstone.
      Ganhe +10% de energia por unidade de combustível (até +85% com os três níveis). Para quem queima coisa cara, como Pyrotheum, é um ótimo investimento. Instale no dínamo escolhido. Se travar, confira o NEI (R/U). Energia que dura mais é energia que rende, Herói!
    tasks:
      - get: ThermalExpansion:augment:64
    rewards:
      - xp: 2
      - item: ore:ingotLead x4

  - id: aumento_saida_1
    title: "Potência de Dínamo I"
    type: normal
    deps: [aula_aumentos]
    icon: ThermalExpansion:augment:80
    desc: |
      Mais energia agora! Misture cobre + Bobina Transmissora + redstone para criar a Potência de Dínamo I.
      O dínamo produz §e×2§r de RF/t, mas consome combustível na mesma proporção e perde 15% de eficiência. Velocidade custa caro, mas às vezes você precisa dela. Instale no dínamo e comece a produzir. A receita está no NEI (R/U), caso precise. Boa geração, Herói!
    tasks:
      - get: ThermalExpansion:augment:80
    rewards:
      - xp: 2
      - item: ore:ingotCopper x4

  - id: aumento_nulificador
    title: "Câmara de Nulificação"
    type: optional
    deps: [aula_aumentos]
    icon: ThermalExpansion:augment:144
    desc: |
      Chega de máquina travada! Prata, Invar, redstone e um balde de lava formam este aumento, que §edestrói o excesso de produtos secundários§r.
      Nunca mais uma máquina travada porque o slot de serragem encheu. É opcional, mas poupa muita dor de cabeça. Se precisar relembrar a receita, aperte R no NEI. Menos limpeza, mais produção, Herói!
    tasks:
      - get: ThermalExpansion:augment:144
    rewards:
      - loot: comum

  - id: aumento_culinaria
    title: "Especialização Culinária"
    type: optional
    deps: [aula_aumentos]
    icon: ThermalExpansion:augment:256
    desc: |
      Hora de abrir o restaurante! Este aumento é só para a Fornalha de Redstone: ela passa a §esó cozinhar comida§r, gastando 50% menos energia e rendendo mais comida.
      Um restaurante industrial! É opcional, mas ótimo se você tem fazendas grandes e quer assar tudo de uma vez. Confira a receita no NEI (R/U). Bom apetite, Herói!
    tasks:
      - get: ThermalExpansion:augment:256
    rewards:
      - loot: comum

  - id: aumento_extrusor_1
    title: "Extrusão Acelerada"
    type: optional
    deps: [aula_aumentos, extrusor]
    icon: ThermalExpansion:augment:312
    desc: |
      Pedra em abundância! Esse aumento é só para o Extrusor Ígneo: ele produz rocha em lotes maiores (até 16 pedregulhos por operação no nível I) e gasta menos água.
      Os níveis II e III levam o lote a 32 e 64. É opcional, mas ótimo se você usa muita pedra. Confira a receita no NEI (R/U). Seu estoque de pedregulho nunca mais vai acabar, Herói!
    tasks:
      - get: ThermalExpansion:augment:312
    rewards:
      - loot: comum

  - id: aumento_dinamo_dutos
    title: "Aumentos de Dínamo Especiais"
    type: optional
    deps: [aula_aumentos]
    icon: ThermalExpansion:augment:49
    desc: |
      Dois aumentos curiosos para dínamos:
      §e• Bobina de Transmissão para Dutos§r — deixa inserir e retirar combustível pelo lado da
      bobina.
      §e• Limitador de Campo de Excitação§r — o dínamo pode descer a produção até 0 RF/t
      quando a rede está cheia (exige o controle de redstone, que já vem embutido aqui).
    tasks:
      - one_of: [ThermalExpansion:augment:48, ThermalExpansion:augment:49]
    rewards:
      - loot: comum

  - id: celula_endurecida
    title: "Célula de Energia Endurecida"
    type: main
    deps: [estrutura_endurecida, celula_leadstone]
    icon: ThermalExpansion:Cell:2
    desc: |
      Energia em grande estilo! Atualize a Célula de Leadstone com §e4 Invar§r (ou faça direto com a Estrutura de Célula Endurecida).
      São §e2 000 000 RF§r de capacidade e §e800 RF/t§r de entrada/saída. A energia guardada vai junto na atualização, então nada se perde. Se tiver dúvida, aperte R no NEI. Sua rede de energia acaba de dar um salto, Herói!
    tasks:
      - get: ThermalExpansion:Cell:2
    rewards:
      - xp: 4
      - choice: [ore:ingotInvar x4, minecraft:redstone_block x4, ore:ingotLead x6]

  - id: tanque_endurecido
    title: "Tanque Endurecido"
    type: normal
    deps: [tanque_portatil, estrutura_endurecida]
    icon: ThermalExpansion:Tank:2
    desc: |
      Lava para a semana inteira! Junte um Tanque Portátil + 4 Invar e ganhe um tanque de §e32 000 mB§r.
      É a mesma ideia do tanque básico, só que bem maior. Se quiser conferir a receita, aperte R no NEI. Guarde água, lava ou o que for preciso e leve com você. Mais líquido no bolso, Herói!
    tasks:
      - get: ThermalExpansion:Tank:2
    rewards:
      - xp: 2
      - item: ore:ingotInvar x2

  - id: caixa_endurecida
