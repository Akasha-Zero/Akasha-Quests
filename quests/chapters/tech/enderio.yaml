  - id: equipamento_estelar
    title: "Ferramentas Estelares"
    type: normal
    deps: [liga_estelar, sentient_ender, haste_aco_negro]
    icon: EnderIO:item.stellar_pickaxe
    desc: |
      Liga Estelar, Haste de Aço Negro e um §eSentient Ender§r em cada uma: §eStellar Pick§r, §eStellar Axe§r e §eThe Ender MKIV§r. São as ferramentas mais poderosas do Ender IO, com a maior durabilidade e dano.
      Faça a picareta, Herói! Receitas no NEI (R/U). Junte os materiais com paciência e confira as receitas no NEI (R/U).
    tasks:
      - get: EnderIO:item.stellar_pickaxe
    rewards:
      - xp: 5
      - item: ore:ingotStellarAlloy x2

  - id: armadura_estelar
    title: "Armadura Estelar"
    type: milestone
    deps: [liga_estelar, sentient_ender, armadura_end_steel]
    icon: EnderIO:item.stellar_chestplate
    banner: "A Armadura Estelar"
    subtitle: "Feita de estrelas do Nether"
    desc: |
      Cada peça leva Liga Estelar e um §eSentient Ender§r no lugar do diodo. Quatro peças =
      quatro Sentient Enders, quatro bruxas capturadas e muitas estrelas do Nether.

      Herói... você vestiu uma constelação. É a melhor armadura que o Volume das Ligas sabe
      fazer, e ela aceita todos os upgrades da armadura negra. Eu fico até sem palavras (e isso
      é raríssimo, você sabe).

      Mostre as quatro peças Estelares!
    tasks:
      - get: [EnderIO:item.stellar_helmet, EnderIO:item.stellar_chestplate, EnderIO:item.stellar_leggings, EnderIO:item.stellar_boots]
    rewards:
      - xp: 12
      - kit: {name: "Relíquias Estelares", items: [ore:ingotStellarAlloy x4, minecraft:nether_star, EnderIO:itemBasicCapacitor:4, minecraft:experience_bottle x64]}
      - loot: epico

  # ======================================================================
  # MARCO FINAL
  # ======================================================================
  - id: mestre_ligas
    title: "Maestria das Ligas"
    type: milestone
    deps: [ligas_completas, rede_condutos, usina_ligas, mestre_almas, fabrica_autonoma, senhor_distancias, armadura_negra, capbank_vibrante]
    icon: EnderIO:itemYetaWrench
    banner: "Mestre das Ligas"
    subtitle: "O Volume das Ligas está completo"
    effect: 3
    desc: |
      Herói. Vem cá, senta um pouquinho.

      Você começou com pedregulho e gravetos — uma engrenagem tão simples que ninguém daria nada
      por ela. Depois vieram o Moinho SAG, a Fundidora e as oito ligas. Vieram os condutos que
      cabem num bloco só, o Tonel borbulhando Combustível para Foguetes, as almas engarrafadas
      (com todo o respeito), o Cristal do Fim, o Cajado, o Telepad. E agora você caminha de
      armadura negra, com asas, sem medo de nada.

      §bO Volume das Ligas está reescrito.§r Ele vai sustentar muitos outros: os condutos levam
      os gases do Mekanism, os bancos guardam a energia dos reatores, o Telepad encurta as
      viagens até os Reinos Perdidos.

      E se ainda sobrar fome de ligas, as §eestrelas§r estão esperando: Liga Estelar e a Armadura
      Estelar. Obrigada por consertar mais esta página do meu livro.
    tasks:
      - get: [EnderIO:blockCapBank:3, EnderIO:blockTelePad, EnderIO:blockSoulBinder, EnderIO:item.darkSteel_chestplate]
    rewards:
      - xp: 12
      - kit: {name: "Legado do Mestre das Ligas", items: [EnderIO:itemBasicCapacitor:2 x2, EnderIO:itemMaterial:8 x2, ore:ingotVibrantAlloy x16, EnderIO:itemPowerConduit:2 x16, EnderIO:blockTravelAnchor x4]}
      - loot: [epico]
      - command: "/effect @p 1 1200 1"
