      É uma missão opcional, Herói, mas dá um charme especial à sua base. Monte com calma e, se esquecer o desenho da receita, confira o NEI (R/U). Estilo espacial garantido!
    tasks:
      - get: GalacticraftAmunRa:tile.baseBlockRock:13
    rewards:
      - loot: comum

