    icon: GalacticraftAmunRa:item.baseItem:22
    desc: |
      Lítio e urânio numa malha só (confira a receita no NEI). É o coração da Nuclear Battery.

      Junte os dois materiais, Herói, e monte com calma. Cuidado com o urânio, porque ele é radioativo. Se esquecer o desenho, o NEI (R/U) e o manual do Galacticraft mostram o caminho. Vamos construir uma bateria que se recarrega sozinha!
    tasks:
      - get: GalacticraftAmunRa:item.baseItem:22
    rewards:
      - xp: 4
      - item: ore:ingotUranium x2

  - id: bateria_nuclear
    title: "Nuclear Battery"
    type: normal
    deps: [malha_uranio, wafer_ender]
    icon: GalacticraftAmunRa:item.battery-nuclear
    desc: |
      Ingredientes: 5 Alumínios Prensados, Uranium-Lithium Mesh e Ender Wafer. Ela guarda pouca energia, mas §ese recarrega sozinha§r com o decaimento do urânio.

      É ingrediente do Multi-Sensor e do Disruptor de Gravidade. Monte com calma, Herói, e confira o NEI (R/U) se precisar rever o desenho. Energia eterna a caminho!
    tasks:
