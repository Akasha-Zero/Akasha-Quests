    desc: |
      Ingredientes: 5 Alumínios Prensados, Lithium Mesh e Ender Wafer. Resultado: uma bateria com 240 000 gJ.

      É uma missão opcional, Herói, mas uma ótima forma de guardar bastante energia para armas e ferramentas. Monte com calma e, se esquecer o desenho da receita, confira o NEI (R/U). Energia sobrando é energia bem-vinda!
    tasks:
