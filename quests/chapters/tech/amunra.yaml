    rewards:
      - xp: 8
      - choice: [GalacticraftCore:item.bucketFuel x6, ore:compressedTitanium x8, GalacticraftCore:item.engine:1 x2]

  - id: propulsor_ionico
    title: "Ion Thruster"
    type: main
    deps: [nave_mae, ouro_prensado, transformador]
    deps_hidden: [galacticraft:nucleo_feixe]
    icon: GalacticraftAmunRa:tile.machines2:1
    desc: |
      O motor elétrico:
      §e• Ion Thruster Jet:§r 6 Titânios Prensados, um Núcleo de Feixe e Gold Foil.
      §e• Ion Thruster Base:§r 5 Titânios Prensados, um Transformer, 2 Núcleos de Feixe e Gold Foil.
      Em vez de combustível, ele usa §eenergia§r e §eNitrogênio Líquido§r como refrigerante (config).
      O Condensador de Marte produz nitrogênio líquido.
    tasks:
      - get: [GalacticraftAmunRa:tile.machines2:1, GalacticraftAmunRa:tile.msBoosters1:1 x3]
    rewards:
      - xp: 8
      - choice: [GalacticraftAmunRa:item.baseItem:20 x2, ore:compressedTitanium x8, GalacticraftAmunRa:item.baseItem:21 x2]

  - id: combustivel_nave
    title: "Tanques da Nave"
    type: normal
    deps: [motor_foguete_nave]
    icon: GalacticraftCore:item.bucketFuel
    desc: |
      Motores de foguete de nave-mãe queimam muito §ecombustível§r, e quanto mais pesada a nave, mais.

      Guarde §e16 baldes§r de combustível (do Galacticraft ou do BuildCraft) antes da primeira viagem, Herói. Ficar sem combustível no espaço é a pior das surpresas! Se precisar rever a produção, confira o NEI (R/U).
    tasks:
      - one_of: [GalacticraftCore:item.bucketFuel x16, BuildCraft|Energy:bucketFuel x16]
    rewards:
      - xp: 4
      - item: minecraft:bucket x8

  - id: nitrogenio_ionico
    title: "Refrigerante Iônico"
    type: normal
    deps: [propulsor_ionico]
    deps_hidden: [galacticraft:condensador]
    icon: GalacticraftMars:item.canisterPartialLN2:1
    desc: |
      Os Propulsores Iônicos usam §eNitrogênio Líquido§r como refrigerante (config do pack). O Condensador do Galacticraft liquefaz o nitrogênio: encha uma lata.

      Faça com calma, Herói, e guarde a lata para os propulsores. Se tiver dúvida sobre o processo, confira o NEI (R/U) e o manual do Galacticraft. Mais um passo rumo ao espaço!
    tasks:
      - get: GalacticraftMars:item.canisterPartialLN2:1
    rewards:
      - xp: 4
      - item: GalacticraftCore:item.oilCanisterPartial:1001 x2

  - id: motores_maiores
    title: "Mais Empuxo"
    type: optional
    deps: [motor_foguete_nave]
    icon: GalacticraftAmunRa:tile.msBoosters1
    task_logic: OR
    desc: |
      Empuxo insuficiente? Cada Base a mais na fileira deixa o motor maior. Junte §e8 bases§r de qualquer tipo para uma nave grande de verdade.

      É uma missão opcional, Herói, mas faz diferença para quem quer voar longe. Se esquecer o desenho da receita, confira o NEI (R/U) e o manual do Galacticraft. Boa construção!
    tasks:
      - get: GalacticraftAmunRa:tile.msBoosters1 x8
      - get: GalacticraftAmunRa:tile.msBoosters1:1 x8
    rewards:
      - loot: raro

  - id: balanca
    title: "Block Scale"
    type: optional
    deps: [nave_mae]
    icon: GalacticraftAmunRa:tile.machines3
    desc: |
      Coloque um bloco em cima da §eBlock Scale§r e ela mostra a massa dele. Ajuda a construir naves leves (que voam mais rápido e gastam menos).

      Missão opcional, Herói, mas bem útil para quem quer otimizar a nave-mãe. Monte com calma e, se esquecer o desenho, o NEI (R/U) mostra a receita certinha. Pesos e medidas a seu favor!
    tasks:
      - get: GalacticraftAmunRa:tile.machines3
    rewards:
      - loot: comum

  - id: gravidade_artificial
    title: "Artificial Gravity Generator"
    type: normal
    deps: [nave_mae, materia_escura, transformador]
    deps_hidden: [galacticraft:nucleo_feixe]
    icon: GalacticraftAmunRa:tile.machines3:1
    desc: |
      Ingredientes: Titânio Prensado, Núcleo de Feixe, Dark Matter Shard, Transformer e Ender Wafer. Ele cria uma força para baixo (ou para cima!) numa área configurável. O gasto de energia depende do volume e da força.

      Adeus, flutuar pela nave-mãe! Monte com calma, Herói, e confira o NEI (R/U).
    tasks:
      - get: GalacticraftAmunRa:tile.machines3:1
    rewards:
      - xp: 5
      - item: GalacticraftAmunRa:item.baseItem:26 x2

  - id: disruptor_gravidade
    title: "Artificial Gravity Disruptor"
    type: optional
    deps: [gravidade_artificial, bateria_nuclear]
    icon: GalacticraftAmunRa:item.baseItem:30
    desc: |
      Ligado, ele impede que os Geradores de Gravidade Artificial afetem você. É para quando você quer flutuar de propósito.

      Missão opcional, Herói, mas muito divertida. Monte com calma e, se esquecer o desenho da receita, confira o NEI (R/U) e o manual do Galacticraft. Flutue à vontade, só não esqueça de desligar quando precisar pisar firme!
    tasks:
      - get: GalacticraftAmunRa:item.baseItem:30
    rewards:
      - loot: incomum

  - id: primeira_viagem
    title: "Primeira Viagem da Nave-Mãe"
    type: milestone
    deps: [motor_foguete_nave, propulsor_ionico]
    deps_any: true
    icon: GalacticraftAmunRa:tile.machines2:1
    banner: "Motores Ligados"
    subtitle: "A nave-mãe zarpou"
    desc: |
      Motores montados, combustível (ou nitrogênio e energia) carregado, destino escolhido no
      Console... "Launch!". A nave inteira, com você e a sua base, atravessa o espaço até o novo
      corpo celeste.

      §aDicas:§r o Console mostra empuxo e combustível necessários antes de você confirmar; se o
      empuxo for insuficiente, adicione bases aos motores ou alivie a nave. A config permite que a
      nave-mãe alcance corpos até o Nível 10 — ou seja, quase todo o mapa.

      Confirme quando completar a primeira viagem.
    tasks:
      - check
    rewards:
      - xp: 12
      - kit: {name: "Kit do Navegador de Naves-Mãe", items: [GalacticraftCore:item.bucketFuel x8, ore:compressedTitanium x8, GalacticraftAmunRa:tile.msBoosters1 x2]}
      - loot: epico

  - id: mestre_amunra
    title: "Senhor do Sol Duplo"
    type: milestone
    deps: [farao, primeira_viagem, multiferramenta, mehen, anubis]
    icon: GalacticraftAmunRa:item.itemShuttle
    banner: "O Volume do Sol Duplo"
    subtitle: "Amun-Ra está escrito"
    desc: |
      O Faraó foragido derrotado, o shuttle no hangar, uma nave-mãe cruzando as estrelas e o
      Multitool de nanitas na mão. Herói, o Volume do Sol Duplo está completo!

      O Faraó de Amun-Ra é o último guardião do §5Selo das Estrelas§r. Junte-o aos chefes da Lua, de
      Marte e aos sete do ExtraPlanets e o céu inteiro vai brilhar no Registro. Os Faraós de Atum vão
      ficar sabendo... e eu acho que eles vão ficar com um pouquinho de ciúme.
    tasks:
      - get: [GalacticraftAmunRa:item.nanotool, GalacticraftAmunRa:item.itemShuttle:*]
    rewards:
      - xp: 15
      - loot: lendario
