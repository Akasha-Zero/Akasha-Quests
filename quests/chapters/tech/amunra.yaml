  - id: naves_mae_info
    title: "Como Funciona uma Nave-Mãe"
    type: info
    deps: [sistema_amunra]
    icon: GalacticraftAmunRa:tile.machines1:2
    desc: |
      Uma §eNave-Mãe§r é uma estação espacial que §evoa§r. Você constrói, ela orbita um corpo celeste
      e, com motores, viaja até outro — levando a sua base junto.

      §e• Criação:§r no Mapa da Galáxia, ao selecionar um corpo onde ela pode ser criada, aparece
      "A Mothership can be built here!". Precisa ter no inventário §e64 Estanhos Prensados, 16
      Alumínios Prensados, 24 lingotes de ferro e 1 Mothership Navigation Console§r. Não há limite de
      naves por jogador (config).
      §e• Motores:§r uma fileira de Bases com um Jato numa ponta. Mais bases = motor maior.
      §e• Massa:§r cada bloco tem massa; mais massa exige mais empuxo e mais combustível. A §eBlock
      Scale§r mostra a massa do bloco em cima dela.
      §e• Viagem:§r o Console escolhe o destino e mostra distância, tempo, empuxo e combustível. A
      config limita viagens longas demais.
      §cCuidado:§r cair da borda de uma nave-mãe é morte certa, e ficar atrás de um motor ligado
      também.
    tasks:
      - check
    rewards:
      - xp: 3

