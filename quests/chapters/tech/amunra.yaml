    banner: "O Volume do Sol Duplo"
    subtitle: "Amun-Ra está escrito"
    desc: |
      O Faraó foragido derrotado, o shuttle no hangar, uma nave-mãe cruzando as estrelas e o
      Multitool de nanitas na mão. Herói, o Volume do Sol Duplo está completo!

      O Faraó de Amun-Ra é o último guardião do §5Selo das Estrelas§r. Junte-o aos chefes da Lua, de
      Marte e aos sete do ExtraPlanets e o céu inteiro vai brilhar no Registro. Os Faraós de Atum vão
      ficar sabendo... e eu acho que eles vão ficar com um pouquinho de ciúme.
    tasks:
