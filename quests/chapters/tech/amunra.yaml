    rewards:
      - loot: incomum

  - id: malha_litio
    title: "Lithium Mesh"
    type: normal
    deps: [saque_piramide]
    icon: GalacticraftAmunRa:item.baseItem:8
    desc: |
      O §eSpodumene§r (lítio) das pirâmides vira §eLithium Mesh§r. Veja a receita no NEI. Ela faz a §eLithium Battery§r, o Advanced Radioisotope Generator e o Nanite Control Module.

      Junte o Spodumene e monte a malha, Herói. Se precisar de ajuda, confira o NEI (R/U) e o manual do Galacticraft. Passo a passo, a tecnologia vem!
