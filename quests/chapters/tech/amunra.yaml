    rewards:
      - loot: incomum

  # ======================================================================
  # FASE 7 — AS NAVES-MÃE
  # ======================================================================
  - id: naves_mae_info
    title: "Como Funciona uma Nave-Mãe"
    type: info
    deps: [sistema_amunra]
    icon: GalacticraftAmunRa:tile.machines1:2
    desc: |
      Uma §eNave-Mãe§r é uma estação espacial que §evoa§r. Você constrói, ela orbita um corpo celeste
      e, com motores, viaja até outro — levando a sua base junto.

      §e• Criação:§r no Mapa da Galáxia, ao selecionar um corpo onde ela pode ser criada, aparece
      "A Mothership can be built here!". Precisa ter no inventário §e64 Estanhos Prensados, 16
      Alumínios Prensados, 24 lingotes de ferro e 1 Mothership Navigation Console§r. Não há limite de
      naves por jogador (config).
      §e• Motores:§r uma fileira de Bases com um Jato numa ponta. Mais bases = motor maior.
      §e• Massa:§r cada bloco tem massa; mais massa exige mais empuxo e mais combustível. A §eBlock
      Scale§r mostra a massa do bloco em cima dela.
      §e• Viagem:§r o Console escolhe o destino e mostra distância, tempo, empuxo e combustível. A
      config limita viagens longas demais.
      §cCuidado:§r cair da borda de uma nave-mãe é morte certa, e ficar atrás de um motor ligado
      também.
    tasks:
      - check
    rewards:
      - xp: 3

  - id: console_navegacao
    title: "Mothership Navigation Console"
    type: main
    deps: [naves_mae_info, wafer_ender]
    deps_hidden: [galacticraft:unidade_orion]
    icon: GalacticraftAmunRa:tile.machines1:2
    desc: |
      Ingredientes: 5 Titânios Prensados, um Ender Wafer, um Módulo de Frequência, um Painel de Vidro e uma §eUnidade Orion§r (aquela que leva um minério de cada tipo!).

      É o volante da nave-mãe e também um ingrediente da criação dela. Monte com calma, Herói, e confira o NEI (R/U) se esquecer o desenho.
    tasks:
      - get: GalacticraftAmunRa:tile.machines1:2
    rewards:
      - xp: 8
      - choice: [ore:compressedTitanium x6, ore:compressedTin x16, ore:compressedAluminum x8]

  - id: materiais_nave_mae
    title: "Materiais da Nave-Mãe"
    type: main
    deps: [console_navegacao]
    icon: GalacticraftAmunRa:tile.baseBlockRock:12
    desc: |
      Tudo no inventário: §e64 Estanhos Prensados, 16 Alumínios Prensados, 24 lingotes de ferro e o Mothership Navigation Console§r.

      Reúna tudo antes de tentar criar a nave-mãe, Herói. É bastante material, então vá juntando aos poucos e confira a lista de vez em quando. Se esquecer algum item, o NEI (R/U) e o manual do Galacticraft ajudam. Falta pouco para conquistar o espaço!
    tasks:
      - get: [ore:compressedTin x64, ore:compressedAluminum x16, minecraft:iron_ingot x24, GalacticraftAmunRa:tile.machines1:2]
    rewards:
      - xp: 6
      - choice: [ore:compressedTitanium x8, GalacticraftCore:item.bucketFuel x4, GalacticraftCore:tile.sealer]

  - id: nave_mae
    title: "A Nave-Mãe"
    type: milestone
    deps: [materiais_nave_mae]
    icon: GalacticraftAmunRa:tile.baseBlockRock:12
    banner: "Uma Casa que Voa"
    subtitle: "A primeira nave-mãe do Registro"
    desc: |
      Lance um foguete, abra o Mapa da Galáxia, escolha o corpo e crie a nave-mãe. Você chega numa
      plataforma de §eMothership Base Blocks§r flutuando no espaço — o casco da sua futura cidade
      voadora.

      §ePrimeiros passos a bordo:§r sele uma área com oxigênio, instale a Hydroponics Unit para ar
      renovável, coloque o Console de Navegação e o §eMothership Configuration Terminal§r (nome,
      ícone no mapa e permissões de pouso e de uso).

      Confirme aqui quando a nave existir.
    tasks:
      - check
    rewards:
      - xp: 12
      - kit: {name: "Kit do Capitão", items: [GalacticraftAmunRa:tile.machines4:1 x2, GalacticraftCore:tile.sealer, GalacticraftAmunRa:tile.steelChest x2, GalacticraftCore:item.oxygenTankHeavyFull x2]}
      - loot: epico

  - id: terminal_configuracao
    title: "Mothership Configuration Terminal"
    type: normal
    deps: [console_navegacao]
    icon: GalacticraftAmunRa:tile.machines1:3
    desc: |
      Ingredientes: Titânio Prensado, Ender Wafer, Módulo de Frequência, Painel de Vidro e uma Alavanca. Ele muda o nome e o ícone da nave no mapa e define quem pode pousar nela e usar seus blocos (dono, todos, lista branca ou negra).

      Monte com calma, Herói, e confira o NEI (R/U) se esquecer o desenho.
    tasks:
      - get: GalacticraftAmunRa:tile.machines1:3
    rewards:
      - xp: 4
      - item: ore:compressedTitanium x4

  - id: motor_foguete_nave
    title: "Rocket Engine"
    type: main
    deps: [nave_mae]
    deps_hidden: [galacticraft:motor_pesado]
    icon: GalacticraftAmunRa:tile.machines2
    desc: |
      O motor químico das naves-mãe:
      §e• Rocket Engine Jet:§r 4 Titânios Prensados, um Motor de Foguete Pesado e um Motor Auxiliar.
      §e• Rocket Engine Base:§r 6 Titânios Prensados, 2 Motores Auxiliares e uma Lata de Estanho.
      Coloque uma fileira de Bases e o Jato numa ponta. Ele queima §ecombustível de foguete§r
      (o mesmo "fuel" da Refinaria). Faça um jato e pelo menos 3 bases.
